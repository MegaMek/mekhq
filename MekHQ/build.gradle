import java.time.LocalDateTime
import java.util.jar.JarFile
import java.util.zip.ZipFile

plugins {
    id 'application'
    id 'com.palantir.git-version' version '5.0.0'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id "io.sentry.jvm.gradle" version '6.4.0'
    id 'jacoco'
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.1'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = true
    reproducibleFileOrder = true
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['resources']
        }
    }
    test {
        java {
            srcDirs = ['unittests']
        }
        resources {
            srcDirs = ['testresources']
        }
    }
}

def suiteVersion = rootProject.findProperty('suiteReleaseVersion')?.toString()
def hqVersion = rootProject.findProperty('suiteMekHQVersion')?.toString() ?: suiteVersion
def gameVersionExpected = rootProject.findProperty('suiteMegaMekVersion')?.toString() ?: suiteVersion
def labVersion = rootProject.findProperty('suiteMegaMekLabVersion')?.toString() ?: suiteVersion
def suitePins = [
        megamek   : ['suiteMegaMekCommit', new File(rootDir, '../megamek')],
        megameklab: ['suiteMegaMekLabCommit', new File(rootDir, '../megameklab')],
        mekhq     : ['suiteMekHQCommit', rootDir],
        mmData    : ['suiteMmDataCommit', new File(rootDir, '../mm-data')]
]
def suiteRecord = {
    def result = [schemaVersion: '1', product: 'MekHQ', version: hqVersion,
                  megamekVersion: gameVersionExpected, megameklabVersion: labVersion]
    suitePins.each { key, spec -> result[key.toString() + 'Commit'] = rootProject.findProperty(spec[0])?.toString() }
    result.minimumJavaVersion = '21'
    result
}
def checkSuitePins = {
    suitePins.each { key, spec ->
        def expected = rootProject.findProperty(spec[0])?.toString()
        if (!(expected ==~ /[0-9a-f]{40}/)) {
            throw new GradleException("${spec[0]} must be a lowercase 40-hex commit in suite mode")
        }
        def repo = spec[1].canonicalFile
        def git = { File checkout, List<String> args ->
            def builder = new ProcessBuilder(['git', '-C', checkout.absolutePath] + args)
                    .redirectErrorStream(true)
            // Gradle's composite process can inherit incomplete command-line Git
            // config (GIT_CONFIG_COUNT/KEY_n/VALUE_n). Do not pass it to child Git:
            // a missing value makes even rev-parse fail before pin checks run.
            builder.environment().keySet().removeIf { name ->
                name ==~ /(?i)GIT_CONFIG_(?:COUNT|KEY_[0-9]+|VALUE_[0-9]+)/
            }
            def process = builder.start()
            def output = process.inputStream.getText('UTF-8').trim()
            if (process.waitFor() != 0) {
                throw new GradleException("Cannot inspect ${checkout}: ${output}")
            }
            output
        }
        if (new File(git(repo, ['rev-parse', '--show-toplevel'])).canonicalFile != repo) {
            throw new GradleException("${spec[0]} must point to its own sibling checkout: ${repo}")
        }
        if (git(repo, ['rev-parse', 'HEAD']) != expected) {
            throw new GradleException("${key} HEAD does not match ${spec[0]}=${expected}")
        }
        // Ignore untracked and ignored build artifacts; never ignore modifications to tracked inputs.
        if (git(repo, ['status', '--porcelain=v1', '--untracked-files=no'])) {
            throw new GradleException("${key} has modified tracked files; suite archives require clean pinned inputs")
        }
        // Git status ignores both ignored data mirrors and untracked source files.
        // Permit only byte-identical mirrors of tracked mm-data inputs.
        def scopes = key == 'mmData' ? ['data', 'src']
                : key == 'megamek' ? ['megamek/src', 'megamek/resources', 'megamek/data',
                                     'megamek/docs', 'megamek/mmconf', 'megamek/scripts', 'megamek/userdata',
                                     ':(top,glob)megamek/*.ini', 'megamek/SubmitBug.html',
                                     'megamek/sentry.properties']
                : key == 'megameklab' ? ['megameklab/src', 'megameklab/resources',
                                         'megameklab/data', 'megameklab/docs', 'megameklab/mmconf',
                                         'megameklab/scripts', ':(top,glob)megameklab/*.ini',
                                         'megameklab/SubmitBug.html', 'megameklab/sentry.properties']
                : ['MekHQ/src', 'MekHQ/resources', 'MekHQ/data', 'MekHQ/docs',
                   'MekHQ/mmconf', 'MekHQ/scripts', 'MekHQ/campaigns', 'MekHQ/userdata',
                   ':(top,glob)MekHQ/*.ini', 'MekHQ/SubmitBug.html', 'MekHQ/sentry.properties']
        def dataRepo = new File(rootDir, '../mm-data')
        def trackedData = git(dataRepo.canonicalFile, ['ls-files', '-z', '--cached', '--', 'data'])
                .split('\u0000').toList().toSet()
        def untracked = git(repo, ['ls-files', '-z', '--others', '--exclude-standard', '--'] + scopes)
                .split('\u0000')
        def ignored = git(repo, ['ls-files', '-z', '--others', '--ignored', '--exclude-standard', '--'] + scopes)
                .split('\u0000')
        def unknown = (untracked.toList() + ignored.toList()).unique()
        unknown.each { path ->
            if (!path) {
                return
            }
            def relative = path.replaceFirst(/^(?:megamek|megameklab|MekHQ)\//, '')
            if (relative.startsWith('userdata/')
                    || relative ==~ /mmconf\/(?:clientsettings\.xml|gameoptions\.xml|(?:mm|mml|mhq)\.preferences|megameklab\.properties(?:\.bak)?|recent-advanced-searches\.json|recent_boards\.yml|searches\/[^\/]+\.json)/
                    || relative in ['docs/OfficialUnitList.txt', 'docs/mm-revision.txt',
                                    'docs/mml-revision.txt', 'docs/mhq-revision.txt',
                                    'MegaMek.l4j.ini', 'MegaMekLab.l4j.ini', 'MekHQ.l4j.ini',
                                    'data/mekfiles/unit_files.zip', 'data/rat/rat_default.zip',
                                    'data/mekfiles/units.cache',
                                    'data/universe/planetary_systems/canon_systems.zip',
                                    'data/universe/planetary_systems/connector_systems.zip']) {
                return // excluded private settings or known derived outputs
            }
            def mirror = path =~ /^(?:megamek\/|megameklab\/|MekHQ\/)data\/(.+)$/
            def source = mirror.matches() ? "data/${mirror.group(1)}".toString() : null
            if (source?.startsWith('data/images/force/Units/') && !trackedData.contains(source)) {
                source = source.replace('data/images/force/Units/', 'data/images/universe/factions/')
            }
            File local = new File(repo, path)
            File canonical = source == null ? null : new File(dataRepo, source)
            if (source == null || !trackedData.contains(source) || !canonical.isFile()
                    || !java.util.Arrays.equals(local.bytes, canonical.bytes)) {
                throw new GradleException("Unpinned package input in ${repo}: ${path}")
            }
        }
    }
}
def assertSuiteRecord = { Properties actual, String label, String product ->
    def expected = product == 'MekHQ' ? suiteRecord() : [
            schemaVersion: '1', product: product,
            version: product == 'MegaMek' ? gameVersionExpected : labVersion,
            megamekCommit: rootProject.property('suiteMegaMekCommit').toString(),
            mmDataCommit: rootProject.property('suiteMmDataCommit').toString(),
            minimumJavaVersion: '21']
    if (product == 'MegaMekLab') {
        expected.megameklabCommit = rootProject.property('suiteMegaMekLabCommit').toString()
        expected.megamekVersion = gameVersionExpected
    }
    def fields = product == 'MekHQ' ? expected.keySet()
            : expected.keySet() + ['megameklabCommit', 'mekhqCommit']
    // Lab already requires its own commit; its only unrelated pin is MekHQ.
    if (product == 'MegaMekLab') {
        fields = expected.keySet() + ['mekhqCommit']
    }
    if (actual.stringPropertyNames() != (fields as Set)) {
        throw new GradleException("${label}: suite identity has missing or unexpected fields")
    }
    expected.each { key, value ->
        if (actual.getProperty(key) != value) {
            throw new GradleException("${label}: ${key} must be ${value}, got ${actual.getProperty(key)}")
        }
    }
}
def reusedCompanionJar = { String product ->
    new File(layout.buildDirectory.get().asFile, "suite/companions/${product}.jar")
}
def companionJar = { String product ->
    def reused = rootProject.findProperty(product == 'MegaMek'
            ? 'suiteMegaMekArchiveFile' : 'suiteMegaMekLabArchiveFile')
    reused != null ? reusedCompanionJar(product) : new File(product == 'MegaMek' ? mmDir : mmlDir,
            "${product == 'MegaMek' ? 'megamek' : 'megameklab'}/build/libs/${product}.jar")
}
def readSuiteArchive = { File archive, String product ->
    if (!archive.isFile()) {
        throw new GradleException("Missing ${product} suite archive: ${archive}")
    }
    String root = "${product}-${product == 'MegaMek' ? gameVersionExpected : labVersion}"
    if (archive.name != "${root}.tar.gz") {
        throw new GradleException("${archive}: archive name does not match ${product}'s own version")
    }
    def recordFiles = []
    def jars = [:]
    tarTree(resources.gzip(archive)).visit { entry ->
        String path = entry.path.replace('\\', '/')
        if (path != root && !path.startsWith("${root}/")) {
            throw new GradleException("${archive}: unexpected archive root ${path}")
        }
        if (!entry.directory) {
            if (path == "${root}/suite-build.properties") {
                def props = new Properties()
                entry.file.withInputStream { props.load(it) }
                recordFiles.add(props)
            }
            if (path == "${root}/${product}.jar" || path == "${root}/lib/${product}.jar") {
                if (jars.containsKey(path)) {
                    throw new GradleException("${archive}: duplicate ${path}")
                }
                new JarFile(entry.file).withCloseable { bundled ->
                    if (product == 'MegaMek') {
                        def versionEntry = bundled.getJarEntry('Version.properties')
                        if (versionEntry == null) {
                            throw new GradleException("${archive}: MegaMek.jar lacks Version.properties")
                        }
                        def version = new Properties()
                        bundled.getInputStream(versionEntry).withCloseable { version.load(it) }
                        if ([version.getProperty('major'), version.getProperty('minor'),
                             version.getProperty('patch')].join('.') != gameVersionExpected
                                || version.getProperty('revision')?.trim()) {
                            throw new GradleException("${archive}: wrong MegaMek.jar runtime version")
                        }
                    } else if (bundled.manifest?.mainAttributes?.getValue('Implementation-Version') != labVersion) {
                        throw new GradleException("${archive}: wrong MegaMekLab.jar product version")
                    }
                }
                // Build-Date makes a newly built jar byte-unstable; compare the two archived copies
                // and package the archived jar itself when reusing a product release.
                jars[path] = java.security.MessageDigest.getInstance('SHA-256').digest(entry.file.bytes)
                if (!project.hasProperty('suiteArchiveFile') && path == "${root}/${product}.jar" &&
                        rootProject.hasProperty(product == 'MegaMek'
                                ? 'suiteMegaMekArchiveFile' : 'suiteMegaMekLabArchiveFile')) {
                    def destination = reusedCompanionJar(product)
                    destination.parentFile.mkdirs()
                    java.nio.file.Files.copy(entry.file.toPath(), destination.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
    if (recordFiles.size() != 1) {
        throw new GradleException("${archive}: missing ${root}/suite-build.properties")
    }
    assertSuiteRecord(recordFiles[0], archive.name, product)
    if (!jars.containsKey(root + '/' + product + '.jar') ||
            !jars.containsKey(root + '/lib/' + product + '.jar') ||
            !java.util.Arrays.equals(jars[root + '/' + product + '.jar'],
                    jars[root + '/lib/' + product + '.jar'])) {
        throw new GradleException("${archive}: missing ${product} launcher jar")
    }
}

if (suiteVersion != null) {
    // Fail before stageFiles or an included build can modify tracked inputs.
    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(tasks.named('distTar').get())) {
            checkSuitePins()
        }
    }
    tasks.register('writeSuiteRecord') {
        def output = layout.buildDirectory.file('suite/suite-build.properties')
        outputs.file(output)
        inputs.properties(suiteRecord())
        doLast {
            def file = output.get().asFile
            file.parentFile.mkdirs()
            file.setText(suiteRecord().collect { key, value -> "${key}=${value}\n" }.join(''), 'UTF-8')
        }
    }
    tasks.register('verifySuiteInputs') {
        description = 'Checks included product identities after the distTar task-graph pin preflight.'
        group = 'verification'
        if (!project.hasProperty('suiteMegaMekArchiveFile')) {
            dependsOn gradle.includedBuild('megamek').task(':megamek:assembleDist')
        }
        if (!project.hasProperty('suiteMegaMekLabArchiveFile')) {
            dependsOn gradle.includedBuild('megameklab').task(':megameklab:assembleDist')
        }
        doLast {
            [['MegaMek', mmDir, 'megamek'], ['MegaMekLab', mmlDir, 'megameklab']].each { product, dir, module ->
                def reused = project.findProperty(product == 'MegaMek'
                        ? 'suiteMegaMekArchiveFile' : 'suiteMegaMekLabArchiveFile')
                def archive = reused != null ? project.file(reused) : new File(dir,
                        "${module}/build/distributions/${product}-${product == 'MegaMek' ? gameVersionExpected : labVersion}.tar.gz")
                readSuiteArchive(archive, product)
            }
            def mmJar = companionJar('MegaMek')
            if (!mmJar.isFile()) {
                throw new GradleException("Missing included MegaMek jar: ${mmJar}")
            }
            new ZipFile(mmJar).withCloseable { zip ->
                def entry = zip.getEntry('Version.properties')
                if (entry == null) {
                    throw new GradleException('Included MegaMek jar lacks Version.properties')
                }
                def props = new Properties()
                zip.getInputStream(entry).withCloseable { props.load(it) }
                def actual = [props.getProperty('major'), props.getProperty('minor'), props.getProperty('patch')].join('.')
                if (props.getProperty('revision')?.trim() || actual != gameVersionExpected) {
                    throw new GradleException("Included MegaMek jar version ${actual} does not match ${gameVersionExpected}")
                }
            }
        }
    }
    tasks.register('verifySuiteMekHQArchive') {
        description = 'Checks the suite archive layout, dependencies, data, and embedded identity.'
        group = 'verification'
        if (!project.hasProperty('suiteArchiveFile')) {
            dependsOn tasks.named('distTar')
        }
        doLast {
            def archive = project.hasProperty('suiteArchiveFile')
                    ? project.file(project.property('suiteArchiveFile'))
                    : tasks.named('distTar').get().archiveFile.get().asFile
            if (!archive.isFile() || archive.name != "MekHQ-${hqVersion}.tar.gz") {
                throw new GradleException("Missing or incorrectly named MekHQ suite archive: ${archive}")
            }
            ['MegaMek', 'MegaMekLab'].each { product ->
                def reused = project.findProperty(product == 'MegaMek'
                        ? 'suiteMegaMekArchiveFile' : 'suiteMegaMekLabArchiveFile')
                if (reused != null) {
                    readSuiteArchive(project.file(reused), product)
                }
            }
            String root = "MekHQ-${hqVersion}/"
            def paths = [] as Set
            def records = []
            def jarDigests = [:]
            def forbidden = ['clientsettings.xml', 'gameoptions.xml', 'recent-advanced-searches.json',
                             'recent_boards.yml',
                             'megameklab.properties',
                             'megameklab.properties.bak', 'mhq.preferences', 'mm.preferences',
                             'mml.preferences']
            tarTree(resources.gzip(archive)).visit { entry ->
                String path = entry.path.replace('\\', '/')
                if (path != root[0..-2] && !path.startsWith(root)) {
                    throw new GradleException("Wrong suite archive root: ${path}")
                }
                if (!entry.directory) {
                    if (!paths.add(path) || forbidden.contains(path.substring(path.lastIndexOf('/') + 1))
                            || path.startsWith(root + 'userdata/')
                            || path.endsWith('.cache') || path.startsWith(root + 'mmconf/searches/')) {
                        throw new GradleException("Duplicate or protected user data in archive: ${path}")
                    }
                    if (path == root + 'suite-build.properties') {
                        def props = new Properties()
                        entry.file.withInputStream { props.load(it) }
                        records.add(props)
                    }
                    if (['MegaMek.jar', 'MegaMekLab.jar', 'MekHQ.jar'].contains(path.substring(path.lastIndexOf('/') + 1))) {
                        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(entry.file.bytes)
                        jarDigests[path] = digest
                        if (!project.hasProperty('suiteArchiveFile')) {
                            def source = path.endsWith('MegaMek.jar') ? companionJar('MegaMek')
                                    : path.endsWith('MegaMekLab.jar') ? companionJar('MegaMekLab')
                                    : tasks.named('jar').get().archiveFile.get().asFile
                            if (!source.isFile() || !java.util.Arrays.equals(digest,
                                    java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes))) {
                                throw new GradleException("Bundled jar differs from built product: ${path}")
                            }
                        }
                        new JarFile(entry.file).withCloseable { bundled ->
                            if (path.endsWith('MegaMek.jar')) {
                                def versionEntry = bundled.getJarEntry('Version.properties')
                                if (versionEntry == null) {
                                    throw new GradleException("Missing runtime version in ${path}")
                                }
                                def version = new Properties()
                                bundled.getInputStream(versionEntry).withCloseable { version.load(it) }
                                if ([version.getProperty('major'), version.getProperty('minor'),
                                     version.getProperty('patch')].join('.') != gameVersionExpected
                                        || version.getProperty('revision')?.trim()) {
                                    throw new GradleException("Wrong runtime version in ${path}")
                                }
                            } else if (bundled.manifest?.mainAttributes?.getValue('Implementation-Version') !=
                                    (path.endsWith('MegaMekLab.jar') ? labVersion : hqVersion)) {
                                throw new GradleException("Wrong product version in ${path}")
                            }
                        }
                    }
                }
            }
            if (records.size() != 1 || records[0].size() != suiteRecord().size()) {
                throw new GradleException('Missing or unexpected MekHQ suite identity')
            }
            ['MegaMek.jar', 'MegaMekLab.jar', 'MekHQ.jar'].each { name ->
                if (!java.util.Arrays.equals(jarDigests[root + name], jarDigests[root + 'lib/' + name])) {
                    throw new GradleException("Launcher and lib jars disagree: ${name}")
                }
            }
            assertSuiteRecord(records[0], archive.name, 'MekHQ')
            if (!['MekHQ.jar', 'MegaMek.jar', 'MegaMekLab.jar'].every {
                paths.contains(root + it) && paths.contains(root + 'lib/' + it)
            } || !['MekHQ.sh', 'MegaMek.sh', 'MegaMekLab.sh', 'bin/MekHQ'].every {
                paths.contains(root + it)
            } || !paths.any { it.startsWith(root + 'data/boards/') }
                    || !paths.any { it.startsWith(root + 'data/mekfiles/') }
                    || !paths.contains(root + 'data/images/imgFileAtlasMap.yml')) {
                throw new GradleException('Suite archive is missing launcher, product jars, or bundled data/atlases')
            }
        }
    }
    tasks.named('jar') {
        manifest.attributes('Implementation-Version': hqVersion)
    }
}

ext {
    mhqJvmOptions = [
            '-Xmx4096m',
            '--add-opens',
            'java.base/java.util=ALL-UNNAMED',
            '--add-opens',
            'java.base/java.util.concurrent=ALL-UNNAMED',
            '-Dsun.awt.disablegrab=true'
    ]

    fileStagingDir = "${layout.buildDirectory.get()}/files"
    atlasedImages = "${fileStagingDir}/atlasedImages.txt"
    scriptsDir = "${projectDir}/scripts"

    mmDir = "${rootDir}/../megamek"
    mmlDir = "${rootDir}/../megameklab"
}

dependencies {
    implementation "org.megamek:megamek:${version}"
    implementation("org.megamek:megameklab:${version}") {
        // We don't need the python and javascript engine taking up space
        exclude group: 'org.python', module: 'jython'
        exclude group: 'org.mozilla', module: 'rhino'

        // Eclipse IDE Multiple Dependency errors.
        exclude group: 'xml-apis'
    }

    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    implementation 'javax.vecmath:vecmath:1.5.2'

    implementation 'joda-time:joda-time:2.14.1'
    implementation 'org.joda:joda-money:2.0.3'

    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    // Future migration reference for commons-math3 replacement:
    // https://mvnrepository.com/artifact/org.apache.commons/commons-math4-core
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'

    implementation 'org.apache.pdfbox:pdfbox:3.0.7'

    implementation 'org.commonmark:commonmark:0.28.0'

    implementation 'org.jfree:jfreechart:1.5.6'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.4'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.2'

    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime:4.0.7'

    // Required for mml printing scaled vector graphics (SVG) - Eclipse IDE Compatibility.
    runtimeOnly 'xml-apis:xml-apis-ext:1.3.04'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

application {
    mainClass = 'mekhq.MekHQ'
    applicationDefaultJvmArgs = [
            '-Xmx4096m',
            '--add-opens',
            'java.base/java.util=ALL-UNNAMED',
            '--add-opens',
            'java.base/java.util.concurrent=ALL-UNNAMED',
            '-Dsun.awt.disablegrab=true'
    ]
}

// Forward mekhq.* system properties set on the Gradle daemon (e.g. via IDEA Run Config "VM options",
// or `gradlew -Dmekhq.foo=bar :MekHQ:run`) into the forked application JVM. Without this, daemon-level
// -D flags never reach the running MekHQ process. Used for dev-gated feature flags such as
// mekhq.companyGenerator.ruleset.
tasks.named('run', JavaExec) {
    System.getProperties().findAll { k, v -> k.toString().startsWith('mekhq.') && v != null }
            .each { k, v -> systemProperty k.toString(), v.toString() }
}


jar {
    archiveFileName = "MekHQ.jar"

    manifest {
        attributes "Main-Class": application.mainClass
        attributes "Class-Path": "MegaMek.jar MegaMekLab.jar " + (project.sourceSets.main.runtimeClasspath.files
                .findAll { it.name.endsWith(".jar") && !it.name.toLowerCase().startsWith("megamek") }
                .collect { "lib/${it.name}" }.join(' '))
        attributes "Add-Opens": 'java.base/java.util java.base/java.util.concurrent'
        attributes "Build-Date": LocalDateTime.now()
        attributes "Sealed": true
    }
}

checkstyle {
    toolVersion = '13.4.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    configProperties = [
            'suppressionFile': file("${rootDir}/config/checkstyle/checkstyle-suppressions.xml")
    ]
    maxErrors = 0    // Fail on any error
}

tasks.withType(Checkstyle).configureEach {
    minHeapSize = "1g"
    maxHeapSize = "4g"
}

// Source hygiene checks that do not depend on which editor wrote the code: import order, unused imports, trailing
// whitespace, final newline. `./gradlew spotlessCheck` reports every violation in one run; `./gradlew spotlessApply`
// fixes them all. The Checkstyle workflow runs the check as its first step on every PR. Same setup as MegaMek.
//
// Deliberately no full formatter engine yet. The Java style in .editorconfig uses a 6-space continuation indent and
// IntelliJ's wrapping rules, which the Eclipse engine Spotless bundles cannot reproduce; enabling it would reformat
// most of the tree and then fight IntelliJ on every wrapped line. Choosing an engine is a separate decision.
spotless {
    // Checked explicitly by CI rather than as part of `build`, so a plain build stays fast and works in a shallow
    // checkout that has no origin/main to ratchet against.
    enforceCheck = false

    // Until the whole tree has been formatted once, only look at files that differ from origin/main. Pass
    // -PspotlessFullTree to format everything (used for the one-time reformat and to measure it).
    if (!project.hasProperty('spotlessFullTree')) {
        ratchetFrom 'origin/main'
    }

    java {
        target 'src/**/*.java', 'unittests/**/*.java'

        // Matches ij_java_imports_layout in .editorconfig: static imports, then java/javax, then everything else.
        importOrder('\\#', 'java|javax', '')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()

        // Same fence .editorconfig configures for IntelliJ.
        toggleOffOn('@formatter:off', '@formatter:on')
    }
}

// Data is staged directly out of mm-data/data (no intermediate staging copy) and split
// into several Sync tasks by how often the content changes. The large, rarely-edited
// binary trees (images, boards, fonts) each own a disjoint subtree of data/, so editing
// loose data (units, scenarios, universe) only re-copies the small text payload and
// leaves ~800 MB of assets untouched (UP-TO-DATE). stageDataFiles aggregates them.
// Derived from rootDir (the mekhq build root) rather than a build-file-relative path,
// so it survives project-layout changes. mm-data is a sibling of this build root
// (settings.gradle includes it as ../mm-data).
def mmDataDir = "${rootDir}/../mm-data"
def mhqDataDir = "${layout.projectDirectory.asFile}/data"

// Never stage macOS/Windows directory-metadata junk, regardless of what a developer's
// file browser may have dropped into the source tree.
tasks.withType(Sync).configureEach {
    exclude "**/.DS_Store"
    exclude "**/Thumbs.db"
}

tasks.register('stageDataImages', Sync) {
    description = "Syncs image data from mm-data"
    group = 'build'
    from "${mmDataDir}/data/images"
    // Mirror faction logos into images/force/Units so MekHQ's force-icon code can resolve
    // them under data/images/force/ without duplicating the files in the source tree.
    from("${mmDataDir}/data/images/universe/factions") {
        into "force/Units"
    }
    into "${mhqDataDir}/images"
}

tasks.register('stageDataBoards', Sync) {
    description = "Syncs board data from mm-data"
    group = 'build'
    from "${mmDataDir}/data/boards"
    into "${mhqDataDir}/boards"
}

tasks.register('stageDataFonts', Sync) {
    description = "Syncs font data from mm-data"
    group = 'build'
    from "${mmDataDir}/data/fonts"
    into "${mhqDataDir}/fonts"
}

tasks.register('stageDataMekfiles', Sync) {
    dependsOn gradle.includedBuild('mm-data').task(':unitFilesZip')
    description = "Syncs unit files (loose text plus the zipped unit archive) from mm-data"
    group = 'build'
    from("${mmDataDir}/data/mekfiles") {
        include "*.txt"
        include "*.xml"
    }
    from "${mmDataDir}/build/staging/mekfiles"
    into "${mhqDataDir}/mekfiles"
}

tasks.register('stageDataRat', Sync) {
    dependsOn gradle.includedBuild('mm-data').task(':ratZip')
    description = "Syncs the random assignment table archive from mm-data"
    group = 'build'
    from "${mmDataDir}/build/staging/rat"
    into "${mhqDataDir}/rat"
}

tasks.register('stageData', Sync) {
    dependsOn gradle.includedBuild('mm-data').task(':canonSystemZip')
    dependsOn gradle.includedBuild('mm-data').task(':connectorSystemZip')
    description = "Syncs all remaining loose data from mm-data"
    group = 'build'
    from("${mmDataDir}/data") {
        // A bare directory name in exclude() prunes that whole subtree during the source
        // scan — no trailing "/**" is needed (verified: the loose canon_systems/ dir and
        // the image/board/font trees are not re-copied here). Those subtrees therefore
        // stay owned by the dedicated Sync tasks above.
        exclude "images"
        exclude "boards"
        exclude "fonts"
        exclude "mekfiles"
        exclude "rat"
        exclude "universe/planetary_systems/canon_systems"
        exclude "universe/planetary_systems/connector_systems"
        include "**/*.*"
    }
    // Zipped planetary systems substitute for the loose canon/connector directories.
    from("${mmDataDir}/build/staging/universe/planetary_systems") {
        into "universe/planetary_systems"
    }
    into mhqDataDir
    // The big asset trees are owned by the dedicated tasks above; don't delete them.
    preserve {
        include "images/**"
        include "boards/**"
        include "fonts/**"
        include "mekfiles/**"
        include "rat/**"
    }
}

tasks.register('stageDataFiles') {
    description = "Aggregates the split Sync tasks that stage MekHQ's data/ directory from mm-data."
    group = 'build'
    dependsOn stageDataImages
    dependsOn stageDataBoards
    dependsOn stageDataFonts
    dependsOn stageDataMekfiles
    dependsOn stageDataRat
    dependsOn stageData
}

tasks.register('generateDynamicFiles') {
    def jvmOptions = project.ext.mhqJvmOptions.join('\n')

    doLast {
        new File("${projectDir}/docs/mhq-revision.txt").text = versionDetails().gitHashFull
        new File("${projectDir}/MekHQ.l4j.ini").text = """# Launch4j runtime config
# you can add arguments here that will be processed by the JVM at runtime
${jvmOptions}
"""
    }
}

tasks.register("stageLicenseFiles", Sync) {
    description = "Copy the license files to the build folder."
    group = 'build'
    from "../"
    into "${layout.buildDirectory.get()}/licenses"

    includes = [
            'LICENSE',
            'LICENSE.code',
            'LICENSE.assets',
            'README.md'
    ]

}

if (suiteVersion != null) {
    tasks.register('clearSuiteStage', Delete) {
        delete fileStagingDir
    }
}

tasks.register("copyLicenseFiles", Copy) {
    description = "Copies from the build folder to the staging folder"
    group = 'build'

    dependsOn stageLicenseFiles
    if (suiteVersion != null) {
        dependsOn tasks.named('clearSuiteStage')
    }

    from "${layout.buildDirectory.get()}/licenses"
    into fileStagingDir
}

tasks.register('createImageAtlases', JavaExec) {
    if (suiteVersion != null) {
        dependsOn tasks.named('clearSuiteStage')
    }
    mustRunAfter(stageDataFiles)
    description = 'Combines individual image files into a set of image atlases.'
    group = 'utility'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "megamek.utilities.CreateImageAtlases"
    workingDir = file(fileStagingDir)
}

tasks.register('deleteAtlasedImages') {
    dependsOn createImageAtlases
    description = 'Removes images from the staging directory that have been incorporated into atlases.'
    doLast {
        if (file(atlasedImages).exists()) {
            ant.delete dir: fileStagingDir, includesfile: atlasedImages
            ant.delete file: atlasedImages
        }
    }
}

tasks.register('validateSystems', JavaExec) {
    dependsOn jar
    dependsOn stageDataFiles
    description = 'Validates planetary system YAML data files for structural correctness and data integrity.'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mekhq.utilities.SystemValidator'
    args = ["${layout.projectDirectory.asFile}/data/universe/planetary_systems"]
}

tasks.register('officialUnitList', JavaExec) {
    dependsOn jar
    mustRunAfter(stageDataFiles)
    description = 'Compiles a list of all units that come from official sources and saves it in the docs folder.'
    group = 'utility'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'megamek.MegaMek'
    args = ['-oul', "${projectDir}/docs/OfficialUnitList.txt"]
}

tasks.register(suiteVersion != null ? 'copySuiteFiles' : 'stageFiles', Copy) {
    description = 'Stages files that are to be copied into the distribution.'

    mustRunAfter(stageDataFiles)
    dependsOn officialUnitList
    if (suiteVersion == null) {
        dependsOn deleteAtlasedImages
    }

    dependsOn gradle.includedBuild('megamek').task(':megamek:generateDynamicFiles')
    dependsOn gradle.includedBuild('megameklab').task(':megameklab:generateDynamicFiles')
    dependsOn generateDynamicFiles
    dependsOn copyLicenseFiles
    if (suiteVersion != null) {
        dependsOn tasks.named('clearSuiteStage')
    }

    from projectDir
    include "campaigns/The Learning Ropes.cpnx.gz"
    include "data/**"
    include "docs/**"
    include "mmconf/**"
    include "userdata"
    include "userdata/data/universe/"
    include 'SubmitBug.html'
    include "sentry.properties"
    include "*.ini"

    // User Config Files
    exclude "mmconf/clientsettings.xml"
    exclude "mmconf/gameoptions.xml"
    exclude "mmconf/megameklab.properties"
    exclude "mmconf/megameklab.properties.bak"
    exclude "mmconf/mhq.preferences"
    exclude "mmconf/mm.preferences"
    exclude "mmconf/mml.preferences"
    exclude "mmconf/recent-advanced-searches.json"
    exclude "mmconf/recent_boards.yml"
    exclude "mmconf/searches/*.json"
    if (suiteVersion != null) {
        exclude "userdata/**"
    }

    exclude("data/**/*.cache")

    into fileStagingDir

    doLast {
        mkdir "${fileStagingDir}/logs"
        mkdir "${fileStagingDir}/userdata/data/campaignPresets/"
    }
}

if (suiteVersion != null) {
    tasks.named('createImageAtlases') {
        dependsOn tasks.named('copySuiteFiles')
    }
    tasks.register('stageFiles') {
        dependsOn tasks.named('copySuiteFiles')
        dependsOn deleteAtlasedImages
    }
}

tasks.register('createStartScripts', CreateStartScripts) {
    description = 'Create shell script for generic distribution.'

    applicationName = 'MekHQ'
    mainClass = application.mainClass
    outputDir = startScripts.outputDir
    classpath = jar.outputs.files + files(project.sourceSets.main.runtimeClasspath.files)
            .filter { it.name.endsWith(".jar") }
}

distributions {
    main {
        distributionBaseName = 'MekHQ'
        contents {
            if (suiteVersion != null) {
                from(layout.buildDirectory.file('suite/suite-build.properties'))
            }
            // MegaMek Includes
            from("${mmDir}/megamek/build/scripts") {
                into "bin"
            }

            from("${mmDir}/megamek/scripts") {
                include "shell.sh"
                rename "shell.sh", "MegaMek.sh"
            }

            from("${mmDir}/megamek/docs") {
                rename 'history.txt', 'mm-history.txt'
                into 'docs'
            }

            from("${mmDir}/megamek/mmconf/log4j2.xml") {
                exclude 'log4j2.xml'
            }

            from("${mmDir}/megamek/mmconf/munitionLoadoutSettings.yaml") {
                into 'mmconf'
            }

            from("${mmDir}/megamek/build/launch4j/lib") {
                // In suite mode the verified companion jars (possibly reused from archives)
                // are authoritative; either launch4j/lib may contain newer builds of both.
                if (suiteVersion != null) {
                    exclude 'MegaMek.jar', 'MegaMekLab.jar'
                }
                into "lib"
            }

            from("${mmDir}/megamek/build/launch4j") {
                include '*.exe'
            }

            from(suiteVersion != null ? companionJar('MegaMek') : "${mmDir}/megamek/build/libs/MegaMek.jar") {
                into "lib"
            }

            from(suiteVersion != null ? companionJar('MegaMek') : "${mmDir}/megamek/build/libs/MegaMek.jar")
            from("${mmDir}/megamek/") {
                include '*.ini'
            }

            // MegaMekLab Includes
            from("${mmlDir}/megameklab/build/launch4j/lib") {
                if (suiteVersion != null) {
                    exclude 'MegaMek.jar', 'MegaMekLab.jar'
                }
                into "lib"
            }

            from("${mmlDir}/megameklab/build/scripts") {
                into "bin"
            }

            from("${mmlDir}/megameklab/scripts") {
                include "shell.sh"
                rename "shell.sh", "MegaMekLab.sh"
            }

            from("${mmlDir}/megameklab/docs") {
                rename 'history.txt', 'mml-history.txt'
                into "docs"
            }

            from("${mmlDir}/megameklab/mmconf/log4j2.xml") {
                exclude 'log4j2.xml'
            }

            from("${mmlDir}/megameklab/build/launch4j") {
                include '*.exe'
            }

            from(suiteVersion != null ? companionJar('MegaMekLab') : "${mmlDir}/megameklab/build/libs/MegaMekLab.jar") {
                into "lib"
            }

            from(suiteVersion != null ? companionJar('MegaMekLab') : "${mmlDir}/megameklab/build/libs/MegaMekLab.jar")

            from("${mmlDir}/megameklab/") {
                include '*.ini'
            }

            // MekHQ Includes
            from("docs/history.txt") {
                rename 'history.txt', 'mhq-history.txt'
                into 'docs'
            }

            from(fileStagingDir) {
                exclude 'history.txt'
            }

            from("${projectDir}/scripts") {
                include 'shell.sh'
                rename 'shell.sh', 'MekHQ.sh'
            }

            from("${buildDir}/launch4j") {
                include '*.exe'
            }

            from(project.sourceSets.main.runtimeClasspath.files
                    .findAll { it.name.endsWith(".jar") && !it.name.toLowerCase().startsWith("megamek") }) {
                into "lib"
            }

            from(jar) {
                into "lib"
            }

            from(jar)

            if (suiteVersion != null) {
                // The application plugin also contributes runtimeClasspath to lib via
                // its own main-distribution CopySpec. It can contain a freshly built
                // companion jar before our explicit copies; duplicatesStrategy alone
                // would then retain the wrong jar. Filter by source, not just name,
                // so the validated companion copies survive and all other runtime
                // dependencies remain available.
                eachFile { details ->
                    if (details.path ==~ /(?:[^\/]+\/)?lib\/(?:MegaMek|MegaMekLab)\.jar/) {
                        def product = details.name.substring(0, details.name.length() - '.jar'.length())
                        if (details.file.canonicalFile != companionJar(product).canonicalFile) {
                            details.exclude()
                        }
                    }
                }
            }

            duplicatesStrategy = 'exclude'
        }
    }
}

launch4j {
    description = 'Create Windows executable for MekHQ'
    mainClassName = application.mainClass
    icon = "${projectDir}/data/images/misc/mekhq.ico"
    outfile = "MekHQ.exe"
    jarTask = project.tasks.jar
    windowTitle = 'MekHQ'
    internalName = 'MekHQ'
    downloadUrl = 'https://github.com/MegaMek/megamek/wiki/Updating-to-Adoptium-(Eclipse-Temurin-Open-Source-Java)'
    supportUrl = 'https://megamek.org'
    copyright = '2026 MegaMek Development Team.'
    trademarks = 'MechWarrior, BattleMech, `Mech and AeroTech - The The Topps Company, Inc. Catalyst Game Labs - InMediaRes Productions, LLC.'
    companyName = "MegaMek Development Team"
    jreMinVersion = '21'
    dontWrapJar = true
    messagesJreVersionError = 'We require a Java Runtime of version 21 or higher installed. https://github.' +
            'com/MegaMek/megamek/wiki/Updating-to-Adoptium-(Eclipse-Temurin-Open-Source-Java)'
    messagesJreNotFoundError = 'Go here for instructions on installing the correct version of Java: https://github.com/MegaMek/megamek/wiki/Updating-to-Adoptium-(Eclipse-Temurin-Open-Source-Java)'
}

project.tasks.createExe.dependsOn(stageDataFiles)
project.tasks.createExe.mustRunAfter(stageDataFiles)

tasks.register("packagePrepWork") {
    description = 'General Catch All for all distributions'
    dependsOn jar
    dependsOn stageFiles
    dependsOn startScripts
    dependsOn createStartScripts
    dependsOn createAllExecutables

    dependsOn gradle.includedBuild('megamek').task(':megamek:startScripts')
    dependsOn gradle.includedBuild('megameklab').task(':megameklab:startScripts')

    dependsOn gradle.includedBuild('megamek').task(':megamek:createStartScripts')
    dependsOn gradle.includedBuild('megameklab').task(':megameklab:createStartScripts')

    dependsOn gradle.includedBuild('megamek').task(':megamek:createAllExecutables')
    dependsOn gradle.includedBuild('megameklab').task(':megameklab:createAllExecutables')
}

distTar {
    description = 'Creates distribution packaged as a GZipped tar ball'
    dependsOn packagePrepWork
    archiveExtension = 'tar.gz'
    compression = Compression.GZIP
    if (suiteVersion != null) {
        dependsOn tasks.named('verifySuiteInputs')
        dependsOn tasks.named('writeSuiteRecord')
        exclude '**/mmconf/clientsettings.xml', '**/mmconf/gameoptions.xml',
                '**/mmconf/megameklab.properties', '**/mmconf/megameklab.properties.bak',
                '**/mmconf/mhq.preferences', '**/mmconf/mm.preferences',
                '**/mmconf/mml.preferences', '**/mmconf/recent-advanced-searches.json',
                '**/mmconf/recent_boards.yml',
                '**/mmconf/searches/*.json', '**/data/**/*.cache'
    }
}

distZip {
    description = 'Creates distribution packaged as a ZIP File'
    enabled = false
    dependsOn packagePrepWork
}

assemble {
    dependsOn jar
}

assembleDist {
    description = 'Build unix, Windows, and source packages'
    group = 'distribution'
    dependsOn stageFiles
    dependsOn distTar
}

tasks.register("buildAllPackages", Copy) {
    dependsOn gradle.includedBuild('megamek').task(':megamek:assembleDist')
    dependsOn gradle.includedBuild('megameklab').task(':megameklab:assembleDist')
    dependsOn assembleDist
    group = "distribution"

    into layout.buildDirectory.dir("distributions")
    from("${mmDir}/megamek/build/distributions") {
        include "*.tar.gz"
    }
    from("${mmlDir}/megameklab/build/distributions") {
        include "*.tar.gz"
    }
}

tasks.register("cleanAll") {
    description = "Cleans all build projects to ensure a clean slate"
    group = "build"
    dependsOn gradle.includedBuild('mm-data').task(':clean')
    dependsOn gradle.includedBuild('megamek').task(':megamek:clean')
    dependsOn gradle.includedBuild('megameklab').task(':megameklab:clean')
    dependsOn clean
}

tasks.register("testAll") {
    description = "Cleans all build projects to ensure a clean slate then runs all tests"
    group = "verification"
    dependsOn cleanAll

    dependsOn gradle.includedBuild('megamek').task(':megamek:test')
    dependsOn gradle.includedBuild('megameklab').task(':megameklab:test')
    dependsOn test
}

run {
    dependsOn(stageDataFiles)
    jvmArgs = mhqJvmOptions
}

test {
    useJUnitPlatform()
    dependsOn(checkstyleMain)
    // Some tests read the shipped data set - rank systems, factions, formation naming - which lives
    // in mm-data and is copied into place by stageDataFiles. Without this the data is present locally
    // only if someone happened to stage it, and absent on CI, so such a test passes on a developer
    // machine and fails in the pipeline.
    dependsOn(stageDataFiles)

    minHeapSize = "1024m"
    maxHeapSize = "8192m"
    jvmArgs = ["-XX:MaxMetaspaceSize=1024m"]

    testLogging {
        events "failed"
        exceptionFormat = "full"
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = true
    }

    // report is always generated after tests run
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    // tests are required to run before generating the report
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
