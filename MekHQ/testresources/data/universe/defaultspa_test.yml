  # Misc SPA

  - lookupName: admin_interstellar_negotiator
    displayName: Interstellar Negotiator (Unofficial)
    desc: |-
      No matter who's in charge, this character always has a way of bringing down the price.

      If this character is the senior-most Admin character, the cost of interstellar travel is reduced by 15%
    xpCost: 100
    weight: 1
    skillPrereqs:
      - Administration: Veteran

  - lookupName: admin_networker
    displayName: Networker (Unofficial)
    desc: |-
      This character knows people in high places.

      If this character is the senior-most Admin character, the number of contracts offered each month is increased by 1 (may still be 0).
    xpCost: 400
    weight: 1
    skillPrereqs:
      - Administration: Elite

  - lookupName: admin_tetris_master
    displayName: Tetris Master (Unofficial)
    desc: |-
      This character has mastered the subtle art of stacking cargo boxes.

      The campaign's cargo capacity is increased by 5% per character with this SPA.
    xpCost: 100
    weight: 1
    skillPrereqs:
      - Administration: Regular

  - lookupName: admin_coordinator
    displayName: Coordinator (Unofficial)
    desc: |-
      This character is exceptionally skilled at liaising with allied forces, ensuring reinforcements arrive where they're needed.

      If this character is the senior Admin character, the reinforcement target number is reduced by 1.
    xpCost: 100
    weight: 1
    skillPrereqs:
      - Administration: Veteran

  - lookupName: admin_logistician
    displayName: Logistician (Unofficial)
    desc: |-
      This character is an expert at managing interstellar supply lines.

      Parts procured by this character have their delivery time reduced by 10%
    xpCost: 50
    weight: 1
    skillPrereqs:
      - Administration: Veteran

  - lookupName: admin_mediator
    displayName: Mediator (Unofficial)
    desc: |-
      Whether with a smoothing word or a calming presence, this character knows how to solve disputes.

      This character's Administration skill is increased by 1 when calculating the campaign's Admin Capacity.
    xpCost: 50
    weight: 1
    skillPrereqs:
      - Administration: Regular

  - lookupName: admin_scrounge
    displayName: Scrounge (Unofficial)
    desc: |-
      The character is adept at finding resources in places nobody else would think to look.

      They can make one additional procurement attempt per day.
    xpCost: 200
    weight: 1
    skillPrereqs:
      - Administration: Elite

  - lookupName: atow_alternate_id
    displayName: Alternate ID (ATOW)
    desc: |-
      A low Reputation trait infers a penalty to Negotiation, Streetwise, and Protocols skill checks. While ranks in the Bloodmark trait cause the character to be hunted by assassins.

      This SPA reduces the penalty from low Reputation by 2 and reduces the chance of an assassination attempt occurring by half. It also decreases the chance of a Dark Secret SPA being revealed.

      While this SPA does exist in ATOW (and that's where you'll find its description), these effects are unique to MekHQ.
    xpCost: 200
    weight: 1

  - lookupName: atow_citizenship
    displayName: Citizenship/Trueborn (ATOW)
    desc: |-
      Unlocks additional options during character creation.

      Increases Connections by 1.

      While this SPA does exist in ATOW, the Connections modifier is unique to MekHQ. We use that to abstract the kinds of bonuses this SPA would incur in a tabletop game.
    xpCost: 200
    weight: 1

