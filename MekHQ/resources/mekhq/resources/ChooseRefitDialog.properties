btnOrderParts.tooltip=Order the missing parts one by one, without starting the refit. The unit stays in service while they arrive, and you are told when everything is here. Each part has its own purchase roll, with no refit kit surcharge. You will see the list before anything is ordered.
btnOrderParts.labelOrders.tooltip=Everything this refit needs is already on order or on its way. Click to mark those orders for this refit, so you are told when they arrive and the Hangar shows the unit as Pending Refit.
btnRefit.tooltip=Begin the refit now. Parts in the warehouse are used, and everything else is bought as one refit kit: a single purchase roll against the Kit TN, for 10% more than the parts (Campaign Operations p.212). The unit is out of service from now until the refit is done, including while the kit is on its way.
btnCustomize.tooltip=Begin the refit now. Parts in the warehouse are used, and everything else is bought part by part, each with its own purchase roll and no refit kit surcharge. The unit is out of service from now until the refit is done, including while parts are on their way.
btnClose.tooltip=Close without ordering anything or starting a refit. Parts ordered earlier stay on order.
