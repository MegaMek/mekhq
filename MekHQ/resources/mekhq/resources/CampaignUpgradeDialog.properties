CampaignUpgradeConsole.guide.eyebrow=Campaign Upgrade
CampaignUpgradeConsole.guide.title=Upgrading a campaign
CampaignUpgradeConsole.guide.step.1.title=Back up
CampaignUpgradeConsole.guide.step.1.text=One click copies your save next to the original, named after the version it came from. It appears in the list of campaigns to load.
CampaignUpgradeConsole.guide.step.2.title=Choose a path
CampaignUpgradeConsole.guide.step.2.text=Apply a preset, keep your settings, or review everything in Campaign Options.
CampaignUpgradeConsole.guide.step.3.title=Continue
CampaignUpgradeConsole.guide.step.3.text=Any system that needs setting up asks its question next. Then your campaign opens as usual.
CampaignUpgradeConsole.guide.presetsIntro=Each release retunes costs, pay, and difficulty, and that tuning ships inside the stock presets. Applying one replaces rules, not your units, people, money, or contracts.
CampaignUpgradeConsole.guide.preset.1.who=New or returning players
CampaignUpgradeConsole.guide.preset.1.text=New Players Start Here keeps most systems but turns off the harshest ones.
CampaignUpgradeConsole.guide.preset.2.who=Most players
CampaignUpgradeConsole.guide.preset.2.text=Veteran Experience is the full game, balanced for long StratCon campaigns.
CampaignUpgradeConsole.guide.preset.3.who=Want a real challenge
CampaignUpgradeConsole.guide.preset.3.text=Myndo Madness is the official hard mode.
CampaignUpgradeConsole.guide.preset.4.who=Just want to fight
CampaignUpgradeConsole.guide.preset.4.text=Arcade Mode drops the simulation and roleplay systems.
CampaignUpgradeConsole.guide.preset.5.who=Tuned your own rules
CampaignUpgradeConsole.guide.preset.5.text=Keep My Settings, or apply one of your own presets from the list.
CampaignUpgradeConsole.guide.question.1.name=Do I need to finish my contract first?
CampaignUpgradeConsole.guide.question.1.text=No. You can upgrade mid-contract, and you don't need to advance a day or reopen Campaign Options.
CampaignUpgradeConsole.guide.question.2.name=Can I change my mind later?
CampaignUpgradeConsole.guide.question.2.text=Yes. Campaign Options can load any preset at any time.
CampaignUpgradeConsole.guide.question.3.name=What if I quit here?
CampaignUpgradeConsole.guide.question.3.text=MekHQ closes and your save is left as it is. Loading it again brings you back to this screen.
CampaignUpgradeConsole.guide.question.4.name=Something broke after upgrading
CampaignUpgradeConsole.guide.question.4.text=Load your backup in the previous version, and please report the bug on the MekHQ GitHub. Your feedback helps us fix it.
