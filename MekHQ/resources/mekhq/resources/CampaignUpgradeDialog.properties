CampaignUpgradeConsole.guide.open=How upgrading works
CampaignUpgradeConsole.guide.close=Got it
CampaignUpgradeConsole.guide.alwaysOpen=Show every time I upgrade
CampaignUpgradeConsole.guide.tab.steps=Steps
