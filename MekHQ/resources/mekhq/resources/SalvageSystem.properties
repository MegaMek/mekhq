# suppress inspection "UnusedProperty" for the whole file
SalvageSystem.LEGACY.label=Legacy
SalvageSystem.LEGACY.tooltip=The original MekHQ salvage method. Salvage is claimed directly when resolving a \
  scenario; no salvage teams or techs need to be assigned.
SalvageSystem.CAM_OPS_STRICT.label=CamOps (Strict)
SalvageSystem.CAM_OPS_STRICT.tooltip=The Salvage rules found in Campaign Operations. Salvage formations and techs are \
  assigned before a scenario and recover the wrecks afterward. Removing parts from units in the field is not \
  currently supported.
SalvageSystem.CAM_OPS_REVISED.label=CamOps (Revised)
SalvageSystem.CAM_OPS_REVISED.tooltip=Campaign Operations salvage, with revisions by the MekHQ team. Salvage \
  formations may fight and then salvage, carrying units can take on several wrecks, and 'Meks without working hands \
  can still salvage using cargo space.
SalvageSystem.CHAOS_CAMPAIGN.label=Chaos Campaign
SalvageSystem.CHAOS_CAMPAIGN.tooltip=A simpler take on salvage. There are no salvage teams: every wreck is recovered \
  automatically. Your salvage rights set your share of each wreck's value, which is paid to you in cash, unless you \
  buy the unit by paying your employer their share.
SalvageSystem.MEKHQ.label=MekHQ
SalvageSystem.MEKHQ.tooltip=An expanded take on Campaign Operations salvage. Salvage teams must still recover each \
  wreck, but your salvage rights set your share of its value rather than capping what you may claim: your share is \
  paid to you in cash, unless you buy the unit by paying your employer their share. Salvage formations may also fight \
  and then salvage, and carrying units can take on several wrecks.
