# Resource bundle for the Command Generator pipeline (campaign-side strings).

# Starting cash: {0} is always the credited amount. The basis strings describe where the base cash came from
# ({0} the configured percentage, or the number of d6 rolled) and fill {1} of the plain and less-setup reports;
# {2} of the less-setup report is the setup costs deducted, and {1} of the loan report the loan amount.
CommandGenerator.startingCapital.reason=Command Startup Funding
CommandGenerator.startingCapital.basis.percent={0}% of its units'' value
CommandGenerator.startingCapital.basis.random={0}d6 million C-bills
CommandGenerator.startingCapital.report=The command has been founded with starting capital of {0} ({1}).
CommandGenerator.startingCapital.reportLessSetup=The command has been founded with starting capital of {0} ({1}, less {2} in setup costs).
CommandGenerator.startingCapital.reportMinimumFloat=The command has been founded with starting capital of {0}, its minimum starting float.
CommandGenerator.startingCapital.reportWithLoan=The command has been founded with starting capital of {0} and a loan totalling {1}.
