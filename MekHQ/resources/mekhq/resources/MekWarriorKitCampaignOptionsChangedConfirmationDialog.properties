MekWarriorKitCampaignOptionsChangedConfirmationDialog.description=<h1 style="text-align:center">MekWarrior Kits</h1>\
  You have just enabled <b>Require MekWarrior Kit to Deploy Meks</b> in a campaign that previously had it disabled.\
  <p>From now on, a Mek may not deploy to a scenario unless every crew member wears one of the three MekWarrior kits \
  (Basic, Advanced, or Clan).</p>\
  <p>Would you like to equip all of your MekWarriors with a MekWarrior kit now, so your force is not immediately \
  grounded? Clan forces are issued the Clan kit; all others the Basic kit.</p>
MekWarriorKitCampaignOptionsChangedConfirmationDialog.cancel=Decline
MekWarriorKitCampaignOptionsChangedConfirmationDialog.confirm=Accept
