# Template properties panel
TemplatePropertiesPanel.scenarioName.label=Scenario Name:
TemplatePropertiesPanel.scenarioName.tooltip=The template's name, shown when selecting and playing the scenario.
TemplatePropertiesPanel.shortBriefing.label=Short Briefing:
TemplatePropertiesPanel.shortBriefing.tooltip=A short briefing summarizing the scenario, shown to the player.
TemplatePropertiesPanel.detailedBriefing.label=Detailed Briefing:
TemplatePropertiesPanel.detailedBriefing.tooltip=The full briefing text shown to the player for this scenario.
TemplatePropertiesPanel.scenarioType.label=Scenario Type:
TemplatePropertiesPanel.scenarioType.tooltip=The StratCon scenario category (for example Convoy, Special, or a facility type). StratCon uses it to classify the scenario and drive related rules.
TemplatePropertiesPanel.battlefieldControl.label=Battlefield Control:
TemplatePropertiesPanel.battlefieldControl.tooltip=Who is treated as controlling the battlefield afterward: the Victor, always the Player, or always the Enemy. Affects post-battle handling such as salvage.
TemplatePropertiesPanel.hostileFacility.label=Hostile Facility
TemplatePropertiesPanel.hostileFacility.tooltip=Marks this template as a hostile-facility scenario; StratCon places an enemy facility for it.
TemplatePropertiesPanel.alliedFacility.label=Allied Facility
TemplatePropertiesPanel.alliedFacility.tooltip=Marks this template as an allied-facility scenario; StratCon places a friendly facility for it.
TemplatePropertiesPanel.suitedForAmbushes.label=Suited for Ambushes
TemplatePropertiesPanel.suitedForAmbushes.tooltip=Allow StratCon to use this template when generating an ambush scenario.
TemplatePropertiesPanel.suitedForBungledPatrols.label=Suited for Bungled Patrols
TemplatePropertiesPanel.suitedForBungledPatrols.tooltip=Allow StratCon to use this template when generating a bungled-patrol scenario.
# Map parameters panel
MapParametersPanel.title=Scenario Map Parameters:
MapParametersPanel.baseWidth.label=Base Width:
MapParametersPanel.baseWidth.tooltip=The map's base width in hexes, before scaling or extra map sheets. Ignored when "Use AtB Base Dimensions" is on.
MapParametersPanel.baseHeight.label=Base Height:
MapParametersPanel.baseHeight.tooltip=The map's base height in hexes, before scaling or extra map sheets. Ignored when "Use AtB Base Dimensions" is on.
MapParametersPanel.widthIncrement.label=Scaled Width Increment:
MapParametersPanel.widthIncrement.tooltip=Extra hexes added to the map's width for each lance the player deploys beyond the first.
MapParametersPanel.heightIncrement.label=Scaled Height Increment:
MapParametersPanel.heightIncrement.tooltip=Extra hexes added to the map's height for each lance the player deploys beyond the first.
MapParametersPanel.additionalMapSheetWide.label=Additional Map Sheets Wide:
MapParametersPanel.additionalMapSheetWide.tooltip=Extra map sheets added to the map's width beyond the base/scaled size.
MapParametersPanel.additionalMapSheetTall.label=Additional Map Sheets Tall:
MapParametersPanel.additionalMapSheetTall.tooltip=Extra map sheets added to the map's height beyond the base/scaled size.
MapParametersPanel.allowRotation.label=Allow 90 Degree Rotation:
MapParametersPanel.allowRotation.tooltip=Give the generated map a 50/50 chance of being rotated 90 degrees.
MapParametersPanel.useAtBSizing.label=Use AtB Base Dimensions:
MapParametersPanel.useAtBSizing.tooltip=Use the AtB Map Sizes table to determine the base width and height of the map.
MapParametersPanel.allowedMapTypes.label=Allowed Map Types:
MapParametersPanel.allowedMapTypes.tooltip=Where the scenario is fought: on any ground map, in space, in low atmosphere, or on a ground map limited to the specific terrain types selected at right.
MapParametersPanel.anyGroundMap.label=Any Ground Map
MapParametersPanel.anyGroundMap.tooltip=Fight on any ground map.
MapParametersPanel.useSpaceMap.label=Use Space Map
MapParametersPanel.useSpaceMap.tooltip=Fight in space.
MapParametersPanel.useLowAtmoMap.label=Use Low Atmo Map
MapParametersPanel.useLowAtmoMap.tooltip=Fight on a low-atmosphere map.
MapParametersPanel.specificMapTypes.label=Specific Map Types
MapParametersPanel.specificMapTypes.tooltip=Fight on a ground map limited to the terrain types selected at right.
MapParametersPanel.allowedTerrainTypes.tooltip=Terrain types the map may use. Only applies when "Specific Map Types" is selected.
# Modifiers panel
ModifiersPanel.title=Fixed Modifiers
ModifiersPanel.add=Add
ModifiersPanel.remove=Remove
ModifiersPanel.picker.tooltip=A scenario modifier to add. These modifiers are always applied to every scenario generated from this template.
ModifiersPanel.add.tooltip=Add the selected modifier to this template.
ModifiersPanel.selectedList.tooltip=Modifiers always applied to scenarios generated from this template. Select one or more to remove.
ModifiersPanel.remove.tooltip=Remove the selected modifiers from this template.
# Objectives panel
ObjectivesPanel.title=Objectives:
ObjectivesPanel.addEdit=Add/Edit Objective
ObjectivesPanel.remove=Remove
ObjectivesPanel.list.tooltip=Objectives for this scenario, such as destroy or preserve goals and the effects they trigger. Select one to edit or remove it.
ObjectivesPanel.addEdit.tooltip=Add a new objective, or edit the selected one.
ObjectivesPanel.remove.tooltip=Remove the selected objective from this template.
# Role set editor panel
RoleSetEditorPanel.title=Required Roles
RoleSetEditorPanel.validRoles.label=Roles valid for unit type:
RoleSetEditorPanel.validRoles.tooltip=Roles valid for the force's unit type. Select one or more to combine into a role set.
RoleSetEditorPanel.addRoleSet=Add Role Set
RoleSetEditorPanel.addRoleSet.tooltip=Combine the selected roles into a single role set.
RoleSetEditorPanel.roleSets.label=Role sets (one chosen at random):
RoleSetEditorPanel.roleSets.tooltip=The defined role sets; one set is chosen at random when the force is generated, and its roles guide which units are picked.
RoleSetEditorPanel.removeRoleSet=Remove Role Set
RoleSetEditorPanel.removeRoleSet.tooltip=Remove the selected role set(s).
# Force editor panel
ForceEditorPanel.forceAlignment.label=Force Alignment:
ForceEditorPanel.forceAlignment.tooltip=Which side this force fights for: Player, Allied, Opposing, Third (a separate hostile side), or Planet Owner (the faction that holds the planet).
ForceEditorPanel.generationMethod.label=Generation Method:
ForceEditorPanel.generationMethod.tooltip=How this force's units are chosen: Player Supplied (you deploy your own units), BV Scaled or Unit Count Scaled (generated against a budget), Fixed Unit Count, Player Or Fixed Unit Count, Fixed MUL (a set unit list), or None.
ForceEditorPanel.scalingMultiplier.label=Scaling Multiplier:
ForceEditorPanel.scalingMultiplier.tooltip=Multiplies the generation budget for the scaled methods (BV Scaled / Unit Count Scaled). Has no effect on Fixed Unit Count or on player-supplied forces.
ForceEditorPanel.destinationZone.label=Destination Zone:
ForceEditorPanel.destinationZone.tooltip=The board edge this bot force will try to move toward. "None" leaves it with no movement goal.
ForceEditorPanel.retreatThreshold.label=Retreat Threshold:
ForceEditorPanel.retreatThreshold.tooltip=The loss percentage at which this bot force is intended to withdraw. Applies to bot forces only (disabled for player-supplied forces).
ForceEditorPanel.reinforce.label=Reinforce subsequent scenarios:
ForceEditorPanel.reinforce.tooltip=Whether this force is allowed to reinforce later linked scenarios (used by the AtB/StratCon rules).
ForceEditorPanel.contributesToBV.label=Contributes to BV:
ForceEditorPanel.contributesToBV.tooltip=When an opposing force is generated with the BV-Scaled method, this force's BV is added to the budget it is generated against. Applies to player/allied forces; automatically turned off for opposing forces.
ForceEditorPanel.contributesToUnitCount.label=Contributes to Unit Count:
ForceEditorPanel.contributesToUnitCount.tooltip=When an opposing force is generated with the Unit-Count-Scaled method, this force's unit count is added to the budget it is generated against. Applies to player/allied forces; automatically turned off for opposing forces.
ForceEditorPanel.forceId.label=Force ID:
ForceEditorPanel.forceId.tooltip=A unique identifier for this force within the template. Other forces reference it by this ID for deployment synchronization and objectives.
ForceEditorPanel.syncDeployment.label=Synchronized Deployment:
ForceEditorPanel.syncDeployment.tooltip=Deploy this force relative to another force instead of using its own deployment zones: on the same edge, the opposite edge, or an edge adjacent to the chosen force.
ForceEditorPanel.syncForceName.tooltip=The other force whose deployment edge this force synchronizes with.
ForceEditorPanel.fixedMul.label=Fixed MUL:
ForceEditorPanel.fixedMul.tooltip=The fixed MUL file this force's units are drawn from (used by the Fixed MUL generation method).
ForceEditorPanel.objectiveLinkedForces.label=Objective-Linked Forces:
ForceEditorPanel.objectiveLinkedForces.tooltip=Other forces grouped with this one for objectives; an objective targeting any of them counts this force too. Select multiple with Ctrl or Shift.
ForceEditorPanel.deploymentZones.label=Possible Deployment Zones
ForceEditorPanel.deploymentZones.tooltip=Possible deployment edges; one is chosen at random when the scenario is generated. "Narrow Edge" resolves to an edge on the map's shorter side.
ForceEditorPanel.unitType.label=Unit Type:
ForceEditorPanel.unitType.tooltip=The type of unit this force is generated from. The special "ATB" mixes let the generator choose an appropriate combination of types.
ForceEditorPanel.arrivalTurn.label=Arrival Turn:
ForceEditorPanel.arrivalTurn.tooltip=The turn this force arrives. 0 = start of the scenario; a positive number = that turn. Special negative values: -1 Staggered, -2 Staggered By Lance, -3 As Reinforcements.
ForceEditorPanel.fixedUnitCount.label=Fixed Unit Count:
ForceEditorPanel.fixedUnitCount.tooltip=Number of units to generate for the Fixed Unit Count (or Player-or-Fixed) methods. -1 generates a lance sized for the faction.
ForceEditorPanel.maxWeight.label=Max Weight:
ForceEditorPanel.maxWeight.tooltip=Heaviest weight class allowed for generated units. Applies to bot forces (disabled for player-supplied forces).
ForceEditorPanel.minWeight.label=Min Weight:
ForceEditorPanel.minWeight.tooltip=Lightest weight class allowed for generated units. Applies to bot forces (disabled for player-supplied forces).
ForceEditorPanel.contributesToMapSize.label=Contributes to Map Size:
ForceEditorPanel.contributesToMapSize.tooltip=Whether this force's size is counted when scaling the map's dimensions.
ForceEditorPanel.generationOrder.label=Generation Order:
ForceEditorPanel.generationOrder.tooltip=The order in which forces are generated (lower numbers generate first), so later forces can be generated relative to earlier ones.
ForceEditorPanel.allowAeroBombs.label=Allow Aero Bombs:
ForceEditorPanel.allowAeroBombs.tooltip=Attempt to load generated aerospace units with bombs. Only selectable for aerospace unit types, and may not always result in bombs.
ForceEditorPanel.startAltitude.label=Start Altitude:
ForceEditorPanel.startAltitude.tooltip=Starting altitude for aerospace units; 0 lands them on the ground. Has no effect on non-aerospace units.
ForceEditorPanel.isArtillery.label=Is Artillery:
ForceEditorPanel.isArtillery.tooltip=Marks this as an artillery force. Generation may fail for unit types that have no artillery. Required in order to deploy off board.
ForceEditorPanel.deployOffBoard.label=Deploy Off board:
ForceEditorPanel.deployOffBoard.tooltip=Deploy this force off the game board (for indirect fire). The force must be marked as artillery.
ForceEditorPanel.subjectToRandomRemoval.label=Subject to Random Removal:
ForceEditorPanel.subjectToRandomRemoval.tooltip=Whether this force can lose units to random-removal effects such as scenario modifiers (for example Good Intel). On by default.
ForceEditorPanel.syncRetreatThreshold.label=Sync Retreat Threshold:
ForceEditorPanel.syncRetreatThreshold.tooltip=Use the retreat threshold of the force this one is synchronized with, instead of its own.
ForceEditorPanel.save=Save
ForceEditorPanel.save.tooltip=Add this force to the template, or apply your changes to the force being edited.
