## General Mission Resources
## Enums
# ContractObjectiveType Enum
ContractObjectiveType.GARRISON_DUTY.text=Garrison Duty
ContractObjectiveType.GARRISON_DUTY.toolTipText=The unit is tasked with garrisoning a region from enemy incursions.
ContractObjectiveType.CADRE_DUTY.text=Cadre Duty
ContractObjectiveType.CADRE_DUTY.toolTipText=The unit is tasked with training local forces, potentially combined with garrisoning\
  \ the local region.
ContractObjectiveType.SECURITY_DUTY.text=Security Duty
ContractObjectiveType.SECURITY_DUTY.toolTipText=<html>The unit is tasked with protecting a specific person, object, or place\
  \ from attack and/or capture. <br>This is also called "bodyguard" or "watchdog" duty.</html>
ContractObjectiveType.RIOT_DUTY.text=Riot Duty
ContractObjectiveType.RIOT_DUTY.toolTipText=The unit is tasked with garrisoning a region to put down and prevent riots and rebellion.
ContractObjectiveType.PLANETARY_ASSAULT.text=Planetary Assault
ContractObjectiveType.PLANETARY_ASSAULT.toolTipText=The unit is tasked with assaulting a planet or a region of a planet, normally\
  \ as part of a larger force.
ContractObjectiveType.RELIEF_DUTY.text=Relief Duty
ContractObjectiveType.RELIEF_DUTY.toolTipText=The unit is tasked with providing relief and reinforcement to embattled employer\
  \ units, normally ones in danger of being overrun without the additional support.
ContractObjectiveType.GUERRILLA_WARFARE.text=Guerrilla Warfare
ContractObjectiveType.GUERRILLA_WARFARE.toolTipText=The unit is tasked with going behind enemy lines without support to undertake\
  \ guerrilla actions against the enemy, thus disrupting their planetary control.
ContractObjectiveType.PIRATE_HUNTING.text=Pirate Hunting
ContractObjectiveType.PIRATE_HUNTING.toolTipText=The unit is tasked with hunting down pirates and bringing them to justice...\
  \ or death.
ContractObjectiveType.DIVERSIONARY_RAID.text=Diversionary Raid
ContractObjectiveType.DIVERSIONARY_RAID.toolTipText=The unit is tasked with providing a diversion for a separate, far more\
  \ important, assault or raid by raiding an enemy planet, thus drawing significant enemy forces to their position from\
  \ the true primary target.
ContractObjectiveType.OBJECTIVE_RAID.text=Objective Raid
ContractObjectiveType.OBJECTIVE_RAID.toolTipText=The unit is tasked with raiding an enemy planet to achieve a set military\
  \ objective.
ContractObjectiveType.RECON_RAID.text=Recon Raid
ContractObjectiveType.RECON_RAID.toolTipText=The unit is tasked with scouting and gathering information on an enemy force by\
  \ raiding an enemy planet.
ContractObjectiveType.EXTRACTION_RAID.text=Extraction Raid
ContractObjectiveType.EXTRACTION_RAID.toolTipText=The unit is tasked with raiding an enemy planet to capture a target and return\
  \ the target to their employer.
ContractObjectiveType.ASSASSINATION.text=Assassination
ContractObjectiveType.ASSASSINATION.toolTipText=The unit is tasked with raiding an enemy planet to eliminate a number of \
  military, civilian, or scientific VIPs.
ContractObjectiveType.ESPIONAGE.text=Espionage
ContractObjectiveType.ESPIONAGE.toolTipText=The unit is tasked with infiltrating an enemy planet to gather information over\
  \ a prolonged period.
ContractObjectiveType.MOLE_HUNTING.text=Mole Hunting
ContractObjectiveType.MOLE_HUNTING.toolTipText=A number of suspected moles have been identified, the unit is tasked with \
  their elimination.
ContractObjectiveType.OBSERVATION_RAID.text=Observation Raid
ContractObjectiveType.OBSERVATION_RAID.toolTipText=The unit is tasked with observing enemy reactions to hostile ventures.
ContractObjectiveType.RETAINER.text=Temporary Retainer
ContractObjectiveType.RETAINER.toolTipText=The unit is hired by a local dignitary or military leader to perform short-term \
  services.
ContractObjectiveType.SABOTAGE.text=Sabotage
ContractObjectiveType.SABOTAGE.toolTipText=The unit is tasked with the destruction of one or more vital assets.
ContractObjectiveType.TERRORISM.text=Black-Ops Insurgency
ContractObjectiveType.TERRORISM.toolTipText=The unit is tasked with infiltrating an enemy planet. There you will pose as \
  an insurgent group to disrupt planetary control via any means.
ContractObjectiveType.UNDEFINED.text=Undefined
ContractObjectiveType.UNDEFINED.toolTipText=This contract type is not defined. Normally this means that contract type is \
  being handled manually.
# CombatRole Enum
CombatRole.MANEUVER.text=Maneuver
CombatRole.MANEUVER.toolTipText=This formation rolls twice when reinforcing, using the best roll.
CombatRole.FRONTLINE.text=Frontline
CombatRole.FRONTLINE.toolTipText=This formation gains points based on its commander's Tactics skill.\
  \ These points can be spent to place mines before a scenario, support the formation with additional units from \
  elsewhere in your TO&E.
CombatRole.PATROL.text=Patrol
CombatRole.PATROL.toolTipText=When deploying this formation, multiple hexes will be revealed based on ruleset. See the \
  'Combat Roles' and 'Advanced Scouting' Glossary entries for more information.
CombatRole.TRAINING.text=Training
CombatRole.TRAINING.toolTipText=The commander of this formation is training their subordinates. Please\
  \ see the supporting documentation.
CombatRole.AUXILIARY.text=Auxiliary
CombatRole.AUXILIARY.toolTipText=This formation rolls twice when reinforcing, using the best roll. It\
  \ cannot be directly assigned to scenarios.
CombatRole.RESERVE.text=Reserve
CombatRole.RESERVE.toolTipText=This formation cannot be directly assigned to scenarios.
CombatRole.CADRE.text=Cadre
CombatRole.CADRE.toolTipText=This formation is being used to train local formations. This has no mechanical effects.
# ContractMoraleLevel Enum
ContractMoraleLevel.ROUTED.text=Routed
ContractMoraleLevel.ROUTED.toolTipText=The enemy is in full retreat, suffering devastating losses and scattered. They pose no\
  \ significant threat and are incapable of organizing a counterattack.
ContractMoraleLevel.CRITICAL.text=Critical
ContractMoraleLevel.CRITICAL.toolTipText=The enemy is in a dire state, with most of their forces destroyed or incapacitated.\
  \ Their ability to fight is severely compromised, and morale is near breaking.
ContractMoraleLevel.WEAKENED.text=Weakened
ContractMoraleLevel.WEAKENED.toolTipText=The enemy is losing ground, sustaining significant casualties, and is disorganized.\
  \ However, they can still put up resistance in isolated areas.
ContractMoraleLevel.STALEMATE.text=Stalemate
ContractMoraleLevel.STALEMATE.toolTipText=Both sides are evenly matched, with neither gaining a clear advantage. Skirmishes\
  \ will continue, but the outcome remains uncertain
ContractMoraleLevel.ADVANCING.text=Advancing
ContractMoraleLevel.ADVANCING.toolTipText=The enemy is gaining momentum, making coordinated strikes, and allied forces are falling \
  back. The enemy is beginning to dominate key areas of the battlefield.
ContractMoraleLevel.DOMINATING.text=Dominating
ContractMoraleLevel.DOMINATING.toolTipText=The enemy has the upper hand, controlling critical objectives and inflicting heavy\
  \ casualties. Allied forces are under significant pressure, and defeat is imminent.
ContractMoraleLevel.OVERWHELMING.text=Overwhelming
ContractMoraleLevel.OVERWHELMING.toolTipText=The enemy is completely overwhelming allied positions, executing a final push for total\
  \ victory. Allied forces are on the verge of collapse, with no hope of recovery.
