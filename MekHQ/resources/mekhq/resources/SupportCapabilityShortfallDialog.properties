SupportCapabilityShortfallDialog.description=<h1 style="text-align:center">Support Units</h1>\
  Your campaign rules call for support units you do not have yet.\
  <p>Tick the ones you want. Each is crewed with new hires, or from the temporary crew pool if you choose. Units you \
  already own count toward each number, and any you have left idle are crewed too.</p>\
  <p>Decline to add none. You will not be asked again; switching a rule off and on again offers its units on their \
  own.</p>
SupportCapabilityShortfallDialog.row.add={0}: {1} more (you have {3} of {4})
SupportCapabilityShortfallDialog.row.crew={0}: crew the {2} you own but have left idle (target {4})
SupportCapabilityShortfallDialog.row.addAndCrew={0}: {1} more, and crew the {2} you own but have left idle (target {4})
SupportCapabilityShortfallDialog.capability.SALVAGE=Recovery vehicles (salvage operations)
SupportCapabilityShortfallDialog.capability.MEDICAL=MASH trucks (MASH theatres)
SupportCapabilityShortfallDialog.capability.LOGISTICS=Convoy trucks (StratCon)
SupportCapabilityShortfallDialog.capability.COMMISSARY=Mobile canteens (fatigue)
SupportCapabilityShortfallDialog.capability.SECURITY=Security infantry (prisoner capture)
SupportCapabilityShortfallDialog.cancel=Decline
SupportCapabilityShortfallDialog.confirm=Accept
SupportCapabilityShortfallDialog.report=Support units added for: {0}.
