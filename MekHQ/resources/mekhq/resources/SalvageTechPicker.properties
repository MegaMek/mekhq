SalvageTechPicker.lowMinutes.none=<h2 style="text-align:center;">No Salvage Time</h2>The selected techs have no work \
  time left. Unless you assign techs with time to spare, nothing can be recovered after this scenario.\
  <br><br>Continue anyway?
SalvageTechPicker.lowMinutes.some=<h2 style="text-align:center;">Low Salvage Time</h2>The selected techs only have \
  <b>{0}</b> minutes of work time between them. That may not be enough to recover everything left on the field. As a\
  \ rough guide, 360 minutes is enough to recover six ''Meks, or a DropShip and three aerospace fighters, before\
  \ environmental modifiers.<br><br>Continue anyway?
