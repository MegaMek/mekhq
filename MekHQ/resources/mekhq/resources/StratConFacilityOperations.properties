# {0} = order name, {1} = Employer Support cost
operation.label={0} ({1} Support)
operation.tooltip.RECON=Spend a week watching the facility. On a success you learn more about it; on a failure you are\
  \ spotted and must fight your way clear. Patrols do this best.
operation.tooltip.RAID=Strike the facility to damage it and loot supplies. A win costs it one condition step and one\
  \ garrison step.
operation.tooltip.SABOTAGE=Slip in and sabotage the facility. On a success its condition drops two steps; on a failure\
  \ your saboteurs are caught and fight against extra enemy forces. Either way, Escalation rises.
operation.tooltip.ASSAULT=Attack the facility to capture or destroy it.
operation.tooltip.FORTIFY=Expand the facility by one tier, raising how large a garrison it can hold.
operation.tooltip.REINFORCE=Bring the facility's garrison up to full strength.
operation.tooltip.INTERDICT=Ambush the enemy's supply convoys on this road. A win cuts the enemy's supply line through\
  \ this hex for four weeks.
operation.tooltip.SIEGE=Surround the facility from next to it. Each week it loses a garrison step per besieging\
  \ formation (at most two), cannot repair, and costs you 1 Support per formation. Its garrison may sortie against you, and\
  \ the enemy may send a relief force; losing either fight breaks the siege. At no garrison it surrenders. A facility\
  \ cut off from its supply lines can neither sortie nor be relieved.
operation.tooltip.BUILD=Spend two weeks building a new Outpost here. Any scenario on the hex interrupts the work.
