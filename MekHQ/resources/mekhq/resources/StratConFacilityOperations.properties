# One-time facility briefing (StratConFacilityBriefingNagDialog)
briefing.ic={0}, before you deploy: the area of operations is dotted with installations. Bases, depots, comms\
  \ centers, factories. Every one of them is either working for us or against us, and the enemy''s will make your\
  \ fights harder until something is done about them. My people will expect you to deal with the worst of them.
briefing.ooc=<b>Facilities</b> on the StratCon map affect the scenarios fought near them, for whoever holds them.\
  <br><br><b>To act on one:</b> deploy a formation on or next to it, then <b>double-click</b> the facility (or\
  \ right-click it and choose <i>Facility Details</i>). The details window shows what it does, what you know about\
  \ it, and every order you can give there. If an order is greyed out, it tells you why and what to do about it.\
  <br><br><b>Orders</b> include Recon (learn more), Raid, Sabotage, Assault (capture or destroy), Siege (starve it\
  \ into surrender), and, for your own facilities, Fortify and Reinforce. Each costs Employer Support.\
  <br><br><b>Keep track</b> with the <i>Facilities...</i> button beside the map: it lists every facility you know of\
  \ and what is about to happen, such as enemy counterattacks on facilities you hold.\
  <br><br>Learn more: <a href=''GLOSSARY:STRATCON_FACILITIES''>Facilities</a>,\
  \ <a href=''GLOSSARY:STRATCON_FACILITY_ORDERS''>Facility Orders</a>,\
  \ <a href=''GLOSSARY:STRATCON_ENEMY_FACILITY_ACTIVITY''>Enemy Facility Activity</a>.\
  <br><br>This briefing is shown once. You can bring it back from the Reminders page of the MekHQ options.
briefing.button=Understood
# Facility traits (FacilityTrait)
trait.UNDERMANNED=Undermanned
trait.UNDERMANNED.description=Holds one garrison step fewer than its tier allows.
trait.VETERAN_GARRISON=Veteran Garrison
trait.VETERAN_GARRISON.description=Held by veterans. Fights at an enemy facility face better troops; an employer's\
  \ facility holds out better if you leave it to defend itself.
trait.POOR_MORALE=Poor Morale
trait.POOR_MORALE.description=Its troops would rather be elsewhere. Under siege it surrenders with one garrison step\
  \ left; an employer's facility holds out worse if you leave it to defend itself.
trait.HARDENED=Hardened
trait.HARDENED.description=Built to take punishment. A won raid or attack that does not capture it leaves its\
  \ condition alone, and sabotage only drops it one step.
trait.WELL_STOCKED=Well-Stocked
trait.WELL_STOCKED.description=Full stores. A won raid on an enemy one brings in 2 extra Employer Support; held by\
  \ your side, it provides 1 extra Employer Support each month.
trait.EXPERIMENTAL_WEAPONS=Experimental Weapons
trait.EXPERIMENTAL_WEAPONS.description=Prototype gear. Fights at an enemy one face better-equipped troops; capturing\
  \ it brings in 2 Employer Support once, as the gear is traded to your employer.
traits.none=None
