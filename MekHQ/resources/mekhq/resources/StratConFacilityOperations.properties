# The choice after capturing a facility; {0} = facility name
capture.message=The {0} is ours. What are your orders?
capture.ooc=<b>Hold</b>: its effects work for you, but you must garrison it and it will draw counterattacks.\
  <br><b>Raze</b>: destroy it. Escalation rises, more so for a civilian facility.\
  <br><b>Hand over</b>: your employer takes it and garrisons it, and pays you the contract's combat bonus. It can fall\
  \ without your say.
