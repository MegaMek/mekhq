LifePathSystemPicker.title=Planetary System Picker
LifePathSystemPicker.options.label=Selected Systems
LifePathSystemPicker.instructions.label=Instructions
LifePathSystemPicker.instructions.text.requirements=<h2 style="text-align: center;">Planetary Systems</h2>  Type a system name and press Enter, or use <b>Add</b>, to require that the character comes from that system.  <p>Several systems in the same group are treated as alternatives: the character needs <b>one</b> of them.  <p>Systems are stored by identifier rather than by name, because a system's name changes from era to era while   its identifier does not.
LifePathSystemPicker.instructions.text.exclusions=<h2 style="text-align: center;">Planetary Systems</h2>  Type a system name and press Enter, or use <b>Add</b>, to bar characters from that system.  <p>A character from <b>any</b> system listed here cannot take this Life Path.  <p>Systems are stored by identifier rather than by name, because a system's name changes from era to era while   its identifier does not.
LifePathSystemPicker.instructions.text.fixed_xp=<h2 style="text-align: center;">Planetary Systems</h2>  Planetary systems cannot be awarded, so this picker does nothing on this tab.
LifePathSystemPicker.instructions.text.flexible_xp=<h2 style="text-align: center;">Planetary Systems</h2>  Planetary systems cannot be awarded, so this picker does nothing on this tab.
LifePathSystemPicker.search.label=System:
LifePathSystemPicker.search.tooltip=Start typing a system name. Suggestions appear as you type; pick one and press   Enter to add it.
LifePathSystemPicker.search.notFound=No system named <b>{0}</b> was found.
