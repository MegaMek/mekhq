# Suffix on a numbered ordinal, keyed by the number's last digit: "1st", "2nd", "3rd", "4th".
# Index 0 is the suffix every other digit takes.

FormationNamer.ordinalSuffix.0.text=th
FormationNamer.ordinalSuffix.1.text=st
FormationNamer.ordinalSuffix.2.text=nd
FormationNamer.ordinalSuffix.3.text=rd
FormationNamer.ordinalSuffix.4.text=th
FormationNamer.ordinalSuffix.5.text=th
FormationNamer.ordinalSuffix.6.text=th
FormationNamer.ordinalSuffix.7.text=th
FormationNamer.ordinalSuffix.8.text=th
FormationNamer.ordinalSuffix.9.text=th

# 11, 12 and 13 do not follow their last digit in English - "11th", not "11st".
# A language without that exception can set this to the same value as ordinalSuffix.0.

FormationNamer.teensOrdinalSuffix.text=th
