# The contact''s pitch, shown as a quote in the dossier. Adapted from FactionStandingGreeting to read as an offer being
# made rather than a contract already signed. Each pitch is composed of a GREETING (chosen by the hiring faction and by
# the campaign''s standing with that faction, banded positive / neutral / negative) followed by an ASK (chosen by the
# contract objective type and the same standing band). Both are written to work whether the player is a mercenary or a
# member of the hiring faction. {0} is the employer''s name. Apostrophes must be doubled ('') so MessageFormat does not
# swallow the {0} placeholder.
# Greetings
greeting.contractMarket.innersphere.positive=Your service to {0} has earned genuine respect, and it is a pleasure to bring this work to you.
greeting.contractMarket.innersphere.neutral=I speak on behalf of {0}. The arrangement is straightforward, the pay is fair, and we value professionals.
greeting.contractMarket.innersphere.negative=Frankly, {0} would prefer other options, but circumstances are what they are. Do the job and we will have no quarrel.
greeting.contractMarket.periphery.positive=Out here a good name travels far, and yours reached {0} long before you did. We are glad to have you.
greeting.contractMarket.periphery.neutral=We do not have the deep pockets of the Great Houses, but {0} pays what it promises. That counts for something on the rim.
greeting.contractMarket.periphery.negative=Folk out here do not much trust hired guns from the core, and {0} is no exception. Still, needs must.
greeting.contractMarket.clan.positive=You have fought as a Clan warrior fights, and {0} would be honored to see your colors beside ours.
greeting.contractMarket.clan.neutral=I speak for {0}. We do not haggle like Inner Sphere merchants - we state our terms and expect them met.
greeting.contractMarket.clan.negative=You are freebirth, and {0} knows it. Yet your record cannot be denied, and honor obliges us to make the offer.
greeting.contractMarket.capellan.positive=The Chancellor values loyal servants of the state, and {0} counts you among them. Serve well and be rewarded.
greeting.contractMarket.capellan.neutral={0} has need of capable hands and few questions. Discretion is expected; the Maskirovka is always watching.
greeting.contractMarket.capellan.negative=Your loyalty to {0} is, shall we say, unproven. Prove it here, and the Confederation may yet find a place for you.
greeting.contractMarket.draconis.positive=The Coordinator''s servants have not forgotten your loyalty, and it honors {0} to call upon you again.
greeting.contractMarket.draconis.neutral={0} speaks for the Dragon. Duty is offered, and honor demands it be met without complaint.
greeting.contractMarket.draconis.negative=You have given the Dragon little reason for trust, but {0} has need of you regardless. Do not shame us.
greeting.contractMarket.lyran.positive={0} looks after those who look after it, and your account stands in excellent order. Let us do business again.
greeting.contractMarket.lyran.neutral=We understand the value of a sound investment, and {0} considers you one. The terms are generous.
greeting.contractMarket.lyran.negative={0} has reservations about your ledger, frankly, but coin is coin and the work needs doing.
greeting.contractMarket.federatedsuns.positive=You have served the Suns with honor, and {0} is proud to count you a friend of the realm.
greeting.contractMarket.federatedsuns.neutral={0} brings this to you in good faith. The cause is just, the pay is fair, and Davion honors its word.
greeting.contractMarket.federatedsuns.negative=Your conduct has not endeared you to {0}, but the Suns need soldiers. Comport yourself well and we will reconsider.
greeting.contractMarket.freeworlds.positive=In a realm as fractious as ours, reliable friends are treasured, and {0} treasures you. Welcome back.
greeting.contractMarket.freeworlds.neutral={0} speaks for one of the League''s many interests. The politics need not concern you; the work and the pay are real.
greeting.contractMarket.freeworlds.negative={0} is not certain where your loyalties lie, and in the League that is no small thing. Give us reason to trust you.
greeting.contractMarket.terran.positive=The Hegemony rewards excellence, and {0} has marked your unit as excellent. It is an honor to retain you.
greeting.contractMarket.terran.neutral={0} represents the first among the Great Powers. Meet our standards - they are high - and you will be well compensated.
greeting.contractMarket.terran.negative=The Hegemony expects better than your record suggests, but {0} will grant you the chance to prove otherwise.
greeting.contractMarket.republic.positive=You have upheld the ideals the Republic was built upon, and {0} is grateful. This work is yours if you will have it.
greeting.contractMarket.republic.neutral={0} serves the peace Devlin Stone envisioned. The task is honest and the compensation fair.
greeting.contractMarket.republic.negative={0} questions whether you share the Republic''s ideals, but even doubters can serve a good cause. Prove us wrong.
greeting.contractMarket.starleague.positive=The League honors those who serve its ideals, and {0} numbers you among the worthy. Stand with us again.
greeting.contractMarket.starleague.neutral={0} speaks with the authority of the Star League itself. The duty is great, and so is the reward for those who answer.
greeting.contractMarket.starleague.negative={0} expected more of a unit with your record, but the League has need of every sword. See that you rise to it.
greeting.contractMarket.fedcom.positive=The Commonwealth prospers on the strength of allies like you, and {0} is glad to renew the partnership.
greeting.contractMarket.fedcom.neutral={0} speaks for the union of Sun and Fist. The arrangement is straightforward, and the treasury is deep.
greeting.contractMarket.fedcom.negative={0} is uncertain of your loyalty in these divided times, but the Commonwealth needs soldiers. Choose your side wisely.
greeting.contractMarket.rimworlds.positive={0} rewards those who stand with it against the arrogance of the core worlds, and you have stood firm. Welcome.
greeting.contractMarket.rimworlds.neutral=The Republic looks after its own interests, and {0} judges you useful to them. The terms are fair enough.
greeting.contractMarket.rimworlds.negative={0} does not trust outsiders, least of all you, but ambition makes strange allies. Do the work and hold your tongue.
greeting.contractMarket.taurian.positive=You have proven you do not share the core worlds'' contempt for us, and {0} does not forget such things. Welcome.
greeting.contractMarket.taurian.neutral={0} guards the Concordat''s independence jealously. If you can respect that, there is honest work and honest pay here.
greeting.contractMarket.taurian.negative={0} trusts no one from the Inner Sphere on principle, and you have done nothing to change that. Still, we have need.
greeting.contractMarket.canopus.positive=The Magistracy remembers its friends warmly, and {0} counts you dear among them. It is a delight to work with you again.
greeting.contractMarket.canopus.neutral={0} extends the Magistracy''s hospitality along with its contract. Serve us well and you will find Canopus generous.
greeting.contractMarket.canopus.negative={0} does not usually open its arms to your sort, yet here we are. Give the Magistracy reason to think better of you.
greeting.contractMarket.outworlds.positive=The Alliance values those who respect its principles, and {0} respects you in turn. We are glad you came.
greeting.contractMarket.outworlds.neutral={0} does not take up arms lightly, so understand this contract is a matter of true need. The terms are fair.
greeting.contractMarket.outworlds.negative={0} is wary of hired violence and warier still of you, but the Alliance has run out of gentler options. Tread carefully.
greeting.contractMarket.marian.positive=You have served the Hegemony as a true legionary, and {0} salutes you. Caesar has work worthy of your steel.
greeting.contractMarket.marian.neutral={0} speaks with the authority of Rome reborn. Fight well for the Hegemony and share in the spoils of conquest.
greeting.contractMarket.marian.negative={0} judges your record barbarian at best, but even Rome hired auxiliaries. Prove worthy of the legion, or be discarded.
greeting.contractMarket.comstar.positive=The Word has smiled upon our past dealings, and {0} would continue them. You have proven faithful.
greeting.contractMarket.comstar.neutral={0} moves in quiet ways, as you may know. This work is sanctioned by the Precentor; discretion is all we ask.
greeting.contractMarket.comstar.negative={0} senses little of the sacred in you, but the Word guides us to strange allies. Do not betray the Blessed Order''s trust.
greeting.contractMarket.wordofblake.positive=Blake has blessed our past dealings, and {0} would continue them. You have served the Word well.
greeting.contractMarket.wordofblake.neutral=The Jihad requires soldiers, and {0} has chosen you. Serve the Word faithfully and your reward - and your salvation - are assured.
greeting.contractMarket.wordofblake.negative=Your soul is unremarkable and your faith absent, but {0} has need of hands. Serve the Word, and pray you prove worthy.
# Objective Ask
ask.contractMarket.garrison_duty.positive=We need a steady garrison to hold this world, and there is no one we would sooner leave it to.
ask.contractMarket.garrison_duty.neutral=The task is garrison duty - hold this world and keep the peace while regular forces are committed elsewhere.
ask.contractMarket.garrison_duty.negative=You will hold this world on garrison duty. Keep your people disciplined and give the locals no cause for complaint.
ask.contractMarket.cadre_duty.positive=We would like you to train our young soldiers - your experience is exactly the example we want them to follow.
ask.contractMarket.cadre_duty.neutral=The contract is cadre duty: take our raw recruits and forge them into something that can hold a line.
ask.contractMarket.cadre_duty.negative=You are to drill our recruits into shape. Teach them well, and keep your bad habits to yourself.
ask.contractMarket.security_duty.positive=We need trusted guns to keep something precious safe, and we can think of none we trust more.
ask.contractMarket.security_duty.neutral=The job is security duty - guard the site, screen the threats, and keep the protected parties untouched.
ask.contractMarket.security_duty.negative=You will provide security here. Let nothing happen on your watch that we would have to answer for.
ask.contractMarket.riot_duty.positive=The streets are restless, and we need a firm but fair hand to restore calm. Yours is the hand for it.
ask.contractMarket.riot_duty.neutral=This is riot duty - restore order in a restless population without turning the crowds into martyrs.
ask.contractMarket.riot_duty.negative=You will put down the unrest here. Heavy-handedness costs us more than it is worth, so show restraint.
ask.contractMarket.planetary_assault.positive=The objective is nothing less than the taking of a world, and we want your banner at the front of the drop.
ask.contractMarket.planetary_assault.neutral=This is a planetary assault - land in force, break the defenders, and seize the world for us.
ask.contractMarket.planetary_assault.negative=You will spearhead the assault on this world. Do not falter, and do not waste the coin we are spending on you.
ask.contractMarket.relief_duty.positive=Good people are besieged and running out of time. We are sending our best to break through to them - we are sending you.
ask.contractMarket.relief_duty.neutral=The task is relief duty - cut through to our beleaguered forces and lift the siege before it is too late.
ask.contractMarket.relief_duty.negative=You are to relieve our forces under siege. Reach them in time, or the failure will be laid squarely at your feet.
ask.contractMarket.guerrilla_warfare.positive=We need someone bold enough to fight from the shadows behind enemy lines, and we trust you to do it well.
ask.contractMarket.guerrilla_warfare.neutral=This is guerrilla warfare - operate behind the lines, bleed the enemy, and vanish before they can answer.
ask.contractMarket.guerrilla_warfare.negative=You will wage a guerrilla campaign in occupied territory. You will be cut off and deniable; if you are caught, you are on your own.
ask.contractMarket.pirate_hunting.positive=Bandits have been preying on our people, and there is no one we would rather send to end it than you.
ask.contractMarket.pirate_hunting.neutral=The contract is pirate hunting - run the raiders to ground and put a stop to their predations.
ask.contractMarket.pirate_hunting.negative=You will hunt down the pirates plaguing this region. See that you actually finish the job this time.
ask.contractMarket.diversionary_raid.positive=We need a loud, convincing feint to draw the enemy''s eye, and your flair for the dramatic is perfect for it.
ask.contractMarket.diversionary_raid.neutral=This is a diversionary raid - make enough noise elsewhere to pull the enemy away from where it matters.
ask.contractMarket.diversionary_raid.negative=You will stage a diversion to draw the enemy off. Make it convincing, and do not get greedy out there.
ask.contractMarket.objective_raid.positive=There is a target that needs breaking, and we want it in the hands of a unit we can rely on. That is you.
ask.contractMarket.objective_raid.neutral=The job is an objective raid - strike the designated target, destroy it, and withdraw.
ask.contractMarket.objective_raid.negative=You will raid and destroy the designated target. Hit it clean and be gone before this becomes more than you can handle.
ask.contractMarket.recon_raid.positive=We need eyes on something dangerous, and steady nerves to bring the intelligence home. We trust yours.
ask.contractMarket.recon_raid.neutral=This is a recon raid - probe the objective, gather what intelligence you can, and get out intact.
ask.contractMarket.recon_raid.negative=You will scout the objective under fire. Bring back the intelligence, and do not improvise beyond your orders.
ask.contractMarket.extraction_raid.positive=Someone valuable needs pulling out of harm''s way, and we would put no one but you on so delicate a task.
ask.contractMarket.extraction_raid.neutral=The contract is an extraction - reach the asset, secure it, and bring it out whole.
ask.contractMarket.extraction_raid.negative=You will extract the asset and bring it back intact. Damage it or lose it, and there will be no payment worth mentioning.
ask.contractMarket.assassination.positive=There is a name that must be struck from the rolls, and we trust only steady hands like yours with such delicate work.
ask.contractMarket.assassination.neutral=The job is an assassination - remove the named target and leave as little trace as you can.
ask.contractMarket.assassination.negative=There is a name that must be struck from the rolls. Do it clean, tell no one, and give us no reason to regret choosing you.
ask.contractMarket.espionage.positive=We need information only a capable, discreet unit can obtain, and your discretion is beyond question.
ask.contractMarket.espionage.neutral=This is an espionage contract - infiltrate the target, secure the intelligence, and slip out unseen.
ask.contractMarket.espionage.negative=You will steal the information we require. Be seen or be caught, and we will deny you ever worked for us.
ask.contractMarket.mole_hunting.positive=There is a traitor in our midst, and we need someone we trust completely to root them out. We trust you.
ask.contractMarket.mole_hunting.neutral=The task is to find the mole - identify the leak in our organization and close it, quietly.
ask.contractMarket.mole_hunting.negative=You will find the traitor among us. Accuse the wrong person and the mistake will be yours to answer for.
ask.contractMarket.observation_raid.positive=We need watchful eyes on the enemy''s movements, and your judgment is exactly what this calls for.
ask.contractMarket.observation_raid.neutral=This is an observation raid - shadow the enemy, record their strength and movements, and report back.
ask.contractMarket.observation_raid.negative=You will observe and report on the enemy. Watch, do not blunder into a fight, and bring us accurate word for once.
ask.contractMarket.retainer.positive=We would simply like you on hand and ready, a trusted sword we can call upon. Few earn that standing with us.
ask.contractMarket.retainer.neutral=The contract is a retainer - remain on station and ready to answer whatever we require of you.
ask.contractMarket.retainer.negative=You will stay on retainer, on call for our needs. Be ready when we summon you, and do not make us come looking.
ask.contractMarket.sabotage.positive=We need something important quietly wrecked, and only a unit as capable and careful as yours will do.
ask.contractMarket.sabotage.neutral=The job is sabotage - reach the target infrastructure, destroy it, and be gone before anyone knows you were there.
ask.contractMarket.sabotage.negative=You will sabotage the target. Leave no fingerprints, and understand we will disavow you the moment anything goes wrong.
ask.contractMarket.terrorism.positive=We need to break the enemy''s will, not merely their lines, and we trust you to do the hard thing well.
ask.contractMarket.terrorism.neutral=This contract is an act of terror - strike where it will shake the enemy''s resolve and spread fear behind their lines.
ask.contractMarket.terrorism.negative=You will carry fear into the enemy''s heart. It is ugly work, and if it sours, the blame will be entirely yours.
ask.contractMarket.undefined.positive=The particulars are still being drawn up, but we wanted a unit we trust attached before the details firm up. That is you.
ask.contractMarket.undefined.neutral=The specifics are still being finalized - consider this a general engagement, to be defined once you are aboard.
ask.contractMarket.undefined.negative=The details are, frankly, still a mess on our end. Sign on regardless, and we will tell you what we need soon enough.
