# Market guides, one per page. Steps, example lines and terms are numbered; each guide reads them until the next
# number is missing.
guide.contractMarket.offers.eyebrow=Guide · Offers
guide.contractMarket.offers.title=How the board works
guide.contractMarket.offers.step.1.title=Scan the board
guide.contractMarket.offers.step.1.text=Each offer shows how hard the fight looks (the coloured ring) and what it \
  should earn per month, counting the unpaid trip out. Keys 1 to 9 pick an offer.
guide.contractMarket.offers.step.2.title=Sort it
guide.contractMarket.offers.step.2.text=Sort the board by profit per month, total pay, danger or distance. The sort \
  also orders the columns on the Compare page.
guide.contractMarket.offers.step.3.title=Read the dossier
guide.contractMarket.offers.step.3.text=The dossier opens with the employer's pitch and a preview of the route, then \
  sets out the terms, intel and money. Show on star map closes the market and finds the target on the map.
guide.contractMarket.offers.step.4.title=Negotiate if the terms are thin
guide.contractMarket.offers.step.4.text=Spend reputation to raise a term, or give up steps on one term to raise \
  another.
guide.contractMarket.offers.step.5.title=Accept
guide.contractMarket.offers.step.5.text=Choose whether to mothball units and book travel, then accept. The market \
  closes and the contract joins your missions.
guide.contractMarket.offers.exampleIntro=Choosing between two offers on the board:
guide.contractMarket.offers.example.1.who=You
guide.contractMarket.offers.example.1.text=Sort by Net / mo to bring the most profitable offer to the top.
guide.contractMarket.offers.example.2.who=Board
guide.contractMarket.offers.example.2.text=A three-month raid tops the list, but its ring is red: the fight is very \
  hard.
guide.contractMarket.offers.example.3.who=You
guide.contractMarket.offers.example.3.text=Open the second offer instead, negotiate its salvage up a step, and accept.
guide.contractMarket.offers.term.1.name=Net per month
guide.contractMarket.offers.term.1.text=The estimated net divided by the time away: the term plus the trip out. It \
  lets a short contract be weighed fairly against a long one.
guide.contractMarket.offers.term.2.name=Command rights
guide.contractMarket.offers.term.2.text=Who gives the orders in the field. From least to most freedom: Integrated, \
  House, Liaison, Independent.
guide.contractMarket.offers.term.3.name=Straight support
guide.contractMarket.offers.term.3.text=The share of repair costs the employer pays back. It does not cover \
  maintenance.
guide.contractMarket.offers.term.4.name=Transport
guide.contractMarket.offers.term.4.text=The share of the trip out the employer pays for, as a lump sum.
guide.contractMarket.offers.term.5.name=Proving ground
guide.contractMarket.offers.term.5.text=An easier contract offered to new or struggling commands.
guide.contractMarket.compare.eyebrow=Guide · Compare
guide.contractMarket.compare.title=How comparing works
guide.contractMarket.compare.step.1.title=Choose the offers
guide.contractMarket.compare.step.1.text=Every offer on the board starts in the comparison. Click an offer's chip to \
  take it out or put it back.
guide.contractMarket.compare.step.2.title=Read across a row
guide.contractMarket.compare.step.2.text=Each row compares one figure. BEST marks the strongest value where higher (or \
  lower) is clearly better, and the money rows have bars scaled across the offers.
guide.contractMarket.compare.step.3.title=Hide what matches
guide.contractMarket.compare.step.3.text=Turn on Only rows that differ to hide the rows where every offer is the same.
guide.contractMarket.compare.step.4.title=Pick one
guide.contractMarket.compare.step.4.text=Click an offer's column heading to select it, then accept it from the footer. \
  Press C to switch back to the board.
guide.contractMarket.compare.exampleIntro=Weighing two offers against each other:
guide.contractMarket.compare.example.1.who=You
guide.contractMarket.compare.example.1.text=A six-month garrison contract pays the most in total.
guide.contractMarket.compare.example.2.who=Compare
guide.contractMarket.compare.example.2.text=A three-month raid earns more per month, because it is shorter, even after \
  its longer trip.
guide.contractMarket.compare.example.3.who=Compare
guide.contractMarket.compare.example.3.text=The raid is Very hard and pays salvage by exchange only.
guide.contractMarket.compare.example.4.who=You
guide.contractMarket.compare.example.4.text=Click the garrison contract's column and accept it.
guide.contractMarket.compare.term.1.name=Best
guide.contractMarket.compare.term.1.text=The strongest value in a row. Danger is never marked best, since how much \
  danger is worth taking on is your call.
guide.contractMarket.compare.term.2.name=Time away
guide.contractMarket.compare.term.2.text=The contract term plus the trip out, in months.
guide.contractMarket.compare.term.3.name=Exchange salvage
guide.contractMarket.compare.term.3.text=The employer keeps all salvage and pays you its value instead, so it is not \
  ranked against a share of salvage.
# Negotiation table guide.
guide.contractNegotiation.eyebrow=Guide · Negotiation
guide.contractNegotiation.title=How negotiating works
guide.contractNegotiation.step.1.title=Choose your negotiator
guide.contractNegotiation.step.1.text=Their Negotiation skill and traits set how far you can push: how many steps you \
  can raise a term, how much you can give up, and how re-negotiations go.
guide.contractNegotiation.step.2.title=Raise terms with reputation
guide.contractNegotiation.step.2.text=Each point of reputation raises one term by one step, up to the raise cap for \
  each term. Reputation-paid steps are coloured cyan on the track.
guide.contractNegotiation.step.3.title=Trade steps between terms
guide.contractNegotiation.step.3.text=Lower a term you care less about to bank the steps you give up. Two banked steps \
  buy a swap that raises another term by one step, at most twice. Swapped steps are amber, given-up steps hatched red.
guide.contractNegotiation.step.4.title=Read why a term will not move
guide.contractNegotiation.step.4.text=When a term cannot be raised, the reason is written beneath it: a lock, the cap, \
  or what you still need to bank.
guide.contractNegotiation.step.5.title=Re-negotiate if it is worth the risk
guide.contractNegotiation.step.5.text=A one-time opposed check that can move the terms, or open locked ones, in either \
  direction. Click twice to roll.
guide.contractNegotiation.step.6.title=Confirm
guide.contractNegotiation.step.6.text=Confirm writes the terms, pay and rented facilities to the offer. Reopening the \
  table later picks up where you left off.
guide.contractNegotiation.exampleIntro=Getting more salvage for a raid:
guide.contractNegotiation.example.1.who=You
guide.contractNegotiation.example.1.text=Spend both reputation points on Salvage, raising it from 10% to 30%.
guide.contractNegotiation.example.2.who=Table
guide.contractNegotiation.example.2.text=No reputation left, so + on Base pay says you need to bank two steps to swap.
guide.contractNegotiation.example.3.who=You
guide.contractNegotiation.example.3.text=Lower Transport, banking two steps, then raise Base pay with a swap.
guide.contractNegotiation.term.1.name=Raise cap
guide.contractNegotiation.term.1.text=How far above the employer's offer a term can be raised: the contract's scale, \
  adjusted by your negotiator's traits.
guide.contractNegotiation.term.2.name=Bank
guide.contractNegotiation.term.2.text=Steps you have given up, waiting to be spent on a swap or taken back.
guide.contractNegotiation.term.3.name=Plateau
guide.contractNegotiation.term.3.text=A run of steps with the same value. Lowering skips straight across one; raising \
  into one costs a step without changing the value until you reach the next band.
guide.contractNegotiation.term.4.name=Locked and fixed
guide.contractNegotiation.term.4.text=A locked term is one the employer will not negotiate; an exception may open it. \
  A fixed term is dictated by the contract and can never change.
# Contract editor guides, one per section.
guide.contractEditor.offer.eyebrow=Guide · Offer
guide.contractEditor.offer.title=How the offer works
guide.contractEditor.offer.step.1.title=Name it
guide.contractEditor.offer.step.1.text=The name is shown on the board and at the head of the dossier.
guide.contractEditor.offer.step.2.title=Choose its type
guide.contractEditor.offer.step.2.text=Normal, Proving ground, Covert or False flag. The type shapes how the enemy is \
  chosen, so it is fixed once the contract has been accepted.
guide.contractEditor.offer.step.3.title=Write the briefing
guide.contractEditor.offer.step.3.text=Optional text shown in the dossier under the employer's pitch. Markdown is \
  supported.
guide.contractEditor.offer.step.4.title=Status
guide.contractEditor.offer.step.4.text=A market offer has no status. Status can only be changed once an accepted \
  contract has concluded, and only between the concluded outcomes.
guide.contractEditor.offer.exampleIntro=Turning an ordinary offer into a starter contract:
guide.contractEditor.offer.example.1.who=GM
guide.contractEditor.offer.example.1.text=Set the type to Proving ground and rename it Operation First Light.
guide.contractEditor.offer.example.2.who=Market
guide.contractEditor.offer.example.2.text=The offer now carries a Proving Ground badge and the advisory Ideal for new \
  command.
guide.contractEditor.offer.term.1.name=Proving ground
guide.contractEditor.offer.term.1.text=An easier contract offered to help a new or struggling command find its footing.
guide.contractEditor.offer.term.2.name=Covert
guide.contractEditor.offer.term.2.text=The employer's identity is withheld from the player.
guide.contractEditor.offer.term.3.name=False flag
guide.contractEditor.offer.term.3.text=The visible employer is a front for someone else. The dossier hints at it only \
  through an advisory and a pay premium.
guide.contractEditor.job.eyebrow=Guide · The job
guide.contractEditor.job.title=How the job works
guide.contractEditor.job.step.1.title=Set the objectives
guide.contractEditor.job.step.1.text=Your objective and the enemy's shape the scenarios and the victory conditions.
guide.contractEditor.job.step.2.title=Choose the target
guide.contractEditor.job.step.2.text=Type to search for the target system; its planets fill the list beside it.
guide.contractEditor.job.step.3.title=Set the schedule
guide.contractEditor.job.step.3.text=An automatic start uses your travel time to the target. An automatic end is the \
  start plus the length. The length is set by hand only while the end is automatic; otherwise it follows the dates.
guide.contractEditor.job.step.4.title=Size it
guide.contractEditor.job.step.4.text=Scale sets the size of the engagement and drives pay, support points and the \
  victory points required.
guide.contractEditor.job.exampleIntro=Pushing a contract back a month:
guide.contractEditor.job.example.1.who=GM
guide.contractEditor.job.example.1.text=Turn Auto off on the start date and pick a date a month later.
guide.contractEditor.job.example.2.who=Editor
guide.contractEditor.job.example.2.text=With the end on Auto, the end date moves with it and the length stays the \
  same.
guide.contractEditor.job.term.1.name=Auto
guide.contractEditor.job.term.1.text=The generator works the value out when you save. Some values (planet, scale and \
  victory points) are rolled, so they can be left on Auto only while creating an offer.
guide.contractEditor.job.term.2.name=Scale
guide.contractEditor.job.term.2.text=The size of the engagement, from the rules in Hot Spots: Draconis Reach.
guide.contractEditor.job.term.3.name=Victory points
guide.contractEditor.job.term.3.text=The points needed to win the contract, derived from its scale, command rights \
  and length.
guide.contractEditor.employer.eyebrow=Guide · Employer
guide.contractEditor.employer.title=How the employer works
guide.contractEditor.employer.step.1.title=Choose who is hiring
guide.contractEditor.employer.step.1.text=The employer type sets the modifiers to pay, support, transport, salvage and \
  command rights. The faction is who they are.
guide.contractEditor.employer.step.2.title=Place them
guide.contractEditor.employer.step.2.text=Home territory is the landed power the enemy is set against; a secret backer \
  quietly funds the employer.
guide.contractEditor.employer.step.3.title=Present them
guide.contractEditor.employer.step.3.text=Shown as overrides the faction's name. The colour and camouflage are used on \
  the map and in the dossier.
guide.contractEditor.employer.step.4.title=Set their forces
guide.contractEditor.employer.step.4.text=Their skill and equipment rating. The Shown / Hidden pill hides them from the \
  player as allied command intel.
guide.contractEditor.employer.step.5.title=Edit the people
guide.contractEditor.employer.step.5.text=The negotiator and liaison: rank, name and portrait. When creating an offer \
  they are generated on save, and any field left on Auto keeps its generated value.
guide.contractEditor.employer.exampleIntro=Hiding who is really paying:
guide.contractEditor.employer.example.1.who=GM
guide.contractEditor.employer.example.1.text=Set the secret backer to ComStar and show the employer as Tharkad \
  Holdings.
guide.contractEditor.employer.example.2.who=Player
guide.contractEditor.employer.example.2.text=Sees only Tharkad Holdings on the board and in the dossier.
guide.contractEditor.employer.term.1.name=Home territory
guide.contractEditor.employer.term.1.text=The same as the employer's faction for a landed employer. It differs for \
  landless employers (nobles, corporations, businesses and mercenary subcontracts) and for rebels, who anchor on the \
  government they rise against.
guide.contractEditor.employer.term.2.name=Fallback factions
guide.contractEditor.employer.term.2.text=Generic Inner Sphere, Periphery and Clan placeholders, for when you do not \
  want a concrete faction.
guide.contractEditor.employer.term.3.name=Hidden intel
guide.contractEditor.employer.term.3.text=Intel the market shows as No Intel. You always see the true values here.
guide.contractEditor.enemy.eyebrow=Guide · Opposition
guide.contractEditor.enemy.title=How the opposition works
guide.contractEditor.enemy.step.1.title=Choose the enemy
guide.contractEditor.enemy.step.1.text=Its faction, secret backer, the name shown, colour and camouflage. Hiding the \
  opposition also hides an offer name built from it.
guide.contractEditor.enemy.step.2.title=Set their strength
guide.contractEditor.enemy.step.2.text=Their skill and equipment rating become the threat. Hide it to make the player \
  go in blind.
guide.contractEditor.enemy.step.3.title=Set their morale
guide.contractEditor.enemy.step.3.text=From Routed to Overwhelming. It can be hidden too.
guide.contractEditor.enemy.step.4.title=Accepted contracts only
guide.contractEditor.enemy.step.4.text=The batchall (against a Clan) and the rout's end date and payout can be set \
  only once the contract has been accepted.
guide.contractEditor.enemy.exampleIntro=Setting up a surprise:
guide.contractEditor.enemy.example.1.who=GM
guide.contractEditor.enemy.example.1.text=Raise the threat to Elite / A and set the threat to Hidden.
guide.contractEditor.enemy.example.2.who=Player
guide.contractEditor.enemy.example.2.text=Sees No Intel beside Threat, and only the assessment hints at the danger.
guide.contractEditor.enemy.term.1.name=Batchall
guide.contractEditor.enemy.term.1.text=A Clan's formal bid before an engagement, which the player may accept or \
  refuse.
guide.contractEditor.enemy.term.2.name=Rout
guide.contractEditor.enemy.term.2.text=When the enemy's morale breaks, the contract can end early with a routed \
  payout.
guide.contractEditor.enemy.term.3.name=Opposing commander
guide.contractEditor.enemy.term.3.text=The enemy's named leader: rank, name and portrait.
guide.contractEditor.terms.eyebrow=Guide · Terms and pay
guide.contractEditor.terms.title=How terms and pay work
guide.contractEditor.terms.step.1.title=Set each term
guide.contractEditor.terms.step.1.text=Click or drag along a term's track, or use the arrow keys. What the step does is \
  shown beside it; hover a step to read its effect before choosing it.
guide.contractEditor.terms.step.2.title=Lock terms
guide.contractEditor.terms.step.2.text=A locked term is one the employer will not negotiate. Locks can be changed only \
  while the contract is still an offer.
guide.contractEditor.terms.step.3.title=Set the pay
guide.contractEditor.terms.step.3.text=Leave the monthly, transport and combat pay on Auto to have them worked out from \
  the scale, terms and trip when you save, or set them by hand.
guide.contractEditor.terms.step.4.title=Rent facilities
guide.contractEditor.terms.step.4.text=The hospital beds, kitchens and holding cells the contract provides.
guide.contractEditor.terms.exampleIntro=Making an offer more generous:
guide.contractEditor.terms.example.1.who=GM
guide.contractEditor.terms.example.1.text=Move the base pay rate up two steps and lock it, so it cannot be traded away.
guide.contractEditor.terms.example.2.who=Editor
guide.contractEditor.terms.example.2.text=Monthly pay is on Auto, so it is worked out again from the new rate on save.
guide.contractEditor.terms.term.1.name=Step
guide.contractEditor.terms.term.1.text=A row of the Contract Steps Table, from 1 to 17. Higher steps are better for \
  the player.
guide.contractEditor.terms.term.2.name=Battle losses
guide.contractEditor.terms.term.2.text=The share of units lost in battle the employer pays for, on top of straight \
  support.
guide.contractEditor.terms.term.3.name=Exchange salvage
guide.contractEditor.terms.term.3.text=The employer keeps all salvage and pays you a share of its value instead.
guide.contractEditor.characteristics.eyebrow=Guide · Characteristics
guide.contractEditor.characteristics.title=How characteristics work
guide.contractEditor.characteristics.step.1.title=Pick at most one per line
guide.contractEditor.characteristics.step.1.text=The characteristics on a line exclude each other, so choosing one \
  clears the rest. None leaves the line empty.
guide.contractEditor.characteristics.step.2.title=Read the colours
guide.contractEditor.characteristics.step.2.text=Green helps the player, red hurts them, and amber cuts both ways. \
  Hover a chip for its effect.
guide.contractEditor.characteristics.step.3.title=Save to apply
guide.contractEditor.characteristics.step.3.text=Characteristics that change pay, length or victory points are baked \
  into the values left on Auto when you save. Values set by hand are left as they are.
guide.contractEditor.characteristics.exampleIntro=Making a job pay more:
guide.contractEditor.characteristics.example.1.who=GM
guide.contractEditor.characteristics.example.1.text=Choose High Pay on the Pay line, with monthly pay left on Auto.
guide.contractEditor.characteristics.example.2.who=Editor
guide.contractEditor.characteristics.example.2.text=On save, the automatic monthly pay is raised by High Pay's \
  multiplier.
guide.contractEditor.characteristics.term.1.name=Elite / Novice negotiator
guide.contractEditor.characteristics.term.1.text=Sets the employer's negotiator to a matching skill tier when you \
  save.
guide.contractEditor.characteristics.term.2.name=Quick / Lengthy
guide.contractEditor.characteristics.term.2.text=Shortens or lengthens an automatic contract length.
