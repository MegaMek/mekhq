<h2>Contract editor</h2>\
<p>This GM-only editor exposes every field of a contract market offer (or an accepted contract) so it can be hand-tuned. \
The form is one page in six sections; use the rail on the left to jump between them. Nothing is written until you save, \
and the contract is then rewritten in place.</p>\
<p><b>Auto.</b> Many fields carry an <i>Auto</i> pill. While it is on, the value is (re)computed on save using the same \
rules the contract generator uses, so you only need to set the fields you want to override. Click the pill to set the \
value by hand. A few of them (target planet, scale, victory points, and NPC names, ranks and portraits) draw on random \
generation, so they are offered only while creating a new offer, not when editing an existing one.</p>\
<p><b>Changes.</b> Every field you change is marked in amber, the rail counts the changes in each section, and \
<i>Revert changes</i> puts every field back to how it was when the editor opened.</p>\
<h3>Sections</h3>\
<ul>\
<li><b>Offer</b> - the name, the contract type, the briefing shown in the dossier, and (only for an accepted contract \
that has concluded) the status.</li>\
<li><b>The job</b> - your objective and the enemy's; the target system and planet; the start and end dates (kept at \
least one month apart) and the length; and the scale and required victory points. An automatic start uses your travel \
time to the target world; an automatic end is the start plus the length.</li>\
<li><b>Employer / Opposition</b> - the faction (including generic Fallback Inner Sphere / Periphery / Clan placeholders \
for when you do not want a concrete faction), secret backer, the name shown, forces (skill and equipment rating), \
colour, camouflage, and the NPCs. The opposition also holds its morale, the batchall, and the rout, which apply only \
once the contract has started.</li>\
<li><b>Terms &amp; pay</b> - the pay-rate, support, transport, salvage, and command-rights steps, each a track of \
seventeen steps with its effect shown beside it (hover a step to see its effect before choosing it); the monthly, \
transport, and combat pay; and the rented facilities.</li>\
<li><b>Characteristics</b> - at most one from each line.</li>\
</ul>\
<p><b>Hidden intel.</b> A <i>Shown / Hidden</i> pill beside allied command, the opposition, its threat, and its morale \
hides that field from the player in the market, where the dossier shows No Intel instead.</p>\
<p><b>Locks.</b> A <i>Negotiable / Locked</i> pill beside each term marks it as one the employer will not negotiate. \
Locks can be changed only while the contract is still an offer.</p>\
<p><b>Home territory.</b> An employer's home territory is the nearby landed power the enemy is situated against (and \
whose active wars are checked if a running contract is later extended). It equals the employer faction for a landed \
employer and differs only for landless employers - nobles, corporations, businesses, and mercenary subcontracts - and \
for rebels, who anchor on the local government they rise against.</p>\
<p>The preview on the right shows how the offer will read on the board and what the player will see. Hover any \
field's label for a short description of what it controls.</p>\
</body></html>
<h2>Contract editor</h2>\
<p>This GM-only editor exposes every field of a contract market offer (or an accepted contract) so it can be hand-tuned. \
Faction and system fields are pickers rather than free text to avoid typos. On save the contract is rewritten in place.</p>\
<p><b>Automatic options.</b> Many fields carry an <i>Automatic</i> checkbox. When it is ticked the value is (re)computed \
on save using the same rules the contract generator uses, so you only need to set the fields you want to override. \
A few automatics (required combat elements, target planet, and NPC names and portraits) draw on random generation, so \
they are offered only while creating a new offer, not when editing an existing one.</p>\
<h3>Tabs</h3>\
<ul>\
<li><b>Identity</b> - the name and description, and (only for an accepted contract that has concluded) the status.</li>\
<li><b>Parameters</b> - the contract scale plus the required combat elements and victory points (track count is \
reserved for future use and has no effect yet).</li>\
<li><b>Schedule</b> - the start and end dates (kept at least one month apart) and the derived length. An automatic start \
uses your travel time to the target world; an automatic end is the start plus the length.</li>\
<li><b>Target</b> - the star system and planet the contract is fought over.</li>\
<li><b>Employer / Enemy</b> - the faction (including generic Fallback Inner Sphere / Periphery / Clan placeholders for \
when you do not want a concrete faction), sponsor, \
display name, force skill, equipment rating, colour, and camouflage.</li>\
<li><b>Terms</b> - the pay-rate, support, transport, salvage, and command-rights steps. Hover an option to see its effect.</li>\
<li><b>Objectives</b> - your objective and the enemy's.</li>\
<li><b>Finance</b> - the monthly, transport, and combat pay.</li>\
<li><b>Rented facilities</b> - the hospital beds, kitchens, and holding cells the contract provides.</li>\
<li><b>Morale</b> - the enemy morale level; the rout end date and payout apply only once the contract has started.</li>\
<li><b>NPCs</b> - the employer's negotiator and liaison and the opposing commander (name, rank, portrait).</li>\
</ul>\
<p><b>Anchor faction.</b> An employer's anchor is the nearby landed power the enemy is situated against (and whose \
active wars are checked if a running contract is later extended). It equals the employer faction for a landed employer \
and differs only for landless employers - nobles, corporations, businesses, and mercenary subcontracts - and for \
rebels, who anchor on the local government they rise against.</p>\
<p>Hover any field's label for a short description of what it controls.</p>\
</body></html>
