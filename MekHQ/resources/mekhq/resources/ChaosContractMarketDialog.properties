# The contact''s pitch, shown as a quote in the dossier. Adapted from FactionStandingGreeting to read as an offer being
# made rather than a contract already signed. Each pitch is composed of a GREETING (chosen by the hiring faction and by
# the campaign''s standing with that faction, banded positive / neutral / negative) followed by an ASK (chosen by the
# contract objective type and the same standing band). Both are written to work whether the player is a mercenary or a
# member of the hiring faction. {0} is the employer''s name. Apostrophes must be doubled ('') so MessageFormat does not
# swallow the {0} placeholder.
# Greetings
greeting.contractMarket.innersphere.positive=The confidence {1} places in your unit was earned through proven service. We are pleased to bring you onboard for this opportunity. Now, let us discuss the task before us.
greeting.contractMarket.innersphere.neutral={0} has a matter requiring capable hands and sound judgment. We believe this opportunity may be of interest to you. The details follow.
greeting.contractMarket.innersphere.negative={0} has reservations about the suitability of your unit for this operation, but the situation has left little room for preference. The opportunity is before you; what follows is up to you.
greeting.contractMarket.periphery.positive=The Great Houses of the Inner Sphere can afford to forget people''s names, but out here, good service is remembered. The people of {1} know your unit''s reputation, and we would be glad to have you with us. Now, let''s talk business.
greeting.contractMarket.periphery.neutral=Let''s skip out on the niceties and get down to brass tacks. {0} has a mission for your unit. Talk is cheap, but we value results.
greeting.contractMarket.periphery.negative=I''m your liaison with {1}. I know who you are. The Periphery is less forgiving than the Inner Sphere; our grudges outlast centuries. Just something to keep in mind while you review your new objectives.
greeting.contractMarket.clan.positive=You have earned honor in the eyes of {1}. Prove your worth as warriors again, and our respect shall rise commensurate to your station. Your next trial awaits.
greeting.contractMarket.clan.neutral={0} has need for warriors, and you have been bid towards the task. You will accomplish your mission with maximal efficacy, quiaf?
greeting.contractMarket.clan.negative={0} laments that you were not cut from the bid, but honor now demands we assign you an objective. May your deaths redeem your worth to the Clan. Your assignment follows.
greeting.contractMarket.capellan.positive=The service your unit has rendered to {1} has not gone unnoticed. The Chancellor remembers those who place duty above self, and the task before you is worthy of that confidence.
greeting.contractMarket.capellan.neutral={0} has need of disciplined and capable service for the good of the Chancellor and the people. This assignment has been deemed worthy of your attention, and we trust it shall receive your full commitment. The details are as follows.
greeting.contractMarket.capellan.negative=All under heaven must one day yield to the power of the Celestial Wisdom and {1}, including those who would oppose us. I invite you to consider this objective truth while you affirm your loyalty and appreciate the task ahead of you.
greeting.contractMarket.draconis.positive=The conduct of your unit has brought credit to both itself and {1}. It is therefore fitting that the Dragon once again entrusts you with a duty worthy of your service.
greeting.contractMarket.draconis.neutral={0} requires this task to be completed, and your unit has been selected to carry it out. Attend to your duty with the discipline and resolve it demands.
greeting.contractMarket.draconis.negative=It is a troubled time, when the Dragon is beset by yellow birds from without and within. Do not shame us both by faltering in your duty to {1} now. Your assignment awaits.
greeting.contractMarket.lyran.positive={0} is pleased to continue building this mutually beneficial partnership. The results you have produced so far have been well worth the investment, and we hope you can continue to deliver on that reputation in the assignment before you.
greeting.contractMarket.lyran.neutral={0} has identified a matter requiring experienced professionals and dependable judgment. The terms are favorable; the objective is clear. We believe this arrangement will serve both parties well. The details follow.
greeting.contractMarket.lyran.negative=You should work on improving your records and balancing your ledger if you hope to be seen as an attractive prospect. {0} isn''t in the business of charity; this mission is an incentive, not a gift. Pay attention.
greeting.contractMarket.federatedsuns.positive=Your unit has consistently demonstrated the sort of judgment and resolve upon which {1} were built. We would have no reservations placing this responsibility in your hands, and trust you will rise to the challenge.
greeting.contractMarket.federatedsuns.neutral={0} has a mission suitable for your unit. We ask that you meet the challenges ahead with the same courage and determination expected of all who serve the realm. Now, your duties.
greeting.contractMarket.federatedsuns.negative={0} may have a reputation as being full of idealists, but at heart we''re pragmatic. We look at what people do, provided what they''re doing is the right thing. Are you? Think it over while we review your tasking.
greeting.contractMarket.freeworlds.positive={0} has never lacked for strong opinions, yet your unit enjoys bipartisan respect. That is no small accomplishment, and we are pleased to call you to service again. Let''s see what you make of it.
greeting.contractMarket.freeworlds.neutral=Every world has its own concerns, every province its own priorities, so {1} is never short on work. You are now in the business of solving our problems.
greeting.contractMarket.freeworlds.negative={0} may be the only place where you can still expect real compromise. We are used to sleeping with our enemies for the sake of a greater good, and that generous wisdom is the gift we offer you now. Where was I? Ah, yes.
greeting.contractMarket.terran.positive=The standards of {1} are high, yet you have met them repeatedly. Excellence deserves recognition, and the Hegemony is proud to work with the best humanity has to offer. Now, to business.
greeting.contractMarket.terran.neutral={0} has identified a matter requiring capable execution and professional judgment. The expectations are high; the objective is important. Your unit will demonstrate the distinction between adequacy and excellence.
greeting.contractMarket.terran.negative={0} is more than a name alone; it is an expression of will to power. You must demonstrate similar impetus toward excellence in completing your objectives if you do not wish to leave us disappointed.
greeting.contractMarket.republic.positive=The strength of {1} lies in its people. As long as even a single person is willing to fight for the future we were promised, it can never fall. Stone''s Dream manifests in your very actions, never more so when in service of the Republic, as we call on you once more.
greeting.contractMarket.republic.neutral=What we have built together is worth preserving. {0} requires capable people to safeguard that future, and your unit has been chosen to answer that need. The details follow.
greeting.contractMarket.republic.negative={0} must stand together: for liberty and for security. The unspoken question posed to everyone else is, by necessity: do you stand with us, or against us? The Republic is watching, and your task awaits.
greeting.contractMarket.starleague.positive={0} was built on foundations greater than any single man, woman, or child; to further its ideals is to advance the interests of all mankind. Humanity will continue to expect great things from you in service to her steward.
greeting.contractMarket.starleague.neutral=It falls to capable people and strong institutions to shepherd humanity toward unity and prosperity. {0} calls upon you now to assume that responsibility.
greeting.contractMarket.starleague.negative=Many throughout the course of history have placed personal ambition ahead of the common good, and all of humanity has paid the price. Do not mistake this assignment for trust; as you review your objectives, consider instead the question of whether you serve the interests of humanity as a whole.
greeting.contractMarket.fedcom.positive={0} represents a new future for the Inner Sphere, forged out of Davion fire and Steiner steel. Your unit has already proven its worth to the sons and daughters of the Commonwealth, and that will not be forgotten. There is much still to do.
greeting.contractMarket.fedcom.neutral=I''m your liaison with {1}. Ours might be the greatest military since the Star League Defense Force, but if we ever aim to surpass that, we''ll need to keep relying on units like yours to make up the difference where we need it most.
greeting.contractMarket.fedcom.negative=These are dangerous games to be playing at dangerous times. {0} needs stable, dependable units it can count on to rise up to meet the many challenges we face. We hope you may yet prove to be one of them. Division and strife would only serve to tear us apart, so help us turn the tide.
greeting.contractMarket.rimworlds.positive={0} appreciates those with the vision to recognize opportunity for what it is when it presents itself. Your unit has demonstrated that rare quality, and we hope to make you an important element in our plans for a future that starts here and now.
greeting.contractMarket.rimworlds.neutral=The Inner Sphere concerns itself endlessly with the status quo. {0} intends to continue shaping its own destiny, a future rife with opportunities for those bold enough to play a part in it. So, let us begin.
greeting.contractMarket.rimworlds.negative={0} is pleased it can demonstrate to your outfit the practical principles behind keeping your friends close and your enemies closer. Perhaps you will take this lesson to heart while you dip your toes into our proverbial pond. Don''t forget there are sharks in the water.
greeting.contractMarket.taurian.positive=The freedoms enjoyed by the citizens of {1} were neither granted nor inherited; they were secured by generations willing to defend them to the last breath. Your unit has proven itself worthy of that tradition, which is why we have more work for you.
greeting.contractMarket.taurian.neutral=The Periphery was built on the simple belief that free people should decide their own future. {0} now requires willing men and women prepared to uphold that principle. Don''t let us down.
greeting.contractMarket.taurian.negative={0} has no patience for half-hearted commitments and vague excuses. You''re with us, or you''re against us, and there is no middle ground. Mess with the bull, and you get the horns. Now do your damn job.
greeting.contractMarket.canopus.positive={0} has never been shy about appreciating talent, and your unit has given us plenty to appreciate. We do hope you''ll continue to indulge us; it''s so much nicer when everyone gets what they want. Oh, of course, business first, then pleasure.
greeting.contractMarket.canopus.neutral=Life offers far too few worthwhile opportunities to ignore them when they appear. {0} has one such opportunity for you now, and we''d be delighted to see what you make of it. Try not to make us blush.
greeting.contractMarket.canopus.negative=We have heard all sorts of interesting and terrible things about your unit. Some were even flattering! Trust us when we say: we''re far more pleasant to work with than our enemies. Why don''t you show us exactly what you can mean to us?
greeting.contractMarket.outworlds.positive={0} has survived because good people sometimes fight back to protect what little they have. Those who prey on the meek should remember that the meek do not lack strong friends. You provide the Alliance with that strength. We are grateful to have friends like you in this unkind universe, especially as we have more to ask of you.
greeting.contractMarket.outworlds.neutral=We are not a great power, nor do we aspire to be one. The people of {1} simply wish to live in peace and determine their own future. Today, we must ask your help to preserve this fragile yet hopefully worthy desire.
greeting.contractMarket.outworlds.negative=Perhaps the Great Houses can afford to take gambles with the lives and homes of their people. {0} cannot. We will not be bullied or threatened without consequence. Do right by us on this, and we''ll do right by you.
greeting.contractMarket.marian.positive=The banners of {1} are carried by men and women willing to grasp greatness with both hands. Your unit has rendered glory unto Caesar, and so Caesar shall render glory upon you in turn. The eyes of history are upon us!
greeting.contractMarket.marian.neutral=History shall not remember the cautious or the comfortable. It shall remember those willing to prove their strength over their neighbor. {0} offers you an opportunity to demonstrate why the weak should fear the strong.
greeting.contractMarket.marian.negative=What use are you to be to Caesar? {0} has servants and legions to carry out its great pursuits, yet I suppose we must throw the dogs some scraps. Fetch us something worthwhile in this, and perhaps our estimation of your worth will improve.
greeting.contractMarket.comstar.positive=Trust is our most sacred gift. You will have begun to understand the weight of the Order''s charge, and perhaps even appreciate what would happen were {1}''s stewardship to fail. The work lies before you. Act decisively, act discreetly, and act with Blake''s wisdom.
greeting.contractMarket.comstar.neutral={0} is the custodian of Blessed Blake''s charge. By the skill of our technicians and the faith of our Precentors, light may reach even the most distant stars. We trust you appreciate the significance of what is being asked of you today.
greeting.contractMarket.comstar.negative={0} understands your trepidation: we are the paradox of faith and science. To outsiders that seems contradictory, but you cannot help but be ignorant to the nuance. Faith and knowledge are both artifacts of certainty; the difference lies solely in the foundations upon which they are built. We hope we may rely on more than faith when it comes to you today.
greeting.contractMarket.wordofblake.positive=You walk among us, blessed by the auspices of Saint Toyama and Saint Karpov. Great and magnificent will be the rewards bestowed upon the faithful, lest we are tempted away from our righteous path. We shall stand taller, true of flesh, and pure of conscience. Go, full of fire, and face those who would stand in sin against {1}.
greeting.contractMarket.wordofblake.neutral={0} is the salve that lightens the pain of those who suffer so needlessly in this world of cruelty and sin. We must purify mankind of those who would destroy it with their greed, and shield the faithful and deserving from their claws. You will do what must be done.
greeting.contractMarket.wordofblake.negative=All mankind is gifted with the power to choose: to embrace salvation, or to oppose the wisdom passed down to us by {1}. Worldly acts alone will not suffice to save you from the corruption and greed that surrounds you; that is the domain of faith alone. You, too, must choose today.
# Objective Ask
ask.contractMarket.garrison_duty.positive=Garrison duty is not glorious work, but it is crucial. Worlds are won or lost by those willing to endure long watches and fight off sudden and uncertain odds. This assignment calls for that sort of resolve.
ask.contractMarket.garrison_duty.neutral=This contract is straightforward: establish a military presence and maintain order. Should conditions deteriorate, you are our backstop.
ask.contractMarket.garrison_duty.negative=Many potential dangers loom on garrison duty, not least of which boredom and poor discipline. Lose control of your troops, and you risk losing control of our world.
ask.contractMarket.cadre_duty.positive=The soldiers placed under your instruction are eager and motivated. You will bridge that to martial excellence.
ask.contractMarket.cadre_duty.neutral=This is a cadre assignment. Your responsibility is to train our troops, improve their readiness, and prepare them for the realities of combat.
ask.contractMarket.cadre_duty.negative=Raw recruits are impressionable, for better and for worse. Focus on teaching them discipline, skill, and doctrine. We would prefer they not inherit too much else from you.
ask.contractMarket.security_duty.positive=This is a bodyguard deployment we cannot trust to just anyone. These assets are important, and you must protect them at all costs.
ask.contractMarket.security_duty.neutral=We have high-value assets that need to be protected against imminent threat. Establish a defensive perimeter, identify potential threats, and ensure the assets remain secure throughout the operation.
ask.contractMarket.security_duty.negative=Security work is often dull right up until it becomes disastrous. Stay alert, follow procedure, and keep a strict eye on your operational security. We cannot afford sloppy work.
ask.contractMarket.riot_duty.positive=Civil disobedience is boiling over into rioting, and local authorities are struggling to assert control. We need a trusted command that can tackle these disturbances both decisively and selectively.
ask.contractMarket.riot_duty.neutral=We have an out-of-control riot that needs to be addressed. Separate them from the compliant population and bolster local authorities.
ask.contractMarket.riot_duty.negative=We need you to bring a civil disturbance under control, ideally quickly and quietly, but we will settle for one or the other if you cannot deliver on both.
ask.contractMarket.planetary_assault.positive=This is an orbital drop, and we want you to be the tip of the spear. Land hard, and win this world in our name.
ask.contractMarket.planetary_assault.neutral=The target is no less than a world in enemy hands. The operational demands are steep, so prepare accordingly.
ask.contractMarket.planetary_assault.negative=You will find that the prize is a planet. Establish a beachhead and then make way for the rest of the attack force.
ask.contractMarket.relief_duty.positive=Our forces are in a pinch, so it is time to send in the cavalry. That is where you come in. Scatter the enemy and bring our people home.
ask.contractMarket.relief_duty.neutral=There is already a play in motion, and we are moving your unit onto the board. Relieve pressure on the units already committed and bolster the operation as needed.
ask.contractMarket.relief_duty.negative=We have troops under siege, and you are being deployed to relieve them before they are overrun. The qualitative approach must yield to urgency in this case.
ask.contractMarket.guerrilla_warfare.positive=Support will be minimal for this one, as we are letting you off the leash deep in the enemy heartland where you can be maximally disruptive. Do what you do best, and let us work the rest of the leverage.
ask.contractMarket.guerrilla_warfare.neutral=We have arranged an insertion behind enemy lines. Your mission there is to tie up enemy forces and erode their operational capacity through a protracted asymmetrical campaign.
ask.contractMarket.guerrilla_warfare.negative=The mission concerns a deniable disruption operation in hostile territory. Once you hit the ground, you are on your own until the arranged extraction. We will, naturally, deny being involved in the operation at all.
ask.contractMarket.pirate_hunting.positive=Intelligence has closed the noose on a suspected bandit operation. Now it is time to call in the big guns, put the boot to the door, and clear these brigands out. Good hunting.
ask.contractMarket.pirate_hunting.neutral=Opportunistic pirates have begun operating throughout this region, targeting private property and destroying public infrastructure. You are to impair their capacity to operate freely and destroy any hideouts you manage to identify.
ask.contractMarket.pirate_hunting.negative=We have a bandit problem we need you to solve. We do not expect them to offer significant resistance, but we cannot spare other forces for this duty at this time. Thankfully, you should be familiar with how these sorts of outfits operate.
ask.contractMarket.diversionary_raid.positive=Your mission here is to grab the enemy''s attention and keep them distracted while we put other pieces in play. They are probably expecting you to be the main thrust of our operations rather than the diversion, so just putting you in the field is likely to provoke the strong response we want.
ask.contractMarket.diversionary_raid.neutral=Your deployment is a feint meant to force an enemy response we can exploit to our advantage elsewhere. Once they take the bait, hold their attention for as long as needed and then clear out.
ask.contractMarket.diversionary_raid.negative=We need a worm to bait the hook on a diversionary attack and your unit seems suitable for this purpose. We only need you to last long enough for different assets to come through with their own objectives, nothing more, nothing less.
ask.contractMarket.objective_raid.positive=We have a series of mission objectives that need to be autonomously reconnoitered and destroyed. The operational constraints are strict, but that is why your unit was selected. Once you have achieved your objectives, we will stand ready to assist with exfiltration.
ask.contractMarket.objective_raid.neutral=This is a classic search and destroy task. Once you reach the area of operations, locate the specified objectives and then reduce their mission profile to zero using best judgment. Once all targets are destroyed or disabled, break off from any further engagements.
ask.contractMarket.objective_raid.negative=We have assigned you a series of strategic targets that we expect you to locate and destroy. The window of opportunity is narrow, so you will need to tighten your operations and ensure you are focused on the mission at hand.
ask.contractMarket.recon_raid.positive=The operation calls for a swift, targeted reconnaissance raid that will open up the battlespace for the other assets at our disposal. We need the intel to be accurate and reliable, so you get to be our eyes and ears on this one.
ask.contractMarket.recon_raid.neutral=We need your unit to perform a reconnaissance-in-force mission. Establish local superiority and engage enemy security forces as needed while you gather intelligence on key infrastructure and potential targets for follow-up operations.
ask.contractMarket.recon_raid.negative=In this operation, your objective is to forward deploy and gauge the quality of the enemy response while identifying key assets in the area. Should your intelligence prove adequate and actionable, it may be of use to us.
ask.contractMarket.extraction_raid.positive=We have key assets that need retrieval from behind enemy lines, so we are sending you in to ensure this is done expediently. Once the asset is in your hands, safeguard it against any potential response until your force can be extracted.
ask.contractMarket.extraction_raid.neutral=Your mission objective is asset retrieval. Proceed to the area of operations, reconnoiter the suspected positions, and locate your mission targets. Once you have them in sight, eliminate any security forces as required and ensure safe retrieval of the target assets.
ask.contractMarket.extraction_raid.negative=This is snatch-and-grab, so pay attention. The assets in question must be recovered urgently and fully intact, which means your overriding priority goes to ensuring they are safely extracted from enemy territory. Everything else is secondary.
ask.contractMarket.assassination.positive=Wetwork requires precision and skill, which is where you come in. After deorbiting, you are to locate, identify, and remove each high-value target from play. We will take control of the ensuing chaos in your wake.
ask.contractMarket.assassination.neutral=This is a sanctioned assassination mission. We will provide a list of targets and their strategic priority; your job is to positively identify the targets in the field, then eliminate them to disrupt enemy morale and impair their ability to operate.
ask.contractMarket.assassination.negative=Attached to this operational briefing is a kill-list. To be crystal clear: we need these targets eliminated, not merely disabled or compromised. Dead. This should not pose a significant challenge for your unit, I suspect.
ask.contractMarket.espionage.positive=Multiple intelligence assets are present in the mission area, and we need you to ride shotgun on their operations. You will need to adjust dynamically to their needs and provide direct assistance where your firepower can be most effective. You are the watchdog. Once we have the information we need, you bring everyone home.
ask.contractMarket.espionage.neutral=You will be supporting a military intelligence operation; we are looking to gather verifiable data on enemy capabilities for further assessment and analysis, beyond immediate observation. This will require balancing the dangers of exposing our intelligence assets to hostile contact with keeping the situation fluid enough for them to accomplish their missions.
ask.contractMarket.espionage.negative=The exact specifics of this mission are classified so as not to endanger our assets. All you need to know is that you are supporting an intelligence operation and you must follow the instructions provided to you by our field operatives to the letter.
ask.contractMarket.mole_hunting.positive=Intelligence reports suggest we are dealing with a series of moles, some of which may be able to sway local forces against you. We need you as a trusted actor isolated from potential enemy infiltration efforts to counteract the extent of their influence. You will liaise with counterintelligence efforts to first expose, and then dispose of these threats.
ask.contractMarket.mole_hunting.neutral=Rigorous internal review has suggested our operational security has been penetrated on the local level. We are positioning your unit as a third-party to catch out any traitors and their co-conspirators while we lay a series of canary traps to push them out into the open.
ask.contractMarket.mole_hunting.negative=This mission is operating under strict operational security. Only follow directives given to you by your assigned handler and eliminate any and all targets assigned to you without question, regardless of their apparent loyalty.
ask.contractMarket.observation_raid.positive=Several enemy units present in the mission area are giving us cause for concern. Should we lose track of their movements, they could seriously jeopardize our efforts in the region, which is why we need your unit to shadow their movements and be our tripwire.
ask.contractMarket.observation_raid.neutral=This is a close-proximity recon operation. Once you are deployed and have situated yourself in the battlespace, locate and identify your targets and then remain in soft contact with them as long as feasible. Go kinetic only when pressured.
ask.contractMarket.observation_raid.negative=We have several observation targets in need of additional verification. As this is a recon operation, you do not need to actually engage the enemy unless you allow yourself to be caught out.
ask.contractMarket.retainer.positive=Our current operational needs are fluid, so we are keeping you on retainer until we can structure strategic support around your unit''s presence and make use of your capabilities to the fullest.
ask.contractMarket.retainer.neutral=Your unit will be held in retainer by our local authorities to be deployed as needed as a security or rapid response force.
ask.contractMarket.retainer.negative=Currently we are still deciding what it is exactly you can do for us, so we are keeping you on retainer for the immediate future. Be ready to deploy once we find a use for you.
ask.contractMarket.sabotage.positive=Strategic analysis and recon efforts have identified key failure points in the enemy infrastructure. Those are your targets. Your unit is the shooter. Covertly cut through the enemy security presence and kick the legs out from under the enemy war effort. They will never know what hit them.
ask.contractMarket.sabotage.neutral=Your mission is the covert destruction of strategic infrastructure. You will need to retain a low mission profile, contend with enemy security and response forces, and destroy the target assets before the window of opportunity closes or the attack can be linked back to us.
ask.contractMarket.sabotage.negative=Appended you will find a list of locations and facilities; these are your mission targets. You must destroy them without attracting any attention to our involvement in this operation. Should that prove challenging, we will ensure the blame is deflected on the most obvious culprit.
ask.contractMarket.terrorism.positive=Sadly, the situation has deteriorated to the point that overt action is no longer feasible. We require a trusted force capable of operating through local assets and unconventional methods to undermine enemy control. If successful, your efforts may end this conflict before a broader war becomes necessary.
ask.contractMarket.terrorism.neutral=This operation concerns the cultivation and support of local resistance efforts in enemy-controlled territory. You will be expected to disrupt enemy authority, strengthen friendly elements, and ensure our involvement remains obfuscated.
ask.contractMarket.terrorism.negative=Officially, this operation does not exist. Your objectives are politically sensitive, so the methods employed to achieve effect must be deniable. Achieve the desired outcome and leave no trail leading back to us. All assets assigned to this operation are deemed expendable.
ask.contractMarket.undefined.positive=Unfortunately, some dimensions of this operation are still being put together, so the full briefing is not yet available. We are already confident you will be up to the task.
ask.contractMarket.undefined.neutral=Operational specifics and potential target priority and assignments are still being formulated, and the full briefing remains pending. You will be updated once your tasking has become more defined.
ask.contractMarket.undefined.negative=The mission specifics are still need-to-know at this time, and you do not yet need to know. Please ensure you remain at full readiness until that situation changes.
