instructions.contractMarket.board.body=<html><body style='width: 520px'>\
<h2>Contract market</h2>\
<p>This is the job board of contract offers available at your current location. Offers are drawn each month from the \
local hiring hall - a busier world offers more work - so if the board is thin, travel to a system with a stronger \
hiring hall (or, for government work, to one of your own faction's worlds) and check back after the next monthly \
report.</p>\
<p><b>Looking for.</b> The control at the top switches between the kinds of work on offer - Mercenary, Piracy, \
Government, and Tournament - each with its own set of offers.</p>\
<p><b>Reviewing an offer.</b> Select an offer to open its full briefing dossier: the employer and enemy, the terms, \
an intel assessment, and an estimated profit. From the dossier you can <b>Negotiate</b> to improve the terms, or \
<b>Accept</b> the contract. A GM can also <b>Edit</b> any offer.</p>\
<p><b>On acceptance.</b> The checkboxes below apply when you accept an offer:</p>\
<ul>\
<li><b>Mothball Units on Departure</b> - mothball eligible units before transit so they need no maintenance en route.</li>\
<li><b>Book Travel to the Contract System</b> - set a course for the target system on acceptance.</li>\
<li><b>Enable StratCon</b> - run the contract with a StratCon campaign state (shown only when your campaign uses \
StratCon).</li>\
</ul>\
<p><b>Buttons.</b> Close dismisses the board. A GM can <b>Generate New</b> to re-roll the month's offers or \
<b>Create New</b> to hand-build one, and <b>Delete All</b> to clear the board.</p>\
</body></html>
