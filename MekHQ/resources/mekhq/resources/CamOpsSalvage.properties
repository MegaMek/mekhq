# Teams page guide
SalvageOperationPlanner.guide.teams.button=How teams work
SalvageOperationPlanner.guide.teams.title=Picking salvage teams
SalvageOperationPlanner.guide.teams.step.1.title=Know what you're planning
SalvageOperationPlanner.guide.teams.step.1.text=After the battle, your teams recover the wrecks left on the field, and \
  your techs do the work. Pick the teams here, then the techs on the Techs page. Nothing changes until you commit, and \
  Cancel leaves the scenario as it was.
SalvageOperationPlanner.guide.teams.step.2.title=Read the board
SalvageOperationPlanner.guide.teams.step.2.text=Salvage teams are listed first, then combat teams. A green ring means \
  the team is free to stage. Amber means it's fighting in this scenario but may still salvage it. A faded ring means \
  it's already deployed, which includes combat teams fighting here, or has no units that \
  can salvage.
SalvageOperationPlanner.guide.teams.step.3.title=Check who may salvage this fight
SalvageOperationPlanner.guide.teams.step.3.text=The line under the page tabs says which rules apply. Under some \
  salvage systems, salvage teams can fight and still salvage the scenario. Combat teams never salvage a scenario they \
  fought in. The same line says who holds the battlefield afterward: if you don't, there is nothing to recover.
SalvageOperationPlanner.guide.teams.step.4.title=Narrow the list
SalvageOperationPlanner.guide.teams.step.4.text=Search by team, unit or tech name. Hide unavailable hides teams that \
  can't be staged, and Only with a TO&E tech hides teams with no tech of their own. Staged teams are always shown.
SalvageOperationPlanner.guide.teams.step.5.title=Open the dossier
SalvageOperationPlanner.guide.teams.step.5.text=Click a team to see each of its units: how much it can drag, how much \
  cargo it can carry, and whether it can salvage at all. A unit may be unable to work in this environment, be beyond \
  repair, or be unable to move.
SalvageOperationPlanner.guide.teams.step.6.title=Stage the teams you want
SalvageOperationPlanner.guide.teams.step.6.text=Double-click a team, press Space, or use Stage. Staged teams gather in \
  the tray below the dossier; double-click one there to unstage it.
SalvageOperationPlanner.guide.teams.step.7.title=Read the tiles
SalvageOperationPlanner.guide.teams.step.7.text=Teams counts what you've staged and their salvage-capable units. Best \
  cargo and Best tow show the most any single staged unit can carry or drag, a quick check on how heavy a wreck your \
  teams can handle. In space, Best tow becomes Naval tug, needed for DropShips and larger. Capacities are from before \
  the fighting.
SalvageOperationPlanner.guide.teams.step.8.title=Move on to the techs
SalvageOperationPlanner.guide.teams.step.8.text=Use Next: Techs. Staged teams bring their own techs and crews with \
  them. You can't commit teams without techs, or techs without teams; staging nothing at all skips salvage.
SalvageOperationPlanner.guide.teams.example.1.who=You
SalvageOperationPlanner.guide.teams.example.1.text=Convoy Hijack. I hold the field afterward, so there will be \
  wrecks to recover. My recovery company, Recovery Operations, has a green ring.
SalvageOperationPlanner.guide.teams.example.2.who=Dossier
SalvageOperationPlanner.guide.teams.example.2.text=Three BattleMech recovery vehicles drag 50 t and carry 60 t each. \
  A Büffel engineering vehicle drags 70 t and carries 142.5 t. All four can salvage.
SalvageOperationPlanner.guide.teams.example.3.who=You
SalvageOperationPlanner.guide.teams.example.3.text=I double-click it to stage it. My lances are fighting, so they \
  can't salvage this one anyway.
SalvageOperationPlanner.guide.teams.example.4.who=Tiles
SalvageOperationPlanner.guide.teams.example.4.text=1 team, 4 salvage-capable units. Best cargo 142.5 t, best tow \
  70 t. On to the Techs page.
SalvageOperationPlanner.guide.teams.term.1.name=Salvage team
SalvageOperationPlanner.guide.teams.term.1.text=A formation set to the Salvage type. It's built to recover wrecks \
  rather than fight, and some salvage systems let it fight and still salvage the scenario.
SalvageOperationPlanner.guide.teams.term.2.name=Combat team
SalvageOperationPlanner.guide.teams.term.2.text=A formation that fights. It can salvage a scenario only if it didn't \
  fight in it.
SalvageOperationPlanner.guide.teams.term.3.name=Staged
SalvageOperationPlanner.guide.teams.term.3.text=Picked for this salvage operation. With StratCon, staged teams are \
  deployed to the scenario when you commit.
SalvageOperationPlanner.guide.teams.term.4.name=Drag (tow)
SalvageOperationPlanner.guide.teams.term.4.text=How heavy a wreck a unit can drag off the field: its own weight, less \
  any trailers it's already towing. 'Meks need two working hands, and trailers can't tow.
SalvageOperationPlanner.guide.teams.term.5.name=Cargo
SalvageOperationPlanner.guide.teams.term.5.text=How many tons of salvage a unit can carry.
SalvageOperationPlanner.guide.teams.term.6.name=Naval tug
SalvageOperationPlanner.guide.teams.term.6.text=In space, a vessel able to haul DropShips and larger wrecks. Without \
  one, those wrecks stay where they are.
SalvageOperationPlanner.guide.teams.term.7.name=Battlefield control
SalvageOperationPlanner.guide.teams.term.7.text=Who holds the field once the fighting ends. Only the side that holds it \
  can recover the wrecks.
# Techs page guide
SalvageOperationPlanner.guide.techs.button=How techs work
SalvageOperationPlanner.guide.techs.title=Picking the salvage crew
SalvageOperationPlanner.guide.techs.step.1.title=Start from your teams' techs
SalvageOperationPlanner.guide.techs.step.1.text=Every staged team brings its TO&E tech, and its units' tech crews. They \
  are listed first, tagged Team tech or Crew. Add salvage supervisors from the rest of your techs to cover more \
  wrecks.
SalvageOperationPlanner.guide.techs.step.2.title=Find the right techs
SalvageOperationPlanner.guide.techs.step.2.text=Search by name, rank, role or unit, and sort by minutes left, skill or \
  name. The filters hide injured or pregnant techs, techs assigned to units, or everyone but one experience level. The \
  note under the list counts who is hidden, and Show all clears the filters. Techs you've picked are always shown.
SalvageOperationPlanner.guide.techs.step.3.title=Open the dossier
SalvageOperationPlanner.guide.techs.step.3.text=Click a tech to see their minutes left today, their fatigue, their Edge \
  and their injuries. The status line below lists anything else to weigh, such as an injury or a job in progress.
SalvageOperationPlanner.guide.techs.step.4.title=Add them to the crew
SalvageOperationPlanner.guide.techs.step.4.text=Double-click a tech, press Space, or use Select. The salvage crew \
  gathers in the tray below the dossier; double-click a tech there to leave them behind.
SalvageOperationPlanner.guide.techs.step.5.title=Watch the Tech time tile
SalvageOperationPlanner.guide.techs.step.5.text=It adds up the crew's minutes. The amber mark on its bar is the \
  recommended minimum, 360 minutes: about enough for six 'Meks, or a DropShip and three aerospace fighters. Below it, \
  the tile turns amber and you're warned when you commit.
SalvageOperationPlanner.guide.techs.step.6.title=Plan for more than the minimum
SalvageOperationPlanner.guide.techs.step.6.text=The mark is a rough guide, not a guarantee. Bad weather, wind, extreme \
  temperatures, odd gravity, vacuum and darkness all make each recovery take longer. Time beyond the mark lets the crew \
  recover more wrecks, or the same wrecks in worse conditions.
SalvageOperationPlanner.guide.techs.step.7.title=Know what it costs
SalvageOperationPlanner.guide.techs.step.7.text=The time the recovery takes comes out of the crew's minutes for the day, \
  shared as evenly as their time allows. Those minutes aren't available for repairs or maintenance.
SalvageOperationPlanner.guide.techs.step.8.title=Mind the risk
SalvageOperationPlanner.guide.techs.step.8.text=With risky salvage on, every wreck recovered carries a small chance of an \
  accident that injures a random member of the crew, sometimes fatally. The chance is per wreck, so a bigger crew \
  spreads the risk rather than adding to it. A tech with the right Edge can spend it to avoid an accident.
SalvageOperationPlanner.guide.techs.step.9.title=Commit
SalvageOperationPlanner.guide.techs.step.9.text=Commit salvage operation writes the plan to the scenario. Once the \
  battle is resolved, you'll choose which wrecks to recover.
SalvageOperationPlanner.guide.techs.example.1.who=You
SalvageOperationPlanner.guide.techs.example.1.text=Staging Recovery Operations brought one tech with it, with 432 \
  minutes left. The bar is past the amber mark.
SalvageOperationPlanner.guide.techs.example.2.who=Tech time
SalvageOperationPlanner.guide.techs.example.2.text=432 min, 1 tech. Green: above the recommended minimum of 360.
SalvageOperationPlanner.guide.techs.example.3.who=You
SalvageOperationPlanner.guide.techs.example.3.text=The forecast is a storm, and recovery takes longer in bad weather. I \
  sort by minutes left, hide injured techs, and add a Veteran supervisor with 480 minutes.
SalvageOperationPlanner.guide.techs.example.4.who=Tech time
SalvageOperationPlanner.guide.techs.example.4.text=912 min, 2 techs. Enough headroom for the weather, and any accident \
  now falls on one of two techs.
SalvageOperationPlanner.guide.techs.term.1.name=Tech time
SalvageOperationPlanner.guide.techs.term.1.text=The work minutes the crew has left today. Each wreck recovered uses some, \
  more in poor conditions.
SalvageOperationPlanner.guide.techs.term.2.name=Recommended minimum
SalvageOperationPlanner.guide.techs.term.2.text=The amber mark on the Tech time bar, at 360 minutes. Below it, few \
  wrecks fit in the time you have.
SalvageOperationPlanner.guide.techs.term.3.name=Team tech
SalvageOperationPlanner.guide.techs.term.3.text=The tech assigned to a staged team in the TO&E. Joins the crew \
  automatically.
SalvageOperationPlanner.guide.techs.term.4.name=Crew
SalvageOperationPlanner.guide.techs.term.4.text=The tech assigned to a unit in a staged team. Joins the crew \
  automatically.
SalvageOperationPlanner.guide.techs.term.5.name=Supervisor
SalvageOperationPlanner.guide.techs.term.5.text=Any other tech you add by hand. Unstaging a team never removes them.
SalvageOperationPlanner.guide.techs.term.6.name=Risky salvage
SalvageOperationPlanner.guide.techs.term.6.text=A campaign option. Each wreck recovered can cause an accident that \
  injures one of the crew.
SalvageOperationPlanner.guide.techs.term.7.name=Fatigue
SalvageOperationPlanner.guide.techs.term.7.text=How worn out a tech is. Highly fatigued techs are flagged amber.
SalvageOperationPlanner.guide.techs.term.8.name=Edge
SalvageOperationPlanner.guide.techs.term.8.text=Luck a tech can spend. A tech with the salvage-accident Edge trigger \
  spends a point to try to avoid an accident.
