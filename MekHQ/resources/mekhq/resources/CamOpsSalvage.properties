# the next number is missing, so lines can be added or removed without code changes.
SalvageRecoveryConsole.guide.button=How salvage works
SalvageRecoveryConsole.guide.button.toolTipText=Open the guide to salvage recovery
SalvageRecoveryConsole.guide.alwaysOpen=Show every time I open this
SalvageRecoveryConsole.guide.close=Got it
SalvageRecoveryConsole.guide.tab.steps=Steps
SalvageRecoveryConsole.guide.tab.example=Example
