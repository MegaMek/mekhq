SalvageRecoveryConsole.guide.eyebrow=Guide · Salvage Recovery
SalvageRecoveryConsole.guide.title=Recovering the wrecks
SalvageRecoveryConsole.guide.exampleIntro=A short example. Your own battlefield will be different.
SalvageRecoveryConsole.guide.glossary=In the Glossary
SalvageRecoveryConsole.guide.step.1.title=Know what you're deciding
SalvageRecoveryConsole.guide.step.1.text=Every wreck left on the field is listed, most valuable first. For each one you \
  decide how it's recovered and who gets it. Under salvage systems without salvage teams, every wreck is already \
  recovered, so you only choose who gets it. There's no cancelling: the salvage must be settled here.
SalvageRecoveryConsole.guide.step.2.title=Read the header
SalvageRecoveryConsole.guide.step.2.text=The chips beside the title show what the conditions add to every recovery's \
  time, such as weather or gravity, and the total multiplier. The tiles show your salvage rights, what the salvage is \
  worth to you and your employer, and the tech time you have to work with.
SalvageRecoveryConsole.guide.step.3.title=Read the board
SalvageRecoveryConsole.guide.step.3.text=Each card shows the wreck's tonnage, how long it takes to recover, how many of \
  that variant and chassis you already own, and its value. Use the chips above the board to show only wrecks that are \
  unassigned, have a problem, or are recovered.
SalvageRecoveryConsole.guide.step.4.title=Assign salvage units
SalvageRecoveryConsole.guide.step.4.text=Select a wreck, then pick a salvage unit as Unit 1, or double-click one in the \
  Salvage units list. Add a Unit 2 to team up on a wreck too heavy for one unit. The list shows what each unit has left \
  to give, and what it's already doing.
SalvageRecoveryConsole.guide.step.5.title=Carry or drag
SalvageRecoveryConsole.guide.step.5.text=Carry puts the wreck in one unit's cargo; only one unit can carry a wreck. Drag \
  uses towing capacity, and two units can drag together, but dragging ties a unit to that one wreck. Under some salvage \
  systems, a unit carrying a wreck can carry more while it has room.
SalvageRecoveryConsole.guide.step.6.title=Recovering in space
SalvageRecoveryConsole.guide.step.6.text=There's no dragging in space. Fighters and small craft need a free bay with \
  working doors, and DropShips and larger need a naval tug.
SalvageRecoveryConsole.guide.step.7.title=Watch the tech time
SalvageRecoveryConsole.guide.step.7.text=Every wreck recovered uses tech time, multiplied by the conditions. The Tech \
  time tile counts it against what your salvage crew has; you can't recover more than they have time for.
SalvageRecoveryConsole.guide.step.8.title=Or auto-assign
SalvageRecoveryConsole.guide.step.8.text=Auto-assign fills in the unassigned wrecks, most valuable first and within your \
  tech time, using the smallest unit that can manage each one. It leaves your own choices alone. Clear all removes \
  every assignment.
SalvageRecoveryConsole.guide.step.9.title=Choose who gets it
SalvageRecoveryConsole.guide.step.9.text=Under Claim, Employer hands a recovered wreck over; on some contracts you're paid \
  your share of its value. Keep makes it yours, which counts toward any salvage cap, or Buy pays your employer the \
  rest of its value. Sell turns it into cash now. Which choices you get depends on the contract.
SalvageRecoveryConsole.guide.step.10.title=Weigh stealing it
SalvageRecoveryConsole.guide.step.10.text=Where it's offered, Accept (Steal) keeps every recovered wreck, even those set to \
  Employer, and pays nothing. It breaches your contract, which ends at once with no further pay.
SalvageRecoveryConsole.guide.step.11.title=Confirm
SalvageRecoveryConsole.guide.step.11.text=Confirm salvage settles everything and can't be undone; wrecks you didn't \
  recover are left behind. If it's greyed out, hover over it to see why.
SalvageRecoveryConsole.guide.example.1.who=You
SalvageRecoveryConsole.guide.example.1.text=The Wolverine weighs 55 t and is worth 965K. I set a BattleMech Recovery \
  Vehicle as Unit 1 and choose Carry: its 60 t of cargo is enough.
SalvageRecoveryConsole.guide.example.2.who=Tech time
SalvageRecoveryConsole.guide.example.2.text=60 / 432 min. 372 min left.
SalvageRecoveryConsole.guide.example.3.who=You
SalvageRecoveryConsole.guide.example.3.text=My salvage rights are 20%. Employer would pay me 193K in cash; Buy costs 772K \
  for the rest. I already own a Wolverine, but I'll take another, so I buy it.
SalvageRecoveryConsole.guide.example.4.who=You
SalvageRecoveryConsole.guide.example.4.text=I auto-assign the rest, leave the foot platoons with my employer for the \
  cash, and confirm.
SalvageRecoveryConsole.guide.term.1.name=Salvage rights
SalvageRecoveryConsole.guide.term.1.text=Your share of the salvage under the contract: either a share of each wreck, or a \
  cap on how much of the contract's salvage you can keep.
SalvageRecoveryConsole.guide.term.2.name=Salvage cap
SalvageRecoveryConsole.guide.term.2.text=The most of the contract's total salvage you may keep. Going over it stops you \
  confirming.
SalvageRecoveryConsole.guide.term.3.name=Cash share
SalvageRecoveryConsole.guide.term.3.text=What your employer pays you for your share of wrecks you hand over to them.
SalvageRecoveryConsole.guide.term.4.name=Recovery time
SalvageRecoveryConsole.guide.term.4.text=The tech time a wreck takes to recover: its base time, multiplied by the \
  conditions. Hover over a wreck's details to see the breakdown.
SalvageRecoveryConsole.guide.term.5.name=Carry
SalvageRecoveryConsole.guide.term.5.text=Bringing a wreck back in a unit's cargo space.
SalvageRecoveryConsole.guide.term.6.name=Drag
SalvageRecoveryConsole.guide.term.6.text=Towing a wreck off the field. Two units' towing capacity can be combined.
SalvageRecoveryConsole.guide.term.7.name=Naval tug
SalvageRecoveryConsole.guide.term.7.text=A vessel able to haul DropShips and larger wrecks in space.
SalvageRecoveryConsole.guide.term.8.name=Problem
SalvageRecoveryConsole.guide.term.8.text=A wreck whose assigned units can't recover it, such as one too heavy for their \
  cargo. Fix or clear it before you confirm.
SalvageRecoveryConsole.guide.term.9.name=Stealing
SalvageRecoveryConsole.guide.term.9.text=Keeping every recovered wreck without paying for it. It breaches the contract.
