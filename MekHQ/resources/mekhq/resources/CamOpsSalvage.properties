SalvagePostScenarioPicker.tutorial=Below you will see a list of units that are currently available for salvage. Two \
  boxes exist for you to pick units to tow/drag, carry (in cargo), recover (using SC or ASF bay equipment) or tug \
  (using a Naval Tug Adaptor) your salvage. \
  The rules for this can be found in <i>Campaign Operations</i>. MekHQ will automatically pick whether to tow or \
  carry automatically, based on a unit's capacity.\
  <p>Once you have arranged for salvage to be transported, you need to decide whether you want to claim it. You do so \
  by ticking one of the boxes to the left of the salvaged unit.\
  <p>The box marked with \u267B is for keeping the salvage. The other box is for selling the salvage immediately. Any\
  \ salvaged units not claimed will be given to your employer.</p>\
  <p>Note that salvage not assigned transports (via the drop-down boxes) will be abandoned to the enemy. Neither you,\
  \ nor your employer will gain access to it. As per the official rules, you only have one chance to salvage the \
  field. Any abandoned salvage will be permanently lost. The label for each item of salvage has a <b>detailed \
  tooltip</b> breaking down how long it takes to salvage.</p>
SalvagePostScenarioPicker.tutorial.sharedCapacity=<p><b>Carrying several wrecks:</b> a unit carrying salvage in \
  its cargo can take as many wrecks as will fit, so you can pick it again for other salvage. In space, fighters and \
  small craft are instead carried in bays with working doors, one per bay; small craft need small craft bays. The \
  drop-down boxes show how much room each carrier has left. Where a unit could either carry or drag a wreck, choose \
  which using the box beside its drop-downs.</p>\
  <p>A unit either carries salvage or drags (or tugs) it; never both. A unit that drags or tugs salvage, or that is \
  paired with a second unit on the same wreck, is committed to that wreck alone.</p>
SalvagePostScenarioPicker.tutorial.automaticRecovery=Below you will see a list of units recovered from the \
  field. Your employer handles the recovery, so every wreck is brought in automatically; there are no salvage teams \
  to assign.
SalvagePostScenarioPicker.tutorial.purchases=<p><b>Buying salvage:</b> your salvage rights entitle you to {0}% of \
  the value of each recovered unit. By default, that share is paid to you in cash. Tick a unit''s <b>Buy</b> box to \
  keep the unit instead, by paying your employer their share of its value. You can''t buy more than your funds \
  allow.</p>
SalvagePostScenarioPicker.cashShare=<html><b>Cash Share:</b> {0} C-Bills
SalvagePostScenarioPicker.purchaseCost=<html><b>Purchase Cost:</b> {0} / {1} C-Bills available
