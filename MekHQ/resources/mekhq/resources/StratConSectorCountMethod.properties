StratConSectorCountMethod.LEGACY.label=Legacy (one sector per company)
StratConSectorCountMethod.LEGACY.tooltip=StratCon generates one sector for every three combat teams the contract \
  requires, plus a smaller sector for any remainder. Sectors use the historical fixed size rather than being scaled \
  to the force that must scout them. This is how StratCon behaved prior to 51.01.
StratConSectorCountMethod.ALTERNATE.label=Alternate (one sector per battalion)
StratConSectorCountMethod.ALTERNATE.tooltip=StratCon generates roughly one sector for every nine combat teams the \
  contract requires. This produces fewer, larger sectors than the legacy count for the same force size, with each \
  sector scaled to the recon that must sweep it.
StratConSectorCountMethod.CONDENSED.label=Alternate-Condensed (ten sectors)
StratConSectorCountMethod.CONDENSED.tooltip=As Alternate, but StratCon will not generate more than ten sectors. A \
  force large enough to generate more instead receives ten proportionally larger sectors, preserving the total map \
  area. These enlarged sectors require proportionally more combat teams to scout and hold. The one exception is a \
  contract so large that ten sectors could not hold it without each fronting more than a regiment; past that point \
  further sectors are generated rather than letting any one of them exceed the maximum sector size.
StratConSectorCountMethod.REGIMENTAL.label=Alternate-Regimental (one sector per 5 battalions)
StratConSectorCountMethod.REGIMENTAL.tooltip=As Alternate, but StratCon generates roughly one sector for every \
  forty-five combat teams the contract requires - a five-battalion regiment. Anything up to a regiment is fought over\
  \ a single sector, scaled to the whole force, so this produces far fewer and far larger sectors than any other \
  method. Where a regiment is more ground than one sector can hold - on a wet world, a large world, or with a raised \
  size multiplier - the contract is split into further sectors rather than any of them being cut short, so the total \
  map area is preserved either way.
