StratConSectorCountMethod.LEGACY.label=Legacy (one sector per company)
StratConSectorCountMethod.LEGACY.tooltip=StratCon generates one sector for every three combat teams the contract \
  requires, plus a smaller sector for any remainder. Sectors use the historical fixed size rather than being scaled \
  to the force that must scout them. This is how StratCon behaved prior to 51.01.
StratConSectorCountMethod.ALTERNATE.label=Alternate (one sector per battalion)
StratConSectorCountMethod.ALTERNATE.tooltip=StratCon generates roughly one sector for every nine combat teams the \
  contract requires. This produces fewer, larger sectors than the legacy count for the same force size, with each \
  sector scaled to the recon that must sweep it.
StratConSectorCountMethod.CONDENSED.label=Alternate-Condensed (never more than ten)
StratConSectorCountMethod.CONDENSED.tooltip=As Alternate, but StratCon will never generate more than ten sectors. A \
  force large enough to generate more instead receives ten proportionally larger sectors, preserving the total map \
  area. These enlarged sectors require proportionally more combat teams to scout and hold.
StratConSectorCountMethod.SINGLE.label=Alternate-Single Sector
StratConSectorCountMethod.SINGLE.tooltip=As Alternate, but StratCon generates exactly one sector, however large the \
  contract. The sector is scaled accordingly, so a large contract produces a large map. Huge contracts will reach the\
  \ maximum sector size (around 430 required combat teams), at which point further ground is lost rather than the \
  sector growing without limit.
