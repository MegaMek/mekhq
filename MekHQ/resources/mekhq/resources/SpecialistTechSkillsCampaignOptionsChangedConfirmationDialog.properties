SpecialistTechSkillsCampaignOptionsChangedConfirmationDialog.description=<h1 style="text-align:center">Specialist Tech Skills</h1>\
  You have just enabled the granular specialist tech skills in a campaign that previously used only the global tech \
  skills.\
  <p>Your existing technicians were never given the specialist skills (<i>Tech/Weapons</i>, <i>Tech/Electronic</i>, and \
  the like), so until they gain them their repairs will fall back on their global tech skill.</p>\
  <p>Would you like to give every technician the supplemental specialist skills their profession expects now, matched \
  to the level of their global tech skill? Non-technicians are left unchanged.</p>
SpecialistTechSkillsCampaignOptionsChangedConfirmationDialog.cancel=Decline
SpecialistTechSkillsCampaignOptionsChangedConfirmationDialog.confirm=Accept
