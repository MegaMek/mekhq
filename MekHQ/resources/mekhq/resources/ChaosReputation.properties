# Personnel-derived reputation
guide.personnel.eyebrow=Guide · Reputation from personnel
guide.personnel.title=Reading the report
guide.personnel.step.1.title=Start with the Reputation tile
guide.personnel.step.1.text=The large number at the top is your force's Chaos Campaign Reputation, the same figure \
  the Command Center shows. The rest of the report explains how it was reached.
guide.personnel.step.2.title=Your people set the base
guide.personnel.step.2.text=Each active, employed person has an adjusted reputation: their own reputation plus their \
  fame, connections and criminal record, and their personality if that option is on. The report averages them into \
  the Average Reputation row. Big Personality counts a person twice; Unrecorded Presence leaves them out.
guide.personnel.step.3.title=Modifiers are added to the average
guide.personnel.step.3.text=The debt penalty, the manual modifier from the campaign options, and the commander's \
  traits are added next. Green values raise the total and red values lower it.
guide.personnel.step.4.title=The cap holds it down
guide.personnel.step.4.text=If the campaign options set a reputation cap, a total above it is lowered to the cap. The \
  cap row turns amber when that happens, and the tile says so.
guide.personnel.step.5.title=See who is pulling the average
guide.personnel.step.5.text=Personnel Reputation shows how many people share each value. A long bar at a low value \
  means many people are holding the average down, often new hires.
guide.personnel.step.6.title=Experience is shown beside it
guide.personnel.step.6.text=The right side counts your combat roles at each experience level and gives their \
  average. It describes the quality of your force; it is not part of the reputation total.
guide.personnel.step.7.title=Hover for detail
guide.personnel.step.7.text=Every row of figures has a tooltip explaining where its number comes from.
guide.personnel.example.1.who=You
guide.personnel.example.1.text=Why is our reputation only 2?
guide.personnel.example.2.who=Report
guide.personnel.example.2.text=Average Reputation 4. Debt Penalty -2, from one loan that is seven months old. Manual \
  Modifier 0. Other Modifier 0. Total Reputation 2.
guide.personnel.example.3.who=You
guide.personnel.example.3.text=So the loan costs us two points. And the spread shows eleven people at 1: the recruits \
  we took on last month are dragging the average down.
guide.personnel.example.4.who=Report
guide.personnel.example.4.text=Pay off the loan and the total rises to 4. Each successful contract also raises the \
  reputation of every employed person, normally by 1.
guide.personnel.term.1.name=Adjusted reputation
guide.personnel.term.1.text=One person's reputation once their fame, connections, criminal record and (if the option \
  is on) personality are added to it. These are the values the report averages.
guide.personnel.term.2.name=Debt penalty
guide.personnel.term.2.text=Each loan costs 1, plus 1 more for every six months it has been outstanding. Only the \
  oldest loan counts unless the campaign options stack the penalties. The commander's Silver Tongue halves it; Loan \
  Shark Victim doubles it.
guide.personnel.term.3.name=Other modifier
guide.personnel.term.3.text=The commander's traits: +1 each for Combat Sense and Impressive Leader, -1 each for \
  Combat Paralysis and Disappointing Leader.
guide.personnel.term.4.name=Manual modifier
guide.personnel.term.4.text=A fixed adjustment set in the campaign options, for house rules or story events.
guide.personnel.term.5.name=Reputation cap
guide.personnel.term.5.text=The highest total the campaign options allow. A cap of 0 means there is none.
guide.personnel.term.6.name=Combat role
guide.personnel.term.6.text=A person's primary or secondary combat profession. Someone with two combat roles counts \
  twice in the experience figures.
# Campaign-level reputation
guide.campaign.eyebrow=Guide · Campaign-level reputation
guide.campaign.title=Reading the report
guide.campaign.step.1.title=Start with the Reputation tile
guide.campaign.step.1.text=The large number at the top is your force's Chaos Campaign Reputation, the same figure \
  the Command Center shows. The rest of the report explains how it was reached.
guide.campaign.step.2.title=One value for the whole force
guide.campaign.step.2.text=Your reputation is tracked at the campaign level: a single Campaign Reputation that changes \
  through events. A successful contract adds 1, a failed one can cost 1 if that option is on, and breaking a contract \
  halves it (a loss of at least 3). Contract traits can scale these changes, and piracy, executing prisoners and \
  random events can move it too.
guide.campaign.step.3.title=Modifiers are applied live
guide.campaign.step.3.text=The debt penalty, the manual modifier and the commander's traits are added each time the \
  reputation is shown, never stored. Paying off a loan removes its penalty straight away.
guide.campaign.step.4.title=The cap holds it down
guide.campaign.step.4.text=If the campaign options set a reputation cap, a total above it is lowered to the cap. The \
  cap row turns amber when that happens, and the tile says so.
guide.campaign.step.5.title=Your people do not change it
guide.campaign.step.5.text=Hiring, losing or training personnel does not move a campaign-level reputation, so there is \
  no personnel spread. The right side still shows your force's experience, which describes its quality.
guide.campaign.step.6.title=Hover for detail
guide.campaign.step.6.text=Every row of figures has a tooltip explaining where its number comes from.
guide.campaign.example.1.who=Report
guide.campaign.example.1.text=Campaign Reputation 5. Debt Penalty -1, from a loan taken last month. Other Modifier \
  +1, for the commander's Impressive Leader. Total Reputation 5.
guide.campaign.example.2.who=You
guide.campaign.example.2.text=We break our next contract.
guide.campaign.example.3.who=Report
guide.campaign.example.3.text=Half of 5 rounds up to 3, so the Campaign Reputation falls to 2 and the total to 2.
guide.campaign.example.4.who=You
guide.campaign.example.4.text=Then we pay off the loan.
guide.campaign.example.5.who=Report
guide.campaign.example.5.text=The debt penalty is gone at once. Total Reputation 3.
guide.campaign.term.1.name=Campaign reputation
guide.campaign.term.1.text=The single value your force earns and loses through contracts and other events, before any \
  modifiers are added.
guide.campaign.term.2.name=Debt penalty
guide.campaign.term.2.text=Each loan costs 1, plus 1 more for every six months it has been outstanding. Only the \
  oldest loan counts unless the campaign options stack the penalties. The commander's Silver Tongue halves it; Loan \
  Shark Victim doubles it.
guide.campaign.term.3.name=Other modifier
guide.campaign.term.3.text=The commander's traits: +1 each for Combat Sense and Impressive Leader, -1 each for \
  Combat Paralysis and Disappointing Leader.
guide.campaign.term.4.name=Manual modifier
guide.campaign.term.4.text=A fixed adjustment set in the campaign options, for house rules or story events.
guide.campaign.term.5.name=Reputation cap
guide.campaign.term.5.text=The highest total the campaign options allow. A cap of 0 means there is none.
guide.campaign.term.6.name=Combat role
guide.campaign.term.6.text=A person's primary or secondary combat profession. Someone with two combat roles counts \
  twice in the experience figures.
