PilotingMek.flavorText=Used for piloting skill checks while piloting a 'Mek.
PilotingAerospace.flavorText=Used for piloting skill checks while piloting an AeroSpace Fighter.
PilotingAircraft.flavorText=Used for piloting skill checks while piloting a Conventional Fighter.
PilotingGroundVehicle.flavorText=Used for piloting skill checks while driving a Ground Vehicle.
PilotingVTOL.flavorText=Used for piloting skill checks while driving a VTOL Vehicle.
PilotingNaval.flavorText=Used for piloting skill checks while driving a Naval Vehicle.
PilotingSpacecraft.flavorText=Used for piloting skill checks while piloting a spacecraft, such as a WarShip or DropShip.
PilotingProtoMek.flavorText=Used for piloting skill checks while piloting a ProtoMek.
GunneryMek.flavorText=Used for gunnery skill checks while piloting a 'Mek.
GunneryAerospace.flavorText=Used for gunnery skill checks while piloting an AeroSpace Fighter.
GunneryAircraft.flavorText=Used for gunnery skill checks while piloting a Conventional Fighter.
GunneryVehicle.flavorText=Used for gunnery skill checks while crewing any Vehicle.
GunnerySpacecraft.flavorText=Used for gunnery skill checks while crewing a spacecraft, such as a WarShip or DropShip.
GunneryBattleArmor.flavorText=Used for gunnery skill checks while piloting Battle Armor.
GunneryProtoMek.flavorText=Used for gunnery skill checks while piloting a ProtoMek.
Artillery.flavorText=Used for gunnery skill checks with artillery weapons (if the appropriate campaign option is \
  enabled).
SmallArms.flavorText=Used for non-Battle Armor infantry gunnery skill checks. See the Infantry Gunnery Skills \
  Glossary entry for more information.
AntiMekClimbing.flavorText=Used by infantry for Anti-Mek attacks. Also used in infantry piloting skill checks. \
  Corresponds to the ATOW skill 'climbing.'
TechMek.flavorText=The whole-unit skill for maintaining and refitting BattleMeks, ProtoMeks, and the handheld weapons they \
  carry.
TechVehicle.flavorText=The whole-unit skill for maintaining and refitting combat and support vehicles, and for \
  conventional infantry.
TechAerospace.flavorText=The whole-unit skill for maintaining and refitting aerospace and conventional fighters.
TechBattleArmor.flavorText=Maintains and refits Battle Armor, and repairs the suits themselves along with their \
  plating and mounted equipment.
TechVessel.flavorText=The whole-unit skill for maintaining and refitting large spacecraft (DropShips, JumpShips, and \
  WarShips) and for repairing their Kearny-Fuchida drive systems: drive coil and controller, field initiator, \
  charging system, helium tank, and jump-sail boom.
TechMilitary.flavorText=A generalist's grasp of military hardware: field-stripping small arms, servicing support gear, and \
  keeping a unit's non-specialist equipment running. No mechanical effects.
TechCivilian.flavorText=The everyday trade of keeping civilian machinery working: appliances, industrial tools, ground \
  transport, and the like. No mechanical effects.
TechElectronic.flavorText=Repairs electronic systems: sensors, fire-control systems, cockpits and combat information \
  centers.
TechNuclear.flavorText=Repairs fusion and fission power plants: fusion engines, spacecraft drives, and \
  Lithium-Fusion batteries.
TechAeronautics.flavorText=Repairs aerospace flight systems: the avionics and landing gear of fighters and other \
  aerospace craft.
TechMechanical.flavorText=Repairs structural and mechanical components: armor and internal structure, gyros, \
  non-nuclear engines and their cooling and fuel systems, motive systems, heat sinks, docking collars, cargo bays, \
  and the like.
TechMyomer.flavorText=Repairs actuators and myomer systems, including MASC and limb actuators.
TechJets.flavorText=Repairs jump jets and aerospace thrusters.
TechWeapons.flavorText=Repairs mounted weapons and their systems.
TechCybernetics.flavorText=The specialist's craft of fitting, tuning, and repairing cybernetic implants and prosthetics, \
  from replacement limbs to neural interfaces. No mechanical effects.
Astech.flavorText=Required for the Astech role. Can gain other effects if the Useful Permanent Astechs campaign \
  option is enabled (see campaign options for more information).
SurgeryAny.flavorText=Used to heal injured personnel.
MedTechAny.flavorText=Required for the Medic role. Can gain other effects if the Useful Permanent Medics campaign \
  option is enabled (see campaign options for more information).
NavigationAny.flavorText=Required for the Navigator role, otherwise no mechanical effects.
Administration.flavorText=Used by the different Admin professions (see documentation). Depending on campaign options may\
  \ also affect the number of patients a doctor can attend per day and how many minutes per day a tech has.
Negotiation.flavorText=Used by the different Admin professions (see documentation). Used by the campaign commander to\
  \ improve Resupplies while on Guerrilla Warfare contracts (StratCon only).
Leadership.flavorText=May reduce Turnover target numbers (see documentation). Allows the leader of combat teams to pull\
  \ in additional units when deploying to a scenario (StratCon only).
Scrounge.flavorText=Deprecated and scheduled for removal.
Strategy.flavorText=Reduces the arrival time of reinforcements.
TacticsAny.flavorText=Depending on campaign options may increase Initiative rolls. Increases the number of additional infantry\
  \ units (or minefields) that can be deployed to a scenario while in the Frontline combat role (StratCon Only). Increases\
  \ the number of times scenario attributes (weather, map, etc.) can be rerolled (AtB & StratCon Only).
