AdvancedSurgeriesDialog.guide.button.toolTipText=Open the guide to planning surgery
AdvancedSurgeriesDialog.guide.alwaysOpen=Show every time I open this
AdvancedSurgeriesDialog.guide.close=Got it
AdvancedSurgeriesDialog.guide.tab.steps=Steps
AdvancedSurgeriesDialog.guide.tab.example=Example
AdvancedSurgeriesDialog.guide.tab.terms=Terms
AdvancedSurgeriesDialog.guide.eyebrow=Guide \u00B7 Advanced Surgery
AdvancedSurgeriesDialog.guide.title=Planning surgery
AdvancedSurgeriesDialog.guide.exampleIntro=A short example. Your own patients will be different.
AdvancedSurgeriesDialog.guide.glossary=In the Glossary
AdvancedSurgeriesDialog.guide.step.1.title=Start from an injury
AdvancedSurgeriesDialog.guide.step.1.text=The left of the dialog shows the patient's body and injuries. Click an injury, or a part \
  of the body, to see only the procedures that treat it. All locations shows everything again.
AdvancedSurgeriesDialog.guide.step.2.title=Find a procedure
AdvancedSurgeriesDialog.guide.step.2.text=Search by name or body part, or narrow the list to a region. Treats injuries hides \
  elective procedures; turn it off to see implants and upgrades. Hide unavailable hides anything the patient can't \
  have right now.
AdvancedSurgeriesDialog.guide.step.3.title=Open it to read the details
AdvancedSurgeriesDialog.guide.step.3.text=Click a procedure to see what it fixes, what success and failure mean, everything \
  about it, and whether the patient can have it. A red cross can't be changed, such as a faction restriction. An amber \
  mark can, such as travelling to a world with better tech.
AdvancedSurgeriesDialog.guide.step.4.title=Add it to today's surgery
AdvancedSurgeriesDialog.guide.step.4.text=Each body location takes one procedure; adding another replaces it. Today's \
  surgeries gather in the dock along the bottom, with their cost and how long the patient will be out of action.
AdvancedSurgeriesDialog.guide.step.5.title=Check the risk of death
AdvancedSurgeriesDialog.guide.step.5.text=Every surgery adds an injury while the patient heals, whether it succeeds or \
  not, and a success also clears the injuries it treats. Six injuries is fatal. The dock shows the chance the patient \
  dies if you operate now, and where they end up if every surgery succeeds or every one fails.
AdvancedSurgeriesDialog.guide.step.6.title=Make it safe
AdvancedSurgeriesDialog.guide.step.6.text=If the plan could kill the patient, Make it safe keeps the surgeries that help \
  most and takes the rest out of today's plan. Removed surgeries aren't scheduled for later and aren't remembered \
  once the dialog closes: when the patient has healed, open Advanced Surgery again and plan them yourself.
AdvancedSurgeriesDialog.guide.step.7.title=Begin surgery
AdvancedSurgeriesDialog.guide.step.7.text=Each surgery is a Surgery check by your senior doctor here. If no one is \
  skilled enough, a local surgeon operates at ten times the cost. If the plan still risks the patient's life, tick the \
  box to accept it before you can begin.
AdvancedSurgeriesDialog.guide.example.1.who=You
AdvancedSurgeriesDialog.guide.example.1.text=Sergeant Voss is at four injuries: a fracture and burns on her left arm, \
  broken ribs, and burned eyes. I add a replacement arm, fracture repair and bionic eyes.
AdvancedSurgeriesDialog.guide.example.2.who=Dock
AdvancedSurgeriesDialog.guide.example.2.text=Each surgery adds an injury while she heals. If the arm replacement fails, \
  and either of the others fails too, she reaches six and dies. Begin is locked until you accept the risk.
AdvancedSurgeriesDialog.guide.example.3.who=You
AdvancedSurgeriesDialog.guide.example.3.text=I click Make it safe.
AdvancedSurgeriesDialog.guide.example.4.who=Dock
AdvancedSurgeriesDialog.guide.example.4.text=The arm replacement stays: it clears two injuries. The other two are \
  removed from today's plan. Even if the arm fails, she ends at five injuries. Risk of death: 0%.
AdvancedSurgeriesDialog.guide.example.5.who=You
AdvancedSurgeriesDialog.guide.example.5.text=I begin surgery, and make a note to open Advanced Surgery again for her ribs \
  and eyes once she's healed.
AdvancedSurgeriesDialog.guide.term.1.name=Injury load
AdvancedSurgeriesDialog.guide.term.1.text=How many injuries the patient has, shown at the top of the dialog. \
  Prosthetics and implants already fitted don't count. At six, the patient dies.
AdvancedSurgeriesDialog.guide.term.2.name=Recovery injury
AdvancedSurgeriesDialog.guide.term.2.text=The injury every surgery leaves while the patient heals, whether it succeeds or \
  not. It's why too many surgeries at once can be fatal.
AdvancedSurgeriesDialog.guide.term.3.name=Prosthetic type
AdvancedSurgeriesDialog.guide.term.3.text=How advanced a procedure is, from Type 1 (crude, such as a wooden arm) to Type \
  6 (cloned). Type 3 and above need hospital facilities, so they can only be done planetside.
AdvancedSurgeriesDialog.guide.term.4.name=Surgery skill
AdvancedSurgeriesDialog.guide.term.4.text=The Surgery level a procedure needs. The senior doctor here operates if they \
  have it; otherwise a local surgeon is hired at ten times the cost.
AdvancedSurgeriesDialog.guide.term.5.name=Planetary tech
AdvancedSurgeriesDialog.guide.term.5.text=How advanced a world has to be before a procedure can be done there, from \
  Regressed up to A. In transit, only the simplest procedures are possible.
AdvancedSurgeriesDialog.guide.term.6.name=Elective procedure
AdvancedSurgeriesDialog.guide.term.6.text=A procedure that treats no injury, such as an implant or an upgrade. It still \
  leaves a recovery injury.
AdvancedSurgeriesDialog.guide.term.7.name=Edge
AdvancedSurgeriesDialog.guide.term.7.text=A surgeon with the Edge ability for advanced surgery can re-roll a failed \
  surgery. The risk shown assumes Edge is spent on the first surgeries rolled, so it is never lower than the real risk.
