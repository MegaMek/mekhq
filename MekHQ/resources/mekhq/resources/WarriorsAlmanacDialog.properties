# Part category introductions
WarriorsAlmanacDialog.partCategory.default.intro=A selection of components, catalogued here for the discerning \
  technician.
WarriorsAlmanacDialog.partCategory.armor.intro=The plating that stands between a warrior and the void. From \
  ferro-fibrous weaves to reactive composites, armor is the difference between a scratch and a coffin.
WarriorsAlmanacDialog.partCategory.weapons.intro=Autocannons, lasers, missiles, and gauss rifles, the tools by which \
  warriors settle their disagreements. A weapon's debut can redraw the balance of a battlefield.
WarriorsAlmanacDialog.partCategory.ammunition.intro=No weapon is deadlier than its supply of shells. Munitions win \
  and lose campaigns long before the first shot is fired.
WarriorsAlmanacDialog.partCategory.miscEquipment.intro=The quiet advantages: ECM suites, targeting computers, jump \
  jets, and the countless devices that turn a capable machine into a war-winning one.
WarriorsAlmanacDialog.partCategory.engines.intro=The beating heart of every war machine. Fusion, fuel cell, or \
  internal combustion, an engine's rating decides how fast - and how far - a warrior carries the fight.
WarriorsAlmanacDialog.partCategory.gyros.intro=Balance under fire. A BattleMek is only as steady as its gyroscope, \
  and a ruined gyro turns a titan into falling scrap.
WarriorsAlmanacDialog.partCategory.actuators.intro=The muscle and sinew of the BattleMek. Every stride, punch, and \
  kick answers to the actuators buried in its limbs.
WarriorsAlmanacDialog.partCategory.equipment.intro=General components and systems that keep a unit fighting, the \
  broad category into which many a machine's inner workings fall.
WarriorsAlmanacDialog.partCategory.systemComponents.intro=Life support and sensors: the vital organs without which \
  even the mightiest chassis is blind, deaf, and lifeless.
WarriorsAlmanacDialog.partCategory.locations.intro=Torsos, limbs, and hull sections: the structural framework onto \
  which everything else is bolted.
WarriorsAlmanacDialog.partCategory.other.intro=Curiosities and specialist components that resist tidy classification,\
  \ the odds and ends of the technician's trade.
# Unit type introductions
WarriorsAlmanacDialog.unitType.default.intro=A class of war machine, catalogued here for the prudent warrior.
WarriorsAlmanacDialog.unitType.Mek.intro=The BattleMek: sovereign of the battlefield since the Age of War. Walking \
  engines of myth and menace, they remain the measure by which all other war machines are judged.
WarriorsAlmanacDialog.unitType.Tank.intro=Combat vehicles, cheaper than a BattleMek and fielded in far greater \
  numbers. Underestimate a well-handled armor lance at your peril.
WarriorsAlmanacDialog.unitType.BattleArmor.intro=Powered infantry armor that lets a trooper trade fire with vehicles \
  and BattleMeks.
WarriorsAlmanacDialog.unitType.Infantry.intro=The foot soldiers who hold the ground no machine can. Numberless, \
  enduring, and forever the true soldiers of any world.
WarriorsAlmanacDialog.unitType.ProtoMek.intro=The Clans' answer to the gap between battle armor and BattleMek. Small, \
  swift, and piloted by warriors bred for the task.
WarriorsAlmanacDialog.unitType.VTOL.intro=Rotor-borne scouts and gunships that own the sky striking where heavier \
  machines cannot reach.
WarriorsAlmanacDialog.unitType.Naval.intro=Wet-navy vessels that rule the seas of a thousand worlds, from nimble \
  patrol boats to leviathans.
WarriorsAlmanacDialog.unitType.GunEmplacement.intro=Fixed fortifications and weapon emplacements. Immovable, heavily \
  armed, and best given a wide berth by the prudent.
WarriorsAlmanacDialog.unitType.ConventionalFighter.intro=Atmosphere-bound aircraft, affordable and abundant, \
  contesting skies where aerospace fighters are too dear to risk.
WarriorsAlmanacDialog.unitType.AeroSpaceFighter.intro=Masters of the air and the edge of space, aerospace fighters \
  project power from the upper atmosphere to orbit.
WarriorsAlmanacDialog.unitType.SmallCraft.intro=Sub-capital spacecraft for the short haul. Shuttles, gunboats, \
  and utility craft that ply the distance between worlds and warships.
WarriorsAlmanacDialog.unitType.Dropship.intro=The workhorses that carry regiments from a jump point to a planet's \
  surface, delivering armies to the fight.
WarriorsAlmanacDialog.unitType.Jumpship.intro=The slender vessels that bind the scattered worlds of humanity.
WarriorsAlmanacDialog.unitType.Warship.intro=Capital ships of the void. City-sized engines of destruction whose loss \
  are all but irreplaceable.
WarriorsAlmanacDialog.unitType.SpaceStation.intro=Orbital habitats, shipyards, and fortresses that anchor commerce \
  and war among the stars.
WarriorsAlmanacDialog.unitType.HandheldWeapon.intro=Oversized armaments a BattleMek can carry and wield by hand. \
  Improvised firepower for a desperate hour.
WarriorsAlmanacDialog.unitType.MobileStructure.intro=Vast mobile constructs that blur the line between vehicle and \
  fortress.
WarriorsAlmanacDialog.unitType.AdvancedBuilding.intro=Purpose-built structures of note, catalogued for the \
  strategist and the quartermaster alike.
WarriorsAlmanacDialog.unitType.Aero.intro=Undifferentiated aerospace craft: escape pods, lifeboats, and the small \
  vessels of last resort.
WarriorsAlmanacDialog.unitType.BattlefieldSupportAsset.intro=Off-map support assets: the artillery, airstrikes, \
  and reinforcements called down upon the battlefield.
