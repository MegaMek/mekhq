guide.exampleIntro=A short example. Your own kits will be different.
# Armor kits guide
guide.armor.button=How armor kits work
guide.armor.eyebrow=Guide · Armor Kits
guide.armor.title=Issuing armor kits
guide.armor.step.1.title=Know who is being kitted
guide.armor.step.1.text=The dialog takes everyone you selected, plus the crews of any units you selected, who \
  can wear an armor kit, and sorts them into kit groups: MekWarriors (and LAM pilots), Vehicle crews (including large \
  craft), Aircraft pilots, and Soldiers. Each group has its own tab and its own kits. A tab with nobody selected is \
  still shown, so you can see what it offers.
guide.armor.step.2.title=Read a kit card
guide.armor.step.2.text=Divisor is how much the kit cuts incoming damage: higher protects more. Encumbering kits \
  hamper the wearer. The badges list the environments it protects against: vacuum, cold, heat, and tainted or toxic \
  air. Below that are how hard the kit is to acquire, how many are in stores, and the price of each.
guide.armor.step.3.title=Pick one kit per group
guide.armor.step.3.text=Click a card to choose it for everyone in that group. Anyone already wearing it is skipped. \
  The stock count turns amber when there aren't enough in stores for the whole group.
guide.armor.step.4.title=Or strip to coveralls
guide.armor.step.4.text=Strip to coveralls takes the group's kits off and returns them to stores. Coveralls are \
  ordinary clothing and protect nothing.
guide.armor.step.5.title=Kit soldiers by platoon
guide.armor.step.5.text=A soldier's kit is issued to the whole platoon as its field armor, so select the platoon in \
  the hangar to kit them. Return to designed armor puts the platoon back in the armor it was built with.
guide.armor.step.6.title=Check the roster
guide.armor.step.6.text=The roster lists everyone being kitted, with their group, the kit they wear now, and the kit \
  they'll wear after the issue. A dash means their kit won't change.
guide.armor.step.7.title=Mind the deployment rules
guide.armor.step.7.text=With the matching campaign options on, a Mek can't deploy unless every crew member wears a \
  MekWarrior kit, and an aerospace fighter can't deploy unless every crew member wears the Aerospace Fighter Pilot Kit. \
  Those kits carry the neurohelmet.
guide.armor.step.8.title=Issue the kits
guide.armor.step.8.text=From Stores counts kits handed out now. To Procure counts kits ordered through the shopping \
  list; each is issued automatically when it arrives. Procurement Cost is the price of the order. Issue Kits does it \
  all at once, and Cancel changes nothing.
guide.armor.example.1.who=You
guide.armor.example.1.text=Mek crews must wear MekWarrior kits to deploy in my campaign. I select Alpha Lance in the \
  hangar and open Issue Kits.
guide.armor.example.2.who=Card
guide.armor.example.2.text=MekWarrior Kit (Advanced): 2 in stock, shown in amber, since the lance has four \
  MekWarriors.
guide.armor.example.3.who=You
guide.armor.example.3.text=I choose it anyway.
guide.armor.example.4.who=Tiles
guide.armor.example.4.text=From Stores 2, To Procure 2. Two MekWarriors wear the kit now; the other two get theirs \
  when the order arrives.
guide.armor.term.1.name=Kit group
guide.armor.term.1.text=The set of people who draw from the same kits: MekWarriors, Vehicle crews, Aircraft pilots, or \
  Soldiers.
guide.armor.term.2.name=Divisor
guide.armor.term.2.text=How much a kit reduces incoming damage. Damage is divided by it, so a higher divisor protects \
  more.
guide.armor.term.3.name=Encumbering
guide.armor.term.3.text=A kit bulky enough to hamper its wearer.
guide.armor.term.4.name=Coveralls
guide.armor.term.4.text=What everyone wears when they've been issued nothing: ordinary clothing with no protection.
guide.armor.term.5.name=Designed armor
guide.armor.term.5.text=The armor an infantry platoon was built with, before any kit was issued to it.
guide.armor.term.6.name=Stores
guide.armor.term.6.text=Where kits are drawn from and returned to: the person's local warehouse, or the main \
  warehouse if they have none.
guide.armor.term.7.name=Awaited kit
guide.armor.term.7.text=A kit someone is meant to wear but that hasn't arrived yet. It's issued automatically once it \
  reaches stores.
# Equipment kits guide, shared by the primary and secondary slot pages
guide.tools.button=How equipment kits work
guide.tools.eyebrow=Guide · Equipment Kits
guide.tools.title=Issuing equipment kits
guide.tools.step.1.title=Know the two slots
guide.tools.step.1.text=Everyone can carry two equipment kits, separate from their armor: one in the Primary Kit slot \
  and one in the Secondary Kit slot. Each tab changes only its own slot. New recruits are given the default kit for \
  their primary role in the first slot, and for their secondary role in the second.
guide.tools.step.2.title=Read the effect
guide.tools.step.2.text=Each card says what the kit improves. Repair kits give +1 to one kind of Tech check for part \
  repairs. The Deluxe Toolkit helps Astechs, the Descartes scanners help maintenance, and medical, field and computer \
  kits help other skills. A bonus only counts when the carrier makes that roll.
guide.tools.step.3.title=Pick one kit for everyone
guide.tools.step.3.text=Click a card to issue that kit to everyone selected; click it again to clear your choice. \
  Anyone already carrying the kit, in either slot, is skipped. Issuing into a slot returns whatever it held to stores.
guide.tools.step.4.title=Or empty the slot
guide.tools.step.4.text=No kit takes the kit in this slot from everyone selected and returns it to stores.
guide.tools.step.5.title=Mind the tool kit rule
guide.tools.step.5.text=With Techs Need a Tool Kit on, a tech must carry a Basic or Deluxe Toolkit, or any repair kit, \
  to make repairs. A Descartes scanner doesn't count. Work on infantry that maintain themselves needs no kit.
guide.tools.step.6.title=Check the roster
guide.tools.step.6.text=The roster shows what each person will carry in this slot after the issue.
guide.tools.step.7.title=Issue the kits
guide.tools.step.7.text=From Stores, To Procure and Procurement Cost work as for armor: kits in stores are handed out \
  now, and the rest are ordered and issued when they arrive. Issue Kits applies every page at once.
guide.tools.example.1.who=You
guide.tools.example.1.text=Techs Need a Tool Kit is on, and I've just hired four techs. I select them and open the \
  Primary Kit tab.
guide.tools.example.2.who=You
guide.tools.example.2.text=I choose the Basic Toolkit so all four can make repairs.
guide.tools.example.3.who=Tiles
guide.tools.example.3.text=From Stores 3, To Procure 1. The fourth tech can't repair anything until their toolkit \
  arrives.
guide.tools.example.4.who=You
guide.tools.example.4.text=Two of them work on Meks. Afterward I select just those two, open Issue Kits again, and \
  on the Secondary Kit tab give them a Myomer/Actuator Repair Kit: +1 to Tech/Myomer checks.
guide.tools.term.1.name=Kit slot
guide.tools.term.1.text=One of the two places a person carries an equipment kit: Primary or Secondary.
guide.tools.term.2.name=Toolkit
guide.tools.term.2.text=The Basic or Deluxe Toolkit: general tools that let a tech make repairs when the tool kit rule \
  is on.
guide.tools.term.3.name=Repair kit
guide.tools.term.3.text=A specialist kit, such as the Weapon Repair Kit, giving +1 to one kind of Tech check. It also \
  counts as a tool kit.
guide.tools.term.4.name=Diagnostic scanner
guide.tools.term.4.text=The Descartes MK XXI and MK XXV, giving +1 or +2 to maintenance checks. Not a tool kit.
guide.tools.term.5.name=Default kit
guide.tools.term.5.text=The kit each role is given on recruitment, set in the campaign options.
guide.tools.term.6.name=Awaited kit
guide.tools.term.6.text=A kit someone is meant to carry but that hasn't arrived yet. It's issued automatically once it \
  reaches stores.
