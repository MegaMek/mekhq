# Orders, as listed in the StratCon map's Facility Orders menu
# {0} = facility name, {1} = sector name, {2} = hex
report.upkeep=The enemy has repaired and reinforced the {0} in {1} at {2}.
# {0} = facility name, {1} = sector name, {2} = hex, {3} = deployment deadline
report.counterattack=<b>Counterattack!</b> The enemy is moving on the {0} in {1} at {2}. Deploy a formation there by {3}\
  \ or the facility may be lost.
report.lost=The {0} in {1} at {2} has fallen to the enemy.
report.ignoredLost=With no one to defend it, the {0} in {1} at {2} has fallen to the enemy.
report.ignoredHeld=Our employer''s garrison held the {0} in {1} at {2} without us, at some cost.
# {0} = facility name, {1} = sector name, {2} = deployment deadline
warning.message.player=Commander, the enemy is massing to retake the {0} in {1}. Our pickets expect them to strike by\
  \ {2}. If nobody from our command is there to meet them, we lose it.
warning.message.employer=Commander, the enemy is massing against the {0} in {1}, which our employer now garrisons.\
  \ They expect the attack by {2}. We can send a formation to stand with the garrison, or leave them to fend for\
  \ themselves.
warning.button=Understood
warning.ooc=This is a counterattack: a Crisis scenario on the facility''s hex. Losing it, or leaving it undefended\
  \ when you hold the facility, hands the facility to the enemy and costs a victory point. A facility held by your\
  \ employer that you leave undefended is fought over off-screen instead.
