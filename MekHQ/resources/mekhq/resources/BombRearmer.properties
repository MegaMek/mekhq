# Rearming an aircraft with its preferred bombs after a scenario. {0} = unit, {1} = bombs loaded
BombRearmer.rearmed={0} was rearmed with its preferred bombs ({1} loaded from the warehouse).
# {0} = colour, {1} = unit, {2} = bombs loaded, {3} = the bombs that were short
BombRearmer.partlyRearmed=<font color=''{0}''>{1} was only partly rearmed ({2} bombs loaded): the warehouse is short of {3}.</font>
# {0} = colour, {1} = unit
BombRearmer.noLongerFits=<font color=''{0}''>{1} can no longer carry its preferred bombs, so it will not be rearmed after scenarios. Choose its bombs again to set new ones.</font>
# {0} = how many, {1} = bomb name
BombRearmer.bombCount={0} {1}
# Bomb dialog
BombRearmer.rearmAfterScenarios=Rearm with these bombs after each scenario
BombRearmer.rearmAfterScenarios.tooltip=After each scenario, bombs used are replaced from the warehouse to bring the aircraft back to this loadout.
