guide.personnelMarket.eyebrow=Personnel Market
guide.personnelMarket.title=How recruiting works
guide.personnelMarket.step.1.title=Applicants arrive each month
guide.personnelMarket.step.1.text=On the first of each month a new set of applicants replaces the old. How many come \
  depends on where you are: the hiring hall, a capital world, the population, your reputation and faction standing. \
  The tiles across the top show the applicants, this month's recruit rolls and your funds.
guide.personnelMarket.step.2.title=Narrow the board
guide.personnelMarket.step.2.text=Pick a role on the left to see only those applicants, or search by name, \
  profession or origin. Tick Has SPAs or Has flaws to see only applicants with them, and tick experience levels to \
  see only those levels. Sort the board by experience, cost, special abilities, flaws, role, name or age; click \
  the chosen sort again to reverse it.
guide.personnelMarket.step.3.title=Read the dossier
guide.personnelMarket.step.3.text=The highlighted applicant's dossier shows what they cost and why, their skills, \
  their special abilities in green and flaws in red, and the recruiter's interview notes. Double-click an applicant \
  or use the link at the foot of the dossier for their full personnel record.
guide.personnelMarket.step.4.title=Recruit
guide.personnelMarket.step.4.text=Ctrl- or Shift-click to pick several applicants, then Recruit. Everyone picked is \
  hired only if you can pay for all of them; the cost turns red when you cannot.
guide.personnelMarket.step.5.title=Offer a Golden Hello
guide.personnelMarket.step.5.text=Under the MekHQ market rules you can offer a Golden Hello: a year's salary as a \
  signing bonus. More experienced applicants answer next month, but each costs far more to hire.
guide.personnelMarket.exampleIntro=Your lance lost a MekWarrior on the last contract, and you have 1.2 million \
  C-bills to spend.
guide.personnelMarket.example.1.who=You
guide.personnelMarket.example.1.text=Pick MekWarriors on the rail and sort by Experience. A Veteran with Marksman \
  sits at the top.
guide.personnelMarket.example.2.who=Dossier
guide.personnelMarket.example.2.text=Total to hire: 182,000 C-bills. The rows above the total show how that figure \
  is made up, and the monthly salary beneath it is what they will cost from then on.
guide.personnelMarket.example.3.who=You
guide.personnelMarket.example.3.text=Ctrl-click a Green tech as well. The footer shows both picked and the total \
  cost, well within your funds, so you Recruit them both.
guide.personnelMarket.term.1.name=Recruit roll
guide.personnelMarket.term.1.text=One attempt by the market to find an applicant this month. More rolls mean more \
  applicants, though not every roll finds someone willing to join.
guide.personnelMarket.term.2.name=Rare applicant
guide.personnelMarket.term.2.text=An applicant with a profession that seldom turns up, marked with a star.
guide.personnelMarket.term.3.name=Golden Hello
guide.personnelMarket.term.3.text=A signing bonus of a year's salary. It draws more experienced applicants, who \
  cost more to hire.
guide.personnelMarket.term.4.name=Hiring cost
guide.personnelMarket.term.4.text=What an applicant costs to recruit. Nothing unless the campaign pays for \
  recruitment; then two months' salary, or the cost of their skills when the campaign prices recruits by their \
  training. A Golden Hello adds to it.
hint.personnelMarket.0=You can hire multiple people at once by shift-clicking them.
hint.personnelMarket.1=Paying a 12-month Golden Hello increases the maximum applicant experience level.
hint.personnelMarket.2=Campaign experience level will influence who wants to join your unit.
hint.personnelMarket.3=Recruitment is harder in systems with populations below 7.5 million.
hint.personnelMarket.4=Recruitment is easier in the capital systems of major factions.
hint.personnelMarket.5=Recruitment is easier in systems with a Standard (B) or Great (A) Hiring Hall.
hint.personnelMarket.6=If your Reputation falls below -25 (or -3 with Chaos reputation), only mercenaries and \
  pirates will want to join.
hint.personnelMarket.7=You can't recruit while in transit.
hint.personnelMarket.8=You can't recruit in systems where the population is at war with your faction.
hint.personnelMarket.9=You can still recruit while on Garrison-type contracts.
hint.personnelMarket.10=Applicants with rare Professions are marked with \u2605.
