# Guides
Designer.guide.button=?  {0} guide
Designer.guide.eyebrow={0} guide
Designer.guide.close=Close guide
Designer.guide.autoOpen=Show when I first open a page
Designer.guide.tab.steps=Steps
Designer.guide.tab.example=Example
Designer.guide.tab.terms=Terms
Designer.guide.exampleIntro=A Mercenary battalion, built in one sitting:
Designer.guide.FORCE.title=Designing the force
Designer.guide.FORCE.step.1.title=Say who and how big
Designer.guide.FORCE.step.1.text=Pick the faction the force is rolled from and its size. The sizes, ratings and unit types offered follow from the faction, so set it first.
Designer.guide.FORCE.step.2.title=Roll
Designer.guide.FORCE.step.2.text=Press Roll. Each roll is added to the command, so a battalion of 'Meks and a company of tanks can be rolled one after the other. Clear Rolls starts again.
Designer.guide.FORCE.step.3.title=Strike out what you do not want
Designer.guide.FORCE.step.3.text=Click the ring at the start of a unit or formation to strike it out. Struck units stay listed so you can bring them back.
Designer.guide.FORCE.step.4.title=Shape the next roll
Designer.guide.FORCE.step.4.text=Select a formation on the board, then open the formation mix to ask for particular formations in the next roll.
Designer.guide.FORCE.example.1.who=You
Designer.guide.FORCE.example.1.text=Mercenary, Battalion, rated C, Regular, 'Mek. Roll.
Designer.guide.FORCE.example.2.who=Board
Designer.guide.FORCE.example.2.text=Forty 'Meks in a command lance and three companies, with three DropShips under Transport.
Designer.guide.FORCE.example.3.who=You
Designer.guide.FORCE.example.3.text=Strike out the green-piloted Catapult and add a roll of a Vehicle company.
Designer.guide.FORCE.term.1.name=Roll
Designer.guide.FORCE.term.1.text=One generation of a force from the settings on the left. Rolls add up into one command.
Designer.guide.FORCE.term.2.name=Struck out
Designer.guide.FORCE.term.2.text=A unit or formation the build will skip. Its ring is hollow and its name crossed through.
Designer.guide.FORCE.term.3.name=Formation mix
Designer.guide.FORCE.term.3.text=A request for particular formations, such as a fire lance, in the next roll.
Designer.guide.PEOPLE.title=Leaders and support
Designer.guide.PEOPLE.step.1.title=Choose how leaders are picked
Designer.guide.PEOPLE.step.1.text=Best commander and best officers pick by command skill unless you ask for combat skill. Generate Captains gives officers the skills of their post.
Designer.guide.PEOPLE.step.2.title=Size the support staff
Designer.guide.PEOPLE.step.2.text=Need is what Campaign Operations asks for, for the command as rolled. Coverage scales it; Hire is what that coverage adds to the staff you already have.
Designer.guide.PEOPLE.step.3.title=Decide on assistants
Designer.guide.PEOPLE.step.3.text=Astechs and medics can be an anonymous pool or named people. A pool keeps a large command's roster short.
Designer.guide.PEOPLE.step.4.title=Names, ranks and origin
Designer.guide.PEOPLE.step.4.text=These apply to everyone the build hires. Origin choices apply to this build only; later recruits follow Campaign Options.
Designer.guide.PEOPLE.example.1.who=People page
Designer.guide.PEOPLE.example.1.text=Mek Tech need 38, coverage 100%, hire 38. Administrators at 75% hire 6.
Designer.guide.PEOPLE.example.2.who=You
Designer.guide.PEOPLE.example.2.text=Put astechs in the pool and give doctors a Veteran skill.
Designer.guide.PEOPLE.term.1.name=Need
Designer.guide.PEOPLE.term.1.text=The Campaign Operations staffing for the rolled command and what the campaign already has.
Designer.guide.PEOPLE.term.2.name=Coverage
Designer.guide.PEOPLE.term.2.text=How much of the need to hire, as a percentage.
Designer.guide.PEOPLE.term.3.name=Pool
Designer.guide.PEOPLE.term.3.text=Anonymous astechs or medics counted as a number rather than as people.
Designer.guide.LOGISTICS.title=Stocking and funding
Designer.guide.LOGISTICS.step.1.title=Set the spares
Designer.guide.LOGISTICS.step.1.text=Each percentage stocks the warehouse with spare parts as a share of what the units carry. These are the campaign's own restock settings.
Designer.guide.LOGISTICS.step.2.title=Set the starting cash
Designer.guide.LOGISTICS.step.2.text=Starting cash is a number of months of running costs. Only the costs this campaign charges count; the amount is measured at build.
Designer.guide.LOGISTICS.step.3.title=Decide who pays
Designer.guide.LOGISTICS.step.3.text=Pay for Initial Setup takes the cost of the command out of that cash, down to the minimum float, with an optional loan for the rest.
Designer.guide.LOGISTICS.example.1.who=Ledger
Designer.guide.LOGISTICS.example.1.text=Salaries and maintenance counted, Hot Spots upkeep not charged, 6 months.
Designer.guide.LOGISTICS.example.2.who=Finances log
Designer.guide.LOGISTICS.example.2.text=The command is founded with 6 months of running costs at its monthly cost.
Designer.guide.LOGISTICS.term.1.name=Running costs
Designer.guide.LOGISTICS.term.1.text=Salaries, maintenance, overhead, food and housing, and Hot Spots upkeep, each only if the campaign charges it.
Designer.guide.LOGISTICS.term.2.name=Minimum float
Designer.guide.LOGISTICS.term.2.text=The least cash the command keeps, whatever the setup costs.
Designer.guide.REVIEW.title=Building the command
Designer.guide.REVIEW.step.1.title=Read the build order
Designer.guide.REVIEW.step.1.text=The steps run in this order. Greyed steps are switched off and will be skipped.
Designer.guide.REVIEW.step.2.title=Check what is flagged
Designer.guide.REVIEW.step.2.text=Nothing listed stops the build, but each is worth a look. Follow a link to the page that deals with it.
Designer.guide.REVIEW.step.3.title=Build
Designer.guide.REVIEW.step.3.text=Build Command adds the command to your campaign. Nothing reaches the campaign before then.
Designer.guide.REVIEW.example.1.who=Review
Designer.guide.REVIEW.example.1.text=Ready to build, two things to check: origins stay at home, one unit struck out.
Designer.guide.REVIEW.term.1.name=Build
Designer.guide.REVIEW.term.1.text=The one action that changes the campaign. Close Without Building throws the design away.
