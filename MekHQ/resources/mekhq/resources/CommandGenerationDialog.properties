# Resource bundle for the Company Generation dialog and its tabs.
#
# Conventions:
# * Tab titles use ``{tabName}.title``.
# * Sub-panel titled-border captions use ``lbl{borderName}.text``.
# * Control text uses ``lbl{name}.text``; tooltip uses ``lbl{name}.tooltip`` (lower-case suffix, not
#   ``.toolTipText`` like the legacy GUI.properties bundle).
#
# Styled components in mekhq.gui.companyGeneration.components.* read from this bundle (selected via
# CommandGenerationUtilities.getCommandGenerationResourceBundle()). CampaignOptions counterparts read
# from CampaignOptionsDialog.properties.

# Tab titles

# ---- Setup tab section captions

# ---- Setup: Force Shape
lblGenerateMercenaryCompanyCommandLance.text=Generate Company Command Lance
lblGenerateMercenaryCompanyCommandLance.tooltip=Gives the campaign commander a separate command lance of their own. When off, the commander leads the first lance generated instead.
lblForceNamingMethod.text=Formation Naming Method
lblForceNamingMethod.tooltip=The alphabet used to name formations at every level of the command. A regiment's battalions are named Alpha, Beta, Gamma; each battalion's companies start again at Alpha, and so on down to the lances.
lblAlwaysNumberRegiments.text=Always Number Regiments
lblAlwaysNumberRegiments.tooltip=Regiments are numbered instead of lettered: 1st Mek Regiment, 2nd Mek Regiment. Each kind of regiment counts on its own, so an armor regiment alongside two Mek regiments is the 1st Armor Regiment.

# ---- Setup: Support Personnel
# Spinner and skill-dropdown tooltips share a template; the single ``%s`` is replaced with the role's display name at runtime.
supportCoveragePercent.toolTipText=How many %s to hire, as a percentage of the number needed to keep every unit maintained. 100%% hires the full number, less leaves some units without one, more gives spare hands.
supportSkillLevel.toolTipText=The experience level every %s starts with. Random rolls a different level for each person.

# ---- Setup: Assistants (astech / medic generation)
lblGenerateMedicalReserve.text=Medical Reserve (% of combatants)
lblGenerateMedicalReserve.tooltip=Adds spare combat personnel with no unit of their own, ready to step in when someone is wounded. Each combat role (MekWarriors, aerospace pilots, vehicle crews, soldiers and so on) gets its own reserve, this percentage of the people generated in that role, rounded up. This only affects generation; it is not the campaign's Alternative Advanced Medical rule.

# ---- Setup: Tech Assignment (which units get the best techs first)

# ---- Setup: Officer Selection
lblAssignBestCompanyCommander.text=Assign Best Campaign Commander
lblAssignBestCompanyCommander.tooltip=The most skilled person leads the command, wherever the roll seated them. Tactical Genius counts first, then command skills, then combat skills. Off, the first pilot found in the top formation leads it.
lblPrioritizeCompanyCommanderCombatSkills.text=Prioritize Commander Combat Skills Over Command Skills
lblPrioritizeCompanyCommanderCombatSkills.tooltip=When choosing the campaign commander, gunnery and piloting count for more than Leadership, Strategy and Tactics. Tactical Genius still comes first.
lblAssignBestOfficers.text=Assign Best Officers
lblAssignBestOfficers.tooltip=Every battalion, company and lance is led by the most skilled person left in it, chosen from the top of the command down. Off, each is led by the first pilot found in it.
lblPrioritizeOfficerCombatSkills.text=Prioritize Officer Combat Skills Over Command Skills
lblPrioritizeOfficerCombatSkills.tooltip=When choosing officers, gunnery and piloting count for more than Leadership, Strategy and Tactics. Tactical Genius still comes first.
lblAssignMostSkilledToPrimaryLances.text=Assign Most Skilled to Primary Lances
lblAssignMostSkilledToPrimaryLances.tooltip=Seats the most skilled pilots in the first lances of the TO&E, the command lance and first company, and the greener ones further down. Pilots only swap between units of the same kind; crews of more than one stay put.
lblGenerateCaptains.text=Generate Captains
lblGenerateCaptains.tooltip=Officers gain the skills that come with the post. The commanding officer gains a level of gunnery and piloting and two command skill increases; captains and above gain one combat skill and two increases; lance leaders one of each. Command skill increases land at random on Leadership, Strategy or Tactics.
lblAssignCompanyCommanderFlag.text=Assign Commander Flag
lblAssignCompanyCommanderFlag.tooltip=Makes the person promoted at the top of the command your campaign's commanding officer, and appoints a second in command.
lblApplyOfficerStatBonusToWorstSkill.text=Apply Officer Stat Bonus to Weakest Skill
lblApplyOfficerStatBonusToWorstSkill.tooltip=The combat skill an officer gains from Generate Captains goes to their weaker of gunnery and piloting instead of their better one.

# ---- Setup: Naming & Ranks
lblAutomaticallyAssignRanks.text=Automatically Assign Ranks
lblAutomaticallyAssignRanks.tooltip=Gives everyone generated a rank from the rank system set in Campaign Options. Officers get officer ranks sized to the formation they command. MekWarriors get sergeant ranks and support staff get corporal ranks.
lblAssignMekWarriorsCallSigns.text=Assign MekWarrior Callsigns
lblAssignMekWarriorsCallSigns.tooltip=Gives every MekWarrior a random callsign. Clan warriors are skipped, since they carry bloodnames instead.
lblAssignFounderFlag.text=Assign Founder Flag
lblAssignFounderFlag.tooltip=Marks everyone generated as a founding member of the command. Founders are shown as such in the personnel list, and with the Founder Plot Armor campaign option each gains a point of Edge.

# ---- Logistics page section captions

# ---- Logistics: Finances
lblProcessFinances.text=Process Finances
lblProcessFinances.tooltip=Gives the command starting cash: a number of months of its running costs, or a dice roll when Randomize Starting Cash is on. The setup costs below can then be taken out of it. Off leaves the campaign's money untouched.
lblRandomizeStartingCash.text=Randomize Starting Cash
lblRandomizeStartingCash.tooltip=Rolls the starting cash with dice instead of taking months of running costs. The dice count below is how many d6 are rolled, in millions of C-Bills.
lblRandomStartingCashDiceCount.text=Dice Count
lblRandomStartingCashDiceCount.tooltip=How many six-sided dice are rolled for starting cash when Randomize Starting Cash is on. Each die is one million C-Bills.
lblMinimumStartingFloat.text=Minimum Starting Float
lblMinimumStartingFloat.tooltip=The least cash the command keeps after the setup costs are taken out. If the costs would leave less than this, cash stops here and the rest is borrowed when Generate Starting Loan is on.
lblStartingLoan.text=Generate Starting Loan
lblStartingLoan.tooltip=When the setup costs come to more than the starting cash, the difference is borrowed as a two-year loan at 15% with monthly payments.
lblPayForSetup.text=Pay for Initial Setup
lblPayForSetup.tooltip=Takes the cost of setting up the command out of its starting cash. Tick below which costs count. Off gives the command everything for free with its cash untouched.
lblPayForPersonnel.text=Pay for Personnel
lblPayForPersonnel.tooltip=Charges a hiring fee of two months' salary for every person generated.
lblPayForUnits.text=Pay for Units
lblPayForUnits.tooltip=Charges the full purchase price of every unit generated, ships included.
lblPayForParts.text=Pay for Parts
lblPayForParts.tooltip=Charges for the spare parts stocked into the warehouse.
lblPayForArmour.text=Pay for Armour
lblPayForArmour.tooltip=Charges for the spare armor stocked into the warehouse.
lblPayForAmmunition.text=Pay for Ammunition
lblPayForAmmunition.tooltip=Charges for the spare ammunition stocked into the warehouse.

# ---- Logistics: Starting Simulation
lblRunStartingSimulation.text=Run Starting Simulation
lblRunStartingSimulation.tooltip=Runs the years below over the people generated before play starts, with the marriage and birth rules ticked here. Uses the campaign's random marriage and procreation settings, so those must be on in Campaign Options for anything to happen. The campaign's date does not move.
lblSimulationDuration.text=Simulation Duration (years)
lblSimulationDuration.tooltip=How many years of history to run before play starts. The campaign's marriage roll is rare, about one in five thousand per person each week, so ten years gives a battalion a handful of marriages and children; a few months gives none.
lblSimulateRandomMarriages.text=Simulate Random Marriages
lblSimulateRandomMarriages.tooltip=Lets the campaign's random marriage rule run during the simulated years, so some personnel arrive married. Needs a random marriage method chosen in Campaign Options.
lblSimulateRandomProcreation.text=Simulate Random Procreation
lblSimulateRandomProcreation.tooltip=Lets the campaign's random procreation rule run during the simulated years, so some personnel arrive with children. Needs a random procreation method chosen in Campaign Options.

# ---- Logistics: Spares section captions

# ---- Logistics: per-category restock percentages
# Mirrors the AutoLogistics grid on Campaign Options' Acquisition & Delivery page: same thirteen
# categories, same order, same wording. Values load from and write back to the campaign's
# autoLogistics* options directly.
lblSparesMekHead.text=Mek Head
lblSparesMekHead.tooltip=How many spare Mek heads to stock, as a percentage of the Mek heads in use across the command. 100 stocks one spare for every head in use.
lblSparesMekLocation.text=Mek Location
lblSparesMekLocation.tooltip=How many spare Mek limbs and torsos to stock, as a percentage of each location in use across the command.
lblSparesNonRepairableLocation.text=Special Location
lblSparesNonRepairableLocation.tooltip=How many spares to stock of the locations you would not normally restock, such as vehicle locations and Mek center torsos, as a percentage of those in use.
lblSparesArmor.text=Armor
lblSparesArmor.tooltip=How much spare armor to stock, as a percentage of the armor tonnage the command's units carry.
lblSparesEquipmentKit.text=Equipment Kit
lblSparesEquipmentKit.tooltip=How many spare equipment kits to stock (armor kits worn by crews and infantry, plus technician tool kits), as a percentage of those the command holds.
lblSparesAmmunition.text=Ammunition
lblSparesAmmunition.tooltip=How much spare ammunition to stock, as a percentage of the ammunition tonnage the command's units carry.
lblSparesBomb.text=Bomb
lblSparesBomb.tooltip=How many spare bombs to stock, as a percentage of the bombs loaded on the command's aircraft.
lblSparesHeatSink.text=Heat Sink
lblSparesHeatSink.tooltip=How many spare heat sinks to stock, as a percentage of the heat sinks in use across the command.
lblSparesWeapons.text=Weapon
lblSparesWeapons.tooltip=How many spare weapons to stock, as a percentage of each weapon in use across the command.
lblSparesActuators.text=Actuators
lblSparesActuators.tooltip=How many spare Mek actuators to stock, as a percentage of the actuators in use across the command.
lblSparesJumpJets.text=Jump Jets
lblSparesJumpJets.tooltip=How many spare jump jets to stock, as a percentage of the jump jets in use across the command.
lblSparesHeadComponents.text=Mek Head Component
lblSparesHeadComponents.tooltip=How many spare cockpits, sensors and life support systems to stock, as a percentage of those in use across the command.
lblSparesEngines.text=Engine
lblSparesEngines.tooltip=How many spare engines to stock, as a percentage of the engines in use across the command.
lblSparesGyros.text=Mek Gyro
lblSparesGyros.tooltip=How many spare gyros to stock, as a percentage of the gyros in use across the command.
lblSparesOther.text=Other
lblSparesOther.tooltip=How many spares to stock of every part not covered above, as a percentage of those in use across the command.

# ---- Logistics: Spares help text
# The fixed body width forces the label to wrap. Without it an HTML JLabel computes its preferred
# width as one unwrapped line (~2000px), inflating the whole column and pushing the neighboring
# column off-screen.

# ---- Pre-generation warning: no faction-specific ruleset
# {0} is the faction display name, or the raw ratgen faction code when the faction is not known to MekHQ.
# This value is passed through MessageFormat, so literal apostrophes must be doubled.
warningDefaultsOnlyRuleset.text=No Force Generator ruleset exists for {0}, nor for any of its parent factions. The force will be generated from the generic Inner Sphere rules instead, so its structure will not reflect that faction''s doctrine.
warningDefaultsOnlyRuleset.title=Confirm Force Generation
warningDefaultsOnlyRuleset.continue=Continue?

# Augmentation (cybernetics). Both are off in a new campaign; they are repeated here because
# they must be set before generating and cannot be applied to warriors afterwards. The section is
# shown only for the factions an augmentation stage will act on - see
# CommandGenerationPane.offersAugmentation.
lblAugmentation.text=Augmentation
lblAugmentation.tooltip=Whether the warriors this build generates come out with cybernetic implants. Both settings below must be on before you press Accept and Build: implants are fitted while the command is generated and cannot be added to the warriors afterwards. With both on, a Word of Blake Shadow Division is fitted with Manei Domini implants, and Clan formations receive enhanced imaging. Warrior House Thuggee has implant tracking switched on for the campaign but its warriors are not fitted automatically. Turn either setting off and no warrior is augmented. Shown only for the factions that can be augmented.
lblUseImplants.text=Track Cybernetic Implants
lblUseImplants.tooltip=On: the campaign records cybernetic implants, and the generated warriors can be fitted with them. Off: no warrior is augmented, whatever the Pilot Implants setting says. Saved with the campaign, and it cannot be applied to warriors after they are generated.
lblNeuralInterfaceMode.text=Pilot Implants
lblNeuralInterfaceMode.tooltip=MegaMek's pilot implants rule, covering Manei Domini implants and neural interfaces. Off: no implant of any kind is allowed, so no warrior is augmented even with tracking on above, and a generated Shadow Division gets none. Pilot Abilities Only: implants are fitted and work on their own. Full Tracking: implants are fitted, but a warrior only gets the benefit in a unit carrying the matching interface equipment. Saved with the campaign's game options.

