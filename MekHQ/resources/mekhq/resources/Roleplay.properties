RandomEventFocus.MOVE_TOWARD_A_THREAD.label=Move Toward A Thread
RandomEventFocus.MOVE_TOWARD_A_THREAD.description=One of your open threads takes a step closer to resolution. Handy for restarting a stalled story or interrupting the current scene.
RandomEventFocus.MOVE_AWAY_FROM_A_THREAD.label=Move Away From A Thread
RandomEventFocus.MOVE_AWAY_FROM_A_THREAD.description=A setback pushes one of your open threads further from resolution, giving your character a fresh challenge.
RandomEventFocus.PC_NEGATIVE.label=PC Negative
RandomEventFocus.PC_NEGATIVE.description=Something goes wrong for your character, putting a new obstacle in their way.
RandomEventFocus.PC_POSITIVE.label=PC Positive
RandomEventFocus.PC_POSITIVE.description=Your character catches a lucky break, which is welcome when things have been going badly.
RandomEventFocus.CURRENT_CONTEXT.label=Current Context
RandomEventFocus.CURRENT_CONTEXT.description=The event ties into what is happening right now. It might explain the answer you just received, or it might interrupt what your character was doing.
