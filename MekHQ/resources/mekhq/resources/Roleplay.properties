# RandomEventFocus
RandomEventFocus.REMOTE_EVENT.label=Remote Event
RandomEventFocus.REMOTE_EVENT.description=Something happening far away makes itself felt here: news, a message or a rumour arrives. A good fit when your character has been waiting to hear from elsewhere.
RandomEventFocus.AMBIGUOUS_EVENT.label=Ambiguous Event
RandomEventFocus.AMBIGUOUS_EVENT.description=Something strange or unexplained happens. Use it to add a mystery when the story has lost momentum.
RandomEventFocus.NEW_NPC.label=New NPC
RandomEventFocus.NEW_NPC.description=A new character enters the story. Think about why it makes sense for them to turn up now.
RandomEventFocus.NPC_ACTION.label=NPC Action
RandomEventFocus.NPC_ACTION.description=One of the story's NPCs acts on their own, moving events along without waiting on your character.
RandomEventFocus.NPC_NEGATIVE.label=NPC Negative
RandomEventFocus.NPC_NEGATIVE.description=Something bad happens to an NPC, pulling the spotlight onto them and possibly opening a new storyline.
RandomEventFocus.NPC_POSITIVE.label=NPC Positive
RandomEventFocus.NPC_POSITIVE.description=Something good happens to an NPC, pulling the spotlight onto them and possibly opening a new storyline.
RandomEventFocus.MOVE_TOWARD_A_THREAD.label=Move Toward A Thread
RandomEventFocus.MOVE_TOWARD_A_THREAD.description=One of your open threads takes a step closer to resolution. Handy for restarting a stalled story or interrupting the current scene.
RandomEventFocus.MOVE_AWAY_FROM_A_THREAD.label=Move Away From A Thread
RandomEventFocus.MOVE_AWAY_FROM_A_THREAD.description=A setback pushes one of your open threads further from resolution, giving your character a fresh challenge.
RandomEventFocus.PC_NEGATIVE.label=PC Negative
RandomEventFocus.PC_NEGATIVE.description=Something goes wrong for your character, putting a new obstacle in their way.
RandomEventFocus.PC_POSITIVE.label=PC Positive
RandomEventFocus.PC_POSITIVE.description=Your character catches a lucky break, which is welcome when things have been going badly.
RandomEventFocus.CURRENT_CONTEXT.label=Current Context
RandomEventFocus.CURRENT_CONTEXT.description=The event ties into what is happening right now. It might explain the answer you just received, or it might interrupt what your character was doing.
