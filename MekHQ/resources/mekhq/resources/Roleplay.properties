# ======================================================================================================================
# Oracle console guides. Steps, example lines and terms are numbered from 1; add more by continuing the numbering.
# ======================================================================================================================
OracleGuide.eyebrow=Guide · {0}
OracleGuide.exampleIntro=A short example of play. Your own questions will be different.
OracleGuide.glossary=In the Glossary
# Ask
OracleGuide.ask.title=Asking the Oracle
OracleGuide.ask.step.1.title=Ask a yes/no question about the story
OracleGuide.ask.step.1.text=Anything you would ask a game master: “Is the militia hostile?”, “Has the DropShip \
  waited for us?”. Typing it in is optional, but it makes the journal easier to read later.
OracleGuide.ask.step.2.title=Pick the odds
OracleGuide.ask.step.2.text=How likely is a Yes, given what you know so far? Don't overthink it. If you have no idea, \
  pick 50/50. The number under each choice is the highest roll that counts as Yes.
OracleGuide.ask.step.3.title=Check the chaos
OracleGuide.ask.step.3.text=Chaos (top right, 1 to 9) measures how intense and unpredictable the story has become. \
  Higher chaos makes a Yes more likely: the more chaotic things are, the more likely whatever you ask about is true. \
  It starts at 5.
OracleGuide.ask.step.4.title=Ask, then read the answer
OracleGuide.ask.step.4.text=Yes or No is the answer. Exceptional means more than you asked for: an Exceptional Yes is \
  “yes, and…”, an Exceptional No is “no, and it's worse”.
OracleGuide.ask.step.5.title=Decide what it means
OracleGuide.ask.step.5.text=Go with the first explanation that makes sense for your story. A surprising answer is the \
  Oracle doing its job.
OracleGuide.ask.step.6.title=Watch for random events
OracleGuide.ask.step.6.text=About one roll in ten (11, 22, 33 … 99, and 100) also brings a random event: something \
  unexpected happens as well as the answer. Its card tells you what kind of thing, and who or which thread is \
  involved. Chaos doesn't change how often this happens.
OracleGuide.ask.step.7.title=Need detail? Roll Concepts
OracleGuide.ask.step.7.text=When you know what happens but not the specifics, roll one to three Concepts tables and \
  combine the words into an idea.
OracleGuide.ask.step.8.title=Adjust chaos at the end of every scene
OracleGuide.ask.step.8.text=Think of your story as a film made of scenes: a briefing, a drop, a firefight, a debrief. \
  When a scene ends, ask yourself: was it more intense than the scene before? If yes, raise chaos by 1. If not, lower \
  it by 1. End Scene… under the Chaos tile asks you this. MekHQ can't judge a scene for you, so it never changes \
  chaos on its own.
OracleGuide.ask.step.9.title=Roll dice for other rules
OracleGuide.ask.step.9.text=Using rules from another game? The Dice box rolls anything from d6 to 1d20+1d4-2, and \
  4d6kh3 keeps the highest three. Each roll is saved in the journal.
OracleGuide.ask.answerKey=Reading the answer
OracleGuide.ask.answerKey.EXCEPTIONAL_YES=Yes, and more: it goes better than hoped.
OracleGuide.ask.answerKey.NORMAL_YES=Yes.
OracleGuide.ask.answerKey.NORMAL_NO=No.
OracleGuide.ask.answerKey.EXCEPTIONAL_NO=No, and worse: it goes badly.
OracleGuide.ask.example.1.who=You
OracleGuide.ask.example.1.text=The company lands on Helm. Is the local militia hostile? It's an occupied world, so I \
  pick Likely. Chaos is 5.
OracleGuide.ask.example.2.who=Oracle
OracleGuide.ask.example.2.text=Yes (44). Random event: NPC Action. Natasha Kerensky.
OracleGuide.ask.example.3.who=You
OracleGuide.ask.example.3.text=The militia are hostile. And Natasha acts on her own: she's already on the ridge, which \
  nobody ordered. I roll Concepts to find out why. Adventure, Twist: “a trusted ally lied”. So someone told \
  her to go there, and lied about why.
OracleGuide.ask.example.4.who=You
OracleGuide.ask.example.4.text=That's a new storyline. I open Threads and start a Medium thread called “Who sent \
  Natasha?”.
OracleGuide.ask.example.5.who=You
OracleGuide.ask.example.5.text=The firefight on the ridge ends. It was far more intense than the landing before it, so \
  I press End Scene… and choose More intense. Chaos goes from 5 to 6.
OracleGuide.ask.term.1.name=Oracle
OracleGuide.ask.term.1.text=Stands in for a game master. It answers yes/no questions so the story can surprise you.
OracleGuide.ask.term.2.name=Odds
OracleGuide.ask.term.2.text=How likely you think a Yes is. Nine levels, from Impossible to Certain.
OracleGuide.ask.term.3.name=Chaos
OracleGuide.ask.term.3.text=How intense and unpredictable the story is, from 1 to 9. Higher chaos makes Yes answers \
  more likely. It doesn't change how often random events happen.
OracleGuide.ask.term.4.name=Scene
OracleGuide.ask.term.4.text=One continuous stretch of the story, like a scene in a film: a briefing, a battle, a \
  negotiation. Chaos is adjusted when each scene ends.
OracleGuide.ask.term.5.name=Exceptional
OracleGuide.ask.term.5.text=A stronger answer than you asked for: yes-and, or no-and-worse.
OracleGuide.ask.term.6.name=Random event
OracleGuide.ask.term.6.text=Something unexpected that happens alongside an answer. Triggered by rolls of 11, 22, 33 \
  … 99 and 100, whatever the chaos.
OracleGuide.ask.term.7.name=Concepts
OracleGuide.ask.term.7.text=Tables of word prompts, rolled for inspiration when you need detail.
OracleGuide.ask.term.8.name=Dice notation
OracleGuide.ask.term.8.text=2d6 means two six-sided dice added together; d% is d100; kh3 keeps the highest three.
# Threads
OracleGuide.checks.title=Skill, attribute and opposed checks
OracleGuide.checks.step.1.title=Decide whether a roll is needed
OracleGuide.checks.step.1.text=Roll when someone tries something that could fail and failure would be interesting: \
  talking a guard down, spotting an ambush, hotwiring a hovercar. If it can't fail, or failing changes nothing, just \
  let it happen.
OracleGuide.checks.step.2.title=Pick who rolls
OracleGuide.checks.step.2.text=Tick one or more people. The list shows your cast members who are linked to Personnel; \
  choose Whole company to pick anyone. Right-clicking people in the Personnel tab opens this page with them ticked.
OracleGuide.checks.step.3.title=Pick what they roll
OracleGuide.checks.step.3.text=A skill, or one or two attributes. The number beside each is the target: 2d6 must roll \
  that or higher. Skills the ticked people have come first; anyone can try an untrained skill at a higher target.
OracleGuide.checks.step.4.title=Say how hard the situation is
OracleGuide.checks.step.4.text=Pick a level from Very easy (−3) to Very hard (+4), and add any other modifier. \
  A positive modifier raises the target, which makes the check harder. The chance of success updates as you change \
  things.
OracleGuide.checks.step.5.title=Roll and read the result
OracleGuide.checks.step.5.text=Passed or Failed, with the margin: how far the roll beat or missed the target. A big \
  margin means it went very well or very badly. If the campaign uses Edge, someone who fails can spend a point to \
  re-roll.
OracleGuide.checks.step.6.title=Use an opposed check for contests
OracleGuide.checks.step.6.text=When two sides work against each other, such as a lie against a sharp eye, choose \
  Opposed. Each side rolls against their own target and the higher margin wins; the defender wins a tie. A cast \
  member with no stats rolls against a rating instead, which the page remembers.
OracleGuide.checks.example.1.who=You
OracleGuide.checks.example.1.text=Rook wants to talk his way past the dock guard. I choose Opposed: Rook acting with \
  Streetwise, the guard defending as a Regular. The guard is bored, so his side is Easy.
OracleGuide.checks.example.2.who=Checks
OracleGuide.checks.example.2.text=Rook 6+, dock guard 7+. Rook wins 56% of the time. Rolled: Rook 8 (margin +2), \
  guard 9 (margin +1). Rook wins by 1.
OracleGuide.checks.example.3.who=You
OracleGuide.checks.example.3.text=He's through, but only just. The guard will remember his face.
OracleGuide.checks.term.1.name=Target number
OracleGuide.checks.term.1.text=What 2d6 has to roll to succeed. Lower is easier.
OracleGuide.checks.term.2.name=Margin of success
OracleGuide.checks.term.2.text=How far the roll beat the target; negative when it missed.
OracleGuide.checks.term.3.name=Natural aptitude
OracleGuide.checks.term.3.text=A gift for a skill: roll three dice and keep the best two.
OracleGuide.checks.term.4.name=Edge
OracleGuide.checks.term.4.text=Luck a person can spend to re-roll a failed check, if the campaign uses it.
OracleGuide.checks.term.5.name=Opposed check
OracleGuide.checks.term.5.text=A contest between two sides. The higher margin of success wins; the defender wins a tie.
OracleGuide.checks.term.6.name=Rating
OracleGuide.checks.term.6.text=How capable a cast member with no stats is, from Ultra-green (10+) to Legendary (4+).
OracleGuide.threads.title=Plot threads
OracleGuide.threads.step.1.title=Start a thread when a storyline appears
OracleGuide.threads.step.1.text=A thread is an ongoing storyline: a mystery, a rivalry, a debt, a goal. Name it after \
  what the company wants to find out or achieve.
OracleGuide.threads.step.2.title=Pick a length
OracleGuide.threads.step.2.text=Short (10 steps) for a side story over a few missions, Medium (15) for a campaign arc, \
  Long (20) for the story of the whole campaign.
OracleGuide.threads.step.3.title=Reveal a step when it makes sense for the story
OracleGuide.threads.step.3.text=Each step hides prompts rolled when you created the thread. Reveal the next one \
  whenever it makes narrative sense for this storyline to move forward: a mission that advances it, a clue found, a \
  key person met. You decide.
OracleGuide.threads.step.4.title=Work the prompts into the story
OracleGuide.threads.step.4.text=Each step gives a theme and three adventure prompts. Use them to decide what that \
  progress looks like. Not every word has to fit; use what's useful.
OracleGuide.threads.step.5.title=Flashpoints are big moments
OracleGuide.threads.step.5.text=Steps 5, 10 and 15 are flashpoints: Major Revelations, drawn from the Revelation, Secret \
  and Twist tables. Something important comes out.
OracleGuide.threads.step.6.title=The last step concludes it
OracleGuide.threads.step.6.text=The final step rolls on Stakes, Cost and Aftermath. Use it to bring the storyline to an \
  end.
OracleGuide.threads.step.7.title=Random events can push threads too
OracleGuide.threads.step.7.text=A random event can also move a thread. “Move toward a thread” reveals the next \
  step of a random open thread for you. “Move away from a thread” hides that thread's latest step again and \
  rolls it afresh, so the story has taken a turn.
OracleGuide.threads.example.1.who=You
OracleGuide.threads.example.1.text=The contract on Helm finishes and we learned who paid the militia. That's progress on \
  “Who sent Natasha?”, so I reveal step 5.
OracleGuide.threads.example.2.who=Oracle
OracleGuide.threads.example.2.text=Major revelation. Themes: Secrets, “buried past”. Revelation: “the \
  militia answers to a Duke”. Secret: “falsified salvage records”. Twist: “the ghost is a Lyran \
  officer”.
OracleGuide.threads.example.3.who=You
OracleGuide.threads.example.3.text=So the Duke has been skimming salvage, and the person who sent Natasha was a Lyran \
  officer covering for him. I write that in the journal, tagged with the thread.
OracleGuide.threads.term.1.name=Thread
OracleGuide.threads.term.1.text=An ongoing storyline with a hidden track of steps.
OracleGuide.threads.term.2.name=Step
OracleGuide.threads.term.2.text=One stage of the track. Its prompts are rolled in secret when the thread is created.
OracleGuide.threads.term.3.name=Flashpoint
OracleGuide.threads.term.3.text=Steps 5, 10 and 15. Each is a Major Revelation.
OracleGuide.threads.term.4.name=Conclusion
OracleGuide.threads.term.4.text=The final step, which brings the storyline to an end.
# Cast
OracleGuide.cast.title=The cast
OracleGuide.cast.step.1.title=List the people your story could involve
OracleGuide.cast.step.1.text=Allies, rivals, employers, contacts, officers in your own company. Anyone who could \
  plausibly turn up.
OracleGuide.cast.step.2.title=Add people two ways
OracleGuide.cast.step.2.text=Type a name here, or right-click someone in the Personnel tab and choose Add to Oracle \
  List. People added from Personnel stay linked, so renames follow and their portrait shows here.
OracleGuide.cast.step.3.title=The Oracle picks from this list
OracleGuide.cast.step.3.text=When a random event is about an NPC (NPC Action, NPC Negative, NPC Positive), the Oracle \
  picks someone from the cast at random. Everyone has the same chance; order doesn't matter.
OracleGuide.cast.step.4.title=Keep it current
OracleGuide.cast.step.4.text=Remove people who have left the story, so the Oracle doesn't pick them. Their journal \
  history is kept, and you can restore them. A short list of people who matter now works better than a long one.
OracleGuide.cast.step.5.title=Follow someone's story
OracleGuide.cast.step.5.text=Each person's page lists every journal entry that mentions them. Read storyline opens the \
  journal filtered to them, oldest first.
OracleGuide.cast.step.6.title=Generate an NPC when you need one fast
OracleGuide.cast.step.6.text=Generate adds someone with a random name and a profile rolled from the Characters \
  tables: appearance, personality, demeanour and motive. A New NPC random event offers the same.
OracleGuide.cast.example.1.who=You
OracleGuide.cast.example.1.text=My cast is Natasha Kerensky, Magistrate Dace and a smuggler I made up called “Rook”.
OracleGuide.cast.example.2.who=Oracle
OracleGuide.cast.example.2.text=Random event: NPC Negative. Magistrate Dace.
OracleGuide.cast.example.3.who=You
OracleGuide.cast.example.3.text=Something bad happens to Dace. Given the salvage fraud, maybe he's been arrested. The \
  Oracle's record is already tagged with Dace, so it shows on his page.
OracleGuide.cast.term.1.name=Cast
OracleGuide.cast.term.1.text=Your list of people the story might involve. The Oracle picks from it.
OracleGuide.cast.term.2.name=NPC
OracleGuide.cast.term.2.text=Non-player character: anyone in the story who isn't your own character.
OracleGuide.cast.term.3.name=Linked
OracleGuide.cast.term.3.text=Added from the Personnel tab, so the name follows that person.
OracleGuide.cast.term.4.name=Profile
OracleGuide.cast.term.4.text=A generated NPC's appearance, personality, demeanour and motive, shown on the Cast page.
# Journal
OracleGuide.journal.title=The journal
OracleGuide.journal.step.1.title=The Oracle writes itself down
OracleGuide.journal.step.1.text=Every answer, random event, Concepts roll and thread change is recorded here \
  automatically, with the in-game date.
OracleGuide.journal.step.2.title=Write what it meant
OracleGuide.journal.step.2.text=The Oracle's answers are only half the story. After a question or a mission, write a \
  note about what you decided happened. That's what you'll want to read again later.
OracleGuide.journal.step.3.title=Tag notes
OracleGuide.journal.step.3.text=Tag notes with the threads and people they involve. Oracle records tag themselves. \
  @ Cast inserts a name and tags it in one go.
OracleGuide.journal.step.4.title=Read one storyline at a time
OracleGuide.journal.step.4.text=Filter by a thread or a person to read that storyline, or search for a word. Oldest \
  first reads it from start to finish.
OracleGuide.journal.step.5.title=Export to share, import to keep
OracleGuide.journal.step.5.text=Export saves the entries you are looking at as a Markdown or text file: a campaign \
  diary to share with friends or post online. Import adds a Markdown export back into any campaign. If a save ever \
  fails to load, MekHQ saves its journal next to the save as Markdown, ready to import.
OracleGuide.journal.step.6.title=The campaign writes itself in
OracleGuide.journal.step.6.text=Contracts, battles, arrivals, and people joining, being born, dying, going missing, \
  being captured or leaving are recorded as Campaign entries, tagged with anyone in the cast. React to them in your \
  notes. Turn this off under Campaign Options, Roleplay, if you'd rather not.
OracleGuide.journal.step.7.title=Where you have been
OracleGuide.journal.step.7.text=Switch to the Travel log to see every system the main force, your bases and your cast \
  have been to. Sort the systems by visits or days present, or pick one to see its contracts and campaign entries. \
  Travel is kept out of the journal, so it never crowds the story.
OracleGuide.journal.example.1.who=You
OracleGuide.journal.example.1.text=Right after asking about the militia, I press Journal note at the bottom. It opens a \
  note that already quotes the answer, then I write what happened on the ridge.
OracleGuide.journal.example.2.who=You
OracleGuide.journal.example.2.text=Months later I open “Who sent Natasha?”, press Read storyline, and read \
  the whole storyline in order.
OracleGuide.journal.term.1.name=Note
OracleGuide.journal.term.1.text=Something you wrote. Supports bold, italic, underline, headings and lists.
OracleGuide.journal.term.2.name=Oracle record
OracleGuide.journal.term.2.text=Written automatically whenever you use the Oracle or a thread changes.
OracleGuide.journal.term.3.name=Tag
OracleGuide.journal.term.3.text=Links an entry to a thread or a person, so you can filter by it.
OracleGuide.journal.term.4.name=Campaign entry
OracleGuide.journal.term.4.text=Something that happened in the campaign itself, recorded automatically.
OracleGuide.journal.term.5.name=Travel log
OracleGuide.journal.term.5.text=Departures and final arrivals of the main force, bases and cast members away from it. \
  History from before it existed is rebuilt from past contracts.

