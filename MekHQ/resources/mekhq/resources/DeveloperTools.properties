# ---- Field tooltips ----
# Contract definition editor
contractEditor.contractTypeName.tooltip=The name of this contract type.
contractEditor.briefing.tooltip=Briefing text shown to the player for contracts of this type.
contractEditor.allowEarlyVictory.tooltip=Whether the contract can be completed before its full duration elapses.
contractEditor.deploymentEncounterOdds.tooltip=Possible per-sector odds (percent chance) that a formation deploying to a sector encounters the enemy. One value is chosen at random for each sector. Scenario tempo is not set here; it follows contract scale.
contractEditor.deploymentTimes.tooltip=Possible deployment durations. One value is chosen at random when a scenario is deployed.
contractEditor.globalScenarioModifiers.tooltip=Scenario modifier file names applied to every scenario generated for this contract. Use sparingly.
contractEditor.objectiveParameters.tooltip=Strategic objectives the player must complete for this contract type.
contractEditor.pointsOfInterest.tooltip=Points of interest that are not strategic objectives, placed on the contract's sectors over its months. Points of interest that are objectives are set on a Point Of Interest objective instead.
# Objective parameter sub-editor
objectiveEditor.objectiveType.tooltip=The kind of action required to complete this strategic objective.
objectiveEditor.objectiveCount.tooltip=How many of this objective are required. A negative value scales the count to the contract's required lances, multiplied by that factor. Not used for Specific Scenario Victory objectives - how many of those appear is driven by the contract's scenario schedule (the Track Intensity Table), so the field is disabled for that type.
objectiveEditor.objectiveScenarios.tooltip=File names of specific scenarios used for this objective. Ignored for objective types that do not use named scenarios (e.g. Any Scenario Victory).
objectiveEditor.objectiveScenarioModifiers.tooltip=Scenario modifier file names applied to this objective's scenarios.
objectiveEditor.objectivePointsOfInterest.tooltip=Point of interest type IDs for this objective; each objective picks one at random. Used only by Point Of Interest objectives, where at least one is required. A count of 0 still places one.
pointOfInterestEditor.typeId.tooltip=The type ID of the point of interest's definition. Pick a known type, or type in one registered from code.
pointOfInterestEditor.count.tooltip=How many to place across the contract's sectors over its months. A negative value scales the count to the contract's size, multiplied by that factor, and may round down to none; 0 means none.
# Scenario modifier editor
modifierEditor.modifierName.tooltip=The modifier's name, used to identify it and shown when it is applied.
modifierEditor.additionalBriefingText.tooltip=Text appended to the scenario briefing when this modifier is applied.
modifierEditor.benefitsPlayer.tooltip=Whether this modifier helps the player. Used to sort modifiers into beneficial and detrimental pools.
modifierEditor.blockFurtherEvents.tooltip=If set, no further random modifiers are added to the scenario after this one.
modifierEditor.eventTiming.tooltip=When the modifier is processed: before or after the scenario's primary forces are generated.
modifierEditor.eventRecipient.tooltip=Which side the effects target. Required for the skill, quality, damage, ammo, unit-removal, ambush, side-switch and reinforcement effects to apply.
modifierEditor.skillAdjustment.tooltip=Adjusts the skill level of the event recipient's forces. Requires an event recipient.
modifierEditor.qualityAdjustment.tooltip=Adjusts the equipment quality of the event recipient's forces. Requires an event recipient.
modifierEditor.battleDamageIntensity.tooltip=Applies pre-battle damage to the event recipient's units; higher values cause more damage. Requires an event recipient.
modifierEditor.ammoExpenditureIntensity.tooltip=Reduces the starting ammunition of the event recipient's units; higher values remove more. Requires an event recipient.
modifierEditor.unitRemovalCount.tooltip=Number of units to remove from the event recipient's force. Requires an event recipient.
modifierEditor.numExtraEvents.tooltip=Number of additional scenario events to spawn when this modifier is applied.
modifierEditor.bvBudgetAdditiveMultiplier.tooltip=Multiplier applied to the effective player battle value for this scenario, scaling how strong the generated opposing force is.
modifierEditor.reinforcementDelayReduction.tooltip=Reduces the number of rounds before the event recipient's reinforcements arrive. Requires an event recipient.
modifierEditor.useAmbushLogic.tooltip=If set, sets up ambush (hidden deployment) logic for the event recipient. Requires an event recipient.
modifierEditor.switchSides.tooltip=If set, moves the event recipient's forces to the opposing side. Requires an event recipient.
modifierEditor.allowedMapLocations.tooltip=Restrict this modifier to scenarios in the checked map locations. Leave all unchecked to allow any location.
# StratCon facility editor
facilityEditor.owner.tooltip=Which side owns the facility.
facilityEditor.displayableName.tooltip=The facility name shown to the player.
facilityEditor.facilityType.tooltip=The facility's category (e.g. Mek Base, Air Base, Data Center).
facilityEditor.userDescription.tooltip=Description shown to the player for this facility.
facilityEditor.visible.tooltip=For hostile facilities, whether it starts revealed on the track. Allied facilities are always visible.
facilityEditor.isAvailable.tooltip=Whether the facility is currently available to interact with. Defaults to true.
facilityEditor.sharedModifiers.tooltip=Scenario modifier file names applied to scenarios anywhere on the same track as this facility (one per line).
facilityEditor.localModifiers.tooltip=Scenario modifier file names applied to scenarios that involve this facility directly (one per line).
facilityEditor.capturedDefinition.tooltip=File name of the facility definition to switch to when this facility's ownership changes. Leave blank if it cannot be captured.
facilityEditor.revealTrack.tooltip=If set, controlling this facility reveals the entire track.
facilityEditor.increaseScanRange.tooltip=If set, controlling this facility increases scan range on the track.
facilityEditor.scenarioOddsModifier.tooltip=Adjustment (percent) to scenario odds on the track while this facility is controlled.
facilityEditor.monthlySPModifier.tooltip=Monthly Support Point adjustment granted while this facility is controlled.
facilityEditor.preventAerospace.tooltip=Whether this facility, whichever side holds it, stops air and space scenarios from being generated on its track.
facilityEditor.strategicObjective.tooltip=Whether this facility is a strategic objective for the contract.
facilityEditor.biomes.tooltip=Terrain and temperature constraints controlling where this facility may be placed.

pointOfInterestDefinitionEditor.typeId.tooltip=The unique ID of this point of interest type. Contract definitions, placed points of interest in saved campaigns, and code all refer to the type by this ID, so do not rename a shipped type. Required.
pointOfInterestDefinitionEditor.displayableName.tooltip=The name shown to the player.
pointOfInterestDefinitionEditor.description.tooltip=Description shown to the player for this point of interest.
pointOfInterestDefinitionEditor.imagePath.tooltip=The map sprite, as a path from the working directory (for example data/images/stratcon/...). Leave blank to draw a plain marker.
pointOfInterestDefinitionEditor.behaviorId.tooltip=The ID of the behavior that decides what happens when a formation deploys to, is scouted near, or ignores this point of interest. Pick a registered behavior, or type in one registered from code. An unknown ID falls back to "default", which does nothing.
pointOfInterestDefinitionEditor.defaultOwner.tooltip=The side newly placed points of interest of this type belong to. Neutral means no owner.
pointOfInterestDefinitionEditor.occupiesHex.tooltip=Whether this point of interest takes up its hex, the way a facility or scenario does.
pointOfInterestDefinitionEditor.hiddenUntilScouted.tooltip=Whether this point of interest stays hidden from the player until its hex is scouted.
pointOfInterestDefinitionEditor.lifespanDays.tooltip=How many days a newly placed point of interest lasts, before any lifespan die is added. With no lifespan die, 0 means it never expires.
pointOfInterestDefinitionEditor.lifespanDieSides.tooltip=The sides of a die rolled and added to the lifespan each time one is placed; 0 rolls nothing. For example, a lifespan of 0 with a 6-sided die lasts 1 to 6 days.
pointOfInterestDefinitionEditor.removeOnExpiry.tooltip=Whether an expired point of interest is removed from the map, rather than left in place marked as expired.
pointOfInterestDefinitionEditor.scenarioOddsModifier.tooltip=How much each active point of interest of this type shifts its sector's scenario odds (percent). A behavior may change when this applies.
pointOfInterestDefinitionEditor.scanRangeIncrease.tooltip=How many hexes each active point of interest of this type, held by the player or an ally, adds to its sector's scan range. A behavior may change when this applies.
pointOfInterestDefinitionEditor.landOnly.tooltip=Whether this point of interest may only be placed on land, not water.
pointOfInterestDefinitionEditor.avoidCities.tooltip=Whether placement should avoid city hexes.
pointOfInterestDefinitionEditor.allowedTerrainCategories.tooltip=The terrain this point of interest may be placed on, one per line: each names a terrain type (such as Plains) or a terrain category (such as VEGETATION), matched ignoring case. Leave empty to allow any terrain.
# Biome sub-editor
biomeEditor.biomeCategory.tooltip=Category grouping this biome. Biomes sharing a category are selected together by temperature.
biomeEditor.allowedTemperatureLowerBound.tooltip=Lowest temperature (Kelvin) at which this biome's terrain applies.
biomeEditor.allowedTemperatureUpperBound.tooltip=Highest temperature (Kelvin) at which this biome's terrain applies.
biomeEditor.allowedTerrainTypes.tooltip=Terrain types available for this biome (one per line).
# Faction Standing Ultimatum editor
ultimatumEditor.title=Faction Standing Ultimatum Editor
ultimatumEditor.name=Name:
ultimatumEditor.name.tooltip=The unique ID of this ultimatum, in upper case (for example FED_COM_CIVIL_WAR). The dialog text keys are built from it, so do not rename a shipped ultimatum. Required.
ultimatumEditor.date=Date:
ultimatumEditor.date.tooltip=The day the ultimatum is presented, as yyyy-MM-dd. It only fires for campaigns that advance into this exact day. Required.
ultimatumEditor.notes=Developer Notes:
ultimatumEditor.notes.tooltip=Why this ultimatum and date were chosen. Never shown to the player.
ultimatumEditor.affectedFactionCodes=Affected Factions (one per line):
ultimatumEditor.affectedFactionCodes.tooltip=Faction codes whose campaigns receive this ultimatum. A faction can only receive one ultimatum per date. At least one is required.
ultimatumEditor.sides=Sides:
ultimatumEditor.sides.tooltip=The sides the player can choose between, in the order the picker shows them. The first side delivers the opening offer. Mercenary and Pirate are always offered after them. At least one side is required.
ultimatumEditor.sides.add=Add Side
ultimatumEditor.sides.remove=Remove Side
ultimatumEditor.sides.up=Move Up
ultimatumEditor.sides.down=Move Down
ultimatumEditor.sideId=Side ID:
ultimatumEditor.sideId.tooltip=The selected side's ID, in upper case (usually its faction code). Its card text is FactionStandingUltimatumDialog.<name>.side.<ID>.pitch and its news bulletin is .news.
ultimatumEditor.sideName=Leader Name:
ultimatumEditor.sideName.tooltip=The full name, including any title, of the person asking for the campaign's support on this side.
ultimatumEditor.sideRole=Leader Role:
ultimatumEditor.sideRole.tooltip=That person's role, used when generating them for the dialogs.
ultimatumEditor.sideFactionCode=Side Faction:
ultimatumEditor.sideFactionCode.tooltip=The faction code the campaign joins if it chooses this side. Its logo is shown on the side's card.
ultimatumEditor.dissenterPreference=Dissenter Prefers:
ultimatumEditor.dissenterPreference.tooltip=The side the second-in-command, the single dissenting voice, wants the campaign to choose, or ROGUE if they want it to go rogue. If the player chooses anything else, they leave the unit (or are killed, in a violent ultimatum).
ultimatumEditor.isViolentTransition=Violent Transition:
ultimatumEditor.isViolentTransition.tooltip=If checked, personnel who refuse the player's choice are killed rather than deserting, and leaving the current faction counts as a defection. The fighting also damages the campaign's Meks, vehicles, and fighters: the share of units damaged matches the share of personnel who left, and the damage is light below 15%, moderate below 35%, and heavy above that.
ultimatumEditor.divisiveness=Divisiveness:
ultimatumEditor.divisiveness.tooltip=How divisive this ultimatum is, from -6 to +6. It is added to the target number of the 2d6 loyalty check each character makes to follow the player's decision (normally 6, adjusted by their loyalty). Positive values make more characters refuse to follow, negative values fewer. 0 leaves the check unchanged.
ultimatumEditor.addToManifest.tooltip=Register the saved ultimatum file in the sibling ultimatummanifest.json so the game loads it. Save or load an ultimatum first.
ultimatumEditor.invalid.message=This ultimatum cannot be saved yet:
ultimatumEditor.problem.name=The name must be upper-case letters, digits, and underscores.
ultimatumEditor.problem.date=The date must be a real date written as yyyy-MM-dd.
ultimatumEditor.problem.affectedFactionCodes=At least one affected faction is required.
ultimatumEditor.problem.divisiveness=Divisiveness must be between -6 and +6.
ultimatumEditor.problem.noSides=At least one side is required.
ultimatumEditor.problem.side=Every side needs an upper-case ID, a leader name, a role, and a faction.
ultimatumEditor.problem.duplicateSideId=Every side needs a different ID.
ultimatumEditor.problem.sameFaction=Every side must belong to a different faction.
ultimatumEditor.problem.dissenterPreference=The dissenter must prefer one of the sides, or ROGUE.
ultimatumEditor.saveError.message=Could not save the ultimatum. See the log for details.
ultimatumEditor.missingText.message=Saved. This ultimatum still needs these keys in FactionStandingUltimatumDialog.properties:\n{0}
