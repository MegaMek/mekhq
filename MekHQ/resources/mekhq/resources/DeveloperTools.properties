# ---- Field tooltips ----
# Contract definition editor
contractEditor.contractTypeName.tooltip=The name of this contract type.
contractEditor.briefing.tooltip=Briefing text shown to the player for contracts of this type.
contractEditor.alliedFacilityCount.tooltip=Extra allied facilities to place, beyond any placed by objectives. A negative value scales the count to the contract's required lances; 0 means none.
contractEditor.hostileFacilityCount.tooltip=Extra hostile facilities to place, beyond any placed by objectives. A negative value scales the count to the contract's required lances; 0 means none.
contractEditor.allowEarlyVictory.tooltip=Whether the contract can be completed before its full duration elapses.
contractEditor.scenarioOdds.tooltip=Possible per-track scenario odds (percent chance of a scenario). One value is chosen at random for each track.
contractEditor.deploymentTimes.tooltip=Possible deployment durations. One value is chosen at random when a scenario is deployed.
contractEditor.globalScenarioModifiers.tooltip=Scenario modifier file names applied to every scenario generated for this contract. Use sparingly.
contractEditor.objectiveParameters.tooltip=Strategic objectives the player must complete for this contract type.
# Objective parameter sub-editor
objectiveEditor.objectiveType.tooltip=The kind of action required to complete this strategic objective.
objectiveEditor.objectiveCount.tooltip=How many of this objective are required. A negative value scales the count to the contract's required lances, multiplied by that factor.
objectiveEditor.objectiveScenarios.tooltip=File names of specific scenarios used for this objective. Ignored for objective types that do not use named scenarios (e.g. Any Scenario Victory).
objectiveEditor.objectiveScenarioModifiers.tooltip=Scenario modifier file names applied to this objective's scenarios.
# Scenario modifier editor
modifierEditor.modifierName.tooltip=The modifier's name, used to identify it and shown when it is applied.
modifierEditor.additionalBriefingText.tooltip=Text appended to the scenario briefing when this modifier is applied.
modifierEditor.benefitsPlayer.tooltip=Whether this modifier helps the player. Used to sort modifiers into beneficial and detrimental pools.
modifierEditor.blockFurtherEvents.tooltip=If set, no further random modifiers are added to the scenario after this one.
modifierEditor.eventTiming.tooltip=When the modifier is processed: before or after the scenario's primary forces are generated.
modifierEditor.eventRecipient.tooltip=Which side the effects target. Required for the skill, quality, damage, ammo, unit-removal, ambush, side-switch and reinforcement effects to apply.
modifierEditor.skillAdjustment.tooltip=Adjusts the skill level of the event recipient's forces. Requires an event recipient.
modifierEditor.qualityAdjustment.tooltip=Adjusts the equipment quality of the event recipient's forces. Requires an event recipient.
modifierEditor.battleDamageIntensity.tooltip=Applies pre-battle damage to the event recipient's units; higher values cause more damage. Requires an event recipient.
modifierEditor.ammoExpenditureIntensity.tooltip=Reduces the starting ammunition of the event recipient's units; higher values remove more. Requires an event recipient.
modifierEditor.unitRemovalCount.tooltip=Number of units to remove from the event recipient's force. Requires an event recipient.
modifierEditor.numExtraEvents.tooltip=Number of additional scenario events to spawn when this modifier is applied.
modifierEditor.bvBudgetAdditiveMultiplier.tooltip=Multiplier applied to the effective player battle value for this scenario, scaling how strong the generated opposing force is.
modifierEditor.reinforcementDelayReduction.tooltip=Reduces the number of rounds before the event recipient's reinforcements arrive. Requires an event recipient.
modifierEditor.useAmbushLogic.tooltip=If set, sets up ambush (hidden deployment) logic for the event recipient. Requires an event recipient.
modifierEditor.switchSides.tooltip=If set, moves the event recipient's forces to the opposing side. Requires an event recipient.
modifierEditor.allowedMapLocations.tooltip=Restrict this modifier to scenarios in the checked map locations. Leave all unchecked to allow any location.
# StratCon facility editor
facilityEditor.owner.tooltip=Which side owns the facility.
facilityEditor.displayableName.tooltip=The facility name shown to the player.
facilityEditor.facilityType.tooltip=The facility's category (e.g. Mek Base, Air Base, Data Center).
facilityEditor.userDescription.tooltip=Description shown to the player for this facility.
facilityEditor.visible.tooltip=For hostile facilities, whether it starts revealed on the track. Allied facilities are always visible.
facilityEditor.isAvailable.tooltip=Whether the facility is currently available to interact with. Defaults to true.
facilityEditor.sharedModifiers.tooltip=Scenario modifier file names applied to scenarios anywhere on the same track as this facility (one per line).
facilityEditor.localModifiers.tooltip=Scenario modifier file names applied to scenarios that involve this facility directly (one per line).
facilityEditor.capturedDefinition.tooltip=File name of the facility definition to switch to when this facility's ownership changes. Leave blank if it cannot be captured.
facilityEditor.revealTrack.tooltip=If set, controlling this facility reveals the entire track.
facilityEditor.increaseScanRange.tooltip=If set, controlling this facility increases scan range on the track.
facilityEditor.scenarioOddsModifier.tooltip=Adjustment (percent) to scenario odds on the track while this facility is controlled.
facilityEditor.monthlySPModifier.tooltip=Monthly Support Point adjustment granted while this facility is controlled.
facilityEditor.preventAerospace.tooltip=Whether this facility prevents aerospace operations on its track.
facilityEditor.strategicObjective.tooltip=Whether this facility is a strategic objective for the contract.
facilityEditor.biomes.tooltip=Terrain and temperature constraints controlling where this facility may be placed.
# Biome sub-editor
biomeEditor.biomeCategory.tooltip=Category grouping this biome. Biomes sharing a category are selected together by temperature.
biomeEditor.allowedTemperatureLowerBound.tooltip=Lowest temperature (Kelvin) at which this biome's terrain applies.
biomeEditor.allowedTemperatureUpperBound.tooltip=Highest temperature (Kelvin) at which this biome's terrain applies.
biomeEditor.allowedTerrainTypes.tooltip=Terrain types available for this biome (one per line).
