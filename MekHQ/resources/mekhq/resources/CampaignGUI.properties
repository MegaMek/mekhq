map.legend.dialog.title=Map Symbols
map.legend.selectedSystem.title=Selected system
map.legend.selectedSystem.description=An amber ring identifies the selected system at distant zoom; corner brackets replace it as navigation detail appears.
map.legend.hoveredSystem.title=Hovered system
map.legend.hoveredSystem.description=A cyan ring identifies the system under the pointer at distant zoom; corner brackets replace it closer in. Selected systems suppress hover.
map.legend.currentFleet.title=Current fleet
map.legend.currentFleet.description=An amber JumpShip above-right of a system marks the fleet. At distant zoom, an amber ring surrounding the system replaces the ship.
map.legend.playerBase.title=Player base
map.legend.playerBase.description=A teal marker identifies a system with player bases. Navigation detail adds the number of bases when more than one share the system.
map.legend.plannedRoute.title=Planned route
map.legend.plannedRoute.description=A cyan dashed path remains visible at distant zoom; complete thin stop rings appear with navigation detail.
map.legend.activeRoute.title=Active route
map.legend.activeRoute.description=Amber paths remain visible at distant zoom; complete stop rings appear with navigation detail.
map.legend.waypointBadge.title=Waypoint number
map.legend.waypointBadge.description=At navigation zoom, a numbered badge below-right of a system gives each requested route stop's order.
map.legend.reachability.title=Reachability shells
map.legend.reachability.description=At navigation zoom, centered shapes show minimum hops: cyan circles mark one, squares mark two, and hexagons mark three.
map.legend.reachabilityCaution.title=Reachability caution
map.legend.reachabilityCaution.description=At navigation zoom, an amber triangle surrounding a system marks it as reachable with a caution.
map.legend.reachabilityBlocked.title=Blocked reachability
map.legend.reachabilityBlocked.description=At navigation zoom, a red diamond surrounding a system marks the blocked frontier.
map.legend.routeCaution.title=Route caution
map.legend.routeCaution.description=An amber triangle to the right of a system marks an allowed route leg with a grounded caution, such as an abandoned destination.
map.legend.routeBlocked.title=Blocked route leg
map.legend.routeBlocked.description=A red dashed segment and diamond to the right of its destination mark a leg blocked by range, access, avoidance, or recharge constraints.
map.legend.measurement.title=Distance measurement
map.legend.measurement.description=A pale dash-dot line uses a circle surrounding endpoint A and a diamond surrounding endpoint B for a transient direct measurement.
map.legend.contractSearchRadius.title=Contract-search radius
map.legend.contractSearchRadius.description=A configurable-color thick dashed ring centered on the selected system bounds contract searches; campaign and MekHQ options control visibility.
map.legend.planetaryAcquisitionRadius.title=Planetary-acquisition radius
map.legend.planetaryAcquisitionRadius.description=A configurable-color thick dash-dot ring centered on the selected system bounds planetary acquisition; campaign, MekHQ, and zoom options control visibility.
map.legend.jumpRadius.title=Jump radius
map.legend.jumpRadius.description=A configurable-color thick solid ring centered on the selected system shows one-jump reach; MekHQ and zoom options control visibility.
map.legend.hpgRange.title=50 ly HPG range
map.legend.hpgRange.description=A dark-green dotted ring centered on the selected system marks 50 ly; HPG layer visibility controls when it appears.
map.legend.capitalHierarchy.title=Capital hierarchy
map.legend.capitalHierarchy.description=National capitals use five-point stars, regional capitals use four-ray compass stars, and district capitals use simple pips. Layers controls the visible tiers; districts appear only at navigation detail.
map.legend.operation.title=Operation flag
map.legend.operation.description=At distant zoom, a centered red diamond marks an urgent active scenario. Closer in, flags show missions, scenarios, and mission counts.
map.legend.restrictedSystem.title=Restricted system
map.legend.restrictedSystem.description=A red prohibition ring marks a system barred by outlaw or restricted-entry standing rules.
map.legend.gmEditedSystem.title=GM-edited system
map.legend.gmEditedSystem.description=At detail zoom, a cyan pencil below a system marks a non-canon override.
map.legend.factionOwnership.title=Faction ownership
map.legend.factionOwnership.description=Compact contacts use faction color at navigation zoom; detail zoom shows intrinsic stars with crisp ownership rings. Shared systems divide both equally.
map.legend.technology.title=Technology
map.legend.technology.description=Regressed is dark gray; F purple; D blue; C teal; B green; A or Advanced yellow; no population is black.
map.legend.industry.title=Industry
map.legend.industry.description=F is near-black; D purple; C magenta; B coral; A pale yellow; no population is black.
map.legend.rawMaterials.title=Raw Materials
map.legend.rawMaterials.description=F is blue; D purple; C magenta; B orange; A yellow; no population is black.
map.legend.output.title=Output
map.legend.output.description=F is near-black; D purple; C magenta; B orange; A pale yellow; no population is black.
map.legend.agriculture.title=Agriculture
map.legend.agriculture.description=F is dark blue; D blue-gray; C gray; B tan; A yellow; no population is black.
map.legend.population.title=Population
map.legend.population.description=Purple marks under 1M, then colors progress through violet, blue, teal, and green across 1M, 25M, 100M, 200M, 300M, 500M, 1B, and 1.5B; 3B+ is yellow; none is black.
map.legend.hpg.title=HPG
map.legend.hpg.description=No HPG is black; D dark gray; C light gray; B pink; A pale yellow.
map.legend.rechargeStations.title=Recharge Stations
map.legend.rechargeStations.description=No station is gray; one station coral; two stations yellow; unavailable data black.
map.legend.academies.title=Academies
map.legend.academies.description=None is black; academy counts 1 through 6 progress from blue-teal through teal and green to yellow.
map.legend.hiringHalls.title=Hiring Halls
map.legend.hiringHalls.description=None is black; Questionable magenta; Minor orange; Standard yellow; Great green.
map.legend.diseaseOutbreaks.title=Disease Outbreaks
map.legend.diseaseOutbreaks.description=None is black; one outbreak yellow; two orange; three magenta; four or more purple.
map.legend.hpgStations.title=HPG station classes
map.legend.hpgStations.description=Hexagonal badges identify included HPG stations: A cyan, B blue, C amber, and D red. Network links are drawn only for A and B stations.
map.legend.factionEmblem.title=Faction emblem
map.legend.factionEmblem.description=A faint emblem watermark identifies territory; its tint identifies the faction.
map.legend.hpgNetwork.title=HPG network
map.legend.hpgNetwork.description=Class A uses restrained solid cyan links; Class B uses thinner muted dashes. Distant zoom keeps only Class A, while lower-class station badges wait for close detail.
map.legend.administrativeBoundaries.title=Administrative boundaries
map.legend.administrativeBoundaries.description=Solid faction-color lines divide regions; quieter dashed lines add districts. Boundaries stop where membership is missing or conflicts.
map.legend.sovereignTerritory.title=Sovereign border
map.legend.sovereignTerritory.description=Translucent faction fill and a solid edge mark territory inferred from dated ownership.
map.legend.disputedTerritory.title=Disputed territory
map.legend.disputedTerritory.description=Multiple faction colors, diagonal hatching, and a dashed border mark shared control.
map.legend.unclaimedPocket.title=Unclaimed pocket
map.legend.unclaimedPocket.description=A dark enclosed void with a dotted boundary marks locally unclaimed space.
map.legend.enclave.title=Enclave
map.legend.enclave.description=A closed double border marks one faction's territory enclosed by another.
