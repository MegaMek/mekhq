DefaultKitCampaignOptionsChangedConfirmationDialog.description=<h1 style="text-align:center">Default Kits</h1>\
  You have just changed the following default kits:\
  <ul>{0}</ul>\
  <p>Would you like to switch everyone currently carrying an old default kit onto its replacement? New kits are drawn \
  from stores and the old ones returned. Any shortfall is ordered through procurement and paid for as usual, and \
  swapped in as it arrives.</p>
DefaultKitCampaignOptionsChangedConfirmationDialog.change=<li><b>{0}:</b> {1} &rarr; {2}</li>
DefaultKitCampaignOptionsChangedConfirmationDialog.cancel=Decline
DefaultKitCampaignOptionsChangedConfirmationDialog.confirm=Switch Everyone
