Guide.eyebrow=Guide · {0}
Guide.exampleIntro=An example, step by step.

Guide.skills.title=Training skills
Guide.skills.step.1.title=Choose people
Guide.skills.step.1.text=Filter the list on the left, then click people to select them. Shift-click selects a range, and Ctrl+A selects everyone shown. Your selection stays when you change filters or pages.
Guide.skills.step.2.title=Read the card
Guide.skills.step.2.text=Each skill shows how many of the selected people can raise it now, how many are short on XP, and what it costs in XP and training fees.
Guide.skills.step.3.title=Stage it
Guide.skills.step.3.text=Raise everyone by one level, or open the card and train everyone to a level you choose. Nothing is spent until you commit.
Guide.skills.example.1.who=You
Guide.skills.example.1.text=Select the whole battalion and open Gunnery/Mek.
Guide.skills.example.2.who=Console
Guide.skills.example.2.text=Shows that 412 can improve now and that 31 reaching Regular will cost training fees.
Guide.skills.example.3.who=You
Guide.skills.example.3.text=Choose level 4 and stage it. The Review page lists every improvement before you commit.
Guide.skills.term.1.name=Training fee
Guide.skills.term.1.text=When skill improvements cost C-bills, a fee is charged only when an improvement reaches a new experience level, Regular or higher.
Guide.skills.term.2.name=Natural Aptitude
Guide.skills.term.2.text=A one-off purchase that makes a skill cheaper to train.

Guide.abilities.title=Granting abilities
Guide.abilities.step.1.title=Pick a group
Guide.abilities.step.1.text=Combat, Maneuvering and Utility list the abilities people can earn. Flaws can be taken for XP or bought off.
Guide.abilities.step.2.title=See who qualifies
Guide.abilities.step.2.text=The bar shows who can take the ability now, who is short on XP, who already has it, and who is blocked. Open a card for the reasons, and a link to select each group.
Guide.abilities.step.3.title=Choices
Guide.abilities.step.3.text=Abilities like Weapon Specialist can take each person’s own weapon from their unit, so a whole company can gain them in one step.
Guide.abilities.example.1.who=You
Guide.abilities.example.1.text=Select every MekWarrior with Gunnery 3 or better and open Weapon Specialist.
Guide.abilities.example.2.who=Console
Guide.abilities.example.2.text=Resolves it to each pilot’s most-mounted weapon: Medium Laser ×40, PPC ×31, and so on.
Guide.abilities.term.1.name=Prerequisite
Guide.abilities.term.1.text=A skill level or ability a person needs first. Training staged earlier counts, so you can train a skill and then grant the ability it unlocks.

Guide.attributes.title=Attributes and traits
Guide.attributes.step.1.title=Raise attributes
Guide.attributes.step.1.text=Each attribute shows the range across the selection and how many can raise it now.
Guide.attributes.step.2.title=Move traits
Guide.attributes.step.2.text=Some trait steps cost XP and others give it back, as the Spend XP menu has always priced them.
Guide.attributes.example.1.who=You
Guide.attributes.example.1.text=Select everyone who has spent Edge and refill it in one step.
Guide.attributes.term.1.name=Edge
Guide.attributes.term.1.text=Rerolls a person can spend; refilling restores the ones they have used.

Guide.auto_train.title=Auto-train
Guide.auto_train.step.1.title=Set the rules
Guide.auto_train.step.1.text=Train role skills as Quick Train did, or one skill for everyone who has it, as Mass Training did, up to a level you choose.
Guide.auto_train.step.2.title=Check the preview
Guide.auto_train.step.2.text=The preview shows every improvement it would make, its XP and training fees, and who it skips.
Guide.auto_train.step.3.title=Save presets
Guide.auto_train.step.3.text=Save settings as a preset for this campaign. A preset can run by itself at the start of each month.
Guide.auto_train.example.1.who=You
Guide.auto_train.example.1.text=Choose role skills up to level 4, until the target or out of XP, keeping 50 XP in reserve.
Guide.auto_train.example.2.who=Console
Guide.auto_train.example.2.text=Previews the improvements across the whole selection, then stages them as one step.
Guide.auto_train.term.1.name=Reserve
Guide.auto_train.term.1.text=XP each person keeps back for something else.

Guide.review.title=Review and commit
Guide.review.step.1.title=Check the totals
Guide.review.step.1.text=Every staged step, with its people, XP and training fees, and the fees by category against your funds.
Guide.review.step.2.title=Change your mind
Guide.review.step.2.text=Remove any step, or Undo the last one. Steps after it are priced again.
Guide.review.step.3.title=Commit
Guide.review.step.3.text=Commit applies everything in order and writes it to the daily report and personnel logs.
Guide.review.example.1.who=You
Guide.review.example.1.text=Remove a step you no longer want; the rest stay staged.
Guide.review.term.1.name=All or nothing
Guide.review.term.1.text=Training is only staged, and only committed, if the campaign can pay every training fee involved.
