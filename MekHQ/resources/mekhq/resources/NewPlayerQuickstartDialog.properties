NewPlayerQuickstartDialog.inCharacter=You've finally done it. The charter's signed, the bonding fee is paid, and three\
  \ lances of 'Meks are sitting in a rented hangar on <b>Galatea</b> - the mercenary capital of the Inner Sphere - with\
  \ your name on the paperwork.\
  <br><br>It isn't much yet: a company of MekWarriors, the techs and support crews to keep them walking, and enough\
  \ C-Bills to see you through your first contract if you're careful. What you need now is work.\
  <br><br>The hiring halls are open, and every House in the Inner Sphere has a job that needs doing - and more than a\
  \ few that need doing quietly.\
  <br><br>Pull up the contract market. It's time to make a name for yourself.
