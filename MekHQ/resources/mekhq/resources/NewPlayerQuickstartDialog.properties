NewPlayerQuickstartDialog.section.outOfCharacter=How the Quickstart Works
NewPlayerQuickstartDialog.outOfCharacter=No setup needed: MekHQ builds a brand-new mercenary company for you using the\
  \ <b>New Players Start Here</b> rules preset, so every company is different. All you have to do is pick your first\
  \ contract from the contract market.\
  <br><br>As you grow more comfortable, any of the rules can be changed in <b>Campaign Options</b>.
NewPlayerQuickstartDialog.footer.summary=Building your company may take a few moments.
