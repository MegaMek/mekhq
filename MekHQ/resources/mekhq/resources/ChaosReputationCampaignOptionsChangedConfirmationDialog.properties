ChaosReputationCampaignOptionsChangedConfirmationDialog.description=<h1 style="text-align:center">Chaos Campaign \
  Reputation</h1>\
  You have just enabled <b>Chaos Campaign Reputation</b>, which tracks your unit''s standing based on the contracts \
  it completes. Successful contracts raise your Reputation, while breaching a contract lowers it.\
  <p>Would you like to update your campaign and personnel to reflect your past contracts? If you accept, your \
  Reputation will be tabulated from every contract you have already completed.</p>\
  <p>{0}This is a permanent change and cannot be undone.{1}</p>
ChaosReputationCampaignOptionsChangedConfirmationDialog.cancel=No, Start Fresh
ChaosReputationCampaignOptionsChangedConfirmationDialog.confirm=Yes, Update
ChaosReputationCampaignOptionsChangedConfirmationDialog.report=<b>Chaos Campaign Reputation</b> has been initialized \
  from past contracts. Your unit''s Reputation is now <b>{0}</b>.
