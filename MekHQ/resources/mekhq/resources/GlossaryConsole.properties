GlossaryGuide.glossary.button=How the glossary works
GlossaryGuide.glossary.title=Using the glossary
GlossaryGuide.glossary.step.1.title=Search for what you remember
GlossaryGuide.glossary.step.1.text=Type any words you remember reading, even if you have forgotten what the entry is \
  called. Entries with your words in their titles come first; entries that only use them in their text follow, with \
  the passage that mentions them.
GlossaryGuide.glossary.step.2.title=Narrow a search
GlossaryGuide.glossary.step.2.text=Every word you type must appear in an entry for it to be listed. Put a phrase in \
  "double quotes" to find those words together. Untick Search entry text to look at titles only.
GlossaryGuide.glossary.step.3.title=Find what changed
GlossaryGuide.glossary.step.3.text=The tiles across the top count the entries added or updated in this build and \
  since the last core release. Click a tile, or one of the chips under the search box, to list only those entries. \
  Newest lists everything by when it last changed.
GlossaryGuide.glossary.step.4.title=Keep track of what you have read
GlossaryGuide.glossary.step.4.text=A dot marks an entry that has changed since you last read it. Reading the entry \
  clears the dot, and Mark all read clears every one. If an entry changes again, its dot comes back.
GlossaryGuide.glossary.step.5.title=Follow the links
GlossaryGuide.glossary.step.5.text=Hover over a link in an entry to preview where it leads, and click to go there. The \
  side panel lists the entries this one mentions and the entries that mention it. Back and Forward retrace your steps; \
  Overview returns to the front page.
GlossaryGuide.glossary.step.6.title=Take it with you
GlossaryGuide.glossary.step.6.text=Export PDF saves the entry you are reading, the entries listed, everything changed \
  since the last core release, or the whole glossary, to print or read away from MekHQ.
GlossaryGuide.glossary.exampleIntro=A short example. Your own searches will be different.
GlossaryGuide.glossary.example.1.who=You
GlossaryGuide.glossary.example.1.text=Type paperwork. You remember the word from somewhere, but not where.
GlossaryGuide.glossary.example.2.who=Glossary
GlossaryGuide.glossary.example.2.text=No title has the word, so HR Strain is listed under Found in entry text, \
  with the sentence about paperwork beneath it.
GlossaryGuide.glossary.example.3.who=You
GlossaryGuide.glossary.example.3.text=Press the down arrow and Enter to open it. The word is highlighted where it \
  appears.
GlossaryGuide.glossary.example.4.who=Glossary
GlossaryGuide.glossary.example.4.text=The side panel shows the entries HR Strain mentions. Click one to read on, and \
  Back to return.
GlossaryGuide.glossary.term.1.name=This build
GlossaryGuide.glossary.term.1.text=Added or updated in the version of MekHQ you are running.
GlossaryGuide.glossary.term.2.name=Since last core
GlossaryGuide.glossary.term.2.text=Added or updated since the last core release, a version \
  numbered like 0.51.00. Builds between core releases are where most changes first appear.
GlossaryGuide.glossary.term.3.name=Unread
GlossaryGuide.glossary.term.3.text=Changed since the last core release, and not read by you since it changed.
GlossaryGuide.glossary.term.4.name=See also
GlossaryGuide.glossary.term.4.text=The entries this entry links to.
GlossaryGuide.glossary.term.5.name=Referenced by
GlossaryGuide.glossary.term.5.text=The entries that link to this one. Useful for seeing where a rule comes into play.
GlossaryGuide.documentation.button=How documentation works
GlossaryGuide.documentation.title=Reading the guides
GlossaryGuide.documentation.step.1.title=Choose a guide
GlossaryGuide.documentation.step.1.text=The list holds MekHQ's longer guides, from the new player guide \
  to the rules of particular modules. Type in the search box to find one by its title.
GlossaryGuide.documentation.step.2.title=Open it
GlossaryGuide.documentation.step.2.text=Press Enter, double-click it, or use Open document. It opens in the document \
  viewer, where it can be read in full or saved.
GlossaryGuide.documentation.step.3.title=Start with the summary
GlossaryGuide.documentation.step.3.text=Many guides have a shorter glossary entry. Mentioned in, \
  beside the guide, lists the entries that point to it.
GlossaryGuide.documentation.step.4.title=Spot the newer guides
GlossaryGuide.documentation.step.4.text=The This build and Since last core chips list the guides added or updated \
  recently, as they do for glossary entries.
GlossaryGuide.documentation.exampleIntro=A short example.
GlossaryGuide.documentation.example.1.who=You
GlossaryGuide.documentation.example.1.text=Type convoy.
GlossaryGuide.documentation.example.2.who=Glossary
GlossaryGuide.documentation.example.2.text=Resupply & Convoys is listed. Choose it to see the glossary entries that \
  mention it, then Open document to read the full guide.
GlossaryGuide.documentation.term.1.name=Document viewer
GlossaryGuide.documentation.term.1.text=The window guides open in. It can hold several guides at once, each on its own \
  tab.
GlossaryGuide.documentation.term.2.name=Mentioned in
GlossaryGuide.documentation.term.2.text=The glossary entries that link to the guide you have chosen.
