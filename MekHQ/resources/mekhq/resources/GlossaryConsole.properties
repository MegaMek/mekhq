# The guide viewer's own guide
GlossaryGuide.viewer.button=How the viewer works
GlossaryGuide.viewer.eyebrow=Guide \u00b7 Documents
GlossaryGuide.viewer.title=Reading a guide
GlossaryGuide.viewer.step.1.title=Move through the guide
GlossaryGuide.viewer.step.1.text=Scroll, or use the arrow keys and Page Up and Page Down, to go a page at a time. \
  Type a page number in the box above the page to go straight there. The Page tile shows where you are, and which \
  section of the guide you are in.
GlossaryGuide.viewer.step.2.title=Find within the guide
GlossaryGuide.viewer.step.2.text=Type in the find box. Pages with your words are outlined in amber with how many times \
  they appear, and Enter steps from one match to the next; Shift+Enter goes back.
GlossaryGuide.viewer.step.3.title=Size it to suit
GlossaryGuide.viewer.step.3.text=Fit width fills the window; Fit page shows a whole page at once. Zoom in and out for \
  anything in between.
GlossaryGuide.viewer.step.4.title=Take it with you
GlossaryGuide.viewer.step.4.text=Save a copy keeps the guide wherever you like; Open externally hands it to your \
  computer's own PDF reader.
GlossaryGuide.viewer.exampleIntro=A short example.
GlossaryGuide.viewer.example.1.who=You
GlossaryGuide.viewer.example.1.text=Open Prisoners of War & Abstracted Search and Rescue from the glossary, and type \
  ransom in the find box.
GlossaryGuide.viewer.example.2.who=Viewer
GlossaryGuide.viewer.example.2.text=The first page that mentions ransoms comes into view, outlined in amber. The Find \
  tile counts every match and the pages they are on.
GlossaryGuide.viewer.example.3.who=You
GlossaryGuide.viewer.example.3.text=Press Enter to step to the next match. The Page tile shows you are in Prisoner \
