# Auto-generated scenario objective descriptions. Strings use java.text.MessageFormat, so placeholders are {0}, {1}
# and a literal apostrophe must be doubled ('').
#
# Amount phrasing ({0} = the number)
objective.amount.percentage={0}%
objective.amount.units={0,choice,1#{0,number,integer} unit|1<{0,number,integer} units}
# Destination-edge phrasing ({0} = edge name for the named form)
objective.edge.designated=designated map edge
objective.edge.named={0} edge
# Per-criterion sentence ({0} = amount, {1} = edge where relevant)
objective.criterion.destroy=Destroy at least {0} of the marked force(s).
objective.criterion.forceWithdraw=Destroy, cripple or force the withdrawal of at least {0} of the marked force(s).
objective.criterion.capture=Capture at least {0} of the marked force(s).
objective.criterion.preserve=Keep at least {0} of the marked force(s) intact.
objective.criterion.reachMapEdge=Move at least {0} of the marked force(s) to the {1}.
objective.criterion.preventReachMapEdge=Prevent at least {0} of the marked force(s) from reaching the {1}.
# Time limit clause ({0} = number of turns); the leading space is intentional and escaped
objective.timeLimit.atMost=\ within at most {0} turns
objective.timeLimit.atLeast=\ for at least {0} turns
# Success/failure effect phrasing ({0} = the effect magnitude, e.g. "+1 Scenario VP")
objective.effect.ifCompleted={0} if completed
objective.effect.ifFailed={0} if failed
objective.effects.clause=({0})
