LithiumFusionBatteryMode.DISABLED.label=Disabled
LithiumFusionBatteryMode.DISABLED.tooltip=Lithium-Fusion batteries have no effect on interstellar travel.
LithiumFusionBatteryMode.HALVED_RECHARGE.label=Halved Recharge (Unofficial)
LithiumFusionBatteryMode.HALVED_RECHARGE.tooltip=The recharge time between jumps is halved. This reflects the common \
  practice of LF-equipped fleets making a jump every few days, rather than stressing their drives with back-to-back \
  jumps. This is an unofficial rule.
LithiumFusionBatteryMode.DOUBLE_JUMP.label=Double Jump
LithiumFusionBatteryMode.DOUBLE_JUMP.tooltip=The battery holds a second jump charge, allowing two jumps in immediate \
  succession. After jumping, the drive core recharges first and then the battery.
