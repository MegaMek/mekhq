# Guide: Assign page
CrewGuide.assign.title=Choose who goes where
CrewGuide.assign.step.1.title=Pick a location
CrewGuide.assign.step.1.text=People can only crew units where they are. Choose the main force or one of your bases \
  from Location; the people and the units then come from that location. You can't change location while changes are \
  pending.
CrewGuide.assign.step.2.title=Find the units
CrewGuide.assign.step.2.text=Every unit has a card on the right. Needs crew lists units with seats nobody fills, and \
  Needs a tech those nobody maintains. Narrow them down by unit type or formation on the left, or search by name.
CrewGuide.assign.step.3.title=Find the people
CrewGuide.assign.step.3.text=The list in the middle starts with people free to take a seat, best first. Assigned and \
  Everyone include people who already crew a unit; assigning one of them moves them. Pick a role or a condition on \
  the left, or search by name, rank, role or ability, such as Sniper.
CrewGuide.assign.step.4.title=Tick who you want
CrewGuide.assign.step.4.text=Click a person to tick them, and shift-click another to tick everyone in between. The top \
  of the right-hand panel names who is ticked.
CrewGuide.assign.step.5.title=Press Assign on their seat
CrewGuide.assign.step.5.text=Every seat on every card has its own Assign button. It puts the ticked people into that \
  seat on that unit, in the order you ticked them, so who goes where is always your choice. Anyone it has no room \
  for stays ticked, ready for the next seat. Where a seat turns people away it says why; open the card for a line \
  per reason, each with Select them to tick just those people.
CrewGuide.assign.step.6.title=Techs work the same way
CrewGuide.assign.step.6.text=The first line of a card is its tech. Tick a tech and press the button there to give \
  them the unit, or to replace the tech it has; the button shows the daily minutes the unit takes. A tech stays \
  ticked afterwards, as one tech can look after several units. The Techs page does only this, with each tech's \
  time left in view.
CrewGuide.assign.step.7.title=Ask who fits
CrewGuide.assign.step.7.text=Who fits? beside a seat or tech narrows the list to the people who could take it. With one \
  person ticked, a filter above the cards does the reverse, and shows only the units they could go to.
CrewGuide.assign.step.8.title=Taking people out
CrewGuide.assign.step.8.text=The cross after a name takes that person out of the unit, or the tech off it. When a \
  seat is full and someone ticked could hold it, Replace beside a name swaps them in and takes that person out, as \
  one step. Click a card's name to open it: an open card names its whole crew, and can remove them all or fill and \
  remove its temp crew. Unassign selected, above the list, takes the ticked people out of everything.
CrewGuide.assign.step.9.title=Every unit shown at once
CrewGuide.assign.step.9.text=Above the cards, pick a seat chip and Auto-fill puts the best free people into that seat \
  on every unit shown. Pick the Tech chip and it gives them techs the way the Hangar's automatic tech assignment \
  does: the most valuable units first, each to the tech most skilled for it, at most two units per tech, and only \
  techs with the time. Fill temp crew tops them up from the campaign's pool; a unit needs one real crew member \
  first. Spread selected shows where the ticked people would go across the units shown, first ticked into the first \
  unit, and stages nothing until you press Stage.
CrewGuide.assign.step.10.title=Nothing changes until you commit
CrewGuide.assign.step.10.text=Every assignment is staged first. The bar at the bottom counts them, Undo takes back \
  your last action (a whole auto-fill at once), and Commit changes applies them all.
CrewGuide.assign.ringKey=Reading a unit's ring
CrewGuide.assign.ringKey.FULL=Every seat has real crew
CrewGuide.assign.ringKey.TEMP=Every seat is filled, some by temp crew
CrewGuide.assign.ringKey.PARTIAL=Some seats are empty
CrewGuide.assign.ringKey.EMPTY=No crew at all
CrewGuide.assign.example.1.who=You
CrewGuide.assign.example.1.text=On a tank's card, click Who fits? beside Gunner.
CrewGuide.assign.example.2.who=List
CrewGuide.assign.example.2.text=Only free people who can gun that tank are listed, best first.
CrewGuide.assign.example.3.who=You
CrewGuide.assign.example.3.text=Tick the gunner you want, then press the Assign button beside Gunner on that card.
CrewGuide.assign.example.4.who=Bar
CrewGuide.assign.example.4.text=Staged 1 person as Gunner on the tank.
CrewGuide.assign.example.5.who=You
CrewGuide.assign.example.5.text=Tick a mechanic and press the button on the card's Tech line, then check Review \
  changes and press Commit changes.
CrewGuide.assign.term.1.name=Seat
CrewGuide.assign.term.1.text=A place for one crew member: a pilot, driver, gunner, crewmember, soldier, navigator, tech \
  officer or console commander. GUNNER 2/3 means two of a unit's three gunner seats are filled.
CrewGuide.assign.term.2.name=Open seat
CrewGuide.assign.term.2.text=A seat no real person holds. Temp crew may hold it for now; a real person can always take it.
CrewGuide.assign.term.3.name=Temp crew
CrewGuide.assign.term.3.text=Stand-in crew who keep a unit running without named people. Each real person you assign \
  to a seat they hold replaces one of them.
CrewGuide.assign.term.4.name=Condition
CrewGuide.assign.term.4.text=How damaged the unit is, from Undamaged to Crippled, as the Hangar shows it.
CrewGuide.assign.term.5.name=Experience level
CrewGuide.assign.term.5.text=How skilled someone is in a role, from Ultra-Green to Legendary.
CrewGuide.assign.term.6.name=Secondary role
CrewGuide.assign.term.6.text=A second job a person is trained for. It qualifies them for seats just as their \
  primary role does.
CrewGuide.assign.term.7.name=Special Pilot Ability (SPA)
CrewGuide.assign.term.7.text=A talent that changes how someone fights, such as Sniper or Weapon Specialist. Hover \
  over a person's SPA badge to see theirs.
CrewGuide.assign.term.8.name=Hits and fatigue
CrewGuide.assign.term.8.text=Hits are the injuries a person carries, including those from advanced medical; a badly \
  hurt crew member fights worse. Fatigue is how worn out they are, shown only when the campaign uses it.
CrewGuide.assign.term.9.name=Tech time
CrewGuide.assign.term.9.text=The minutes a tech can spend each day maintaining units. Every unit takes some, larger \
  units more.

# Guide: Techs page
CrewGuide.techs.title=Choose who maintains what
CrewGuide.techs.step.1.title=Find the units
CrewGuide.techs.step.1.text=Every unit a tech can maintain has a card on the right. Needs a tech lists those nobody \
  maintains; Has a tech and All show the rest. Narrow them down by unit type or formation on the left, or search by \
  name.
CrewGuide.techs.step.2.title=Read the techs
CrewGuide.techs.step.2.text=The list shows only techs. Each row gives the units a tech maintains and the minutes of \
  their day still free. Order them best first, by most time free, or by fewest units, with the chips above the list.
CrewGuide.techs.step.3.title=Tick a tech, press Assign
CrewGuide.techs.step.3.text=Tick a tech, then press the button on the card of the unit they should maintain. It shows \
  the minutes that unit takes each day, and replaces the tech the unit has, if any. The tech stays ticked, so you can \
  give them the next unit straight away.
CrewGuide.techs.step.4.title=When a tech cannot take a unit
CrewGuide.techs.step.4.text=The card says why: not enough time left, not the skill for that kind of unit, busy on a \
  refit, or somewhere else. Who fits? narrows the list to the techs who could take that unit.
CrewGuide.techs.step.5.title=Taking a tech off
CrewGuide.techs.step.5.text=The cross after a tech's name leaves the unit without one. Unassign selected, above the \
  list, takes the ticked techs off every unit they maintain, and out of any unit they crew.
CrewGuide.techs.step.6.title=Many units at once
CrewGuide.techs.step.6.text=Auto-fill gives the units shown techs the way the Hangar's automatic tech assignment does. \
  Spread selected shows which of the units shown each ticked tech would take, in the order you ticked them, and \
  stages nothing until you press Stage.
CrewGuide.techs.step.7.title=Nothing changes until you commit
CrewGuide.techs.step.7.text=Every change is staged first. Undo takes back your last action, and Commit changes applies \
  them all.
CrewGuide.techs.example.1.who=You
CrewGuide.techs.example.1.text=Choose Most time free above the list, and tick the first tech.
CrewGuide.techs.example.2.who=Cards
CrewGuide.techs.example.2.text=Each unit that tech can maintain shows a button with their name and the minutes it takes.
CrewGuide.techs.example.3.who=You
CrewGuide.techs.example.3.text=Press the button on two cards, one after the other.
CrewGuide.techs.example.4.who=List
CrewGuide.techs.example.4.text=The tech's row now shows 2 units, and less time free.
CrewGuide.techs.term.1.name=Tech time
CrewGuide.techs.term.1.text=The minutes a tech can spend each day maintaining units. Every unit takes some, larger \
  units more. A tech cannot take a unit their time does not cover.
CrewGuide.techs.term.2.name=Maintains
CrewGuide.techs.term.2.text=A unit's tech carries out its maintenance. A unit nobody maintains slowly loses quality.

# Guide: Review page
CrewGuide.review.title=Check before you commit
CrewGuide.review.step.1.title=See every change
CrewGuide.review.step.1.text=Each row is one staged change: who, where they come from, where they go and which seat. \
  Names are links back to the other pages.
CrewGuide.review.step.2.title=Watch for reassignments
CrewGuide.review.step.2.text=A Reassign tag marks someone leaving a seat they hold now. That seat opens up for someone \
  else, or stays empty.
CrewGuide.review.step.3.title=Fix or drop problems
CrewGuide.review.step.3.text=A change shown in red can't be applied, for example because the unit has become \
  unavailable. It is skipped when you commit, and the rest still go ahead.
CrewGuide.review.step.4.title=Take back what you don't want
CrewGuide.review.step.4.text=Remove drops one change. Undo takes back your last action. Cancel changes drops them all, \
  after asking a second time.
CrewGuide.review.step.5.title=Every kind of change
CrewGuide.review.step.5.text=Besides crew moves, the list shows people taken out of units, tech changes and temp crew \
  fills and removals, each tagged with what it is.
CrewGuide.review.step.6.title=Commit
CrewGuide.review.step.6.text=Commit changes applies everything. Anyone a unit turns away keeps the seat they had, and \
  temp crew are replaced automatically as real people arrive.
CrewGuide.review.example.1.who=You
CrewGuide.review.example.1.text=Open Review changes (12).
CrewGuide.review.example.2.who=Review
CrewGuide.review.example.2.text=12 changes, 1 of them leaves a seat they hold now.
CrewGuide.review.example.3.who=You
CrewGuide.review.example.3.text=Remove the reassigned MekWarrior, then press Commit changes.
CrewGuide.review.example.4.who=Bar
CrewGuide.review.example.4.text=Committed 11 changes.
CrewGuide.review.term.1.name=Staged change
CrewGuide.review.term.1.text=An assignment you have made but not applied yet. Staged changes can be undone freely.
CrewGuide.review.term.2.name=Reassignment
CrewGuide.review.term.2.text=Moving someone out of a seat they hold into another. With the Transfers campaign option \
  on, it is logged as one transfer rather than a removal and a new assignment.
CrewGuide.review.term.3.name=Commit
CrewGuide.review.term.3.text=Applying every staged change at once. Only then do units and people change.
