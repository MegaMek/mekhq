# Guide: Units page
CrewGuide.units.title=Crew your units
CrewGuide.units.step.1.title=Pick a location
CrewGuide.units.step.1.text=People can only crew units where they are. Choose the main force or one of your bases \
  from Location; both lists then show only that location. You can't change location while changes are pending.
CrewGuide.units.step.2.title=Find the units that need crew
CrewGuide.units.step.2.text=Needs crew lists units with seats nobody fills. Narrow it down by unit type or formation on \
  the left, or search by name. On temp crew finds units you may want to give real crew.
CrewGuide.units.step.3.title=Select units
CrewGuide.units.step.3.text=Click a unit to select it, and shift-click another to select every unit in between. \
  Selections stay when you switch pages, so you can pick units here and people on the Personnel page.
CrewGuide.units.step.4.title=Fill their seats
CrewGuide.units.step.4.text=Auto-fill puts the best free people into every open seat of the chosen type on the \
  selected units. To choose people yourself, pick them on the Personnel page, then press Assign.
CrewGuide.units.step.5.title=Look closer
CrewGuide.units.step.5.text=The panel on the right shows the unit you last clicked: its condition, each seat and who \
  holds it. Names are links, and Find opens the Personnel page showing only who could take that seat.
CrewGuide.units.step.6.title=Nothing changes until you commit
CrewGuide.units.step.6.text=Every assignment is staged first. The bar at the bottom counts them, Undo takes back your \
  last action (a whole auto-fill at once), and Commit changes applies them all.
CrewGuide.units.step.7.title=Techs, temp crew and clearing out
CrewGuide.units.step.7.text=Needs a tech lists units nobody maintains; pick the Tech chip and Auto-fill gives them the \
  best free techs with the time. With units selected you can also remove their crew, remove their crew and tech, \
  fill them with temp crew from the campaign's pool, or send their temp crew back. A unit needs one real crew member \
  before it can be filled.
CrewGuide.units.ringKey=Reading a unit's ring
CrewGuide.units.ringKey.FULL=Every seat has real crew
CrewGuide.units.ringKey.TEMP=Every seat is filled, some by temp crew
CrewGuide.units.ringKey.PARTIAL=Some seats are empty
CrewGuide.units.ringKey.EMPTY=No crew at all
CrewGuide.units.example.1.who=You
CrewGuide.units.example.1.text=Choose Infantry under Unit type, click the first platoon, then shift-click the sixth.
CrewGuide.units.example.2.who=Panel
CrewGuide.units.example.2.text=6 units selected, 91 open seats. Soldier 91.
CrewGuide.units.example.3.who=You
CrewGuide.units.example.3.text=Press Auto-fill 91.
CrewGuide.units.example.4.who=Bar
CrewGuide.units.example.4.text=91 pending, 6 units. The best 91 free soldiers are staged, the most experienced in the \
  first platoon.
CrewGuide.units.example.5.who=You
CrewGuide.units.example.5.text=Check them on Review changes, then press Commit changes.
CrewGuide.units.term.1.name=Seat
CrewGuide.units.term.1.text=A place for one crew member: a pilot, driver, gunner, crewmember, soldier, navigator, tech \
  officer or console commander. A badge like GUNNER 2/3 shows how many of a unit's gunner seats are filled.
CrewGuide.units.term.2.name=Open seat
CrewGuide.units.term.2.text=A seat no real person holds. Temp crew may hold it for now; a real person can always take it.
CrewGuide.units.term.3.name=Temp crew
CrewGuide.units.term.3.text=Stand-in crew who keep a unit running without named people. A badge shows them as +8 TEMP. \
  Each real person you assign to a seat they hold replaces one of them.
CrewGuide.units.term.4.name=Condition
CrewGuide.units.term.4.text=How damaged the unit is, from Undamaged to Crippled, as the Hangar shows it.

# Guide: Personnel page
CrewGuide.personnel.title=Find the right people
CrewGuide.personnel.step.1.title=Choose who to look at
CrewGuide.personnel.step.1.text=Unassigned shows people free to take a seat. Assigned and Everyone include people who \
  already crew a unit; assigning one of them moves them, and they leave the seat they hold now.
CrewGuide.personnel.step.2.title=Narrow it down
CrewGuide.personnel.step.2.text=Pick a role on the left, or search by name, rank, role or ability, such as Sniper. The \
  list is always sorted best first.
CrewGuide.personnel.step.3.title=Read a row
CrewGuide.personnel.step.3.text=Each row shows the person's role, experience level and where they will serve. An SPA \
  badge counts their special abilities: hover over it to see them. Hits and fatigue appear when they have any.
CrewGuide.personnel.step.4.title=Select people
CrewGuide.personnel.step.4.text=Click to select, shift-click to select a range. The panel on the right counts who you \
  have picked and warns about anyone already in a unit.
CrewGuide.personnel.step.5.title=Assign them
CrewGuide.personnel.step.5.text=With units selected on the Units page, press Assign. The best people go first, each \
  into the first selected unit with a seat they qualify for. Anyone left over stays selected for the next try.
CrewGuide.personnel.step.6.title=Or start from one person
CrewGuide.personnel.step.6.text=Click someone, then use the link at the bottom of the right-hand panel to see every \
  unit with a seat they could take.
CrewGuide.personnel.step.7.title=Techs
CrewGuide.personnel.step.7.text=Techs are listed too, with the units they maintain and their daily time used. A tech \
  can look after several units as long as their time covers them all. Select techs and press Assign to give them to \
  selected units that have no tech, or click one and follow the link to every unit they could take on.
CrewGuide.personnel.step.8.title=Taking people out
CrewGuide.personnel.step.8.text=Unassign takes the selected people out of their units and off any units they maintain.
CrewGuide.personnel.example.1.who=You
CrewGuide.personnel.example.1.text=On a tank's details, click Find Gunner.
CrewGuide.personnel.example.2.who=Personnel
CrewGuide.personnel.example.2.text=Only free people who can gun that tank are listed, best first. The tank is selected.
CrewGuide.personnel.example.3.who=You
CrewGuide.personnel.example.3.text=Click the first person, shift-click the second, and press Assign 2.
CrewGuide.personnel.example.4.who=Bar
CrewGuide.personnel.example.4.text=Staged 2 assignments to 1 unit.
CrewGuide.personnel.term.1.name=Experience level
CrewGuide.personnel.term.1.text=How skilled someone is in a role, from Ultra-Green to Legendary. For a seat, it is the \
  level of whichever role qualifies them for it.
CrewGuide.personnel.term.2.name=Secondary role
CrewGuide.personnel.term.2.text=A second job a person is trained for. It qualifies them for seats just as their \
  primary role does.
CrewGuide.personnel.term.3.name=Special Pilot Ability (SPA)
CrewGuide.personnel.term.3.text=A talent that changes how someone fights, such as Sniper or Weapon Specialist. Hover \
  over an ability to read what it does.
CrewGuide.personnel.term.4.name=Hits
CrewGuide.personnel.term.4.text=Injuries the person carries, including those from advanced medical. A badly hurt \
  crew member fights worse.
CrewGuide.personnel.term.6.name=Tech time
CrewGuide.personnel.term.6.text=The minutes a tech can spend each day maintaining units. Every unit takes some, larger \
  units more.
CrewGuide.personnel.term.5.name=Fatigue
CrewGuide.personnel.term.5.text=How worn out someone is. Shown only when the campaign uses fatigue.

# Guide: Review page
CrewGuide.review.title=Check before you commit
CrewGuide.review.step.1.title=See every change
CrewGuide.review.step.1.text=Each row is one staged change: who, where they come from, where they go and which seat. \
  Names are links back to the other pages.
CrewGuide.review.step.2.title=Watch for reassignments
CrewGuide.review.step.2.text=A Reassign tag marks someone leaving a seat they hold now. That seat opens up for someone \
  else, or stays empty.
CrewGuide.review.step.3.title=Fix or drop problems
CrewGuide.review.step.3.text=A change shown in red can't be applied, for example because the unit has become \
  unavailable. It is skipped when you commit, and the rest still go ahead.
CrewGuide.review.step.4.title=Take back what you don't want
CrewGuide.review.step.4.text=Remove drops one change. Undo takes back your last action. Cancel changes drops them all, \
  after asking a second time.
CrewGuide.review.step.5.title=Every kind of change
CrewGuide.review.step.5.text=Besides crew moves, the list shows people taken out of units, tech changes and temp crew \
  fills and removals, each tagged with what it is.
CrewGuide.review.step.6.title=Commit
CrewGuide.review.step.6.text=Commit changes applies everything. Anyone a unit turns away keeps the seat they had, and \
  temp crew are replaced automatically as real people arrive.
CrewGuide.review.example.1.who=You
CrewGuide.review.example.1.text=Open Review changes (12).
CrewGuide.review.example.2.who=Review
CrewGuide.review.example.2.text=12 changes, 1 of them leaves a seat they hold now.
CrewGuide.review.example.3.who=You
CrewGuide.review.example.3.text=Remove the reassigned MekWarrior, then press Commit changes.
CrewGuide.review.example.4.who=Bar
CrewGuide.review.example.4.text=Committed 11 changes.
CrewGuide.review.term.1.name=Staged change
CrewGuide.review.term.1.text=An assignment you have made but not applied yet. Staged changes can be undone freely.
CrewGuide.review.term.2.name=Reassignment
CrewGuide.review.term.2.text=Moving someone out of a seat they hold into another. With the Transfers campaign option \
  on, it is logged as one transfer rather than a removal and a new assignment.
CrewGuide.review.term.3.name=Commit
CrewGuide.review.term.3.text=Applying every staged change at once. Only then do units and people change.
