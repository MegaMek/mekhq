ADVANCED_SCOUTING.title=Advanced Scouting
ADVANCED_SCOUTING.definition=If 'Advanced Scouting' is enabled in Campaign Options, characters will use their Scouting \
  Skills when exploring the <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a> in \
  <a href='GLOSSARY:STRATCON'>StratCon</a>.\
  <p>The hex a <a href='GLOSSARY:COMBAT_TEAMS'>Combat Team</a> is deployed to will always be revealed. For all other \
  hexes, the hex will only be revealed when a unit within the deploying formation passes a scouting check. If the \
  formation deploys into a hex containing a scenario or a hostile facility, no surrounding hexes are scouted. \
  Formations assigned to the Training <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a> never scout surrounding \
  hexes and make no scouting checks.</p>\
  <p>Only one character per unit will make a scouting check, but it will always be the character with the best \
  chance of success (including any relevant SPAs and the modifiers below). This allows you to specialize. A \
  character with none of the scouting skills can still make an unskilled Sensor Operations check.</p>\
  <p>Be aware that if the relevant 'commanders only' option is enabled for the selected unit type, only the unit \
  commander's skills will be used. A unit without a commander will not scout at all.</p>\
  <p>The five scouting skills are listed below:</p>\
  <p>- Communications (monitoring enemy communications)\
  <br>- Perception (spotting hostile activity)\
  <br>- Sensor Operations (performing sensor sweeps)\
  <br>- Stealth (scouting ahead)\
  <br>- Tracking (spotting signs of previous enemy movements)</p>\
  <h2>Modifiers</h2>\
  <p>Each unit has a modifier to the target number of their scouting check based on the weight of the unit. This \
  represents the ability for more nimble units to more easily cover ground and perform better at reconnaissance \
  operations.</p>\
  <p>- &lt;= 55 tons: 0 modifier\
  <br>- &lt;= 75 tons: +2 modifier\
  <br>- &lt;= 100 tons: +4 modifier\
  <br>- >100 tons: +6 modifier</p>\
  <p>A unit's walk speed is also taken into account when calculating the target number:</p>\
  <p>- 3 or less: +1 modifier\
  <br>- 4-7: 0 modifier\
  <br>- 8+: -1 modifier</p>\
  <p>If the unit has any jump capacity, the unit's speed is increased by 1, unless the unit is infantry, in which \
  case the unit's jump speed is used instead of its walk speed. If the unit is a LAM, or an aerospace unit that is \
  not spheroid, its speed is doubled.</p>\
  <p>If the unit has the Improved Sensors or Improved Communications quirk (and quirks are enabled), or is equipped \
  with working Improved Sensors, an active probe, a Recon Camera, or a Satellite Imager (Hyperspectral, \
  High-Resolution, Infrared, or Look-Down Radar), or is carrying a Recon Camera Pod, the target number is reduced \
  by 1. \
  Damaged equipment provides no bonus. These do not stack with each other: a unit with several still only receives \
  -1.</p>\
  <p>If the scouting character has the Eagle Eyes SPA, the target number is reduced by 1, but only if the unit has \
  none of the sensor equipment listed above. Eagle Eyes does not stack with sensor equipment.</p>\
  <h2>Scan Range</h2>\
  <p>Normally only formations assigned to the Patrol <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a> can effectively \
  scout hexes. This is because they automatically increase their scan range by 1 (from 0). However, some \
  <a href='GLOSSARY:STRATCON_FACILITIES'>StratCon Facilities</a> also provide scan range increases. Furthermore, any \
  unit with a weight &lt;= 35 tons has its scan range increased by 1. These increases stack.</p>\
  <p>It's important to note that each unit only gets to scout once. Extra scan range doesn't allow you to scout \
  additional times, instead it allows you to scout further afield. Hexes that have already been revealed do not use \
  up a unit's scouting check, so in this way you are less likely to 'waste' scouting rolls if you're trying to scout \
  regions where only one or two hexes remain unexplored.</p>\
  <p>Units scout in order, starting with the unit most likely to succeed. If a unit fails its scouting check, the hex \
  remains unrevealed, but another unit in the formation may still attempt to scout it.</p>\
  <p>If Edge is enabled, a character with the 'Failed Scouting Check' Edge trigger may spend Edge to reroll a failed \
  scouting check.</p>\
  <p><b>Warning:</b> when a patrol's deployment spawns a scenario, that scenario is normally moved to a random \
  adjacent hex. Only hexes that have been revealed (whether by this patrol or earlier), are on the map, are not \
  ocean, and do not already hold a scenario, facility, point of interest, or deployed formation are eligible. If no \
  adjacent hex qualifies, the scenario will spawn in the same hex as the patrol. A patrol deploying into an \
  unexplored hex, or on top of a non-allied facility, always has the scenario spawn in its own hex; the former \
  counts as a bungled patrol.</p>\
  <h2>Early Return</h2>\
  <p>Patrol formations comprising only units weighing &lt;= 35 tons have an additional benefit. Due to their increased \
  mobility and generally recon-focused sensor suites, these units have an opportunity to complete their patrol early. \
  Each day there is a 1-in-6 chance the formation will finish their patrol and return to base. This allows you to explore\
  \ the <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations (AO)</a> much quicker than were you to use heavier \
  units.</p>\
  <h2>Remain Deployed Patrols</h2>\
  <p>A Patrol formation told to <a href='GLOSSARY:REMAIN_DEPLOYED'>Remain Deployed</a> doesn't sit idle. Whenever it \
  would normally return to base, it instead makes another round of scouting checks around the hex it is deployed to, \
  exactly as it did when it first deployed. Once every hex within its scan range (including the extra range from \
  light units) has been scouted, its job is done and it returns to base. A patrol deployed on a scenario or a \
  hostile facility can't scout past its own hex, so it returns the next time it would normally return.</p>\
  <p>Remain Deployed patrols never complete their patrol early, and every round of scouting checks increases the \
  formation's fatigue (if fatigue is enabled). A Patrol held in place by a \
  <a href='GLOSSARY:STRATCON_FACILITIES'>Facility</a> order follows that order instead.</p>
ADVANCED_MEDICAL.title=Advanced Medical (AM)
ADVANCED_MEDICAL.definition=Advanced Medical has now largely been replaced by <a \
  href='GLOSSARY:ALT_ADVANCED_MEDICAL'>Alternate Advanced Medical</a>\
  <p>Advanced Medical (AM) is an unofficial addition to MekHQ intended to replace the standard \
  BattleTech method of dealing with injuries and add a level of realism for campaign play. Using AM, each pilot hit \
  is assigned to a specific body location (head, left arm, right arm, chest, abdomen, left leg or right leg). Each \
  hit has a chance to be a critical hit that causes double damage, and additionally, the chance for critical hits \
  increases based on the number of hits the soldier has suffered. The number of hits a location suffers determines \
  the level of the injury. Injuries can range from cuts/bruises that require almost no medical attention and do not \
  affect combat performance, to broken bones that temporarily affect combat performance to lost limbs that permanently \
  affect combat skill. </p> \
  <p>Using Advanced Medical, most pilots with one hit will be back in the field the next day with \
  no repercussions, while a pilot with five hits will vary from the very lucky that ends up with no/almost no time \
  out (assuming few or no critical hits and all the hits landing on different locations) to losing a limb or suffering \
  another long-term or permanent injury.</p> \
  <br>For more in-depth information on the rules used for AM visit: \
  https://docs.google.com/spreadsheet/ccc?key=0AmnCtiMLxh_0dEl5WHJXM28tUWxOeml2MHo5cDB6Z3c#gid=0
AGING.title=Aging
AGING.definition=<p>As characters grow older, their <a href='GLOSSARY:ATTRIBUTE_SCORES'>Attribute Scores</a> \
  change. Young adults gain a little; from middle age onwards most attributes decline. These rules are based on the \
  aging rules from <i>A Time of War</i>.</p>\
  <p>Aging is only used if <b>Character Age Affects Skills</b> is enabled in Campaign Options (Advancement, Skills, \
  Attributes & Traits).</p>\
  <h2>Aging Milestones</h2>\
  <p>There are nine aging milestones. Characters younger than 25 are unaffected. A character's milestone depends \
  only on their current age, and each milestone's effects add to those of the milestones before it: a 35-year-old \
  has the effects of both the 25 and 31 milestones.</p>\
  <p>If birthdays are announced, a character's birthday report names their new milestone on the day they reach \
  it.</p>\
  <table><tr><th>Age</th><th>Milestone</th></tr> <tr><td>Under 25</td><td>Young</td></tr> \
  <tr><td>25-30</td><td>Young Adult</td></tr> <tr><td>31-40</td><td>In Their Prime</td></tr> \
  <tr><td>41-50</td><td>Late Prime</td></tr> <tr><td>51-60</td><td>Middle-Aged</td></tr> \
  <tr><td>61-70</td><td>Old</td></tr> <tr><td>71-80</td><td>Very Old</td></tr> \
  <tr><td>81-90</td><td>Elderly</td></tr> <tr><td>91-100</td><td>Extremely Old</td></tr> \
  <tr><td>101+</td><td>Ancient</td></tr></table>\
  <h2>Attribute Modifiers</h2>\
  <p>Each milestone adds or removes fractions of a point from Strength (STR), Body (BDY), Dexterity (DEX), \
  Reflexes (RFL), Intelligence (INT), Willpower (WIL) and Charisma (CHA). Edge is never affected. The fractions from \
  every milestone reached are added together and rounded to the nearest whole point, with halves rounded up: +0.5 \
  becomes +1, and -0.5 becomes 0.</p>\
  <p>The table below shows the total modifier a character has at each milestone.</p>\
  <table><tr><th>Age</th><th>STR</th><th>BDY</th><th>DEX</th><th>RFL</th><th>INT</th><th>WIL</th><th>CHA</th></tr> \
  <tr><td>25-50</td><td>+1</td><td>+1</td><td>0</td><td>+1</td><td>+1</td><td>+1</td><td>+1</td></tr> \
  <tr><td>51-60</td><td>+1</td><td>0</td><td>0</td><td>0</td><td>+1</td><td>+1</td><td>0</td></tr> \
  <tr><td>61-70</td><td>0</td><td>-1</td><td>-1</td><td>0</td><td>+2</td><td>+1</td><td>0</td></tr> \
  <tr><td>71-80</td><td>-1</td><td>-2</td><td>-1</td><td>-1</td><td>+2</td><td>+1</td><td>-1</td></tr> \
  <tr><td>81-90</td><td>-2</td><td>-4</td><td>-2</td><td>-2</td><td>+1</td><td>0</td><td>-2</td></tr> \
  <tr><td>91-100</td><td>-4</td><td>-5</td><td>-4</td><td>-3</td><td>-1</td><td>-1</td><td>-3</td></tr> \
  <tr><td>101+</td><td>-6</td><td>-7</td><td>-6</td><td>-5</td><td>-3</td><td>-2</td><td>-5</td></tr></table>\
  <p>The modifier is applied on top of the character's own score, so it does not change the score you raise with \
  XP. Together with any other modifiers, an attribute can never fall below 1 or rise above 10.</p>\
  <p>Skills feel these changes through their <a href='GLOSSARY:LINKED_ATTRIBUTES'>Linked Attributes</a>: a changed \
  attribute score can change the modifier it gives every skill linked to it.</p>\
  <h2>Clan Fame</h2>\
  <p>In Clan campaigns, older warriors are expected to have earned a <a href='GLOSSARY:BLOODNAME'>Bloodname</a> or a \
  rank to match their age. Those who have not suffer a penalty to their <a href='GLOSSARY:FAME'>Fame</a> \
  <a href='GLOSSARY:TRAITS'>Trait</a>. Unlike attribute modifiers, these penalties do not add up: only the \
  character's current milestone counts.</p>\
  <p>- <b>Under 31:</b> no penalty\
  <br>- <b>31-50:</b> -2, removed entirely if the character has a Bloodname or the rank of Star Captain or higher\
  <br>- <b>51+:</b> -3, reduced to -2 if the character has a Bloodname or the rank of Star Colonel or higher. Having \
  both does not reduce it further.</p>\
  <h2>Glass Jaw and Slow Learner</h2>\
  <p>On the birthday a character reaches the 61 milestone, and on each later milestone, they gain the Slow Learner \
  SPA. From the 71 milestone onwards they also gain Glass Jaw.</p>\
  <p>A character with Fast Learner loses it instead of gaining Slow Learner, and a character with Toughness loses \
  it instead of gaining Glass Jaw. This only delays the flaw: unless the positive SPA is bought again, the flaw is \
  gained at the next milestone.</p>\
  <p>These SPAs are only handed out on the milestone birthday itself. A character who is already past a milestone \
  when they join the campaign, or when aging is enabled, gets nothing until their next milestone birthday.</p>
AGGREGATE_COMBAT_VIEW.title=Aggregate Combat View
AGGREGATE_COMBAT_VIEW.definition=The Aggregate Combat View is a new feature that allows you to see at a glance the \
  most commonly requested combat-related skills. Of special note is the 'Combat' column, the values shown here are \
  largely Gunnery/Piloting. However this can change depending on the character.\
  <p>If the character is assigned to a unit, this column will show the combat skills relevant to that unit.</p>\
  <p>If the character is not assigned to a unit, this column will either show the combat skills relevant to their \
  primary or secondary profession. The primary profession will take precedence over the secondary if the primary \
  profession is classified as a combat profession. Otherwise, only the combat profession will be used.</p>
AGGREGATE_TECH_VIEW.title=Aggregate Tech View
AGGREGATE_TECH_VIEW.definition=The Aggregate Tech View is a new feature that allows you to see at a glance the \
  most commonly requested tech-related skills. Of special note is the 'Tech' column, the values shown here are \
  a specific Technical skill paired with Zero-G Operations. \
  <p>Technical skill shown depends on the character's primary or secondary profession (such as MekTech, \
  AeroTek, Mechanic, etc.) The primary profession takes precedence over the secondary.</p>\
  <p>Additionally, this view tracks the character's assigned units (including indicators for active refits) as well \
  as a complete breakdown of their maximum, used, and remaining tech minutes.</p>
ALT_ADVANCED_MEDICAL.title=Alternate Advanced Medical (AAM)
ALT_ADVANCED_MEDICAL.definition=In 2009 <a href='GLOSSARY:ADVANCED_MEDICAL'>Advanced Medical</a> was introduced to \
  add extra \
  flavor to the injuries \
  characters suffered in scenarios. No longer were injuries simple 'hits,' now they were broken bones and concussions.\
  \ Advanced Medical stood proud and barely changed for nearly 17 years - a testament to how loved it was among the \
  playerbase and the skill with which it was developed.\
  <p>In 50.10, Alternate Advanced Medical (AAM) was introduced, building on the core Advanced Medical systems while \
  adding some modernization. AAM is not intended to replace Advanced Medical, instead it offers an alternate \
  experience that integrates better with some of the systems added since Advanced Medical was implemented. Such as \
  the newer SPAs, Fatigue, and Attribute Scores.</p>\
  <h1>Advanced Surgeries</h1>\
  AAM grants you access to a bundle of advanced prosthetics, implants, and other bonuses. Want prosthetic cat ears \
  for your Canopian MekWarriors? Now you can! Advanced Surgeries are accessed via the right-click menu in the \
  Personnel Tab, or a dedicated button in the Infirmary. The Advanced Surgery dialog replaces the old method of \
  replacing lost limbs.\
  <h2>Death in Surgery</h2>\
  Characters will die on the operating table if they end surgery with more than five 'Hits' worth of injuries (see \
  below). As all surgeries inflict a recovery injury, you need to be careful not to try and commit to too many \
  surgeries at once.\
  <h2>Physical & Mental Degradation</h2>\
  The human body has an unusual reaction to the unseen stress of advanced prosthetics. Maybe it's a side effect from \
  the strong anti-rejection drugs that must be taken daily, or perhaps it's the human spirit rebelling against the \
  machine.\
  <p>Characters with one of the following implants will periodically gain permanent points of Fatigue (reflecting \
  their failing physical health). Whenever this occurs, they must also pass a Body-Willpower Attribute Check (see \
  ATOW). If the check is failed, they will gain a Flaw (a negative SPA), a consequence of their degrading mental \
  state.</p>\
  <blockquote><b>Buffered VDNI:</b> every 3 years\
  <br><b>Buffered VDNI (with Triple-Core Processor):</b> every 3 years\
  <br><b>Standard VDNI:</b> every 2 years\
  <br><b>Enhanced Imaging:</b> every 1 year (or every 3 years for characters with the Aerospace Phenotype)</blockquote>\
  <p>Furthermore, any character with 3 (or more) 'Advanced (Type-4)', or 'Enhanced (Type-5)' prosthetics (or \
  implants) is vulnerable to the same effect. Although this is every 3 years. The damage does stack, so a character \
  with Enhanced Imaging and two other eligible prosthetics would suffer degradation every year (for EI) <i>and</i> \
  every three years (for having too many advanced prosthetics). For a canonical example, look no further than the real\
  \ Thomas Marik.</p>\
  <h1>Injuries</h1>\
  When a character suffers damage, MekHQ will swap that damage out for an injury. Injuries are varied and based on the\
  \ location injured. An injury is determined in three stages: primary location, secondary location, injury type.\
  <p>First, we roll to determine the primary location. The table used can be found in the Advanced Hit Locations \
  section in ATOW:Companion. Each primary location has several secondary locations (see the same section in \
  ATOW:Companion). And each secondary has a corresponding injury type.</p>\
  <p>For example, a roll of 2 gives us a primary location of 'Head,' with a follow-up d6 roll of 3 giving us \
  'Blindness' in the 'Eyes' location.</p>\
  <p>If the secondary location roll is a 6, the injury is more severe than normal and recovery time will be increased \
  by 100% before a second roll is made. If this second roll is also a 6, the injury is as severe as possible: recovery \
  time is tripled (+200%, the maximum) and, if the primary location is a limb, the limb is completely severed. A final \
  roll then picks the secondary location; a 6 on it is rerolled, so the severity cannot rise any further.</p>\
  <h2>Hits</h2>\
  In the original Advanced Medical, an injury was worth a number of Hits (TW-scale damage) equal to its \
  severity (a semi-random value). This made it difficult to know how badly injured your character was. In AAM all \
  injuries are worth one Hit each.\
  <p>Prosthetics and implants apply an 'injury' to the character. These are not true injuries and are included only \
  as a record (and a way for us to apply the modifiers from those surgeries). These injuries are not factored into \
  the character's Hits (or injury penalty, see below).\
  <p>Similarly, the various injuries added by Flaws (such as addictions) are not factored into the character's Hits. \
  This is to prevent characters from being killed by crippling flashbacks.</p>\
  <h2>Injury Penalty</h2>\
  Each healing attempt suffers a penalty equal to the number of other non-prosthetic injuries the patient currently \
  has; the injury being treated does not count against itself. For example, a character with a prosthetic leg, a \
  fractured skull, and heart trauma would apply a -1 penalty when tending the skull (for the heart trauma), and a -1 \
  penalty when tending the heart trauma (for the skull). A patient with a single injury suffers no penalty.\
  <p>A character's injury penalty is reduced by their Toughness score (if any). A character with negative Toughness \
  will increase the injury penalty, so beware!</p>\
  <p>Each level the healer has in MedTech also reduces the injury penalty by 1, to a minimum of 0.</p>\
  <h2>Prosthetic Penalty</h2>\
  Interstellar Operations, page 70, states that a -4 penalty is applied to any attempt made to heal a character with \
  cybernetics or prosthetics. While this penalty does exist in AAM, it only applies to injuries (technically damage) \
  occurring in the same location as the prosthetics. It is assumed that all doctors have enough knowledge to enact \
  repairs and replacements to prosthetics. A permanent 'injury' to a prosthetic represents irreparable damage.\
  <p>Each level the healer has in Tech/Cybernetics reduces the prosthetic penalty by 1, to a minimum of 0. Cloned \
  limbs are biological replacements and do not suffer the prosthetic penalty.</p>\
  <h2>Recovery Time</h2>\
  Each injury has a base recovery time (modified by severity, as described above). This is the lowest number of days \
  it will take for the injury to fully heal. Each day recovery time goes down by 1. If the doctor get a margin of \
  success worse than 0, the injury does not reduce its recovery time that day.\
  <h3>Natural Healing</h3>\
  If a doctor is not assigned to a character, the recovery time ceases to be daily and instead only progresses once a \
  week, on Monday. Furthermore, the Surgery/Any skill check is replaced by a Body-based attribute check with a -3 \
  penalty.\
  <p>You should avoid leaving injured personnel without doctors at all costs. Failure to do so significantly increases\
  \ time-to-heal, <i>and</i> the risk of further injury, death, or the injury becoming permanent.</p>\
  <h2>Healing</h2>\
  Once an injury's recovery time has been reduced to 0, a healing check is made. The type of healing check is dependent\
  \ on whether a doctor has been assigned to the character. Normally a Surgery/Any skill check is used, however if \
  the character is using 'natural healing' (see above), a Body-based attribute check is used instead.\
  <p>How successful the healing check is (regardless of method) is determined by the checks' 'margin of success' \
  (how much the check was beaten or missed by):</p>\
  <blockquote><b>3+:</b> injury is fully healed\
  <br><b>0 to 2:</b> injury is healed.\
  <br><b>-1 to -2:</b> an additional d6 days are added to the injury's recovery time (or the injury's default \
  healing time, whichever is shorter).\
  <br><b>-3 to -5:</b> the injury becomes permanent. If the 'fewer permanent injuries' campaign option is enabled, \
  this result is treated identically to '-1 to -2', instead.\
  <br><b>-6 (or worse):</b> the injury becomes permanent and the character gains a new 'Medical \
  Complication' injury. If the character's total 'Hits' now exceeds 5, they die.</blockquote>\
  <p>Any result of 2 or less also adds d6 x Fatigue Rate <a href='GLOSSARY:FATIGUE'>Fatigue</a> (if Fatigue \
  tracking is enabled).</p>\
  <h3>Edge Use</h3>\
  It is possible to use Edge to reroll failed healing checks. If the appropriate Edge trigger is enabled (enabled by \
  default), any check that would result in a permanent injury is rerolled with Edge. However, as per the Edge rules, \
  this second roll is final and cannot be further rerolled.
ALTERNATE_UNIT_COST.title=Alternate Unit Cost
ALTERNATE_UNIT_COST.definition=<p>Alternate Unit Cost is an optional rule from <i>Hot Spots: Draconis Reach</i>. It is \
  enabled in Campaign Options, on the Finances General page, by setting the Unit Cost Model to Chaos Campaign or MekHQ. \
  <b>Chaos Campaign</b> applies it to every unit. <b>MekHQ</b> applies it \
  to every unit except DropShips, JumpShips, WarShips, and space stations, which keep their C-bill price: their Battle \
  Value is tiny next to their C-bill price, so valuing them by it makes them absurdly cheap.</p>\
  <p>When it applies, a unit's value is based on its current Battle Value rather than its C-bill price: Battle Value \
  multiplied by the tech base's unit price multiplier, in <i>Hot Spots</i> Support Points \
  (converted to C-bills at 10,000 C-bills per Support Point, if Support Point conversion is enabled). Units sell for \
  half that value. Damage lowers the value, as a damaged unit has a lower Battle Value.</p>\
  <p>Battle Value takes no account of a unit's quality, so the sale price does: the Used Part Price Multipliers are \
  applied relative to quality D. A quality D unit sells for exactly half its value, and better or worse units sell \
  for more or less.</p>\
  <p>Quirks that affect a unit's price still do so: Good Reputation raises a 'Mek's value by 10% (or 25% for Good \
  Reputation 2), and obsolete units still sell for less.</p>\
  <p>Because unit value feeds into so much of MekHQ, this option changes more than the purchase price. \
  <a href='GLOSSARY:MAINTENANCE'>Maintenance</a> costs, salvage values, battle loss compensation, collateral and your \
  company's net worth all follow the new value. Units in the unit market are priced the same way, before the market's \
  own price modifier is applied.</p>
APPLICANT_ORIGINS.title=Applicant Origins
APPLICANT_ORIGINS.definition=<p>Every applicant in the <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a> comes \
  from a faction: their homeland, which shapes their name and background. Each faction gets a number of tickets in a \
  pool, and each applicant draws one ticket at random. A faction's tickets can be drawn any number of times.</p> \
  <h2>Clan Campaigns</h2> <p>A Clan campaign's applicants all come from its own Clan. Under the MekHQ style, a Clan \
  campaign whose <a href='GLOSSARY:FORCE_REPUTATION'>Reputation</a> is too poor gets no applicants at all (see <a \
  href='GLOSSARY:RECRUITMENT_RESTRICTIONS'>Recruitment Restrictions</a>).</p> <h2>Other Campaigns</h2> <p>Each \
  faction with people in the current system gets tickets:</p> <ul> <li>Factions <b>at war</b> with yours get \
  none.</li> <li>Each faction starts with tickets for how long it has held worlds in the system within living memory, \
  so long-standing rulers supply most applicants while recent or departed rulers still supply some.</li> <li>If \
  <b>Enable Faction Standing</b> and <b>Standings Affects Recruitment</b> are both enabled, that number is multiplied \
  by a value from your <a href='GLOSSARY:FACTION_STANDING_EFFECTS'>standing</a> with the faction (see the table \
  below).</li> <li>Your <b>own faction</b> and your <b>allies</b> have their tickets tripled.</li> <li>The \
  <b>Mercenary</b> and <b>Pirate</b> factions get one ticket each if they have none. Under the CamOps styles they \
  only get it if another faction in the system has tickets.</li> </ul> <p>Under the MekHQ style, a campaign with poor \
  Reputation only gives tickets to mercenary and pirate factions.</p> <table><tr><th>Regard</th><th>Ticket \
  Multiplier</th></tr> <tr><td>-60 to -40</td><td>x0</td></tr> <tr><td>-40 to -25</td><td>x1</td></tr> <tr><td>-25 to \
  -10</td><td>x2</td></tr> <tr><td>-10 to 10</td><td>x3</td></tr> <tr><td>10 to 25</td><td>x4</td></tr> <tr><td>25 to \
  40</td><td>x5</td></tr> <tr><td>40 to 50</td><td>x10</td></tr> <tr><td>50 to 60</td><td>x15</td></tr></table>
APPLICANT_PROFESSIONS.title=Applicant Professions
APPLICANT_PROFESSIONS.definition=<p>Each <a href='GLOSSARY:RECRUIT_ROLLS'>Recruit Roll</a> in the <a \
  href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a> picks the applicant's profession from a weighted table. Each \
  <a href='GLOSSARY:RECRUITMENT_STYLES'>Recruitment Style</a> has its own tables, one for Clan campaigns and one for \
  Inner Sphere campaigns. They are kept in the <i>data/universe/markets/personnelMarket</i> folder.</p> <p>Once the \
  profession is chosen, the applicant's skills, experience level and special abilities are generated the same way as \
  for any other new character, using the campaign's random skill settings.</p> <h2>Availability by Year</h2> <p>Some \
  professions only exist in certain years: you won't see ProtoMek pilots in 3025. When a profession is not yet \
  available, or no longer is, the roll falls back to a related profession, and if that is unavailable too, to \
  another. If neither is available, the roll produces no applicant.</p> <h2>Rare Professions</h2> <p>A profession \
  with very few tickets in its table is rare. An applicant with a rare profession is marked with a star in the \
  market, and a message tells you which rare professions are on offer when they arrive.</p> <h2>Dependents and \
  Civilians</h2> <p>Dependents are untrained people interested in joining your command. Some have useful civilian \
  professions, and they make good candidates for <a href='GLOSSARY:EDUCATION'>Education</a>.</p> <ul> <li>Under the \
  <b>MekHQ</b> style, d6 Dependents are added each month on top of the other applicants, multiplied by the Applicant \
  Multiplier.</li> <li>Under the <b>CamOps</b> styles, the table's 'no personnel available' result produces a \
  Dependent instead. CamOps (Revised) splits that result between Dependents, AsTechs and Medics.</li> </ul> <p>If \
  <b>Disable Civilian Applicants</b> is enabled, no applicant has a civilian profession and no Dependents are \
  added.</p>
AREA_OF_OPERATIONS.title=Area of Operations
AREA_OF_OPERATIONS.definition=<p>In <a href='GLOSSARY:STRATCON'>StratCon</a>, the Area of Operations doesn't \
  represent the entire planet. Instead, it includes a collection of Sectors assigned to your unit. These Sectors \
  contain <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>objectives</a>, scenarios, and sometimes special <a \
  href='GLOSSARY:STRATCON_FACILITIES'>Facilities</a>. Each Sector has its own tab, so remember to check them \
  all.</p> <h2>Terrain</h2> <p>Every hex has its own terrain, shaped by the planet and the Sector's climate: oceans, \
  mountains, forests, deserts, ice, cities and more. The <b>Sector Environment</b> box, in the top-right corner of \
  the map, sums up the Sector's latitude, temperature, water and settlements. A battle in a hex is fought on a map \
  that matches its terrain, including any roads, water or city in that hex.</p>
ASTECH_SKILL.title=AsTech Skill
ASTECH_SKILL.definition=<p>The AsTech skill measures how well a character assists technicians. It does <b>not</b> \
  improve the character's own repair or maintenance rolls, even if they are also a tech.</p> \
  <p>A character only uses this skill if <i>AsTech</i> is their primary or secondary profession. They must also be \
  employed and not deployed. Each such character adds 1 point to the AsTech pool.</p> \
  <p>If <b>Useful Permanent AsTechs</b> is enabled in Campaign Options, they also add their total AsTech skill \
  level divided by 2.5, rounded down. A very poorly skilled AsTech can lower the pool. This is by design.</p> \
  <p>A Deluxe Toolkit gives +1 to the AsTech skill of the character carrying it.</p> \
  <h2>Why the Pool Matters</h2> \
  <p>Each repair or maintenance task draws helpers from the AsTech pool. Too few helpers adds a 'shorthanded' \
  penalty to the tech's roll:</p> \
  <blockquote>- 0 helpers: +4 \
  <br>- 1 helper: +3 \
  <br>- 2-3 helpers: +2 \
  <br>- 4-5 helpers: +1 \
  <br>- 6 or more helpers: no penalty</blockquote> \
  <p>Units that crew themselves, such as large vessels, use their crew's hits instead of the AsTech pool.</p> \
  <p><b>EXAMPLE</b></p> \
  <p>Sam is a MekTech with AsTech as a secondary profession and 8 AsTech levels. With <b>Useful Permanent \
  AsTechs</b> enabled, Sam adds 1 + 3 = 4 points to the pool. Without AsTech as a profession, those 8 levels do \
  nothing.</p> \
  <p>See also: <a href='GLOSSARY:TEMP_PERSONNEL'>Temporary Astechs &amp; Medics</a>.</p>
ATB.title=Digital GM: Legacy Against the Bot
ATB.definition=Against the Bot (AtB) is one of the oldest systems in MekHQ, serving as an early attempt at creating a\
  \ <a href='GLOSSARY:DIGITAL_GM'>Digital GM</a>.\
 <p>In late 2024, Legacy AtB was officially succeeded by <a href='GLOSSARY:STRATCON'>StratCon</a> and marked as\
  \ <a href='GLOSSARY:DEPRECATED'>Deprecated</a>.</p>\
  <p>In 50.10 (late 2025) the decision was made to finally retire AtB, and it is no longer available. Players looking \
  for a comparable experience should use <a href='GLOSSARY:STRATCON_MAPLESS'>StratCon (Mapless)</a>.</p>
ATTRIBUTE_SCORES.title=Attribute Scores
ATTRIBUTE_SCORES.definition=<p>Characters have the eight Attribute Scores from <i>A Time of War</i>: Strength (STR), \
  Body (BDY), Reflexes (RFL), Dexterity (DEX), Intelligence (INT), Willpower (WIL), Charisma (CHA) and Edge (EDG). \
  Each skill has one or two <a href='GLOSSARY:LINKED_ATTRIBUTES'>Linked Attributes</a>, which change its Target \
  Number. <a href='GLOSSARY:EDGE'>Edge</a> works differently in MekHQ and has its own entry.</p>\
  <h2>Starting Scores</h2>\
  <p>Two options in Campaign Options (Advancement, Skills, Attributes & Traits) control how new characters' \
  scores are generated:</p>\
  <p>- <b>Starting Attributes Based on Profession:</b> scores are based on the character's primary profession, \
  using the archetypes from <i>A Time of War</i> and <i>A Time of War: Companion</i>. Their secondary profession \
  is ignored. If this is off, every attribute starts at 5 and Edge at 0, and neither Random Attributes nor \
  Phenotype modifiers are used.\
  <br>- <b>Random Attributes:</b> after the profession scores are set, 2d6 is rolled for each attribute except \
  Edge: 2 gives -2, 3-5 gives -1, 6-8 gives no change, 9-11 gives +1 and 12 gives +2. For Edge, a 12 on 2d6 gives \
  +1, if Edge is enabled.</p>\
  <p>Clan characters with a <a href='GLOSSARY:PHENOTYPE'>Phenotype</a> also have their Phenotype's modifiers \
  applied to their profession scores.</p>\
  <p>Changing these options mid-campaign does not change existing characters. To regenerate their scores, enter \
  GM Mode, right-click them in the Personnel tab and choose <b>GM Mode</b>, <b>Roleplay</b>, then <b>Reset \
  Roleplay Attributes</b> (or <b>Randomize Roleplay Attributes</b> if Random Attributes is on).</p>\
  <h2>Limits</h2>\
  <p>An attribute can never go below 1 (0 for Edge). Each attribute also has a maximum, set by the character's \
  Phenotype. For characters without one, every maximum is 8 except Charisma, which is 9. Some SPAs raise a \
  maximum by 1, such as the Exceptional Attribute SPAs, Freakish Strength and Beloved Pet, but no attribute can \
  ever go above 10.</p>\
  <h2>Changing Scores</h2>\
  <p>Attributes can be raised by spending XP. They are also changed by \
  <a href='GLOSSARY:AGING'>Aging</a>, some injuries and some SPAs. These changes are applied on top of the \
  character's own score.</p>
AUTOINFIRMARY.title=AutoInfirmary
AUTOINFIRMARY.definition=AutoInfirmary lets you instantly assign all injured personnel to qualified doctors with\
 \ just a single click.\
 <p>When pressing the 'Optimize Assignments' button, AutoInfirmary will assign the most critically injured personnel to\
 \ your most qualified doctors. It will then work its way down the list until you are out of\
 \ <a href='GLOSSARY:HOSPITAL_BEDS'>Hospital Beds</a> or everyone is assigned to a doctor.</p>\
 <p>The most injured <a href='GLOSSARY:PRISONERS_OF_WAR'>Prisoner of War</a> is going to be prioritized <i>after</i> the\
  \ least injured non-prisoner. So no need to worry about prisoners taking beds away from your personnel.</p>\
 <p>In MekHQ Options, there's a setting to automatically run AutoInfirmary on each new day, meaning you never need to\
 \ manually assign doctors. If you find yourself without enough hospital beds, MekHQ will warn you with a daily alert\
 \ (unless that alert has been disabled in MekHQ Options).</p>
AUTO_AWARDS.title=AutoAwards
AUTO_AWARDS.definition=<p>autoAwards tracks who has earned an <a href='GLOSSARY:AWARDS'>award</a> and offers those \
  awards to you in an Award Ceremony. Turn it on with <b>Enable autoAwards</b> on the Awards page of the Personnel \
  options. See <a href='GLOSSARY:AWARD_TYPES'>Award Types</a> for what earns each kind of award.</p> <h2>When It \
  Runs</h2> <ul> <li><b>On the 1st of each month:</b> checks lifetime Kill, Misc, Rank, Scenario, Skill and Time \
  awards.</li> <li><b>After a scenario:</b> checks Injury, Scenario Kill, Scenario and Misc awards (such as the Medal \
  of Honor), for the personnel in that scenario.</li> <li><b>When a mission ends:</b> checks Contract, Faction \
  Hunter, Mission Kill, Misc, Rank, Scenario, Skill, Theatre of War and Time awards.</li> <li><b>When you change \
  someone's rank:</b> checks Rank awards.</li> <li><b>When someone graduates from an academy:</b> checks Training \
  awards. This needs the <a href='GLOSSARY:EDUCATION'>Education</a> module.</li> <li><b>After you generate a \
  company:</b> runs the same checks as the 1st of the month.</li> </ul> <p>You can also run the monthly checks at any \
  time from <b>View &gt; Award Eligibility Dialog</b>. If no one qualifies, a message says so.</p> <h2>Who Is \
  Considered</h2> <p>Every active member of your command is checked, except prisoners and civilians. Checks run for \
  everyone, not only for those who took part. For example, everyone in the command can earn a Contract award when a \
  contract ends. If <b>Issue Posthumous Awards</b> is enabled, personnel who died since your last contract ended are \
  also checked.</p> <h2>The Award Ceremony</h2> <p>The ceremony shows one page per award type, listing each person \
  and the award they have earned. Every award starts ticked. Untick any you do not want to give, then choose <b>Issue \
  Awards</b>. <b>Skip</b> skips the current award type, and <b>Skip All</b> skips the rest of the ceremony. Skipped \
  awards can be offered again the next time autoAwards runs. When autoAwards runs straight after company generation \
  without showing the ceremony, every eligible award is issued.</p> <p>A person is never offered an award they \
  already hold unless the award can be won more than once.</p> <h2>Options</h2> <p>- <b>Issue Best Award Only</b> (on \
  by default): when someone qualifies for several awards of the same kind, they are offered only the one with the \
  highest requirement. This applies to Contract duration, Injury, Kill, Scenario and Time awards. Each formation size \
  is treated as its own kind of kill award. All Time awards count as one kind. If someone qualifies for both a 4-year \
  and a 6-year service award, they are offered only the 6-year award. <br>- <b>Issue Posthumous Awards</b>: see \
  above. <br>- <b>Award Tracking</b>: one checkbox for each award type. An unticked type is never offered \
  automatically, but you can still give those awards by hand. <br>- <b>Ignore the Standard Set</b> and <b>Award Set \
  Filter</b>: leave whole award sets out of autoAwards. See <a href='GLOSSARY:AWARDS'>Awards</a>.</p>
AUTO_RESOLVE.title=Auto Resolve
AUTO_RESOLVE.definition=<p>Auto Resolve lets the Princess bot fight a scenario for you, so you can focus on running \
  your command or skip battles you don't want to play. Some options call this method PACAR. Select a scenario in the \
  Briefing Room and choose <b>Auto Resolve</b> instead of Start Game.</p> <h2>How It Works</h2> <p>MegaMek starts as \
  normal and asks for the usual host settings. MekHQ then adds a Princess bot named after you, with <b>@AI</b> on the \
  end. It shares your team, starting position, colour and camouflage, and every unit you deployed is handed to it. \
  Princess then plays the whole battle while you watch. When the game ends, you resolve the scenario as usual, with \
  the same Resolve Scenario wizard as a game you played yourself.</p> <p>Princess is thorough rather than quick, so a \
  large battle can still take some time to play out. These settings in MegaMek's own client options help keep it \
  moving:</p> <ul> <li>stop MegaMek showing the report between phases;</li> <li>let it skip your turn when you have \
  no units to act.</li> </ul> <p>With both set, the game no longer waits for you to press Done between phases. \
  <b>Experimental Commander's Interface for PACAR</b>, in the AutoResolve section of the StratCon General page, \
  replaces the full MegaMek game screen with a lightweight window in StratCon scenarios. That window lets you follow \
  the battle, and has a <b>Request Victory</b> button. It is experimental and meant for solo play.</p> <h2>Princess's \
  Behavior</h2> <p>Open <b>Manage Campaign &gt; Auto Resolve Behavior Settings</b> to choose how Princess fights for \
  you. It opens Princess's usual bot settings, such as how aggressively she advances, how much she values her units, \
  and when she retreats. Your campaign has its own preset, named after your command with <b>@AI</b> on the end. \
  Pressing <b>OK</b> saves whatever is shown into that preset, so you can load any other preset and press OK to copy \
  it.</p> <p>- Presets are stored with your other Princess presets, not in the campaign save. Two campaigns with the \
  same command name share a preset. <br>- If the preset has been deleted, opening the settings and pressing OK \
  creates it again. Until then, Princess uses her default behavior. <br>- To use different behavior for a particular \
  scenario, such as a breakthrough or a defense, set up a preset for it and copy it in before you auto resolve. \
  Remember to switch back afterwards. <br>- During the game, you can still change Princess's behavior with her usual \
  chat commands. <br>- One preset covers all your units. To give different units different orders, you need to set up \
  your own bots in MegaMek instead.</p> <p>MekHQ also has a much faster, statistical method, <a \
  href='GLOSSARY:AUTO_RESOLVE_ACAR'>ACAR</a>. It is a developer tool and is not meant for normal play.</p>
AUTO_RESOLVE_ACAR.title=Auto Resolve: ACAR
AUTO_RESOLVE_ACAR.definition=<p>ACAR (Abstract Combat Auto Resolution) is a developer tool for testing. It is not \
  meant for normal play. It resolves a whole battle in seconds by simulating it with a reduced version of the \
  <i>Interstellar Operations</i> Abstract Combat System, instead of playing it out in MegaMek. For normal play, use \
  the Princess method described in <a href='GLOSSARY:AUTO_RESOLVE'>Auto Resolve</a>.</p> <h2>Turning It On</h2> \
  <p>Enable <b>Enable Abstract Combat Auto Resolve (Developer Tool)</b> on the Advanced page of <b>File &gt; MekHQ \
  Client Options</b>. The <b>Auto Resolve</b> button then asks which method to use. The <b>AutoResolve Method</b> \
  option, in the AutoResolve section of the StratCon General page, decides which method is selected to start with. \
  While the developer option is off, Auto Resolve always uses Princess, whatever that campaign option says.</p> \
  <h2>Before the Battle</h2> <p>If <b>Display Chance of Victory</b> is on, ACAR first runs the battle many times, as \
  set by <b>Prediction Accuracy</b> (100 by default). It then shows your chance of victory and asks whether to go \
  ahead. More runs give a better estimate, but take longer.</p> <h2>The Simulation</h2> <p>Each unit, with its crew, \
  is converted into an Alpha Strike element. Those are then grouped into larger units, and those into formations. A \
  unit's type, speed, armor, weapons and crew skill all matter, but your only real choice is which units and crews \
  you send. Each side is split into the same number of formations, so that a side with many small units doesn't gain \
  a large edge just from acting more often.</p> <p>The battle is fought in rounds. In each round, every \
  formation:</p> <ul> <li>rolls initiative;</li> <li>tries to win engagement and control against an enemy formation. \
  The winner chooses the range, favoring ranges where it does the most damage;</li> <li>fires;</li> <li>checks for \
  destroyed units and loss of morale;</li> <li>withdraws if it is crippled or routed, unless it is the last one \
  left;</li> <li>tries to recover its nerve.</li> </ul> <p>Rounds continue until only one side remains.</p> \
  <h2>Afterwards</h2> <p>Damage is then applied to your real units. Units that were destroyed in the simulation are \
  heavily damaged or wrecked, depending on how they were lost. Survivors and units that withdrew take damage in \
  proportion to what their abstract copy suffered. Crews are injured to match. This damage model is simplified. It \
  causes no ammunition explosions, and a crew whose unit survived cannot be killed.</p> <p>A log of the simulation is \
  shown first. MekHQ then tells you whether you won and asks whether you control the battlefield. After that, the \
  normal Resolve Scenario wizard runs, where you assign salvage, prisoners and kills. If you cancel the wizard, the \
  result is thrown away and your personnel's injuries are reset, so you can run ACAR again.</p>
AWARDS.title=Awards
AWARDS.definition=<p>Awards are the medals, ribbons and commendations your personnel earn over their careers. Each \
  award shows on the person's record. Ribbons appear beneath their portrait, and medals and other insignia appear in \
  their <b>Medals and Awards</b> section. Every award is also written to their log. Many awards also give a small XP \
  or Edge bonus.</p> <p>MekHQ includes the <b>Standard</b> award set, which has 51 awards in five groups: Education, \
  Personal, Scenario, Mission and Time of War.</p> <p>You can add your own award sets as well. An award set is an \
  XML file in <i>data/universe/awards/</i>, either in your MekHQ folder or in your user directory, and the file \
  name is the set's name. A file with the same name as a shipped set replaces that set. Its images go in \
  <i>data/images/awards/&lt;set name&gt;/</i>, in <i>medals</i>, <i>ribbons</i> and <i>misc</i> folders. Use the \
  shipped <i>standard.xml</i> as a model.</p> <h2>Giving Awards</h2> <p>You can give any award \
  by hand. Right-click one or more people on the Personnel tab and open the <b>Award</b> menu. Each award set has its \
  own section in the menu, and its groups appear as sub-menus. Hover over an award to see its description. When you \
  select one person, awards they already hold are hidden, unless the award can be won more than once. Awards given by \
  hand grant their bonuses just like automatic ones.</p> <p>To take an award away, use <b>Award &gt; Remove \
  Award</b>. With one person selected, you choose the specific date of the award to remove.</p> <p>MekHQ can also \
  track who has earned an award and offer it to you automatically. See <a \
  href='GLOSSARY:AUTO_AWARDS'>autoAwards</a>.</p> <h2>Bonuses</h2> <p>The <b>Bonuses</b> option, on the Awards page \
  of the Personnel options, controls what awards give: <b>XP/Edge</b> (the default), <b>XP</b> only, <b>Edge</b> \
  only, or <b>None</b>. Edge from awards cannot take a person past the <b>Maximum Edge</b> limit. Edge awards are \
  powerful, so <b>Replace Edge Awards with XP</b> turns each point of Edge into 10 XP instead. This needs Bonuses set \
  to XP/Edge or Edge.</p> <h2>Repeated Awards</h2> <p>Some awards, such as the Purple Heart or Longevity, can be won \
  more than once. If such an award has more than one image, its image changes as the person earns more of them. \
  <b>Tier Size</b> (default 5) sets how many times an award must be won before it moves to its next image.</p> \
  <h2>Award Sets</h2> <p><b>Ignore the Standard Set</b> hides the Standard set from the Award menu and from \
  autoAwards. Use it if you prefer to use only your own sets. The <b>Award Set Filter</b> leaves the sets you list \
  out of autoAwards only, and you can still give their awards by hand. Separate set names with commas and no spaces. \
  Spelling and capitalization must match exactly.</p>
AWARD_TYPES.title=Award Types
AWARD_TYPES.definition=<p>Every award has a type, which tells <a href='GLOSSARY:AUTO_AWARDS'>autoAwards</a> how it \
  is earned. Each type can be turned off under <b>Award Tracking</b> on the Awards page of the Personnel options. The \
  examples below are from the Standard set. An award marked as repeatable can be won more than once.</p> \
  <h2>Contract</h2> <p>Earned when a contract ends, for a contract of a particular type or one that lasted long \
  enough. Duration is counted in months from the contract's start to the day it ends. The outcome does not matter. \
  <i>Standard:</i> Galactic Service Deployment (3 months), Galactic Service (12 months), Covert Ops (any raid), \
  Military Training Instructor (Cadre Duty), Security Guard (Security Duty).</p> <h2>Faction Hunter</h2> <p>Earned \
  when a contract ends, for having fought a particular enemy. The enemy can be a single faction or a broad category, \
  such as Clans, Periphery or Pirate. Only the enemy at the end of the contract counts. These awards are only checked \
  when StratCon is enabled. <i>Standard:</i> Galactic War on Pirating (fighting pirates).</p> <h2>Injury</h2> \
  <p>Earned after a scenario by anyone who took enough new hits during it. MekHQ does not track where the hits came \
  from, so any hit counts. <i>Standard:</i> Purple Heart (1 hit, repeatable).</p> <h2>Kill</h2> <p>Earned for \
  confirmed kills, counted over a single scenario, a single mission, or a whole career. <b>Kill (Individual)</b> and \
  <b>Kill (Formation)</b> under Award Tracking turn each kind on or off.</p> <ul> <li><b>Individual kills</b> count \
  only the person's own kills. Career awards are checked monthly. <i>Standard, per scenario (repeatable):</i> Bronze \
  Star (4), Silver Star (8), Combat Cross (12). <i>Standard, per mission (repeatable):</i> Combat Achievement (6), \
  Combat Commendation (9), Distinguished Service (12).</li> <li><b>Formation kills</b> count every kill made by the \
  person's lance, company, battalion or larger formation during the mission. The formation is read from your current \
  <a href='GLOSSARY:TOE'>TO&amp;E</a> when the mission ends, so set up your TO&amp;E before completing a mission. \
  Kills by members who have since died or been captured still count. <i>Standard (repeatable):</i> lance awards at \
  24, 36 and 48 kills, company awards at 72, 108 and 144, and battalion awards at 216, 324 and 432.</li> </ul> \
  <h2>Rank</h2> <p>Earned for reaching a rank, checked monthly and whenever you change someone's rank. An award can \
  be for reaching a rank or higher, for reaching it within one rank group (enlisted, warrant officer or officer), or \
  for being promoted to exactly that rank. A promotion award replaces the person's previous promotion award. The \
  Standard set has no Rank awards.</p> <h2>Scenario</h2> <p>Earned for taking part in enough scenarios over a career. \
  <i>Standard:</i> Combat Action (1 scenario).</p> <h2>Skill</h2> <p>Earned for reaching a skill level. This uses the \
  skill level, not the target number. An award can need one skill or several skills, or it can accept any skill in a \
  family. The families are Piloting, Accuracy (every gunnery skill, Artillery, Small Arms and Anti-Mek), Command, \
  Admin, Tech, Medical and Assistant. <i>Standard:</i> Marksmanship (any Accuracy skill at level 5), Expert \
  Marksmanship (level 7).</p> <h2>Theatre of War</h2> <p>Earned when a contract ends, if the contract ran during a \
  war and was for one of that war's belligerents. A war with one listed side needs only your employer to belong to \
  it. A war with two sides needs your employer on one side and your enemy on the other, and is only checked when \
  StratCon is enabled. <i>Standard:</i> one award for each major conflict, from the Third Succession War to the \
  Jihad.</p> <h2>Time</h2> <p>Earned for years of service with your command. Repeatable time awards need the same \
  span again each time. For example, Longevity is earned at 4, 8 and 12 years. MekHQ does not track discipline, so \
  Good Conduct only counts years. <i>Standard:</i> Longevity (every 4 years), Good Conduct (every 6 years).</p> \
  <h2>Training</h2> <p>Earned when a person graduates from an academy in the <a \
  href='GLOSSARY:EDUCATION'>Education</a> module. <i>Standard:</i> Basic Training, NCO Academy Graduate, Warrant \
  Officer Graduate and Officer Graduate, for graduating from those academies.</p> <h2>Misc</h2> <p>Special awards, \
  each with its own rule:</p> <ul> <li><b>Medal of Honor</b> (repeatable): in a single scenario, at least 10 kills \
  and at least 5 new hits.</li> <li><b>Humanitarian Service:</b> taking part in a Civilian Help scenario.</li> \
  <li><b>Prisoner of War</b> (repeatable): being taken prisoner during a mission, awarded when the mission ends.</li> \
  <li><b>Expeditionary</b> and <b>House Defense:</b> completing a mission in a system held by a major Inner Sphere \
  power. Expeditionary is for when the contract's enemy is not at war with that power, and House Defense is for when \
  it is.</li> <li><b>Periphery Expeditionary:</b> completing a mission in a system held by a Periphery faction.</li> \
  <li><b>Ceremonial Duty:</b> completing a mission while your command is in the employer's capital system.</li> \
  <li><b>Drill Instructor:</b> commanding a combat team in the Training role while you have an active contract.</li> \
  <li><b>Support Person of the Year:</b> each month, every support role a person holds rolls one d6 per experience \
  level in that role (none at Ultra-Green), and the total is kept as support points. If a person's other role is a \
  combat role, their support roll counts for half. On 1 January, the person with the most points over the past year \
  is offered the award. If they already hold it, the daily report suggests that you nominate someone by hand.</li> \
  <li><b>Mission Accomplished:</b> completing a mission with a full Success. This one is not in the Standard \
  set.</li> </ul>
### B
BATCHALL.title=Batchall
BATCHALL.definition=A Batchall is the formal challenge a Clan commander issues before battle. The challenger names\
  \ themselves, states what is being fought over, and asks what forces the defender will use. Each side then bids\
  \ away units, trying to win with the fewest forces it can, so the battle is decided by skill and honor rather than\
  \ overwhelming force.\
  <p><b>When a Batchall Is Issued</b></p>\
  <p>Batchalls are only offered while <a href='GLOSSARY:GENERIC_BATTLE_VALUE'>Generic Battle Value</a> is enabled in\
  \ Campaign Options, and only by Clan factions that follow the custom. When such a contract starts, the enemy\
  \ commander contacts you with their challenge. Garrison-type contracts (Garrison, Cadre, Security, and Riot Duty, and\
  \ Retainers) skip this: on these contracts the enemy issues its Batchall when it first raids instead\
  \ (see <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>).</p>\
  <p>If Faction Standings are tracked and <b>Enable Batchall Restrictions</b> is on, a Clan only offers a Batchall\
  \ while your Standing with them is above -40 Regard. Below that, the Clan sends no challenge. This does not count\
  \ as a refusal: the Clan still bids as normal, and your Standing is not reduced.</p>\
  <p><b>Accepting the Batchall</b></p>\
  <p>If you accept, MekHQ simulates the enemy's bidding before every scenario of the contract. Each Clan force is given\
  \ a budget equal to your deployed Battle Value, multiplied by the scenario's force multiplier, the campaign's skill\
  \ level (from 0.5 at Ultra-Green to 2.0 at Legendary), and the Clan's honor rating. Strict Clans multiply the budget\
  \ by 1.0, Opportunistic Clans by 1.25, and Liberal Clans by 1.5. Many Clans grew less strict after the Clan\
  \ Invasion, a shift MekHQ places around 3053 to 3054. Forces brought in by scenario modifiers are also scaled by the\
  \ 'Scenario Modifier BV' campaign option.</p>\
  <p>The Clan then goes through its units in random order, keeping each one while its running total is still within\
  \ budget. The unit that crosses the budget is kept in full, so the final force can end up well over budget,\
  \ especially when it is made up of a few expensive units. Every unit after that is bid away. The units bid away are\
  \ listed in the daily report.</p>\
  <p>Bidding often leaves the Clan heavily outnumbered. On ground scenarios (not in tornadoes, and not for artillery,\
  \ off-board, or aircraft forces, or forces with a fixed unit count), if you field more units than the Clan,\
  \ Elementals and other Battle Armor are added to close half of the difference. Mechanized Battle Armor riding on\
  \ OmniMeks is added first, then standalone Battle Armor.</p>\
  <p>While the Batchall stands and <b>Clans Better Obey Bidding Rules</b> is enabled, scenario modifiers that would\
  \ add extra forces are blocked for whichever side is a Clan. If your enemy is a Clan, the enemy's modifiers are\
  \ blocked. If your employer is a Clan, your side's modifiers are blocked. Fighting a Clan for an Inner Sphere\
  \ employer still lets your side receive support. This covers both random modifiers and modifiers lent by\
  \ <a href='GLOSSARY:STRATCON_FACILITIES'>Facilities</a>.</p>\
  <p>While the Batchall stands, you may not Raid or Sabotage the Clan's facilities.</p>\
  <p><b>Refusing the Batchall</b></p>\
  <p>If you refuse, the Clan does no bidding for the rest of the contract. You face every unit generated for each\
  \ scenario, and the bidding rules above no longer restrict either side. If Faction Standings are tracked, your\
  \ Standing with that Clan also drops sharply: about twice as much as breaching a contract with an employer.</p>\
  <p><b>Breaking the Batchall</b></p>\
  <p>Calling <a href='GLOSSARY:HOW_TO_REINFORCE'>reinforcements</a> into a scenario against a Clan whose Batchall you\
  \ accepted breaks its terms. You are warned first and can back out. If you go ahead, you are treated as having\
  \ refused the Batchall for the rest of the contract, and the Standing loss is doubled, because breaking your word\
  \ is worse than never giving it.</p>\
  <p>Official Combat Challenge scenarios cannot be reinforced at all.</p>\
  <p>Even after accepting, fighting the Clans can be very difficult, especially as an Inner Sphere force. If a\
  \ contract turns against you, it is better to lose the contract than your entire campaign.</p>
BLOODHOUSE.title=Bloodhouse
BLOODHOUSE.definition=A Bloodhouse is the body of warriors descended from a single founder's genetic legacy, and \
  the House whose <a href='GLOSSARY:BLOODNAME'>Bloodname</a> they may compete for. Eight hundred were established \
  when Nicholas Kerensky founded the Clans, one for each warrior who stood with him.\
  <p>Every <a href='GLOSSARY:PHENOTYPE'>trueborn</a> is bred from exactly one House and may only fight for that \
  House's name - specifically, the House of their genemother. See \
  <a href='GLOSSARY:GENETIC_LEGACY'>Genetic Legacy</a>.</p>\
  <p>A House is not owned forever by the Clan that founded it. Absorption, sharing agreements, and \
  <a href='GLOSSARY:TRIAL_OF_POSSESSION'>Trials of Possession</a> all move legacies between Clans, and the \
  <a href='GLOSSARY:WARS_OF_REAVING'>Wars of Reaving</a> redistributed a great many of them.</p>
BLOODMARK.title=Bloodmark
BLOODMARK.definition=Bloodmarks are a type of <a href='GLOSSARY:TRAITS'>Trait</a>. The higher a character's \
  'Bloodmark', the greater the chance a 'Bloodhunt' occurs. When this happens, a bounty hunter will make an attempt on \
  the character's life. This may result in them escaping, getting injured, or even being killed.\
  <p>On the first of each month a check is made to see whether one or more Bloodhunts are scheduled. This is based on\
  \ the character's Bloodmark level. Purchasing the 'Alternative ID' SPA halves the chance of a Bloodhunt occurring.</p>\
  <p>- <b>Bloodmark 1:</b> 1-in-6 (1-in-12 with Alternative ID)\
  <br>- <b>Bloodmark 2:</b> 1-in-3 (1-in-6 with Alternative ID)\
  <br>- <b>Bloodmark 3-5:</b> automatic (1-in-2 with Alternative ID)</p>\
  <p>If Bloodhunts are scheduled, a follow-up check is made to determine how many attempts will be made on the \
  character's life. The first scheduled attempt occurs in d6 days, with subsequent attempts occurring every d6 days \
  after that. The Bloodhunt schedule is not player-visible.</p>\
  <p>- <b>Bloodmark 1:</b> d6/3 attempts (rounded down)\
  <br>- <b>Bloodmark 2:</b> d6/2 attempts (rounded down)\
  <br>- <b>Bloodmark 3:</b> d6/3 attempts (rounded down)\
  <br>- <b>Bloodmark 4:</b> d6/2 attempts (rounded down)\
  <br>- <b>Bloodmark 5:</b> d6 attempts</p>\
  <p>When a Bloodhunt occurs, there is a 1-in-n chance that the assassination attempt will be successful. This is \
  based on the level of their Bloodmark Trait.</p>\
  <p>- <b>Bloodmark 1-2:</b> 1-in-20\
  <br>- <b>Bloodmark 3-4:</b> 1-in-10\
  <br>- <b>Bloodmark 5:</b> 1-in-5</p>\
  <p>If a Bloodhunt is successful, the character is dealt d6 <i>Hits</i> and the check is made again. This process is\
  \ repeated until the Bloodhunt is unsuccessful or the character has taken 6 Hits, which may kill them.</p>\
  <p>A character is safe from a scheduled Bloodhunt if they are a child, are deployed to a scenario, or if the \
  campaign is in transit and the character is with the unit. If the character is marked as <b>Under Protection</b>,\
  \ the campaign automatically pays off the bounty hunter at twice the Bloodmark's bounty. If the campaign can't \
  afford this, the attempt goes ahead.</p>\
  <p><b>Claiming the Bounty</b>: The bounty on a Bloodmarked character can be claimed from their right-click menu. \
  The campaign receives the bounty, and the character is killed.</p>\
  <p>- <b>Bloodmark 1:</b> 10,000 C-Bills\
  <br>- <b>Bloodmark 2:</b> 37,500 C-Bills\
  <br>- <b>Bloodmark 3:</b> 125,000 C-Bills\
  <br>- <b>Bloodmark 4:</b> 500,000 C-Bills\
  <br>- <b>Bloodmark 5:</b> 1,000,000 C-Bills</p>\
  <p><b>Education</b>: Characters in education are not traditionally Bloodhunted. Instead, their chance of having a \
  training 'accident' are increased based on their Bloodmark level. Furthermore, if a character has a Bloodmark they \
  can suffer training 'accidents' even while in non-military academies.</p>\
  <p>Additional information about the Bloodmark Trait can be found in the 'Bloodmark' section of <b>A Time of War</b>.</p>
BUYING_UNITS_AND_PARTS.title=Buying Units and Parts
BUYING_UNITS_AND_PARTS.definition=<p>Most of what your company uses has to be bought, and buying takes time. Each \
  order goes onto the <b>procurement list</b> in the Command Center. Your acquisitions personnel try to find each \
  item, and anything they find still has to be delivered (see <a href='GLOSSARY:DELIVERY_TIMES'>Delivery \
  Times</a>).</p>\
  <h2>Placing Orders</h2>\
  <p>- <b>Units:</b> <i>Marketplace &gt; Purchase Unit</i> searches every unit the campaign's year and tech rules \
  allow. The <a href='GLOSSARY:UNIT_MARKET'>Unit Market</a> sells from a random selection that changes each month \
  instead.\
  <br>- <b>Parts:</b> <i>Marketplace &gt; Purchase Parts</i>, or <b>Purchase Parts</b> in the Command Center, lists \
  every part. <b>Buy</b> orders one and <b>Buy in Bulk</b> orders several. Tick <b>Hide Impossible Target Parts</b> \
  to hide the parts your company can't get.\
  <br>- <b>Parts for repairs:</b> <b>Parts Needed Report</b> in the Command Center, or <b>Parts</b> in the Repair \
  Bay, lists the parts your units are missing. Order them one at a time, in bulk, or all at once with \
  <b>Order All</b>.\
  <br>- <b>Spares:</b> <a href='GLOSSARY:PARTS_IN_USE'>Parts in Use</a> sets how many spares to keep of each part \
  and can reorder them every week.\
  <br>- <b>Refits:</b> a refit can order the parts it needs. See <a href='GLOSSARY:REFITS'>Refits</a>.</p>\
  <h2>Finding the Item</h2>\
  <p>Each item on the list is rolled for in turn. One of your acquisitions personnel makes a procurement check \
  against the item's target number. If they succeed, the item is paid for and sent on its way. If they fail, it stays \
  on the list and is tried again once the acquisition period has passed (7 days by default). An item shown with a \
  target number of <i>Impossible</i> can be ordered, but no one can currently find it.</p>\
  <p>Several options under <i>Logistics</i> in Campaign Options decide how this works:\
  <br>- <b>Acquisitions Skill</b>: the skill used for the check. It can be Administration, Negotiation or any tech \
  skill. <i>Automatic</i> makes every check succeed.\
  <br>- <b>Acquisitions Personnel</b>: who may make checks: anyone, support personnel only, admins only, or no \
  one.\
  <br>- <b>Acquisition Roll Period Frequency</b> and <b>Max Acquisition Rolls per Period</b>: how often items are \
  retried and how many checks each person can make.\
  <br>- <b>Use Planetary Acquisitions</b>: when enabled, what you can find depends on the nearby worlds' technology \
  and industry.</p>\
  <p>During a contract, <a href='GLOSSARY:PARTS_AVAILABILITY'>Parts Availability</a> can make items harder or \
  easier to find. In the Command Center, <b>Procurement Priority</b> sets the order items are rolled for, and \
  <b>Pause Procurement</b> stops all procurement checks until you resume them.</p>\
  <h2>Faster Options</h2>\
  <p>In <a href='GLOSSARY:GM_MODE'>GM Mode</a>, <b>Add (GM)</b> puts units and parts straight into the campaign at \
  no cost. Right-click the procurement list to procure or add items immediately. Units and parts still in transit \
  can be delivered at once from the GM Mode menu in the Hangar and Warehouse.</p>
### C
BLOODNAME.title=Bloodname
BLOODNAME.definition=A Bloodname is the surname attached to one of the eight hundred genetic legacies the Clans \
  were founded on, and the highest honour a Clan warrior can hold. A warrior who has not won one carries only a \
  given name.\
  <p>Names are won in a Trial of Bloodright, a tournament fought for a single vacant \
  <a href='GLOSSARY:BLOODRIGHT'>Bloodright</a> within the warrior's own <a href='GLOSSARY:BLOODHOUSE'>Bloodhouse</a>. \
  Most warriors never win one; the competition is fierce and the openings few.</p>\
  <p>A Bloodname may be <b>exclusive</b> to one Clan, <b>limited</b> in how many may hold it at once, restricted \
  after its Clan was abjured, or no longer granted at all. A warrior serving a Clan that does not own their name \
  was almost certainly taken as <a href='GLOSSARY:ISORLA'>isorla</a>.</p>
BLOODRIGHT.title=Bloodright
BLOODRIGHT.definition=Each <a href='GLOSSARY:BLOODNAME'>Bloodname</a> was founded with twenty-five individual \
  legacies called Bloodrights, and it is a specific Bloodright rather than the name itself that a warrior \
  competes for.\
  <p>Each carries its own reputation, its Bloodheritage, built from the deeds of everyone who has held it. A \
  Bloodright once held by a hero is far more sought after than one held by a string of mediocrities, and warriors \
  will delay testing for years to wait for the one they want. Ulric Kerensky won his at thirty for exactly that \
  reason.</p>\
  <p>A warrior taking a disgraced Bloodright inherits its shadow and must excel to redeem it. Taman Malthus won \
  Adler Malthus's Bloodright only because no MekWarrior would compete for it after Adler's failure at Twycross, \
  and redeemed it fighting alongside Kai Allard-Liao. A Bloodright stained badly enough may go unclaimed \
  indefinitely, or be Reaved.</p>\
  <p><i>MekHQ does not currently model individual Bloodrights; a warrior wins the Bloodname itself.</i></p>
CAMP_FOLLOWERS.title=Camp Followers
CAMP_FOLLOWERS.definition=<p>A Camp Follower is a character who travels with your force but is not employed by \
  it. Their status is shown as Camp Follower, and their professions are marked with a dot (&#9679;) in the \
  Personnel tab. The <b>Camp Followers</b> filter shows only them.</p>\
  <p>Camp Followers:</p>\
  <p>- are not paid a salary\
  <br>- cannot be assigned to crew a unit\
  <br>- are not counted as AsTechs or Medics, even if that is their profession</p>\
  <p>Characters usually become Camp Followers when they join the force without being hired: for example, civilians \
  added by <a href='GLOSSARY:RANDOM_CIVILIANS'>Random Civilians</a> and babies born into the campaign.</p>\
  <p>To hire a Camp Follower, right-click them in the Personnel tab and choose <b>Change Status</b>, then \
  <b>Employ</b>. They become Active, their recruitment date is set to today, and they start drawing a salary.</p>
CANONICAL_DISEASES.title=Canonical Diseases & Bioweapons
CANONICAL_DISEASES.definition=At the time of writing, around 50 canonical diseases and bioweapon attacks are tracked \
  in MekHQ. The effects of each disease are outlined below.\
  <p>A disease marked as 'global' can be found on any world, all others are restricted to one or more planetary \
  systems. A disease marked as 'flaw' is acquired when receiving the specific Flaw and not through random infection. \
  Hereditary diseases (including Flaws) are automatically inflicted on any child born to a parent with the disease. \
  Finally, 'permanent' diseases are infections that never leave the body. Universally, these count as one permanent \
  'Hit' in addition to any other effects.</p>\
  <h2>Ageranium's Disease (Flaw)</h2>\
  Intelligence -2\
