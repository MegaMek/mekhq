CAPITAL_SYSTEMS.title=Capital Systems
CAPITAL_SYSTEMS.definition=On the interstellar map, a faction's capital system is marked by a special ring. Each faction\
 \ will only have a single capital. Navigating there will increase the likelihood of receiving contracts for that faction.
CHASSIS_FAMILIARITY.title=Chassis Familiarity
CHASSIS_FAMILIARITY.definition=Chassis Familiarity is a custom system unique to MekHQ. Through Chassis Familiarity \
  your personnel will bond with their war machines, pushing them to greater heights.\
  <p>The goal of Chassis Familiarity is to provide mechanical benefits to keeping personnel in the same, or similar, \
  machines. It's intended to reflect the kind of 'Mek-Pilot relationship we see in the novels. Such as Katie \
  Ferraro's bond with her Kit Fox, <i>Kagekitsune</i>, or Kai Allard-Liao and his trusty <i>Yen-Lo-Wang</i>.</p>\
  <h2>An Important Note</h2>\
  There are no limits on how many chassis a character can become familiar with. A character gains familiarity with a \
  particular <i>chassis</i> and not a model. So a character piloting a Hunchback HBK-4G will gain familiarity with all\
  \ hunchbacks and not specifically the HBK-4G.\
  <h2>Gaining Familiarity</h2>\
  Familiarity can be gained by any character assigned to any unit except Fighter Squadrons, Tele-operated Missiles, \
  Handheld Weapons, Battlefield Support Assets, buildings of any kind (including Gun Emplacements). Familiarity is \
  not limited to combat personnel. Techs will earn familiarity any time a unit's crew gains familiarity, but that \
  gain is divided by the number of units they're assigned to. A tech looking after three units earns a third of the \
  crew's gain from each. Familiarity reflects the personal bond a character has with a particular chassis, hard to \
  build that bond when your attention is spread across too many machines.\
  <h3>Scenario Gains</h3>\
  A character will gain Familiarity points any time their unit returns from a scenario. The amount of Familiarity \
  gained depends on Campaign Options but is usually 1-3 d6. The more Familiarity a character has earned, the better \
  the bonuses they'll receive when working with that chassis.\
  <p>Combat personnel increase their Piloting and Gunnery. While techs gain a bonus to Maintenance checks and Repair \
  rolls.</p>\
  <h3>Training Gains</h3>\
  Whenever a formation deploys as a <a href='GLOSSARY:TRAINING_COMBAT_TEAMS'>Training Formation</a>, all personnel \
  involved will gain a small amount of Familiarity. The more successful the formation commander's Training skill \
  check, the more Familiarity they and their trainees will gain.\
  <p>It's important to note that Familiarity for trainees is capped at 100 Familiarity points. However, trainees will\
  \ also gain a small amount of Familiarity with their educator's unit (though this is capped at 50 Familiarity \
  points).</p>\
  <h3>Patrol Gains</h3>\
  Whenever a formation deploys as a Patrol <a href='GLOSSARY:COMBAT_TEAMS'>Combat Formation</a> they will gain \
  Familiarity with their machines in the same way as scenarios. However, these Familiarity gains are at a slower rate\
  \ than scenario gains (roughly 50% slower).\
  <h3>Off-Contract Training Gains</h3>\
  At the beginning of each month, all personnel gain Familiarity as if their unit had returned from a scenario. This \
  represents off-contract training, such as time spent in Sim Pods. Once you have arrived at an offensive contract, \
  or at a defensive contract that isn't <a href='GLOSSARY:GARRISON_RAIDS'>Peaceful</a>, this happens at the \
  beginning of each week instead.\
  <p>These gains follow all the normal restrictions listed above.</p>\
  <h2>Benefits</h2>\
  <b>Normal</b>\
  <blockquote>0-99 Familiarity: <i>no modifiers</i>\
  <br>100-199: +1 piloting skill level, +1 modifier to Maintenance checks\
  <br>200: all the benefits listed above, as well as +1 gunnery skill level, +1 modifier on Repair tasks.</blockquote>\
  <b>Hard</b>\
  <blockquote>0-99 Familiarity: -1 piloting and gunnery skill level, -1 penalty to Maintenance and Repair checks.\
  <br>100-199: <i>no modifiers</i>\
  <br>200-299: +1 piloting skill level, +1 bonus to Maintenance checks.\
  <br>300: all the benefits listed above, as well as +1 gunnery skill level, +1 modifier on Repair tasks.</blockquote>\
  <h3>Infantry & ProtoMeks</h3>\
  Piloting improvements for Infantry and ProtoMeks works slightly differently than other chassis. Infantry do not, \
  strictly, have a 'piloting' skill. Instead, 'piloting' skill bonuses apply to <b>Anti-Mek (Climbing)</b>.\
  <p>For ProtoMeks, the bonuses work normally despite ProtoMeks using the same skill for gunnery and piloting. When a\
  \ ProtoMek is transferred from MekHQ to MegaMek the skill values are still stored separately. This allows us to \
  modify 'piloting' and 'gunnery' individually.
CHALLENGE_SKULLS.title=Contract Challenge Skulls
CHALLENGE_SKULLS.definition=Contract Skulls were introduced to help players estimate contract difficulty when using \
  <a href='GLOSSARY:FORCE_GENERATION'>Force Generation 3 (FG3)</a>. Skulls are not available under FG2.5 and should \
  be treated as guidelines, not guarantees. Some contract types are inherently harder than others, and skull ratings \
  do not account for this. In some cases, player experience is the only reliable guide.\
  <p>Skulls are calculated by comparing the combat formations in your <a href='GLOSSARY:TOE'>TO&E</a> against all \
  possible units the OpFor can generate. This allows MekHQ to estimate the relative balance of power. Each half-skull\
  \ represents roughly a 20% difference in strength.</p>\
  <p>For example, a 2.5-skull contract indicates roughly equal strength between your formations and the enemy. A 1.5-skull \
  contract means your formations are about 40% stronger. A 5-skull contract, the maximum, means the OpFor is \
  roughly twice as powerful as you are - expect heavy losses.</p>\
  <p>As mentioned above, skull ratings only reflect the relative strength of deployed units versus the OpFor's total \
  available roster. Factors such as facility availability, scenario modifiers, and the inherent difficulty of certain\
  \ contract types are not represented.</p>
CHANGING_FILTERS_HANGAR.title=Changing Filters in the Hangar Tab
CHANGING_FILTERS_HANGAR.definition=Sometimes you want to change the amount or type of information displayed in the\
 \ Hangar Tab.\
 <p>To do this, click on the dropdown titled 'Unit Type' at the top of the tab. That will allow you to display only the\
 \ units you're interested in.</p>\
 <p>Similarly, the 'View' dropdown lets you change what kind of information is available for each unit.</p>
CHANGING_FILTERS_PERSONNEL.title=Changing Filters in the Personnel Tab
CHANGING_FILTERS_PERSONNEL.definition=Sometimes you want to change the amount or type of information displayed in the\
 \ Personnel Tab.\
 <p>To do this, click on the dropdown titled 'Personnel Type' at the top of the tab. That will allow you to display only\
 \ the professions you're interested in.</p>\
 <p>Similarly, the 'View' dropdown lets you change what kind of information is available for each character.</p>
CHANGING_FILTERS_WAREHOUSE.title=Changing Filters in the Warehouse Tab
CHANGING_FILTERS_WAREHOUSE.definition=Sometimes you want to change the amount or type of information displayed in the\
 \ Warehouse Tab.\
 <p>To do this, click on the dropdown titled 'Part Type' at the top of the tab. That will allow you to display only\
 \ the parts you're interested in.</p>\
 <p>Similarly, the 'Part Status' dropdown lets you further filter what parts are displayed.</p>
COMBAT_ROLES.title=Combat Roles
COMBAT_ROLES.definition=Combat Roles are used in <a href='GLOSSARY:STRATCON'>StratCon</a> to declare what kind of \
  strategic actions a formation is taking. Campaigns not using StratCon can still declare Combat Roles, but they \
  will not have any game effects.<p>There are six Combat Roles in total, each with a distinct purpose:</p><p>- \
  <b>Frontline:</b> This Combat Role lets you <a href='GLOSSARY:HOW_TO_DEPLOY'>deploy</a> Conventional Infantry and \
  Battle Armor units. When a Frontline formation is the first to deploy to a scenario, each level of its commander's \
  <i>Tactics</i> skill gives it 2 defensive points. Each Conventional Infantry or Battle Armor unit you bring along \
  costs 1 point. They can come from any Combat Team that is not in Reserve. Any points left over become conventional \
  minefields. Official challenge scenarios give no defensive points. Frontline also allows you to take advantage of \
  <a href='GLOSSARY:LEADERSHIP_UNITS'>Leadership Units</a>.<br>- <b>Maneuver:</b> This Combat Role lets you more \
  easily <a href='GLOSSARY:HOW_TO_REINFORCE'>reinforce</a> scenarios. When reinforcing with a formation assigned to \
  this role, you roll the reinforcement check twice, using only the best result. This makes reinforcements far more \
  reliable.<br>- <b>Training:</b> <a href='GLOSSARY:TRAINING_COMBAT_TEAMS'>Training Formations</a> allow senior \
  personnel to train the next generation. There's a lot to this combat role, and you are advised to read the \
  documentation cited at the bottom of this Glossary entry. One important point to mention, a Training formation \
  <b>must</b> use the <a href='GLOSSARY:REMAIN_DEPLOYED'>Remain Deployed</a> option when deployed to the <a \
  href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations (AO)</a>, otherwise no training will take place. Training \
  formations are focused on their exercises, so they only reveal the hex they deploy to and never scout the \
  surrounding hexes.<br>- <b>Patrol:</b> Forces assigned to this role are deployed to scout the AO. Normally, when a \
  formation deploys to the AO, they remove the fog of war surrounding the hex they deploy to. Forces assigned to \
  this role reveal not only that hex but also all adjacent hexes (note: enabling <a \
  href='GLOSSARY:ADVANCED_SCOUTING'>Advanced Scouting</a> changes these rules) Furthermore, when a formation deploys \
  to the AO, There's a chance they will be immediately pulled into a hidden scenario. When a Patrol deploys, any \
  hidden scenarios will always be one hex away unless the formation is deploying 'blind' (deploying to an \
  unscouted hex).<br>- <b>Auxiliary:</b> Forces assigned to this role are those you intend to pull into scenarios \
  piecemeal. They cannot be deployed to scenarios as a formation, either directly or as reinforcements. Instead, \
  they are the only formations that can supply <a href='GLOSSARY:LEADERSHIP_UNITS'>Leadership Units</a>, brought \
  in one at a time by a Frontline formation whose commander has the <i>Leadership</i> skill. MekHQ will generally \
  ignore Auxiliary formations when picking a <a href='GLOSSARY:SEED_FORCES'>Seed Force</a>.<br>- <b>Reserve:</b> Reserve formations are formations \
  that are not deployed to the combat theater. They might be too battered to fight, or simply being held in reserve. \
  Like Auxiliary formations, MekHQ will generally ignore reserve formations when picking a Seed Force.</p><p>New \
  Combat Teams start in the Reserve role.</p>
COMBAT_TEAMS.title=Combat Teams
COMBAT_TEAMS.definition=<p>A Combat Team is a formation that fights as one. It could be a single Lance or Star, or \
  a larger formation such as a Company of several Lances with their support units. Combat Teams are what you \
  <a href='GLOSSARY:HOW_TO_DEPLOY'>deploy</a> in <a href='GLOSSARY:STRATCON'>StratCon</a>, assign \
  <a href='GLOSSARY:COMBAT_ROLES'>Combat Roles</a> to, and use to \
  <a href='GLOSSARY:HOW_TO_REINFORCE'>reinforce</a> scenarios.</p>\
  <h2>Which Formations Are Combat Teams</h2>\
  <p>By default, a formation is a Combat Team if:</p>\
  <p>- it directly holds at least one unit (units in its sub-formations don't count),\
  <br>- it and every formation above it are <a href='GLOSSARY:FORCE_TYPE_COMBAT'>Combat Forces</a>, and\
  <br>- no formation above or below it is already a Combat Team.</p>\
  <p>Normally this makes each Lance or Star its own Combat Team.</p>\
  <h2>Overrides</h2>\
  <p>Right-click a formation in the <a href='GLOSSARY:TOE'>TO&E</a> to change this:</p>\
  <p>- <b>Always Consider Force a Combat Team</b> makes it a Combat Team even if it holds no units directly or \
  has Combat Teams above or below it. Those formations lose their Combat Team status.\
  <br>- <b>Never Consider Force a Combat Team</b> stops it being one.\
  <br>- <b>Remove Combat Team Override</b> returns it to the default rules.</p>\
  <p>Overrides still need the formation to be a Combat Force. For example, to deploy a Company of three Lances as \
  one Combat Team, mark the Company 'Always Consider Force a Combat Team'. This keeps scenario numbers down in \
  large campaigns. StratCon is balanced around Lance-sized engagements, though, so larger Combat Teams mean larger \
  fights.</p>\
  <p>In the TO&E, Combat Teams are shown in <b>bold</b> and marked with a small 'c'. Formations with an override are \
  <u>underlined</u>, so you can see which ones you changed.</p>\
  <h2>Force Types</h2>\
  <p>Each formation has a type: <a href='GLOSSARY:FORCE_TYPE_COMBAT'>Combat</a>, \
  <a href='GLOSSARY:FORCE_TYPE_CONVOY'>Convoy</a>, <a href='GLOSSARY:FORCE_TYPE_SECURITY'>Security</a>, \
  <a href='GLOSSARY:FORCE_TYPE_SUPPORT'>Support</a> or <a href='GLOSSARY:FORCE_TYPE_SALVAGE'>Salvage</a>. Change it \
  by right-clicking the formation. Only Combat formations can be Combat Teams. A Support formation inside a Combat \
  Team deploys to the Area of Operations with it, without being picked to fight.</p>
COMING_OF_AGE_AWARDS.title=Coming of Age Awards
COMING_OF_AGE_AWARDS.definition=When a character turns 16 they come of age. Coming of Age Awards can give them a \
  free Special Pilot Ability (SPA), new roleplay skills, or both. They represent the talents, flaws, and interests a \
  character develops as they grow up. Two separate options control what they receive.\
  <h2>Award Coming of Age SPAs</h2>\
  <p>The character receives one random ability. It is picked in the same way as a \
  <a href='GLOSSARY:VETERANCY_AWARDS'>Veterancy Award</a>, with these differences:</p>\
  <blockquote>- An ability's prerequisites are always ignored, so a character can receive an ability they could \
  never purchase.\
  <br>- The award can include abilities that are normally only given during character creation.</blockquote>\
  <p>This award requires <b>Use Special Pilot Abilities (SPAs)</b> to be enabled. When a character receives it, it \
  is announced in the daily report.</p>\
  <p>The award shares the rest of the Veterancy Award draw. There is a <b>1-in-40</b> chance the award is a Flaw, \
  and some Flaws can be career ending. If no Flaws are available, the award will always be a positive ability. \
  Every ability in the chosen group has an equal chance of being picked, and a character will never receive an \
  ability they already have, or one that conflicts with an ability they already have.</p>\
  <p>Only abilities enabled in your campaign can be awarded. This award was balanced around Flaws and the \
  <i>A Time of War</i> SPAs being available. If you have disabled either, you may want to leave it off.</p>\
  <h2>Award Coming of Age RP Skills</h2>\
  <p>The character rolls for each roleplay skill they do not already have. Each roll is 2d6 plus the \
  <b>Roleplay Skills</b> modifier. On a 1 or less they do not gain the skill; on a 2-5 they gain it at Green; 6-9 \
  at Regular; 10-11 at Veteran; and 12+ at Elite. If <b>Extra Random Skills</b> is enabled, each gained skill's \
  level may then be raised or lowered by 1. A Roleplay Skills modifier of -12 means no skills will be gained.</p>\
  <h2>Where to Find These Options</h2>\
  <p>Both award options are found in Campaign Options, under Human Resources, Biography, General, in the \
  'Coming of Age & Veterancy' section. <b>Use Special Pilot Abilities (SPAs)</b> is found under Human Resources, \
  Personnel, General. The <b>Roleplay Skills</b> modifier is found under Advancement, Awards & Randomization, \
  Randomization, in the 'Secondary and Specialty Skills' section.</p>
COMMAND_GENERATOR.title=Command Generator
COMMAND_GENERATOR.definition=The Command Generator builds a complete starting command for a new campaign: combat \
  formations organized the way the campaign's faction organizes them, the technicians, doctors and administrators who \
  keep them running, DropShips to lift them, officers chosen from the people generated, spare parts in the warehouse \
  and starting cash in the bank.\
  <h2>Where to Find It</h2>\
  <p>A campaign with no units and no personnel shows a yellow <b>Generate Starting Command</b> button on the main \
  screen. The generator can also be opened at any time from <i>Manage Campaign</i> on the menu bar as <i>Quick Start \
  Command Generator</i>, once 'Show Quick Start Command Generator' is ticked in <b>MekHQ Options</b>.</p>\
  <h2>How It Works</h2>\
  <p>The generator is a design stage, laid out as four pages: <b>Force</b>, <b>People</b>, <b>Logistics</b> and \
  <b>Review</b>. Tiles along the top estimate what you will get as you change settings. The force is always rolled \
  for the campaign's own faction. Choose its unit type and size on the Force page and press Roll; each roll is added \
  to the command, and the board lists it formation by formation. Click the ring beside any unit to strike it out of \
  the build. Clear rolls starts over with your \
  settings kept. Nothing is added to your campaign until you press <b>Build Command</b> on the Review page, which \
  lists what the build will do and anything worth a second look. If you change a setting after rolling, the \
  generator asks whether to build the command you rolled or to roll again.</p>\
  <p>Once built, a summary shows the command's funds, reputation and combat strength, and the new command appears in \
  the <a href='GLOSSARY:TOE'>TO&E</a> with its units aboard their DropShips.</p>\
  <p>Every control in the generator explains itself when you hover over it. These entries describe what each part \
  does and the choices that matter most:\
  <br>- <a href='GLOSSARY:COMMAND_GENERATOR_FORCE'>Force</a>: what the command is made of, how it is \
  named, and its transport\
  <br>- <a href='GLOSSARY:COMMAND_GENERATOR_OFFICERS'>Officers & Ranks</a>: who leads, and how everyone is ranked\
  <br>- <a href='GLOSSARY:COMMAND_GENERATOR_SUPPORT'>Support Personnel</a>: techs, doctors, administrators and their \
  assistants\
  <br>- <a href='GLOSSARY:COMMAND_GENERATOR_SIMULATION'>Starting Simulation</a>: giving the command a past\
  <br>- <a href='GLOSSARY:COMMAND_GENERATOR_FINANCES'>Logistics</a>: starting cash, the starting loan and the \
  warehouse\
  <br>- <a href='GLOSSARY:COMMAND_GENERATOR_AUGMENTATION'>Augmentation</a>: cybernetic implants for the factions \
  that use them\
  <br>- <a href='GLOSSARY:SUPPORT_TEAMS'>Support Teams</a>: how support staff are filed into the TO&E</p>
COMMAND_GENERATOR_AUGMENTATION.title=Command Generator: Augmentation
COMMAND_GENERATOR_AUGMENTATION.definition=The Augmentation section on the People page of the \
  <a href='GLOSSARY:COMMAND_GENERATOR'>Command Generator</a> decides whether the warriors generated come with \
  cybernetic implants. It is only shown for the factions it applies to: Word of Blake Shadow Divisions, any Clan, and \
  Warrior House Thuggee. Everyone else never sees it.\
  <p>Both settings must be on before you press Build Command, because implants are fitted while the command \
  is generated and cannot be added to the warriors afterwards. 'Track Cybernetic Implants' makes the campaign \
  record cybernetic implants. 'Pilot Implants' is MegaMek's rule: Off allows no implant of any kind, Pilot \
  Abilities Only fits them and they work on their own, and Full Tracking fits them but a warrior only gets the \
  benefit in a unit carrying the matching interface equipment.</p>\
  <p>With both on, a Shadow Division is fitted with Manei Domini implants and Clan formations receive enhanced \
  imaging. Warrior House Thuggee has implant tracking switched on for the campaign, but its warriors are not fitted \
  during generation. Turn either setting off and no warrior is augmented.</p>
COMMAND_GENERATOR_FINANCES.title=Command Generator: Logistics
COMMAND_GENERATOR_FINANCES.definition=The Logistics page of the \
  <a href='GLOSSARY:COMMAND_GENERATOR'>Command Generator</a> decides what the command starts with in the bank and in \
  the warehouse.\
  <h2>Starting Cash</h2>\
  <p>The command starts with cash measured in months of its running costs once it is built: salaries, maintenance, \
  overhead, food and housing, and Hot Spots upkeep, worked out the same way the contract market works out a \
  command's expenses. Only the costs the campaign actually charges count, and the page lists which ones do. At the \
  default twelve months, a command that costs 2 million C-bills a month to run starts with 24 million. The figure is \
  worked out when the command is built and reported in the Finances log. The command itself, its units, ships and \
  spares, is granted free.</p>\
  <p>'Minimum starting cash' is the least the command is founded with, ten million C-bills by default, so a command \
  whose campaign charges little or nothing can still pay its first month's wages.</p>\
  <h2>Starting Loan</h2>\
  <p>'Double Starting Cash with a Loan' borrows a sum equal to the starting cash, doubling it. The loan runs for two \
  years at 15% with monthly payments. This can make the early game very difficult, because the repayments begin \
  before a first contract is likely to have paid out.</p>\
  <h2>Spares</h2>\
  <p>The spares percentages stock the warehouse with parts as a share of what the command's units carry: Mek heads \
  and locations, armor, armor kits, ammunition, bombs, heat sinks, weapons, actuators, jump jets, head components, \
  engines, gyros and everything else. They are the same AutoLogistics restock percentages as \
  <i>Acquisition & Delivery</i> in <b>Campaign Options</b>, and the page opens with the values set there. \
  Whatever is stocked appears in the Warehouse tab once the build finishes.</p>
COMMAND_GENERATOR_FORCE.title=Command Generator: Force
COMMAND_GENERATOR_FORCE.definition=The Force page of the \
  <a href='GLOSSARY:COMMAND_GENERATOR'>Command Generator</a> decides what the command is made of. It uses MegaMek's \
  Force Generator, and always rolls for the campaign's own faction, which decides the sizes, ratings and unit types \
  offered. Choose the unit type and size, and Roll draws units that faction actually fielded in that era, \
  organized into the echelons it used. An Inner Sphere command comes out as \
  lances, companies and battalions; a Clan command as Stars, Binaries and Clusters.\
  <h2>Editing the Preview</h2>\
  <p>The rolled command is listed on the board, formation by formation. Click the ring beside a unit or formation \
  and it is struck out and left out of the build; click it again to bring it back. Roll adds another roll to the \
  command, and Clear rolls empties it while keeping your settings. Nothing reaches your campaign until you press \
  Build Command on the Review page.</p>\
  <h2>Naming</h2>\
  <p>Formations are named by the alphabet chosen under 'Formation Naming Method'. A regiment's battalions are Alpha, \
  Beta and Gamma; each battalion's companies start again at Alpha, and so on down to the lances. 'Always Number \
  Regiments' names them 1st Mek Regiment and 2nd Mek Regiment instead, with each kind of regiment counting on its \
  own, so an armor regiment alongside two Mek regiments is the 1st Armor Regiment.</p>\
  <h2>Command Lance</h2>\
  <p>'Generate Company Command Lance' gives the campaign commander a separate lance of their own. When off, \
  the commander leads the first lance generated instead.</p>\
  <h2>Transport</h2>\
  <p>DropShips rolled with the force are kept, and the units they carry are put aboard them in the \
  <a href='GLOSSARY:TOE'>TO&E</a>. Lift is sized to include the support units the generator adds. Ships arrive with \
  a named pilot, gunner and crew member, so maintenance and <a href='GLOSSARY:TEMP_CREWS'>Temporary Crews</a> work \
  from the first day.</p>
COMMAND_GENERATOR_OFFICERS.title=Command Generator: Officers & Ranks
COMMAND_GENERATOR_OFFICERS.definition=The People page of the \
  <a href='GLOSSARY:COMMAND_GENERATOR'>Command Generator</a> decides who leads the command and how everyone in it is \
  ranked.\
  <h2>Officer Selection</h2>\
  <p>By default the command is led by its best people. 'Assign Best Campaign Commander' puts the most skilled person \
  generated in charge, wherever the roll seated them: Tactical Genius counts first, then command skills, then combat \
  skills. 'Assign Best Officers' does the same for every battalion, company and lance, working from the top of the \
  command down. 'Assign Most Skilled to Primary Lances' seats the best pilots in the command lance and first company \
  and the greener ones further down; pilots only swap between units of the same kind, and crews of more than one \
  stay put. The two 'Prioritize Combat Skills' options make gunnery and piloting count for more than Leadership, \
  Strategy and Tactics when choosing. With these off, each formation is led by the first pilot found in it.</p>\
  <h2>Generate Captains</h2>\
  <p>Officers gain the skills that come with the post. The commanding officer gains a level of gunnery and piloting \
  and two command skill increases; captains and above gain one combat skill and two increases; lance leaders gain \
  one of each. Command skill increases land at random on Leadership, Strategy or Tactics. 'Apply Officer Stat Bonus \
  to Weakest Skill' sends the combat skill to the weaker of gunnery and piloting instead of the better one.</p>\
  <h2>Ranks, Callsigns and Founders</h2>\
  <p>'Automatically Assign Ranks' gives everyone a rank from the rank system set in <b>Campaign Options</b>, sized \
  to the formation they command: officers get officer ranks, MekWarriors sergeant ranks and support staff corporal \
  ranks. 'Assign Commander Flag' makes the \
  person at the top your campaign's commanding officer and appoints a second in command.</p>\
  <p>Every MekWarrior can be given a random callsign, skipped for Clan warriors, who carry \
  <a href='GLOSSARY:BLOODNAME'>Bloodnames</a> instead. Everyone generated can be marked a founder of the command; \
  founders are shown as such in the personnel list, and with the Founder Plot Armor campaign option each gains a \
  point of <a href='GLOSSARY:EDGE'>Edge</a>.</p>\
  <h2>Random Origin</h2>\
  <p>Rolls a home planet for each person around the command's home system, with separate settings for dependents \
  and for Clan-born personnel. These choices apply only to the people the generator creates; the campaign's own \
  Random Origin options, used for later recruits, are left as they were.</p>
COMMAND_GENERATOR_SIMULATION.title=Command Generator: Starting Simulation
COMMAND_GENERATOR_SIMULATION.definition=The Starting Simulation, under History on the People page of the \
  <a href='GLOSSARY:COMMAND_GENERATOR'>Command Generator</a>, gives a new command a past. The years chosen are run \
  week by week over the people generated, using the campaign's own marriage and birth rules, so some arrive married \
  or with children rather than as strangers who met that morning. The campaign's date does not move.\
  <p>It is off by default; 'Simulate Random Marriages' and 'Simulate Random Procreation' are on for when it is \
  turned on. Those two only \
  do anything if a random marriage method and a random procreation method are chosen in <b>Campaign Options</b>. \
  With those off, the simulation runs and nothing happens.</p>\
  <p>The marriage roll is rare, about one in five thousand per person each week, so ten years gives a battalion a \
  handful of marriages and children, and a few months gives none.</p>\
  <p>Any financial effect of the simulated years appears on the Finances tab once the build finishes.</p>
COMMAND_GENERATOR_SUPPORT.title=Command Generator: Support Personnel
COMMAND_GENERATOR_SUPPORT.definition=The People page of the \
  <a href='GLOSSARY:COMMAND_GENERATOR'>Command Generator</a> also hires the people who keep the command running: \
  technicians, doctors and administrators.\
  <h2>Coverage and Skill</h2>\
  <p>Support staff are set in a table, one row per role. Need is the number Campaign Operations asks for to keep \
  every unit maintained and every patient treated, such as one Mek Tech per 'Mek. Coverage hires a percentage of \
  that need, and Hire shows the result. 100% hires the full number, less leaves some units without a tech, and more \
  gives spare hands. \
  Skill sets their experience level, or Random rolls one for each person. The support vehicles the generator adds \
  itself, such as logistics trucks, are counted when sizing the need.</p>\
  <h2>Assistants</h2>\
  <p>The Assistants section hires six astechs for every tech and four medics for every doctor, so techs and doctors \
  work at full speed. Each can be a Pool of anonymous assistants or named People. Named assistants get ranks and \
  skill levels and appear in the personnel list, but a battalion can mean hundreds of them, so the pool is the \
  better choice for a large command.</p>\
  <h2>Medical Reserve</h2>\
  <p>'Medical Reserve (% of combatants)' adds spare combat personnel with no unit of their \
  own, ready to step in when someone is wounded. Each combat role, such as MekWarriors, aerospace pilots, vehicle \
  crews and soldiers, gets its own reserve as a percentage of the people generated in that role, rounded up.</p>\
  <h2>Tech Assignment</h2>\
  <p>Once everything is generated, techs are handed out to units the same way as the Hangar's Quick Assign \
  Maintenance Techs button: the highest battle value units are offered a tech first, techs are load balanced and \
  take at most two units each, and units that already have a tech keep them. Deployed and refitting units, and \
  people marked never to be assigned maintenance automatically, are skipped.</p>\
  <h2>Support Teams</h2>\
  <p>With the <a href='GLOSSARY:SUPPORT_TEAMS'>Support Teams</a> campaign option on, the support staff generated \
  are filed into a Support Command formation in the <a href='GLOSSARY:TOE'>TO&E</a>. With it off, they stay on the \
  roster.</p>
COMMAND_RIGHTS.title=Contract Command Rights
COMMAND_RIGHTS.definition=Command Rights dictate how much control your employer has over your operations. Your \
  employer exercises that control through <a href='GLOSSARY:DEPLOYMENT_ORDERS'>Deployment Orders</a>: positions in \
  the <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a> they order you to move a formation to. The more \
  restrictive your Command Rights, the more often orders arrive. There are four different types of Command Rights:\
  <p><b>Integrated:</b> This is the most restrictive type of Command Right. Your force is wholly integrated into \
  your employer's command structure. Expect three Deployment Orders a month per point of the contract's Scale.</p>\
  <p><b>House:</b> Under House command rights, your force is not integrated into your employer's command structure \
  but is under the direct command of the employer. Expect two Deployment Orders a month per point of the contract's \
  Scale. \
  Furthermore, in <a href='GLOSSARY:TURNING_POINTS'>Turning Point</a> scenarios you will be joined by an officer from \
  Allied Command.</p>\
  <p><b>Liaison:</b> Liaison command rights are a variant of House command rights. Under Liaison command rights, you \
  are still under the direct command of the employer, but they keep you on a longer leash. Expect Deployment Orders \
  one a month per point of the contract's Scale, and you will not be joined by an officer from Allied Command.</p>\
  <p><b>Independent:</b> A contract with Independent command rights is operating, as the name suggests, \
  independently. Your employer will never issue Deployment Orders, leaving you free to dictate when and where you \
  engage the enemy. However, your employer will not run convoys for you: monthly\
  \ <a href='GLOSSARY:RESUPPLY'>Resupplies</a> only arrive if you collect them with your own Convoy formations.</p>\
  <h2>Controlling and Lenient Employers</h2>\
  <p>Some employers keep a tighter grip than others. A controlling employer issues one more Deployment Order a month \
  per point of Scale: Liaison as often as House, House as often as Integrated, and Integrated four a month per point \
  of Scale. A lenient employer issues one fewer: Integrated as often as House, House as often as Liaison, and Liaison \
  not at all. Neither changes Independent command rights.</p>\
  <h2>Turning Points</h2>\
  <p>Command Rights do not change how often scenarios are Turning Points: whatever your Command Rights, there is a \
  1-in-3 chance that a scenario will be considered a Turning Point.</p>
CONNECTIONS.title=Connections
CONNECTIONS.definition=Connections are a type of <a href='GLOSSARY:TRAITS'>Trait</a> that applies multiple \
  benefits if the character is the campaign commander.\
  <h2>Personal Reputation (Default Reputation)</h2>\
  A character's personal reputation is a measure of how well they are regarded. Their Connections rank acts as a \
  direct modifier to their reputation.\
  <h2>Force Reputation (CamOps Reputation)</h2>\
  <p>If the campaign commander has any Connections, the Commander Rating portion of the unit's \
  <a href='GLOSSARY:FORCE_REPUTATION'>Force Reputation</a> gains 1 point.</p>\
  <h2>Modifiers</h2>\
  <p>- <b>Citizenship:</b> +1\
  <br>- <b>Xenophobia:</b> -1\
  <br>- <b>Mild Paranoia:</b> -1\
  <br>- <b>In For Life:</b> -1\
  <br>- <b>Revealed Dark Secrets</b> may also reduce Connections.</p>\
  <p>A character suffering from Clinical Paranoia, or whose contacts have gone quiet (see below), is treated as \
  having no Connections. The 'Important Friends' SPA increases the contribution Connections makes to personal \
  reputation by 25%, while 'Forgets to Reply' reduces it by 25%.</p>\
  <h2>Monthly Checks</h2>\
  <p>If monthly Connections rolls are enabled in Campaign Options, each month the commander will make roll 2d6, on \
  4+ the commander's contacts will donate funds to the campaign.</p>\
  <p>The amount of funds donated is based on the character's Connections score:</p>\
  <p>- <b>1:</b> 1,000 C-Bills\
  <br>- <b>2:</b> 2,500 C-Bills\
  <br>- <b>3:</b> 5,000 C-Bills\
  <br>- <b>4:</b> 10,000 C-Bills\
  <br>- <b>5:</b> 25,000 C-Bills\
  <br>- <b>6:</b> 50,000 C-Bills\
  <br>- <b>7:</b> 100,000 C-Bills\
  <br>- <b>8:</b> 250,000 C-Bills\
  <br>- <b>9:</b> 500,000 C-Bills\
  <br>- <b>10:</b> 1,000,000 C-Bills</p>\
  <p>Furthermore, if both monthly rolls and the new recruitment style are enabled, each month the commander will make \
  roll 2d6. On a 4+ the commander's contacts will hook them up with additional recruits. \
  This will increase the chance of seeing rare personnel, such as Elite characters or characters with unusual \
  professions.</p>\
  <p>The number of recruits added to the market is based on the character's Connections score:</p>\
  <p>- <b>1:</b> 0 recruits\
  <br>- <b>2:</b> 0 recruits\
  <br>- <b>3:</b> 0 recruits\
  <br>- <b>4:</b> 1 recruits\
  <br>- <b>5:</b> 2 recruits\
  <br>- <b>6:</b> 3 recruits\
  <br>- <b>7:</b> 4 recruits\
  <br>- <b>8:</b> 6 recruits\
  <br>- <b>9:</b> 8 recruits\
  <br>- <b>10:</b> 10 recruits</p>\
  <p>Finally, each month a check is made to determine if the commander loses contact with their Connections. If the \
  character loses contact, they temporarily lose all levels in Connections for d6 months. This could reflect \
  something happening to the character's contact, the contact just not being available, or the contact not being \
  willing to extend support to the campaign.</p>\
  <p>The chance of losing access to a character's contacts is based on the character's Connections score:</p>\
  <p>- <b>1:</b> 7 or less on 2d6\
  <br>- <b>2:</b> 7 or less on 2d6\
  <br>- <b>3:</b> 6 or less on 2d6\
  <br>- <b>4:</b> 6 or less on 2d6\
  <br>- <b>5:</b> 5 or less on 2d6\
  <br>- <b>6:</b> 5 or less on 2d6\
  <br>- <b>7:</b> 4 or less on 2d6\
  <br>- <b>8:</b> 4 or less on 2d6\
  <br>- <b>9:</b> 3 or less on 2d6\
  <br>- <b>10:</b> 3 or less on 2d6</p>
CONTRACTS_AND_MISSIONS.title=Contracts and Missions
CONTRACTS_AND_MISSIONS.definition=<p>Every scenario in MekHQ belongs to a contract: a formal agreement with an \
  employer to reach a goal or serve for a set time. Older versions also had plain missions with no employer; these \
  no longer exist. The Briefing Room still calls the contract you are viewing the <b>Current Mission</b>.</p> \
  <h2>Getting a Contract</h2> <p>Contracts come from the Contract Market (<b>Marketplace</b>, <b>Contract \
  Market...</b>). In GM Mode the market also has:</p> <p>- <b>Create New (GM)</b>, which opens the contract editor \
  on a blank offer.<br>- <b>New Shell Contract (GM)</b>, which creates a simple contract to hold scenarios you add \
  yourself. See <a href='GLOSSARY:SHELL_CONTRACTS'>Shell Contracts</a>.</p> <p>If you use a <a \
  href='GLOSSARY:DIGITAL_GM'>Digital GM</a>, it generates the contract's scenarios for you. Otherwise, add them with \
  <a href='GLOSSARY:MANUAL_SCENARIOS'>Manual Scenarios</a>.</p> <p>More on the kinds of contract can be found at <a \
  href='GLOSSARY:MISSION_TYPES'>Mission Types</a>.</p>
CONTRACT_VICTORY_POINTS.title=Contract Victory Points
CONTRACT_VICTORY_POINTS.definition=Contract Victory Points (CVP) represent an abstract measure of your contract's \
  overall strategic success. Most contracts set a required CVP target, and you must finish the contract with a CVP \
  score that meets or exceeds it to be considered <a href='GLOSSARY:MISSION_CONCLUSION_HELP'>successful</a>. Most \
  contracts carry this target as a <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>Strategic Objective</a> and require a \
  positive CVP score; the rest simply require a non-negative score, meaning you must not end the contract below zero.\
  <p>Falling short of the required CVP target will result in a Failure or, at best, a Success, even if all\
  \ other <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>objectives</a> are met. Meeting the target is not enough on its\
  \ own for a Perfect Success, either, if the contract has other Strategic Objectives: you must also complete at\
  \ least one of them. A contract with no other Strategic Objectives (any contract in mapless mode, for example)\
  \ is judged on its CVP target alone.</p>\
 <p>CVP should not be confused with <a href='GLOSSARY:SCENARIO_VICTORY_POINTS'>Scenario Victory Points (SVP)</a>.
COOP_CAMPAIGNS.title=Co-op Campaigns
COOP_CAMPAIGNS.definition=<p>MegaMek games are multiplayer, so a group of friends can fight MekHQ's battles \
  together. There are two ways to set this up, and either can be driven by <a href='GLOSSARY:STRATCON'>StratCon</a> \
  or by a human GM.</p> <h2>One Shared Campaign</h2> <p>One person keeps the campaign save and runs MekHQ, and \
  everyone plays units from the same command. That person selects the scenario in the Briefing Room and presses \
  <b>Start Game</b>. The other players connect from MegaMek. In the MegaMek lobby, right-click units and use \
  <b>Change Owner</b> to hand each player their units, and put everyone on the same team. When the battle ends, the \
  host's MekHQ resolves the scenario as usual.</p> <p>Keep one master copy of the save. You can pass it around \
  between sessions so others can spend money or make changes, but only one copy should be played from.</p> <h2>One \
  Campaign Each</h2> <p>Each player runs their own campaign and brings their own command to the battle. One player \
  hosts with <b>Start Game</b>. Everyone else selects a scenario in their own Briefing Room, deploys to it, and \
  presses <b>Join Game</b>, which connects to the host and adds their deployed units. Units already in the game are \
  not added again. Each joining player needs a scenario of their own to deploy to; one made with <b>Add Scenario</b> \
  will do (see <a href='GLOSSARY:MANUAL_SCENARIOS'>Manual Scenarios</a>). When the battle ends, every player's MekHQ \
  resolves the scenario for its own units.</p> <h2>Hosting</h2> <p><b>Start Game</b>, <b>Load Saved Game</b> and \
  <b>Auto Resolve</b> all ask for host settings: your player name, an optional password, the port (2346 by default) \
  and whether to register the game with a metaserver. Players connecting from outside your network need that port \
  forwarded to your machine. <b>Join Game</b> asks for your name and the host's address and port.</p> <h2>Running It \
  With a Human GM</h2> <p>A GM can run the campaign with StratCon switched off, writing the story and playing the \
  opposition. The <b>5 - Campaign Operations</b> preset is a starting point: it is written for GMs who own the \
  <i>Campaign Operations</i> rulebook and will roll for anything MekHQ doesn't handle. Its contracts are made as <a \
  href='GLOSSARY:SHELL_CONTRACTS'>Shell Contracts</a> and its battles with <a \
  href='GLOSSARY:MANUAL_SCENARIOS'>Manual Scenarios</a>. Most of these tools need <b>GM Mode</b>, the toggle at the \
  top of the main window.</p> <h2>Persistent Opposition</h2> <p>A GM who wants the enemy's losses to last can keep \
  the enemy in a campaign of its own, and allies in another. Keep each one's date in step with the players' \
  campaign. For each battle, add a scenario to that campaign, deploy the enemy formations and press <b>Export MUL \
  File</b>. In MegaMek, load the file with <b>Load MUL file...</b> in the lobby. When the game ends, save the record \
  of units MegaMek offers, then use <b>Resolve Manually</b> with that file in each campaign that took part. Each \
  campaign recognises its own units in the file. See <a href='GLOSSARY:MUL_FILES'>MUL Files</a>.</p>
CRISIS_SCENARIO.title=Crisis Scenarios
CRISIS_SCENARIO.definition=<b>Crisis</b> are special scenarios that require your immediate attention. They represent\
  \ important moments that can define the strategic stability of a contract.\
 \ <p>A crisis might consist of important supply convoys coming under enemy fire. Where failing to\
 \ rout the OpFor will result in them being able to linger behind your lines, causing significant\
 \ strategic damage.</p>\
  <p>Alternatively, a crisis might feature the enemy trying to rescue important prisoners, the successful extraction of\
  \ which would give them valuable intel.</p>\
 \ <p>No matter the strategic context, the rules are simple: failing to win a Crisis will result in the loss of 1\
  \ <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory Point (CVP)</a>, similar to losing a\
  \ <a href='GLOSSARY:TURNING_POINTS'>Turning Point</a> scenario. However, unlike Turning Points, winning a Crisis will\
  \ <b>not</b> award CVP. Furthermore, Crisis scenarios will <i>still</i> deduct 1 CVP even if the scenario is a Draw.</p>
CHAOS_FACTOR.title=Chaos Factor
CHAOS_FACTOR.definition=Chaos measures how intense and unpredictable your solo roleplay story has become, on a scale \
  of 1 to 9. It starts at 5.\
  <p>Higher chaos makes the <a href='GLOSSARY:ORACLE'>Oracle</a>'s Fate Chart more likely to answer Yes: the more \
  chaotic things are, the more likely whatever you ask about is true. Chaos does not change how often \
  <a href='GLOSSARY:ORACLE_RANDOM_EVENTS'>random events</a> happen.</p>\
  <p>At the end of every <a href='GLOSSARY:SCENES'>scene</a>, ask yourself whether it was more intense than the scene \
  before. If it was, raise chaos by 1; otherwise, lower it by 1. Only you can judge a scene, so MekHQ never changes \
  chaos by itself. The End Scene… link under the Chaos tile in the Oracle console asks you this question.</p>
### D
DAMAGED_PARTS.title=Damaged Parts
DAMAGED_PARTS.definition=Sometimes you will notice damaged parts in your warehouse. These usually come from\
 \ <a href='GLOSSARY:STRIPPING_AND_REPAIRING'>stripping</a> salvaged units.\
 <p>To repair a part, select it in the warehouse, select a tech followed by 'Do Task.'</p>\
 <p>Alternatively, you can right-click on the part and select '<a href='GLOSSARY:MASS_REPAIR_MASS_SALVAGE'>Mass Repair</a>'.\
 \ This will allow you to quickly repair all damaged parts. Though for more important parts, you are usually better off\
 \ micromanaging assignment to ensure the job is done properly.</p>
DELIVERY_TIMES.title=Delivery Times
DELIVERY_TIMES.definition=In a universe as large as the Inner Sphere, where JumpShips are a precious rarity, acquiring\
 \ replacement parts and units isn't a quick process.\
 <p>Keep in mind that unlike what we're used to, as consumers, 'next day delivery' doesn't exist at the strategic level\
  \ in Battletech. JumpShip Captains are not hanging about waiting for your order. Instead, your order is placed via HPG \
  request, processed, and then a DropShip and JumpShip are sourced to deliver it. Generally, these ships will only set\
  \ forth once their holds are full enough to warrant the journey.</p>\
 <p>All this means that, in most cases, you will notice yourself waiting months for a replacement part or unit to arrive.\
 \ We strongly recommend spending 2-3 months between each contract rearming, repairing, and restocking. Failing to do\
 \ this will leave you high and dry when you need parts the most.</p>\
 <p>The rules for delivery times can be found in <i>Campaign Operations</i>.</p>
DEPLOYMENT_ORDERS.title=Deployment Orders
DEPLOYMENT_ORDERS.definition=Deployment Orders are a type of Nav Point in the \
  <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a>, representing your employer dictating where you \
  fight. How often they arrive depends on your <a href='GLOSSARY:COMMAND_RIGHTS'>Command Rights</a> and on how \
  controlling your employer is.\
  <p>To carry out an order, <a href='GLOSSARY:HOW_TO_DEPLOY'>deploy</a> any formation to its hex before it lapses, \
  4 to 7 days after it was issued. Simply arriving fulfills the order, but whatever your formation finds there is \
  rolled for as normal, so a scenario may still break out.</p>\
  <p>Each Deployment Order is a <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>Strategic Objective</a>. Letting one lapse \
  fails that objective, costing you a Perfect Success: even if you meet your \
  <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory Point</a> target, the contract will at best be a \
  Success.</p>\
  <h2>Frequency</h2>\
  <p>Each month of a contract brings Deployment Orders, each on a random day of the month (several may fall on the \
  same day). Per point of the contract's Scale, rounded normally:\
  <br>- <b>Integrated:</b> three orders.\
  <br>- <b>House:</b> two orders.\
  <br>- <b>Liaison:</b> one order.\
  <br>- <b>Independent:</b> no orders.</p>\
  <p>A controlling employer adds one order per point of Scale, and a lenient employer takes one away.</p>\
  <h2>Ending a Contract Early</h2>\
  <p>Orders still to come never stop you from ending a contract early: your employer simply stops issuing them. Any \
  order already issued must be carried out or allowed to lapse first, and Deployment Orders alone are not enough to \
  let a contract end early.</p>\
  <p>Deployment Orders are not issued in <a href='GLOSSARY:STRATCON_MAPLESS'>mapless</a> mode.</p>
DEPRECATED.title=Deprecated
DEPRECATED.definition=A deprecated system or option is no longer actively developed or supported.\
 \ <p>While these systems remain available, they will eventually be removed.</p>
DISEASES.title=Diseases
DISEASES.definition=If both <b>Alternative Advanced Medical</b> and <b>Random Diseases</b> are enabled in Campaign \
  Options, it is possible your characters may occasionally contract a contagious disease. These diseases can be \
  deadly.\
  <p>Each week a die is rolled, per character, to see if they contract a disease. The number of sides on this die \
  depends on whether there are any other diseases active in your campaign. If there are, the die will have 50 sides. \
  Otherwise, it has 1000 sides. A disease is contracted on a roll of 1.</p>\
  <p>Characters can be protected against these diseases via vaccinations.</p>\
  <p>When landing on a planet, you will be prompted to vaccinate all personnel in your campaign. These vaccines are \
  only valid while on that planet, though they have no expiring. So, if you later return to the same planet, any \
  previously vaccinated characters will not need to be revaccinated. The vaccines procured by your medical staff are \
  100% effective, have no failure rate, and do not run the risk of allergic reactions.</p>\
  <p>Alternatively, personnel can be vaccinated via a button in the Infirmary tab. This allows you to quickly \
  vaccinate everyone in the event of a disease outbreak.</p>\
  <p>Due to code limitations, vaccinations do not work while off-planet. This is justified as the close confines of a\
  \ DropShip allow the diseases to more easily spread. However, you will not contract new diseases while in \
  transit. So you are only in danger if you depart while there are one or more diseases spreading through your \
  personnel.</p>
DIGITAL_GM.title=Digital GM
DIGITAL_GM.definition=In MekHQ, a Digital GM refers to any system designed to replace a human GM in campaign play.\
 <p>Currently, there is only one Digital GM available: <a href='GLOSSARY:STRATCON'>StratCon</a>. Although it has \
  three modes to try and match any playstyle.</p>
### E
EDGE.title=Edge
EDGE.definition=In certain circumstances, Edge may be used to reroll negative events. Like failing a skill check, or\
 \ suffering a head hit in combat. Because of legacy decisions, Edge doesn't follow the rules outlined in <i>A Time of\
  \ War</i>. In MekHQ 'Edge' is considered a '<a href='GLOSSARY:TRAITS'>Trait</a>.'\
 <p>To change when Edge triggers, right-click on a character in the Personnel Tab and navigate to Edge Triggers.</p>\
 <p>Each point in the 'Unlucky' Trait reduces available Edge by 1.</p>
EDUCATION.title=Education
EDUCATION.definition=<p>The Education Module lets you send your personnel to school. That can mean a high school or \
  university, a military academy or bootcamp, or training run by your own unit. Students improve their skills, gain \
  XP and raise their education level. Turn it on with <b>Enable Education Module</b> on the Education page of the \
  Personnel options.</p> <h2>Academies</h2> <p>Every school, bootcamp or apprenticeship is called an academy. \
  Academies come in three standard sets, and each one can be turned off on the Education page:</p> <p>- <b>Local \
  Academies</b> are the ordinary schools that any populated world can be assumed to have, such as a high school, a \
  university or a bootcamp. They are always found in your current system, and they never hold an entrance exam. <br>- \
  <b>Prestigious Academies</b> are the famous, canonical institutions of the BattleTech setting, from the Nagelring \
  to the Sakhara Academy. They generally teach better, but they charge more, may be many jumps away, and require an \
  entrance exam. Many only accept students from their own faction. Find something we got wrong, or an academy we \
  missed? Let us know, and cite your sources! <br>- <b>Unit Education</b> is training your command runs itself, such \
  as an apprenticeship or an in-house bootcamp. Students never leave the unit. It is generally weaker than a formal \
  education, but most of it is free.</p> <p>Academies are also either <b>Civilian</b> or <b>Military</b>, which is \
  how the Education menu sorts them. Only military academies risk training accidents. A <b>Reeducation Camp</b> is a \
  special civilian academy that can convert a student to your faction (see <a \
  href='GLOSSARY:EDUCATION_GRADUATION'>Graduation</a>).</p> <h2>Education Levels</h2> <p>Every person has an \
  education level, shown on their record: <b>Early Childhood</b>, <b>High School</b>, <b>College</b>, \
  <b>Post-Graduate</b> or <b>Doctorate</b>. Some academies require a minimum level. The level a course teaches \
  depends on the student's current level, up to the academy's maximum. Graduating raises the student's level to the \
  level they studied, if it is higher.</p> <p>New characters start with a level that fits their background. Anyone \
  under 16 has Early Childhood. Older characters roll against a 60% pass rate, adjusted by their Reasoning if Random \
  Personalities are used. Experienced characters, and doctors, tend to be better educated. A character who starts \
  with a Doctorate gets the 'Dr' title. In GM mode, <b>Education &gt; Change Highest Education (GM)</b> sets a \
  person's level directly.</p> <h2>More</h2> <p>- <a href='GLOSSARY:EDUCATION_ENROLLMENT'>Enrolling Students</a>: who \
  can attend, entrance exams, tuition and travel. <br>- <a href='GLOSSARY:EDUCATION_STUDY'>Life as a Student</a>: \
  dropouts, accidents, wars and other events. <br>- <a href='GLOSSARY:EDUCATION_GRADUATION'>Graduation</a>: skills, \
  XP, honors and degrees.</p> <p>Courses are slightly shorter than their canon counterparts, as the academic year has \
  no breaks. Even so, training the next generation of MekWarriors takes a long time! Graduates can also earn Training \
  awards (see <a href='GLOSSARY:AWARD_TYPES'>Award Types</a>).</p> <p>You can add your own academies too. \
  Academies are listed in XML files in <i>data/universe/academies/</i>, either in your MekHQ folder or in your user \
  directory. Each file is a set, named after the file, such as <i>Local Academies</i>. A file with the same name \
  as a shipped set adds its academies to that set, and an academy with the same name as a shipped one replaces \
  it. Use the shipped files as models.</p>
EDUCATION_ENROLLMENT.title=Education: Enrolling Students
EDUCATION_ENROLLMENT.definition=<p>To enroll someone in an <a href='GLOSSARY:EDUCATION'>academy</a>, right-click \
  them on the Personnel tab and open the <b>Education</b> menu. Each academy set has its own section, divided into \
  Civilian and Military academies. Choose an academy, then a course. Hover over a course to see what it teaches and \
  costs. You can select several people and enroll them together, but only academies that all of them can attend are \
  listed.</p> <p>Only active personnel can enroll, and not while they are recovering from an injury.</p> <h2>Who Can \
  Attend</h2> <p>An academy turns a person away if:</p> <ul> <li>it has not been built yet, or has been closed or \
  destroyed. These academies are never listed.</li> <li>its system has no population.</li> <li>the person is too \
  young or too old for it.</li> <li>the person's education level is below the academy's minimum.</li> <li>the person \
  has already failed its entrance exam at this education level.</li> <li>the academy's faction is at war with the \
  person's faction or with your campaign's faction. Many prestigious academies also refuse anyone who is not from \
  their own faction. A Reeducation Camp only checks your campaign's faction.</li> <li>its nearest campus is beyond \
  the <b>Maximum Jump Radius</b> (5 jumps by default). Travel is estimated at roughly one jump per week, so this may \
  not exactly match the Interstellar Map.</li> </ul> <p>If <b>Show Ineligible Academies</b> is on, academies a person \
  cannot attend are still listed, with the reason. <b>Override Requirements</b> removes every requirement. It is \
  meant for testing new academies, not for normal play.</p> <h2>Entrance Exams</h2> <p>Prestigious academies hold an \
  entrance exam. Roll 2d6 (plus Reasoning / 4, if Random Personalities are used) against a target of <b>Entrance Exam \
  Target Number - the academy's Faculty Skill</b>. The target number option is 14 by default. A person who fails can \
  never apply to that academy again at the same education level, though they can apply again once their level \
  changes. Local academies and Unit Education never hold an exam.</p> <h2>Tuition</h2> <p>Tuition is paid in full \
  when the student enrolls, and covers travel. If you cannot afford it, the enrollment is cancelled. Tuition rises \
  with the education level being taught. Many academies give a discount (10% for most) if they are in a system held \
  by the student's faction or your campaign's faction.</p> <h2>Becoming a Student</h2> <p>An enrolled person's status \
  becomes <b>Student</b>, and they are no longer active. Their record shows their current stage and the days left. \
  Students travel to the academy, study there, then travel back. Local academies are 2 days away. Students at \
  prestigious academies make the full journey, which can take weeks or months. When they finish, they travel back to \
  the base they set off from, or to your command if that base no longer exists. Unit Education has no travel at all, \
  and the student stays with the unit, under the care of your infirmary.</p> <p>A student's family may go with them. \
  A spouse who is a dependent or not employed by you goes on leave and travels along. Their children under 16 go too, \
  unless a spouse stays behind to look after them. Enrolling a prisoner gives them their chance: they escape on the \
  way and are gone for good.</p> <h2>Changing Plans</h2> <p>- <b>Drop Out</b> pulls students out of their education \
  at once. A student who is still travelling is returned to active duty straight away. A student who is studying \
  receives partial credit (see <a href='GLOSSARY:EDUCATION_GRADUATION'>Graduation</a>) and starts the journey back. \
  Changing a student's status yourself also ends their education, and it cannot be resumed. <br>- <b>Re-Enroll</b> \
  appears once a student has finished or dropped out and is heading home. It sends them through the same course \
  again, paying tuition again, if they still have something to learn there. <br>- <b>Complete Education Stage \
  (GM)</b> skips the student's current stage. Use it repeatedly to finish an education at once.</p>
EDUCATION_STUDY.title=Education: Life as a Student
EDUCATION_STUDY.definition=<p>While a student is studying at an <a href='GLOSSARY:EDUCATION'>academy</a>, MekHQ \
  checks on them every Monday, and once a year on 1 January. Most of these events send the student home early. A \
  student who leaves early only gets partial credit for the time they spent (see <a \
  href='GLOSSARY:EDUCATION_GRADUATION'>Graduation</a>).</p> <h2>Dropping Out</h2> <p>Each week, students older than 6 \
  may decide to quit. Adults drop out on a roll of 1 on a die with as many sides as <b>Adult Dropout Chance</b> \
  (1,000 by default). Students under 18 use <b>Child Dropout Chance</b> (10,000 by default). Setting either to 0 \
  turns dropouts off. Students with fewer than 10 days left are always talked into finishing. A student who drops out \
  of a <b>Reeducation Camp</b> has escaped, and is marked Missing.</p> <h2>Training Accidents</h2> <p>Students at \
  military academies risk a training accident each week, on a roll of 1 on a die with as many sides as <b>Military \
  Accidents Chance</b> (10,000 by default, or 0 to turn accidents off). Unit Education rolls twice and uses the worse \
  result, as training alongside a working military unit is more dangerous. A person with a <a \
  href='GLOSSARY:BLOODMARK'>Bloodmark</a> divides the die by their Bloodmark level plus one, and risks 'accidents' at \
  any academy.</p> <p>After an accident, the student rolls 2d6. On a 5 or more they are hurt and their education is \
  extended by 3d6 days. Otherwise, they are killed. Students under 16 are always only hurt, unless <b>All Ages \
  Affected</b> is on.</p> <h2>War</h2> <p>If the academy's faction goes to war with the student's faction or your \
  campaign's faction, the student is expelled and sent home. Unit Education is never affected by war, closure or \
  destruction.</p> <h2>Closure and Destruction</h2> <p>Prestigious academies can close, or be destroyed, in the years \
  history says they did. Any academy is also destroyed if its system loses its population. When an academy closes, \
  its students are sent home. When one is destroyed, each student rolls 2d6. On a 5 or more they escape and head \
  home. Otherwise, they are marked Missing, and their fate is left to you. Students under 18 always escape, unless \
  <b>All Ages Affected</b> is on.</p>
EDUCATION_GRADUATION.title=Education: Graduation
EDUCATION_GRADUATION.definition=<p>When a student finishes their course at an <a \
  href='GLOSSARY:EDUCATION'>academy</a>, they roll a d100 to see how they did. If Random Personalities are used, \
  their Reasoning is added, from -12 for the least intelligent to +12 for a genius.</p> \
  <table><tr><th>d100</th><th>Result</th></tr> <tr><td>Under 5</td><td><b>Failed:</b> the student leaves with one \
  level less of skill improvement and curriculum XP. They still receive Faculty XP, but no change in education \
  level.</td></tr> <tr><td>5-19</td><td><b>Classes to retake:</b> graduation is tried again after another 3d6 days. \
  This can happen more than once.</td></tr> <tr><td>20-89</td><td><b>Graduated</b>.</td></tr> \
  <tr><td>90-98</td><td><b>Graduated with honors:</b> one graduation bonus.</td></tr> <tr><td>99+</td><td><b>Top of \
  the class:</b> two graduation bonuses.</td></tr></table> <p>Unit Education rolls twice and uses the lower roll. Its \
  result, after Reasoning, is capped at 89, so it never awards honors.</p> <p><b>Preparatory schools</b>, such as \
  junior schools and creches, are for children. They have no fixed length, and the student graduates on reaching the \
  school's upper age limit. A child who rolls under 30 only barely graduates, and gets one level less of skill \
  improvement. Children aged 6 or under always graduate normally.</p> <h2>What Graduates Gain</h2> <p>- \
  <b>Skills:</b> each skill the course teaches is raised to the experience level shown in the course's tooltip. \
  Skills that are already higher are not lowered. Longer and higher-level courses teach to a higher level. <br>- \
  <b>Curriculum XP:</b> some courses teach general knowledge instead of skills, and give the <b>Base XP Rate</b> (3 \
  by default) in XP for each education level taught. <br>- <b>Faculty XP:</b> every student also gains XP from their \
  teachers: <b>(12 - Faculty Skill) x (course days / 600)</b>, rounded to the nearest whole number, at least 1. This \
  is multiplied by <b>Faculty XP Multiplier</b>. Preparatory schools count 300 days for each year the student spent \
  there. Honors add 1 XP or 20%, whichever is more, and top of the class adds 2 XP or 40%. A student who leaves early \
  is credited only for the days they attended. A student whose course is not above their current education level gets \
  just 1 XP, plus any honors bonus. <br>- <b>Education level:</b> raised to the level studied, if that is higher. A \
  civilian graduate who reaches Post-Graduate earns a Master's degree, and one who reaches Doctorate earns the 'Dr' \
  title. <br>- <b>Loyalty:</b> an adult graduate gains Loyalty equal to the course length divided by 300 days \
  (rounded down). Every graduate's Loyalty may also shift by 1: it rises on a d6 roll of 4 or more, and falls on a \
  1.</p> <h2>Graduation Bonuses</h2> <p>Each graduation bonus picks a random part of the course. If it is a skill, \
  the student gains a permanent +1 bonus to it. If the skill already has a bonus, or the course part is curriculum \
  XP, the student gains the Base XP Rate in XP instead. Turn off <b>Enable Graduation Bonuses</b> to make honors and \
  top of the class work like a normal graduation, apart from their extra Faculty XP.</p> <h2>Reeducation Camps</h2> \
  <p>A graduate of a Reeducation Camp has their Loyalty rolled again on 4d6, keeping the highest three dice. If \
  <b>Enable Faction Changes</b> is on, they are also converted to your campaign's faction. Some characters cannot be \
  converted, because of abilities or flaws such as In For Life or Faction Loyalty. They lose 1 Loyalty instead, and \
  keep their old Loyalty score.</p>
EMPLOYER_SUPPORT.title=Employer Support
EMPLOYER_SUPPORT.definition=<p>In <a href='GLOSSARY:STRATCON'>StratCon</a> you have access to a resource called 'Employer \
 Support.' Employer Support represents how willing your employers are to support you at a strategic level. \
 Employer Support is primarily used to reinforce deployed units, and improve the likelihood that reinforcements \
 arrive in a timely manner.</p> \
 <p>The amount of Employer Support available is based on three things: </p>\
 <ul><li><b> <a href='GLOSSARY:FACTION_STANDING_EFFECTS'>Faction Standing</a>:</b> an employer is exponentially more willing to support you the more highly they \
  regard you</li> \
 <li><b>Scale:</b> the larger the contract's Scale, the more Employer Support it can hold. A contract can hold up to \
  three Employer Support per point of Scale.</li> \
 <li><b>Admin:</b> the negotiation for Employer Support is handled by your Admin personnel. If they fail to \
  negotiate well then you don't get support from your employer.</li></ul> \
 <p>Your Admins first negotiate for Employer Support at the beginning of your contract. Your employer's regard \
 for you then adds to, or takes away from, what they negotiated.</p> \
 <p>Throughout the contract, your Admins will continue to roll to replenish your Employer Support, up to the same \
 maximum. These rolls occur every other week, and the number of rolls that your company makes is determined by the \
 number of Admins your company has available. </p> \
 <p>Each month, there is also a 1-in-10 chance of a random event on your contract:</p> \
 <ul><li><b>Bonus Employer Support:</b> your employer grants additional Employer Support equal to the contract's \
  Scale.</li> \
 <li><b>Ronin:</b> a wandering ronin offers to join your company instead of siding with the enemy, in exchange for \
  Employer Support.</li> \
 <li><b>Unit Auction:</b> you can bid Employer Support for a tank, aerospace fighter, or 'Mek. If you win the bid, \
  the unit is obtained at the cost of the Employer Support (Employer Support is refunded if the bid is lost).</li></ul> \
 <p>Employer Support was previously called 'Support Points'. It is unrelated to the Support Points used by the \
 <i>Hot Spots</i> finance rules, such as <a href='GLOSSARY:HOT_SPOTS_UPKEEP'>Hot Spots Upkeep</a>.</p> \
<p style='text-align: center;'><i>"Sir, we did the best we could, but we were unable to secure transportation for reinforcements to the drop \
  location."<br> \
"When will the meks get on site?"<br> \
"Tomorrow, at the earliest" <br> \
 <b>- Mercenary Admin to their Commander</i></b></p>
EMPTY_SYSTEMS.title=Empty Systems
EMPTY_SYSTEMS.definition=Empty or abandoned systems are only visible if the 'Empty Systems' option is enabled in the blue\
 \ display panel. These are systems that have no population and are generally avoided by JumpShip Captains. Becoming\
 \ stranded in one of these systems could be disastrous.\
 <p>Currently, MekHQ doesn't model the dangers of traversing empty systems. However, that will not always be the case\
 \ and players are advised to avoid these systems when possible.</p>
ESCALATION.title=Escalation
ESCALATION.definition=Escalation is a <a href='GLOSSARY:STRATCON'>StratCon</a> contract mechanic, used while the \
  <i>Contracts Use Special Mechanics</i> campaign option is enabled and the contract is run on a StratCon map (not in \
  mapless mode). It is tracked by Assassination, Diversionary Raid, Extraction Raid, Guerrilla Warfare, Objective \
  Raid, Observation Raid, Pirate Raid, Recon Raid, Sabotage, and Black-Ops Insurgency contracts.\
  <p>Escalation measures how hard the enemy is pushing back. It starts at 0, can reach 100 per point of \
  the contract's scale, and never falls. It rises when you:\
  <br>- Deploy a formation to an empty hex (one with no scenario, facility, or Nav Point) and no scenario \
  results: +1.\
  <br>- Win a scenario: +1d6.\
  <br>- Fight at a hostile facility: +2d6 (stacks with winning a scenario).</p>\
  <p>At each <a href='GLOSSARY:MORALE'>morale</a> check, a die with as many sides as the maximum Escalation is \
  rolled. If the roll is equal to or lower than the current Escalation, the enemy's morale rises by one level, on top \
  of whatever the check itself did. You can follow Escalation on the StratCon tab.</p>\
  <p>Some contract types raise Escalation in other ways as well; see each contract type's entry.</p>\
  <p>A Diversionary Raid's strategic objective is to raise Escalation to 50 per point of the contract's scale before \
  the contract ends.</p>\
  <p>Garrison Duty contracts track Escalation the other way around, as the unrest the garrison must calm: it starts \
  at its maximum and only ever falls. Their morale roll also cuts both ways: a roll above the current Escalation \
  lowers the enemy's morale by one level. See <a href='GLOSSARY:MISSION_TYPE_GARRISON_DUTY'>Garrison Duty</a>.</p>
ESSENTIAL_SCENARIOS.title=Essential Scenarios
ESSENTIAL_SCENARIOS.definition=Essential Scenarios are <a href='GLOSSARY:STRATCON'>StratCon</a> scenarios tied to a\
 \ specific <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>Strategic Objective</a>. The Briefing Room marks them as\
 \ <b>(Essential)</b> when they appear.\
 <p>A contract brings one Essential Scenario a month per point of its Scale, rounded normally, each on a random day of\
 \ its month in a random sector. Contracts whose special Nav Points take their place, and contract types with no\
 \ Essential Scenarios of their own, bring none.</p>\
 <p>Winning an Essential Scenario completes its associated objective. Any other result fails that objective.</p>\
 <p>The Essential label identifies a required contract objective. It is separate from\
 \ <a href='GLOSSARY:TURNING_POINTS'>Turning Point</a> and <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> labels, which\
 \ describe effects on <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory Points (CVP)</a>.</p>
EXPERIENCE_COSTS.title=Experience Costs
EXPERIENCE_COSTS.definition=Both the New and Veteran Player presets model their xp costs on <i>A Time of War</i>. These\
  \ costs can be higher than expected if you've played MeKHQ for a long time.\
  <p>In older versions, xp costs were based on <i>Total Warfare</i>, and where Total Warfare was missing information\
  \ (such as for most <a href='GLOSSARY:SKILL_TYPES'>Support Skills</a>), developers came up with their own costs.</p>\
  <p>The costs in <i>Total Warfare</i> are not well suited to MekHQ, as they are designed for very short-lived, in-person\
  \ campaigns. Campaigns where you might fight only a handful of scenarios across the entire campaign. Meanwhile, in\
  \ MekHQ, personnel are expected to fight dozens of scenarios every year.</p>\
  <p>Around 50.03 we made the decision to move to <i>A Time of War</i> for most personnel management. Personnel already\
  \ existed at the scale of <i>A Time of War</i> so this made a lot of sense. The increased XP costs also were a good\
  \ fit for MekHQ as they significantly slowed down player progression. Something that has been a problem for a long\
  \ time. As can be attested to by anyone who's taken an Admin character from Green to Elite in a single garrison contract.</p>\
  <p><b>The Higher Costs Don't Fit My Campaign</b></p>\
  <p>Maybe you prefer the pace of quicker progression, or maybe you don't have time to play and still want to feel like\
  \ you're progressing. Maybe you want progress to be even slower? No matter your reason for changing the XP scale, MekHQ\
  \ has you covered. Head to Campaign Options, Advancement/Awards & Randomization/Experience Awards. There you will see\
  \ an option titled 'Advancement Multiplier.' This is a multiplier applied to <i>all</i> xp costs across MekHQ.</p>\
  <p>Some common picks include:</p>\
  <p>- <b>1.25</b>: all costs are increased by 25%\
  <br>- <b>0.75</b>: all costs are decreased by 25%\
  <br>- <b>0.5</b>: all costs are decreased by 50% (the default for the New Player Preset)\
  <br>- <b>0.25</b>: all costs are decreased by 75%</p>\
  <p>Experiment to find the scale that works for you.</p>
EXPERIENCE_RATING.title=Experience Rating
EXPERIENCE_RATING.definition=Experience Rating is a measure of your campaign's veterancy. MekHQ uses the rules found in\
 \ <b>Campaign Operations</b> to determine this value.\
 <p>Some important things to note:</p>\
 <p>- If your skill milestones (Green, Veteran, etc) differ to those used in Campaign Operations, experience rating\
 \ might not be exactly what you expect. This is because Campaign Operations uses a specific calculation to determine\
 \ experience rating and <b>not</b> the experience level of personnel. By default, both the New Player and Veteran Player\
 \ presets base their skills on <b>A Time of War</b> and not <b>Campaign Operations</b>.\
 <br>- Only combat personnel assigned to <a href='GLOSSARY:COMBAT_TEAMS'>Combat Teams</a> in your\
 \ <a href='GLOSSARY:TOE'>TO&E</a> are factored into this calculation. Combat Teams on the Training\
 \ <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a>, transport carriers, and JumpShips are left out.\
 <br>- Some older MekHQ systems were built around <a href='GLOSSARY:ATB'>Legacy AtB</a>. Legacy AtB used the now outdated\
 \ <b>Field Manual: Mercenaries, revised</b> Unit Rating system. It is impossible to translate\
 \ <a href='GLOSSARY:FORCE_REPUTATION'>Force Reputation</a> into Unit Rating. Therefore, where Unit Rating needs to be used, we use your\
 \ Experience Rating instead. As this is the most comparable metric available.</p>
EXTRA_INCOME.title=Extra Income
EXTRA_INCOME.definition=Extra Income is a type of <a href='GLOSSARY:TRAITS'>Trait</a> that rewards the character\
  \ with additional funds each month. Positive Extra Income means the character gains money, monthly. Negative Extra \
  Income acts as a monthly debit from the character's account.\
  <p>If the character is the designated <b>Campaign Commander</b> then these extra funds are used to modify the \
  campaign finances. Either as a credit (if the Trait is positive) or a debit (if the Trait is negative).</p>\
  <p>If the character is <b>not</b> the designated <b>Campaign Commander</b> then the funds are used to modify their \
  <b>Total Earnings</b> (if total earnings tracking is enabled in <b>Campaign Options</b>). Otherwise, Extra Income \
  has no effect.</p>\
  <p>If the character is a child, they are only affected by their Extra Income Trait if they are also the designated \
  campaign commander.</p>\
  <p>The exact funds gained each month can be found in <b>A Time of War</b>, in the section headed 'Extra Income.' \
  If you have the 'Better Extra Income' campaign option enabled, these values are multiplied by 100.</p>
### F
FACTION_ACCOLADES.title=Faction Accolades
FACTION_ACCOLADES.definition=<p>Factions that think highly of your campaign recognize it with Accolades. Each \
  faction works through the list below in order, one step at a time. You need <a \
  href='GLOSSARY:FACTION_STANDING'>Faction Standing</a> enabled.</p> <p>Each day, every faction you hold Regard with \
  gives its next Accolade if all of the following are true:</p> <p>- It has no active <a \
  href='GLOSSARY:FACTION_CENSURES'>Censure</a> against you. <br>- Your Standing with it, not counting Climate \
  Regard, meets the next Accolade's requirement in the table below. <br>- At least 6 months have passed since its \
  last Accolade. The first Accolade has no wait.</p> <h2>Accolades</h2> \
  <table><tr><th>Accolade</th><th>Standing</th><th>Effect</th></tr> <tr><td>Taking Notice (1)</td><td>6</td><td>A \
  short notice that someone in the faction has noticed you.</td></tr> <tr><td>Taking Notice \
  (2)</td><td>6</td><td>Another notice.</td></tr> <tr><td>Appearing in Searches</td><td>7</td><td>Your senior admin \
  reports that the faction is looking into your campaign.</td></tr> <tr><td>Cash Bonus</td><td>7</td><td>20 million \
  C-bills.</td></tr> <tr><td>Press Recognition</td><td>7</td><td>The faction's media praise your campaign.</td></tr> \
  <tr><td>Cash Bonus</td><td>7</td><td>30 million C-bills.</td></tr> <tr><td>Propaganda Reel</td><td>7</td><td>Your \
  campaign appears in the faction's propaganda.</td></tr> <tr><td>Adoption / 'Meks</td><td>7</td><td>See \
  below.</td></tr> <tr><td>Cash Bonus</td><td>8</td><td>45 million C-bills.</td></tr> <tr><td>Triumph / \
  Remembrance</td><td>8</td><td>The faction celebrates your campaign. For Clans, your commander is entered into the \
  Remembrance.</td></tr> <tr><td>Cash Bonus</td><td>8</td><td>55 million C-bills.</td></tr> <tr><td>Statue / \
  Sibko</td><td>9</td><td>The faction raises a statue of your commander. For Clans, a sibko is decanted from your \
  commander's genes.</td></tr> <tr><td>Cash Bonus</td><td>9</td><td>65 million C-bills.</td></tr> <tr><td>Letter \
  from Head of State</td><td>9</td><td>The faction's leader writes to your commander.</td></tr></table> <h2>Adoption \
  / 'Meks</h2> <p>If the faction is your own, it gives you a company of 'Meks. If it is another faction, it offers \
  the 'Meks if you join it. Accepting means <a href='GLOSSARY:GOING_ROGUE'>Going Rogue</a> to that faction. Each \
  faction makes this offer only once. Factions you can't play as skip this Accolade.</p> <p>Once a playable faction \
  other than your own has reached this Accolade, it gives you no more.</p> <h2>Mercenary Organizations and the \
  Piracy Success Index</h2> <p>These give Accolades only up to Propaganda Reel.</p>
FACTION_CENSURES.title=Faction Censures
FACTION_CENSURES.definition=<p>Censures punish a campaign that has fallen out of favor. Only your own faction issues \
  them. For mercenary campaigns that is the current mercenary organization, and for pirate campaigns the Piracy \
  Success Index (see <a href='GLOSSARY:FACTION_STANDING'>Faction Standing</a>).</p> <h2>When Censures Happen</h2> \
  <p>Each day that your Regard with that faction, including Climate Regard, is below 0, the faction issues a level 1 \
  Censure if it has none. If it already has one, it raises it one level, but only if more than 6 months have passed \
  since the last was issued. Level 5 is the highest.</p> <p>Some Censures wait for the right moment. Those marked \
  <b>No contract</b> below are only issued while you have no active contract, and those marked <b>No transit</b> \
  only while you are on a planet.</p> <p>A Censure expires a year after it was issued and drops one level. The lower \
  level counts as newly issued, so it takes another year to drop again. While a faction has a Censure against you, \
  it gives no <a href='GLOSSARY:FACTION_ACCOLADES'>Accolades</a>.</p> <h2>Censure Levels</h2> <p>The Censure you \
  receive depends on the faction issuing it.</p> <table><tr><th>Level</th><th>Inner \
  Sphere</th><th>Clan</th><th>Mercenary Organization</th><th>Piracy Success Index</th></tr> <tr><td>1</td><td>Formal \
  Warning</td><td>Unsuccessful Trial of Grievance</td><td>Legal Challenge</td><td>Bribe Officials</td></tr> \
  <tr><td>2</td><td>News Article</td><td>Chatterweb Discussion</td><td>News Article</td><td>News Article</td></tr> \
  <tr><td>3</td><td>Forced Retirement</td><td>Successful Trial of Grievance</td><td>Formal Warning</td><td>Commander \
  Imprisoned</td></tr> <tr><td>4</td><td>Leadership Replaced</td><td>Leadership \
  Replaced</td><td>Fined</td><td>Commander Murdered</td></tr> <tr><td>5</td><td>Unit Disbanded</td><td>Unit \
  Disbanded</td><td>Unit Barred</td><td>Leadership Imprisoned</td></tr></table> <h2>Censure Effects</h2> <p>Loyalty \
  changes only apply if <a href='GLOSSARY:LOYALTY'>Loyalty</a> modifiers are enabled. If no one is flagged as the \
  commander, the highest-ranking character counts as the commander, and the next highest as the \
  second-in-command.</p> <table><tr><th>Censure</th><th>Effect</th><th>Timing</th></tr> <tr><td>Formal Warning, \
  Legal Challenge, News Article, Chatterweb Discussion</td><td>Bad publicity. Your personnel lose a little \
  Loyalty.</td><td>Any time</td></tr> <tr><td>Fined, Bribe Officials</td><td>You pay 10% of your current funds. Your \
  personnel lose a little Loyalty.</td><td>Any time</td></tr> <tr><td>Forced Retirement</td><td>Your commander \
  retires.</td><td>No contract</td></tr> <tr><td>Commander Imprisoned</td><td>Your commander is \
  imprisoned.</td><td>No contract, no transit</td></tr> <tr><td>Commander Murdered</td><td>Your second-in-command \
  murders the commander and takes command.</td><td>No contract</td></tr> <tr><td>Unsuccessful Trial of \
  Grievance</td><td>Your commander takes 1-5 hits and the second-in-command 1-6. Either may die of their \
  wounds.</td><td>No contract</td></tr> <tr><td>Successful Trial of Grievance</td><td>Your commander is killed. The \
  second-in-command takes 1-3 hits and takes command.</td><td>No contract</td></tr> <tr><td>Leadership \
  Replaced</td><td>Your personnel lose a lot of Loyalty. The commander, second-in-command and all officers are \
  dishonorably discharged. Each is replaced by a political officer with the same role and rank, Veteran skills and \
  Loyalty of 3d6+2.</td><td>No contract, no transit</td></tr> <tr><td>Leadership Imprisoned</td><td>Your personnel \
  lose a lot of Loyalty. The commander, second-in-command and all officers are imprisoned.</td><td>No contract, no \
  transit</td></tr> <tr><td>Unit Disbanded, Unit Barred</td><td>A closing scene ends your campaign's story. Your \
  save is not changed, and you can keep playing.</td><td>Disbanded: no contract. Barred: any time.</td></tr></table> \
  <h2>Responding</h2> <p>Formal Warning, Legal Challenge, Fined, Bribe Officials, Forced Retirement, Leadership \
  Replaced, Unit Disbanded and Unit Barred let you choose your response. You can accept the Censure, or <a \
  href='GLOSSARY:GOING_ROGUE'>Go Rogue</a> to escape it. Other Censures simply happen.</p> <p>Draconis Combine \
  campaigns can also have their commander commit seppuku. The commander dies and your personnel gain a lot of \
  Loyalty, but the Censure still takes effect.</p> <p>Each Censure you don't escape raises your Regard with your \
  faction by 0.625, or by 1.875 if your commander committed seppuku.</p>
FACTION_REGARD.title=Regard Changes
FACTION_REGARD.definition=<p>Your <a href='GLOSSARY:FACTION_STANDING'>Regard</a> with each faction changes as \
  described below. Every change is multiplied by <b>Regard Gain Multiplier</b>.</p> <h2>Contracts</h2> <p>When you \
  accept a contract, your Regard with the enemy drops. When it ends, your Regard with the employer changes based on \
  the outcome. If the enemy or employer has a covert sponsor, the sponsor takes the change instead.</p> \
  <table><tr><th>Event</th><th>Base Change</th></tr> <tr><td>Accepting a contract against a faction</td><td>-1.875 \
  (-0.9375 against Clans)</td></tr> <tr><td>Success</td><td>+1.875</td></tr> <tr><td>Partial \
  success</td><td>+0.625</td></tr> <tr><td>Failure</td><td>-1.875</td></tr> \
  <tr><td>Breach</td><td>-5.156</td></tr></table> <p>Longer contracts matter more. The base change is multiplied by \
  1 + ln(1 + the square root of (months / 6)). That is about x1.34 for 1 month, x1.69 for 6 months, x1.88 for 12 months and \
  x2.10 for 24 months.</p> <p>Some contract characteristics scale the change. <b>It's Personal</b> (x1.5) and \
  <b>Just Business</b> (x0.5) affect the change with the enemy. <b>Monitored</b> (x1.5) and <b>Unmonitored</b> \
  (x0.5) affect the change with the employer.</p> <p>Mercenary campaigns also apply the employer change to the \
  current mercenary organization, and pirate campaigns apply it to the Piracy Success Index.</p> <h2>Other \
  Changes</h2> <table><tr><th>Event</th><th>Change</th></tr> <tr><td>Refusing a Clan's <a \
  href='GLOSSARY:BATCHALL'>Batchall</a></td><td>-10.31 with that Clan</td></tr> <tr><td>Executing <a \
  href='GLOSSARY:PRISONERS_OF_WAR'>prisoners</a></td><td>-0.1 per prisoner with each prisoner's origin \
  faction</td></tr> <tr><td>Accepting a <a href='GLOSSARY:FACTION_CENSURES'>Censure</a></td><td>+0.625 with your \
  faction</td></tr> <tr><td>Committing seppuku in response to a Censure</td><td>+1.875 with your \
  faction</td></tr></table> <p><a href='GLOSSARY:GOING_ROGUE'>Going Rogue</a> and <a \
  href='GLOSSARY:ULTIMATUMS'>Ultimatums</a> set Regard directly instead. See those entries.</p> <h2>Yearly \
  Decay</h2> <p>On 1 January, your Regard with every faction moves 0.375 towards 0. It never crosses 0.</p> \
  <h2>Climate Regard</h2> <p>On the 1st of each month, each faction's Climate Regard is set from its relationship \
  with your faction. It replaces the previous month's value rather than adding to it.</p> \
  <table><tr><th>Relationship</th><th>Climate Regard</th></tr> <tr><td>Your own faction</td><td>+18.75</td></tr> \
  <tr><td>Allied</td><td>+9.375</td></tr> <tr><td>Rival</td><td>-9.375</td></tr> <tr><td>At \
  war</td><td>-18.75</td></tr></table> <p>If more than one applies, being allied takes priority, then being at \
  war.</p> <p><b>Pirate campaigns:</b> other pirate factions count as allied. Every other faction has -18.75, or \
  -25.78 for Clans.</p> <p><b>Mercenary campaigns:</b> each faction's attitude to mercenaries sets its Climate \
  Regard, unless it is allied with you or at war with you.</p> <table><tr><th>Faction</th><th>Period</th><th>Climate \
  Regard</th></tr> <tr><td>Federated Suns, Lyran Commonwealth</td><td>Until 15 Nov 3062<br>16 Nov 3062 to 20 Apr \
  3067<br>21 Apr 3067 to 3069<br>From 3070</td><td>+6.25<br>-18.75<br>0<br>+6.25</td></tr> <tr><td>Draconis \
  Combine</td><td>Until 3 Sep 3029<br>4 Sep 3029 to 15 Apr 3039<br>16 Apr 3039 to 16 Apr 3049<br>17 Apr 3049 to 14 \
  Sep 3054<br>From 15 Sep 3054</td><td>-18.75<br>-51.56<br>-25.78<br>-18.75<br>0</td></tr> <tr><td>Capellan \
  Confederation</td><td>Until 11 May 3036<br>12 May 3036 to 8 May 3052<br>From 9 May \
  3052</td><td>-18.75<br>-25.78<br>-18.75</td></tr> <tr><td>Free Rasalhague Republic</td><td>23 May 3034 to 23 May \
  3035<br>From 24 May 3035</td><td>-25.78<br>-18.75</td></tr> <tr><td>Taurian Concordat</td><td>Until 1 Aug \
  3058<br>2 Aug 3058 to 3067<br>From 3068</td><td>-18.75<br>0<br>-18.75</td></tr> <tr><td>Magistracy of Canopus, \
  Outworlds Alliance</td><td>Always</td><td>+6.25</td></tr> <tr><td>Clan Diamond Shark</td><td>From 1 Dec \
  3075</td><td>-18.75</td></tr> <tr><td>Other Clans</td><td>Always</td><td>-25.78</td></tr> <tr><td>Everyone \
  else</td><td>Always</td><td>0</td></tr></table>
FACTION_STANDING.title=Faction Standing
FACTION_STANDING.definition=<p>Faction Standing tracks how each faction regards your campaign. Turn it on with \
  <b>Enable Faction Standing</b> in Campaign Options (Operations, Systems, Faction Standing). To see your standings, \
  use the <b>Faction Standing Report</b> button on the Command Center tab.</p> <h2>Regard</h2> <p>Each faction holds \
  a <b>Regard</b> value for your campaign, starting at 0. Regard with your own faction can range from -60 to +60, \
  but Regard with other factions can't rise above +40. Your actions raise or lower it (see <a \
  href='GLOSSARY:FACTION_REGARD'>Regard Changes</a>).</p> <p>Each faction also has a <b>Climate Regard</b>, set on \
  the 1st of each month from the political situation. It is added to your Regard for everything except <a \
  href='GLOSSARY:FACTION_ACCOLADES'>Accolades</a>, and the total is kept between -60 and +60. If <b>Enable Verbose \
  Climate Regard</b> is on, each faction's Climate Regard is listed in the daily log every month.</p> <p><b>Regard \
  Gain Multiplier</b> (default 1.0) multiplies every Regard change, including yearly decay and Climate Regard. \
  Faction Standing is designed to change slowly over many years. Raise the multiplier to speed it up.</p> \
  <h2>Standing Levels</h2> <p>Your Regard with a faction sets your Standing with it, shown as 1 to 9 stars. A Regard \
  exactly on a boundary counts as the lower Standing.</p> <table><tr><th>Standing</th><th>Regard</th></tr> \
  <tr><td>1</td><td>-60 to -50</td></tr> <tr><td>2</td><td>-50 to -40</td></tr> <tr><td>3</td><td>-40 to \
  -25</td></tr> <tr><td>4</td><td>-25 to -10</td></tr> <tr><td>5</td><td>-10 to 10</td></tr> <tr><td>6</td><td>10 to \
  25</td></tr> <tr><td>7</td><td>25 to 40</td></tr> <tr><td>8</td><td>40 to 50</td></tr> <tr><td>9</td><td>50 to \
  60</td></tr></table> <p>Because Regard with other factions stops at +40, Standings 8 and 9 are normally only \
  possible with your own faction, unless Climate Regard lifts you higher. What each Standing does is described in <a \
  href='GLOSSARY:FACTION_STANDING_EFFECTS'>Standing Effects</a>.</p> <h2>Special Factions</h2> <p>Factions that \
  stand for many separate groups, such as Mercenaries, Pirates and Independents, aren't tracked. Instead:</p> <p>- \
  <b>Mercenary campaigns</b> gain and lose Regard with the mercenary organization of the time: the Mercenary Guild \
  (until 2788), the Mercenary Review Board (2789 to 3051), the Mercenary Review and Bonding Commission (3052 to \
  3132) and the Mercenary Bonding Authority (from 3133). <br>- <b>Pirate campaigns</b> gain and lose Regard with the \
  <b>Piracy Success Index</b>, which measures how successful, and so how notorious, you are.</p> <p>For these \
  campaigns, the organization takes the place of your own faction when it comes to Censures.</p> <h2>Judgments and \
  Changing Sides</h2> <p>Factions that think highly of you may award <a \
  href='GLOSSARY:FACTION_ACCOLADES'>Accolades</a>, while your own faction punishes failure with <a \
  href='GLOSSARY:FACTION_CENSURES'>Censures</a>. You can change faction by <a href='GLOSSARY:GOING_ROGUE'>Going \
  Rogue</a>, and history may force you to pick a side through an <a href='GLOSSARY:ULTIMATUMS'>Ultimatum</a>.</p> \
  <h2>Enabling Mid-Campaign</h2> <p>If you enable Faction Standing in an existing campaign, all Regard is reset and \
  then rebuilt from your contract history. Past contracts are applied in order, with yearly decay between years.</p>
FACTION_STANDING_EFFECTS.title=Standing Effects
FACTION_STANDING_EFFECTS.definition=<p>Your <a href='GLOSSARY:FACTION_STANDING'>Standing</a> with a faction changes \
  how it treats you. Each effect below has its own option under Standing Effects in Campaign Options (Operations, \
  Systems, Faction Standing). They are all on by default, but none apply unless <b>Enable Faction Standing</b> is \
  on. Every effect uses your Regard including Climate Regard.</p> \
  <table><tr><th>Standing</th><th>Negotiation</th><th>Contract Pay</th><th>Resupply</th><th>Unit Market</th></tr> \
  <tr><td>1</td><td>-4</td><td>x0.6</td><td>x0</td><td>-3</td></tr> \
  <tr><td>2</td><td>-3</td><td>x0.7</td><td>x0.25</td><td>-2</td></tr> \
  <tr><td>3</td><td>-2</td><td>x0.8</td><td>x0.5</td><td>-1</td></tr> \
  <tr><td>4</td><td>-1</td><td>x0.9</td><td>x0.75</td><td>0</td></tr> \
  <tr><td>5</td><td>0</td><td>x1</td><td>x1</td><td>0</td></tr> \
  <tr><td>6</td><td>+1</td><td>x1.05</td><td>x1.25</td><td>0</td></tr> \
  <tr><td>7</td><td>+2</td><td>x1.1</td><td>x1.5</td><td>+1</td></tr> \
  <tr><td>8</td><td>+3</td><td>x1.15</td><td>x1.75</td><td>+2</td></tr> \
  <tr><td>9</td><td>+4</td><td>x1.2</td><td>x2</td><td>+3</td></tr></table> <table><tr><th>Standing</th><th>Employer \
  Support (start / later)</th><th>Food &amp; Housing</th><th>Recruitment Tickets</th><th>Recruit Rolls</th></tr> \
  <tr><td>1</td><td>-2 / -4</td><td>x3</td><td>x0</td><td>x0</td></tr> <tr><td>2</td><td>-1 / \
  -3</td><td>x2</td><td>x0</td><td>x0.25</td></tr> <tr><td>3</td><td>-1 / \
  -2</td><td>x1.75</td><td>x1</td><td>x0.5</td></tr> <tr><td>4</td><td>0 / \
  -1</td><td>x1.5</td><td>x2</td><td>x0.75</td></tr> <tr><td>5</td><td>0 / \
  0</td><td>x1</td><td>x3</td><td>x1</td></tr> <tr><td>6</td><td>0 / \
  +1</td><td>x1</td><td>x4</td><td>x1.25</td></tr> <tr><td>7</td><td>+1 / \
  +1</td><td>x0.85</td><td>x5</td><td>x1.5</td></tr> <tr><td>8</td><td>+1 / \
  +2</td><td>x0.8</td><td>x10</td><td>x1.75</td></tr> <tr><td>9</td><td>+2 / \
  +3</td><td>x0.75</td><td>x15</td><td>x2</td></tr></table> <h2>Options</h2> <p>- <b>Standing Affects \
  Negotiations:</b> when you re-negotiate a contract, the value modifies your negotiator's Negotiation check, using \
  your Standing with the employer. A positive value makes the check easier. This needs <b>Active Negotiators</b> to \
  be enabled. <br>- <b>Standing Affects Contract Pay:</b> a contract's monthly pay is multiplied by your Standing \
  with the employer when its pay is set. <br>- <b>Standings Affects Resupplies:</b> each <a \
  href='GLOSSARY:RESUPPLY'>Resupply</a> is multiplied by your Standing with the employer. It never drops below the \
  minimum Resupply size. <br>- <b>Standing Affects Employer Support:</b> when a contract starts, you gain the start \
  value times the contract's Scale in <a href='GLOSSARY:EMPLOYER_SUPPORT'>Employer Support</a> (or lose it, if \
  negative). In each later negotiation, the later value is a bonus (or penalty) to each Admin check. <br>- \
  <b>Standing Affects the Unit Market:</b> the value is added to the rarity rolls for the Employer Market part of \
  the <a href='GLOSSARY:UNIT_MARKET_TYPES'>Unit Market</a>. Higher values mean more units. <br>- <b>Standing Affects Food &amp; Housing:</b> while you are on \
  a planet, food and housing costs are multiplied by your best Standing with the employers of your contracts in that \
  system. If you have no contract there, your best Standing with the system's factions is used instead. <br>- \
  <b>Standings Affects Recruitment:</b> changes how many applicants each faction sends (see <a \
  href='GLOSSARY:APPLICANT_ORIGINS'>Applicant Origins</a>) and how many recruit rolls you get (see <a \
  href='GLOSSARY:RECRUIT_ROLLS'>Recruit Rolls</a>). <br>- <b>Enable Batchall Restrictions:</b> at Standing 1 or 2, a \
  Clan won't offer you a <a href='GLOSSARY:BATCHALL'>Batchall</a>. Pirate and Bandit Caste campaigns are always \
  offered one. <br>- <b>Enable Command Circuit:</b> at Standing 8 or 9 with the employer of an active or upcoming \
  contract, you can use that faction's Command Circuit. Your JumpShips then spend at most 10 hours recharging at \
  each jump point. <br>- <b>Enable Outlawing:</b> at Standing 1 or 2, a faction outlaws you from its systems. You \
  can't travel to or through a system if you are outlawed by the faction you are best regarded by among those that \
  hold it. Systems that are empty, unclaimed, or held by the employer or enemy of one of your contracts are always \
  open, and you can always leave a system you are outlawed in. You also can't enter systems held only by factions at \
  war with yours. The Interstellar Map marks the systems closed to you.</p>
FAME.title=Fame
FAME.definition=Fame is a type of <a href='GLOSSARY:TRAITS'>Trait</a> that measures how well known, and how well regarded, a character is. It \
  ranges from -5 (infamous) to +5 (celebrated).\
  <h2>Social Skills</h2>\
  <p>A character's Fame is applied directly as a modifier to their <b>Negotiation</b>, <b>Protocols</b>, and \
  <b>Streetwise</b> skills. If the character has the 'Alternate ID' SPA, negative Fame is improved by up to 2 points \
  when using these skills, but can never become positive this way.</p>\
  <h2>Personal Reputation</h2>\
  <p>Fame is added to the character's personal reputation. The 'Don't You Know Who I Am?' SPA increases this \
  contribution by 25%, while 'Certified Nobody' reduces it by 25%.</p>\
  <h2>Force Reputation (CamOps Reputation)</h2>\
  <p>If the campaign commander has positive Fame, the Commander Rating portion of \
  <a href='GLOSSARY:FORCE_REPUTATION'>Force Reputation</a> gains 1 point. Negative Fame costs 1 point instead.</p>\
  <h2>Modifiers</h2>\
  <p>- <b>Racism:</b> -1\
  <br>- <b>Pathologic Racism:</b> -2\
  <br>- <b>Xenophobia:</b> -1\
  <br>- <b>Revealed Dark Secrets</b> may also reduce Fame.</p>\
  <p>In Clan campaigns, if <a href='GLOSSARY:AGING'>Aging</a> effects are enabled, warriors aged 31 or older lose \
  Fame. Earning a Bloodname or reaching a rank appropriate to their age reduces or removes the penalty.</p>\
  <p>Fame can be raised or lowered by spending XP from the character's right-click menu.</p>
FATIGUE.title=Fatigue
FATIGUE.definition=Fatigue measures how physically and mentally worn out a character is. It is tracked if \
  <b>Enable Fatigue</b> is turned on in Campaign Options (Turnover and Retention, Fatigue). While it is turned off, \
  characters don't gain Fatigue and nothing on this page applies.\
  <h1>Fatigue Values</h1>\
  <p>Every character has three Fatigue values:</p>\
  <ul><li><b>Fatigue:</b> the character's current Fatigue, from 0 to 30. This is what goes up and recovers over \
  time.</li>\
  <li><b>Permanent Fatigue:</b> Fatigue that never recovers, gained from some implants and prosthetics (see below).</li>\
  <li><b>Effective Fatigue:</b> the value used by every Fatigue rule. It is Fatigue, +2 for the Dobrowski \
  Depression-A Syndrome flaw, plus any Permanent Fatigue, with the following modifiers:\
  <br>- <b>Clan personnel:</b> -2\
  <br>- <b>Veteran:</b> -1\
  <br>- <b>Elite, Heroic, or Legendary:</b> -2\
  <br>Effective Fatigue can be negative.</li></ul>\
  <p>Effective Fatigue is shown in the Fatigue column of the Personnel tab and on the character's sheet. Characters \
  with an Effective Fatigue of 5 or more are highlighted in personnel tables (the colors can be changed in MekHQ \
  Options).</p>\
  <h1>Gaining Fatigue</h1>\
  <p>Most Fatigue gains are multiplied by the <b>Fatigue Rate</b> campaign option (default 1), shown as <i>Rate</i> \
  below.</p>\
  <ul><li><b>Scenarios:</b> +Rate for every character who took part and survived.</li>\
  <li><b>StratCon deployment:</b> +Rate for the crew of every unit in a formation that is deployed to the \
  <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a> and reveals at least one unexplored hex. This only \
  happens once per deployment, no matter how many hexes are revealed.</li>\
  <li><b>StratCon reinforcements:</b> +Rate for the crew of every unit in a reinforcing formation that evades \
  interception.</li>\
  <li><b>StratCon sieges:</b> +Rate each Monday for the crew of every unit in a besieging formation (see \
  <a href='GLOSSARY:STRATCON_SIEGES'>Sieges</a>).</li>\
  <li><b>Training Combat Teams:</b> +Rate each Monday for every active crew member (trainers and trainees) of a \
  deployed <a href='GLOSSARY:TRAINING_COMBAT_TEAMS'>Training Combat Team</a>.</li>\
  <li><b>Injuries:</b> if <b>Injuries Increase Fatigue</b> is enabled, +Rate for every hit of injury suffered, \
  whether from scenarios, salvage accidents, random events, escape attempts, or assassination attempts. This uses \
  the number of hits before Glass Jaw or Toughness are applied, and isn't affected by the Fatigue multiplier below.</li>\
  <li><b>Healing:</b> with <a href='GLOSSARY:ALT_ADVANCED_MEDICAL'>Alternate Advanced Medical</a>, any healing check \
  with a margin of success of 2 or less adds d6 x Rate.</li>\
  <li><b>Random events:</b> some events raise (or lower) the Fatigue of one or more characters. Characters with Poison \
  Resistance are immune to poisoning.</li>\
  <li><b>Transit Disorientation Syndrome:</b> characters with this flaw gain +Rate each time the campaign jumps.</li>\
  <li><b>Discontinuation Syndrome:</b> characters with an addiction who go without their fix and fail to resist gain \
  +2 x Rate each week.</li></ul>\
  <h2>Fatigue Multiplier</h2>\
  <p>Unless stated otherwise above, Fatigue gains are multiplied by the character's Fatigue multiplier. This starts \
  at x1 and is modified by:</p>\
  <ul><li><b>Glass Jaw</b> (Flaw): +1</li>\
  <li><b>Toughness</b> (SPA): -1</li>\
  <li><b>Unfit</b> (Flaw): +1</li>\
  <li><b>Fit</b> (SPA): -1</li></ul>\
  <p>Glass Jaw and Toughness cancel each other out, as do Fit and Unfit. If the multiplier ends up at 0 it becomes \
  x0.5, and if it ends up below 0 it becomes x0.25. Results are rounded down, but a character always gains at least \
  1 Fatigue. The multiplier never affects recovery.</p>\
  <h2>Permanent Fatigue</h2>\
  <p>With Alternate Advanced Medical, characters gain 1 Permanent Fatigue on 1 January of certain years:</p>\
  <ul><li><b>Enhanced Imaging implant:</b> every year (every 3rd year for Aerospace phenotypes)</li>\
  <li><b>Standard VDNI:</b> every 2nd year</li>\
  <li><b>Buffered VDNI:</b> every 3rd year</li>\
  <li><b>Three or more advanced prosthetics:</b> every 3rd year</li></ul>\
  <h1>Recovering From Fatigue</h1>\
  <p>Every Monday, characters who aren't MIA recover Fatigue:</p>\
  <ul><li><b>Base:</b> 1</li>\
  <li><b>On Leave, or the campaign has no active contracts:</b> +1 (these don't stack)</li>\
  <li><b>Field Kitchens within capacity:</b> +1</li></ul>\
  <p>Permanent Fatigue never recovers.</p>\
  <h2>Field Kitchens</h2>\
  <p>Field Kitchens only matter while the campaign is on contract and planetside. At all other times, the Field \
  Kitchen bonus always applies.</p>\
  <p><b>Capacity:</b> each <a href='GLOSSARY:FIELD_KITCHENS'>Field Kitchen</a> serves a number of personnel equal to \
  the <b>Field Kitchen Capacity</b> campaign option (default 150). A kitchen only counts if its unit is in your \
  <a href='GLOSSARY:TOE'>TO&E</a>, fully crewed, undamaged, and not deployed to a scenario. Each Field Kitchen rented \
  when negotiating a contract adds 150 capacity while that contract is active.</p>\
  <p><b>Demand:</b> every active member of the campaign (excluding prisoners and camp followers), plus any temporary \
  crew. If <b>Ignore Non-Combatants</b> is enabled (default), non-combatants don't count. Crew of DropShips, \
  JumpShips, WarShips, Space Stations, and Small Craft don't count either, as these feed their own crews.</p>\
  <p>Current capacity and demand are shown in the Facility Capacities section of the Command Center.</p>\
  <h1>Effects of Fatigue</h1>\
  <h2>Fatigue States</h2>\
  <p>Whenever a character gains Fatigue, a report is added to the Daily Log if their Effective Fatigue is high \
  enough:</p>\
  <ul><li><b>5 to 8:</b> Tired</li>\
  <li><b>9 to 11:</b> Badly Fatigued</li>\
  <li><b>12 to 16:</b> Exhausted</li>\
  <li><b>17 or more:</b> Critically Fatigued</li></ul>\
  <p>Once a character is Tired or worse, they are treated as recovering from Fatigue. A report is added once their \
  Fatigue has returned to 0.</p>\
  <h2>Automatic Leave</h2>\
  <p>If a character's Effective Fatigue reaches the <b>Automatic Leave Threshold</b> campaign option (default 13), \
  they are sent on Leave. This only happens to active, free characters who aren't deployed or injured. They return \
  to active duty once their Fatigue has returned to 0. Set the threshold to 0 to disable this.</p>\
  <h2>Automatic Undeployment (StratCon)</h2>\
  <p>Each Monday, if at least half (rounded up) of the units in a <a href='GLOSSARY:COMBAT_TEAMS'>Combat Team</a> \
  deployed to the Area of Operations have a crew member with an Effective Fatigue at or above the <b>Automatic \
  Undeployment Threshold</b> campaign option (default 9), the Combat Team is withdrawn from the Area of Operations. \
  Combat Teams deployed to a scenario are not withdrawn. Set the threshold to 0 to disable this.</p>\
  <h2>Turnover</h2>\
  <p>If <b>Fatigue Modifiers</b> is enabled in the Turnover campaign options (default), Effective Fatigue increases \
  the character's <a href='GLOSSARY:TURNOVER'>Turnover</a> target number:</p>\
  <ul><li><b>0 to 8:</b> +0</li>\
  <li><b>9 to 12:</b> +1</li>\
  <li><b>13 to 16:</b> +2</li>\
  <li><b>17 or more:</b> +3</li></ul>\
  <h2>Scenarios</h2>\
  <p>When a unit is sent into a scenario, the highest Effective Fatigue among its crew is applied to the unit's \
  crew in MegaMek. This only has an effect if <b>TacOps Fatigue</b> is enabled in MegaMek's game options, in which \
  case crews start suffering fatigue penalties sooner in long battles: 1 turn sooner at 5 to 8 Fatigue, 2 turns at \
  9 to 12, 3 turns at 13 to 16, and 4 turns at 17 or more.</p>\
  <h2>Salvage</h2>\
  <p>When planning salvage operations, techs with an Effective Fatigue of 5 or more are flagged as fatigued.</p>
FIELD_CONTROL.title=Field Control Explanation
FIELD_CONTROL.definition=At the end of a <a href='GLOSSARY:STRATCON'>StratCon</a> scenario, you are going to be asked\
  \ whether you retain control of the field. This determines whether you are able to salvage the field and recover any\
  \ lost units or crew. Each scenario has field control predetermined depending on the strategic context of that scenario.\
 <p>While it might be tempting to always declare field control whenever you kill all enemies on the field, you are\
 \ strongly discouraged from doing so. Just because you have killed all immediate threats, it doesn't mean there aren't\
 \ other hostile formations waiting off-screen. In StratCon, the strategic maneuvering of formations and battlelines is abstracted,\
 \ so the greater narrative context of the scenario needs to be taken into consideration.</p>\
 <p>Alternatively, if you would prefer a game design justification: MekHQ's economics is fragile and easily broken by\
 \ an endless flow of salvage.</p>
FIELD_KITCHENS.title=Field Kitchens
FIELD_KITCHENS.definition=Field Kitchens are a special type of equipment found on some vehicles, usually Support Vehicles.\
 \ While on contract and planetside, if your Field Kitchens can serve all of your personnel, everyone recovers an\
 \ additional point of <a href='GLOSSARY:FATIGUE'>Fatigue</a> each week. See the Fatigue entry for how capacity and\
 \ demand are calculated. Unlike Campaign Operations, you are not required to assign Field Kitchens to specific\
 \ formations in your <a href='GLOSSARY:TOE'>TO&E</a> (for now).\
 <p>However, the Field Kitchen-equipped unit must meet these criteria:</p>\
 <p>- It needs to be fully crewed. Most Field Kitchen-equipped units are Support Vehicles, which means they need additional\
 \ crew beyond just drivers and gunners. You can check what <a href='GLOSSARY:VEHICLE_CREWS'>crew</a> you are missing\
  \ in the Hangar tab.\
 <br>- It needs to be fully repaired. No serving burgers out of a busted-up van.\
 <br>- It can't be deployed to a scenario.\
 <br>- It needs to be placed in your TO&E. Ideally, you will want to assign the formation you place it in as a\
 \ <a href='GLOSSARY:FORCE_TYPE_SUPPORT'>Support Force</a>. This tells MekHQ that the formation isn't a\
 \ <a href='GLOSSARY:FORCE_TYPE_COMBAT'>Combat Force</a>.</p>\
 <p>Sometimes you may need to advance to the next day for MekHQ to recognize your Field Kitchen-equipped unit.</p>\
 <p>Field Kitchens can also be rented when negotiating a contract, if enabled in Campaign Options. Each rented Field\
 \ Kitchen provides 150 capacity while that contract is active.</p>
FORCE_GENERATION.title=StratCon Force Generation
FORCE_GENERATION.definition=<a href='GLOSSARY:STRATCON'>StratCon</a> uses two formation generation methods: the \
  default Force Generation 3 (FG3) and the older Force Generation 2.5 (FG2.5). This entry provides a brief overview \
  of both systems.<p>Force generation is a complex topic. This glossary entry is meant as a summary, not a \
  step-by-step description of the exact process used by MekHQ.</p><h1>Force Generation 2.5 (FG2.5)</h1><p>Under \
  FG2.5, each NPC formation is given a BV2 budget. This budget is based on the formations listed in your <a \
  href='GLOSSARY:TOE'>TO&E</a>. The stronger your units and crews, the higher the BV2 budget assigned to NPC \
  formations. Veteran MekHQ players may recognize this system from older StratCon versions and <a \
  href='GLOSSARY:ATB'>Against the Bot</a>, though FG2.5 includes some minor improvements.</p><p>Ignoring external \
  modifiers, NPC formations will generally be <i>roughly</i> balanced against your own. In practice, factors such as \
  <a href='GLOSSARY:STRATCON_FACILITIES'>Facilities</a> mean that BV2 values between your formation and the OpFor \
  will rarely match exactly.</p><p>FG2.5 has several downsides that FG3 attempts to address. The two most \
  significant are:</p><blockquote> <b>- No Sense of Progression:</b> Improving your units or crews provides little \
  long-term benefit. Better equipment or elite pilots simply increase the BV2 budget of the opposing \
  formation.<br><b>- OpFor Size:</b> MekHQ balances scenarios by spawning more units. When you field high-BV \
  formations against poorly equipped or underskilled enemies, the OpFor can become enormous. Conversely, highly \
  skilled and well-equipped OpFors may appear in tiny numbers. As player formations grow stronger over time while \
  many OpFors remain static, this often turns scenarios into long, exhausting slogs.</blockquote><p>That said, FG2.5 \
  is not without appeal. Some players prefer a universe that scales to them, allowing them to accept almost any \
  contract and expect a reasonably fair fight. Choosing between FG2.5 and FG3 largely comes down to personal \
  preference.</p><h1>Force Generation 3 (FG3)</h1>If FG2.5 presents a universe that scales to your campaign, FG3 \
  offers the opposite: an unscaled experience.<p>FG3 uses <a href='GLOSSARY:GENERIC_BATTLE_VALUE'>Generic Battle \
  Value (GBV)</a> to determine formation strength. In this system, pilot skill and equipment quality are key factors \
  in how challenging a contract will be.</p><p>As with FG2.5, NPC formations receive a BV budget based on your TO&E. \
  The difference is that FG3 uses GBV instead of BV2. This means above-average pilots or advanced equipment do not \
  inflate enemy strength. The same logic applies in reverse: stronger opponents generate stronger formations, while \
  weaker opponents generate easier encounters.</p><p>The downside is typical of any unscaled system. Some contracts \
  are simply unwinnable. A starting company with early-tech Inner Sphere units and green pilots will never be able \
  to defeat a Heroic-rated frontline Clan formation.</p><p>The upside is a strong sense of progression. As your \
  pilots improve and your equipment advances, contracts that were once impossible gradually become achievable. <a \
  href='GLOSSARY:CHALLENGE_SKULLS'>Contract Challenge Skulls</a> were introduced to help players estimate contract \
  difficulty.</p> <h1>Difficulty</h1><p>Whichever method you use, the <b>Difficulty</b> option, in the General \
  Options section of the StratCon General page, scales every enemy force. Both its BV budget and its number of units \
  are multiplied by:</p><table><tr><th>Difficulty</th><th>Enemy Forces</th></tr> \
  <tr><td>Ultra-Green</td><td>50%</td></tr> <tr><td>Green</td><td>75%</td></tr> \
  <tr><td>Regular</td><td>100%</td></tr> <tr><td>Veteran</td><td>125%</td></tr> <tr><td>Elite</td><td>150%</td></tr> \
  <tr><td>Heroic</td><td>175%</td></tr> <tr><td>Legendary</td><td>200%</td></tr></table><p>Difficulty does not \
  change how skilled or well-equipped the enemy is, which comes from the contract. Allied forces are unaffected, and \
  so are the raiders who attack your <a href='GLOSSARY:RESUPPLY_CONVOYS'>convoys</a>, who are always sized against \
  the convoy itself. New players are recommended to start on Green or Ultra-Green.</p><p>Forces added by <a \
  href='GLOSSARY:STRATCON_SCENARIO_MODIFIERS'>Scenario Modifiers</a> come on top of this, including support from \
  enemy <a href='GLOSSARY:STRATCON_FACILITIES'>Facilities</a>.</p>
FORCE_REPUTATION.title=Force Reputation
FORCE_REPUTATION.definition=Reputation reflects how well-known your unit is and whether others trust your\
 \ ability to complete missions.\
  <p>There are two main types of Reputation: <b>Chaos Campaign</b> and <b>Campaign Operations</b>. Campaign \
  Operations Reputation was the default in MekHQ up until 51.01. Now Chaos Campaign Reputation is the default.</p>\
  <p>Campaign Operations Reputation is very complex and has been implemented following the official rules. Please see\
  \ the official Campaign Operations manual for more information.</p>\
  <p>Chaos Campaign Reputation is less complex. At time of writing the current rules can be found in <i>Hot Spots \
  Draconis Reach</i>. MekHQ's implementation largely follows rules-as-written, albeit with some adjustments.</p>\
  <h2>Personnel Reputation</h2>\
  Like CamOps Reputation before it, Chaos Reputation is calculated at the force level. However, in 51.01 we \
  introduced the ability to split your forces. To account for this change, Chaos Reputation was split into two types: \
  <b>Personnel Reputation</b> and <b>Campaign Reputation</b>.\
  <p>With <b>Personnel Reputation</b> all personnel in your campaign have an individual Reputation score. The force's\
  \ Reputation is the average of all personnel in that force. Certain characteristics affect a person's Reputation: \
  base reputation, crime, fame, connections, and some SPAs.</p>\
  <p>In <b>Campaign Reputation</b>, Reputation is a static value stored at the campaign level. The Reputation of \
  individual characters is ignored. Only crime and base reputation are used to determine the Reputation of a force. \
  Campaign Reputation is the closest to rules-as-written, but is a bad fit for MekHQ. It is recommended that you use \
  Personnel Reputation unless you are trying to run a strictly rules-as-written campaign.</p>\
  <h2>Why Isn't CamOps Reputation the Default?</h2>\
  In 51.01 we introduced the ability to split your forces. This change has been requested for over a decade, but \
  doesn't come without its own set of challenges. The most notable is that the rules for calculating Reputation. \
  CamOps was never written with split forces in mind.\
  <p>When we attempted to adapt CamOps Rep for split campaigns, the problems were numerous. The main issue was \
  the ability to form and disband Detachments at will. This essentially meant there was no way to reasonably persist \
  Reputation. This is in addition to the sheer expense of running CamOps Rep calculations multiple times (once per \
  Detachment).</p>\
  <p>Imagine, if you will, one detachment commits a crime, and then you disband that Detachment. Poof there goes all \
  record of the crime. What about the detachments' successes and failures? The detachment is dissolved, so too are the\
  \ reputational history of its past deeds.</p>\
  <p>You might think, why not just have it at the campaign level and ignore Detachments? Well, then you run into the \
  issue of being able to rocket towards high-end Reputation at record pace. The more detachments you have, the faster\
  \ your progression. If you have just three Detachments, suddenly your rep is rising at 300% speed.</p>\
  <p>In 2025, we fixed a bug with CamOps Rep that was incorrectly reducing the contract pay bonuses from a high rep. \
  This immediately resulted in campaigns being flooded in multi-billion C-Bill contracts. This resulted in us adding \
  the sanity check Campaign Options that exist to this day. If you're suddenly able to progress at breakneck speeds, \
  our ability to sanity check Reputation will be impossible.</p>\
  <p>The logical next step is to split Rep. So some stuff is at the Detachment level, some is global. Alrighty, which\
  \ should be which? Because many of the different elements build off each other. And how do you track that when \
  Detachments are transitory things that can be dissolved at any time?</p>\
  <p>Ultimately, none of the above has any clear answer. And a lot of thought was put into how best to solve the \
  problem. We were straight up looking at ancient FASA manuals to see if there might be a solution there. Chaos \
  Campaign Reputation was chosen because it's simplified nature makes it far easier to compute at scale.</p>\
  <p>Furthermore, it allows us to track it as a person-level. So Reputation stops being a campaign thing and becomes \
  a person thing. As a detachment does stuff, it affects the reputation of the personnel in that detachment. If the \
  detachment dissolves, the people still have their rep.</p>\
  <p>This could never be possible with CamOp Reputation.</p>
FORCE_SCALE.title=Force Scale
FORCE_SCALE.definition=<p>Scale is the <i>Hot Spots: Draconis Reach</i> measure of how large a force is. Many of the \
  Hot Spots finance rules, and a good deal of <a href='GLOSSARY:STRATCON'>StratCon</a>, are based on it.</p>\
  <p>There are two kinds of Scale, both worked out the same way. <b>Company Scale</b> measures your whole \
  <a href='GLOSSARY:TOE'>TO&E</a> and is shown in the Command Summary panel. <b>Contract Scale</b> measures the force \
  you commit to a contract and is shown in the Intel section of the contract's dossier.</p>\
  <p><b>How Scale Is Calculated</b></p>\
  <ol><li>Take the Battle Value (BV) of every unit that counts (see below) and add them together.</li>\
  <li>Divide the total by the BV needed per point of Scale. By default this is <b>20,500</b>: 4,500 BV plus 32 \
  Battlefield Support Points (BSP) at 500 BV each. If <i>Factor BSP into Scale Calculations</i> is disabled in Campaign \
  Options, it is just <b>4,500</b>.</li></ol>\
  <p>For example, a force with 41,000 BV is exactly Scale 2 by default, or Scale 9.11 if BSP are not factored in.</p>\
  <p><b>Which Units Count</b></p>\
  <p>Both kinds of Scale count the same units: every unit assigned to a \
  <a href='GLOSSARY:FORCE_TYPE_COMBAT'>Combat Forces</a> formation with the Frontline or Maneuver \
  <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a>. Mothballed units never count. Company Scale is refreshed each day; \
  Contract Scale is the force you commit to the contract.</p>\
  <p>Units that are not assigned to a formation never count, and neither do formations with any other role (Patrol, \
  Training, Auxiliary or Reserve). Patrol is a combat role in other parts of MekHQ, but it does not count toward \
  Scale.</p>\
  <p><b>Whole Scale and Fractional Scale</b></p>\
  <p>The calculation gives an exact, fractional number. Most rules use a <b>whole Scale</b> instead: the exact value \
  rounded to the nearest whole number (2.49 is Scale 2, 2.5 is Scale 3). Any force at all is at least Scale 1, and \
  no force at all is Scale 0.</p>\
  <p>With the unofficial <i>Fractional Scale</i> option, money and supplies use the exact value instead (never less \
  than 0.1), so pay, upkeep, salvage, resupply and looting change gradually as your force grows rather than jumping a \
  full point. This covers Base Pay, combat pay, transport pay, salvage, Hot Spots Upkeep, resupply drops and pirate \
  looting. Everything that <i>counts</i> things, such as facilities, track rolls, victory points and Employer Support, \
  always uses the whole number. Scale is displayed to two decimal places.</p>\
  <p><b>Setting a Contract's Scale</b></p>\
  <p>Contract Scale is worked out when the contract is generated, from the units you have committed at that point. A \
  GM can also set it by hand in the contract editor. The unofficial <i>Cap Contract Scale by Hiring Hall</i> rule \
  (see below) can lower it.</p>\
  <p><b>Where Scale Is Used: Money and Supplies</b></p>\
  <ul><li><a href='GLOSSARY:HOT_SPOTS_UPKEEP'>Hot Spots Upkeep</a> costs 500 Support Points per point of Company \
  Scale each month.</li>\
  <li>Contract Base Pay is 500 Support Points per point of Contract Scale if <i>Base Pay Only Considers Scale</i> is \
  enabled. Otherwise it covers your running costs, shared out by Scale if the contract was capped.</li>\
  <li>Combat pay is based on 500 Support Points per point of Contract Scale a month, spread across the combat \
  bonuses the contract brings each month, so the extra Essential Scenarios a larger contract brings do not inflate \
  the contract's total combat pay. Contracts whose Nav Points replace their Essential Scenarios bring three times as \
  many bonuses, so each pays about a third as much.</li>\
  <li>The size of each <a href='GLOSSARY:RESUPPLY'>Resupply</a> drop is limited in proportion to Contract Scale.</li>\
  <li>Pirate looting, for contracts with that special rule, is sized by Contract Scale.</li></ul>\
  <p><b>Where Scale Is Used: Contracts and StratCon</b></p>\
  <ul><li><b>Scenario frequency:</b> each month brings one <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential \
  Scenario</a>, three Nav Points (for contracts that use them), one attack on your side's facilities and, with \
  Facility Operations, one party of enemy engineers per point of Scale. Each week, normal scenarios are rolled for \
  once per point of Scale against a random sector's threat. All are rounded normally. Here Scale is counted with \
  battlefield support points factored in; without that option, every three points of Scale count as one.</li>\
  <li><b>Victory points:</b> the <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory Points</a> needed to win \
  grow with Scale.</li>\
  <li><b>Employer Support:</b> a contract can hold three \
  <a href='GLOSSARY:EMPLOYER_SUPPORT'>Employer Support</a> per point of Scale. The random bonus Employer Support \
  event grants an amount equal to Scale, and the effect of Faction Standing at the start of a contract is multiplied \
  by it.</li>\
  <li><b>Facilities:</b> Scale sets the tier, and the number, of the \
  <a href='GLOSSARY:STRATCON_FACILITIES'>facilities</a> placed on a contract's map. Facilities are Outposts up to \
  Scale 2, Bases up to Scale 5 and Strongholds beyond that, and objective facilities are one tier larger. When BSP are \
  not factored into Scale, Scale is divided by three first. Larger Scale also means more facilities and more \
  <a href='GLOSSARY:STRATCON_ENEMY_ENGINEERS'>enemy engineers</a>.</li>\
  <li><b>Intel:</b> the number of pieces of intel that lead to a real facility or target is limited by Scale.</li>\
  <li><b>Escalation:</b> a contract's maximum <a href='GLOSSARY:ESCALATION'>Escalation</a> is 100 per point of \
  Scale, and a Diversionary Raid objective needs 50 per point.</li>\
  <li><b>Two Consecutive Tracks:</b> a contract with this special rule ends once your tally of track results reaches \
  +2 or -2 per point of Scale.</li></ul>\
  <p><b>Limiting Growth (Unofficial)</b></p>\
  <p>Large forces can snowball: bigger contracts pay more, which buys more units, which unlocks bigger contracts. \
  Three optional rules push back against this. All are off by default.</p>\
  <ul><li><b>Cap Contract Scale by Hiring Hall:</b> the Scale of generated contracts is capped by the \
  <a href='GLOSSARY:HIRING_HALLS'>Hiring Hall</a> in your current system: A has no cap, B caps at 8, C at 6, D at 4 \
  and F at 2. When a contract is capped, cost-based Base Pay is reduced to match.</li>\
  <li><b>Diminishing Combat Pay & Salvage by Scale:</b> combat pay and salvage rights are paid in full up to Scale 3. \
  Each point of Scale beyond that is worth half. A Scale 7 contract pays combat pay as though it were Scale 5, and \
  its salvage rights are reduced to 5/7 of normal. The salvage reduction is fixed when the contract is signed.</li>\
  <li><b>Escalating Hot Spots Upkeep:</b> upkeep increases by 5% for each point of Company Scale above 4.</li></ul>
FORCE_TYPE_COMBAT.title=Combat Forces
FORCE_TYPE_COMBAT.definition=This is the default formation type.\
 <p>A combat formation is one meant for general combat and is the only type of <a href='GLOSSARY:COMBAT_TEAMS'>Combat Team</a>\
 \ that is considered when determining contract pay.</p>\
 <p>If you have a <a href='GLOSSARY:DIGITAL_GM'>Digital GM</a> enabled, formations marked as Combat Forces may be drawn\
 \ into scenarios. ensure you reassign any formations you don't want fighting.</p>
FORCE_TYPE_CONVOY.title=Convoy Forces
FORCE_TYPE_CONVOY.definition=These formations perform logistical support, generally behind the front lines, running\
  \ supplies and keeping front-line formations stocked up. Units in Convoy Forces do not count towards the size of\
  \ your <a href='GLOSSARY:RESUPPLY_CONTENTS'>Resupplies</a>.\
  <p>If <a href='GLOSSARY:STRATCON'>StratCon</a> is enabled, while on contract you can use your Convoy Forces to\
  \ collect monthly <a href='GLOSSARY:RESUPPLY'>Resupplies</a>, which makes them four times larger. Be careful when\
  \ building your convoys: every 50 tons above 200 tons raises the chance the enemy will intercept them, and every 50\
  \ tons below lowers it. See <a href='GLOSSARY:RESUPPLY_CONVOYS'>Resupply Convoys</a>.</p>
FORCE_TYPE_SECURITY.title=Security Forces
FORCE_TYPE_SECURITY.definition=Forces assigned to Security duties guard your\
  \ <a href='GLOSSARY:PRISONERS_OF_WAR'>prisoners</a>. If the <i>Campaign Operations</i> or <i>MekHQ</i> capture\
  \ styles are enabled in campaign options, units assigned to Security Forces provide the campaign's\
  \ <a href='GLOSSARY:PRISONER_CAPACITY'>Prisoner Capacity</a>, and their leaders present\
  \ <a href='GLOSSARY:PRISONER_EVENTS'>Prisoner Events</a>.
FORCE_TYPE_SUPPORT.title=Support Forces
FORCE_TYPE_SUPPORT.definition=A Support Force is any formation not typically <a href='GLOSSARY:HOW_TO_DEPLOY'>deployed</a>\
 \ in combat scenarios. This classification is ideal for units like support vehicles, civilians, or other formations that\
 \ belong in the <a href='GLOSSARY:TOE'>TO&E</a> but aren't meant to fight.\
 <p>If <a href='GLOSSARY:STRATCON'>StratCon</a> is enabled, Support Forces are rarely used as a \
  <a href='GLOSSARY:SEED_FORCES'>Seed Force</a>, making them a useful classification for logistical or non-combat \
  units.</p>\
 <p>You should consider placing any DropShips and JumpShips into Support Forces unless you have enough Aerospace assets\
 \ to protect them. This represents you keeping these valuable vessels away from the fighting rather than risking them\
 \ close to hostile territory.</p>
FORCE_TYPE_SALVAGE.title=Salvage Forces
FORCE_TYPE_SALVAGE.definition=A Salvage Force is any formation not typically <a href='GLOSSARY:HOW_TO_DEPLOY'>deployed</a>\
 \ in combat scenarios. Instead, they are assigned to scenarios during the deployment stage and perform salvage \
  operations once it has concluded.\
  <p>For an idea of what makes a good salvage formation, check the Salvage rules in <i>Campaign Operations</i>.</p>
### G
GARRISON_RAIDS.title=Garrison Raids
GARRISON_RAIDS.definition=Garrison-type contracts - <a href='GLOSSARY:MISSION_TYPE_GARRISON_DUTY'>Garrison Duty</a>, \
  <a href='GLOSSARY:MISSION_TYPE_CADRE_DUTY'>Cadre Duty</a>, \
  <a href='GLOSSARY:MISSION_TYPE_SECURITY_DUTY'>Security Duty</a>, \
  <a href='GLOSSARY:MISSION_TYPE_RIOT_DUTY'>Riot Duty</a>, and \
  <a href='GLOSSARY:MISSION_TYPE_RETAINER'>Retainer</a> contracts - follow a raid model. The enemy is not always in \
  the Area of Operations: most months the contract is <b>Peaceful</b>, and only now and then does the enemy raid.\
  <p>These contracts begin Peaceful. On the first of each month:\
  <br>- If the enemy raided over the past month, the usual <a href='GLOSSARY:MORALE'>morale</a> check is made \
  first (followed, on a Garrison Duty contract, by its <a href='GLOSSARY:ESCALATION'>Escalation</a> roll). After a \
  Peaceful month there is no check: with no fighting, there is nothing to test the enemy's morale against.\
  <br>- Then there is a 1 in 4 chance the enemy raids during the coming month. Otherwise, the contract is Peaceful.</p>\
  <p>A raiding enemy returns at whatever morale it held at the end of its last raid, so how you fared in one raid \
  carries over to the next. The enemy is always the same, decided when the contract is generated. Your employer's \
  liaison warns you when a raid begins. As these contracts receive no <a href='GLOSSARY:BATCHALL'>Batchall</a> when \
  they begin, a Clan enemy that follows the custom issues one when it first raids instead.</p>\
  <p>While a contract is Peaceful, there is no enemy activity in the Area of Operations: the morale bar reads \
  "Peaceful", and there are no scenarios when you deploy, no weekly scenarios, no \
  <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>, and no Deployment Orders. Reinforcements and \
  convoys are never intercepted, the enemy sends no raiders against your supply routes and no engineers to build \
  facilities, and the contract is never chosen for an intel breach. Other points of interest still appear, and civil \
  unrest can still break out, as it does not answer to the enemy.</p>\
  <p>When the employer invokes an emergency extension (which also raises the enemy's morale), the peace ends at \
  once, and the enemy raids every month for the rest of the contract. If the enemy had not raided yet, this counts as \
  its first raid, and brings its Batchall.</p>\
  <p>See also <a href='GLOSSARY:MORALE'>Morale</a> and <a href='GLOSSARY:MORALE_EFFECTS'>Morale Effects</a>.</p>
GENERIC_BATTLE_VALUE.title=Generic Battle Value
GENERIC_BATTLE_VALUE.definition=Generic Battle Value, an alternative to BV2, assigns the same value to all units of \
  the same type and weight, which may not align with their BV2. The calculation of GBV, derived from the average BV2 \
  of units with similar weight and type, is beyond the scope of this explanation.\
  <p>For example, if the GBV of a 55t BattleMek is 1,500 (example only), then <b>all</b> 55t BattleMeks will have a GBV \
  value of 1,500. It doesn't matter if the unit is a half-repaired rust bucket that still remembers the Amaris Civil\
  \ War, or a mixed tech ilClan hangar princess. If the unit is a 55t BattleMek, its GBV is <b>always</b> 1,500.</p>\
  <p>GBV deliberately does not factor in any modifiers, such as C3, pilot skill, or ammunition.</p>\
  <p>While this means that two formations, when generated using GBV, will rarely be balanced according to their BV2, this \
  is by design. The magic of GBV is that a formation with better pilots and better equipment will be more powerful than \
  another formation with poor pilots and equipment. An elite Clan OpFor, for example, will present a widely different \
  challenge than a band of happy-go-lucky pirates.</p>
GENETIC_LEGACY.title=Genetic Legacy
GENETIC_LEGACY.definition=A <a href='GLOSSARY:BLOODNAME'>Bloodnamed</a> warrior's DNA may be taken into their \
  Clan's breeding program to produce sibkos - batches of trueborn siblings raised together.\
  <p>A <b>genefather</b> is a warrior whose DNA is used in the sperm; a <b>genemother</b> is one whose DNA is used \
  in the egg. Neither role follows from the warrior's own sex, since Clan scientists can implant the DNA of either \
  sex into either cell. A woman may be a genefather and a man a genemother.</p>\
  <p>The distinction carries a rule with it: a trueborn may only compete for the Bloodname of their genemother. \
  That is what a warrior's <a href='GLOSSARY:BLOODHOUSE'>Bloodhouse</a> records.</p>\
  <p>Winning a Bloodname makes a legacy eligible rather than used. Most Bloodnamed warriors are never drawn on. \
  Capturing a warrior does not capture their legacy - see <a href='GLOSSARY:ISORLA'>Isorla</a>.</p>
GOING_ROGUE.title=Going Rogue
GOING_ROGUE.definition=<p>Going Rogue means leaving your faction for another. You can do it at any time with the \
  <b>Change Faction</b> button on the Command Center tab, or in response to a <a \
  href='GLOSSARY:FACTION_CENSURES'>Censure</a>. <a href='GLOSSARY:FACTION_ACCOLADES'>Accolades</a> and <a \
  href='GLOSSARY:ULTIMATUMS'>Ultimatums</a> can also lead to it. Changing your faction in Campaign Options skips \
  everything below.</p> <h2>Where You Can Go</h2> <p>You can always become Mercenaries or Pirates, unless you \
  already are. Other campaigns can also join any faction you can play as. Before the Battle of Tukayyid, though, \
  Inner Sphere campaigns can't join Clans and Clan campaigns can't join Inner Sphere factions.</p> <p>Mercenary and \
  pirate campaigns can only join a faction that has offered them Adoption (see Accolades), has no Censure against \
  them, and holds at least 0 Regard for them.</p> <h2>What Happens</h2> <p>If <a \
  href='GLOSSARY:FACTION_STANDING'>Faction Standing</a> is enabled:</p> <p>- Your Regard with your old faction drops \
  to -50, if it was higher. <br>- Your Regard with your new faction rises to +10, if it was lower. <br>- Your \
  personnel decide whether to follow you. Your commander and second-in-command always do, and children and \
  dependents don't roll. Everyone else rolls 2d6 and leaves (deserts) if the roll is below 6. If <a \
  href='GLOSSARY:LOYALTY'>Loyalty</a> modifiers are enabled, their Loyalty modifier is added to the 6.</p> <p>If you \
  move between two real factions (not Mercenaries, Pirates or the like), it counts as a <b>defection</b>, and the \
  old faction strikes back:</p> <p>- Characters with a political role are murdered. <br>- Characters who fail their \
  roll are murdered instead of deserting. <br>- Characters who pass still have a 1 in 10 chance of being \
  murdered.</p> <p>Spouses and adult children share each character's fate. Young children desert with a deserting \
  parent. Otherwise, they lose a lot of Loyalty.</p> <p>Whether or not Faction Standing is enabled, everyone who \
  stays gains a lot of Loyalty (if Loyalty modifiers are enabled).</p>
GOLDEN_HELLO.title=Golden Hello
GOLDEN_HELLO.definition=<p>A Golden Hello is a large signing bonus, offered through the <b>Offer Golden Hello</b> \
  checkbox at the foot of the <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a>. Only the MekHQ <a \
  href='GLOSSARY:RECRUITMENT_STYLES'>Recruitment Style</a> offers it.</p> <p>The offer is made to the next set of \
  applicants, not to those already on the board: an applicant keeps the terms that were on offer when they arrived. \
  While it is on offer:</p> <ul> <li>More experienced applicants are willing to join. The gap their <a \
  href='GLOSSARY:SHOW_OF_INTEREST'>Show of Interest</a> allows closes by one experience level.</li> <li>Each \
  applicant costs 22 months of their salary more to hire, on top of whatever recruiting them would normally cost. \
  That is 24 months in all when the normal cost is two months' salary. The Golden Hello is charged even if you don't \
  otherwise pay for recruitment. See <a href='GLOSSARY:HIRING_COSTS'>Hiring Costs</a>.</li> </ul> <p>The bonus is \
  only paid when you hire someone, so offering it costs nothing until you recruit.</p>
GROUP_BY_UNIT.title=Group by Unit
GROUP_BY_UNIT.definition=Group by Unit is an option in the Personnel Tab that can reduce how many personnel are visible\
 \ at any given time. This option hides all crews of multi-personnel units <i>except</i> the unit commander. Deselect\
 \ the option to show them again.
GM_MODE.title=GM Mode
GM_MODE.definition=<p>GM Mode unlocks actions that sidestep the rules: adding things for free, finishing work at \
  once and editing almost anything. It is meant for game masters, and for players setting up a campaign or putting \
  right something that went wrong.</p>\
  <p>Turn it on or off with the <b>GM Mode</b> button at the top right of the main window. Campaigns built from the \
  Campaign Operations, Tabula Rasa and Arcade Mode presets start with it on.</p>\
  <h2>What It Unlocks</h2>\
  <p>GM actions are labelled <i>(GM)</i>, or sit in a <b>GM Mode</b> submenu when you right-click. Among them:</p>\
  <p>- <b>Buying:</b> Add (GM) in the purchase dialogs and the Unit Market adds units and parts at no cost. \
  Right-clicking the procurement list procures or adds items immediately. Units and parts still in transit can be \
  delivered at once. See <a href='GLOSSARY:BUYING_UNITS_AND_PARTS'>Buying Units and Parts</a>.\
  <br>- <b>Recruiting:</b> <i>Marketplace &gt; Recruitment (GM)</i> and <i>Bulk Recruitment (GM)</i> add people \
  directly. The Personnel Market gains Recruit (GM) and Add Applicant (GM).\
  <br>- <b>Hangar:</b> remove, strip or restore a unit, edit its damage, set its quality, undeploy it, or add its \
  minimum crew at a chosen experience level. Mothballing and activation finish at once, and <i>Customize &gt; \
  Complete Refit (GM)</i> finishes a refit.\
  <br>- <b>Personnel:</b> edit a person, their XP, Edge, injuries, family and roleplay details. Education stages can \
  be completed at once.\
  <br>- <b>Finances:</b> Add Transaction (GM) and Manage Assets (GM) in the Finances tab.\
  <br>- <b>Contracts:</b> the Contract Market can generate new offers, create or edit a contract, or start a \
  <a href='GLOSSARY:SHELL_CONTRACTS'>shell contract</a>.\
  <br>- <b>Scenarios:</b> the Briefing Room gains [GM] Add a StratCon Scenario and Reset Deployment, and \
  scenarios can be removed. See <a href='GLOSSARY:MANUAL_SCENARIOS'>Manual Scenarios</a>.\
  <br>- <b>StratCon:</b> the Area of Operations shows a GM Tools panel for scouting, terrain, sectors, Employer \
  Support and CVP. Facilities can be added, removed or handed to the other side, and \
  <a href='GLOSSARY:HOW_TO_REINFORCE'>reinforcements</a> are free and always arrive.\
  <br>- <b>Travel:</b> right-click the interstellar map to move straight to a planet, recharge your JumpShips' \
  drives, or edit a system.\
  <br>- <b>Manage Campaign &gt; GM Tools Dialog</b> holds further tools.</p>\
  <p>Turn GM Mode off when you're done, so that you don't use a GM action by accident.</p>
### H
HIRING_COSTS.title=Hiring Costs
HIRING_COSTS.definition=<p>Hiring an applicant from the <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a> is \
  paid from your funds when you recruit them, and recorded in your finances as a signing bonus. The market's dossier \
  shows each applicant's cost and how it is made up.</p> <h2>Recruitment Cost</h2> <p>Every <a \
  href='GLOSSARY:RECRUITMENT_STYLES'>Recruitment Style</a> charges what paying for recruitment would. This is set by \
  the <b>Recruitment (FM:Mr)</b> payment option, on the Finances General page of Campaign Options.</p> <ul> <li>If \
  the option is off, hiring costs nothing.</li> <li>If it is on, an applicant costs <b>two months of their \
  salary</b>.</li> <li>If it is on and either skill or SPA training costs C-bills, applicants are instead priced by \
  their training: see <a href='GLOSSARY:TRAINING_COSTS'>Training Costs</a>.</li> </ul> <h2>Golden Hello</h2> <p>Under \
  the MekHQ style, if a <a href='GLOSSARY:GOLDEN_HELLO'>Golden Hello</a> was on offer when the applicant arrived, 22 \
  more months of their salary are added. You chose to offer it, so it is charged even when the recruitment payment \
  option is off.</p> <h2>Recruiting</h2> <p>When you recruit several applicants at once, all of them are hired only \
  if your funds cover the total; otherwise nobody is hired. The cost is only paid once: recruiting from the market \
  never charges the recruitment payment a second time. In GM mode, <b>Recruit (GM)</b> hires for free. Once hired, \
  recruits are paid their normal monthly salary.</p>
HIRING_HALLS.title=Hiring Halls
HIRING_HALLS.definition=<p>Hiring Halls are the planets where mercenaries find work. Each is rated from A to F, as in \
  <i>Hot Spots: Draconis Reach</i>. The rating is shown next to the Hiring Hall's name, for example 'Standard (B)'.</p>\
  <ul><li><b>Great (A)</b></li><li><b>Standard (B)</b></li><li><b>Minor (C)</b></li>\
  <li><b>Questionable (D)</b></li><li><b>None (F)</b></li></ul>\
  <p><b>Planetary Cost Reductions</b></p>\
  <p>If enabled in Campaign Options, on the Finances General page, well-equipped worlds make repairs and refits \
  cheaper. While you are on a planet with an A or B rating these costs are halved. On a C-rated planet they are \
  reduced to 75%. D and F rated planets give no reduction, and nor does being in space.</p>\
  <p>By default the reduction only applies while you are off contract. Two further options extend it: one applies it \
  while on contract, and one applies it to <a href='GLOSSARY:MAINTENANCE'>Maintenance</a> costs (maintenance is only \
  ever reduced while off contract).</p>\
  <p>Hiring Hall ratings can also cap the size of the contracts you are offered. See \
  <a href='GLOSSARY:FORCE_SCALE'>Force Scale</a>.</p>
HOSPITAL_BEDS.title=Doctor & MASH Theater Capacity
HOSPITAL_BEDS.definition=Doctor Capacity reflects the maximum number of injured personnel that may be tended to at any\
 \ given time. By default, this is 25 patients per Doctor. However, that may be changed in Campaign Options.\
 <p>In Campaign Options, There's an option for Doctors to use the <i>Administration</i> skill. If enabled, the number\
 \ of patients each Doctor can support is adjusted depending on their <i>Administration</i> skill. No \
  <i>Administration</i> skill means the Doctor can support only 10 patients. With Ultra-Green allowing them to support\
  \ 15 patients, 20 for Green, 25 for Regular, 30 for Veteran, 35 for Elite, 40 for Heroic, and 45 for Legendary.</p>\
  <p>Also, in Campaign Options, there is an option to enable <i>MASH Theater Tracking</i>. If enabled, your maximum \
  number of concurrent patients is limited by the number of MASH Theaters in your TO&E. To count, a unit must be \
  fully crewed, undamaged, and not deployed to a scenario. Each MASH Theater a unit carries counts, and large vessels \
  carry their own: a DropShip or JumpShip counts as one MASH Theater, a WarShip as two, and a space station as \
  three. Hospital beds rented when negotiating a contract add to this capacity while that contract is active. By \
  default, the number of patients supported by a single MASH Theater is 25. However, that can also be changed in \
  Campaign Options.</p>\
  <p>If you have both <i>MASH Theater Tracking</i> and <i>Administration</i> enabled, the total number of patients \
  supported is equal to the total bed capacity across all doctors <b>or</b> the capacity provided by the MASH \
  Theaters. Whichever is smaller.</p>
HOT_SPOTS_UPKEEP.title=Hot Spots Upkeep
HOT_SPOTS_UPKEEP.definition=<p>Hot Spots Upkeep is an optional rule from <i>Hot Spots: Draconis Reach</i>. It is \
  enabled in Campaign Options, on the Finances General page.</p>\
  <p>Upkeep replaces several of MekHQ's separate running costs with one monthly bill. While it is enabled, \
  <a href='GLOSSARY:MAINTENANCE'>Maintenance</a>, overhead and peacetime costs are not charged, and their options \
  cannot be enabled. Salaries, repairs and other costs are still charged as normal.</p>\
  <p>On the first of each month you pay 500 <i>Hot Spots</i> Support Points for each point of \
  your company's <a href='GLOSSARY:FORCE_SCALE'>Scale</a>, whether or not you are on contract. Upkeep follows your \
  Support Point conversion options, so it is normally paid in C-bills at 10,000 C-bills per Support Point.</p>\
  <p><b>Escalating Upkeep (Unofficial)</b></p>\
  <p>If Escalating Hot Spots Upkeep is also enabled, upkeep increases by 5% for each point of Scale above 4. This makes \
  very large forces more expensive to run.</p>
HOW_TO_DEPLOY.title=How to Deploy to a Scenario
HOW_TO_DEPLOY.definition=Deploying to a scenario is different depending on whether it is a\
 \ <a href='GLOSSARY:STRATCON'>StratCon</a> scenario or not (StratCon scenarios are any scenario that appears in the\
 \ <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a> Tab).\
 <p>- <b>StratCon Scenario:</b> navigate to the AO and right-click on the chosen scenario (ensure you're on the\
 \ right Sector). Select 'Manage Deployment' and pick the formation you would like to deploy. Only formations assigned to\
 \ <a href='GLOSSARY:COMBAT_ROLES'>Combat Roles</a> may be deployed in this manner.\
 <br>- <b>Non-StratCon Scenario:</b> head to your <a href='GLOSSARY:TOE'>TO&E</a> and right-click on the formation you\
 \ would like to deploy. In the right-click menu, There's going to be an option to deploy the formation, select that followed\
  \ by the scenario you wish to deploy to.</p>
HOW_TO_REINFORCE.title=How to Reinforce a Scenario
HOW_TO_REINFORCE.definition=<p>When a fight in <a href='GLOSSARY:STRATCON'>StratCon</a> is going badly, you can \
  send more <a href='GLOSSARY:COMBAT_TEAMS'>Combat Teams</a> into it. You don't have to fight every scenario, \
  though: sometimes it is better to let the enemy win a small fight and save your strength.</p>\
  <h2>Sending Reinforcements</h2>\
  <p>Right-click the scenario in the <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a> and choose \
  <b>Manage Reinforcements</b>, then pick the Combat Teams to send. A Combat Team can't reinforce if it is deployed \
  on another contract's map, and you need at least 1 <a href='GLOSSARY:EMPLOYER_SUPPORT'>Employer Support</a> to \
  reinforce at all.</p>\
  <p>Each Combat Team costs 1 Employer Support, or 2 if you choose <b>Reinforce Instantly</b>. You can spend extra \
  Employer Support on each Combat Team to make the <a href='GLOSSARY:REINFORCEMENT_CHECKS'>Reinforcement Check</a> \
  easier: each extra point lowers the target number by 2. The dialog shows the target number and the chance of \
  success before you commit.</p>\
  <p>In GM Mode, you can reinforce for free with automatic success.</p>\
  <h2>What Happens Next</h2>\
  <p>Each Combat Team makes a <a href='GLOSSARY:REINFORCEMENT_CHECKS'>Reinforcement Check</a>. Depending on the \
  result, it arrives on time, arrives late, never arrives, or is intercepted and drawn into a fight of its own. How \
  long it takes to reach the battlefield is covered in \
  <a href='GLOSSARY:REINFORCEMENT_ARRIVAL'>Reinforcement Arrival</a>.</p>
HR_STRAIN.title=HR Strain
HR_STRAIN.definition=HR Strain reflects the extra paperwork and management effort needed for larger\
 \ campaigns. Your campaign's <b>HR Capacity</b> comes from adding up the <i>Administration</i> skill of\
 \ all personnel with the <i>Admin</i> role, multiplied by the value set in the <i>HR Capacity</i>\
 \ campaign option (<b>Default:</b> 10). Even low-skilled <i>Admin</i> staff help keep things running smoothly.\
 <p><b>HR STRAIN</b></p>\
 <p>Each person typically adds 1 point of HR Strain unless noted below.</p>\
 <p><b>Civilians:</b> For civilians (those with <i>Dependent</i> or <i>None</i> as their primary role), divide the total\
 \ by 10 (rounded normally).</p>\
 <p><b>AsTechs and Medics:</b> Characters with only the AsTech or Medic role don't add to HR Strain since\
 \ their team leader is expected to manage them.</p>\
 <p><b>Temporary Crews:</b> each member of a <a href='GLOSSARY:TEMP_CREWS'>temporary crew</a> pool adds 1 point.</p>\
 <p><b>TURNOVER PENALTY</b></p>\
 <p>The penalty to the <a href='GLOSSARY:TURNOVER'>Turnover</a> target number from HR Strain is equal to\
 \ total <i>HR Strain</i> divided by total <i>HR Capacity</i>, rounded down. So there is no penalty until your\
 \ strain reaches your capacity, +1 once it does, +2 at double capacity, and so on. There's no cap to this penalty,\
 \ so it can quickly spiral out of control.</p>\
 <p>A campaign with no Administration skill among its Admin staff has no HR Capacity at all, and suffers a flat\
 \ +10 penalty instead.</p>\
 <p>There are no benefits to having extra <i>HR Capacity</i>.</p>\
 <p>See <a href='GLOSSARY:TURNOVER_MODIFIERS'>Turnover Modifiers</a> for everything else that changes the\
 \ turnover target number.</p>
### I
INFANTRY_GUNNERY_SKILLS.title=Infantry Gunnery Skills
INFANTRY_GUNNERY_SKILLS.definition=While MekHQ does not model the exact skills required to use individual infantry \
  weapons, we allow players to simulate that, should they wish.\
  <p>For Conventional Infantry skill calculations, each soldier will use their best skill from the following list:</p>\
  <p>- Archery\
  <br>- Demolitions\
  <br>- Martial Arts\
  <br>- Melee Weapons\
  <br>- Small Arms\
  <br>- Support Weapons\
  <br>- Thrown Weapons</p>\
  <p>Admittedly, this does allow you to create rifle-armed platoons, where snipers use the power of Kung-Fu to \
  defeat their enemies. Whether you want to pick more suitable skills for those soldiers is left to your discretion.</p>
### J
ISORLA.title=Isorla
ISORLA.definition=Isorla is the spoils of a Trial - materiel, territory, and people taken by the victor. A warrior \
  taken this way may be made a bondsman and, in time, raised back to warrior status in their captor's Clan.\
  <p>Such a warrior keeps the right to compete for their own <a href='GLOSSARY:BLOODNAME'>Bloodname</a>. Eva of the \
  Hordwons, taken from Clan Ice Hellion by Clan Wolf during the Harvest Trials, travelled back to the Homeworlds in \
  3066 and won hers.</p>\
  <p>Crucially, taking the warrior does not take the legacy. The Clan that bred the name keeps the sole right to \
  breed from it no matter whose ranks its holders serve in. Jake Kabrinski was adopted by the Hell's Horses while \
  Kabrinski stayed exclusive to the Ghost Bears; Jal Steiner served Clan Nova Cat while Steiner stayed exclusive to \
  the Cloud Cobras. Acquiring the legacy itself requires a \
  <a href='GLOSSARY:TRIAL_OF_POSSESSION'>Trial of Possession</a>.</p>
JUMP_COST_CALCULATIONS.title=Jump Cost Calculations
JUMP_COST_CALCULATIONS.definition=While traveling, you are generally required to pay to transport your units, cargo, \
  and personnel. This can be disabled in campaign options, but it is enabled by default in all stock presets.\
  <p>To calculate the cost of a jump, MekHQ first determines what can be transported by your existing assets. It \
  then uses the following process to verify the cost to transport any excess:</p>\
  <p><b>Step 1: Transporting Units</b></p>\
  <p>Excess units are broken into the following categories. This tells us how many bays of each type you need to \
  hire:</p>\
  <p>- Small Craft\
  <br>- 'Meks\
  <br>- Fighters (Aerospace or Conventional)\
  <br>- Super Heavy Vehicles\
  <br>- Heavy Vehicles\
  <br>- Light Vehicles\
  <br>- ProtoMeks\
  <br>- Infantry\
  <br>- Battle Armor\
  <br>- Other (priced as 'Meks)</p>\
  <p>We then use the abstract values listed on page 10 of <i>Campaign Operations</i> to determine the cost of each \
  bay. As MekHQ charges per day, rather than per week (or month), the CamOps values are divided appropriately.</p>\
  <p><b>Step 2: Transporting Passengers</b></p>\
  <p>With units calculated, we next tally up how many passengers need to be transported. Passengers are any personnel \
  that are traveling with the unit (including Camp Followers) that have not been assigned to a unit. Each passenger \
  bay can transport 15 passengers. This value was reached by dividing the number of passengers that can be \
  transported by a Princess Luxury Liner (the only canon passenger DropShip) by 14 (the number of bays in a Union \
  DropShip). Passenger bays are priced according to the cost for infantry platoons listed in CamOps.</p>\
  <p>To work out how many DropShips we need to hire to transport your units and passengers, we divide the total \
  number of required bays by 14. The number of bays in a standard Union DropShip.</p>\
  <p><b>Step 3: Transporting Cargo</b></p>\
  <p>Next, we total any excess cargo that needs to be transported (including mothballed units) and divide this value \
  by 1,874.5 (the cargo capacity of a cargo Union DropShip). This gives us the total number of cargo DropShips you \
  need to hire. Unlike the CamOps values for cargo transport, MekHQ charges by the ton. Therefore, the cargo values \
  shown in CamOps are divided by 1,200.</p>\
  <p><b>Step 4: Renting JumpShip Collars</b></p>\
  <p>The number of DropShips we need to hire dictates how many JumpShip collars need to be hired. The cost of hiring \
  a collar is listed in CamOps.</p>\
  <p><b>Step 5: Total Cost</b></p>\
  <p>Once all the costs have been calculated, we add them together to get the total cost of each day of transit.</p>
### K
### L
LEADERSHIP_UNITS.title=Leadership Units
LEADERSHIP_UNITS.definition=When <a href='GLOSSARY:HOW_TO_DEPLOY'>deploying</a> to a scenario in <a href='GLOSSARY:STRATCON'>StratCon</a>,\
 \ if the leader of the first formation to deploy has ranks in the <i>Leadership</i> skill, and that force is \
  assigned to the Frontline <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a> they can deploy Leadership Units.\
 \ Leadership Units do not need to match the deploying formation's unit type: a ground formation can bring almost\
 \ any kind of unit, including fighters and DropShips. The one exception is aerospace formations, which can only\
 \ bring aerospace units. Leadership Units must come from an <b>Auxiliary</b> Combat Team on the same contract,\
 \ and must fit within a BV budget. Each level in <i>Leadership</i> (up to a maximum of 5) adds 500 BV to the budget. Leadership Units are not\
 \ available in official challenge scenarios.\
 <p>It is worth noting that when picking units, only their base BV is considered; therefore, it doesn't factor in\
 \ pilot skills.</p>
LINKED_ATTRIBUTES.title=Linked Attributes
LINKED_ATTRIBUTES.definition=<p>In <i>A Time of War</i>, each skill has one or two Linked Attributes. The \
  character's score in each one gives a modifier to that skill's Target Number, and the modifiers from both \
  attributes are added together.</p>\
  <table><tr><th>Attribute Score</th><th>Modifier</th></tr> <tr><td>0</td><td>-4</td></tr> \
  <tr><td>1</td><td>-2</td></tr> <tr><td>2-3</td><td>-1</td></tr> <tr><td>4-6</td><td>0</td></tr> \
  <tr><td>7-9</td><td>+1</td></tr> <tr><td>10</td><td>+2</td></tr></table>\
  <p>A positive modifier makes the skill easier to use, and a negative one makes it harder. For example, a skill \
  linked to Reflexes and Dexterity, used by a character with Reflexes 7 and Dexterity 3, gets +1 and -1, for a \
  total of 0.</p>\
  <p>The score used is the adjusted one, after <a href='GLOSSARY:AGING'>Aging</a>, injuries and SPAs. Each \
  skill's tooltip lists its Linked Attributes. See <a href='GLOSSARY:ATTRIBUTE_SCORES'>Attribute Scores</a> for \
  how scores are generated.</p>
LOYALTY.title=Loyalty
LOYALTY.definition=<p>Loyalty measures how committed a character is to your campaign. Its main effect is on \
  <a href='GLOSSARY:TURNOVER'>Turnover</a>, and it is only used if <b>Loyalty</b> is enabled under the turnover \
  modifiers in Campaign Options (Human Resources, Turnover & Retention, Turnover).</p>\
  <h2>Loyalty Score</h2>\
  <p>New characters roll 3d6 for their Loyalty score. Ultra-Green characters add 2, and Green characters add \
  1.</p>\
  <p>- <b>Prisoners</b> roll 4d6 and drop the highest die, so they tend to be less loyal.\
  <br>- <b>Children born in the campaign</b> roll 4d6 and drop the lowest die.\
  <br>- <b>Reeducation camp</b> graduates (see <a href='GLOSSARY:EDUCATION'>Education</a>) re-roll their score on \
  4d6, dropping the lowest die.</p>\
  <p>The score is converted into a modifier that is added to the character's turnover target number. The campaign \
  commander counts as 2 points more loyal.</p>\
  <table><tr><th>Score</th><th>Modifier</th><th>Name</th></tr> \
  <tr><td>3 or less</td><td>+3</td><td>Treacherous</td></tr> <tr><td>4</td><td>+2</td><td>Disloyal</td></tr> \
  <tr><td>5-6</td><td>+1</td><td>Unreliable</td></tr> <tr><td>7-14</td><td>0</td><td>Neutral</td></tr> \
  <tr><td>15-16</td><td>-1</td><td>Reliable</td></tr> <tr><td>17</td><td>-2</td><td>Loyal</td></tr> \
  <tr><td>18 or more</td><td>-3</td><td>Devoted</td></tr></table>\
  <p>Some compulsions change a character's effective Loyalty, usually depending on whether they share the \
  campaign's faction. For example, Faction Loyalty gives +1 in their own faction's campaign and -4 in anyone \
  else's.</p>\
  <p>If <b>Hide Loyalty</b> is enabled, Loyalty isn't shown, and its modifier is folded into the base turnover \
  target number so it can't be picked out.</p>\
  <h2>Changing Loyalty</h2>\
  <p>Events change a character's Loyalty in one of two ways. A <b>random change</b> rolls 3d6: 3 or less -3, 4 \
  -2, 5-6 -1, 15-16 +1, 17 +2 and 18 +3. A major random change rolls twice and uses the result furthest from 9. \
  A <b>forced change</b> always goes one way, up or down, by 1 to 3 points depending on how far a 3d6 roll is \
  from the middle. A major forced change rolls twice and applies both.</p>\
  <p>- <b>The commander leaves</b> for any reason other than resigning or retiring, including death: everyone \
  makes a random change.\
  <br>- <b>Salaries can't be paid:</b> everyone suffers a forced drop.\
  <br>- <b>Marriage</b>, and the <b>birth or adoption</b> of a child: a random change for each parent or spouse.\
  <br>- <b>Divorce:</b> a random change, or a forced drop if both partners leave.\
  <br>- <b>Education:</b> graduates gain Loyalty based on how long they studied, and may gain or lose 1 more.\
  <br>- <b>Faction Standing</b> events, and some random events, can raise or lower Loyalty.\
  <br>- <b>Collecting a Bloodmark bounty</b> on one of your own: everyone suffers a forced drop.</p>\
  <p>In GM Mode, you can right-click characters and choose <b>GM Mode</b>, <b>Roleplay</b>, <b>Regenerate \
  Loyalty</b> to roll a new 3d6 score, or set it by hand with <b>Edit Person</b>.</p>
### M
MAINTENANCE.title=Maintenance
MAINTENANCE.definition=If enabled in Campaign Options, all units will require maintenance. The exact rules for maintenance\
 \ may be found in Campaign Operations. Sometimes you may notice the days till the next maintenance cycle showing as a\
 \ decimal place. This is because maintenance requirements are lower on certain contracts (or when not on contract).\
 <p>Maintenance costs can be reduced while off contract on a well-equipped world; see\
 \ <a href='GLOSSARY:HIRING_HALLS'>Hiring Halls</a>. If <a href='GLOSSARY:HOT_SPOTS_UPKEEP'>Hot Spots Upkeep</a> is\
 \ enabled, maintenance costs are not charged, as upkeep covers them.</p>
MANAGEMENT_SKILL.title=Management Skill
MANAGEMENT_SKILL.definition=Management Skill represents the individual leadership talents of personnel in the chain of\
 \ command. For each of these roles, a single person is selected as the commanding officer for that role:\
 \ Aerospace, Vehicle, Infantry, Naval, Tech, Medical, Administrator, MekWarrior.\
 <p>Commanding officers are determined by the highest-ranked member of each role group, using experience level (green,\
 \ regular, etc.) as a tiebreaker. That person's <i>Leadership</i> skill, plus the value set in the <i>Unskilled Penalty</i>\
 \ campaign option (<b>Default:</b> 0), is their Management Skill. This Management Skill is applied to the turnover\
 \ target numbers of all personnel covered by that role. If personnel have two roles, they use the mean value of the\
 \ management skills from the commanding officer of both roles.</p>\
  <p>Management Skill does not apply to civilians or prisoners, and civilians cannot be commanding officers.</p>\
  <p>If <i>Use Commander's Leadership Only</i> is enabled in Campaign Options, the role commanding officers are\
  \ ignored: everyone uses the campaign commander's <i>Leadership</i> skill instead.</p>\
 <p><b>EXAMPLE</b></p>\
 <p>MekWarrior Bill's commanding officer has a Management Skill of -1, increasing Bill's turnover\
 \ target number by 1. Aerospace Pilot Sally's commanding officer has a Management Skill of 3, reducing her turnover\
 \ target number by 3.</p>\
 <p>See <a href='GLOSSARY:TURNOVER_MODIFIERS'>Turnover Modifiers</a> for everything else that changes the\
 \ turnover target number.</p>
MANUAL_SCENARIOS.title=Manual Scenarios
MANUAL_SCENARIOS.definition=<p>You can add a scenario to any contract yourself. This is how a human GM sets up \
  battles, and how a player makes a scenario to <a href='GLOSSARY:COOP_CAMPAIGNS'>join someone else's game</a>.</p> \
  <h2>Adding a Scenario</h2> <p>Select the contract in the Briefing Room and press <b>Add Scenario</b>. The New \
  Scenario dialog has three tabs:</p> <p>- <b>Basic Information</b>: the name, date and description, plus the map, \
  planetary conditions and deployment limits (allowed unit types, how many units, and any required personnel or \
  units).<br>- <b>Objectives and Rewards</b>: scenario objectives, and loot (money, units and parts) that you can \
  choose to award when you resolve the scenario.<br>- <b>Other Formations</b>: formations played by the bot, see \
  below.</p> <p>Then deploy \
  your formations to it as usual (see <a href='GLOSSARY:HOW_TO_DEPLOY'>How to Deploy</a>).</p> <h2>Generate From \
  Template</h2> <p>Instead of filling the dialog in, you can press <b>Generate From Template</b> and pick one of \
  MekHQ's scenario templates, such as Ambush the Column or Base Defense. This creates a ready-made scenario with \
  objectives and conditions. Once your formations are deployed, open the scenario again and press <b>Generate Bot \
  Forces</b> to have MekHQ build the opposition (<b>Regenerate Bot Forces</b> builds it again).</p> <h2>Bot \
  Formations</h2> <p>On the Other Formations tab, <b>Add Formation</b> creates a formation the bot will play. You \
  set its name, team, faction and Princess's behaviour. Its units can be fixed (picked one by one, or loaded from a \
  MUL file with <b>Load Fixed Units</b>), random (generated to a size relative to your force), or both. Team 1 is \
  your own team, so a formation on Team 1 fights alongside you.</p> <p>Bot formations are added when the game starts, and <b>Export MUL \
  File</b> exports each of them to a file of its own as well, so a GM can take control of them in MegaMek \
  instead.</p> <h2>Playing and Resolving</h2> <p>Start the game from the Briefing Room, or play it elsewhere and use \
  <b>Resolve Manually</b>; see <a href='GLOSSARY:MUL_FILES'>MUL Files</a>. In GM Mode, <b>Reset Deployment</b> \
  removes every unit from the scenario.</p>
MASS_REPAIR_MASS_SALVAGE.title=Automated Mass Repair, Mass Salvage
MASS_REPAIR_MASS_SALVAGE.definition=Mass Repair, Mass Salvage (MRMS) lets you automate the whole repair and salvage\
 \ process. You can click the Mass repair/salvage button in the Repair Bay, which will bring you to a menu where you can\
 \ customize the conditions in which mass repair will work. Most notably, at the bottom, you will notice a list of what types\
 \ of jobs may be automated, e.g., replacement of armor, repair of actuators, etc.\
 <p>Each type of job has its own settings, which determine what tasks may be done automatically by your techs:</p>\
 <p>- <b>Min Skill</b> and <b>Max Skill</b>: only techs whose skill falls within this range will start the task.\
 <br>- <b>Max TN</b>: the hardest task that is going to be run without your input. Techs will not start a task with\
 \ a higher Target Number.\
 <br>- <b>Preferred TN</b>: if 'Extra Time' and/or 'Rush Job' are allowed, techs will spend extra time to bring a task\
 \ down to this Target Number, or rush an easier task up to it to save time.</p>\
 <p>If you save these settings as the default (using the button on the bottom of the window), the mass repair/salvage\
 \ will run daily, provided you have turned it on in MekHQ Options.</p>
MISSING_IN_ACTION.title=Missing in Action
MISSING_IN_ACTION.definition=<p>Your personnel go Missing in Action (MIA) when:</p> <p>- they are missing after a \
  scenario where you held the battlefield; <br>- they are missing on the ground after a scenario where the enemy \
  held the battlefield, and the enemy doesn't find them; or <br>- the enemy finds them, but the Capture Style \
  campaign option is Disabled.</p> <p>Each day, MekHQ makes a <a href='GLOSSARY:SEARCH_AND_RESCUE'>Search and \
  Rescue</a> attempt for each MIA character. Those who are found return to duty.</p> <p>If you begin transit away \
  from the planet, everyone still MIA is abandoned and leaves the campaign.</p> <p>See <a \
  href='GLOSSARY:PRISONER_CAPTURE'>Capturing Prisoners</a> for what happens to missing personnel the enemy \
  finds.</p>
MISSING_LIMBS.title=Replacing Missing Limbs
MISSING_LIMBS.definition=If you have 'Advanced Medical' enabled in Campaign Options, your personnel will occasionally find\
 \ themselves separated from their arms and legs. Luckily for them, in 50.04 medical science developed prosthetic\
 \ limbs!\
 <p>If <a href='GLOSSARY:ALT_ADVANCED_MEDICAL'>Alternate Advanced Medical</a> is enabled, missing limbs are\
 \ replaced through <a href='GLOSSARY:PROSTHETICS'>Advanced Surgeries</a> instead, and the option below is not shown.</p>\
 <p>Navigate to the injured character in the Personnel Tab and right-click on their entry in the roster. Under\
 \ Healthcare you will see an option to replace missing limbs. Replacing limbs requires a small payment and either a\
 \ qualified doctor\
 \ in your roster or for one to be found locally. You are unable to find local doctors if you are not planetside.</p>\
 <p>Once the surgery has been completed, there's going to be a short recovery period. During this period, the patient is\
 \ incapacitated and probably shouldn't be sent back into combat.</p>
MISSION_CONCLUSION_HELP.title=Mission Conclusion Help
MISSION_CONCLUSION_HELP.definition=When you select 'Complete Mission,' you are going to be asked whether the\
 \ <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Mission or Contract</a> was a perfect success, success, failure, or \
  contract\
 \ breach. While the final decision is up to you and your chosen narrative, here is some guidance for\
 \ <a href='GLOSSARY:STRATCON'>StratCon</a> enabled campaigns.\
 <p>- <b>Perfect Success</b>: if you met your <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory\
 \ Point</a> target and failed no <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>Strategic Objective</a>, then the\
 \ contract should be recorded as a Perfect Success, so long as you also completed at least one Strategic Objective\
 \ where the contract had any. Contracts with no Strategic Objectives, including every contract in mapless mode, are\
 \ judged on their Contract Victory Point target alone.\
 <br>- <b>Success</b>: if by the conclusion of the contract, any Strategic Objectives were failed, or you met your\
 \ Contract Victory Point target without completing any of the contract's Strategic Objectives, the contract should\
 \ only count as a Success. Missing your Contract Victory Point target can still be a Success if you made some\
 \ progress: a positive Contract Victory Point score, or at least one Strategic Objective completed.\
 <br>- <b>Failure</b>: if you missed your Contract Victory Point target and made no progress at all, the contract is a\
 \ failure.\
 <br>- <b>Contract Breach</b>: if you end the contract early without your employer releasing you from it, it should\
 \ count as a Contract Breach, whatever else you achieved. Avoid doing this where possible.</p>
MISSION_TYPES.title=Mission Types
MISSION_TYPES.definition=MekHQ recognizes twenty types of \
  <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>contracts</a>, each with its own length, contract terms, parts \
  availability, and risks. They sort into three broad families, plus a handful that stand on their own.\
  <p><b>Garrison-type</b> - defensive, steady postings:\
  <br>- <a href='GLOSSARY:MISSION_TYPE_GARRISON_DUTY'>Garrison Duty</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_CADRE_DUTY'>Cadre Duty</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_SECURITY_DUTY'>Security Duty</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_RIOT_DUTY'>Riot Duty</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_RETAINER'>Retainer</a></p>\
  <p><b>Raid-type</b> - fast, high-risk strikes:\
  <br>- <a href='GLOSSARY:MISSION_TYPE_DIVERSIONARY_RAID'>Diversionary Raid</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_OBJECTIVE_RAID'>Objective Raid</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_RECON_RAID'>Recon Raid</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_EXTRACTION_RAID'>Extraction Raid</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_OBSERVATION_RAID'>Observation Raid</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_ASSASSINATION'>Assassination</a></p>\
  <p><b>Guerrilla-type</b> - deniable, behind-the-lines work:\
  <br>- <a href='GLOSSARY:MISSION_TYPE_GUERRILLA_WARFARE'>Guerrilla Warfare</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_ESPIONAGE'>Espionage</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_SABOTAGE'>Sabotage</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_TERRORISM'>Black-Ops Insurgency</a></p>\
  <p><b>Standing apart</b> from the three families:\
  <br>- <a href='GLOSSARY:MISSION_TYPE_PLANETARY_ASSAULT'>Planetary Assault</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_RELIEF_DUTY'>Relief Duty</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_PIRATE_HUNTING'>Pirate Hunting</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_MOLE_HUNTING'>Mole Hunting</a>\
  <br>- <a href='GLOSSARY:MISSION_TYPE_PIRATE_RAID'>Pirate Raid</a></p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_ASSASSINATION.title=Mission Type: Assassination
MISSION_TYPE_ASSASSINATION.definition=<p style='text-align: center;'><i>"One name on the contract, one name off the \
  census. Don't overthink it." - a Ronin blade-for-hire</i></p><br>\
  Among the most underhanded contracts a command can take, and sanctioned by no \
  MRBC Hiring Hall. Essentially a variant on the objective raid, save that civilians are classified as fair game - and \
  frequently become the very focus of the operation. Such work is the province of less civilized governments and \
  extremist groups, though a Great House covert agency may quietly turn to outside hands when its own are too \
  compromised. Payment and command rights are remarkably good, but transport and support are deliberately withheld so \
  that no trail leads back to the employer.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a raid-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better command rights (+2), but slightly worse salvage \
  rights (-1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +3 - procurement much harder \
  than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 28%, 38%, or 48% when the \
  contract begins (most often 38%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract in a field workshop\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Doubled Costs:</b> buying units and parts costs double while the contract is active\
  <br>- <b>Doubled Support:</b> straight support and battle loss compensation payments are doubled\
  <br>- <b>Deferred Support:</b> support payments are withheld during the contract and paid as a lump sum when it \
  ends</p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Assassination Targets</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Assassination \
  Targets appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>One per point of the contract's scale is the real target (or every one, if there are fewer). The rest are \
  body doubles. They all look alike, so you cannot tell which is which.</p>\
  <p>When any formation deploys onto an Assassination Target, there is no roll: you must always fight an Assassination scenario.\
  <br>- <b>Real target:</b> an overall victory meets its objective and earns the contract's combat bonus. Anything \
  else - a defeat, a draw, or leaving the scenario unplayed - lets the target escape, failing its objective.\
  <br>- <b>Body double:</b> revealed only once the scenario ends. Its objective is withdrawn whatever the result - \
  neither met nor failed. An overall victory still earns the combat bonus; anything else earns nothing.</p>\
  <p>An Assassination Target of either kind not struck before it expires fails its objective.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_CADRE_DUTY.title=Mission Type: Cadre Duty
MISSION_TYPE_CADRE_DUTY.definition=<p style='text-align: center;'><i>"Teaching militia to shoot straight is easy. \
  Teaching them not to shoot me is the hard part." - a cadre instructor's lament</i></p><br>\
  Possibly the lightest duty of all. A command on cadre, or training, assignment \
  instructs corporate security personnel or a local planetary militia in combat tactics. The work is usually folded \
  into a garrison contract where possible - larger units detaching anything from a single lance to an entire company \
  to teach while the rest of the force is employed elsewhere.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 6 months (5 to 7 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a garrison-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly better pay and transport (+1 each), but much worse \
  salvage rights (-2)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of 0 - procurement at its \
  standard difficulty\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 6%, 16%, or 26% when the \
  contract begins (most often 16%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see \
  <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Combat Role:</b> formations with the <a href='GLOSSARY:COMBAT_ROLES'>Cadre</a> role count toward this \
  contract's combat formations, and return to Frontline when it ends\
  <br>- <b>Simulated Damage:</b> neither side's units take lasting damage or losses in combat, so there is no \
  salvage and no prisoners are taken\
  <br>- <b>Reduced Combat Pay:</b> the contract's combat pay is quartered\
  <br>- <b>StratCon:</b> its victory point target counts only the months the enemy is expected to raid \
  (see <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>), so it needs far fewer victory points to complete\
  <br>- <b>Facilities:</b> facility bays can be rented while on this contract\
  <br>- <b>Maintenance:</b> maintenance cycles run at a quarter of their usual pace, unless another active contract is \
  not a garrison-type contract\
  <br>- <b>Morale:</b> the contract begins Peaceful, and each month the enemy may raid - see \
  <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Training Maneuvers</b></p>\
  <p>This contract keeps its <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Alongside them, \
  Training Maneuvers appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto Training Maneuvers, they are completed at once. No scenario is rolled for at \
  all, and their objective is met.</p>\
  <p>Training Maneuvers not held before they expire fail their objective.</p>\
  <p>Completing them earns no combat bonus; your Essential scenarios still earn it.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_DIVERSIONARY_RAID.title=Mission Type: Diversionary Raid
MISSION_TYPE_DIVERSIONARY_RAID.definition=<p style='text-align: center;'><i>"Our job was to be the loudest target on the planet. We were very good at our job." - a survivor of the Hesperus feint</i></p><br>\
  Staged just before a major assault or raid, a diversionary raid draws off \
  as many enemy troops as possible from the true objective. It means hitting hard and moving fast with little or no \
  battlefield support close at hand, and the extreme danger commands extraordinary pay and negotiated benefits. Covert \
  variants demand the unit avoid capture at all costs and make it appear that anyone but the employer is responsible.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a raid-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly worse salvage rights (-1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +2 - procurement noticeably \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 26%, 36%, or 46% when the \
  contract begins (most often 36%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract in a field workshop\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>High Profile Targets</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, its \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a> is to raise <a href='GLOSSARY:ESCALATION'>Escalation</a> to 50 per \
  point of the contract's scale before the contract ends.</p>\
  <p>High Profile Targets appear on the map over the course of the contract. They are not strategic objectives \
  themselves. Each lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a High Profile Target, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the target is struck. Escalation rises by 3d6, and you earn the contract's combat bonus.\
  <br>- <b>Scenario:</b> the enemy was waiting, and the formation is ambushed in a Decoy Engagement scenario, a \
  <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a>. The target is spent whatever the result, and is removed.</p>\
  <p>A High Profile Target not struck before it expires is simply gone.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_ESPIONAGE.title=Mission Type: Espionage
MISSION_TYPE_ESPIONAGE.definition=<p style='text-align: center;'><i>"Half the contract is reading mail that isn't yours. The other half is running before anyone notices." - an intelligence handler</i></p><br>\
  A variant on the guerrilla-warfare contract that strikes at civilian and \
  administrative targets rather than military ones, set on crippling the enemy's infrastructure rather than its people. \
  Espionage contracts often add clauses to relay military and political intelligence as well - material the employer \
  will presumably put to use in an invasion at some later date. The pay is good and command rights fall to the \
  mercenary's liking, at the cost of transport and support reimbursement.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a guerrilla-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better command rights (+2) and slightly better support \
  (+1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +1 - procurement a little \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 38%, 48%, or 58% when the \
  contract begins (most often 48%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract at an improvised repair site\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Resupply:</b> cut off from regular supply, only one resupply in four arrives, and it comes through \
  smugglers - who may swindle the command - rather than your own convoys</p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Data Caches</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Data Caches \
  appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>Strategic Objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Data Cache, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the cache is recovered. Its objective is met, and you earn the contract's combat bonus.\
  <br>- <b>Scenario:</b> you must fight a Recon Evasion scenario over the cache. An overall victory recovers it, as \
  above. Anything else (defeat, draw, or fleet in being) loses the cache, failing its objective.</p>\
  <p>A cache not recovered before it expires is lost, failing its objective.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_EXTRACTION_RAID.title=Mission Type: Extraction Raid
MISSION_TYPE_EXTRACTION_RAID.definition=<p style='text-align: center;'><i>"Grabbing the package is easy. Convincing it to come quietly is the part they don't pay enough for." - an extraction lance sergeant</i></p><br>\
  Commonly known as a smash-and-grab, and near identical to an objective raid - \
  save that the command must capture a target and return it to the employer. Snatching a person grows complicated when \
  the target resists, and seizing one of no demonstrable military value can see both unit and employer charged with \
  kidnapping. Even so, the well-timed extraction of a key enemy leader can cripple an opposing force, and most \
  employers will accept the risk.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a raid-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly worse salvage rights (-1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +2 - procurement noticeably \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 22%, 32%, or 42% when the \
  contract begins (most often 32%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract in a field workshop\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>VIPs</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, VIPs appear on \
  the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a VIP, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the VIP is extracted. Their objective is met, and you earn the contract's combat bonus.\
  <br>- <b>Scenario:</b> you must fight a Breakout scenario to get them out. An overall victory extracts them, as \
  above. Anything else - a defeat, a draw, or leaving the scenario unplayed - loses them, failing their \
  objective.</p>\
  <p>A VIP not extracted before they expire is lost, failing their objective.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_GARRISON_DUTY.title=Mission Type: Garrison Duty
MISSION_TYPE_GARRISON_DUTY.definition=<p style='text-align: center;'><i>"Three months polishing armor, then the locals \
  remember how much they hate the governor. Wake me when the shooting starts." - overheard in a garrison mess hall</i></p><br>\
  Considered gravy time by most commands. A garrison unit may guard anything from \
  a single facility to an entire planet, holding against hostile raiders or even assault forces. On interior worlds it \
  frees regular troops for offensive action; on border worlds, where combat is a genuine threat, garrison units keep a \
  strict order of readiness and draw combat bonuses when the fighting finally comes.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 6 months (5 to 7 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a garrison-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly better pay and transport (+1 each), but much worse \
  salvage rights (-2)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of -1 - procurement a little \
  easier than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 10%, 20%, or 30% when the \
  contract begins (most often 20%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see \
  <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>StratCon:</b> its victory point target counts only the months the enemy is expected to raid \
  (see <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>), so it needs far fewer victory points to complete\
  <br>- <b>Facilities:</b> facility bays can be rented while on this contract\
  <br>- <b>Maintenance:</b> maintenance cycles run at a quarter of their usual pace, unless another active contract is \
  not a garrison-type contract\
  <br>- <b>Morale:</b> the contract begins Peaceful, and each month the enemy may raid - see \
  <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Escalation (Unrest)</b></p>\
  <p>This contract keeps its <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. It also tracks \
  Escalation, which here is the unrest your garrison must calm. It starts at its maximum of 100 per point of the \
  contract's scale, and only ever falls. It falls when you:\
  <br>- Deploy a formation to an empty hex (one with no scenario, facility, or Nav Point) and no scenario \
  results: -1.\
  <br>- Win any scenario: -1d6.\
  <br>- Make a Show of Force (see below): -3d6.</p>\
  <p>At each <a href='GLOSSARY:MORALE'>morale</a> check, a die with as many sides as the maximum Escalation is \
  rolled. If the roll is no higher than the current Escalation, the enemy's morale rises by one level; if it is \
  higher, the enemy's morale falls by one level. Either way, this comes on top of whatever the check itself did. \
  On this contract the enemy's morale is only checked after a month in which it raided, so the roll only comes then. \
  Unrest is high when the contract begins, so expect early raids to embolden the enemy - but the calmer you keep \
  the region, the likelier the enemy is to lose heart. You can follow Escalation on the StratCon tab.</p>\
  <p><b>Shows of Force</b></p>\
  <p>Shows of Force appear on the map over the course of the contract. They are not \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objectives</a>. Each lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Show of Force, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the show of force goes off without a hitch, and Escalation falls by 3d6.\
  <br>- <b>Scenario:</b> the enemy uses the spectacle as cover, and the formation is ambushed in a \
  <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario. The Show of Force is spent whatever the result, calms \
  nothing, and is removed.</p>\
  <p>Shows of Force earn no combat bonus; your Essential scenarios still earn it.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_GUERRILLA_WARFARE.title=Mission Type: Guerrilla Warfare
MISSION_TYPE_GUERRILLA_WARFARE.definition=<p style='text-align: center;'><i>"No resupply, no reinforcements, no idea if the contract's even still on the books. Best work I ever had." - a guerrilla company's surviving exec officer</i></p><br>\
  One of the most challenging and dangerous missions a command can accept, \
  blending elements of the planetary assault, cadre duty, reconnaissance and the objective raid. The unit must operate \
  behind enemy lines without support for extended periods, harassing the foe, destroying vital targets, and training \
  local allies - most often civilians - in the art of guerrilla fighting. The obvious dangers earn the highest pay and \
  most generous rights of any mercenary contract.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a guerrilla-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better command rights (+2), but slightly worse salvage \
  rights (-1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +3 - procurement much harder \
  than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 32%, 42%, or 52% when the \
  contract begins (most often 42%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract at an improvised repair site\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see \
  <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Resupply:</b> cut off from regular supply, only one resupply in four arrives, and it comes through \
  smugglers - who may swindle the command - rather than your own convoys\
  <br>- <b>Doubled Costs:</b> buying units and parts costs double while the contract is active\
  <br>- <b>Doubled Support:</b> straight support and battle loss compensation payments are doubled\
  <br>- <b>Deferred Support:</b> support payments are withheld during the contract and paid as a lump sum when it \
  ends</p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Vulnerable Infrastructure</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Vulnerable \
  Infrastructure appears on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>. It is hidden until scouted, and never \
  expires.</p>\
  <p>When any formation deploys onto Vulnerable Infrastructure, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the infrastructure is destroyed. Its objective is met, and you earn the contract's combat \
  bonus.\
  <br>- <b>Scenario:</b> it was a trap, and the formation is ambushed in a \
  <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario. The trap is spent whatever the result: the \
  infrastructure is removed, and its objective is withdrawn - neither met nor failed.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_MOLE_HUNTING.title=Mission Type: Mole Hunting
MISSION_TYPE_MOLE_HUNTING.definition=<p style='text-align: center;'><i>"Everyone smiles at you until you find the one who shouldn't be smiling." - a counterintelligence specialist</i></p><br>\
  A cousin of the observation contract, turned inward. The command infiltrates a \
  portion of its own employer's operations to root out spies within the organization; once located, the enemy elements \
  are either eliminated or merely reported. The work allows operatives the time to dig in and trace security leaks at \
  leisure.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> stands apart from the garrison, raid, and guerrilla families\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better command rights (+2) and slightly better support \
  (+1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +1 - procurement a little \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 14%, 24%, or 34% when the \
  contract begins (most often 24%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Potential Leads</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Potential Leads \
  appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Potential Lead, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the lead is a dud. It is removed, and its objective is withdrawn - neither met nor failed.\
  <br>- <b>Scenario:</b> the lead has panned out, and you must fight a Mole Hunt scenario. An overall victory meets \
  its objective and earns the contract's combat bonus. Anything else - a defeat, a draw, or leaving the scenario \
  unplayed - fails its objective.</p>\
  <p>A lead not followed up before it expires goes cold, failing its objective.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_OBJECTIVE_RAID.title=Mission Type: Objective Raid
MISSION_TYPE_OBJECTIVE_RAID.definition=<p style='text-align: center;'><i>"Blow the depot, count to ten, and be three hexes gone before the smoke clears." - tactical raid doctrine, abridged</i></p><br>\
  Also known as the tactical raid, and the most common mission a command is \
  likely to receive. The unit infiltrates enemy lines to destroy a specific target - an installation, a piece of \
  equipment, a command officer, anything that counts as a viable military objective - and then pulls out. With the high \
  risk and little chance of backup should events turn against them, employers usually offer generous pay and rights.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a raid-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly worse salvage rights (-1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +2 - procurement noticeably \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 22%, 32%, or 42% when the \
  contract begins (most often 32%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract in a field workshop\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Target Intelligence</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Target \
  Intelligence appears on the map over the course of the contract. It is not a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a> itself. It is hidden until scouted, and never \
  expires.</p>\
  <p>One piece of Target Intelligence per point of the contract's scale (or every piece, if there are fewer) leads to \
  an enemy facility. When any formation deploys onto it, there is no roll: a hostile facility is revealed elsewhere in \
  the same sector, and destroying it becomes a strategic objective. If the sector has no room for another facility, \
  nothing comes of it.</p>\
  <p>When any formation deploys onto any other Target Intelligence, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the intelligence proves worthless, and is removed.\
  <br>- <b>Scenario:</b> the enemy was waiting, and the formation is ambushed in a \
  <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario. The intelligence is spent whatever the result, and is \
  removed.</p>\
  <p>Target Intelligence itself earns no combat bonus.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_OBSERVATION_RAID.title=Mission Type: Observation Raid
MISSION_TYPE_OBSERVATION_RAID.definition=<p style='text-align: center;'><i>"We won the contract without firing a shot. Command was furious - no salvage." - a reconnaissance officer</i></p><br>\
  Essentially a long-term reconnaissance raid against an enemy objective. The \
  command infiltrates and gathers information on a subject or suspected activity without being detected, and what sets \
  the mission apart is its surprising lack of combat - the focus is intelligence, not battlefield victory. Secrecy, \
  protection of the employer's identity, and the absence of transport or battlefield support all apply, but pay is \
  excellent and command rights almost invariably independent.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a raid-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly worse salvage rights (-1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +2 - procurement noticeably \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 22%, 32%, or 42% when the \
  contract begins (most often 32%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract in a field workshop\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Lookout Points</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Lookout Points \
  appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Lookout Point, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the observation is made. Its objective is met, and you earn the contract's combat bonus.\
  <br>- <b>Scenario:</b> the formation is ambushed in a <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario. \
  The Lookout Point is compromised whatever the result: it is removed, and its objective is withdrawn - neither met \
  nor failed.</p>\
  <p>A Lookout Point not used before it expires fails its objective.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_PIRATE_HUNTING.title=Mission Type: Pirate Hunting
MISSION_TYPE_PIRATE_HUNTING.definition=<p style='text-align: center;'><i>"Pirates fight like cornered rats until they realize you brought 'Meks. Then they just run." - a bounty-hunting MechWarrior</i></p><br>\
  Regarded as an excellent combat assignment for its fair pay and excellent \
  salvage rights. Command rights are rarely a problem and transport is usually reimbursed; few employers provide \
  battlefield support, but a hunting unit is unlikely to face an enemy force large enough to warrant reinforcement.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> stands apart from the garrison, raid, and guerrilla families\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better command rights (+2), but slightly worse salvage \
  rights (-1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +1 - procurement a little \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 10%, 20%, or 30% when the \
  contract begins (most often 20%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Decisive Engagement:</b> each Essential scenario won adds 1 to a running tally and any other result takes 1 \
  away (without StratCon, every scenario counts). When the tally reaches twice the contract's scale, the contract \
  ends early in your favor, with its remaining pay settled; when it falls to minus twice the scale, the contract \
  ends early in failure, with no further pay</p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Pirate Captains</b></p>\
  <p>This contract has no scheduled <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Pirate \
  Captains appear on the map over the course of the contract. They are not \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objectives</a> themselves. Each lasts 1 to 6 days after it \
  appears.</p>\
  <p>When any formation deploys onto a Pirate Captain, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the captain has already slipped away. The Pirate Captain is removed, with nothing gained or \
  lost.\
  <br>- <b>Scenario:</b> the captain stands and fights in a Decapitation Strike scenario. This scenario is an \
  Essential scenario, and a strategic objective. An overall victory meets its objective and earns the contract's \
  combat bonus. Anything else - a defeat, a draw, or leaving the scenario unplayed - fails its objective.</p>\
  <p>A Pirate Captain not run down before it expires has moved on, with nothing lost.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_PIRATE_RAID.title=Mission Type: Pirate Raid
MISSION_TYPE_PIRATE_RAID.definition=<p style='text-align: center;'><i>"Nobody hires pirates. They just point us at \
  something shiny and look the other way." - a pirate band's quartermaster</i></p><br>\
  Not a contract any Hiring Hall would recognize. A pirate band picks a soft target - a warehouse, a trade post, a \
  poorly defended world - and takes what it can before the defenders can muster. Now and then a real power quietly \
  bankrolls such a raid against a rival, content to let the pirates take the blame.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Availability:</b> offered only by acts-of-piracy contract searches\
  <br>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> stands apart from the garrison, raid, and guerrilla families\
  <br>- <b>Contract terms:</b> command and salvage rights are always at their maximum, and cannot be negotiated. A \
  raid the band undertakes on its own also gets no support and no transport, likewise locked, and carries no combat \
  bonus. A raid secretly bankrolled by a hidden sponsor is always run as a covert operation: its support and transport \
  are negotiated as usual, and it does carry a combat bonus\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +1 - procurement a little \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 22%, 32%, or 42% when the \
  contract begins (most often 32%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Resupply:</b> cut off from regular supply, only one resupply in four arrives, and it comes through \
  smugglers - who may swindle the command - rather than your own convoys\
  <br>- <b>Decisive Engagement:</b> each Essential scenario won adds 1 to a running tally and any other result takes 1 \
  away (without StratCon, every scenario counts). When the tally reaches twice the contract's scale, the contract \
  ends early in your favor, with its remaining pay settled; when it falls to minus twice the scale, the contract \
  ends early in failure, with no further pay. While <i>Contracts Use Special Mechanics</i> is enabled, Plunder Targets take the place \
  of this contract's Essential scenarios and their ambushes do not count, so the rule only comes into play when that \
  option is off\
  <br>- <b>Pirate Looting:</b> with <i>Use Chaos Campaign Reputation</i> enabled, the band rolls to escape with its \
  booty when the contract is completed, and risks a criminal record if caught\
  <br>- <b>Facilities:</b> support facilities cannot be rented for a pirate raid</p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Plunder Targets</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Plunder Targets \
  appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Plunder Target, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the target is plundered. Its objective is met, you earn the contract's combat bonus (only \
  a covert raid, secretly bankrolled by a hidden sponsor, has one), the loot arrives as a small Resupply, and \
  Escalation rises by 3d6.\
  <br>- <b>Scenario:</b> the formation is ambushed in a <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario. The \
  target is spent whatever the result: there is no loot, the target is removed, and its objective is withdrawn - \
  neither met nor failed.</p>\
  <p>A Plunder Target not raided before it expires fails its objective.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_PLANETARY_ASSAULT.title=Mission Type: Planetary Assault
MISSION_TYPE_PLANETARY_ASSAULT.definition=<p style='text-align: center;'><i>"They told us it was a supporting role. Forty days of supporting roles later, half the company was scrap." - an assault veteran</i></p><br>\
  Commands are generally hired to support regular troops during a planetary \
  assault, and the duty means heavy, protracted fighting. Employers offer generous pay, salvage and transportation \
  rights, and will negotiate support - but almost never command rights. Unless the mercenary force is an A-rated unit \
  or better, it is placed directly under the command of the force leader.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 6 months (5 to 7 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> stands apart from the garrison, raid, and guerrilla families\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better support (+2) and slightly better salvage rights \
  (+1), but slightly worse pay and transport (-1 each) and much worse command rights (-2)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +2 - procurement noticeably \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 20%, 30%, or 40% when the \
  contract begins (most often 30%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Strategic Positions</b></p>\
  <p>This contract keeps its <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Alongside them, \
  Strategic Positions appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Strategic Position, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the position is captured, and its objective is met.\
  <br>- <b>Scenario:</b> you must fight a Pivotal Engagement scenario for it. An overall victory captures it. \
  Anything else - a defeat, a draw, or leaving the scenario unplayed - loses it, failing its objective.</p>\
  <p>A Strategic Position not taken before it expires is lost, failing its objective.</p>\
  <p>Capturing one earns no combat bonus; your Essential scenarios still earn it.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_RECON_RAID.title=Mission Type: Recon Raid
MISSION_TYPE_RECON_RAID.definition=<p style='text-align: center;'><i>"If you came back with a kill count instead of a map, you failed the contract." - a scout commander</i></p><br>\
  The command infiltrates an enemy world to test the defenders' preparation, \
  willingness to engage and overall expertise, typically ahead of a planetary assault or major raid - and without \
  alerting the enemy that an attack is imminent. Recon forces must move quickly, avoid detection and operate in small \
  detachments. Many such contracts roll straight into a follow-up assault, so the scouts can aid the action.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a raid-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly worse salvage rights (-1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +2 - procurement noticeably \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 22%, 32%, or 42% when the \
  contract begins (most often 32%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract in a field workshop\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Reconnaissance</b></p>\
  <p>This contract keeps its <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Alongside them, each \
  sector has a <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a> to scout at least half of its land \
  hexes (every hex that is not ocean) before the contract ends.</p>\
  <p>Any land hex you can see counts, however it was revealed: by deploying or scouting, by a facility that reveals \
  the sector, or by a GM. Once a sector's objective is met, it stays met. You can follow each sector's progress on \
  the StratCon tab.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_RELIEF_DUTY.title=Mission Type: Relief Duty
MISSION_TYPE_RELIEF_DUTY.definition=<p style='text-align: center;'><i>"We made planetfall under fire, found the allied line already gone, and improvised from there." - a relief force after-action report</i></p><br>\
  Reinforcing friendly military forces that are often in danger of being overrun. A \
  unit signing on knows it is dropping into a war zone, to face an enemy command that may or may not have already \
  smashed those they came to assist. Employers are understandably desperate, so terms can be excellent - but command \
  rights are a constant problem, and with the enemy likely holding most approaches to the battlefield, the danger is \
  apparent from the start.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 6 months (5 to 7 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> stands apart from the garrison, raid, and guerrilla families\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better support (+2) and slightly better salvage rights \
  (+1), but slightly worse pay and transport (-1 each) and much worse command rights (-2)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +2 - procurement noticeably \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 18%, 28%, or 38% when the \
  contract begins (most often 28%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see \
  <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Morale:</b> the enemy's starting morale is one level higher than it would otherwise be</p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Beleaguered Forces</b></p>\
  <p>This contract keeps its <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Alongside them, \
  Beleaguered Forces appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts only 1 to 3 days after it \
  appears.</p>\
  <p>When any formation deploys onto Beleaguered Forces, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the forces are relieved, and their objective is met.\
  <br>- <b>Scenario:</b> you must fight a Relief Column scenario to reach them. An overall victory relieves them. \
  Anything else - a defeat, a draw, or leaving the scenario unplayed - leaves them to be overrun, failing their \
  objective.</p>\
  <p>Beleaguered Forces not relieved before they expire are overrun, failing their objective.</p>\
  <p>Relieving them earns no combat bonus; your Essential scenarios still earn it.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_RETAINER.title=Mission Type: Retainer
MISSION_TYPE_RETAINER.definition=<p style='text-align: center;'><i>"On retainer means on call. I've been pulled off three dinners and one wedding. Mine." - a retained company commander</i></p><br>\
  A retainer places a command at the employer's beck and call for a designated period, \
  to be summoned for unspecified defensive missions that can range from relief to riot duty and even mole-hunting; the \
  rest of the time the unit performs standard garrison duty. Employers traditionally cover full transportation and \
  reimburse out-of-pocket expenses, and pay is average, with a bonus when combat actually occurs.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 6 months (5 to 7 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a garrison-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly better pay and transport (+1 each), but much worse \
  salvage rights (-2)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of -1 - procurement a little \
  easier than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 16%, 26%, or 36% when the \
  contract begins (most often 26%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see \
  <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>StratCon:</b> its victory point target counts only the months the enemy is expected to raid \
  (see <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>), so it needs far fewer victory points to complete\
  <br>- <b>Facilities:</b> facility bays can be rented while on this contract\
  <br>- <b>Maintenance:</b> maintenance cycles run at a quarter of their usual pace, unless another active contract is \
  not a garrison-type contract\
  <br>- <b>Morale:</b> the contract begins Peaceful, and each month the enemy may raid - see \
  <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Scheduled Parades</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Scheduled \
  Parades appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Scheduled Parade, StratCon rolls for a scenario, as it does for any deployment \
  - but here the roll is made even while the contract is <a href='GLOSSARY:GARRISON_RAIDS'>Peaceful</a>, as civil \
  unrest does not answer to the enemy:\
  <br>- <b>No scenario:</b> the parade is held. Its objective is met, and you earn the contract's combat bonus.\
  <br>- <b>Scenario:</b> a riot breaks out, and the formation must deal with it in a Crowd Control scenario. The \
  parade is called off whatever the result: it is removed, and its objective is withdrawn - neither met nor \
  failed.</p>\
  <p>A Scheduled Parade not held before it expires fails its objective.</p>\
  <p>On this contract, the outcome of a riot does not affect the enemy's \
  <a href='GLOSSARY:MORALE'>morale</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_RIOT_DUTY.title=Mission Type: Riot Duty
MISSION_TYPE_RIOT_DUTY.definition=<p style='text-align: center;'><i>"Heavy 'Meks against an angry crowd. There are no winners here, only paperwork." - a reluctant riot-duty officer</i></p><br>\
  The most unsavory of all defensive missions, riot duty turns heavy assets against \
  civilians. Under the Ares Conventions it is permitted only where the civilian targets are demonstrably harmful to a \
  recognized government or civil authority, and only with the minimum force necessary at all times. For this reason \
  many commands refuse riot duty outright unless they field trained infantry occupation forces, and the work does not \
  pay well.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 6 months (5 to 7 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a garrison-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly better pay and transport (+1 each), but much worse \
  salvage rights (-2)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of -1 - procurement a little \
  easier than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 10%, 20%, or 30% when the \
  contract begins (most often 20%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see \
  <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>StratCon:</b> its victory point target counts only the months the enemy is expected to raid \
  (see <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>), so it needs far fewer victory points to complete\
  <br>- <b>Facilities:</b> facility bays can be rented while on this contract\
  <br>- <b>Maintenance:</b> maintenance cycles run at a quarter of their usual pace, unless another active contract is \
  not a garrison-type contract\
  <br>- <b>Morale:</b> the contract begins Peaceful, and each month the enemy may raid - see \
  <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Civil Disobedience</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Civil \
  Disobedience appears on the map over the course of the contract. Each outbreak is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto Civil Disobedience, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the disobedience is defused. Its objective is met, and you earn the contract's combat \
  bonus.\
  <br>- <b>Scenario:</b> it has become a riot, and you must fight a Crowd Control scenario. An overall victory puts it \
  down, as above. Anything else - a defeat, a draw, or leaving the scenario unplayed - fails its objective.</p>\
  <p>Civil Disobedience not dealt with before it expires fails its objective.</p>\
  <p>On this contract, winning or losing a riot moves the enemy's <a href='GLOSSARY:MORALE'>morale</a> \
  directly.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_SABOTAGE.title=Mission Type: Sabotage
MISSION_TYPE_SABOTAGE.definition=<p style='text-align: center;'><i>"We never fired on the garrison. We just made sure their fusion plant did." - a saboteur's only recorded statement</i></p><br>\
  A variant on the standard guerrilla-warfare contract, aimed at civilian and \
  administrative objectives rather than military targets, with an eye toward crippling the enemy's infrastructure \
  rather than its people. Like the terror campaigns it resembles, sabotage work pays well and command rights fall \
  almost always to the mercenary force's liking - at the cost of transportation and support reimbursement.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a guerrilla-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better command rights (+2) and slightly better support \
  (+1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +1 - procurement a little \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 38%, 48%, or 58% when the \
  contract begins (most often 48%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract at an improvised repair site\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Resupply:</b> cut off from regular supply, only one resupply in four arrives, and it comes through \
  smugglers - who may swindle the command - rather than your own convoys</p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Sabotage Targets</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Sabotage Targets \
  appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>. It is hidden until scouted, and lasts 1 to 6 \
  days after it appears.</p>\
  <p>When any formation deploys onto a Sabotage Target, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the target is sabotaged quietly. Its objective is met, you earn the contract's combat \
  bonus, and Escalation rises by 3d6.\
  <br>- <b>Scenario:</b> the saboteurs are caught in the act, and must fight a Covert Strike scenario. An overall \
  victory still sabotages the target: its objective is met, and you earn the combat bonus. Anything else - a defeat, \
  a draw, or leaving the scenario unplayed - fails its objective. Being caught raises Escalation by 2d6 whatever the \
  result, on top of the usual +1d6 for winning.</p>\
  <p>A Sabotage Target not sabotaged before it expires fails its objective.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_SECURITY_DUTY.title=Mission Type: Security Duty
MISSION_TYPE_SECURITY_DUTY.definition=<p style='text-align: center;'><i>"You stand close enough to take the bullet, and you pray the whole contract that you never have to." - a bodyguard lance leader</i></p><br>\
  Also called bodyguard or watchdog duty - a specialized, short-term form of \
  garrison work that means protecting a specific person, object or place from attack and capture. Corporations and \
  planetary governments hire for it often, though it pays poorly unless combined with cadre duty. Covert security duty \
  raises the stakes: a higher-priority charge, guarded under false pretenses in uncontrolled territory, such as \
  escorting a disguised House noble through open streets rather than along a secured route.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 6 months (5 to 7 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a garrison-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with slightly better pay and transport (+1 each), but much worse \
  salvage rights (-2)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of -1 - procurement a little \
  easier than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 14%, 24%, or 34% when the \
  contract begins (most often 24%), before morale and other modifiers\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see \
  <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>StratCon:</b> its victory point target counts only the months the enemy is expected to raid \
  (see <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>), so it needs far fewer victory points to complete\
  <br>- <b>Facilities:</b> facility bays can be rented while on this contract\
  <br>- <b>Maintenance:</b> maintenance cycles run at a quarter of their usual pace, unless another active contract is \
  not a garrison-type contract\
  <br>- <b>Morale:</b> the contract begins Peaceful, and each month the enemy may raid - see \
  <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a></p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Security Reviews</b></p>\
  <p>This contract keeps its <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Alongside them, \
  Security Reviews appear on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Security Review, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the review is passed, and its objective is met.\
  <br>- <b>Scenario:</b> you must fight an Engagement scenario against the enemy forces probing the site. An overall \
  victory passes the review. Anything else - a defeat, a draw, or leaving the scenario unplayed - fails its \
  objective.</p>\
  <p>A Security Review not carried out before it expires fails its objective.</p>\
  <p>Passing one earns no combat bonus; your Essential scenarios still earn it.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MISSION_TYPE_TERRORISM.title=Mission Type: Black-Ops Insurgency
MISSION_TYPE_TERRORISM.definition=<p style='text-align: center;'><i>"There's no Hiring Hall stamp on this one, and there never will be. Burn the contract after you read it." - an anonymous handler</i></p><br>\
  Among the most underhanded contracts ever offered, and sanctioned by no MRBC Hiring \
  Hall. A variant on guerrilla warfare in which civilians are not merely fair game but typically the focus, waged to \
  spread fear and disruption from the shadows. Extremist groups and less civilized governments are the usual \
  employers, with the occasional compromised House agency turning to such outside services. Pay and command rights are \
  remarkably good, while transport and support are withheld to keep any trail from leading home.\
  <p><b>In MekHQ</b></p>\
  <p>- <b>Length:</b> about 3 months (2 to 3 with <i>Vary Contract Lengths</i>)\
  <br>- <b>Category:</b> a guerrilla-type contract\
  <br>- <b>Contract terms (Hot Spots):</b> rolled with much better command rights (+2) and slightly better support \
  (+1)\
  <br>- <b>Parts:</b> <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> modifier of +1 - procurement a little \
  harder than usual\
  <br>- <b>Encounters:</b> each sector's base chance of a scenario when you deploy is set at 28%, 38%, or 48% when the \
  contract begins (most often 38%), before morale and other modifiers\
  <br>- <b>Repairs:</b> your units start the contract at an improvised repair site\
  <br>- <b>Scattered enemy:</b> the contract still runs to its end date - see \
  <a href='GLOSSARY:MORALE'>Morale</a>\
  <br>- <b>Resupply:</b> cut off from regular supply, only one resupply in four arrives, and it comes through \
  smugglers - who may swindle the command - rather than your own convoys</p>\
  <p><b>Special Mechanics</b></p>\
  <p>These rules apply while the <i>Contracts Use Special Mechanics</i> campaign option is enabled and the \
  contract is run on a <a href='GLOSSARY:STRATCON'>StratCon</a> map (not in mapless mode).</p>\
  <p><b>Civilian Infrastructure</b></p>\
  <p>This contract has no <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential scenarios</a>. Instead, Civilian \
  Infrastructure appears on the map over the course of the contract. Each is a \
  <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objective</a>. It is hidden until scouted, and never \
  expires.</p>\
  <p>When any formation deploys onto Civilian Infrastructure, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the infrastructure is destroyed. Its objective is met, you earn the contract's combat \
  bonus, and Escalation rises by 3d6.\
  <br>- <b>Scenario:</b> its defenders ambush the formation in a <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> \
  scenario. An overall victory still destroys the infrastructure: its objective is met, you earn the combat bonus, \
  and Escalation rises by 2d6, on top of the usual +1d6 for winning. Anything else - a defeat, a draw, or leaving the \
  scenario unplayed - fails its objective.</p>\
  <p>This contract also tracks <a href='GLOSSARY:ESCALATION'>Escalation</a>.</p>\
  <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Missions and Contracts</a>.</p>
MORALE.title=Morale
MORALE.definition=MekHQ Morale system is only in use while a <a href='GLOSSARY:DIGITAL_GM'>Digital GM</a> is enabled. \
  <p>This system reflects not only the mental state of opposing formations but also their ability to resist \
  effectively. Morale, in many ways, can also be seen as reflecting the balance of power in a contract. You can follow \
  it on the morale bar in the Briefing Room.</p>\
  <h2>Morale Levels</h2>\
  There are seven levels of morale, from Scattered (very low) to Overwhelming (very high). Each represents a \
  combination of both the enemy's willingness to fight and their capacity to do so.\
  <blockquote><b>- Scattered:</b> The enemy has been badly beaten and scattered. Their formations still fight, but \
  they go into battle short of ammunition and with damage they have had no chance to repair.\
  <br><b>- Critical:</b> The enemy is in a dire state, with most of their formations destroyed or incapacitated. \
  Their ability to fight is severely compromised, and they often go into battle short of ammunition or with damage \
  they have had no chance to repair.\
  <br><b>- Weakened:</b> The enemy is losing ground, sustaining significant casualties, and is disorganized. \
  However, they can still put up resistance in isolated areas.\
  <br><b>- Stalemate:</b> Both sides are evenly matched, with neither gaining a clear advantage. Skirmishes \
  will continue, but the outcome remains uncertain.\
  <br><b>- Advancing:</b> The enemy is gaining momentum, making coordinated strikes, and allied formations are falling \
  back. The enemy is beginning to dominate key areas of the battlefield.\
  <br><b>- Dominating:</b> The enemy has the upper hand, controlling critical objectives and inflicting heavy \
  casualties. Allied formations are under significant pressure, and defeat is imminent. While the enemy stays at \
  this level, each monthly morale check costs your employer Contract Victory Points or employer support.\
  <br><b>- Overwhelming:</b> The enemy is completely overwhelming allied positions, executing a final push for total \
  victory. Allied formations are on the verge of collapse, with no hope of recovery. While the enemy stays at this \
  level, each monthly morale check costs your employer both Contract Victory Points and employer support.\
  </blockquote>\
  <p>One thing to recognize is that not every battle is represented in MekHQ. You might be winning every scenario, \
  but your allies could be facing defeats across the board.</p>\
  <p>Breaking the enemy does not end a contract. A Scattered enemy keeps fighting at the usual pace, just badly. The \
  contract runs to its end date, unless it ends early for another reason, such as reaching its Victory Point target.</p>\
  <h2>Starting Morale</h2>\
  When a contract is generated, a morale check (see below) sets the enemy's starting morale. The enemy never starts \
  Scattered: a check that would leave them there leaves them at Critical instead. On a \
  <a href='GLOSSARY:MISSION_TYPE_RELIEF_DUTY'>Relief Duty</a> contract the enemy then starts one level higher. \
  Garrison-type contracts also start Peaceful (see \
  <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>).\
  <h2>Morale Checks</h2>\
  On the first of each month, every active contract makes a morale check. 2d6 is rolled and modified by the enemy's \
  Reliability and your Performance:\
  <blockquote><b>- 6 or less (Rallying):</b> the enemy's morale moves one level towards Overwhelming.\
  <br><b>- 7 (Unchanged):</b> the enemy's morale stays where it is.\
  <br><b>- 8 or more (Wavering):</b> the enemy's morale moves one level towards Scattered.</blockquote>\
  <p>The check never moves morale more than one level. It's important to note that the modifiers are applied to the \
  roll, <i>not</i> the target number. So a positive modifier makes the enemy more likely to break, and a negative \
  modifier makes them less likely to break. The result is shown in a Morale Update report. If the check leaves the \
  enemy Dominating or Overwhelming, your employer also suffers a monthly setback (see \
  <a href='GLOSSARY:MORALE_EFFECTS'>Morale Effects</a>).</p>\
  <h2>Reliability</h2>\
  The higher rated the enemy formation, the harder they are to break. The base reliability of an enemy formation is \
  determined by their skill level:\
  <blockquote><b>- Ultra-Green, or Green:</b> +1\
  <br><b>- Regular, or Veteran:</b> no modifier\
  <br><b>- Elite, Heroic, or Legendary:</b> -1</blockquote>\
  <p>In terms of reliability modifiers only, Clan formations increase their effective experience level by 1, up to a \
  maximum of Legendary.</p>\
  <p>Next, we adjust for special faction considerations. If the enemy faction is Rebel, Mercenary, Pirate, or from a \
  Minor Faction, their reliability modifier is increased by 1 (more likely to break). Otherwise, if the enemy faction \
  is Clan, their reliability modifier is decreased by 1 (less likely to break). This means Clan formations receive two \
  modifiers to their reliability; this is intentional.</p>\
  <h2>Performance</h2>\
  Performance plays an important part in determining whether the enemy formation adjusts their morale. Every \
  scenario on the contract dated within the past month scores points (scenarios not yet found on the StratCon map do \
  not count):\
  <blockquote><b>- Decisive Victory:</b> 2 victory points\
  <br><b>- Victory:</b> 1 victory point\
  <br><b>- Pyrrhic Victory:</b> 1 victory point and 1 defeat point\
  <br><b>- Draw:</b> nothing\
  <br><b>- Defeat:</b> 1 defeat point\
  <br><b>- Fleet in Being</b> (formations deployed, but the scenario left unfought): 1 defeat point\
  <br><b>- Decisive Defeat:</b> 2 defeat points\
  <br><b>- Refused Engagement</b> (a scenario left unanswered): 2 defeat points</blockquote>\
  <p>The month is then rated by the margin between the two:\
  <blockquote><b>- Decisive Victory:</b> victory points exceed defeat points by 3 or more (default modifier +3)\
  <br><b>- Victory:</b> victory points exceed defeat points by 1 or 2 (default modifier +2)\
  <br><b>- Draw:</b> the points are level (no modifier)\
  <br><b>- Defeat:</b> defeat points exceed victory points by 1 or 2 (default modifier -2)\
  <br><b>- Decisive Defeat:</b> defeat points exceed victory points by 3 or more (default modifier -3)</blockquote>\
  <p>The modifiers can be changed in Campaign Options. The Briefing Room shows the month so far as the contract's \
  <b>Battle Record</b>: the rating the next check would give, followed by the victory and defeat points behind it. \
  While the enemy is Dominating or Overwhelming, it also warns that a setback is due.</p>\
  <h2>Escalation</h2>\
  On contracts that track <a href='GLOSSARY:ESCALATION'>Escalation</a>, every morale check is followed by an \
  Escalation roll, which may move the enemy's morale a further level.\
  <h2>Scenarios That Move Morale</h2>\
  Some scenarios move the enemy's morale directly, one level, as soon as they are resolved and with no roll. They are \
  marked <b>(Affects Morale)</b> in the Briefing Room. An overall victory moves the enemy one level towards Scattered, \
  and an overall defeat moves them one level towards Overwhelming.\
  <blockquote><b>- Official Challenges</b> and scenarios that affect morale both ways: victory or defeat\
  <br><b>- Riots:</b> victory or defeat, but only on a <a href='GLOSSARY:MISSION_TYPE_RIOT_DUTY'>Riot Duty</a> \
  contract\
  <br><b>- Scenarios that affect morale on victory:</b> victory only\
  <br><b>- Scenarios that affect morale on defeat,</b> and Prisoner Liberation scenarios: defeat only</blockquote>\
  <h2>Other Changes to Morale</h2>\
  <blockquote><b>- Emergency extension:</b> when an employer invokes the emergency clause to extend a contract, the \
  enemy's morale jumps 1 to 6 levels (half of 2d6), up to Overwhelming.\
  <br><b>- Intel breach:</b> whenever prisoners are set free, there is a chance (the number freed, out of 50) that \
  they pass intelligence to the enemy, raising the enemy's morale by one level on a random active contract. Contracts \
  whose enemy is already Overwhelming, or that are <a href='GLOSSARY:GARRISON_RAIDS'>Peaceful</a>, are never \
  chosen.\
  <br><b>- Bartering:</b> this prisoner event raises the enemy's morale by one level on a random active contract whose \
  enemy is not already Overwhelming.\
  <br><b>- Leading the Resistance:</b> when an employer loses the planet and you stay behind to lead the resistance, \
  the new contract begins with the enemy Advancing.</blockquote>\
  <p>For how the enemy's morale shapes a contract, see <a href='GLOSSARY:MORALE_EFFECTS'>Morale Effects</a>. For the \
  raids on garrison-type contracts, see <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>.</p>
MORALE_EFFECTS.title=Morale Effects
MORALE_EFFECTS.definition=The enemy's <a href='GLOSSARY:MORALE'>morale</a> shapes much of what happens on a \
  contract: the higher it is, the more often and the harder the enemy strikes, and the costlier the war becomes.\
  <p><b>Monthly setback:</b> once each monthly morale check is done, an enemy that has the upper hand costs your \
  employer ground. Against an <b>Overwhelming</b> enemy, the contract loses \
  <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory Points</a> equal to 10% of its target (rounded up, and \
  at least 1), and one point of employer support per combat team of its scale. Against a <b>Dominating</b> enemy, it \
  loses one or the other, picked at random. Support never falls below zero. In mapless mode, where Campaign Victory \
  Points are worked out from your scenarios rather than kept, only support is lost. On a garrison-type \
  contract the setback only follows a month in which the enemy raided, as only those months bring a morale check.\
  </p>\
  <p><b>Encounters:</b> the enemy's morale shifts each sector's chance of a scenario when you deploy, as shown by the \
  sector's threat level on the StratCon tab:\
  <blockquote>Scattered: -15%, Critical: -10%, Weakened: -5%, Stalemate: no change, Advancing: +5%, \
  Dominating: +20%, Overwhelming: +50%</blockquote>\
  <p><b>Crisis scenarios:</b> the higher the enemy's morale, the likelier a new scenario is to be a \
  <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a>. Turning Points, Official Challenges, and special scenarios never are.\
  <blockquote>Scattered: 1 in 7, Critical: 1 in 6, Weakened: 1 in 5, Stalemate: 1 in 4, Advancing: 1 in 3, \
  Dominating: 1 in 2, Overwhelming: every scenario</blockquote>\
  <p><b>A beaten enemy:</b> against a Scattered enemy, every new scenario carries both the <b>Low Ammunition</b> and \
  <b>Poor Repair</b> modifiers, so the enemy's units start short of ammunition and with unrepaired armor damage. \
  Against a Critical enemy, every new scenario carries one of the two, picked at random. Official Challenges and civil \
  unrest (riots, and disrupted parades) are not the enemy's fight, so they never carry these modifiers.</p>\
  <p><b>Reinforcements:</b> the enemy's morale is added to the target number for reinforcing a scenario, from -3 \
  (Scattered) to +3 (Overwhelming). If the reinforcement check fails, the chance the reinforcements are intercepted \
  follows the sector's encounter chance (see Encounters, above).</p>\
  <p><b>Facilities left to the employer:</b> when the employer defends one of their facilities against a counterattack \
  you let go, the enemy's morale counts against them, from +3 (Scattered) to -3 (Overwhelming).</p>\
  <p><b><a href='GLOSSARY:RESUPPLY'>Resupply</a>:</b> the higher the enemy's morale, the likelier your convoys are to \
  be intercepted, the likelier smugglers are to swindle you (from never against a Scattered enemy, to 6 in 10 \
  against an Overwhelming one), and the more your employer charges for supplies, from a quarter of their value \
  (Scattered) to 175% (Overwhelming). Morale does not change the price when your employer is your own faction and you \
  are not a mercenary or pirate force, as supplies are then free; nor of smuggled supplies, which always cost double, \
  or of looted ones, which cost nothing.</p>\
  <p>See also <a href='GLOSSARY:MORALE'>Morale</a> and <a href='GLOSSARY:GARRISON_RAIDS'>Garrison Raids</a>.</p>
MOTHBALLING.title=Mothballing
MOTHBALLING.definition=<p>Mothballing packs a unit away for storage or shipping. A mothballed unit needs no \
  <a href='GLOSSARY:MAINTENANCE'>maintenance</a> and can't be used until it is activated again. Mothball units you \
  don't need for a while, or units you are moving between star systems.</p>\
  <h2>Mothballing and Activating</h2>\
  <p>Right-click a unit in the Hangar and choose <b>Mothball...</b>, or <b>Activate...</b> to bring it back. Select \
  several units to do them all at once. Either way, you pick the tech who does the work:</p>\
  <p>- Mothballing takes 960 minutes of the tech's time (two full working days), and activating takes 480.\
  <br>- Infantry take 480 minutes either way.\
  <br>- DropShips and JumpShips take 480 minutes for every 500 tons, rounded up, and can only be activated with \
  an engineer aboard.</p>\
  <p>A tech still works on the units they maintain first each day, so the job may take longer. <b>Cancel \
  Mothballing/Activation</b> stops a job part way through. In <a href='GLOSSARY:GM_MODE'>GM Mode</a>, the GM Mode \
  submenu mothballs or activates at once.</p>\
  <h2>What Changes</h2>\
  <p>A unit leaves its formation in the TO&amp;E as soon as mothballing starts, and its crew and tech are removed \
  once it is finished. If it carries other units, its bays stop counting toward your transport capacity. A \
  mothballed unit is counted as cargo, by weight, rather than needing a bay of its own.</p>\
  <p>If <b>Save Unit State Before Mothballing</b> is ticked in MekHQ Options (it is by default), the unit remembers \
  its crew and formation. When it is activated, they are put back where possible.</p>\
  <h2>Travel</h2>\
  <p>When you travel, MekHQ can mothball your units for the journey. When you accept a contract, tick \
  <b>Mothball Units on Departure</b>. When you travel without a contract, you are asked when you press \
  <b>Begin Transit</b> on the Navigation tab. Every unit in your \
  TO&amp;E that is free to be mothballed is packed away at once, except large craft such as DropShips. They are \
  activated again automatically when you arrive. Units that are destroyed, being refitted or under repair are \
  left as they are.</p>\
  <p>Two MekHQ Options can keep some units active for the trip: <b>Don't Mothball Units in Bays When \
  Travelling</b> (units with a ship <a href='GLOSSARY:TRANSPORT_ASSIGNMENTS'>transport assignment</a>) and \
  <b>Don't Mothball Salvage When Travelling</b>.</p>\
  <p>A mothballed unit needs no upkeep or maintenance on the journey. However, it no longer counts as a unit when \
  transport costs are worked out, so the extra cargo may change what the trip costs.</p>\
  <h2>Arriving Mothballed</h2>\
  <p>If <b>Deliver Units Mothballed</b> is ticked on the Unit Market options page, units bought from the Unit Market \
  arrive mothballed and must be activated before use.</p>
### N
MUL_FILES.title=MUL Files
MUL_FILES.definition=<p>A MUL file is a MegaMek unit list: a file holding units along with their crews and damage. \
  MekHQ uses them to move units into and out of MegaMek games it doesn't run itself, such as a tabletop game, a game \
  hosted by someone else, or a <a href='GLOSSARY:COOP_CAMPAIGNS'>co-op</a> game run by a GM.</p> <h2>Exporting</h2> \
  <p>Select a scenario in the Briefing Room and press <b>Export MUL File</b>. MekHQ saves the units deployed to it, \
  warning you about any it can't deploy. It then offers a separate file for each set of allied units and each <a \
  href='GLOSSARY:MANUAL_SCENARIOS'>bot formation</a> in the scenario.</p> <p>In MegaMek, add the units to a game \
  with <b>Load MUL file...</b> in the lobby. <b>Print Sheets</b> prints record sheets for the same units, for \
  tabletop play.</p> <h2>After the Game</h2> <p>When a MegaMek game ends, MegaMek asks whether to save a record of \
  all units, including salvage, to a file. Save it. Back in MekHQ, select the scenario and press <b>Resolve \
  Manually</b>, then choose that file as the <b>Battle Record File</b>. MekHQ matches the units in it to your own, \
  then opens the usual Resolve Scenario wizard for damage, casualties, salvage and prisoners.</p> <p>A game started \
  from MekHQ with <b>Start Game</b> or <b>Join Game</b> doesn't need this: it is resolved automatically when the \
  game ends.</p>
NAVIGATION_INFIRMARY.title=Infirmary Shortcuts
NAVIGATION_INFIRMARY.definition=The Infirmary has some really useful shortcuts that can help you tend to your personnel\
 \ quickly and efficiently.\
 <p>- <b>Double Left Mouse Button:</b> Jumps straight to the character in the Personnel Tab. Useful if you want to\
 \ retire a permanently injured character or need to replace a <a href='GLOSSARY:MISSING_LIMBS'>missing limb</a>.\
 <br>- <b>Right Mouse Button:</b> This brings up the character's medical history.</p>
NAVIGATION_INTERSTELLAR_MAP.title=Interstellar Map Navigation
NAVIGATION_INTERSTELLAR_MAP.definition=The Interstellar Map has some really useful shortcuts that can help you chart\
 \ your way across the stars.\
 <p>- <b>Left Mouse Button Drag:</b> Hold down the left mouse button and drag to move the camera.\
 <br>- <b>Mouse Wheel:</b> zoom in and out.\
 <br>- <b>Single Left Mouse Button:</b> this will select a system.\
 <br>- <b>Double Left Mouse Button:</b> this will select a system and jump to the solar system view, which allows you\
 \ to select specific planets.\
 <br>- <b>Alt/Option + Left Mouse Button:</b> this will calculate a jump path to the selected system.\
 <br>- <b>Shift + Left Mouse Button:</b> this will add a jump to the existing jump path. This is useful if you want to\
 \ make a detour on your way to your final destination, or manually plot a route.</p>\
  <p>If you want to manually path into an <a href='GLOSSARY:EMPTY_SYSTEMS'>empty system</a>, make sure you don't have\
  \ the checkbox to avoid empty systems ticked.</p>
NEW_PLAYER_GUIDE.title=The New & Returning Player Guide
NEW_PLAYER_GUIDE.definition=MekHQ is a complicated beast, and it's easy to get overwhelmed. This entry gets a \
  new campaign running and points you to the Glossary entries for each part of the game. If you're returning after \
  a few releases, the same entries cover what has changed.\
  <p>MekHQ also explains itself as you go. Hover over almost any control for a tooltip. Most main tabs have a row of \
  Glossary links for the things on that tab. Many dialogs, such as the Contract Market, Personnel Market, \
  Training Console and Crew Assignment, have a guide button that walks you through them.</p>\
  <h2>Starting a Campaign</h2>\
  <p>You don't need to build your first company by hand. There are two ways in:</p>\
  <p>- <b>New Player Quickstart</b>, on the startup screen, builds everything for you. You get a mercenary 'Mek \
  company of three lances with its techs, doctors, administrators, support vehicles, spare parts and starting \
  C-Bills. It starts on Galatea on 1 January 3151 with the <i>New Players Start Here</i> rules. All that's left is to \
  pick your first contract.\
  <br>- <b>New Campaign</b> lets you choose the rules, the start date and the faction yourself. Pick a preset: \
  <i>New Players Start Here</i> if you're new to MekHQ, or <i>Veteran Experience</i> for the full game. \
  <b>Start</b> asks only for the essentials, while <b>Customize</b> shows every option first. When the campaign \
  opens, press the yellow <b>Generate Starting Command</b> button on the main screen to build your company with the \
  <a href='GLOSSARY:COMMAND_GENERATOR'>Command Generator</a>. The button disappears as soon as anyone is hired or \
  anything is bought, so use it first.</p>\
  <p>Nothing you choose here is permanent. Every rule can be changed later in <i>File &gt; Campaign Options</i>, \
  where you can also load a different preset.</p>\
  <h2>Finding Your Way Around</h2>\
  <p>- <b>Command Center:</b> the daily report, the procurement list, your force's summary and its reports. See \
  <a href='GLOSSARY:FORCE_REPUTATION'>Force Reputation</a> and <a href='GLOSSARY:PARTS_IN_USE'>Parts in Use</a>.\
  <br>- <b>Navigation:</b> the interstellar map, used to plan and make journeys. See \
  <a href='GLOSSARY:NAVIGATION_INTERSTELLAR_MAP'>Interstellar Map Navigation</a>.\
  <br>- <b>TO&amp;E:</b> how your units are organized into formations. See <a href='GLOSSARY:TOE'>The TO&amp;E</a>, \
  <a href='GLOSSARY:COMBAT_TEAMS'>Combat Teams</a> and <a href='GLOSSARY:TRANSPORT_ASSIGNMENTS'>Transport \
  Assignments</a>.\
  <br>- <b>Briefing Room:</b> your contracts and their scenarios. See \
  <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Contracts and Missions</a>.\
  <br>- <b>Area of Operations:</b> the StratCon map for the contract you're on. See \
  <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a>.\
  <br>- <b>Personnel:</b> everyone in your company. The <b>Training Console</b> button spends their XP. See \
  <a href='GLOSSARY:PROFESSIONS'>Professions</a>, <a href='GLOSSARY:QUICK_TRAIN'>Quick Train</a> and \
  <a href='GLOSSARY:EDUCATION'>Education</a>.\
  <br>- <b>Hangar:</b> your units, their crews and the techs who maintain them. See \
  <a href='GLOSSARY:VEHICLE_CREWS'>Vehicle &amp; Vessel Crews</a>, <a href='GLOSSARY:MAINTENANCE'>Maintenance</a>, \
  <a href='GLOSSARY:MOTHBALLING'>Mothballing</a> and <a href='GLOSSARY:REFITS'>Refits</a>.\
  <br>- <b>Repair Bay:</b> repairing and salvaging units. See \
  <a href='GLOSSARY:STRIPPING_AND_REPAIRING'>Stripping &amp; Repairing a Unit</a>, \
  <a href='GLOSSARY:MASS_REPAIR_MASS_SALVAGE'>Mass Repair, Mass Salvage</a> and \
  <a href='GLOSSARY:TECH_TIME'>Technician Available Minutes</a>.\
  <br>- <b>Warehouse:</b> spare parts, ammunition and armor. See \
  <a href='GLOSSARY:BUYING_UNITS_AND_PARTS'>Buying Units and Parts</a> and \
  <a href='GLOSSARY:DAMAGED_PARTS'>Damaged Parts</a>.\
  <br>- <b>Infirmary:</b> treating the injured. See <a href='GLOSSARY:HOSPITAL_BEDS'>Doctor &amp; MASH Theater \
  Capacity</a>.\
  <br>- <b>Finances:</b> your accounts and loans.\
  <br>- <b>Mek Lab:</b> customizing a unit. See <a href='GLOSSARY:REFITS'>Refits</a>.</p>\
  <p>Along the top of the window are the markets, the <a href='GLOSSARY:ORACLE'>Roleplay Engine &amp; Journal</a>, \
  the controls for passing time and the <a href='GLOSSARY:GM_MODE'>GM Mode</a> switch. The \
  <b>Marketplace</b> menu holds the <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a> (under \
  Recruitment), the Contract Market, the <a href='GLOSSARY:UNIT_MARKET'>Unit Market</a> and the purchase \
  dialogs.</p>\
  <h2>Passing Time</h2>\
  <p>Nothing happens until you advance time. <b>Advance Day</b> moves the campaign on one day. The button beside \
  it advances several days at once: to the next week, month, quarter, year or five years, or by a number of days \
  you choose. Each day is still played out in turn. Orders are rolled for, techs maintain and repair, the injured \
  heal and the markets refresh, and the daily report records what happened. A multi-day advance stops early if \
  something would stop a single day, such as a scenario that is due today.</p>\
  <p>New contract offers arrive on the first day of each month while your company is on a planet. The Contract \
  Market is closed while you hold an active or pending contract.</p>\
  <h2>Your First Contract</h2>\
  <p>A contract generally runs like this:</p>\
  <ol><li>Choose an offer in the Contract Market. It has its own guide to reading and negotiating offers.</li> \
  <li>Accept it. You can mothball your units for the trip and book the journey as you accept.</li> \
  <li>Travel to the contract's system. Use the time to repair, restock and organize your \
  <a href='GLOSSARY:COMBAT_TEAMS'>Combat Teams</a>.</li> \
  <li>On arrival, give each Combat Team a <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a> in the Briefing \
  Room.</li> \
  <li><a href='GLOSSARY:STRATCON'>StratCon</a> generates scenarios. Choose which to fight, \
  <a href='GLOSSARY:HOW_TO_DEPLOY'>deploy</a> to them and play them in MegaMek, or use \
  <a href='GLOSSARY:AUTO_RESOLVE'>Auto Resolve</a>.</li> \
  <li><a href='GLOSSARY:RESOLVING_SCENARIOS'>Resolve each scenario</a>, then repair, rearm and heal before the \
  next one.</li> \
  <li>When the contract ends, complete it in the Briefing Room and collect your pay.</li></ol>\
  <p>You can't fight every scenario, and you shouldn't try. See <a href='GLOSSARY:STRATCON_TIPS'>StratCon \
  Tips</a> for advice.</p>
### O
ORACLE.title=Oracle
ORACLE.definition=The Oracle stands in for a game master when you roleplay your campaign solo. Open it from the \
  Roleplay Engine &amp; Journal button beside Advance Day.\
  <p>Ask it a yes/no question about your story and pick how likely you think a Yes is. The Fate Chart rolls against \
  those odds and the current <a href='GLOSSARY:CHAOS_FACTOR'>chaos factor</a>, and answers Yes, No, Exceptional Yes \
  (yes, and more) or Exceptional No (no, and worse). Go with the first explanation of the answer that makes sense for \
  your story.</p>\
  <p>The Oracle console also holds <a href='GLOSSARY:PLOT_THREADS'>plot threads</a>, the \
  <a href='GLOSSARY:ORACLE_CAST'>cast</a>, <a href='GLOSSARY:ORACLE_CONCEPTS'>Concepts</a>, \
  <a href='GLOSSARY:ORACLE_CHECKS'>checks</a>, a dice roller and a journal that records \
  every result, along with the campaign's own events: contracts, ultimatums and cast members joining or \
  leaving. Each page has a guide button that explains it.</p>
ORACLE_CAST.title=Oracle Cast
ORACLE_CAST.definition=The cast is the list of people your solo roleplay story might involve: allies, rivals, \
  employers, contacts and members of your own company.\
  <p>When an <a href='GLOSSARY:ORACLE_RANDOM_EVENTS'>Oracle random event</a> is about an NPC, the Oracle picks \
  someone from the cast at random. Everyone in the cast has the same chance.</p>\
  <p>Add people by typing a name on the Cast page, pressing Generate for a random NPC with a rolled profile, or by \
  right-clicking someone in the Personnel tab and choosing Roleplay, then Add to Cast. People added from \
  Personnel stay linked, so their name follows any rename. Removing someone keeps \
  their journal history, and they can be restored. Someone removed can also be deleted for good: their journal \
  entries are kept, but no longer tagged with them.</p>
ORACLE_CHECKS.title=Oracle Checks
ORACLE_CHECKS.definition=The Checks page of the <a href='GLOSSARY:ORACLE'>Oracle</a> console rolls skill and \
  attribute checks for your roleplay scenes. Open it from the console, or right-click people in the Personnel tab and \
  choose Roleplay, then Perform Skill Check or Perform Attribute Check.\
  <p>A check rolls 2d6 against a target number; meeting or beating it succeeds, and the difference is the margin of \
  success. Natural aptitude rolls three dice and keeps the best two. Pick how hard the situation is, from Very easy \
  (\u22123) to Very hard (+4), and add any other modifier. Tick several people to roll the same check for each of \
  them. If the campaign uses Edge, someone who fails can spend a point to re-roll.</p>\
  <p>An opposed check pits two sides against each other, each rolling against their own target: the higher margin of \
  success wins and the defender wins a tie. A cast member with no stats rolls against a rating, from Ultra-green \
  (10+) to Legendary (4+). Only the losing side may re-roll with Edge, once.</p>\
  <p>Every check is saved in the journal, tagged with anyone from the <a href='GLOSSARY:ORACLE_CAST'>cast</a>, and \
  added to the daily report.</p>
ORACLE_CONCEPTS.title=Oracle Concepts
ORACLE_CONCEPTS.definition=Concepts are tables of word prompts for inspiration, rolled from the \
  <a href='GLOSSARY:ORACLE'>Oracle</a> console's Ask page.\
  <p>Use them when you know what happens but not the specifics. Roll one to three tables, from the Adventure, \
  Characters, Environments and Themes categories, and combine the words into an idea.</p>
ORACLE_RANDOM_EVENTS.title=Oracle Random Events
ORACLE_RANDOM_EVENTS.definition=When the <a href='GLOSSARY:ORACLE'>Oracle</a>'s Fate Chart roll is \
  11, 22, 33 and so on up to 99, or 100, something unexpected happens as well as the answer.\
  <p>A second roll picks the event's focus: a remote event, an ambiguous event, a new NPC, an NPC acting or being \
  helped or hurt, your character being helped or hurt, a <a href='GLOSSARY:PLOT_THREADS'>plot thread</a> moving \
  forward or back, or the current situation. NPC events pick someone from the \
  <a href='GLOSSARY:ORACLE_CAST'>cast</a>; thread events move a random open thread.</p>\
  <p>The <a href='GLOSSARY:CHAOS_FACTOR'>chaos factor</a> does not change how often random events happen.</p>
### P
PARTS_AVAILABILITY.title=Parts Availability
PARTS_AVAILABILITY.definition=If <i>Missions Influence Availability</i> is enabled in Campaign Options and you are using\
  \ <a href='GLOSSARY:STRATCON'>StratCon</a>, your procurement attempts are going to be modified depending on your\
  \ current contract. If you have multiple concurrent contracts, the most favorable (lowest) modifier is used.\
 <p>Parts Availability serves to represent the difficulty of acquiring resources on certain contracts. It is also used\
 \ to reflect your ability to hook into your employer's supply network. This means that on some contracts parts are going\
  \ to be more readily available than on others.</p>\
 <p>The modifiers are as follows. Remember that these modifiers are applied to the Target Number of your procurement\
 \ checks, so higher is worse than low.</p>\
 <p>- Assassination, Guerrilla Warfare: 3\
 <br>- Diversionary Raid, Extraction Raid, Objective Raid, Observation Raid, Recon Raid, Planetary Assault, Relief Duty: 2\
 <br>- Espionage, Mole Hunting, Sabotage, Black-Ops Insurgency, Pirate Hunting, Pirate Raid: 1\
 <br>- Cadre Duty: 0\
 <br>- Garrison Duty, Riot Duty, Security Duty, Retainer: -1</p>
PARTS_IN_USE.title=Parts in Use
PARTS_IN_USE.definition=This dialog shows all types of spare parts, mechanisms, weapons, armor, etc. used across your\
 \ campaign. This list also notes the amounts used. Sorting the list by the 'In Use' column will give you a good\
 \ impression of what parts are the most in demand. Normally, armor comes first, followed by heat sinks, gyros, and\
 \ weapons.\
 <p>Other columns tell you what surplus you already have, and how much it all weighs. 'Requested Stock Percentage' allows\
 \ you to set up <b>AutoLogistics</b>. When using AutoLogistics, your acquisitions personnel (usually Admin\
 \ characters) will buy the percentage of surplus parts indicated here either by your order or weekly.</p>\
 <p>To order the corresponding stock, you can click 'order parts to fill requested stock' to immediately stock up on\
 \ needed items.</p>\
 <p>Alternatively, you can enable weekly restocking by checking the 'Add Part Orders to Fill the Requested Stocks Weekly'\
 \ box. Keeping all parts on stock is usually a good strategy for repairs but will bloat your warehouse and risks ruining\
 \ your early budget.</p>
PERSONALITY_VALUE.title=Personality Value
PERSONALITY_VALUE.definition=<p>A character's Personality Value sums up how helpful their \
  <a href='GLOSSARY:RANDOM_PERSONALITIES'>personality traits</a> are. It is only used if <b>Assign Random \
  Personalities</b> is enabled.</p>\
  <p>Each Aggression, Ambition, Greed and Social trait adds to it:</p>\
  <p>- Positive minor trait: +1\
  <br>- Negative minor trait: -1\
  <br>- Positive major trait: +2\
  <br>- Negative major trait: -2</p>\
  <p>Quirks and <a href='GLOSSARY:TALENT'>Talent</a> do not count. Since characters are generated with at most \
  two traits, the value is usually between -4 and +4.</p>\
  <h2>Where It Is Used</h2>\
  <p>- <b>Command Rating:</b> if <b>Personality Influences Reputation</b> is enabled, your commander's Personality \
  Value is added to the Command Rating part of CamOps <a href='GLOSSARY:FORCE_REPUTATION'>Force Reputation</a>. \
  The Command Rating is never less than 1.\
  <br>- <b>Chaos Campaign Reputation:</b> if <b>Random Personality Affects Reputation</b> is enabled in the Chaos \
  Campaign Reputation options, each character's Personality Value is added to their Reputation.\
  <br>- <b>Event checks:</b> in random events such as Prisoner Events, the Personality Value of the character \
  making the check is applied to it. A positive value makes the check easier, and a negative value makes it \
  harder.</p>
PERSONNEL_MARKET.title=Personnel Market
PERSONNEL_MARKET.definition=<p>The Personnel Market is where your command finds new recruits. Open it from \
  <b>Marketplace &gt; Recruitment...</b>, the <b>Recruitment</b> button beside your current location, or the new \
  applicants link in the daily report. Which market you get is set by the <b>Recruitment Style</b> option in Campaign \
  Options, on the Recruitment Options page; see <a href='GLOSSARY:RECRUITMENT_STYLES'>Recruitment Styles</a>. If \
  recruitment is Disabled, the same menu item and button open the GM's bulk recruitment tool instead.</p> <h2>When \
  Applicants Arrive</h2> <p>A new set of applicants arrives on the first day of each month. One also arrives when a \
  campaign begins, and when your command arrives at a planet after travelling. Each new set replaces the old one, so \
  anyone you did not hire is gone.</p> <p>To build a set, the market makes a number of <a \
  href='GLOSSARY:RECRUIT_ROLLS'>Recruit Rolls</a>. Each roll can produce one applicant: their profession comes from \
  the style's <a href='GLOSSARY:APPLICANT_PROFESSIONS'>profession table</a>, their homeland from the factions in the \
  system (see <a href='GLOSSARY:APPLICANT_ORIGINS'>Applicant Origins</a>), and under the MekHQ style they must also \
  make a <a href='GLOSSARY:SHOW_OF_INTEREST'>Show of Interest</a>. Where you are and what you are doing can stop \
  recruitment altogether; see <a href='GLOSSARY:RECRUITMENT_RESTRICTIONS'>Recruitment Restrictions</a>.</p> <p>If \
  <b>Post a report when new recruits are available</b> is enabled, the daily report counts the new applicants at each \
  experience level. If any applicant has a rare profession, a message tells you which.</p> <h2>Using the Market</h2> \
  <ul> <li><b>Filters:</b> the left column has a search field, filters for all combat, support or civilian \
  applicants, and one for each combat or support profession on offer, each with a count. Below them are \
  checkboxes for applicants with special abilities, applicants with flaws, and each experience level. Ticking a \
  checkbox narrows the board to those applicants. Each count follows the search and your other filters. <b>Clear \
  filters</b> resets them all.</li> <li><b>Board:</b> one card per applicant, with their portrait, profession, age, \
  gender, experience, how many special abilities and flaws they have, their exam score, and what they cost to hire. A \
  cost in red is more than your current funds. Rare applicants are marked with a star. Sort the board by experience, \
  cost, abilities, flaws, exam score, role, name or age; clicking the chosen sort again reverses it.</li> \
  <li><b>Dossier:</b> the highlighted applicant's hiring cost and how it is made up, their \
  skills, abilities and flaws, origin, reputation, performance exam score and, if <a \
  href='GLOSSARY:RANDOM_PERSONALITIES'>Random Personalities</a> are enabled, the recruiter's interview notes. \
  Double-click an applicant, or use the link at the foot of the dossier, for their full personnel record.</li> \
  <li><b>Recruit:</b> click an applicant, or Ctrl- or Shift-click to pick several, then <b>Recruit</b>. Everyone \
  picked is hired only if your funds cover all of them; see <a href='GLOSSARY:HIRING_COSTS'>Hiring Costs</a>. In GM \
  mode, <b>Recruit (GM)</b> hires the picked applicants for free and <b>Add Applicant (GM)</b> adds one more \
  applicant to the board.</li> <li><b>Advance Days</b> closes the market, advances the calendar, and opens the market \
  again afterwards.</li> </ul> <h2>Related Options</h2> <p>All of these are on the Recruitment Options page of \
  Campaign Options.</p> <ul> <li><b>Applicant Multiplier:</b> multiplies the number of Recruit Rolls, and under the \
  MekHQ style the number of Dependents too. It is never treated as less than 0.1.</li> <li><b>Disable Civilian \
  Applicants:</b> no applicant has a civilian profession, and no Dependents are added.</li> <li><b>Disable Show of \
  Interest:</b> see <a href='GLOSSARY:SHOW_OF_INTEREST'>Show of Interest</a>.</li> <li><b>Recruit While On Military \
  Maneuvers:</b> see <a href='GLOSSARY:RECRUITMENT_RESTRICTIONS'>Recruitment Restrictions</a>.</li> </ul>
PRISONER_CAPACITY.title=Prisoner Capacity
PRISONER_CAPACITY.definition=<p>Prisoner Capacity is how many prisoners your security personnel can manage. It \
  matters most with the MekHQ capture style, where going over it risks <a href='GLOSSARY:PRISONER_EVENTS'>Prisoner \
  Events</a>. With the Campaign Operations capture style it is tracked, but going over it has no effect.</p> \
  <h2>Capacity</h2> <p>Only units in <a href='GLOSSARY:FORCE_TYPE_SECURITY'>Security Forces</a> provide capacity, \
  and only while they are available. Aerospace units, including fighters, Small Craft and DropShips, provide \
  none.</p> <table><tr><th>Source</th><th>MekHQ</th><th>Campaign Operations</th></tr> <tr><td>Each uninjured \
  conventional infantry soldier</td><td>5</td><td>15</td></tr> <tr><td>Each working battle armor \
  suit</td><td>20</td><td>60</td></tr> <tr><td>Each other undamaged unit</td><td>+5%, up to \
  +25%</td><td>None</td></tr> <tr><td>Each rented holding cell</td><td>35</td><td>35</td></tr></table> <p>Temporary \
  infantry and battle armor crew count as uninjured soldiers or working suits. Holding cells are rented through a \
  contract's terms and are added after every other adjustment.</p> <h2>Temporary Capacity</h2> <p>With the MekHQ \
  capture style, capacity is also multiplied by a hidden Temporary Capacity, normally 100%. Prisoner Events and \
  executions raise or lower it, but it never drops below 25%. Each Monday it moves 2 points back towards 100%. It \
  resets to 100% when you complete your last active contract. Ticking <b>Reset Prisoner Capacity Reductions</b> in \
  campaign options also resets it straight away.</p> <h2>Capacity Used</h2> <p>Each prisoner uses 1 capacity; \
  bondsmen and those becoming bondsmen use none. With the MekHQ capture style, an injured prisoner with no doctor \
  assigned uses 2. The doctor's skill doesn't matter.</p>
PHENOTYPE.title=Phenotype
PHENOTYPE.definition=A Clan warrior's phenotype records whether they were bred for a role, and which.\
  <p><b>Trueborn</b> warriors are grown in iron wombs from a \
  <a href='GLOSSARY:BLOODHOUSE'>Bloodhouse</a>'s genetic legacy and tailored to a specific machine - MekWarrior, \
  Elemental, Aerospace, or ProtoMek. Elementals are built massive for battle armour; Aerospace and ProtoMek \
  phenotypes are bred small and wired for high acceleration. Only a trueborn may compete for a \
  <a href='GLOSSARY:BLOODNAME'>Bloodname</a>.</p>\
  <p><b>Freeborn</b> warriors are born naturally and carry no phenotype. They are looked down on in most Clans and \
  have no Bloodhouse, though a few Clans allow them to test for a Bloodname on merit.</p>\
  <h2>Effects on Attributes</h2>\
  <p>Each Phenotype modifies a new character's starting <a href='GLOSSARY:ATTRIBUTE_SCORES'>Attribute Scores</a> \
  and sets the highest each attribute can go. Vehicle and Naval phenotypes use the MekWarrior values.</p>\
  <table><tr><th>Phenotype</th><th>Starting Modifiers</th><th>Maximums</th></tr> \
  <tr><td>MekWarrior</td><td>RFL +1, DEX +1</td><td>STR 8, BDY 8, RFL 9, DEX 9, INT 8, WIL 8, CHA 9, EDG \
  8</td></tr> <tr><td>Elemental</td><td>STR +2, BDY +1, DEX -1</td><td>STR 9, BDY 9, RFL 8, DEX 7, INT 8, WIL 9, \
  CHA 8, EDG 8</td></tr> <tr><td>Aerospace and ProtoMek</td><td>STR -1, BDY -1, RFL +2, DEX +2</td><td>STR 7, BDY \
  7, RFL 9, DEX 9, INT 9, WIL 8, CHA 8, EDG 8</td></tr> <tr><td>Freeborn (none)</td><td>None</td><td>All 8, \
  except CHA 9</td></tr></table>\
  <p>If SPAs are enabled, new Elementals also gain the Toughness SPA, and new Aerospace and ProtoMek warriors gain \
  the Glass Jaw SPA.</p>
PLOT_THREADS.title=Plot Threads
PLOT_THREADS.definition=A plot thread is an ongoing storyline in your solo roleplay campaign: a mystery, a \
  rivalry, a debt or a goal.\
  <p>Each thread has a track of 10, 15 or 20 steps, and every step hides prompts rolled in secret when the thread is \
  created. Reveal the next step whenever it makes narrative sense for the storyline to move forward, or when an \
  <a href='GLOSSARY:ORACLE_RANDOM_EVENTS'>Oracle random event</a> does it for you.</p>\
  <p>Every fifth step is a flashpoint: a Major Revelation drawn from the Revelation, Secret and Twist tables. The \
  final step is always the conclusion instead, drawn from the Stakes, Cost and Aftermath tables, so a 10-step \
  thread has one flashpoint (step 5) and a 20-step thread has three (steps 5, 10 and 15).</p>
PRISONERS_OF_WAR.title=Prisoners of War
PRISONERS_OF_WAR.definition=<p>When a battle ends, people go missing on both sides. Enemy personnel you find become \
  your prisoners, and the enemy may take your own people. How this works depends on the <b>Capture Style</b> \
  campaign option, on the Prisoners &amp; Civilians page.</p> <h2>Capture Styles</h2> <p>- <b>Disabled:</b> no \
  prisoners are taken. Your people who would have been captured go <a href='GLOSSARY:MISSING_IN_ACTION'>Missing in \
  Action</a> instead. <br>- <b>Campaign Operations:</b> prisoners are taken through <a \
  href='GLOSSARY:SEARCH_AND_RESCUE'>Search and Rescue</a>. <a href='GLOSSARY:PRISONER_CAPACITY'>Prisoner \
  Capacity</a> is tracked, but going over it has no effect, and what happens to your prisoners is up to you. This is \
  the closest to the official rules. <br>- <b>MekHQ:</b> as Campaign Operations, plus <a \
  href='GLOSSARY:PRISONER_EVENTS'>Prisoner Events</a>, ransom offers, defections and a stricter Prisoner Capacity. \
  It suits campaigns that use MekHQ as the game master.</p> <p>See <a href='GLOSSARY:PRISONER_CAPTURE'>Capturing \
  Prisoners</a> for what happens when someone is captured, and <a href='GLOSSARY:PRISONER_MISSION_END'>Prisoners at \
  Contract End</a> for how prisoners are settled when a contract finishes.</p> <h2>Prisoner Status</h2> <p>Prisoners \
  are marked in the personnel roster by a title after their name:</p> <p>- <b>Prisoner:</b> an ordinary prisoner. \
  <br>- <b>Prisoner*:</b> a prisoner willing to defect. You can recruit them. <br>- <b>Becoming Bondsman:</b> a Clan \
  prisoner on the way to becoming your bondsman. <br>- <b>Bondsman:</b> a Clan bondsman. Bondsmen are no longer \
  counted as prisoners.</p> <h2>Handling Prisoners</h2> <p>Right-click prisoners in the Personnel tab to:</p> <p>- \
  <b>Free</b> them, while you are on a planet. With the MekHQ capture style, freed prisoners may pass intelligence \
  to the enemy: the chance is the number freed out of 50, and a breach raises the enemy's <a \
  href='GLOSSARY:MORALE'>Morale</a> by one level on a random active contract. <br>- <b>Execute</b> them on a planet, \
  or <b>Jettison</b> them in space. Both count as executions; see <a href='GLOSSARY:PRISONER_EVENTS'>Prisoner \
  Events</a>. <br>- <b>Recruit</b> prisoners who are willing to defect. <br>- <b>Adopt (Abtakha)</b> bondsmen, \
  freeing them. Clan campaigns only.</p> <p>In GM Mode, the GM menu can also ransom prisoners for their full ransom \
  value, or buy back your own people for theirs.</p> <h2>Your People in Enemy Hands</h2> <p>Your personnel held by \
  the enemy have the POW status and take no part in your campaign. You can get them back through ransom offers (see \
  <a href='GLOSSARY:PRISONER_EVENTS'>Prisoner Events</a>) and when the contract ends.</p> <p>If <b>Enable \
  Player-Character Prison Escapes</b> is on, each of your people held by the enemy tries to escape on the first of \
  each month. They need at least one of the Escape Artist, Disguise, Forgery, Acting or Sleight of Hand skills, and \
  use their best one:</p> <p>- Succeeding by 3 or more: they escape and return to duty. <br>- Failing by 5 or 6: \
  they are hurt, taking hits equal to half a d6. <br>- Failing by 7 or more: they are badly hurt, taking hits equal \
  to half of 2d6. <br>- Anything else: nothing happens.</p> <p>Injuries from a failed escape can kill. A character \
  with the <b>Use Edge for Escape Attempt Failure</b> <a href='GLOSSARY:EDGE'>Edge</a> trigger can spend Edge to \
  reroll a failed attempt.</p>
PRISONER_CAPTURE.title=Capturing Prisoners
PRISONER_CAPTURE.definition=<p>When a scenario ends, whichever side holds the battlefield searches for missing \
  personnel using <a href='GLOSSARY:SEARCH_AND_RESCUE'>Search and Rescue</a>. If you hold it, you search for the \
  enemy's missing; if the enemy holds it, they search for yours. Anyone picked up during the scenario is captured \
  automatically. The resolve wizard fills in who was captured, and you can change it.</p> <p>This page assumes the \
  Capture Style campaign option is not Disabled; see <a href='GLOSSARY:PRISONERS_OF_WAR'>Prisoners of War</a>.</p> \
  <h2>Your Missing Personnel</h2> <p>- <b>You held the battlefield:</b> they go <a \
  href='GLOSSARY:MISSING_IN_ACTION'>Missing in Action</a>, and you search for them each day. <br>- <b>The enemy held \
  it and found them:</b> they are captured. <br>- <b>The enemy held it and didn't find them:</b> they go Missing in \
  Action. In space, they are killed instead.</p> <h2>Clan Prisoners</h2> <p>A Clan prisoner taken by a Clan may \
  become a bondsman. Roll a d6 against the honour rating of the prisoner's own Clan: a Strict rating always \
  succeeds, an Opportunistic rating needs 5 or more, and a Liberal rating never does. A Clan's honour rating can \
  change in 3053 or 3054, after the Clan Invasion.</p> <p>- An enemy who succeeds is Becoming Bondsman for d6 weeks, \
  then becomes your Bondsman. <br>- One of your people who succeeds becomes the enemy's bondsman and leaves your \
  campaign. <br>- Anyone who fails becomes an ordinary prisoner.</p> <p>With the MekHQ capture style, a Clan \
  prisoner may instead perform <b>Bondsref</b>, choosing death over captivity. This happens on 1 in 36 when taken by \
  a Clan, before the bondsman roll, and on 1 in 6 when taken by anyone else.</p> <h2>Draconis Combine Prisoners</h2> \
  <p>With the MekHQ capture style, a prisoner from the Draconis Combine commits seppuku on 1 in 36.</p> \
  <h2>Defection</h2> <p>With the MekHQ capture style, newly captured prisoners may defect to their captors:</p> \
  <table><tr><th>Prisoner</th><th>Chance</th></tr> <tr><td>Most prisoners</td><td>1 in 100</td></tr> <tr><td>From a \
  mercenary faction</td><td>1 in 80</td></tr> <tr><td>Clan, captured by mercenaries or pirates</td><td>1 in \
  500</td></tr></table> <p>An enemy who defects becomes a Prisoner* you can recruit or, if they are Clan, starts \
  Becoming Bondsman. Enemy prisoners never defect to a Clan campaign. One of your people who defects leaves your \
  campaign, or becomes the enemy's bondsman if they are Clan.</p> <p>Enemy prisoners who are not becoming bondsmen \
  start with low <a href='GLOSSARY:LOYALTY'>Loyalty</a>: the lowest three of 4d6.</p> <h2>Hostile Facilities</h2> \
  <p>If you hold the battlefield after a StratCon hostile facility scenario, you also capture its staff: 3d6 support \
  personnel, 5d6 guards and a d6 civilians. They have the enemy's skill level, and some may be injured.</p>
PRISONER_EVENTS.title=Prisoner Events
PRISONER_EVENTS.definition=<p>With the MekHQ capture style, holding <a \
  href='GLOSSARY:PRISONERS_OF_WAR'>prisoners</a> during a contract leads to events. They only happen while you hold \
  at least one prisoner and have an active contract.</p> <h2>Ransom Offers</h2> <p>On the first of each month there \
  is a 1 in 6 chance (10 or more on 2d6) of a ransom offer. If the enemy holds any of your people, a further 1 in 6 \
  makes it an offer to return them; otherwise the enemy offers to buy back its own.</p> <p>- <b>Enemy prisoners:</b> \
  the enemy offers to buy back a tenth of your prisoners (rounded up), most experienced first, for a fifth of their \
  ransom value. <br>- <b>Your people:</b> the enemy offers to return a tenth of them (rounded up), chosen at random, \
  for ten times their ransom value. The offer is only made if you can afford it.</p> \
  <table><tr><th>Experience</th><th>MekWarrior or Aerospace Pilot</th><th>Other Roles</th></tr> \
  <tr><td>None</td><td>2,500</td><td>1,250</td></tr> <tr><td>Ultra-Green</td><td>5,000</td><td>2,500</td></tr> \
  <tr><td>Green</td><td>10,000</td><td>5,000</td></tr> <tr><td>Regular</td><td>25,000</td><td>10,000</td></tr> \
  <tr><td>Veteran</td><td>50,000</td><td>25,000</td></tr> <tr><td>Elite</td><td>100,000</td><td>50,000</td></tr> \
  <tr><td>Heroic</td><td>150,000</td><td>100,000</td></tr> \
  <tr><td>Legendary</td><td>200,000</td><td>150,000</td></tr></table> <p>Ransom values are in C-bills. Ransoms at <a \
  href='GLOSSARY:PRISONER_MISSION_END'>contract end</a> and in GM Mode use them unchanged.</p> <h2>Overcrowding</h2> \
  <p>Every other Monday, MekHQ compares the capacity your prisoners use with your <a \
  href='GLOSSARY:PRISONER_CAPACITY'>Prisoner Capacity</a>. The overflow is the excess, as a percentage of your \
  capacity. If there is no overflow and you hold fewer than 25 prisoners, nothing happens. Otherwise, roll 0 to 49: \
  an event happens if the roll is below the overflow, or is 0. If you hold more than 25 prisoners, a second roll \
  made the same way turns it into a major event.</p> <p>This means 25 or more prisoners carry a 1 in 50 chance of an \
  event even within capacity.</p> <p>If you are over capacity but no event happens, your security commander warns \
  you and offers three choices: do nothing; free enough prisoners to cover the overflow plus 10%; or execute a tenth \
  of your prisoners (at least 1).</p> <h2>Minor and Major Events</h2> <p>There are 50 minor events, such as guards \
  getting too close to prisoners, hunger strikes and disputes, and 10 major events, such as riots, fires, poisonings \
  and murders. Each offers three responses, and can't be dismissed.</p> <p>The event is presented by the leader of a \
  random Security Force, or by your senior administrator if there is none. Each response is secretly Positive (-3 to \
  the target number), Neutral (0) or Negative (+3). Most responses call for a skill or attribute check by the \
  presenter, shown on the button; the rest are a 2d6 roll against 7. Both include the hidden modifier and, with \
  Random Personalities on, the presenter's <a href='GLOSSARY:PERSONALITY_VALUE'>Personality Value</a>. Success gives \
  the better of the response's two outcomes, and failure the worse. Some events have no good outcome, only less bad \
  ones.</p> <p>Outcomes include changes to Temporary Capacity, injuries, deaths, escapes, Loyalty, fatigue and \
  support points. Escaped prisoners leave your campaign. The chance that they arm themselves is 1% per escapee. If \
  they do, an Intercept the Escapees scenario is added to a random active StratCon contract.</p> <h2>Executing \
  Prisoners</h2> <p>Whenever you execute prisoners, whether after a warning, from the Personnel tab or by \
  jettisoning them in space:</p> <p>- Roll a d6. On a 1 the executions backfire, lowering Temporary Capacity by 2 \
  points per prisoner executed. Otherwise they cow the rest, raising it by 2 points per prisoner. <br>- The chance \
  that someone notices is 1% per prisoner executed. If they do, your <a \
  href='GLOSSARY:FORCE_REPUTATION'>Reputation</a> suffers. With Campaign Operations Reputation, your crime rating \
  falls by 2 per prisoner, to at most -50. With Chaos Campaign Reputation, Reputation falls by 1 per 10 prisoners, \
  rounded up, to at most -5. <br>- With <a href='GLOSSARY:FACTION_STANDING'>Faction Standing</a> on, each executed \
  prisoner costs 0.1 Regard with their origin faction, noticed or not.</p>
PRISONER_MISSION_END.title=Prisoners at Contract End
PRISONER_MISSION_END.definition=<p>When you complete a contract, your <a \
  href='GLOSSARY:PRISONERS_OF_WAR'>prisoners</a>, and your people held by the enemy, are settled. This only happens \
  if no other contract is still active; otherwise they wait for the last one. Ransoms here use the full values in <a \
  href='GLOSSARY:PRISONER_EVENTS'>Prisoner Events</a>.</p> <h2>Defectors</h2> <p>If any prisoners are willing to \
  defect, you are reminded before the contract completes. Cancel to recruit them first, or the chance is lost.</p> \
  <h2>Your People</h2> <p>Your people held by the enemy are dealt with first, with a 1 in 20 chance of a bad \
  outcome. If your force committed a crime during the contract, the die shrinks by your Campaign Operations crime \
  rating, down to a certain bad outcome.</p> <p>- <b>Good outcome, successful contract:</b> they all return to duty. \
  <br>- <b>Good outcome, failed contract:</b> the enemy offers them back for their full ransom value. You can pay \
  even if it takes you into debt. If you decline, they leave your campaign. <br>- <b>Bad outcome:</b> they do not \
  come back.</p> <h2>Enemy Prisoners</h2> <p>Next come your prisoners, with a 1 in 20 chance of a bad outcome. On a \
  good outcome you are offered their full ransom value; on a bad one there is no offer. Either way, you can release \
  them or execute them instead. Executions count as described in Prisoner Events, without the backfire roll.</p> \
  <p>Afterwards, Temporary Capacity resets to 100%.</p>
PROFESSIONS.title=Professions
PROFESSIONS.definition=Professions are the various jobs personnel can be assigned to. Each profession has a tooltip\
 \ which describes the profession, the skills required to take it, and the <a href='GLOSSARY:LINKED_ATTRIBUTES'>Linked\
 \ Attributes</a> for those skills. There are currently three types of profession available:\
 <p>- <b>Combat Professions</b> are those professions used to crew combat units. MekWarrior is an example of a Combat\
 \ Profession.\
 <br>- <b>Support Professions</b> are professions that have specific mechanics tied to the campaign layer. These\
 \ professions are generally not used in combat scenarios. An example of a Support Profession would be MekTech.\
 <br>- <b>Civilian Professions</b> are assigned to civilian personnel. They have no mechanical impact and are usually\
 \ used for roleplay or to represent professions held before joining the campaign. There are hundreds of them, from\
 \ Dependent to the many trades that round out the civilians in your campaign.</p>
PROSTHETICS.title=Prosthetics & Advanced Surgeries
PROSTHETICS.definition=Prosthetics & Advanced Surgeries are only available if Advanced Medical's 'Alternate Mode' is \
  enabled. They can be accessed via the right-click menu in the personnel tab, or in the infirmary. MekHQ's \
  Prosthetics system largely follows that outlined in A Time of War (pg 314-316). Familiarity with that\
  \ section will help if you are looking to understand how this system works.</p>\
  <p>To arrange a surgery, select the character and open the surgery dialog. You can use that dialog to select what \
  surgeries you wish to perform.</p>\
  <h2>The Surgeon</h2>\
  <p>Once the surgeries have been selected, a surgeon will be automatically picked from the active doctors at your \
  campaign's current location. The surgeon selected will be the doctor with the highest Surgery/Any skill level, \
  using rank as a tiebreaker. Each surgery requires level 2, 3 or 5 in the Surgery/Any skill, depending on the \
  surgery (note that this is the total skill level, not the target number). An insufficiently skilled surgeon \
  cannot attempt the surgery.</p>\
  <p>If no suitable surgeon is available, a local surgeon will be sourced. Local surgeons will have one skill level \
  higher than the requirement for the surgery and have access to a single point of Edge. Using a local surgeon \
  increases the total surgery cost tenfold.</p>\
  <h2>Surgery Cost</h2>\
  <p>The cost of each surgery is based on a number of factors. First, there is the base cost, listed in ATOW. This is\
  \ then multiplied by the availability rating appropriate for the campaign era. Availability D has a x1.25 \
  multiplier, E a x1.5 multiplier, F a x10 multiplier, and F* a x20 multiplier. There is no multiplier for \
  availabilities A, B, or C. Any surgery with availability X is unavailable.</p>\
  <p>Surgeries that are not freely legal, or that come from outside your faction, may also have to be bought on the \
  black market, which adds a further multiplier.</p>\
  <h2>Restrictions</h2>\
  <p>Campaign faction restricts some individual surgeries, and each restriction lifts at a point in history:</p>\
  <p>- Clan only until the Battle of Tukayyid: cloned limbs and Enhanced Imaging.\
  <br>- ComStar only (also open to Star League and Terran Hegemony campaigns, and the Word of Blake) until the ComStar \
  Schism: myomer limbs.\
  <br>- Word of Blake only until the end of Operation Scour: VDNI and Buffered VDNI, advanced cybernetic eyes and \
  ears, effusers, the pain shunt and the implant power supply.</p>\
  <p>A character with the Hatred of Bionics compulsion refuses any surgery that needs a hospital (Type 3 and \
  above).</p>\
  <p>Surgery availability is also influenced by the tech rating of the planet your campaign is currently on. The \
  individual tech rating of each surgery can be found in ATOW. However, if this exceeds the tech rating of the \
  current planet, the surgery cannot be performed.</p>\
  <p>Two exceptions exist. If the campaign is not planetside, the 'planetary' tech rating is treated as F. Similarly, \
  if the tech rating of the current planet is worse than F, it is treated as F.</p>\
  <p>Finally, as per ATOW, only Type 1 and Type 2 surgeries can be performed without a hospital. For MekHQ, you have \
  hospital access (for this purpose) whenever you are planetside. It may be that you're booking into a local \
  hospital, or your employer has made arrangements due to the severity of the need. How best to embed this into your \
  campaign narrative is left to your discretion.</p>\
  <h2>Performing the Surgery</h2>\
  <p>All surgeries require a Surgery/Any skill check. if the check is failed, a point of Edge will be automatically \
  used to reroll the check. The order in which surgeries occur is based on the difficulty of the surgery followed by \
  the surgery's cost. In both cases this is highest to lowest. This ensures that any available Edge is used on the \
  most important surgeries.</p>\
  <p>If the surgery is successful, all relevant injuries will be removed. For most surgeries this is all injuries in \
  the affected area. However, for cosmetic surgery only burn injuries are affected. Once injuries have been removed \
  a recovery 'injury' is added to the character. This reflects how long it takes for the character to recover from \
  the surgery or get used to their new prosthetic.</p>\
  <p>If the surgery was unsuccessful, all injuries remain in place and an additional injury is added. This reflects \
  the time it takes for the character to recover from the stress of surgery.</p>\
  <p>Whether surgery was successful or not, MekHQ will total the total number of injuries possessed by the character \
  following surgery. If this total exceeds 5 the character is considered to have died on the operating table. \
  Prosthetics and other surgery markers ('injuries' on the character that just record past surgeries) are not \
  included when totaling the number of concurrent injuries.</p>
### Q
QUICK_TRAIN.title=Quick Train
QUICK_TRAIN.definition=<b>Quick Train</b> tells personnel to spend their XP to improve their profession skills \
  (marked with a \u2605 in the character panel). It is now the <b>Auto-train</b> page of the <b>Training Console</b>, \
  opened from the Personnel Tab or a character's right-click <b>Spend XP</b> item, which previews every improvement \
  and its cost before anything is spent. Auto-train settings can be saved per campaign as presets, and a preset can \
  run by itself at the start of each month. There is also a MekHQ Client Option that runs Quick Train automatically \
  once a month.\
  <h2>Excluding Characters</h2>\
  You can tell <b>Quick Train</b> to ignore a character by right-clicking on the character in the Personnel Tab, \
  heading to <b>Flags</b> and enabling <b>Never Quick Train</b>. This stops them from spending XP via Quick \
  Train, including the end-of-month automatic Quick Train and Training Console auto-train presets set to skip \
  excluded people. Quick Train does not affect characters \
  marked as students.\
  <h2>Quick Prioritization</h2>\
  Characters will train their lowest profession skills first. Skills won't be upgraded if they exceed the \
  character's available XP, at the max level, or push them past the selected skill milestone (e.g., Green, Regular, \
  Veteran). For Infantry Gunnery skills, only the highest relevant skill will be improved (or Small Arms if 'only use\
  \ Small Arms' is enabled in campaign options). Only Soldiers with the Anti-Mek (Climbing) skill will be trained in \
  Anti-Mek.\
  <p>Technicians also train their granular tech skills, unless 'Use Global Tech Skills Only' is enabled in campaign \
  options. A tech with a <a href='GLOSSARY:TECH_SPECIALIZATION'>specialization</a> trains only that skill alongside \
  their profession skill, so training never wears it down. A tech without one trains every tech skill they have, \
  lowest first, keeping them level.</p>
### R
REINFORCEMENT_ARRIVAL.title=Reinforcement Arrival
REINFORCEMENT_ARRIVAL.definition=<p>Even when a <a href='GLOSSARY:REINFORCEMENT_CHECKS'>Reinforcement Check</a> \
  succeeds, reinforcements may not reach the battlefield straight away. Their arrival turn depends on their \
  slowest unit.</p>\
  <h2>Speed</h2>\
  <p>Each unit's speed is its Walking MP, adjusted as follows:</p>\
  <p>- Jump-capable units other than infantry add 1.\
  <br>- Jump-capable infantry use their Jumping MP instead.\
  <br>- LAMs and aerospace units that aren't spheroid double their speed.</p>\
  <p>Speed is never less than 1. Units being carried by a transport don't count; they arrive with their \
  transport.</p>\
  <h2>Arrival Turn</h2>\
  <p>Each unit's arrival turn is 25 divided by its speed (rounded down), minus the Strategy skill of the commander \
  leading the scenario, to a minimum of turn 0. Some scenario modifiers reduce it further. The whole Combat Team \
  arrives on the turn of its slowest unit.</p>\
  <p>For example, a Lance whose slowest 'Mek walks at 3 arrives on turn 8 (25 / 3, rounded down). With a \
  scenario commander who has Strategy 2, it arrives on turn 6.</p>\
  <h2>Late and Instant Reinforcements</h2>\
  <p>- <b>Late:</b> reinforcements that arrive late (after failing their check, or evading an interception) use \
  50 or 75 in place of 25, so they take two or three times as long.\
  <br>- <b>Instant:</b> reinforcements sent with Reinforce Instantly that pass their check arrive at the start of \
  the battle.</p>\
  <p>Aerodyne DropShips are fast, so they can carry slower units to the battlefield more quickly.</p>
REINFORCEMENT_CHECKS.title=Reinforcement Checks
REINFORCEMENT_CHECKS.definition=<p>Every Combat Team sent to <a href='GLOSSARY:HOW_TO_REINFORCE'>reinforce</a> a \
  StratCon scenario makes a Reinforcement Check: a 2d6 roll against a target number.</p>\
  <h2>Target Number</h2>\
  <p>The target number starts at the <b>Base Reinforcement Target Number</b> campaign option (default 7, in Campaign \
  Options under Operations, Digital GMs, General), and is modified by:</p>\
  <p>- <b>Administration:</b> the experience level of your most senior Admin's Administration skill. Ultra-Green \
  +2, Green +1, Regular 0, Veteran -1, Elite -2, Heroic -3, Legendary -4. If you have no Admin, or they lack the \
  skill, +3.\
  <br>- <b>Enemy <a href='GLOSSARY:MORALE'>Morale</a>:</b> Scattered -3, Critical -2, Weakened -1, Stalemate 0, \
  Advancing +1, Dominating +2, Overwhelming +3\
  <br>- <b>Enemy skill:</b> Ultra-Green -2, Green -1, Regular 0, Veteran +1, Elite +2, Heroic +3, Legendary +4\
  <br>- <b>Liaison <a href='GLOSSARY:COMMAND_RIGHTS'>command rights</a>:</b> -1\
  <br>- <b>Coordinator SPA</b> on your senior Admin: -1\
  <br>- <b>Extra Employer Support:</b> -2 for each extra point spent on the Combat Team</p>\
  <h2>The Roll</h2>\
  <p>Combat Teams in the <a href='GLOSSARY:COMBAT_ROLES'>Maneuver role</a> roll twice and keep the better \
  result.</p>\
  <p>- <b>A roll of 2</b> always fails, whatever the target number. The Combat Team doesn't arrive, and the \
  Employer Support is spent.\
  <br>- <b>Equal to or above the target number:</b> the Combat Team arrives on time, or at the start of the battle \
  if you chose to reinforce instantly.\
  <br>- <b>Below the target number:</b> the enemy may try to intercept them.</p>\
  <h2>Interception</h2>\
  <p>After a failed check, the enemy intercepts with a percentage chance equal to the sector's scenario odds. \
  Contracts without combat are never intercepted. If they aren't intercepted, the Combat Team still arrives, but \
  late.</p>\
  <p>If they are intercepted, the Combat Team's commander makes a Tactics skill check to evade:</p>\
  <p>- <b>Success:</b> they slip past and arrive late. If <a href='GLOSSARY:FATIGUE'>Fatigue</a> is enabled, \
  the crews gain Fatigue.\
  <br>- <b>Failure:</b> they never reach the original battle. Instead, a new 'Reinforcements Intercepted' \
  scenario is created, which they must fight. Formations of only aircraft fight it in the low atmosphere, and \
  formations of only aerospace units sometimes fight it in space.</p>\
  <p>A Combat Team without a commander can't evade, and fails.</p>
RECRUITMENT_RESTRICTIONS.title=Recruitment Restrictions
RECRUITMENT_RESTRICTIONS.definition=<p>Under the MekHQ <a href='GLOSSARY:RECRUITMENT_STYLES'>Recruitment Style</a>, \
  where your command is and what it is doing can stop new applicants arriving in the <a \
  href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a>. The CamOps styles have none of these restrictions. A \
  restriction only matters when a new set of applicants arrives: applicants already on the board stay until the next \
  set replaces them. The market shows a banner when one applies.</p> <h2>No Applicants At All</h2> <ul> <li><b>In \
  Space:</b> no applicants arrive while your command is travelling or otherwise not on a planet. Arriving at a planet \
  brings a new set of applicants straight away.</li> <li><b>On Military Maneuvers:</b> no applicants arrive while you \
  have an active contract that is not a garrison-type contract. The garrison types are <a \
  href='GLOSSARY:MISSION_TYPE_GARRISON_DUTY'>Garrison Duty</a>, <a href='GLOSSARY:MISSION_TYPE_CADRE_DUTY'>Cadre \
  Duty</a>, <a href='GLOSSARY:MISSION_TYPE_SECURITY_DUTY'>Security Duty</a>, <a \
  href='GLOSSARY:MISSION_TYPE_RIOT_DUTY'>Riot Duty</a> and <a href='GLOSSARY:MISSION_TYPE_RETAINER'>Retainer</a>. The \
  <b>Recruit While On Military Maneuvers</b> option, on the Recruitment Options page of Campaign Options, lifts this \
  restriction.</li> <li><b>No Local Interest:</b> no applicants arrive if no faction in the system is willing to send \
  any, as when every faction there is at war with yours. See <a href='GLOSSARY:APPLICANT_ORIGINS'>Applicant \
  Origins</a>.</li> </ul> <h2>Fewer or Different Applicants</h2> <ul> <li><b>Poor Reputation:</b> if your <a \
  href='GLOSSARY:FORCE_REPUTATION'>Reputation</a> is below -25 (below -3 when using Chaos Campaign reputation), only \
  mercenaries and pirates are willing to join. A Clan campaign in this position gets no applicants at all, as it only \
  ever recruits from its own Clan.</li> <li><b>Low Population:</b> a system with fewer than 7.5 million people gives \
  fewer <a href='GLOSSARY:RECRUIT_ROLLS'>Recruit Rolls</a>.</li> </ul>
RECRUITMENT_STYLES.title=Recruitment Styles
RECRUITMENT_STYLES.definition=<p>The <b>Recruitment Style</b> option, on the Recruitment Options page of Campaign \
  Options, chooses how the <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a> finds applicants.</p> <ul> \
  <li><b>MekHQ</b> is built for MekHQ campaigns. Where you are stationed matters: hiring halls, capital worlds, \
  population and your standing with the local factions all change how many applicants arrive, and your reputation and \
  the experience of your command change who is willing to join. It covers every profession MekHQ uses.</li> \
  <li><b>CamOps (Revised)</b> follows the recruitment rules in <i>Campaign Operations</i>, with its profession table \
  adjusted so that every profession MekHQ uses can turn up.</li> <li><b>CamOps (Strict)</b> follows the <i>Campaign \
  Operations</i> profession table as written. It never offers Administrators, AsTechs, Medics or Battle Armor \
  troopers, and Inner Sphere campaigns never see LAM Pilots or Conventional Aircraft Pilots either.</li> \
  <li><b>Disabled</b> turns the market off. The Recruitment menu item and button open the GM's bulk recruitment tool \
  instead.</li> </ul> <h2>Differences</h2> <table><tr><th>Rule</th><th>MekHQ</th><th>CamOps (Revised and \
  Strict)</th></tr> <tr><td><a href='GLOSSARY:RECRUIT_ROLLS'>Recruit Rolls</a></td><td>Days in the month, changed by \
  location, population, Faction Standing, Connections and the Applicant Multiplier</td><td>Days in the month, plus \
  Connections, times the Applicant Multiplier</td></tr> <tr><td><a \
  href='GLOSSARY:RECRUITMENT_RESTRICTIONS'>Restrictions</a></td><td>Yes</td><td>No</td></tr> <tr><td><a \
  href='GLOSSARY:SHOW_OF_INTEREST'>Show of Interest</a></td><td>Yes</td><td>No</td></tr> <tr><td><a \
  href='GLOSSARY:GOLDEN_HELLO'>Golden Hello</a></td><td>Yes</td><td>No</td></tr> <tr><td>Dependents</td><td>d6 extra \
  each month</td><td>In place of the table's 'no personnel' result</td></tr> <tr><td>Mercenary and Pirate \
  applicants</td><td>Always possible</td><td>Only if another faction in the system is interested</td></tr> <tr><td><a \
  href='GLOSSARY:HIRING_COSTS'>Hiring Cost</a></td><td>The recruitment payment, plus any Golden Hello</td><td>The \
  recruitment payment</td></tr></table> <p>All three styles use their own profession tables, kept apart for Clan and \
  Inner Sphere campaigns. See <a href='GLOSSARY:APPLICANT_PROFESSIONS'>Applicant Professions</a> and <a \
  href='GLOSSARY:APPLICANT_ORIGINS'>Applicant Origins</a>.</p>
RECRUIT_ROLLS.title=Recruit Rolls
RECRUIT_ROLLS.definition=<p>Each time a new set of applicants arrives in the <a \
  href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a>, the market makes a number of Recruit Rolls. Each roll can \
  produce one applicant, so more rolls mean more applicants. Not every roll succeeds: under the MekHQ style an \
  applicant can decline to make a <a href='GLOSSARY:SHOW_OF_INTEREST'>Show of Interest</a>, and a roll is wasted if \
  no profession or homeland can be found for it. The market's Recruit Rolls tile shows this month's rolls.</p> \
  <h2>MekHQ Style</h2> <p>The rolls are worked out in this order:</p> <ul> <li><b>Base:</b> one roll for each day of \
  the current month.</li> <li><b>Location:</b> multiplied by the system's <a href='GLOSSARY:HIRING_HALLS'>Hiring \
  Hall</a>: x3 for a Great hall, x2 for a Standard hall, x1 otherwise. Add 1 to the multiplier if the system is a \
  faction's <a href='GLOSSARY:CAPITAL_SYSTEMS'>capital</a>, and 1 more if that faction is a major power or \
  superpower. A Great hiring hall on a major power's capital gives x5.</li> <li><b>Alternate Advanced Medical:</b> if \
  it is in use, the rolls are doubled, as injuries take people out of action for longer. See <a \
  href='GLOSSARY:ALT_ADVANCED_MEDICAL'>Alternate Advanced Medical</a>.</li> <li><b>Population:</b> a system with \
  fewer than 7.5 million people gives fewer rolls, in proportion to its population. A system of 3.75 million gives \
  half as many. Population never takes the rolls below one, and a larger population gives no bonus.</li> \
  <li><b>Faction Standing:</b> if <b>Enable Faction Standing</b> and <b>Standings Affects Recruitment</b> are both \
  enabled, the rolls are multiplied by the best multiplier among the factions in the system, from your <a \
  href='GLOSSARY:FACTION_STANDING_EFFECTS'>standing</a> with each (see the table below).</li> <li><b>Connections:</b> \
  if <b>Allow Monthly Connections Checks</b> is enabled, the commander rolls 2d6. On a 4 or more, their <a \
  href='GLOSSARY:CONNECTIONS'>Connections</a> add extra rolls: 1 at Connections 4, rising to 10 at Connections 10. A \
  commander with no Connections, fewer than 4, or burned contacts adds none.</li> <li><b>Applicant Multiplier:</b> \
  finally, the rolls are multiplied by the Applicant Multiplier and rounded.</li> </ul> \
  <table><tr><th>Regard</th><th>Roll Multiplier</th></tr> <tr><td>-60 to -50</td><td>x0</td></tr> <tr><td>-50 to \
  -40</td><td>x0.25</td></tr> <tr><td>-40 to -25</td><td>x0.5</td></tr> <tr><td>-25 to -10</td><td>x0.75</td></tr> \
  <tr><td>-10 to 10</td><td>x1</td></tr> <tr><td>10 to 25</td><td>x1.25</td></tr> <tr><td>25 to \
  40</td><td>x1.5</td></tr> <tr><td>40 to 50</td><td>x1.75</td></tr> <tr><td>50 to 60</td><td>x2</td></tr></table> \
  <p>Under the MekHQ style, d6 Dependents are also added each month, multiplied by the Applicant Multiplier, unless \
  civilian applicants are disabled. They do not use Recruit Rolls.</p> <h2>CamOps Styles</h2> <p>Both CamOps styles \
  make one roll for each day of the month, add any rolls from Connections as above, and multiply the total by the \
  Applicant Multiplier. Location, population and Faction Standing do not change the number of rolls.</p>
RELEASE_TYPE_DEVELOPMENT.title=Experimental Releases
RELEASE_TYPE_DEVELOPMENT.definition=Experimental builds are the regular releases that come out most weeks as part of\
 \ the ongoing development cycle. Each is numbered with the line it belongs to plus a build number, such as\
 \ 0.51.01.4, and contains the latest features, bug fixes, and improvements. While they're generally stable,\
 \ Experimental releases may occasionally have quirks, minor bugs, or unexpected behavior.\
 <p>These builds are great if you want to stay current with the latest changes and don't mind occasionally\
 \ encountering small issues. A save made in one Experimental build opens in later builds of the same line, but not\
 \ in an older one.</p>
RELEASE_TYPE_MILESTONE.title=Core Releases
RELEASE_TYPE_MILESTONE.definition=Core releases are the recommended choice for most players. A Core release is cut\
 \ from a line of <a href='GLOSSARY:RELEASE_TYPE_DEVELOPMENT'>Experimental</a> builds once that line has proven\
 \ itself stable and reliable through real-world testing by the community.\
 <p>Core releases come out every few months, making them the perfect balance between stability and having access to\
 \ recent features and improvements. Core releases were previously called Milestones.</p>
RELEASE_TYPE_NIGHTLY.title=Nightly Releases
RELEASE_TYPE_NIGHTLY.definition=Nightly builds are like experimental LosTech salvaged from Star League caches - powerful\
 \ but unpredictable. Assembled nightly (around 23:00 Eastern Time), they offer a glimpse of cutting-edge features at\
 \ the expense of stability. Much like an experimental RISC laser, they tend to go critical when you least expect it.\
 <p><b>Important:</b></p>\
 <p>The focus of Nightly builds is testing new features and upcoming changes. They are not recommended for general play\
 \ and should be avoided by new users. If you encounter a bug on a Nightly release, it is <b>essential</b> that you\
 \ report it immediately.</p>\
 <p>When playing on a Nightly release, ensure you keep frequent backups of your saves as permanent save corruption is\
  \ far more likely on a Nightly release.</p>
RELEASE_TYPES.title=Core, Experimental and Nightly Releases
RELEASE_TYPES.definition=The MegaMek suite is released on two channels.\
 \ <a href='GLOSSARY:RELEASE_TYPE_DEVELOPMENT'>Experimental</a> builds come out most weeks and carry the latest\
 \ changes. When a line of development has proven stable, it is released as a\
 \ <a href='GLOSSARY:RELEASE_TYPE_MILESTONE'>Core</a> release. Between them, test builds such as\
 \ <a href='GLOSSARY:RELEASE_TYPE_NIGHTLY'>Nightlies</a> may also be made available for testing.\
 <p>Version numbers show where a build sits. 0.51.01 is a line of development; 0.51.01.4 is the fourth Experimental\
 \ build of that line. The glossary marks entries changed since the last Core release.</p>\
 <p>You should always pick the type of release you're most comfortable with. If in doubt, pick the latest Core\
 \ release.</p>
RANDOM_CIVILIANS.title=Random Civilians
RANDOM_CIVILIANS.definition=<p>Military forces attract people who are not soldiers: family, traders, hangers-on \
  and everyone in between. Random Civilians lets these people join and leave your force over time.</p>\
  <p>It is controlled by two options in Campaign Options (Human Resources, Personnel, Prisoners & Civilians), \
  both off by default: <b>Random Addition</b> and <b>Random Removal</b>.</p>\
  <p>Only <a href='GLOSSARY:CAMP_FOLLOWERS'>Camp Followers</a> whose primary and secondary professions are both \
  civilian count as civilians here. Civilians you have employed are not affected.</p>\
  <h2>When</h2>\
  <p>Rolls are made on the first of each month, but only while your force is on a planet. Nothing happens while \
  you are in transit. Addition is rolled first, then removal, so a civilian can never leave the month they \
  arrive.</p>\
  <h2>Civilian Capacity</h2>\
  <p>Your force's Civilian Capacity is 5% of its other active personnel, rounded to the nearest whole number, with \
  a minimum of 1. Prisoners, civilians and children (under 16) are not counted. A force with 100 such personnel \
  has a capacity of 5.</p>\
  <h2>Random Addition</h2>\
  <p>If you have fewer civilians than your capacity, a number of d100s is rolled equal to 20% of the remaining \
  capacity, rounded down, with a minimum of 1. Each roll of 1 adds a new civilian. If you have fewer than half \
  your capacity (rounded down), a d20 is also rolled alongside each d100 and the lower result is used, so a 1 on \
  either die adds a civilian.</p>\
  <p>A new civilian's profession depends on two options on the same page:</p>\
  <p>- <b>Dependent Profession Chance</b> (default 1 in 4): on a 1, the civilian is a Dependent. If set to 0, \
  they are always a Dependent.\
  <br>- <b>Civilian Profession Chance</b> (default 1 in 2): this is rolled afterwards. On a 1, the civilian \
  instead gets a random civilian <a href='GLOSSARY:PROFESSIONS'>Profession</a>. If set to 0, this roll is \
  skipped.</p>\
  <p>A civilian who gets neither is a Professional. These two options also apply to civilians created in other \
  ways, such as Dependents from the <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a>.</p>\
  <h2>Random Removal</h2>\
  <p>A d20 is rolled for each civilian, and they leave the force on a 1. If you have more civilians than your \
  capacity, two dice are rolled and the lower is used. Civilians who are children, are married, or have children \
  under 16 are never removed this way. Civilians who leave are given the Left status.</p>
RANDOM_DEATH.title=Random Death
RANDOM_DEATH.definition=<p>Random Death gives every character a small chance to die from causes outside combat. \
  The chance rises with age and injury and also depends on the era and on your campaign's faction. Life expectancy \
  is based on canonical BattleTech sources rather than real-world data: with a multiplier of 1.0 and no other \
  modifiers, it averages 84 years for men and 89 for women.</p>\
  <p>Random Death is controlled by the <b>Random Death Multiplier</b> in Campaign Options (Human Resources, \
  Biography, Death). Setting it to 0 turns Random Death off. The 'New Players Start Here' and 'Veteran Experience' \
  presets use 1.0, 'Myndo Madness' uses 2.0, and the other presets leave it off.</p>\
  <h2>Who Is Checked</h2>\
  <p>Death checks are made every Monday. Every character still with the campaign is checked, as are characters who \
  have retired, been imprisoned, deserted, defected or become an enemy bondsman, and background characters.</p>\
  <p>A character is never checked if:</p>\
  <p>- They are flagged <b>Ignored by Random Death Mechanic</b> (right-click the character in the Personnel tab, \
  then Flags). This only protects them from Random Death: they can still die in combat, from their injuries, or be \
  killed manually.\
  <br>- Their age group is turned off under <b>Death by Age Group</b> on the same Campaign Options page. By default, \
  Teenagers (13-19), Adults (20-64) and Elders (65+) are checked, while Babies, Toddlers, Children and Pre-teens \
  are not.</p>\
  <h2>The Death Chance</h2>\
  <p>Each check is a roll against a chance out of 1,000,000:</p>\
  <p><b>Base Chance x Era Multiplier x Faction Multiplier x Health Multiplier x Random Death Multiplier</b></p>\
  <p>The result is rounded to the nearest whole number. If it rounds to 0, the character cannot die that week.</p>\
  <p><b>Base Chance</b> depends on age and gender. Characters whose gender is Female or Other (F) use the female \
  column; everyone else uses the male column.</p>\
  <table><tr><th>Age</th><th>Male</th><th>Female</th></tr> <tr><td>0-9</td><td>4</td><td>2</td></tr> \
  <tr><td>10-19</td><td>9</td><td>4</td></tr> <tr><td>20-29</td><td>17</td><td>8</td></tr> \
  <tr><td>30-39</td><td>20</td><td>10</td></tr> <tr><td>40-49</td><td>30</td><td>18</td></tr> \
  <tr><td>50-59</td><td>70</td><td>40</td></tr> <tr><td>60-69</td><td>149</td><td>90</td></tr> \
  <tr><td>70-79</td><td>385</td><td>233</td></tr> <tr><td>80-89</td><td>1,000</td><td>714</td></tr> \
  <tr><td>90-99</td><td>2,500</td><td>2,000</td></tr> <tr><td>100+</td><td>5,000</td><td>3,333</td></tr></table>\
  <p><b>Era Multiplier</b> reflects the wars and medical technology of the current era.</p>\
  <p>- <b>Age of War or earlier:</b> x1.2\
  <br>- <b>Star League:</b> x0.9\
  <br>- <b>Succession Wars:</b> x1.05\
  <br>- <b>Clan Invasion:</b> x0.95\
  <br>- <b>Civil War:</b> x0.93\
  <br>- <b>Jihad:</b> x1.0\
  <br>- <b>Republic:</b> x0.92\
  <br>- <b>Dark Age:</b> x0.95\
  <br>- <b>ilClan:</b> x0.85</p>\
  <p><b>Faction Multiplier</b> uses your campaign's faction, not the character's.</p>\
  <p>- <b>Magistracy of Canopus:</b> x0.85\
  <br>- <b>Clan:</b> x0.85\
  <br>- <b>Deep Periphery:</b> x1.3\
  <br>- <b>Periphery:</b> x1.0\
  <br>- <b>Inner Sphere minor power:</b> x0.95\
  <br>- <b>Inner Sphere major power:</b> x0.9\
  <br>- <b>Pirate:</b> x1.35\
  <br>- <b>Mercenary and anything else:</b> x1.0</p>\
  <p><b>Health Multiplier</b> starts at 1.0 and is changed by:</p>\
  <p>- -0.05 if your campaign is on a planet with an A- or B-rated HPG\
  <br>- +0.1 for each hit the character has taken. If <a href='GLOSSARY:ADVANCED_MEDICAL'>Advanced Medical</a> or \
  <a href='GLOSSARY:ALT_ADVANCED_MEDICAL'>Alternate Advanced Medical</a> is enabled, it is +0.1 for each injury that \
  is not permanent, plus a single +0.25 if the character has any permanent injuries.</p>\
  <p>For example, a 45-year-old man in an Inner Sphere major power's campaign during the Clan Invasion, with no \
  injuries and no HPG nearby, has a chance of 30 x 0.95 x 0.9 x 1.0 x 1.0 = 25.65, which rounds to 26 in 1,000,000 \
  each week.</p>\
  <h2>Cause of Death</h2>\
  <p>When a character dies, their cause of death is chosen in this order:</p>\
  <p>- A character who is Missing in Action is recorded as Killed in Action.\
  <br>- A character with a major or deadly injury dies of their wounds.\
  <br>- A pregnant character dies of pregnancy complications.\
  <br>- Otherwise, a cause is drawn from a weighted table based on gender and age. It includes accidents, disease, \
  homicide, medical complications, natural causes, old age and undetermined causes. Suicide is only included if \
  <b>Enable Cause of Death: Suicide</b> is turned on. The table is in <i>data/universe/randomDeathCauses.xml</i>, \
  and can be overridden with a file of the same name in <i>userdata/data/universe</i>.</p>\
  <p>If <b>Use Twist of Fate Survival</b> is enabled, a character who would die may instead permanently spend a \
  point of <a href='GLOSSARY:EDGE'>Edge</a> to survive. This does not work for suicide, or for characters who have \
  left the campaign or are prisoners.</p>\
  <h2>Announcements</h2>\
  <p>The death of a character still with the campaign is always reported in the daily report. Deaths of retirees \
  and background characters are only reported if <b>Announce Retiree Deaths</b> is enabled, and deaths of other \
  characters who have left the campaign only if <b>Announce Most Deaths</b> is enabled. Both options are under \
  Human Resources, Biography, General. A death announcement dialog may also appear; each type of character (combat, \
  tech, support, civilian, retiree and camp follower) has its own dialog, which can be turned off.</p>
RANDOM_PERSONALITIES.title=Random Personalities
RANDOM_PERSONALITIES.definition=<p>Every character is generated with a personality: a few traits, sometimes a \
  quirk, and a <a href='GLOSSARY:TALENT'>Talent</a> score. Each trait and quirk comes with a written description. \
  Campaign Options decide whether these are shown and whether they have any effect.</p>\
  <p>The options are in Campaign Options (Human Resources, Biography, Backgrounds), under Random Backgrounds:</p>\
  <p>- <b>Assign Random Personalities:</b> shows personality traits and quirks, and lets them affect the game\
  <br>- <b>Assign Random Talent:</b> shows Talent, and lets it affect <a href='GLOSSARY:EDUCATION'>Education</a> \
  and XP costs\
  <br>- <b>Show Personality Labels Only:</b> shows trait names such as 'Courageous' instead of the full \
  descriptions\
  <br>- <b>Personality Influences Reputation:</b> see <a href='GLOSSARY:PERSONALITY_VALUE'>Personality Value</a>\
  <br>- <b>Talent Influences XP Costs:</b> see <a href='GLOSSARY:TALENT'>Talent</a></p>\
  <h2>Traits and Quirks</h2>\
  <p>There are four trait categories: <b>Aggression</b>, <b>Ambition</b>, <b>Greed</b> and <b>Social</b>. Each \
  has 24 minor traits and 6 major traits, and every trait is either positive or negative. For example, Courageous \
  is a positive minor Aggression trait, while Murderous is a negative major one.</p>\
  <p><b>Personality Quirks</b> are habits and oddities, such as nail biting, staying up all night or telling war stories. There are \
  over 200 of them. They are purely descriptive, and their description can depend on the character's profession \
  and origin faction.</p>\
  <h2>Generation</h2>\
  <p>Two of the five categories (the four trait categories and Quirks) are picked at random, and a trait is rolled \
  for each. The other three are left empty. This means every character has exactly two personality elements, so \
  most will have two traits and some will have a trait and a quirk.</p>\
  <p>For a trait category, a d25 is rolled. On 1-24 the character gets a minor trait. On a 25, they get one of \
  the six major traits instead, chosen with a d6. A quirk is picked at random from the full list. Each trait and \
  quirk then picks one of several written variations for its description.</p>\
  <p>Talent is rolled last; see <a href='GLOSSARY:TALENT'>Talent</a>.</p>\
  <h2>Viewing and Changing Personalities</h2>\
  <p>A character's personality is shown in the Personality section of their character sheet. The Personnel tab's \
  <b>Personality</b> view lists every character's traits and Talent. In the \
  <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a>, applicants also come with an interviewer's notes on \
  their personality.</p>\
  <p>In GM Mode, right-click a character and choose <b>GM Mode</b>, then <b>Edit Person</b>, to pick their traits \
  by hand. <b>GM Mode</b>, <b>Roleplay</b>, <b>Regenerate Personality</b> rolls a whole new personality, Talent \
  included. Regenerate Personality only appears if Random Personalities or Random Talent is enabled.</p>\
  <p>To hide one character's personality, for example a character you want to write yourself, right-click them \
  and choose <b>Flags</b>, then <b>Hide Personality</b>.</p>
REFITS.title=Refits
REFITS.definition=<p>A refit changes a unit you own into a different design, such as a canon variant of the \
  same chassis or a design of your own. Right-click the unit in the Hangar and open the <b>Customize</b> \
  menu.</p>\
  <h2>Refitting to Another Variant</h2>\
  <p><b>Refit/Customize...</b> (<b>Choose configuration...</b> for an OmniMek or other Omni unit) lists the designs \
  the unit can become: same chassis and unit type, matching weight, and allowed by your campaign's tech rules. Pick \
  one to see what it needs, then choose how to go about it:</p>\
  <p>- <b>Acquire and Use Refit Kit</b> starts the refit now. Parts already in the warehouse are used, and the rest \
  are bought as one refit kit: a single purchase roll, for 10% more than the parts cost.\
  <br>- <b>Customize to Model</b> starts the refit now and buys the missing parts one by one, each with its own \
  purchase roll and no surcharge. Without a kit, though, the work can be a higher class, and anything beyond Class \
  B costs the unit a quality level.\
  <br>- <b>Order Parts</b> orders the missing parts without starting the refit, so the unit stays in service while \
  they arrive. When everything is here, <b>Begin Refit to...</b> appears in the Customize menu. <b>Forget Pending \
  Refit</b> drops the plan, and anything already ordered stays on order as spares.</p>\
  <p>Once a refit begins, the unit is out of service until it is done, including while parts are on their way.</p>\
  <h2>Customizing in the Mek Lab</h2>\
  <p><b>Customize in Mek Lab...</b> loads the unit into the Mek Lab tab, where you can change it however you like. \
  <b>Begin Refit</b> starts turning the unit into your new design and asks you to name it. <b>Save For Later</b> \
  saves the design to a file without refitting, so it can be chosen as a refit later. For a big redesign it is often \
  easier to build the unit in MegaMekLab itself, save it, then choose it with Refit/Customize.</p>\
  <h2>Refit Classes</h2>\
  <p>Every refit is graded from Class A (the simplest) to Class F, following <i>Campaign Operations</i>. The \
  class of the whole refit is the class of its biggest single change. Before the work starts, the tech explains \
  the class and why. The class decides where the work can be done:</p>\
  <p>- <b>Class A and B:</b> field work, possible anywhere.\
  <br>- <b>Class C and D:</b> need a field workshop or better.\
  <br>- <b>Class E and F:</b> need factory conditions.</p>\
  <p>To move a unit to a better <a href='GLOSSARY:REPAIR_SITE'>repair site</a>, right-click it and use \
  <b>Change Site</b>. In the refit list, <b>Only refits possible at...</b> hides the refits its current site can't handle. If the tech fails the \
  refit check, the unit also loses a quality level when the work is done.</p>\
  <h2>During and After the Refit</h2>\
  <p>When a refit starts, you choose the tech who does the work. A DropShip or other vessel is refitted by its own \
  engineer instead, and can't be refitted without one. If a refit loses its tech, use <b>Assign Refit Tech...</b>. \
  <b>Cancel Customization</b> stops the refit, \
  and in <a href='GLOSSARY:GM_MODE'>GM Mode</a> <b>Complete Refit (GM)</b> finishes it at once. The parts the refit \
  takes off go to the warehouse.</p>\
  <h2>Refurbishing</h2>\
  <p><b>Refurbish Unit</b> rebuilds a unit as the same design, raising every part's quality by one level. It is \
  Class E work, so it needs factory conditions, and costs 10% of the unit's base price. It takes a week for \
  vehicles, ProtoMeks and battle armor, two weeks for 'Meks, fighters and small craft, a month for DropShips and JumpShips, and \
  three months for WarShips and space stations.</p>
REMAIN_DEPLOYED.title=Remain Deployed
REMAIN_DEPLOYED.definition=Sometimes you might want to have a formation Remain Deployed to the\
 \ <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations (AO)</a> in <a href='GLOSSARY:STRATCON'>StratCon</a>. To\
 \ do this, right-click on the destination hex to <a href='GLOSSARY:HOW_TO_DEPLOY'>deploy</a> as normal. Once the formation\
 \ has been deployed, right-click on the hex again and select 'Remain Deployed.' The formation will now remain in place\
 \ until recalled (via the right-click menu).\
 <p>Three things are worth mentioning:\
 <p>- Forces assigned to the Training <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a> must use this option otherwise\
 \ no training will take place.\
 <br>- When placing scenarios to represent enemy actions, StratCon will place a higher weight on\
 \ <a href='GLOSSARY:STRATCON_FACILITIES'>Facilities</a> and formations using the 'Remain Deployed' option. This means that\
 \ you can use spare formations to act as a 'lightning rod' to lure enemy attacks away from your facilities.\
 <br>- If <a href='GLOSSARY:ADVANCED_SCOUTING'>Advanced Scouting</a> is enabled, forces assigned to the Patrol Combat\
 \ Role keep scouting instead of staying in place indefinitely. Whenever the formation would normally return, it makes another round of scouting checks\
 \ around its hex. It only returns once every hex within its scan range has been scouted.</p>
RELOADING_FIELD_GUNS.title=Reloading Infantry Field Guns
RELOADING_FIELD_GUNS.definition=Unlike other units, Conventional Infantry maintains their own equipment - including\
 \ reloading spent shots.\
 <p>If you have a repair task appear asking you to reload a field gun, select the task like you would normally, and then\
 \ attempt the task without selecting a tech. The Conventional Infantry unit will perform the task for you.</p>\
 <p>Be aware that as the unit is going to be performing the task, it needs to have performed no other tasks that day. Which\
 \ means you will likely be unable to reload field guns the day the unit returns from deployment.</p>
REPAIR_SITE.title=Repair Site
REPAIR_SITE.definition=A unit's Repair Site is the quality of the facilities its techs have to work with. It sets the\
 \ target number modifier for maintenance and repairs, and limits which refits the unit can undergo.\
 <p><b>SITE QUALITY</b></p>\
 <p>- <b>Improvised:</b> +2 to target numbers\
 <br>- <b>Field Workshop:</b> +1\
 <br>- <b>Basic Facility:</b> +0\
 <br>- <b>Maintenance Facility:</b> -2\
 <br>- <b>Factory Conditions:</b> -4</p>\
 <p>Class C and D refits need a Field Workshop or better. Class E and F refits, and refurbishment, need Factory\
 \ Conditions. You can change a unit's site from the right-click menu in the Hangar, or when starting a refit. Deployed\
 \ units cannot be moved.</p>\
 <p><b>AUTOMATIC ASSIGNMENT</b></p>\
 <p>On the day a contract begins, every unit in your hangar is moved to the site that matches the contract type:</p>\
 <p>- <b>Improvised:</b> Guerrilla Warfare, Black-Ops Insurgency, Sabotage, Espionage\
 <br>- <b>Field Workshop:</b> Diversionary Raid, Objective Raid, Recon Raid, Extraction Raid, Observation Raid,\
 \ Assassination\
 <br>- <b>Basic Facility:</b> all other contract types</p>\
 <p>Automatic assignment never gives a Maintenance Facility or Factory Conditions. Those must be rented. Your\
 \ <a href='GLOSSARY:EXPERIENCE_RATING'>Experience Rating</a> has no effect on your repair site.</p>\
 <p>Other situations also assign a site automatically:</p>\
 <p>- Units that arrive from a delivery are given the best site of all your active contracts (Basic Facility if you\
 \ have none).\
 <br>- Salvaged units are given the site of the contract they were salvaged on.\
 <br>- Parts repaired in the warehouse use the modifier of the best site of all your active contracts.\
 <br>- When you begin a journey along a jump route, all units are reset to Basic Facility.</p>\
 <p><b>RENTING A MAINTENANCE FACILITY OR FACTORY</b></p>\
 <p>Moving a unit to a Maintenance Facility or Factory Conditions requires renting a bay, if the\
 \ <i>Maintenance Bays/Week</i> cost in Campaign Options is above 0. If it is 0, rentals are disabled and these sites\
 \ are free to use.</p>\
 <p>- <b>Who:</b> any force. There are no restrictions based on faction or force type.\
 <br>- <b>When:</b> while you have no active contracts, or while at least one active contract is a garrison-type: Garrison\
 \ Duty, Cadre Duty, Security Duty, Riot Duty, or Retainer. Relief Duty and all other contract types do not qualify.\
 <br>- <b>Where:</b> you must be planetside. Planet ratings and attributes make no difference.\
 <br>- <b>Cost:</b> the Campaign Options value per unit. Large craft cost 10 times as much, and Factory Conditions\
 \ cost 20 times as much (multiplied together for a large craft). Unit type makes no other difference, and mothballed\
 \ units are ignored.</p>\
 <p>The fee is paid when you confirm the move, and then again every Monday for as long as the unit stays in the bay. If\
 \ you cannot afford the weekly fee, the unit is moved to the best site of your active contracts (Basic Facility if you\
 \ have none). To stop paying, move the unit back to a site other than Maintenance Facility or Factory Conditions.</p>\
 <p>The <b>Ignore (GM)</b> and <b>Free (GM)</b> buttons in the rental dialogs let you bypass the restrictions or the fee,\
 \ even when GM Mode is off.</p>
REPAIRING_DAMAGED_HIP_SHOULDER.title=Repairing Damaged Hips or Shoulders
REPAIRING_DAMAGED_HIP_SHOULDER.definition=Sometimes a 'Mek unit may sustain a critical hit to the shoulder or hip. If\
  \ this happens, you must fully replace the relevant limb.\
 <p>To do this, first set the unit to <a href='GLOSSARY:STRIPPING_AND_REPAIRING'>Strip</a> and remove <b>all</b> parts\
 \ from that limb. This will allow you to scrap the limb before switching back to Repair mode and replacing\
 \ everything.</p>\
 <p>This whole process may be very time-consuming and delicate, so you may have to wait until the end of the\
 \ contract.</p>
RESOLVING_SCENARIOS.title=Resolving Scenarios
RESOLVING_SCENARIOS.definition=<p>After a scenario is fought, it has to be resolved. Resolution records what \
  happened to your units and people, what you can salvage, and whether you won. A scenario you added yourself must \
  be resolved before you can advance past its date. A StratCon scenario that reaches its date unresolved counts as \
  refused instead (see <a href='GLOSSARY:STRATCON_SCENARIOS'>StratCon Scenarios</a>).</p>\
  <h2>Three Ways to Resolve</h2>\
  <p>- <b>Start Game</b> plays the battle in MegaMek. When the game ends, MekHQ reads the result and starts \
  resolving it straight away.\
  <br>- <b>Resolve Manually</b> is for a battle played some other way, or one whose outcome you decide yourself. \
  Pick the unit file MegaMek saved at the end of the game, if you have one, and the units in it are matched to \
  yours. Without one, you enter the results by hand. See <a href='GLOSSARY:MUL_FILES'>MUL Files</a>.\
  <br>- <b>Auto Resolve</b> has the computer fight the battle for you. See \
  <a href='GLOSSARY:AUTO_RESOLVE'>Auto Resolve</a>.</p>\
  <h2>Field Control</h2>\
  <p>You are first asked whether your side controls the battlefield. StratCon scenarios tell you which side their \
  rules give it to. Holding the field lets you salvage the wrecks and recover your own downed units and crews. See \
  <a href='GLOSSARY:FIELD_CONTROL'>Field Control</a>.</p>\
  <h2>The Resolve Scenario Wizard</h2>\
  <p>The wizard steps through each part of the result, skipping any step with nothing to show. Most of it is \
  filled in for you, but check each step, because anything can be corrected:</p>\
  <p>- <b>Your Units:</b> each unit's state. Units marked <i>Total Loss</i> are removed from your hangar, and damage \
  can be edited.\
  <br>- <b>Your Personnel:</b> hits taken, and who is missing (MIA) or killed (KIA).\
  <br>- <b>Salvage:</b> enemy wrecks to claim or sell, and any that escaped. On a contract, your salvage rights \
  limit how much you can take.\
  <br>- <b>Captured Personnel:</b> enemy personnel you have taken prisoner. See \
  <a href='GLOSSARY:PRISONER_CAPTURE'>Capturing Prisoners</a>.\
  <br>- <b>Assign Kills:</b> who gets credit for each enemy unit destroyed.\
  <br>- <b>Costs &amp; Payouts:</b> any rewards or costs tied to the scenario.\
  <br>- <b>Objective Status:</b> which objectives were met. See \
  <a href='GLOSSARY:SCENARIO_VICTORY_POINTS'>Scenario Victory Points</a>.\
  <br>- <b>Preview:</b> a summary, the final result (from decisive victory to decisive defeat) and space for an \
  after-action report.</p>\
  <p>Choose the final result with care. In StratCon it decides the effect on enemy \
  <a href='GLOSSARY:MORALE'>morale</a>, and for <a href='GLOSSARY:TURNING_POINTS'>Turning Points</a> and \
  <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis Scenarios</a> it can win or lose Contract Victory Points.</p>\
  <h2>Afterwards</h2>\
  <p>Depending on your campaign options, MekHQ may then make turnover checks and offer \
  <a href='GLOSSARY:AUTO_AWARDS'>awards</a>. Your campaign is autosaved after the scenario if that MekHQ option is \
  on. How wrecks are recovered depends on the <b>Salvage System</b> campaign option: some systems need salvage \
  teams planned before the battle, and some recover the wrecks with their own console afterwards.</p>
RESUPPLY.title=Resupplies
RESUPPLY.definition=Resupplies are how parts, armor and ammunition reach you while on contract with\
  \ <a href='GLOSSARY:STRATCON'>StratCon</a> enabled. On the 2nd of each month, if you are on the planet of your\
  \ active contract, your employer offers to sell you surplus supplies. What the offer contains, and how large it is,\
  \ depends on your force: see <a href='GLOSSARY:RESUPPLY_CONTENTS'>Resupply Contents</a>.\
  <p><b>THE MONTHLY OFFER</b></p>\
  <p>First, your employer asks how the supplies should travel:</p>\
  <ul><li><b>Use the Employer's Convoy:</b> your employer delivers the standard amount.</li>\
  <li><b>Use the Unit's Convoy:</b> your own <a href='GLOSSARY:FORCE_TYPE_CONVOY'>Convoy</a> formations collect it,\
  \ and the Resupply is four times larger, up to the cargo your convoys can carry. Your convoys and their crews are\
  \ at risk if the enemy intercepts them: see <a href='GLOSSARY:RESUPPLY_CONVOYS'>Resupply Convoys</a>.</li>\
  <li><b>Decline Resupply:</b> no supplies this month.</li></ul>\
  <p>Under Independent <a href='GLOSSARY:COMMAND_RIGHTS'>Command Rights</a>, your employer will not send a convoy, so\
  \ you must use your own or decline.</p>\
  <p>Next, you choose a focus. <b>Balanced</b> fills half the Resupply with parts and a quarter each with armor and\
  \ ammunition. <b>Armor</b> or <b>Ammunition</b> fills three quarters of the tonnage with that one category,\
  \ and nothing else.</p>\
  <p>Finally, you see the itinerary: everything on offer, and the price. Accept to pay and dispatch the convoy, or\
  \ refuse. You pay when you accept, so if the convoy is then lost, the money is gone too.</p>\
  <p><b>PRICE</b></p>\
  <p>If your employer is your own faction, and you are neither mercenaries nor pirates, the supplies are free.\
  \ Otherwise you pay a share of their value that depends on the enemy's <a href='GLOSSARY:MORALE'>Morale</a>: the\
  \ worse the war is going for your employer, the less willing they are to give you a discount.</p>\
  <table><tr><th>Enemy Morale</th><th>Price</th></tr>\
  <tr><td>Scattered</td><td>25%</td></tr>\
  <tr><td>Critical</td><td>50%</td></tr>\
  <tr><td>Weakened</td><td>75%</td></tr>\
  <tr><td>Stalemate</td><td>100%</td></tr>\
  <tr><td>Advancing</td><td>125%</td></tr>\
  <tr><td>Dominating</td><td>150%</td></tr>\
  <tr><td>Overwhelming</td><td>175%</td></tr></table>\
  <p><b>SMUGGLERS</b></p>\
  <p>On guerrilla-type contracts, such as <a href='GLOSSARY:MISSION_TYPE_GUERRILLA_WARFARE'>Guerrilla Warfare</a>, and\
  \ whenever your employer is a pirate, you are cut off from regular supply. Instead, in one month out of four, a\
  \ smuggler offers you a Resupply. You still choose a focus, but there is no convoy choice: the smuggler handles\
  \ delivery, so there is no interception.</p>\
  <p>Smugglers charge twice the full price of the goods, paid up front. They may also swindle you, taking your money\
  \ and delivering nothing: the chance is 1 in 10 for each step the enemy's Morale is above Scattered, so never\
  \ against a Scattered enemy, and 6 in 10 against an Overwhelming one. Smuggled parts arrive used rather than new.</p>\
  <p><b>CAPTURED SUPPLIES</b></p>\
  <p>Some rewards arrive as Resupplies too: scenario objectives that award supply caches or captured supplies, raids\
  \ on enemy facilities (see <a href='GLOSSARY:STRATCON_FACILITY_ORDERS'>Facility Orders</a>), and plundered points\
  \ of interest. These are free, need no convoy and use the Balanced split. The parts are used rather than new.</p>\
  <p><b>PLANNING AHEAD</b></p>\
  <p>When a contract starts, and in the contract's details in the Briefing Room, MekHQ estimates the cargo capacity\
  \ your own convoys would need to collect a full Resupply. If the <i>Standings Affects Resupplies</i> option is\
  \ enabled, your <a href='GLOSSARY:FACTION_STANDING_EFFECTS'>Standing</a> with your employer also changes the size of\
  \ each Resupply.</p>
RESUPPLY_CONTENTS.title=Resupply Contents
RESUPPLY_CONTENTS.definition=The contents of a <a href='GLOSSARY:RESUPPLY'>Resupply</a> are random, but weighted\
  \ towards what your force actually needs.\
  <p><b>SIZE</b></p>\
  <p>MekHQ adds up the weight of the units in your <a href='GLOSSARY:COMBAT_TEAMS'>Combat Teams</a> whose formations\
  \ are Combat formations, leaving out DropShips, JumpShips, WarShips, space stations and conventional infantry.\
  \ This is compared with a cap of 320 tons for each point of the contract's\
  \ <a href='GLOSSARY:FORCE_SCALE'>Scale</a>, or 960 tons if <i>Factor BSP into Scale Calculations</i> is enabled.\
  \ The smaller of the two, divided by 125, is the Resupply's tonnage.</p>\
  <p>If <i>Standings Affects Resupplies</i> is enabled, the tonnage is then multiplied by your\
  \ <a href='GLOSSARY:FACTION_STANDING_EFFECTS'>Standing</a> with your employer. A Resupply is never smaller than 4\
  \ tons. Collecting it with your own convoys multiplies the tonnage by four, but never beyond the cargo capacity your\
  \ convoys have.</p>\
  <p>That tonnage is then divided between parts, armor and ammunition according to the focus you chose.</p>\
  <p><b>WHAT CAN BE INCLUDED</b></p>\
  <p>A Resupply only offers parts your units use, or parts on your shopping list. Parts used by the excluded unit\
  \ types above, and by mothballed units, do not count. Some parts are never offered:</p>\
  <ul><li>Mek center torsos.</li>\
  <li>Vehicle locations, apart from turrets and rotors.</li>\
  <li>Motive systems.</li>\
  <li>Transport bays.</li>\
  <li>Sponson turrets.</li>\
  <li>Clan and mixed-tech parts, before the Battle of Tukayyid, unless your faction is a Clan.</li></ul>\
  <p><b>WEIGHTING</b></p>\
  <p>Each part receives a number of tickets, its chances of being picked, based on how much you need it:</p>\
  <ul><li>4 tickets for each one destroyed or missing from your units.</li>\
  <li>3 tickets for each one on your shopping list.</li>\
  <li>1 ticket for each one you are short of the target stock set in\
  \ <a href='GLOSSARY:PARTS_IN_USE'>Parts in Use</a>, counting spares, parts in transit and parts on order.</li></ul>\
  <p>Every part gets at least 1 ticket. The total is then multiplied by the part's type, and rounded down:</p>\
  <ul><li>Armor and ammunition: x5.</li>\
  <li>Heat sinks: x2.5.</li>\
  <li>Mek heads: x2.</li>\
  <li>Mek locations other than heads, jump jets and Battle Armor equipment: x1.</li>\
  <li>Everything else, including engines, gyros, MASC, actuators and weapons: x1.5.</li></ul>\
  <p><b>AVAILABILITY</b></p>\
  <p>Each ticket must then pass a procurement check: 2d6 against a target number set by the part's\
  \ <a href='GLOSSARY:PARTS_AVAILABILITY'>availability</a> to your employer. A ticket that fails is thrown away.</p>\
  <table><tr><th>Availability</th><th>Parts and Armor</th><th>Ammunition</th></tr>\
  <tr><td>A</td><td>3</td><td>2</td></tr>\
  <tr><td>B</td><td>4</td><td>3</td></tr>\
  <tr><td>C</td><td>6</td><td>4</td></tr>\
  <tr><td>D</td><td>8</td><td>6</td></tr>\
  <tr><td>E</td><td>10</td><td>8</td></tr>\
  <tr><td>F</td><td>11</td><td>10</td></tr>\
  <tr><td>X</td><td>Impossible</td><td>Impossible</td></tr></table>\
  <p>Ammunition is 2 easier again at the Introductory or Standard tech levels, and 1 easier at Advanced. All checks\
  \ are then 2 easier because this is a Resupply, and 3 harder for Clan parts offered by a non-Clan employer between\
  \ 3050 and 3070. The target number is never below 2. Parts that are going extinct may be unavailable.</p>\
  <p>Your negotiator also changes the target number. On a normal contract, your negotiator is your highest-ranking\
  \ administrator, with ties broken by skill. When dealing with smugglers, it is your commander.</p>\
  <table><tr><th>Negotiation Skill</th><th>Modifier</th></tr>\
  <tr><td>None, or no negotiator</td><td>+4</td></tr>\
  <tr><td>Ultra-Green</td><td>+3</td></tr>\
  <tr><td>Green or Regular</td><td>+0</td></tr>\
  <tr><td>Veteran</td><td>-2</td></tr>\
  <tr><td>Elite or better</td><td>-3</td></tr></table>\
  <p><b>FILLING THE RESUPPLY</b></p>\
  <p>MekHQ draws tickets at random from the parts, armor and ammunition pools until each category's share of the\
  \ tonnage is filled, or its pool runs out. Armor comes in 5-ton lots and ammunition in 1-ton lots. Parts count at\
  \ their own weight, at least 0.1 tons. The last item drawn can take a category over its share, so every category\
  \ you asked for gets at least one item while anything is available. This is why a Resupply can weigh more than\
  \ advertised, which matters when your own convoys must carry it.</p>\
  <p>Parts worth more than 250,000 C-bills are rare: when one is drawn, it is only included on a roll of 6 on 1d6,\
  \ and either way, no more of that part can be drawn for this Resupply.</p>\
  <p>Each item's quality is rolled on 2d6, plus your negotiator's experience level (from 0 for Ultra-Green, or no\
  \ negotiator, up to 6 for Legendary): 2-3 gives A, 4-5 B, 6-7 C, 8-9 D, 10-11 E and 12 F. Supplies from your employer\
  \ arrive new.</p>
RESUPPLY_CONVOYS.title=Resupply Convoys
RESUPPLY_CONVOYS.definition=Every <a href='GLOSSARY:RESUPPLY'>Resupply</a> your employer sends travels by convoy:\
  \ either your employer's, or your own.\
  <p><b>YOUR OWN CONVOYS</b></p>\
  <p>To make a formation a Convoy, right-click it in the <a href='GLOSSARY:TOE'>TO&E</a> and use <i>Change Force\
  \ Type</i>. Its name then ends in Ξ. A Convoy formation inside another Convoy formation counts as part of\
  \ it.</p>\
  <p>A convoy's capacity is the cargo space of its units that are undamaged and fully crewed. JumpShips, WarShips,\
  \ space stations and conventional infantry never carry Resupplies, but DropShips and Small Craft can. Choosing to\
  \ use your own convoys makes the Resupply four times larger, but never beyond the capacity of all your convoys\
  \ together.</p>\
  <p>The convoys with the most capacity are loaded first. Anything that fits in none of them is left behind, and\
  \ listed in the daily report. Each convoy carrying cargo is then dispatched separately, and each can be\
  \ intercepted.</p>\
  <p><b>INTERCEPTION</b></p>\
  <p>No convoys are intercepted while a garrison-type contract is <a href='GLOSSARY:GARRISON_RAIDS'>Peaceful</a>.\
  \ Otherwise, the interception chance starts from the enemy's <a href='GLOSSARY:MORALE'>Morale</a>: 0 when\
  \ Scattered, rising by 1 for each step, up to 6 when Overwhelming.</p>\
  <p>A convoy's weight then changes the chance by 1 for every 50 tons, or part thereof, above or below 200 tons. Your\
  \ own convoy weighs as much as all the units in it, including those that carry no cargo. An employer's convoy\
  \ counts as ten times the Resupply's tonnage. The chance is never below 1.</p>\
  <p>The chance is out of 10, and MekHQ rolls it twice. If the first roll succeeds, something happens. If the second\
  \ also succeeds, the convoy is intercepted. Otherwise, if it is your own convoy and not made up only of VTOLs or\
  \ only of aircraft, its leader sends a report from the road. These reports are colour only. For example, against a\
  \ Stalemate enemy (3), a 300-ton convoy (+2) has a chance of 5: something happens half the time, and the convoy is\
  \ intercepted a quarter of the time.</p>\
  <p><b>WHEN A CONVOY IS INTERCEPTED</b></p>\
  <p>A new StratCon scenario appears in one of the contract's sectors, with your convoy assigned to it, or with your\
  \ employer's convoy for you to defend. Convoys of only aircraft, convoys of mostly VTOLs and ground convoys each\
  \ have their own scenario. The enemy brings twice the Battle Value of the convoy, in two waves, regardless of the\
  \ campaign's difficulty setting.</p>\
  <p>The Resupply travels as a loot box named Resupply. When you resolve the scenario, you can collect it even if you\
  \ did not win overall.</p>\
  <p>If you leave the scenario unplayed until its date passes, the supplies are lost. If it was your own convoy, its\
  \ units are lost too, and each of their crew rolls 2d6: on 8 or more they are captured, as\
  \ <a href='GLOSSARY:PRISONERS_OF_WAR'>prisoners of war</a>, or as bondsmen if the enemy is a Clan. Otherwise they\
  \ are killed. Even a losing fight usually saves more than abandoning a convoy.</p>
### S
SCENARIO_VICTORY_POINTS.title=Scenario Victory Points
SCENARIO_VICTORY_POINTS.definition=Scenario Victory Points (SVP) determine the outcome of an individual scenario. A\
  \ negative SVP results in a Defeat. A neutral SVP leads to a Draw. A positive SVP counts as a Victory.\
 <p>Keep in mind that many scenarios offer multiple paths to victory - you don't need to complete every objective to\
  \ succeed.</p>\
 <p>SVP should not be confused with <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory Points (CVP)</a>.</p>
SCENES.title=Scenes
SCENES.definition=In solo roleplay, a scene is one continuous stretch of the story, like a scene in a film: a \
  briefing, a drop, a firefight, a negotiation, a debrief.\
  <p>When a scene ends, adjust the <a href='GLOSSARY:CHAOS_FACTOR'>chaos factor</a>: up by 1 if the scene was more \
  intense than the one before, otherwise down by 1.</p>
SEARCH_AND_RESCUE.title=Search and Rescue
SEARCH_AND_RESCUE.definition=<p>Search and Rescue (SAR) decides whether missing personnel are found. MekHQ abstracts \
  the Campaign Operations rules into a quick roll. The same roll decides <a href='GLOSSARY:PRISONER_CAPTURE'>who is \
  captured</a> after a scenario and, with a few changes, whether your <a href='GLOSSARY:MISSING_IN_ACTION'>Missing \
  in Action</a> personnel are found.</p> <h2>Target Number</h2> <p>The target number starts at 8. After a scenario, \
  the searcher always holds the battlefield, for -1. Then:</p> \
  <table><tr><th>Modifier</th><th>Value</th><th>Applies</th></tr> <tr><td>Missing person going to \
  ground</td><td>+4</td><td>On the ground</td></tr> <tr><td>SAR includes a VTOL or WiGE</td><td>-1</td><td>On the \
  ground</td></tr> <tr><td>SAR has Improved Sensors</td><td>-2</td><td>On the ground</td></tr> <tr><td>SAR has an \
  Active Probe</td><td>-1</td><td>On the ground, without Improved Sensors</td></tr> <tr><td>Not in planetary \
  orbit</td><td>+2</td><td>In space</td></tr> <tr><td>SAR includes a DropShip</td><td>-2</td><td>In \
  space</td></tr></table> <p>The searcher has Improved Sensors if its quality is good enough for them to be \
  available to its faction in the current year, or an Active Probe if that passes the same test instead. When you \
  search, your quality counts as D; when the enemy searches, its equipment rating is used. Outside a contract, the \
  enemy counts as a mercenary with quality D.</p> <p>Typical totals are 8 on the ground with Improved Sensors, 9 \
  with an Active Probe and 10 with neither, and 7 in space.</p> <h2>The Roll</h2> <p>Roll 2d6 twice for each missing \
  person, for two days of searching. If either roll meets the target number, they are found.</p> <h2>Searching for \
  Your MIA Personnel</h2> <p>Each day, everyone you have Missing in Action gets one 2d6 roll. Going to ground and \
  battlefield control don't apply, so the target number is usually 5 with Improved Sensors, 6 with an Active Probe \
  and 7 with neither. Your quality is your force's average experience level. Those who are found return to duty.</p>
SEED_FORCES.title=Seed Forces
SEED_FORCES.definition=<b>Note:</b> Seed Forces are no longer the default option for new campaigns. They have been \
  largely replaced by the <a href='GLOSSARY:NO_SEED_FORCES'>No Seed Forces</a> feature.\
  <p>When <a href='GLOSSARY:STRATCON'>StratCon</a> generates a scenario, it will pick a Seed Force. This can be any \
  <a href='GLOSSARY:FORCE_TYPE_COMBAT'>Combat Force</a> in your <a href='GLOSSARY:TOE'>TO&E</a>. The BV of that \
  Combat Force serves to balance the scenario. Forces assigned to the Auxiliary or Reserve \
  <a href='GLOSSARY:COMBAT_ROLES'>Combat Roles</a> will only be picked if There are no other suitable formations - \
  for example if they're the only formation not already assigned to scenarios. Or if you forget to assign formations \
  to Combat Roles.</p>\
 <p>If a scenario is generated when the formation <a href='GLOSSARY:HOW_TO_DEPLOY'>deploys</a> 'blind' into a hex covered by\
  \ fog  of war, or for a <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>Strategic Objective</a> scenario, then that formation is\
  \ going to be used as the seed formation rather than a random one.</p>\
 <p>Normally, There's no need to know which of your formations has been selected as a Seed Force. But if it becomes relevant\
 \ for roleplay or bug tracking purposes, note that it will always be shown in the MekHQ.log file. However, you should\
 \ look for it immediately when the scenario appears in your Briefing Room tab. Otherwise, it will either be buried or\
 \ lost when MekHQ is restarted. Look for a line containing the phrase, <i>Forced BV contribution</i>.</p>
NO_SEED_FORCES.title=No Seed Forces
NO_SEED_FORCES.definition=<a href='GLOSSARY:SEED_FORCES'>Seed Forces</a> were a system used by MekHQ to try and \
  provide scenarios roughly balanced to your campaign. However, as MekHQ has evolved, the system has become less \
  relevant.\
  <p>In modern campaigns, instead of picking a specific Seed Force, MekHQ will scan all combat teams that are set to \
  the <b>Frontline</b> or <b>Maneuver</b> <a href='GLOSSARY:COMBAT_ROLES'>Combat Roles</a>. Only formations \
  containing units that are valid for the scenario are considered. This means a formation containing AeroSpace and \
  Conventional Fighter assets will only be evaluated for ground and low-altitude scenarios.\
  <p>For each qualifying formation, MekHQ retrieves the formation's Battle Value (usually its \
  <a href='GLOSSARY:GENERIC_BATTLE_VALUE'>Generic Battle Value (GBV)</a>). These values are converted into a \
  Gaussian-weighted average. This allows MekHQ to tailor scenarios to your entire force. This creates a more \
  consistent experience and removes the need to manually track Seed Forces.</p>\
  <h2>Why Gaussian Weighting?</h2>\
  Math time! A simple arithmetic mean can be disproportionately influenced by unusually large or unusually small \
  values — common in campaigns where mixed-quality lances, ad hoc forces, or partially repaired units coexist. A \
  Gaussian-weighted average reduces the impact of such outliers by assigning more weight to values near the center of\
  \ the distribution.
SHELL_CONTRACTS.title=Shell Contracts
SHELL_CONTRACTS.definition=<p>A shell contract is a contract you write yourself, to hold scenarios you add by hand. \
  It is meant for human GMs, and for anyone running a campaign without <a href='GLOSSARY:STRATCON'>StratCon</a>.</p> \
  <h2>Creating One</h2> <p>Open the Contract Market (<b>Marketplace</b>, <b>Contract Market...</b>) and choose \
  <b>New Shell Contract (GM)</b>. The button only works in GM Mode. The contract skips negotiation and goes straight \
  into your active contracts.</p> <p>The form asks only for the basics:</p> <p>- <b>Name</b>, <b>Description</b> and \
  <b>Objective</b>. The objective is shown in the briefing and history, but nothing is generated from it.<br>- \
  <b>Employer</b> and <b>Enemy</b>. Pick a faction from the suggestions, or type any name. A name that matches no \
  faction is a custom one, and you choose whether it is Inner Sphere, Periphery or Clan; that sets its logo and \
  where its liaison or commander comes from.<br>- <b>System</b> and <b>Planet</b>, which may be left blank.<br>- \
  <b>Start Date</b> and <b>Length (Months)</b>, or <b>Open-Ended</b> for a contract that runs until you complete \
  it.<br>- <b>Monthly Pay</b>, credited at the start of each month while the contract is active. A successful \
  completion also pays any months still owed before the end date.<br>- <b>Salvage Rights</b> and <b>Command \
  Rights</b>.</p> <p>To change it later, select it in the Briefing Room and press <b>Edit Mission</b>.</p> <h2>What \
  It Doesn't Do</h2> <p>A shell contract is never set up with StratCon, and apart from its pay it runs none of the \
  usual contract automation: no <a href='GLOSSARY:MORALE'>morale</a>, <a href='GLOSSARY:RESUPPLY'>resupply</a>, <a \
  href='GLOSSARY:BATCHALL'>batchalls</a> or changes to your standing with the employer. MekHQ won't generate any \
  scenarios for it; add them with <a href='GLOSSARY:MANUAL_SCENARIOS'>Manual Scenarios</a>.</p> <p>For a full \
  contract with negotiated terms, use <b>Create New (GM)</b> in the Contract Market instead, which opens the \
  contract editor on a blank offer.</p>
SHOW_OF_INTEREST.title=Show of Interest
SHOW_OF_INTEREST.definition=<p>Under the MekHQ <a href='GLOSSARY:RECRUITMENT_STYLES'>Recruitment Style</a>, \
  experienced applicants are reluctant to join a less experienced command. After each applicant is generated, they \
  must make a Show of Interest to appear in the <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a>; an \
  applicant who does not is lost. Dependents always appear. The <b>Disable Show of Interest</b> option, on the \
  Recruitment Options page of Campaign Options, turns this off.</p> <p>The applicant's experience level in their \
  profession is compared with your command's average experience level, as used for <a \
  href='GLOSSARY:FORCE_REPUTATION'>Reputation</a>. An applicant always shows interest if their level is at least two \
  below your command's, or is Green or Ultra-Green. For each level above that, there is only a 1 in 10 chance they \
  are interested.</p> <p>Offering a <a href='GLOSSARY:GOLDEN_HELLO'>Golden Hello</a> closes the gap by one: an \
  applicant always shows interest if their level is at least one below your command's.</p> \
  <table><tr><th>Command</th><th>Regular</th><th>Veteran</th><th>Elite</th><th>Heroic</th><th>Legendary</th></tr> \
  <tr><td>Up to Veteran</td><td>10%</td><td>1%</td><td>0.1%</td><td>0.01%</td><td>0.001%</td></tr> \
  <tr><td>Elite</td><td>100%</td><td>10%</td><td>1%</td><td>0.1%</td><td>0.01%</td></tr> \
  <tr><td>Heroic</td><td>100%</td><td>100%</td><td>10%</td><td>1%</td><td>0.1%</td></tr> \
  <tr><td>Legendary</td><td>100%</td><td>100%</td><td>100%</td><td>10%</td><td>1%</td></tr></table> <p><b>With a \
  Golden Hello</b></p> \
  <table><tr><th>Command</th><th>Regular</th><th>Veteran</th><th>Elite</th><th>Heroic</th><th>Legendary</th></tr> \
  <tr><td>Up to Regular</td><td>10%</td><td>1%</td><td>0.1%</td><td>0.01%</td><td>0.001%</td></tr> \
  <tr><td>Veteran</td><td>100%</td><td>10%</td><td>1%</td><td>0.1%</td><td>0.01%</td></tr> \
  <tr><td>Elite</td><td>100%</td><td>100%</td><td>10%</td><td>1%</td><td>0.1%</td></tr> \
  <tr><td>Heroic</td><td>100%</td><td>100%</td><td>100%</td><td>10%</td><td>1%</td></tr> \
  <tr><td>Legendary</td><td>100%</td><td>100%</td><td>100%</td><td>100%</td><td>10%</td></tr></table> <p>Ultra-Green \
  and Green applicants always show interest.</p>
SKILL_TYPES.title=Skill Types
SKILL_TYPES.definition=Skills are broken up into four types: Combat, Support, Utility, and Roleplay. Each skill has a\
 \ tooltip which explains the skill and its <a href='GLOSSARY:LINKED_ATTRIBUTES'>Linked Attributes</a>.\
 <p>- <b>Combat</b> skills are those that are directly used in combat scenarios. They include things like gunnery and\
 \ piloting.\
 <br>- <b>Support</b> skills are those used at the campaign level and are not used in combat. These are things like\
 \ <i>Administration</i> and the various tech skills.\
 <br>- <b>Roleplay</b> skills exist just for roleplay purposes and are not mechanically implemented. This includes\
 \ things like the various Art skills.\
 <br>- <b>Utility</b> skills sit between the two: general-purpose skills that have some mechanical use, such as\
 \ Perception, Stealth, Tracking, MedTech, the granular tech skills, and the command skills (Leadership, Strategy,\
 \ Tactics and Training).</p>
STRATCON.title=Digital GM: StratCon
STRATCON.definition=<p>Introduced in 2021, StratCon officially replaced <a href='GLOSSARY:ATB'>Against the Bot</a> \
  as the premier <a href='GLOSSARY:DIGITAL_GM'>Digital GM</a> in 2024.</p> <p>StratCon allows you to engage in \
  battles across an entire <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a>, tackle challenging \
  scenarios, collect salvage, and complete <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>strategic objectives</a>.</p> \
  <p>StratCon has three modes: normal (the default experience), <a href='GLOSSARY:STRATCON_MAPLESS'>Mapless</a>, and \
  <a href='GLOSSARY:STRATCON_SINGLE_DROP'>Single Drop</a>.</p> <h2>Getting Started</h2> <p>Choose a mode with \
  <b>StratCon Ruleset (Digital GM)</b>, in the General Options section of the StratCon General page. Most campaign \
  presets already turn StratCon on. <b>Difficulty</b>, on the same page, sets how strong your enemies are (see <a \
  href='GLOSSARY:FORCE_GENERATION'>Force Generation</a>). New players are recommended to start on Green or \
  Ultra-Green, and the <i>New Players Start Here</i> preset uses Ultra-Green.</p> <p>A typical contract runs like \
  this:</p> <ol><li>Accept a contract and travel to its system.</li> <li>In the Briefing Room, check that each <a \
  href='GLOSSARY:COMBAT_TEAMS'>Combat Team</a> is assigned to the contract and give it a <a \
  href='GLOSSARY:COMBAT_ROLES'>Combat Role</a>. Combat Teams left in Reserve take no part.</li> <li>Scenarios appear \
  on the Area of Operations map and in the Briefing Room. Depending on your <a \
  href='GLOSSARY:COMMAND_RIGHTS'>Command Rights</a>, your employer may also send <a \
  href='GLOSSARY:DEPLOYMENT_ORDERS'>Deployment Orders</a>.</li> <li>Send Patrols out to scout, and <a \
  href='GLOSSARY:HOW_TO_DEPLOY'>deploy</a> to the scenarios you choose to fight.</li> <li>Fight, resolve the \
  scenario, repair, and repeat until the contract ends.</li></ol> <p>For advice, see <a \
  href='GLOSSARY:STRATCON_TIPS'>StratCon Tips</a>.</p>
STRATCON_FACILITIES.title=StratCon Facilities
STRATCON_FACILITIES.definition=In <a href='GLOSSARY:STRATCON'>StratCon</a>, the <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area\
  \ of Operations</a> may contain special facilities. Facilities on the Area of Operations map may be allied or enemy \
  \controlled. Facilities provide positive or negative effects on your unit depending on ownership and the type of \
  facility. During missions that have multiple sectors on the Area of Operations map, facilities will only participate \
   on the sector where they are found.  Facilities have the potential to turn the tide of a mission, so neutralization \
  of enemy facilities is key to mission success.\
<h2>Allied Facilities</h2>\
  <ul><li><b>Air Base:</b> Allied aircraft will participate in scenarios on this sector and defend this facility.</li>\
  <li><b>Artillery Base:</b> A force of allied artillery will participate in scenarios on this sector and defend this \
  facility.</li> \
  <li><b>Base of Operations:</b> This base is defended by turrets and a commander in a mek. \
  The commander will participate in scenarios on this sector.</li>\
  <li><b>Comms Center:</b> Coordinates additional allied reinforcements to scenarios on this sector.</li>\
  <li><b>Data Center:</b> Increases the Area of Operations scan range (view distance) of all player units by 1 hex.</li>\
  <li><b>Early Warning Center:</b> Reduces reinforcement arrival times for allied and player forces.</li>\
  <li><b>Industrial Center:</b> Provides 1 Employer Support per month of allied logistical support.</li>\
  <li><b>Mek Base:</b> Allied meks will participate in scenarios on this sector and defend this facility.</li>\
  <li><b>Orbital Defense:</b> Prevents hostile air units from operating on this sector (Note: this does NOT affect ASF added \
  by random modifiers).</li>\
  <li><b>Space Port:</b> Provides 2 Employer Support per month of allied logistical support.</li>\
  <li><b>Supply Depot:</b> A source of supply. Keeps allied facilities within 3 hexes on their\
  \ <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>supply lines</a>, road or no road.</li>\
  <li><b>Tank Base:</b> Allied vehicles will participate in scenarios on this sector and defend this facility.</li>\
  <li><b>Sensor Post:</b> Increases the scan range of all player units on this sector by 1.</li>\
  <li><b>Jamming Station:</b> Hides your movements: fewer scenarios on this sector.</li>\
  <li><b>Field Fortifications:</b> Allied turrets fight in scenarios at this facility, and nowhere else.</li>\
  <li><b>Militia Barracks:</b> Allied trainees fight in scenarios at this facility, and militia patrols mean fewer\
  \ scenarios on this sector.</li></ul>\
  <h2>Enemy Facilities</h2>\
  <ul><li><b>Air Base:</b> Hostile aircraft will participate in scenarios on this sector and defend this facility.</li>\
  <li><b>Artillery Base:</b> Hostile artillery will participate in scenarios on this sector and defend this \
  facility.</li> \
  <li><b>Base of Operations:</b> This base is defended by well-equipped hostile veteran troops, turrets, and a commander in a \
  mek. The commander will participate in scenarios on this sector.</li>\
  <li><b>Comms Center:</b> Adds an additional negative modifier to scenarios, representing additional reinforcements.</li>\
  <li><b>Data Center:</b> An additional hostile mek patrol will sweep through scenarios on this sector.</li>\
  <li><b>Early Warning Center:</b> Reduces hostile reinforcement arrival time for the scenarios on this sector.</li>\
  <li><b>Industrial Center:</b> Hostile forces on this sector are larger and better equipped with factory-fresh units.</li>\
  <li><b>Mek Base:</b> Hostile meks will participate in scenarios on this sector and defend this facility.</li>\
  <li><b>Orbital Defense:</b> Prevents allied air units from operating on this sector and supplies an additional hostile mek \
  to ground scenarios.</li>\
  <li><b>Space Port:</b> Hostile forces on this sector are 15% larger due to improved logistics.</li>\
  <li><b>Supply Depot:</b> A source of enemy supply. Keeps enemy facilities within 3 hexes on their supply lines. Taking or\
  \ destroying it forces them onto longer routes, and cuts them off where no other route can be found.</li>\
  <li><b>Tank Base:</b> Hostile vehicles will participate in scenarios on this sector and defend this facility.</li>\
  <li><b>Sensor Post:</b> More scenarios on this sector, and scenarios at the post may begin with an enemy ambush.</li>\
  <li><b>Jamming Station:</b> Reduces the scan range of all player units on this sector by 1.</li>\
  <li><b>Field Fortifications:</b> Scenarios at this facility face hostile turrets and fast-arriving reinforcements;\
  \ the rest of the sector is unaffected.</li>\
  <li><b>Militia Barracks:</b> Its defenders are green, but militia patrols mean many more scenarios on this\
  \ sector.</li></ul>\
 <p>If you're experiencing negative scenario modifiers from an enemy-controlled facility, it is crucial to locate and\
  \ neutralize (or capture) it. Modifiers from enemy facilities can mean the difference between a tough fight and a\
  \ complete massacre.</p>\
<h2>Tier, Condition and Garrison</h2>\
  <p>Each facility is an Outpost, a Base or a Stronghold; larger ones hold a bigger garrison. Facilities are worn down\
  \ by the fights over them, from Intact to Damaged to Crippled, and most fights cost them garrison. How much you know\
  \ about an enemy facility depends on your <a href='GLOSSARY:STRATCON_FACILITY_INTEL'>intel</a> on it, and some\
  \ facilities have <a href='GLOSSARY:STRATCON_FACILITY_TRAITS'>traits</a> of their own. See\
  \ <a href='GLOSSARY:STRATCON_FACILITY_TIERS'>Tier, Condition and Garrison</a>.</p>\
<h2>Synergies</h2>\
  <p>Some facilities do more together: an Artillery Base with a Comms Center, an Air Base with an Early Warning\
  \ Center, and a Data Center with any Mek, Tank or Air Base, or a Base of Operations. A fight at one of a pair held by\
  \ the same side draws on the other's support too, unless either is crippled or cut off. Break the link to weaken\
  \ both. See <a href='GLOSSARY:STRATCON_FACILITY_SYNERGIES'>Synergies</a>.</p>\
  <p>See also <a href='GLOSSARY:STRATCON_FACILITY_ORDERS'>Facility Orders</a>,\
  \ <a href='GLOSSARY:STRATCON_FACILITY_CAPTURE'>Capturing Facilities</a>,\
  \ <a href='GLOSSARY:STRATCON_FACILITY_PROFILES'>Contract Facility Profiles</a>,\
  \ <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>Supply Lines</a> and\
  \ <a href='GLOSSARY:STRATCON_ENEMY_FACILITY_ACTIVITY'>Enemy Facility Activity</a>.</p>
STRATCON_FACILITY_ORDERS.title=StratCon Facility Orders
STRATCON_FACILITY_ORDERS.definition=With the Facility Operations campaign option, formations deployed on or next to a\
  \ <a href='GLOSSARY:STRATCON_FACILITIES'>facility</a> can be given orders from the StratCon map's right-click menu.\
  \ Most orders need a formation on or next to the facility; Fortify, Reinforce Garrison, Build and Interdict Supply\
  \ need one on the hex itself. Most orders cost Employer Support; Recon and Assault are free.\
  <ul><li><b>Recon:</b> watch an enemy facility for a week to learn more about it. A Patrol does it best.</li>\
  <li><b>Raid:</b> strike an enemy facility without taking it. Win and it loses a condition step and a garrison step,\
  \ and you carry off a small Resupply of captured supplies; otherwise it loses a garrison step.</li>\
  <li><b>Sabotage:</b> on espionage and sabotage contracts, or contracts using special mechanics, cripple a facility you know well without a stand-up\
  \ fight. Saboteurs who are caught must fight their way out.</li>\
  <li><b>Assault:</b> attack an enemy facility to take it. Win the scenario and it is yours: choose to hold it, raze\
  \ it, or hand it over to your employer for a bonus (see <a href='GLOSSARY:STRATCON_FACILITY_CAPTURE'>Capturing\
  \ Facilities</a>). Otherwise it holds, at the cost of a garrison step. There are no separate capture or destroy\
  \ objectives: the scenario's briefing says what is at stake.</li>\
  <li><b>Fortify:</b> expand a facility you hold by one tier. Your employer manages its own facilities.</li>\
  <li><b>Reinforce Garrison:</b> bring a facility you hold back to full garrison.</li>\
  <li>Neither Fortify nor Reinforce Garrison can be ordered while a fight is under way on the facility's hex.</li>\
  <li><b>Build:</b> spend two weeks building a new Outpost on an empty hex: a Supply Depot, Field Fortifications, a\
  \ Sensor Post or a Jamming Station. Strategic sites such as Space Ports and Industrial Centers can only be captured.\
  \ The first Build costs 3 Employer Support, and each facility you have built and still hold, or are building, adds\
  \ 1 to the next. Each one you have built also costs 1 Employer Support a month to keep up; if you cannot pay, its\
  \ condition worsens. Facilities you capture cost no upkeep. You cannot build in a sector already as crowded as one\
  \ is allowed to start.</li>\
  <li><b>Interdict Supply:</b> ambush the enemy's convoys on a scouted hex of one of its supply routes, cutting its\
  \ <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>supply line</a> through that hex for four weeks if you win. The cut\
  \ blocks every enemy facility beyond it on the route.</li>\
  <li><b>Siege:</b> surround an enemy facility from a hex next to it. Each week it loses a garrison step for each\
  \ besieging formation, at most two, and cannot repair or reinforce, while each formation costs Employer Support and\
  \ tires. The garrison may sortie against your lines, and the enemy sends a relief force one time in four as the\
  \ siege begins; lose or leave either fight unplayed and the siege is broken. With no garrison left, the facility surrenders without a fight. A\
  \ facility cut off from its supply lines can neither sortie nor be relieved. You can lift a siege at any time. See\
  \ <a href='GLOSSARY:STRATCON_SIEGES'>Sieges</a>.</li></ul>\
  <p>Raids and Sabotage are forbidden against a Clan enemy while the terms of an accepted\
  \ <a href='GLOSSARY:BATCHALL'>Batchall</a> hold.</p>
STRATCON_ENEMY_FACILITY_ACTIVITY.title=StratCon Enemy Facility Activity
STRATCON_ENEMY_FACILITY_ACTIVITY.definition=The enemy does not sit still between your fights.\
  <ul><li><b>Upkeep:</b> with Facility Operations, each month enemy facilities repair a condition step and regain a\
  \ garrison step, unless a fight is under way there, they are cut off from their\
  \ <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>supply lines</a>, or they are under siege. Your employer keeps its own\
  \ facilities up the same way.</li>\
  <li><b>Facility attacks:</b> once a month per point of the contract's Scale, on a random day, the enemy\
  \ <a href='GLOSSARY:STRATCON_COUNTERATTACKS'>attacks</a> the facilities held by you or your employer, if there are any:\
  \ most often a counterattack fought that same day, otherwise a\
  \ <a href='GLOSSARY:STRATCON_SUPPLY_INTERDICTION'>Supply Interdiction</a> across your supply routes. The enemy never\
  \ attacks its own facilities: dealing with those is up to you.</li>\
  <li><b><a href='GLOSSARY:STRATCON_ENEMY_ENGINEERS'>Engineers</a>:</b> enemy work parties appear on the map. Drive them\
  \ off before they finish, or they leave a new enemy Outpost behind.</li>\
  <li><b>Relief forces:</b> when you begin a <a href='GLOSSARY:STRATCON_SIEGES'>siege</a>, the enemy sends a relief\
  \ force against it one time in four.</li></ul>
STRATCON_COUNTERATTACKS.title=StratCon Counterattacks
STRATCON_COUNTERATTACKS.definition=As part of <a href='GLOSSARY:STRATCON_ENEMY_FACILITY_ACTIVITY'>Enemy Facility\
  \ Activity</a>, the enemy strikes back at <a href='GLOSSARY:STRATCON_FACILITIES'>facilities</a> held by you or your\
  \ employer.\
  <p>Once a month per point of the contract's Scale, on a random day, the enemy attacks a random facility held by you\
  \ or your employer, whether or not you use Facility Operations. It is a counterattack, fought that same day like any\
  \ other scenario, unless you use <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>supply lines</a> and the enemy can reach one\
  \ of your supply routes, when one attack in three is a\
  \ <a href='GLOSSARY:STRATCON_SUPPLY_INTERDICTION'>Supply Interdiction</a> instead. With no facility on your side to\
  \ attack, or none without a fight already on it, that month's attack does not come.</p>\
  <p>A counterattack is a Base Defense scenario: your formations hold the facility while its own turrets, four for each\
  \ garrison step, fight alongside them. Formations already on the facility's hex are committed to it at once. The\
  \ facility is marked <i>Under Attack</i> on the map until the fight is settled, and the briefing says what is at\
  \ stake.</p>\
  <p>Counterattacks are never <a href='GLOSSARY:CRISIS_SCENARIO'>Crises</a> or\
  \ <a href='GLOSSARY:TURNING_POINTS'>Turning Points</a>, and never pay the combat bonus.</p>\
  <ul><li><b>A facility you hold:</b> win and it stays yours, unharmed; a draw keeps it at the cost of one garrison\
  \ step. Lose, or leave the fight unplayed, and the enemy takes it.</li>\
  <li><b>A facility your employer holds:</b> if you stay away, your employer fights it out without you. Its garrison,\
  \ tier, troop quality and morale decide the outcome. The facility loses a garrison step either way.</li></ul>\
  <p>A relief force sent against one of your <a href='GLOSSARY:STRATCON_SIEGES'>sieges</a> is not a counterattack:\
  \ see Sieges.</p>
STRATCON_ENEMY_ENGINEERS.title=StratCon Enemy Engineers
STRATCON_ENEMY_ENGINEERS.definition=As part of <a href='GLOSSARY:STRATCON_ENEMY_FACILITY_ACTIVITY'>Enemy Facility\
  \ Activity</a>, the enemy sends engineering parties to build new facilities.\
  <p>Engineers appear on the StratCon map as a point of interest, once a month per point of the contract's Scale, on a\
  \ random day, while Facility Operations is on, and work for eight to fourteen days. Deploy a formation to their hex\
  \ to drive them off. Deploying makes the usual scenario roll: with no scenario, they scatter; with one, their escort\
  \ ambushes your formation in a <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario, and only a win drives them\
  \ off.</p>\
  <p>If you let them finish, or fail to beat their escort, they leave a new enemy Outpost behind on that hex. They\
  \ cannot build on a hex that is already occupied, or once the sector holds as many facilities as it may, but they\
  \ still leave the map.</p>
STRATCON_SUPPLY_INTERDICTION.title=StratCon Supply Interdictions
STRATCON_SUPPLY_INTERDICTION.definition=As part of <a href='GLOSSARY:STRATCON_ENEMY_FACILITY_ACTIVITY'>Enemy Facility\
  \ Activity</a>, the enemy sends raiders to sit across the routes that carry supplies to your and your employer's\
  \ <a href='GLOSSARY:STRATCON_FACILITIES'>facilities</a> (see <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>Supply\
  \ Lines</a>).\
  <p>A Supply Interdiction appears on the StratCon map as a point of interest on one of your supply routes. It is one\
  \ of the enemy's <a href='GLOSSARY:STRATCON_COUNTERATTACKS'>attacks on your facilities</a>, and none come while a\
  \ garrison-type contract is <a href='GLOSSARY:GARRISON_RAIDS'>Peaceful</a>.</p>\
  <p>While it is on the map, every facility whose supply route runs through its hex is <b>cut off</b>. Deploy a\
  \ formation to the hex to break it up. Deploying makes the usual scenario roll: with no scenario, the raiders\
  \ scatter; with one, they ambush your formation in a <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario, and\
  \ only a win breaks them up. Otherwise they hold the route until they leave of their own accord, eight to fourteen\
  \ days after they appear. Once they are gone, the route is open again.</p>
STRATCON_FACILITY_CAPTURE.title=StratCon Capturing Facilities
STRATCON_FACILITY_CAPTURE.definition=When you win an Assault on an enemy <a href='GLOSSARY:STRATCON_FACILITIES'>\
  facility</a>, or a <a href='GLOSSARY:STRATCON_SIEGES'>siege</a> ends in surrender, you decide what happens to it.\
  <ul><li><b>Hold:</b> your own troops move in with a full garrison. Its effects switch to your side, its support\
  \ answers every fight that draws on it, and you can order it fortified or reinforced. In return, you must defend it\
  \ yourself: a counterattack you leave unplayed takes it.</li>\
  <li><b>Raze:</b> destroy it. This raises Escalation, and razing civilian infrastructure (Space Ports, Data Centers\
  \ and Industrial Centers) raises it a great deal more. A facility your contract's objectives need standing cannot\
  \ be razed.</li>\
  <li><b>Hand Over:</b> give it to your employer for a bonus. Your employer garrisons it in full, keeps it up each\
  \ month, and defends it without you if you stay away from a counterattack. Its effects work for your side as an\
  \ allied facility, but you cannot give it orders, and its support answers a fight that draws on it only half the\
  \ time.</li></ul>\
  <p>Facilities you or your employer hold may be targeted by <a href='GLOSSARY:STRATCON_COUNTERATTACKS'>\
  counterattacks</a>.</p>
STRATCON_FACILITY_INTEL.title=StratCon Facility Intel
STRATCON_FACILITY_INTEL.definition=How much you know about an enemy <a href='GLOSSARY:STRATCON_FACILITIES'>facility\
  </a> depends on your intel on it. You always know everything about facilities your own side holds.\
  <ul><li><b>Unknown:</b> the facility is not shown on the map.</li>\
  <li><b>Located:</b> you know where it is and what type it is.</li>\
  <li><b>Scouted:</b> you also know its <a href='GLOSSARY:STRATCON_FACILITY_TIERS'>tier and condition</a>.</li>\
  <li><b>Detailed:</b> you also know its garrison and its <a href='GLOSSARY:STRATCON_FACILITY_TRAITS'>traits</a>.</li></ul>\
  <p>Scouting a facility's hex makes it Scouted. A successful Recon order raises your intel by one level, and\
  \ with Facility Operations, fighting at a facility makes it Detailed. Sabotage needs Detailed intel. Losing a facility you held does not\
  \ cost you what you know about it.</p>\
  <p>Select a facility's hex on the map to show its label: its name, as much of its tier, condition and garrison as\
  \ you know, and whether it is cut off, besieged or under attack. Labels are hidden otherwise, so they don't cover\
  \ the map.</p>
STRATCON_FACILITY_PROFILES.title=StratCon Contract Facility Profiles
STRATCON_FACILITY_PROFILES.definition=Each contract type shapes the <a href='GLOSSARY:STRATCON_FACILITIES'>\
  facilities</a> in its sectors. Its profile sets which facility types are most common, how many belong to your\
  \ employer, whether they start larger or smaller than the contract's scale suggests, and how many there are.\
  <p>Some contracts also anchor a sector around a key facility: a Planetary Assault, for example, always faces an\
  \ enemy Base of Operations. The contract's briefing describes what to expect.</p>\
  <p>The Facility Density campaign option scales how many facilities every contract generates.</p>
STRATCON_FACILITY_SYNERGIES.title=StratCon Facility Synergies
STRATCON_FACILITY_SYNERGIES.definition=Some <a href='GLOSSARY:STRATCON_FACILITIES'>facilities</a> are stronger\
  \ together when the same side holds both on a sector:\
  <ul><li>an Artillery Base and a Comms Center,</li>\
  <li>an Air Base and an Early Warning Center,</li>\
  <li>a Data Center and any Mek Base, Tank Base, Air Base or Base of Operations.</li></ul>\
  <p>A fight at one facility of a pair also draws on its partner's support. A synergy is lost while either facility\
  \ is crippled or cut off from its <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>supply lines</a>, so breaking one link\
  \ weakens both, and a damaged partner has no support to lend.</p>
STRATCON_FACILITY_TRAITS.title=StratCon Facility Traits
STRATCON_FACILITY_TRAITS.definition=When a <a href='GLOSSARY:STRATCON_FACILITIES'>facility</a> is placed, at the start\
  \ of a contract or later, it may be given up to two traits that set it apart from others of its type. You learn an enemy\
  \ facility's traits once you have <a href='GLOSSARY:STRATCON_FACILITY_INTEL'>Detailed intel</a> on it.\
  <ul><li><b>Undermanned:</b> holds one garrison step fewer than its tier allows. Never found on an Outpost.</li>\
  <li><b>Veteran Garrison:</b> fights at an enemy facility face better-skilled troops; one held by your employer\
  \ holds out better if you leave it to face a <a href='GLOSSARY:STRATCON_COUNTERATTACKS'>counterattack</a> alone.</li>\
  <li><b>Poor Morale:</b> under <a href='GLOSSARY:STRATCON_SIEGES'>siege</a>, it surrenders with one garrison step\
  \ left; one held by your employer holds out worse against a counterattack you stay away from.</li>\
  <li><b>Hardened:</b> a won raid or attack that does not capture it leaves its condition alone, and sabotage only\
  \ drops it one step.</li>\
  <li><b>Well-Stocked:</b> a won raid on an enemy facility brings in 2 extra Employer Support. Held by your side, it\
  \ provides 1 extra Employer Support each month.</li>\
  <li><b>Experimental Weapons:</b> fights at an enemy facility face better-equipped troops, but capturing it brings in 2\
  \ Employer Support once.</li></ul>\
  <p>Veteran Garrison and Poor Morale describe the troops, as does Undermanned, so they are lost when the facility\
  \ changes sides. The others describe the place, and stay with it.</p>
STRATCON_FACILITY_TIERS.title=StratCon Facility Tier, Condition and Garrison
STRATCON_FACILITY_TIERS.definition=Every <a href='GLOSSARY:STRATCON_FACILITIES'>facility</a> has three measures of\
  \ strength.\
  <h2>Tier</h2>\
  <p>A facility is an Outpost, a Base or a Stronghold, which can hold one, two or three garrison steps respectively.\
  \ Larger contracts field larger facilities. The Fortify order raises a facility you hold by one tier.</p>\
  <h2>Condition</h2>\
  <p>A facility is Intact, Damaged or Crippled. An Intact facility's effects work in full. A Damaged one's numeric\
  \ effects, such as scan range, Employer Support and scenario odds, are halved, and it lends no support to fights\
  \ elsewhere in the sector. A Crippled one's effects do nothing, though its garrison still defends it. Fights, raids\
  \ and sabotage wear facilities down; a facility cut off from its\
  \ <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>supply lines</a> loses a step each month.</p>\
  <h2>Garrison</h2>\
  <p>The garrison is the troops defending a facility. With none left it has no defenders of its own. The first step\
  \ brings the facility's own defenders, and each step above that adds turrets and then more troops for the holding\
  \ side. The garrison also mans the facility's own turrets in a fight over it: four for each garrison step, and none\
  \ with no garrison left. Fights at a facility cost it a garrison step, as does each week of a\
  \ <a href='GLOSSARY:STRATCON_SIEGES'>siege</a>, except a defense of your side's facility that you win, and a fight to\
  \ escape a failed Recon or Sabotage. The Reinforce Garrison order brings a facility you hold back to full.</p>\
  <p>Each month, your employer's facilities repair a condition step and regain a garrison step, and so do the enemy's\
  \ with Facility Operations, unless a fight is under way there, they are cut off, or they are under siege. Facilities\
  \ you hold only recover through your orders.</p>\
  <p>With Facility Operations off, fights do not wear facilities down, and fights over enemy facilities are settled by\
  \ their capture and destroy objectives instead of by the scenario's result.</p>
STRATCON_SIEGES.title=StratCon Sieges
STRATCON_SIEGES.definition=A siege starves an enemy <a href='GLOSSARY:STRATCON_FACILITIES'>facility</a> into\
  \ surrender instead of storming it. Order it from the <a href='GLOSSARY:STRATCON_FACILITY_ORDERS'>Facility Orders\
  </a> menu for a formation on a hex next to the facility, not on the facility itself.\
  <ul><li><b>Cost:</b> each besieging formation costs Employer Support every week, and its crews gain \
  <a href='GLOSSARY:FATIGUE'>Fatigue</a>.\
  \ If you cannot pay, the siege is lifted.</li>\
  <li><b>Pressure:</b> each week the facility loses one garrison step for each besieging formation, to a maximum of\
  \ two, and cannot repair or reinforce. A siege under a week old has no effect yet.</li>\
  <li><b>Surrender:</b> with no garrison left, the facility surrenders without a fight, and you choose what to do with\
  \ it as if you had <a href='GLOSSARY:STRATCON_FACILITY_CAPTURE'>captured</a> it.</li>\
  <li><b>Sorties:</b> the garrison may break out against your lines. Win and the garrison loses another step; lose or\
  \ leave the fight unplayed and every siege on the facility is broken. A draw changes nothing.</li>\
  <li><b>Relief:</b> as the siege begins, the enemy sends a relief force one time in four. It is a\
  \ <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario: lose or leave it unplayed and every siege on the\
  \ facility is broken. A draw changes nothing.</li></ul>\
  <p>A facility cut off from its <a href='GLOSSARY:STRATCON_SUPPLY_LINES'>supply lines</a> can neither sortie nor be\
  \ relieved. A besieging formation can't be given any other order until its siege is lifted, and you can lift a siege at any\
  \ time.</p>
STRATCON_MAPLESS.title=StratCon (Mapless)
STRATCON_MAPLESS.definition=In <a href='GLOSSARY:STRATCON'>StratCon</a>, we use an \
  <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a> to help provide strategic context to individual \
  scenarios. In 50.10 we removed support for <a href='GLOSSARY:ATB'>Against the Bot (AtB)</a>. To ensure players who \
  preferred the style of <a href='GLOSSARY:DIGITAL_GM'>Digital GM</a> provided by AtB, we introduced StratCon Mapless\
  \ Mode.\
  <p>In Mapless Mode the Area of Operations is completely removed. Scenarios are generated, as normal, but there is \
  no interaction with the StratCon map. This offers a comparable experience to AtB, but with all the improvements \
  made during the development of StratCon.</p>
STRATCON_SCENARIOS.title=StratCon Scenarios
STRATCON_SCENARIOS.definition=Each scenario represents a strategic opportunity identified by <b>Allied Command</b> - \
  either to advance your goals or stop the enemy from achieving theirs. Don't try to complete every scenario - you'll \
  quickly run out of resources. It's your job to choose when and where to fight.\
  <p>You must decide whether to engage or ignore each scenario. To <b>refuse an engagement</b>, simply advance the day \
  past the scenario's scheduled date. But be warned: refusing a scenario counts as a <b>decisive defeat</b> for enemy \
  morale calculations.</p>\
  <p>If you've already deployed formations to a scenario but then refuse to fight, it only counts as a <b>normal \
  defeat</b>. This is because the enemy must still account for your presence, limiting their strategic options - a \
  concept known as a "fleet in being."</p>\
  <h2>Contract Victory Points (CVP)</h2>\
  In <b>StratCon</b>, you must end a contract with a CVP score that meets its target: a positive score on most \
  contracts, or simply not below zero on the rest. Even if all other objectives are met, missing the target results \
  in at best a <b>Success</b>, not a <b>Perfect Success</b>.\
  <ul><li>+1 CVP for each successful <b>Turning Point</b> scenario.</li>\
  <li>-1 CVP for each Turning Point loss.</li>\
  <li><b>Crisis</b> scenarios: -1 CVP for a loss or draw. No CVP is awarded for a win.</li></ul>\
  <h2>Combat Roles</h2>\
  Upon arrival in a target system, assign your formations to combat roles. Each role serves a specific purpose:\
  <ul><li><b>Frontline:</b> Enables scenario support with minefields or infantry (if available).</li>\
  <li><b>Maneuver:</b> Increases the chance of successful reinforcement.</li>\
  <li><b>Training:</b> Allows veteran units to train subordinates.</li>\
  <li><b>Patrol:</b> Increases the radius of hexes that will be revealed when deploying to the AO by 1. Will never be \
  ambushed by enemy forces unless deployed to a hex still covered by fog of war. Will not scan adjacent hexes if \
  deployed to a scenario.</li>\
  <li><b>Auxiliary:</b> The only source of <b>Leadership</b> units - bonus units deployed based on the formation \
  leader's Leadership skill. Forces assigned to this role cannot be directly deployed to scenarios.</li>\
  <li><b>Reserve:</b> Default role. Forces here can't be deployed and are ignored for combat purposes.</li></ul>\
  <h2>Employer Support</h2>\
  In <b>StratCon</b>, you earn <a href='GLOSSARY:EMPLOYER_SUPPORT'>Employer Support</a> when you accept a contract and periodically during the contract, \
  based on the <b>Administration</b> skill of your <b>Admin</b> personnel.\
  <h2>Reinforcing Scenarios</h2>\
  In <b>StratCon</b>, you'll sometimes face overwhelming odds. Fortunately, you can reinforce scenarios to turn the \
  tide.\
  <p>To reinforce:</p>\
  <ol><li>Deploy your <b>Primary Combat Team</b> (the first formation assigned to the scenario).</li>\
  <li>Right-click on the scenario and select <b>Manage Reinforcements</b>.</li></ol>\
  <p>You must have at least <b>1 Employer Support</b> to attempt reinforcement. You can spend additional Employer Support to \
  reduce the scenario's <b>Target Number</b> - a difficulty score based on:</p>\
  <ul><li>Contract balance of power (enemy morale)</li>\
  <li>Enemy skill level</li>\
  <li>The <b>Administration</b> skill of your highest-ranking <b>Admin</b> character</li></ul>\
  <p>If the <b>Reinforcement Check</b> fails, reinforcements may arrive late - or be intercepted. Weigh your available \
  Employer Support against the risk of failure before committing.</p>
STRATCON_SCENARIO_MODIFIERS.title=StratCon Scenario Modifiers
STRATCON_SCENARIO_MODIFIERS.definition=<p>Scenario modifiers change a <a href='GLOSSARY:STRATCON'>StratCon</a> \
  scenario. Many add forces, such as enemy reinforcements, allied air support or artillery. Others change the \
  conditions of the fight. Some help you and some hurt you. Each modifier is described in the scenario's \
  briefing.</p> <h2>Where They Come From</h2> <p>- <b>Random modifiers:</b> when a scenario is generated, it has a \
  25% chance of a random modifier. Each time one is added, it rolls again for another, up to a maximum of 3. Which \
  modifiers can appear depends on whether the fight is on the ground, in low atmosphere or in space, and a few of \
  them stop any more being added. Fights over a facility never get random modifiers. <br>- <b>The facility being \
  fought over:</b> a scenario on a <a href='GLOSSARY:STRATCON_FACILITIES'>Facility</a> brings that facility's own \
  modifiers, such as its garrison and turrets, plus support from its <a \
  href='GLOSSARY:STRATCON_FACILITY_SYNERGIES'>synergy</a> partners. <br>- <b>Support from elsewhere in the \
  sector:</b> each new scenario rolls once for your side and once for the enemy. On a 1 in 2, a random facility that \
  side holds in the sector lends the scenario its support. A facility your employer holds only answers half the \
  time, so a facility you hold yourself is more dependable. Each facility lends support at most once a week, and a \
  damaged or crippled facility lends none. Enemy facilities lend support even before you have found them. The \
  scenario notes which facilities lent support. An enemy facility is identified only by its hex, which at least \
  tells you where to look. <br>- <b>Your contract:</b> some contracts add modifiers to every scenario. Under House \
  <a href='GLOSSARY:COMMAND_RIGHTS'>Command Rights</a>, an officer from Allied Command joins your <a \
  href='GLOSSARY:TURNING_POINTS'>Turning Points</a>.</p> <p>The Mapless modes have no facilities, so only random and \
  contract modifiers apply.</p> <h2>How Big They Are</h2> <p>A force added by a modifier gets <b>Battle Value \
  Percent</b> (50% by default) of the budget that a normal force in the scenario would get, unless the modifier sets \
  its own size. Enemy forces are also scaled by Difficulty (see <a href='GLOSSARY:FORCE_GENERATION'>Force \
  Generation</a>).</p> <p>While a <a href='GLOSSARY:BATCHALL'>Batchall</a> stands and <b>Clans Better Obey Bidding \
  Rules</b> is on, modifiers that would add forces to a Clan side are blocked.</p> <h2>Options</h2> <p>These options \
  are in the Random Modifiers section of the StratCon General page:</p> <p>- <b>Chance</b> and <b>Maximum Count</b> \
  control random modifiers. A Maximum Count of 0 turns them off. <br>- <b>Allied Facility Modifier Chance</b> and \
  <b>Enemy Facility Modifier Chance</b> set the die rolled for support from elsewhere in the sector (2 by default). \
  0 means never and 1 means always, though your employer's facilities still only answer half the time. <br>- \
  <b>Battle Value Percent</b> sets the size of the forces that modifiers add.</p>
STRATCON_SINGLE_DROP.title=StratCon (Single Drop)
STRATCON_SINGLE_DROP.definition=<a href='GLOSSARY:STRATCON'>StratCon</a> Single Drop is an alternative playstyle for \
  StratCon. Like <a href='GLOSSARY:STRATCON_MAPLESS'>Mapless</a>, it does not use the \
  <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a>. Instead, it generates one scenario each week, \
  balanced against every combat formation in your <a href='GLOSSARY:TOE'>TO&E</a> (except those marked as \
  <a href='GLOSSARY:TRAINING_COMBAT_TEAMS'>Training Combat Teams</a>, Reserve, or Auxiliary).\
  <p>The goal of Single Drop is to better support GMs running large multiplayer campaigns. Standard StratCon creates \
  several scenarios each week, each tuned to a single <a href='GLOSSARY:COMBAT_TEAMS'>Combat Team</a>. In a big group\
  \ this often means teams are too small for everyone to participate. Single Drop fixes that. One weekly scenario. \
  Everyone gets to drop. Everyone gets to fight.</p>\
  <h1>Reinforcements</h1>\
  StratCon only allows one formation to deploy as the primary group (this is a code limitation). Single Drop still \
  follows that rule, so you begin by deploying any single formation as usual. After that, all reinforcements are free, \
  immediate, and always succeed.\
  <p>As of 50.10 you can select multiple reinforcement formations at once. Use Ctrl-click in the reinforcement picker to \
  choose as many as you need.</p>\
  <h1>Prepping to Drop</h1>\
  Because Single Drop balances against your entire TO&E, accuracy matters. Move any formation you do not want included \
  into Reserve. If you forget, you can regenerate the scenario by right-clicking it in the Briefing Room while in GM \
  mode. Before regenerating, make sure every formation has been assigned to the scenario.\
  <h1>Example of Play</h1>\
  Twitch streamer <b>CanopiansOnIce</b> runs a 14-player multiplayer MekHQ campaign. Each player commands a lance, \
  entered in the TO&E as usual.\
  <p>This week only six players are available. Before going live, <b>CanopiansOnIce</b> moves the other eight lances \
  into a dedicated Combat Team marked as Reserve using the <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a> setting. \
  Single Drop will now balance the scenario using only the formations of the players present.</p>\
  <p>Once the stream starts, the scenario appears. <b>CanopiansOnIce</b> prefers to deploy from the Briefing Room \
  (but they could deploy from the TO&E, if they wished). They right-click the scenario, choose Deploy, and select one\
  \ formation as the primary group. The choice does not matter. Then they right-click again, choose Deploy a second time,\
  \ and select the remaining formations. The scenario is ready.</p>\
  <p>From there it is all action. The players carve through the OpFor with their usual precision.</p>\
  <p>After the battle comes the real pressure. Single Drop creates one scenario each week but never at a predictable \
  moment. Sometimes it arrives early. Sometimes it waits. That uncertainty forces players to repair, rearm, and \
  prepare without knowing how long they have.</p>\
  <p>In Single Drop: the next scenario is always coming. Good luck.</p>
STRATCON_SUPPLY_LINES.title=StratCon Supply Lines
STRATCON_SUPPLY_LINES.definition=With the Supply Lines campaign option and the improved sector generator, each side\
  \ in a StratCon sector keeps its <a href='GLOSSARY:STRATCON_FACILITIES'>facilities</a> supplied along supply\
  \ routes, shown on the map as dotted lines: cyan for you and your employer, red for the enemy. You only see the\
  \ parts of a route that run through hexes you have scouted.\
  <p>A side's supply starts from its Supply Depots, Bases of Operations and Space Ports, and from every road that\
  \ leaves the sector. Every facility has one route back to a source. Routes keep to the roads where those serve and\
  \ cross open country where they don't, but never pass through the other side's facilities. A Supply Depot also links\
  \ its side's facilities within 3 hexes straight to itself, road or no road.</p>\
  <p>Routes are laid once and then kept. A new facility is joined to its side's routes by the shortest way there.\
  \ When a facility on a route is taken, or a source is lost, the routes through it are laid again around it if they\
  \ can be. A cut is different: nothing goes around it, so a cut anywhere on a route blocks everything beyond it.\
  \ Winning an Interdict Supply fight cuts an enemy route for four weeks, and an enemy\
  \ <a href='GLOSSARY:STRATCON_SUPPLY_INTERDICTION'>Supply Interdiction</a> blocks one of yours until it is broken up\
  \ or leaves.</p>\
  <p>A facility whose route is blocked, or that has no route at all, is <b>cut off</b>: it is marked on the map,\
  \ cannot be repaired, fortified or reinforced, loses a condition step at the start of each month, and lends no\
  \ synergy. A sector with no roads has no supply lines.</p>\
  <p>If your side has facilities in a sector but no source of supply there at all - no road out of the sector the\
  \ enemy doesn't hold, and no Supply Depot, Base of Operations or Space Port held by you or your employer - every\
  \ one of them is cut off, and you are warned when it happens. Taking the enemy facility that holds a road out, or\
  \ a source facility, restores supply.</p>\
  <p>Select a hex to see whose supply routes run through it.</p>
STRATCON_TIPS.title=StratCon Tips
STRATCON_TIPS.definition=<p>A few habits make <a href='GLOSSARY:STRATCON'>StratCon</a> contracts much easier. \
  Remember, too, that you are your own GM. If something seems wrong, or isn't fun, GM Mode lets you change it.</p> \
  <h2>Pick Your Battles</h2> <p>You are not expected to fight every scenario, let alone win every one. Concentrate \
  on the ones that decide your contract: <a href='GLOSSARY:TURNING_POINTS'>Turning Points</a>, <a \
  href='GLOSSARY:CRISIS_SCENARIO'>Crises</a> and <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential Scenarios</a>. \
  Each scenario you refuse does count as a decisive defeat for enemy morale (see <a \
  href='GLOSSARY:STRATCON_SCENARIOS'>StratCon Scenarios</a>), but there is no shame in letting a hopeless fight go \
  and winning the next one.</p> <h2>Keep Something in Reserve</h2> <p>Keep some <a \
  href='GLOSSARY:EMPLOYER_SUPPORT'>Employer Support</a> in hand, and keep a Combat Team or two in the Maneuver \
  role. When a fight turns out harder than it looked, you can then <a \
  href='GLOSSARY:HOW_TO_REINFORCE'>reinforce</a> it, and that role rolls its Reinforcement Check twice.</p> \
  <h2>Use Your Commanders</h2> <p>The commander of the first Combat Team into a scenario matters:</p> <p>- \
  <b>Leadership</b> lets a Frontline Combat Team bring extra <a href='GLOSSARY:LEADERSHIP_UNITS'>Leadership \
  Units</a>. <br>- <b>Tactics</b> gives a Frontline Combat Team defensive points, spent on infantry, battle armor \
  and minefields (see <a href='GLOSSARY:COMBAT_ROLES'>Combat Roles</a>). <br>- In any role, each level of the \
  commander's Tactics gives one reroll of the battle conditions, such as the map, light and weather. Use them from \
  the scenario's page in the Briefing Room.</p> <p>Train your formation leaders in these skills. Keep some cheaper \
  units, infantry and battle armor in Combat Teams outside Reserve, ready to be brought along.</p> <h2>Hunt Down \
  Enemy Facilities</h2> <p>Enemy <a href='GLOSSARY:STRATCON_FACILITIES'>Facilities</a> lend their forces to fights \
  across their sector, even before you have found them (see <a href='GLOSSARY:STRATCON_SCENARIO_MODIFIERS'>Scenario \
  Modifiers</a>). If the enemy keeps getting reinforcements, scout the sector, then capture or destroy what you \
  find. A facility you capture and hold lends its support to you instead.</p> <h2>Read the Objectives</h2> <p>Many \
  scenarios can be won more than one way, and you seldom need to destroy every enemy unit. Check the objectives \
  before you deploy, and pick units to suit them. If you only need to break through or get away, fast, jumping units \
  or VTOLs will serve you better than heavy firepower. At the end of a fight, be honest about <a \
  href='GLOSSARY:FIELD_CONTROL'>Field Control</a>.</p> <h2>When a Scenario Looks Wrong</h2> <p>If a scenario's enemy \
  force is badly out of proportion, right-click the scenario in the Briefing Room, choose <b>Edit...</b> and press \
  <b>Regenerate Bot Forces</b>. This rolls every bot force again, but keeps the scenario's modifiers. With <a \
  href='GLOSSARY:SEED_FORCES'>Seed Forces</a>, the new forces are sized against the units you have assigned, so \
  assign them first. Otherwise, they are sized against your whole command, as before. Some scenarios are meant to \
  outnumber you and expect you to reinforce, so regenerating them won't help.</p> <h2>Difficulty</h2> <p>If \
  contracts are grinding you down, lower the <b>Difficulty</b>, or the number of random modifiers (see <a \
  href='GLOSSARY:FORCE_GENERATION'>Force Generation</a> and <a href='GLOSSARY:STRATCON_SCENARIO_MODIFIERS'>Scenario \
  Modifiers</a>). Fewer modifiers mean less variety, but fewer nasty surprises.</p>
STRATEGIC_OBJECTIVES.title=Strategic Objectives
STRATEGIC_OBJECTIVES.definition=In <a href='GLOSSARY:STRATCON'>StratCon</a> you will frequently be required to complete\
 \ several Strategic Objectives. This is usually ensuring you end the contract with a positive\
 \ <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory Point (CVP)</a> score, but might also include\
 \ destroying or retaining control of a specific <a href='GLOSSARY:STRATCON_FACILITIES'>Facility</a>. Sometimes there\
 \ are specific, hidden, scenarios that you must find and complete. These are shown as\
 \ <a href='GLOSSARY:ESSENTIAL_SCENARIOS'>Essential Scenarios</a> in the Briefing Room.\
 <p>Your employer may also issue <a href='GLOSSARY:DEPLOYMENT_ORDERS'>Deployment Orders</a>, each of which is a\
 \ Strategic Objective.</p>\
 <p>Failing any Strategic Objective costs you a Perfect Success: even if you meet your CVP target, the recommended\
 \ outcome when completing the contract will be 'Success'. The same is true if you complete no Strategic Objectives\
 \ at all: victory points alone can earn a Success, but not a Perfect Success.</p>
STRIPPING_AND_REPAIRING.title=Stripping & Repairing a Unit
STRIPPING_AND_REPAIRING.definition=For work to be performed on a unit, it needs to be in one of two states: Repair or Strip.\
 <p>While in <b>Repair</b> mode, damaged or destroyed parts may be repaired and replaced.</p>\
 <p>While in <b>Strip</b> mode, your techs will attempt to remove parts from the selected unit.</p>\
 <p><b>Important:</b> always ensure your units are in the right state before ending the day if you are using the\
 \ automated <a href='GLOSSARY:MASS_REPAIR_MASS_SALVAGE'>Mass Repair, Mass Salvage</a> system. Otherwise, you might not\
 \ have a unit left after your techs have swarmed it overnight.</p>
SUPPORT_TEAMS.title=Support Teams
SUPPORT_TEAMS.definition=Support Teams, sometimes called admin squads, organize your technicians, astechs, doctors, \
  medics and administrators into infantry-style units in the <a href='GLOSSARY:TOE'>TO&E</a>, the same way the \
  <a href='GLOSSARY:COMMAND_GENERATOR'>Command Generator</a> files them for a new command. Their duties do not \
  change: a technician seated in a support team still repairs units, and a doctor still treats patients.\
  <p>The option is 'Use Support Teams', found under <i>Human Resources</i> in <b>Campaign Options</b>. It is off by \
  default and can be switched on at any time. Turning it on in a campaign that has loose support staff and no Support \
  Command offers to organize them; decline, and the option switches itself back off. Turning it off later leaves \
  any existing teams alone.</p>\
  <h2>Structure</h2>\
  <p>Teams sit in a Support Command formation under your HQ, split into Maintenance, Medical and Command sections. \
  Each profession fills its own carriers, sized the way your faction organizes infantry: Inner Sphere commands fill \
  platoons of 28 and then squads of 7, while Clan commands fill Points of 25 and then squads of 5. Several carriers \
  of one profession gather into a company or Star named for it, such as 'MekTech Company'. Pooled astechs and \
  medics are not seated, as they are not individual personnel.</p>\
  <h2>Following the Roster</h2>\
  <p>The teams keep pace with your personnel. Hire ten technicians and they take seats; retrain someone out of a \
  support role, or lose them to retirement, capture or death, and the teams re-form. A support formation's echelon \
  is sized by how many squads and platoons it actually holds, so forty clerks read as a company rather than a \
  brigade.</p>\
  <h2>Deployment</h2>\
  <p>Support Teams never <a href='GLOSSARY:HOW_TO_DEPLOY'>deploy</a> to a scenario. The TO&E menu, Deploy Directly, \
  the template dialog and the <a href='GLOSSARY:STRATCON'>StratCon</a> wizard all refuse them, and a formation \
  holding only support teams is not offered at all. Deploying your HQ sends its fighting units and leaves the teams \
  at home, with a report line saying so. Teams mothballed for transit at the start of a contract are restored on \
  arrival.</p>\
  <h2>Turning It Back On</h2>\
  <p>If you declined the offer or switched the option off, tick 'Use Support Teams' again and save. With no Support \
  Command in your TO&E, the offer appears at once. If a Support Command already exists, no offer is needed: loose \
  staff are seated into it the next time the campaign loads or the roster changes.</p>
### T
TALENT.title=Talent
TALENT.definition=<p>Talent measures how quickly a character learns. Every character is given a Talent score from \
  -12 to +12 when they are generated, as part of their \
  <a href='GLOSSARY:RANDOM_PERSONALITIES'>personality</a>. Talent is only shown, and only has any effect, if \
  <b>Assign Random Talent</b> is enabled in Campaign Options (Human Resources, Biography, Backgrounds).</p>\
  <h2>Generation</h2>\
  <p>Talent is rolled on a roughly bell-shaped curve. About three in four characters have a score of 0. Each step \
  away from 0 is rarer than the last, and only around one character in 8,000 reaches either -12 or +12.</p>\
  <h2>XP Costs</h2>\
  <p>If <b>Talent Influences XP Costs</b> is enabled, every point of Talent lowers a character's XP costs by \
  2.5%, and every point below 0 raises them by 2.5%. A score of +12 makes everything 30% cheaper, and a score of \
  -12 makes it 30% more expensive. Scores of -1, 0 and +1 have no effect.</p>\
  <p>This applies to raising skills, natural aptitudes, attributes and Edge, and to buying SPAs that cost XP. It \
  needs Assign Random Talent to be enabled as well.</p>\
  <h2>Other Effects</h2>\
  <p>- <b>Education:</b> Talent modifies academy entrance exams and graduation rolls, and the education new \
  characters start with.\
  <br>- <b>Interview notes:</b> applicants in the <a href='GLOSSARY:PERSONNEL_MARKET'>Personnel Market</a> come \
  with an exam score out of 100, which is based on their Talent with a little random variation.</p>
TARGET_PLANETS.title=Target Planets
TARGET_PLANETS.definition=<p>When MekHQ generates a contract, it first chooses the target system, then the planet in \
  that system where the contract is fought. This entry covers the second step.</p> <h2>Which Planets Can Be \
  Chosen</h2> <p>A contract is only ever placed on a <b>populated planet</b>: one with a recorded population above \
  zero on the date the contract is generated. It must also be a terrestrial planet: terrestrial, dwarf terrestrial or \
  giant terrestrial. Asteroid belts, gas giants and ice giants are never chosen, even if a station or habitat there \
  has a population.</p> <p>If no planet in the system qualifies, the contract goes to the system's <b>primary \
  planet</b> instead, whatever kind of body it is.</p> <h2>Strategic Value</h2> <p>When more than one planet \
  qualifies, the pick is a weighted random draw based on each planet's <b>strategic value</b>, a score from 0 to 22. \
  It adds up to 4 points for each of the following, plus a bonus:</p> <ul> <li><b>Industry</b> and <b>Output</b>: 4 \
  for A, 3 for B, 2 for C, 1 for D, 0 for F.</li> <li><b>Technology</b>: 4 for A or Advanced, 3 for B, 2 for C, 1 for \
  D, 0 for F or Regressed.</li> <li><b>HPG</b>: 4 for A, 3 for B, 2 for C, 1 for D, 0 for X.</li> \
  <li><b>Population</b>: 1 for under a million, 2 for under 100 million, 3 for under a billion, 4 for a billion or \
  more.</li> <li><b>Contested</b>: +2 if more than one faction holds the planet.</li> </ul> <p>Missing data scores \
  0.</p> <h2>How the Contract Type Weights the Draw</h2> <p>The contract's <a href='GLOSSARY:MISSION_TYPES'>mission \
  type</a> decides which way the draw leans:</p> <ul> <li><b>Valuable worlds</b>: Planetary Assault, Relief Duty, \
  Garrison Duty, Retainer, Riot Duty, Security Duty, Assassination, Guerrilla Warfare, and every raid (Diversionary, \
  Extraction, Objective, Observation and Recon). Each planet's weight is 1 + its strategic value.</li> \
  <li><b>Backwaters</b>: Pirate Hunting and Pirate Raid. Raiders hide out on, and prey on, the weakest worlds. Each \
  planet's weight is 1 + (22 &minus; its strategic value).</li> <li><b>No preference</b>: Cadre Duty, Espionage, Mole \
  Hunting, Sabotage and Black-Ops Insurgency. Every planet has the same chance.</li> </ul> <p>Every qualifying planet \
  keeps a weight of at least 1, so the draw leans toward a planet without ever guaranteeing it. For example, in a \
  system with one world of value 20 and another of value 4, a Planetary Assault lands on the first about 81% of the \
  time (21 against 5), while a Pirate Hunting contract lands on the second about 86% of the time (19 against 3).</p> \
  <h2>In the Contract Editor</h2> <p>In <a href='GLOSSARY:GM_MODE'>GM Mode</a>, the contract editor's <b>Target \
  planet</b> field has an <b>Auto</b> option. With it ticked, the planet is drawn by the rules above when you save the \
  contract, so each save can give a different planet. Untick it to choose the planet yourself; a hand-picked planet \
  can be any body in the system.</p> <p>See also <a href='GLOSSARY:CONTRACTS_AND_MISSIONS'>Contracts and \
  Missions</a>.</p>
TECH_SPECIALIZATION.title=Tech Specialization
TECH_SPECIALIZATION.definition=A technician's specialization is a short label that tells you what that tech is best\
 \ used for, without reading through their skills and abilities. It appears in brackets after their\
 \ <a href='GLOSSARY:PROFESSIONS'>profession</a> in the Personnel tab and on their record, for example\
 \ <i>MekTech (Myomer, Engineer)</i>, and as its own line in the Repair Bay and Warehouse technician lists.\
 <p>Only personnel with a technician profession, primary or secondary, have a specialization. Nothing extra is\
 \ stored: it is read from the tech's existing skills and Special Pilot Abilities (SPAs), so it changes whenever those\
 \ do.</p>\
 <h2>Discipline</h2>\
 <p>Alongside their profession skill, technicians have granular tech skills: <i>Tech/Electronic</i>,\
 \ <i>Tech/Nuclear</i>, <i>Tech/Aeronautics</i>, <i>Tech/Mechanical</i>, <i>Tech/Myomer</i>, <i>Tech/Jets</i>,\
 \ <i>Tech/Weapons</i> and <i>Tech/Cybernetics</i>. A tech's discipline is one of these:</p>\
 <p>- If the tech has a <b>Tech Specialist</b> SPA (Electronic, Nuclear, Aeronautics, Mechanical, Myomer, Jets,\
 \ Weapons or Cybernetics), that skill is their discipline. These SPAs give +1 to their own skill and -1 to every\
 \ other granular tech skill, and a tech can only hold one.\
 <br>- Without one, a discipline is picked from skill levels, but only when one granular tech skill is at least\
 \ <b>2 levels</b> above every other granular tech skill the tech has. A tie, or a lead of only 1 level, shows no\
 \ discipline. Only trained levels count; bonuses and modifiers are ignored.</p>\
 <p>No tech has a discipline while <i>Use Global Tech Skills Only</i> is enabled in Campaign Options, as granular\
 \ tech skills are not rolled then.</p>\
 <h2>Focus Abilities</h2>\
 <p>These SPAs are listed after the discipline:</p>\
 <p>- <b>Weapons</b>, <b>Armor</b> and <b>Internal</b>: the Weapon, Armor and Internal Tech Specialist SPAs, -1 to\
 \ repair and maintenance checks on those parts. <i>Weapons</i> is only listed once if it is also the tech's\
 \ discipline.\
 <br>- <b>Engineer</b>: -2 to refit rolls.\
 <br>- <b>Maintainer</b>: -1 to maintenance checks, but +1 to repair rolls.\
 <br>- <b>Fix-it</b>: Mr/Ms Fix-it, ignores the first point of penalty for low quality equipment.</p>\
 <h2>Repair Bay and Warehouse</h2>\
 <p>When you select a job, every tech whose specialization fits it is highlighted as a <i>specialist for this\
 \ job</i>. A specialization fits when the tech's discipline is the skill the job is rolled with, when a Weapons,\
 \ Armor or Internal ability applies to the part, or when the job is a refit and the tech is an Engineer. The\
 \ highlight does not change the order of the list.</p>\
 <h2>Training</h2>\
 <p><a href='GLOSSARY:QUICK_TRAIN'>Quick Train</a> and the Training Console's <b>Auto-train</b> respect a\
 \ discipline: a tech with one only trains their profession skill (such as <i>Tech/Mek</i>) and their discipline\
 \ skill, so a discipline picked from skill levels keeps its lead. A tech without a discipline trains every tech skill\
 \ they have, lowest first, so their skills stay level. Focus abilities on their own, such as Engineer, do not change\
 \ what is trained.</p>\
 <p>To build a discipline from skill levels, train one granular tech skill by hand on the Training Console's\
 \ <b>Skills</b> page, or use Auto-train to train that one skill, until it is 2 levels above the rest. Buying a Tech\
 \ Specialist SPA on the <b>Abilities</b> page sets the discipline at once.</p>
TECH_TIME.title=Technician Available Minutes
TECH_TIME.definition=Each technician only has a limited number of minutes for jobs that may be performed on any given\
 \ day. Normally this is 480 minutes, plus 240 minutes of overtime, whether their technician\
 \ <a href='GLOSSARY:PROFESSIONS'>profession</a> is primary or secondary.\
 <p>In Campaign Options, There's an option for Technicians to use the <i>Administration</i> skill. If enabled, the\
 \ number of minutes each character can spend per day is adjusted depending on their <i>Administration</i> skill:</p>\
 <p>- <b>None</b>: 408 (normal) / 204 (overtime) minutes/day\
 <br>- <b>Ultra-Green</b>: 432 / 216 minutes/day\
 <br>- <b>Green</b>: 456 / 228 minutes/day\
 <br>- <b>Regular</b>: 480 / 240 minutes/day\
 <br>- <b>Veteran</b>: 504 / 252 minutes/day\
 <br>- <b>Elite</b>: 528 / 264 minutes/day\
 <br>- <b>Heroic</b>: 552 / 276 minutes/day\
 <br>- <b>Legendary</b>: 576 / 288 minutes/day</p>
TEMP_CREWS.title=Temporary Crews
TEMP_CREWS.definition=Temporary Crews were added with version 0.50.12. Temporary crews \
can be enabled for most unit types (infantry, tanks, large vessels, etc.). Temporary crews \
allow for the filling of units to their capacity with unnamed personnel. Each unit that \
utilizes temporary crew is still required to have at least one named person (meaning they can be \
found within the personnel tab). \
<p>The option to enable temporary crews can be found in <b>MekHQ Campaign Options</b> under the \
<i>Human Resources</i> tab. This option can be enabled at any time during a campaign. Additionally, \
an option can be enabled to allow the automatic filling of crews with temporary crews at the start \
of every day in <b>MekHQ Client Settings</b> under the <i>New Day Options</i> tab. \
<p><b>How to know how many temporary personnel are being used:</b> At the bottom of the MekHQ screen \
a count of all temporary personnel being used is displayed. For each individual unit in the <i>Hangar</i> \
tab, under <i>Crew Needs</i> the crew assigned and crew required can be seen. When temporary crews are \
used, the number in parentheses indicates the number of permanent members in the unit, and all other \
personnel are considered temporary crew.
TEMP_PERSONNEL.title=Temporary Astechs & Medics
TEMP_PERSONNEL.definition=In MekHQ, we don't expect you to track every Astech and Medic in your campaign. Instead, these\
 \ personnel are abstracted. If you ever need more Astechs or Medics, head to the toolbar, select Marketplace, then\
 \ Temp Pool, then Astech Pool or Medic Pool as appropriate. Be aware that you are limited in how many Astechs or Medics you\
 \ can use. This is depending on how many active Medical and Tech teams you currently maintain, as per <b>Campaign\
 \ Operations</b>.\
 <p>You can tell MekHQ to automatically fill all teams when advancing to each new day. The settings for this (and much\
 \ more) may be found in MekHQ Options.</p>\
 <p>You are not required to use Temporary Personnel. Any permanent personnel will automatically be used instead of\
 \ temporary personnel when available.</p>
TOE.title=The TO&E
TOE.definition=Your Table of Organization and Equipment (TO&E) is a living representation of the military staffing and\
 \ equipment that comprise your unit. There, you arrange your formations into <a href='GLOSSARY:COMBAT_TEAMS'>Combat\
 \ Teams</a> and can get an overview of your available formations.\
 <p>It is important to note that units stored outside the TO&E are not normally considered for things like contract\
 \ pay, or <a href='GLOSSARY:FIELD_KITCHENS'>Field Kitchen</a> availability. For all intents and purposes, MekHQ will\
 \ ignore units stored loose in your hangar. So it may be useful to keep even non-combat units in the TO&E. Those,\
 \ however, should be stored in <a href='GLOSSARY:FORCE_TYPE_SUPPORT'>Support Forces</a> lest they be drawn into combat.
TRAITS.title=Traits
TRAITS.definition=Traits come from <i>A Time of War</i>, where they describe the qualities that set a character apart\
  \ from their skills and attributes: who they know, how much money they have, how famous they are, and whether \
  trouble follows them around.\
  <p>In <i>A Time of War</i> many Traits are handled as Special Pilot Abilities (SPAs) in MekHQ, as that suited the \
  way MekHQ tracks character abilities. The Traits below are the ones MekHQ tracks as Traits in their own right. Each\
  \ has a level, which can be positive, negative, or both depending on the Trait, and most can be raised or lowered by\
  \ spending XP from the character's right-click menu.</p>\
  <p>- <a href='GLOSSARY:BLOODMARK'>Bloodmark</a>: a price on the character's head that draws bounty hunters.\
  <br>- <a href='GLOSSARY:CONNECTIONS'>Connections</a>: contacts that can provide funds and recruits to the \
  campaign's commander.\
  <br>- <a href='GLOSSARY:EXTRA_INCOME'>Extra Income</a>: a monthly income, or expense, from outside the campaign.\
  <br>- <a href='GLOSSARY:FAME'>Fame</a>: how well known the character is, which affects their social skills.\
  <br>- <a href='GLOSSARY:UNLUCKY'>Unlucky</a>: bad luck that reduces the character's Edge.\
  <br>- <a href='GLOSSARY:WEALTH'>Wealth</a>: the character's personal fortune, which the commander can reinvest in \
  the campaign.</p>\
  <p>MekHQ also treats <a href='GLOSSARY:EDGE'>Edge</a> as a Trait, though it is stored as an attribute and has its\
  \ own rules.</p>
TRIAL_OF_POSSESSION.title=Trial of Possession
TRIAL_OF_POSSESSION.definition=A Trial of Possession is fought to take something another Clan holds - equipment, \
  territory, personnel, or a genetic legacy.\
  <p>It is the only way one Clan may gain the right to breed from another's \
  <a href='GLOSSARY:BLOODHOUSE'>Bloodhouse</a>. Clan Wolf took Khan Ian Hawker's legacy from the Diamond Sharks \
  around 3060 this way; the Wolves' Sixteenth Battle Cluster tried and failed to take Star Colonel Kael Pershaw's.</p>\
  <p>Trials may be fought for many legacies at once - Clan Cloud Cobra won all the Crow legacies from the Snow \
  Ravens during the <a href='GLOSSARY:WARS_OF_REAVING'>Wars of Reaving</a> - or for the narrower right to use a \
  legacy as genefather only, which leaves the <a href='GLOSSARY:BLOODNAME'>Bloodname</a> itself exclusive to its \
  owner.</p>
TURNING_POINTS.title=Turning Points
TURNING_POINTS.definition=Turning Points are scenarios of significant strategic importance. The exact reason a scenario\
  \ is designated as a Turning Point is left to your interpretation. It could be a battle over a critical location, an\
  \ engagement with a high-ranking enemy officer, or simply a mission under heightened scrutiny from Allied Command.\
  <p>Whatever your <a href='GLOSSARY:COMMAND_RIGHTS'>Command Rights</a>, there is a 1-in-3 chance that a scenario\
  \ will be considered a Turning Point. Special scenarios, scenarios that are themselves\
  \ <a href='GLOSSARY:STRATEGIC_OBJECTIVES'>Strategic Objectives</a>, and combat challenges never are.</p>\
  <p>Winning a Turning Point scenario grants you 1 <a href='GLOSSARY:CONTRACT_VICTORY_POINTS'>Contract Victory Point\
 \ (CVP)</a>. Losing, however, deducts 1 CVP and may push your score into negative territory, similar to losing a\
  \ <a href='GLOSSARY:CRISIS_SCENARIO'>Crisis</a> scenario.
TRAINING_COMBAT_TEAMS.title=Training Combat Teams
TRAINING_COMBAT_TEAMS.definition=Training <a href='GLOSSARY:COMBAT_TEAMS'>Combat Teams</a> are essential for \
  improving the skills of your personnel and ensuring they remain combat-ready.\
  <p>While deployed to the <a href='GLOSSARY:AREA_OF_OPERATIONS'>Area of Operations</a>, each Monday the commander of\
  \ a formation assigned to the Training <a href='GLOSSARY:COMBAT_ROLES'>Combat Role</a> will attempt to use their \
  <b>Training</b> skill to train the <b>other</b> units in the formation.</p>\
  <p>First, all personnel in the commander's unit pool their skills. Only skills related to the command of the unit \
  the commander is in will be trained. Alongside the unit's best <a href='GLOSSARY:ADVANCED_SCOUTING'>Scouting \
  Skill</a>. For example, a commander in a 'Mek will only train the two 'Mek skills and potentially one Scouting \
  Skill. This is known as the training formation's curriculum.</p>\
  <p><a href='GLOSSARY:INFANTRY_GUNNERY_SKILLS'>Infantry Gunnery Skills</a> work similarly to Scouting Skills in that\
  \ only the best in the command unit will be trained.</p>\
  <p>It is important to note that a trainee can only be trained in a skill while their experience level in it is \
  more than one level below the trainer's. This includes all relevant modifiers, such as SPAs, and injuries.</p>\
  <p>While all personnel in the commander's unit assist in the training exercises, only the commander uses their \
  <b>Training</b> skill to determine the success of the exercises.</p>\
  <p>When training takes place (on each Monday), the commander will perform their Training check, the success of \
  which dictates how much XP each trainee receives in the lowest skill among those featured in the curriculum. \
  Progress is equal to the roll's Margin of Success (minimum 1 XP, maximum 6 XP). Failed Training skill checks result in no XP \
  being taught for that week.</p>\
  <p>All XP earned from Training Formations is pre-spent on the skill being trained. That means if a character \
  learned 5 XP towards the Communications/Any skill, the cost of improving that skill will go down by 5. If a \
  character ends up with sufficient progress to improve their skill to the next level, they will.</p>\
  <p>While a Training Formation is deployed, all of its crew (trainers and trainees) will gain \
  <a href='GLOSSARY:FATIGUE'>Fatigue</a> each week. The amount of Fatigue gained is equal to the Fatigue Rate in \
  campaign options (default 1).</p>\
  <p>Training Formations do not scout. When deployed to the Area of Operations, they reveal only the hex they deploy \
  to, and never make <a href='GLOSSARY:ADVANCED_SCOUTING'>scouting checks</a> for the surrounding hexes.</p>\
  <p>Remember: you can right click on a training formation and specify who commands it. This is useful if the \
  formation commander is of lower rank than one of their trainees.</p>\
  <p><b>Class Sizes:</b> Training Formations receive a penalty if the 'class' size gets too large. This penalty is \
  applied to the Training skill roll. Generally, Inner Sphere training formations consist of a commander and 3 \
  trainees. Clan training formations consist of a commander and 4 trainees. ComStar/Word of Blake training formations\
  \ consist of a commander and 5 trainees. For each trainee over this allowance there is a -1 penalty. Some factions,\
  \ such as the Marians, break this trend which is tracked by MekHQ. There is no differentiation between types of \
  unit. Even for factions that normally field more vehicles in a lance than they would 'Meks. This is largely due to \
  code restrictions.</p>
TRAINING_COSTS.title=Training Costs
TRAINING_COSTS.definition=<p>Training Costs are unofficial rules based on the tables in <i>Hot Spots: Draconis \
  Reach</i>. They are enabled in Campaign Options, on the Personnel General page. When enabled, improving personnel \
  costs C-bills <i>in addition to</i> <a href='GLOSSARY:EXPERIENCE_COSTS'>XP</a>. Training is charged as an \
  education expense.</p>\
  <p><b>Skill Improvements Cost C-Bills</b></p>\
  <p>Improving a skill costs C-bills when it takes the skill into a new experience level. Green and Ultra-Green levels \
  are free. Costs are in <i>Hot Spots</i> Support Points and are always converted to C-bills at \
  10,000 C-bills per Support Point.</p>\
  <table><tr><th>Level</th><th>Support Points</th></tr>\
  <tr><td>Regular</td><td>100</td></tr>\
  <tr><td>Veteran</td><td>200</td></tr>\
  <tr><td>Elite</td><td>700</td></tr>\
  <tr><td>Heroic</td><td>1,200</td></tr>\
  <tr><td>Legendary</td><td>1,200</td></tr></table>\
  <p>Every <a href='GLOSSARY:SKILL_TYPES'>skill</a> is priced as Profession, Utility, or Roleplay. Profession skills \
  are those of the person's primary and secondary <a href='GLOSSARY:PROFESSIONS'>professions</a>. Among skills \
  outside those roles, Combat, Support, and Utility skills are priced as Utility; Roleplay skills are priced as \
  Roleplay. Profession, Utility, and \
  Roleplay skill costs each have \
  their own multiplier (Profession and Utility default 1, Roleplay 0).</p>\
  <p><b>SPA Training Costs C-Bills</b></p>\
  <p>Buying a Special Pilot Ability costs C-bills based on how many SPAs the person already has. Flaws are not \
  counted, but abilities gained at character creation are.</p>\
  <ul><li>1st SPA: 60 Support Points</li><li>2nd SPA: 180 Support Points</li><li>3rd SPA: 360 Support Points</li>\
  <li>4th SPA: 600 Support Points</li><li>5th and later SPAs: 900 Support Points</li></ul>\
  <p>A separate option caps the SPAs that can be bought at 5 per person. SPAs gained by other means ignore the \
  cap.</p>\
  <p><b>Recruitment</b></p>\
  <p>If recruitment costs C-bills and either training cost option is enabled, recruits are priced by their training \
  instead of their salary. A recruit costs the combined price of every experience level their skills have reached if \
  skill training costs C-bills, plus the price of all their SPAs if SPA training costs C-bills. Each part is \
  multiplied by its Recruitment Cost Multiplier, found on the Finances General page: Profession skills (default \
  1.5), Utility skills (default 1), Roleplay skills (default 0, leaving them out), and SPAs (default 1.5). \
  Recruitment ignores the skill improvement multipliers. A Golden Hello still adds its extra cost on top. The \
  hiring hall's cost tooltip shows how a recruit's cost is made up.</p>
TURNOVER_MODIFIERS.title=Turnover Modifiers
TURNOVER_MODIFIERS.definition=<p>A character's <a href='GLOSSARY:TURNOVER'>Turnover</a> target number starts at \
  the <b>Target Number</b> campaign option (default 3) and is changed by the modifiers below. A character leaves \
  if 2d6 rolls lower than their target number, so <b>positive modifiers make leaving more likely</b>.</p>\
  <p>Most modifiers can be turned on or off in Campaign Options (Human Resources, Turnover & Retention, \
  Turnover). The option is named in brackets; modifiers without one always apply. All are on by default.</p>\
  <h2>Service</h2>\
  <p>- <b>Founder:</b> -2\
  <br>- <b>Under contract:</b> characters who have served fewer months than <b>Service Contract Duration</b> \
  (default 36) get minus <b>Service Contract Modifier</b> (default -3)\
  <br>- <b>Officer:</b> -1. A non-officer with the Tactical Genius SPA gets +1 instead.\
  <br>- <b>Recent promotion</b> (Track Time in Rank): -1 if the character's rank changed in the last 6 months\
  <br>- <b>Retention bonus:</b> -2, if paid in the turnover dialog\
  <br>- <b>Custom</b> (Custom): any value you enter in the turnover dialog</p>\
  <h2>The Character</h2>\
  <p>- <b>Desirability</b> (Desirability): characters under 50 who are more skilled are more sought after. \
  Ultra-Green -2, Green -1, Regular 0, Veteran +1, Elite or better +2.\
  <br>- <b>Age</b> (Age): 20 or younger -1. From 50, characters who aren't under contract consider retirement: \
  50-64 +3, 65-74 +4, 75-84 +5, 85-94 +6, 95-104 +7, 105+ +8.\
  <br>- <b>Injuries:</b> +1 for each permanent injury. Prosthetics and implants don't count.\
  <br>- <b>Fatigue</b> (Fatigue Modifiers, and <a href='GLOSSARY:FATIGUE'>Fatigue</a> must be enabled): +1 to +3, \
  depending on Effective Fatigue\
  <br>- <b>Loyalty</b> (Loyalty): +3 to -3; see <a href='GLOSSARY:LOYALTY'>Loyalty</a>\
  <br>- <b>Family</b> (Family): -1 if married to a non-civilian who is still with the campaign, and -1 if they \
  have an adult, non-civilian child still with the campaign. These stack.</p>\
  <h2>Faction</h2>\
  <p>(Faction)</p>\
  <p>- <b>Pirate campaign:</b> +1 for everyone\
  <br>- <b>ComStar or Word of Blake:</b> -2 if both the campaign and the character are from either\
  <br>- <b>Faction loyalty:</b> -1 if the character's origin faction is the campaign's faction. This doesn't \
  apply to Pirate, ComStar, Word of Blake, Clan or Mercenary campaigns.\
  <br>- <b>Pirate origin:</b> +1 in a non-pirate campaign\
  <br>- <b>Mercenary origin:</b> +1\
  <br>- <b>Clan origin:</b> -2\
  <br>- <b>At war:</b> +4 if the character's origin faction is at war with the campaign's faction</p>\
  <h2>The Campaign</h2>\
  <p>- <b><a href='GLOSSARY:HR_STRAIN'>HR Strain</a></b> (Enable HR Strain): +1 for each full multiple of your \
  HR Capacity, or +10 if you have no HR Capacity\
  <br>- <b><a href='GLOSSARY:MANAGEMENT_SKILL'>Management Skill</a></b> (Enable Management Skill): minus the \
  Leadership of the character's commanding officer\
  <br>- <b>Unit Reputation</b> (Unit Reputation): based on your force's average experience level. No \
  experience +2, Ultra-Green +1, Green or Regular 0, Veteran or better -1.\
  <br>- <b>Hostile Territory</b> (Hostile Territory): -2 while you have an active contract. With StratCon \
  enabled, this only counts contracts other than Garrison Duty, Cadre Duty, Security Duty and Riot Duty.\
  <br>- <b>Mission Status</b> (Mission Status): at the end of a contract, Success -1, Partial Success 0, Failure \
  +1, Breach +2\
  <br>- <b>Shares</b> (Enable Shares): minus (the contract's share percentage / 10, minus 2), to a minimum of \
  0</p>
TURNOVER_PAYOUTS.title=Turnover Payouts
TURNOVER_PAYOUTS.definition=<p>Characters who leave through <a href='GLOSSARY:TURNOVER'>Turnover</a> are owed a \
  final payout. The options below are in Campaign Options (Human Resources, Turnover & Retention, Turnover).</p>\
  <h2>Payout Value</h2>\
  <p>A character's payout value is their monthly salary multiplied by a number of months: <b>Officer Rate</b> \
  for officers and <b>Enlisted Rate</b> for everyone else (both default 3). If <b>Enable Service Bonuses</b> is \
  on (default), each full year of service adds <b>Bonus %</b> (default 10%) of a month.</p>\
  <p>What they are actually paid depends on how they leave:</p>\
  <p>- <b>Resigning:</b> the payout value\
  <br>- <b>Retiring (50 or older), medical discharge, or killed:</b> the payout value multiplied by \
  <b>Retirement Multiplier</b> (default 12)\
  <br>- <b>Breaking contract or sacked:</b> nothing</p>\
  <p>If <b>Enable Shares</b> is on, their shares are added to the payout. Payouts are taken from your funds when \
  you close the turnover dialog, and you can't finish if you can't afford them.</p>\
  <h2>Retention Bonuses</h2>\
  <p>In the turnover dialog, you can pay any character a retention bonus to lower their target number by 2. The \
  bonus costs their payout value divided by the number of checks per year: /52 for Weekly, /12 for Monthly, /3 \
  for Quarterly, and in full for Annually. Bonuses are paid when you roll, and you can't roll if you can't afford \
  them.</p>\
  <p>If <b>Automate Retention Bonuses</b> is on, the bonus is ticked by default for every character whose target \
  number is at or above <b>Bonus Threshold</b> (default 3).</p>\
  <h2>Units</h2>\
  <p>If <b>Track Original Unit</b> is on, characters who joined with their own unit take it back when they leave, \
  if it is still in the campaign. With shares enabled, its value comes off their payout.</p>\
  <p>When shares are off, MekWarriors and aerospace pilots who joined with a unit are owed one of the same class. \
  A unit's class is its weight class (ultra-light 0, light 1, medium 2, heavy 3, assault 4, super-heavy 5), +1 if \
  it is Clan and +1 if it is above Introductory tech. A unit that isn't functional counts as half its class, \
  rounded down. If you can't give them their own unit, you can give them another in the turnover dialog. For each \
  class it falls short, or for each class owed if you give nothing, you pay 3,000,000 C-bills. Characters \
  breaking contract waive this.</p>\
  <p>You can also give a unit to a character who isn't owed one. Its value is then taken off their payout, which \
  never goes below 0.</p>
TURNOVER.title=Turnover
TURNOVER.definition=<p>Turnover is how personnel leave your campaign other than by dying: they resign, retire, \
  are medically discharged or defect. It acts as a brake on a campaign's growth, and it also gives you \
  reasons to look after your people.</p>\
  <p>Turnover is enabled with <b>Enable Random Turnover</b> in Campaign Options (Human Resources, Turnover & \
  Retention, Turnover).</p>\
  <h2>When Checks Happen</h2>\
  <p>The <b>Frequency</b> option sets how often turnover is checked: Weekly (each Monday), Monthly (the last day \
  of each month, the default), Quarterly (the last day of March, June, September and December), Annually (31 \
  December) or Never. Checks are only made while your force is on a planet, and never in the first six days of a \
  campaign.</p>\
  <p>When a check is due, advancing the day asks whether you want to open the turnover dialog, advance anyway, or \
  cancel. If <b>Enable End of Contract Turnover</b> is on (default), a check is also made when you complete a \
  contract. You can open the dialog at any time from <b>View</b>, <b>Employee Turnover Dialog</b>.</p>\
  <h2>Who Is Checked</h2>\
  <p>Every active member of the campaign is checked, except:</p>\
  <p>- prisoners and <a href='GLOSSARY:CAMP_FOLLOWERS'>Camp Followers</a>\
  <br>- characters deployed to a scenario\
  <br>- employed civilians, unless <b>Include Employed Civilians</b> is on\
  <br>- Founders under 50, if <b>Enable Founder Turnover</b> is off\
  <br>- infantry soldiers other than their unit's commander, if <b>Sub-Contract Soldiers</b> is on. If the \
  commander leaves, the whole unit leaves with them.</p>\
  <h2>The Roll</h2>\
  <p>Each character has a turnover target number, built from the base <b>Target Number</b> option (default 3) and \
  the <a href='GLOSSARY:TURNOVER_MODIFIERS'>Turnover Modifiers</a>. 2d6 is rolled, and the character leaves if the \
  roll is <b>lower</b> than their target number, so a higher target number is worse. Characters with a target \
  number of 2 or less can't leave and aren't listed.</p>\
  <p>Before rolling, the turnover dialog lets you pay a retention bonus to any character, which lowers their \
  target number by 2. If <b>Custom</b> modifiers are enabled, you can also add your own modifier to each \
  character. See <a href='GLOSSARY:TURNOVER_PAYOUTS'>Turnover Payouts</a> for what bonuses cost.</p>\
  <h2>Outcomes</h2>\
  <p>A character who fails their roll leaves in one of these ways:</p>\
  <p>- <b>Medical discharge:</b> characters with a permanent injury (prosthetics and implants don't count) retire.\
  <br>- <b>Breaking contract:</b> characters still within their service contract resign with no payout. If a \
  contract is active, they instead have a 1 in 20 chance to defect, and otherwise stay.\
  <br>- <b>Retirement:</b> characters aged 50 or older retire.\
  <br>- <b>Resignation:</b> everyone else resigns.</p>\
  <p>Departing characters are paid out; see <a href='GLOSSARY:TURNOVER_PAYOUTS'>Turnover Payouts</a>.</p>\
  <h2>Family</h2>\
  <p>When a character leaves:</p>\
  <p>- Their civilian spouse leaves with them.\
  <br>- Each of their children under 16 has a 50% chance to leave with them if another parent stays. If no \
  parent stays, the child always leaves.\
  <br>- If they have a non-civilian spouse who stays, and they aren't retiring, there is a 1 in 6 chance the \
  couple divorces (always, if they defected). This needs random divorce to be enabled.</p>\
  <p>Related entries: <a href='GLOSSARY:LOYALTY'>Loyalty</a>, <a href='GLOSSARY:FATIGUE'>Fatigue</a>, \
  <a href='GLOSSARY:HR_STRAIN'>HR Strain</a> and <a href='GLOSSARY:MANAGEMENT_SKILL'>Management Skill</a>.</p>
TRANSPORT_ASSIGNMENTS.title=Transport Assignments
TRANSPORT_ASSIGNMENTS.definition=<p>A transport assignment records which of your units carries which: 'Meks in a \
  DropShip's bays, infantry in an APC, or a trailer behind a tractor. When a transport and the units assigned to it \
  are in the same battle, MekHQ asks whether they should deploy loaded (or hitched) in MegaMek.</p>\
  <p>To assign transport, right-click a formation in the TO&amp;E, or units in the TO&amp;E or Hangar. Each kind \
  of transport has its own Assign submenu listing the transports with room to spare, and matching Unassign items \
  undo it.</p>\
  <h2>Kinds of Transport</h2>\
  <p>- <b>Ship Transport</b> is for long-term carriage in bays and docking collars, such as 'Meks aboard a \
  DropShip. The <b>Don't Mothball Units in Bays When Travelling</b> MekHQ option keeps these units active when you \
  travel (see <a href='GLOSSARY:MOTHBALLING'>Mothballing</a>).\
  <br>- <b>Tactical Transport</b> is for short trips into battle. As well as bays, it can use carriers only suited \
  to local travel, such as infantry compartments, battle armor handles and clamp mounts. Use it for infantry riding \
  in an APC, or battle armor riding on an OmniMek.\
  <br>- <b>Assign to a Tractor</b> hitches a trailer to a tractor, the vehicle that pulls it. To build a longer \
  train, select the tractor and all its trailers and choose <b>Connect Train</b>. The tractor must be able to tow \
  the first trailer, every trailer in the middle needs a hitch, and the trailers together can't weigh more than the \
  tractor. <b>Disconnect Train</b> breaks up the whole train.</p>\
  <h2>Transport in StratCon</h2>\
  <p>When a unit is deployed to a StratCon scenario, its transport assignments come with it. That matters most \
  for reinforcements, which arrive at the speed of their slowest unit: units being carried don't count, because they \
  arrive with their transport. A fast transport, such as an aerodyne DropShip, can get slow units into a fight much \
  sooner. See <a href='GLOSSARY:REINFORCEMENT_ARRIVAL'>Reinforcement Arrival</a>.</p>
### U
ULTIMATUMS.title=Ultimatums
ULTIMATUMS.definition=<p>Ultimatums are scripted historical events that force a campaign to pick a side when its \
  faction splits. Turn them on with <b>Enable Ultimatums</b> in Campaign Options (Operations, Systems, Faction \
  Standing). They work without <a href='GLOSSARY:FACTION_STANDING'>Faction Standing</a>, but if it is on, your \
  choice changes your Regard.</p> <p>On the date of an Ultimatum, a campaign belonging to one of the affected \
  factions must choose. You can join one of the sides, or go rogue: become Mercenaries or Pirates, or Mercenaries or \
  Bandit Caste in the Clan Ultimatums.</p> <table><tr><th>Event</th><th>Date</th><th>Affected \
  Factions</th><th>Sides</th><th>Type</th></tr> <tr><td>Amaris Coup</td><td>26 Dec 2766</td><td>Star League, Terran \
  Hegemony</td><td>Terran Hegemony, Star League</td><td>Violent</td></tr> <tr><td>Exodus</td><td>5 Nov \
  2784</td><td>Terran Hegemony, Exodus Fleet, ComStar</td><td>Exodus Fleet, ComStar</td><td>Peaceful</td></tr> \
  <tr><td>Formation of the Clans</td><td>13 Jun 2807</td><td>Exodus Fleet</td><td>Any of the original \
  Clans</td><td>Peaceful, everyone follows</td></tr> <tr><td>Anton's War</td><td>22 May 3014</td><td>Free Worlds \
  League</td><td>Free Worlds League Rebels, Free Worlds League</td><td>Peaceful</td></tr> <tr><td>End of Anton's \
  War</td><td>14 Apr 3015</td><td>Free Worlds League Rebels</td><td>Free Worlds League</td><td>Peaceful</td></tr> \
  <tr><td>Espinosa Coup</td><td>1 Feb 3022</td><td>Aurigan Coalition</td><td>Aurigan Directorate, Aurigan \
  Coalition</td><td>Violent</td></tr> <tr><td>St. Ives Split</td><td>19 Feb 3030</td><td>Capellan \
  Confederation</td><td>St. Ives Compact, Capellan Confederation</td><td>Violent</td></tr> <tr><td>Andurien \
  Crisis</td><td>11 Sep 3030</td><td>Free Worlds League</td><td>Duchy of Andurien, Free Worlds \
  League</td><td>Peaceful</td></tr> <tr><td>Rasalhague Independence</td><td>14 Mar 3034</td><td>Draconis \
  Combine</td><td>Free Rasalhague Republic, Draconis Combine, Ronin</td><td>Peaceful</td></tr> <tr><td>End of the \
  Ronin War</td><td>1 Oct 3034</td><td>Ronin</td><td>Draconis Combine</td><td>Peaceful</td></tr> <tr><td>End of the \
  Andurien Secession</td><td>19 Dec 3039</td><td>Duchy of Andurien</td><td>Duchy of Andurien, Free Worlds \
  League</td><td>Peaceful</td></tr> <tr><td>ComStar Schism</td><td>21 Sep 3052</td><td>ComStar</td><td>Word of \
  Blake, ComStar</td><td>Violent</td></tr> <tr><td>FedCom Civil War</td><td>18 Sep 3057</td><td>Federated \
  Commonwealth</td><td>Lyran Commonwealth, Federated Suns</td><td>Peaceful</td></tr> <tr><td>Clan Wolf \
  Split</td><td>5 Oct 3057</td><td>Clan Wolf</td><td>Clan Wolf-in-Exile, Clan \
  Wolf</td><td>Peaceful</td></tr></table> <h2>Consequences</h2> <p>Your choice is handled like <a \
  href='GLOSSARY:GOING_ROGUE'>Going Rogue</a>, with these differences:</p> <p>- In a violent Ultimatum, choosing a \
  side other than your current faction counts as a defection. In a peaceful one, it never does. <br>- Some \
  Ultimatums are less divisive, making your personnel more likely to follow you: the target for their roll is 2 \
  lower for the end of Anton's War, the end of the Ronin War and the end of the Andurien Secession. <br>- Your \
  second-in-command favors one side. If you choose another, they leave: murdered in a violent Ultimatum, deserting \
  in a peaceful one. <br>- In the Formation of the Clans, everyone follows you, and no one rolls. <br>- If you stay \
  with your current faction, your Regard with it rises to the bottom of the next Standing instead. <br>- If Faction \
  Standing is enabled, your Regard with the faction of every side you didn't choose drops to -50, if it was \
  higher.</p>
UNABLE_TO_START_SCENARIO.title=Unable to Start a Scenario?
UNABLE_TO_START_SCENARIO.definition=If you find yourself unable to start a scenario, double-check a couple of things:\
 <p>- That you have <a href='GLOSSARY:HOW_TO_DEPLOY'>deployed</a> units to the scenario.\
 <br>- That your campaign date matches the scenario date. You cannot fight a past or future scenario. Blame the\
 \ space-time continuum.</p>
UNIT_MARKET.title=Unit Market
UNIT_MARKET.definition=<p>The Unit Market offers a new, random selection of units for sale each month. It is the \
  alternative to buying exactly the unit you want. Turn it on by setting <b>Market Method</b> to Monthly on the Units \
  page of the Markets options. Open it from <b>Marketplace &gt; Unit Market...</b>, the <b>Unit Market</b> button, or \
  the market link in the daily report. While the market is Disabled, the button reads <b>Purchase Units</b> and opens \
  the unit selector instead.</p> <p>Offers come from several markets, such as the Open Market, the Employer Market \
  and the Black Market. Each market has its own sellers, prices and quality. See <a \
  href='GLOSSARY:UNIT_MARKET_TYPES'>Unit Market Types</a>.</p> <h2>Monthly Refresh</h2> <p>On the first day of each \
  month, every unsold offer is removed and a new set is generated. Each market rolls separately for each unit type it \
  sells. The result is how many units of that type it offers:</p> <p><b>1d6 + rarity value - 3 + Unit Rarity \
  Modifier</b></p> <table><tr><th>Rarity</th><th>Value</th><th>Roll</th></tr> <tr><td>Mythic</td><td>-1</td><td>1d6 - \
  4</td></tr> <tr><td>Very Rare</td><td>0</td><td>1d6 - 3</td></tr> <tr><td>Rare</td><td>1</td><td>1d6 - 2</td></tr> \
  <tr><td>Uncommon</td><td>2</td><td>1d6 - 1</td></tr> <tr><td>Common</td><td>3</td><td>1d6</td></tr> <tr><td>Very \
  Common</td><td>4</td><td>1d6 + 1</td></tr> <tr><td>Ubiquitous</td><td>10</td><td>1d6 + 7</td></tr></table> <p>A \
  result of 0 or less means that market offers none of that type this month. The Employer Market also adds your <a \
  href='GLOSSARY:FACTION_STANDING_EFFECTS'>Standing</a> modifier with your employer, if <b>Standing Affects the Unit \
  Market</b> is enabled. If <b>Simulate Gray Monday</b> is enabled, every roll from September 3132 to August 3133 \
  takes a further -4.</p> <p>Each unit is picked from the selling faction's random unit tables for the current year. \
  Its weight class is rolled first. For BattleMeks and most other units, 2d6 gives Light on 2-4, Medium on 5-7, Heavy \
  on 8-9 and Assault on 10+. Aerospace fighters are Light on 2-4, Medium on 5-8 and Heavy on 9+. DropShips use the \
  same split for small, medium and large. If <b>Enable Faction 'Mek Weight Variance</b> is enabled, 'Mek weights use \
  percentage tables instead. The Draconis Combine leans toward light and heavy 'Meks, the Lyran Alliance toward heavy \
  and assault 'Meks, and the Free Worlds League toward medium 'Meks. Every other faction uses 30% Light, 40% Medium, \
  20% Heavy and 10% Assault.</p> <p>Each vehicle that is not from the Civilian Market has a chance to be an artillery \
  vehicle, set by <b>Artillery Vehicle Chance: 1 in</b>. The default is 1 in 30, and 0 turns artillery off.</p> \
  <p>Units are left out if <b>Limit Tech Purchases by Game Year</b> is enabled and they were introduced in the \
  current year or later. They are also left out if <b>Allow Purchase of Clan Tech</b> or <b>Allow Purchase of Inner \
  Sphere Tech</b> forbids their tech base. Campaigns outside the Clans never see Clan units before the Battle of \
  Tukayyid (21 May 3052). When a Small Craft, DropShip or JumpShip appears, the daily report says so. <b>Post Report \
  on Market Refresh</b> also adds a report each time the market refreshes.</p> <h2>Prices</h2> <p>Each offer shows a \
  percentage of the unit's market value. Every market has a base price modifier, which is described in <a \
  href='GLOSSARY:UNIT_MARKET_TYPES'>Unit Market Types</a>. A 2d6 roll then adjusts the modifier:</p> \
  <table><tr><th>2d6</th><th>Adjustment</th></tr> <tr><td>2</td><td>+3</td></tr> <tr><td>3</td><td>+2</td></tr> \
  <tr><td>4-5</td><td>+1</td></tr> <tr><td>6-8</td><td>0</td></tr> <tr><td>9-10</td><td>-1</td></tr> \
  <tr><td>11</td><td>-2</td></tr> <tr><td>12</td><td>-3</td></tr></table> <p>The percentage is <b>100% + 5% per \
  point</b> of the total. For example, an Open Market unit (+1) that rolls an 11 (-2) costs 95% of its value. The \
  price is then multiplied by the Inner Sphere, Clan or Mixed Units multiplier, and by the Acquisition (CamOps) \
  multipliers, from the Price Multipliers page of the Finances options. If <a \
  href='GLOSSARY:ALTERNATE_UNIT_COST'>Alternate Unit Cost</a> applies to the unit, its value comes from Battle Value \
  instead.</p> <h2>Buying Units</h2> <p>Select one or more offers and choose <b>Purchase</b>. The price is deducted \
  from your funds. If you cannot afford an offer, it is skipped and stays on the market. The checkboxes hide or show \
  each kind of unit. Aerospace includes Small Craft, Infantry includes battle armor, and Large Vessels covers \
  DropShips and JumpShips. <b>Show only units at</b> hides offers above the percentage you choose.</p> <p>A unit's \
  delivery time is set when the offer appears: <b>(1d6 + 2d6 + 5) / 4</b>, rounded down. This gives 2 to 5 days, \
  weeks or months, depending on <b>Delivery Scale</b> on the Acquisitions &amp; Deliveries page. Employer Market \
  units arrive at once. So does everything else if <b>Enable Instant Deliveries</b> is on. If <b>Deliver Units \
  Mothballed</b> is on, units that have to be delivered arrive mothballed. Each unit's quality depends on the market \
  it came from.</p> <p><b>Add (GM)</b> adds the selected units for free, with no delivery time. <b>Remove</b> deletes \
  the selected offers from the market.</p>
UNIT_MARKET_TYPES.title=Unit Market Types
UNIT_MARKET_TYPES.definition=<p>The <a href='GLOSSARY:UNIT_MARKET'>Unit Market</a> is made up of several markets. \
  Each market sells certain unit types at certain rarities, uses its own seller faction, and has a base price \
  modifier. Each point of price modifier changes the asking price by 5% of the unit's value, before the monthly price \
  roll. Each market also draws from random unit tables at a set rating, from A (the best equipment) to F. The market \
  sets the unit's quality when it arrives.</p> <h2>Quality</h2> <p>If <b>Random New Unit Quality</b> is off, each \
  market delivers a fixed quality. If it is on, quality is rolled on 2d6 plus the market's modifier, limited to 2-12: \
  A on 2-3, B on 4-5, C on 6-7, D on 8-9, E on 10-11 and F on 12. F is the best quality, unless <b>Reverse Quality \
  Names</b> is on.</p> <table><tr><th>Market</th><th>Fixed</th><th>Random</th></tr> <tr><td>Open, \
  Mercenary</td><td>C</td><td>+0</td></tr> <tr><td>Employer</td><td>B</td><td>-1</td></tr> <tr><td>Factory, \
  Civilian</td><td>F</td><td>always F</td></tr> <tr><td>Black Market</td><td colspan='2'>1d6: A on 1-2, otherwise \
  F</td></tr></table> <h2>Civilian Market</h2> <p>The Civilian Market is always available. It offers brand-new \
  civilian, support and cargo vehicles from your own faction, at Ubiquitous rarity. It uses table rating A, and its \
  price modifier is +2.</p> <h2>Open Market</h2> <p>The Open Market is always available. It sells units from your own \
  faction at table rating F. Its price modifier is +1, but +2 for Small Craft and +4 for DropShips and JumpShips.</p> \
  <table><tr><th>Unit Type</th><th>Rarity</th></tr> <tr><td>BattleMeks</td><td>Uncommon</td></tr> <tr><td>Aerospace \
  Fighters</td><td>Uncommon</td></tr> <tr><td>Vehicles</td><td>Very Common</td></tr> <tr><td>Conventional \
  Fighters</td><td>Common</td></tr> <tr><td>Battle Armor</td><td>Uncommon</td></tr> \
  <tr><td>Infantry</td><td>Ubiquitous</td></tr> <tr><td>Small Craft</td><td>Rare</td></tr> \
  <tr><td>DropShips</td><td>Very Rare</td></tr> <tr><td>JumpShips</td><td>Mythic</td></tr></table> <h2>Employer \
  Market</h2> <p>The Employer Market opens once your first active contract has started. It has two parts, and both \
  add your <a href='GLOSSARY:FACTION_STANDING_EFFECTS'>Standing</a> modifier with the employer if <b>Standing Affects \
  the Unit Market</b> is enabled. Units bought here arrive at once.</p> <p><b>Unwanted units</b> come from your \
  employer, at table rating D, with a price modifier of -1. ComStar and the Word of Blake do not sell these to anyone \
  outside their own faction. <b>Unwanted salvage</b> comes from the contract's enemy, at table rating F, with a price \
  modifier of +2.</p> <table><tr><th>Unit Type</th><th>Unwanted Units</th><th>Unwanted Salvage</th></tr> \
  <tr><td>BattleMeks</td><td>Rare</td><td>Rare</td></tr> <tr><td>Aerospace \
  Fighters</td><td>Rare</td><td>Rare</td></tr> <tr><td>Vehicles</td><td>Common</td><td>Uncommon</td></tr> \
  <tr><td>Conventional Fighters</td><td>Uncommon</td><td>Uncommon</td></tr> <tr><td>Battle \
  Armor</td><td>Rare</td><td>Rare</td></tr> <tr><td>Infantry</td><td>Ubiquitous</td><td>Ubiquitous</td></tr></table> \
  <h2>Mercenary Auction</h2> <p>The Mercenary Auction is where mercenaries trade surplus units through the MRBC or \
  its equivalent in your era. Units come from the Mercenary faction at table rating C. Mercenary campaigns pay a \
  price modifier of -1, and everyone else pays +1. It is not available to Clan campaigns.</p> <table><tr><th>Unit \
  Type</th><th>Rarity</th></tr> <tr><td>BattleMeks</td><td>Uncommon</td></tr> <tr><td>Aerospace \
  Fighters</td><td>Uncommon</td></tr> <tr><td>Vehicles</td><td>Very Common</td></tr> <tr><td>Conventional \
  Fighters</td><td>Uncommon</td></tr> <tr><td>Battle Armor</td><td>Uncommon</td></tr> \
  <tr><td>Infantry</td><td>Ubiquitous</td></tr></table> <h2>Factory Line</h2> <p>The Factory Line sells brand-new \
  units straight off the production line, at table rating A. Its price modifier is +2. It is open only if your \
  command's average experience level is Regular or better. This is the same average that is used for its <a \
  href='GLOSSARY:FORCE_REPUTATION'>Reputation</a>. Each month, the seller is one faction picked at random from those \
  that own your current system. Nothing is offered if that faction is a Clan, or if your campaign is.</p> \
  <table><tr><th>Unit Type</th><th>Rarity</th></tr> <tr><td>BattleMeks</td><td>Rare</td></tr> <tr><td>Aerospace \
  Fighters</td><td>Rare</td></tr> <tr><td>Vehicles</td><td>Common</td></tr> <tr><td>Conventional \
  Fighters</td><td>Uncommon</td></tr> <tr><td>Battle Armor</td><td>Rare</td></tr> \
  <tr><td>Infantry</td><td>Ubiquitous</td></tr></table> <p><b>Clan Factory Line:</b> Clan campaigns have their own \
  Factory Line instead. It opens while you are in a system your Clan owns. It sells your Clan's own units, new and at \
  table rating A, with a price modifier of -4. Small Craft, DropShips and JumpShips have a price modifier of 0. It \
  offers no conventional fighters.</p> <table><tr><th>Unit Type</th><th>Rarity</th></tr> \
  <tr><td>BattleMeks</td><td>Very Common</td></tr> <tr><td>Aerospace Fighters</td><td>Common</td></tr> \
  <tr><td>Vehicles</td><td>Uncommon</td></tr> <tr><td>Battle Armor</td><td>Very Common</td></tr> \
  <tr><td>Infantry</td><td>Ubiquitous</td></tr> <tr><td>Small Craft</td><td>Rare</td></tr> \
  <tr><td>DropShips</td><td>Very Rare</td></tr> <tr><td>JumpShips</td><td>Mythic</td></tr></table> <h2>Black \
  Market</h2> <p>The Black Market sells cheap units with a risk attached. Each month, the seller is one faction \
  picked at random from those that own your current system. If no faction owns the system, a nearby faction is \
  picked. Units come from table rating A, with a price modifier of -8. It is not available to Clan campaigns.</p> \
  <table><tr><th>Unit Type</th><th>Rarity</th></tr> <tr><td>BattleMeks</td><td>Very Rare</td></tr> <tr><td>Aerospace \
  Fighters</td><td>Very Rare</td></tr> <tr><td>Vehicles</td><td>Rare</td></tr> <tr><td>Conventional \
  Fighters</td><td>Rare</td></tr> <tr><td>Battle Armor</td><td>Very Rare</td></tr> \
  <tr><td>Infantry</td><td>Ubiquitous</td></tr></table> <p><b>Swindled!</b> Each Black Market purchase rolls 1d6. On \
  a 1 or 2, no unit is delivered and the offer is gone. On a 1 you lose the full price, and on a 2 you lose half. A \
  unit that does arrive is quality F on a separate 1d6 roll of 3 or more, and quality A otherwise.</p>
UNLUCKY.title=Unlucky
UNLUCKY.definition=Unlucky is a type of <a href='GLOSSARY:TRAITS'>Trait</a> representing a character for whom things just never seem to go right. \
  It ranges from 0 to 5.\
  <p>Each level of Unlucky reduces the character's usable <a href='GLOSSARY:EDGE'>Edge</a> by 1. This affects both the\
  \ amount of Edge the character recovers when their Edge is replenished and the maximum Edge they can hold.</p>\
  <p>If the campaign commander has any levels of Unlucky, the Commander Rating portion of \
  <a href='GLOSSARY:FORCE_REPUTATION'>Force Reputation</a> loses 1 point.</p>\
  <p>Unlucky can be raised or lowered by spending XP from the character's right-click menu.</p>
### V
VEHICLE_CREWS.title=Vehicle & Vessel Crews
VEHICLE_CREWS.definition=All units in MekHQ need to be fully crewed before they may be used. The full rules for crew\
 \ requirements may be found in the <i>Tech Manual</i>.\
 <p>However, if you just need to know how many gunners you need for any specific unit, switch the 'View'\
 \ <a href='GLOSSARY:CHANGING_FILTERS_HANGAR'>filter</a> to 'Status.'</p>\
 <p>You can then hover over the Crew entry for each unit to get a handy tooltip that breaks down the unit is crew\
 \ requirements.</p>\
  <p>Some vehicles have crew requirements outside of drivers and gunners. These 'seats' can be filled by any \
  character with one of the following professions (primary or secondary):</p>\
  <blockquote>- AeroTek\
  <br>- Any admin profession\
  <br>- Astech\
  <br>- Battle Armor Tech\
  <br>- Chef\
  <br>- Comms Operator\
  <br>- Doctor\
  <br>- Mechanic\
  <br>- Medic\
  <br>- MekTech\
  <br>- Soldier\
  <br>- Tech/Communications\
  <br>- Tech/Sensors\
  <br>- Vehicle Crew/Ground\
  <br>- Vehicle Crew/Naval\
  <br>- Vehicle Crew/VTOL</blockquote>\
  <p>It is ultimately left to your discretion to decide what professions you use to fill these seats.</p>\
  <p>Large Vessels, such as DropShips, may also have 'other' crew requirements. These can only be filled by characters \
  with the Vessel Crewmember profession.</p>
VETERANCY_AWARDS.title=Veterancy Awards
VETERANCY_AWARDS.definition=Veterancy Awards give characters a free Special Pilot Ability (SPA) when they first \
  reach <b>Veteran</b>. They represent talents, or flaws, that emerge naturally as a character gains experience. The \
  award is not always positive, and it is not always relevant to the character's \
  <a href='GLOSSARY:PROFESSIONS'>Profession</a>.\
  <h2>Earning a Veterancy Award</h2>\
  <p>When <b>Award Veterancy Awards</b> is enabled, a character receives one random ability the first time they \
  reach <b>Veteran</b> (or better) in their primary profession. Their secondary profession does not count, and \
  injuries are ignored when working out their experience level. Each character can only ever receive one Veterancy \
  Award. Veterancy Awards also require <b>Use Special Pilot Abilities (SPAs)</b> to be enabled.</p>\
  <p>The check is made when a character improves a skill by spending XP (through the Training Console or Quick \
  Train), or through <a href='GLOSSARY:TRAINING_COMBAT_TEAMS'>Combat Team Training</a>. If a character reaches \
  Veteran some other way, such as through <a href='GLOSSARY:EDUCATION'>Education</a> or \
  <a href='GLOSSARY:AGING'>Aging</a>, they will receive their award the next time they improve a skill in one of \
  those ways.</p>\
  <p>Characters recruited at Veteran, or better, are not eligible for a Veterancy Award. The exception is \
  civilians: a civilian who later moves into a non-civilian profession may still earn one.</p>\
  <p>When a character receives a Veterancy Award it is announced in the daily report.</p>\
  <h2>Filter Veterancy Awards</h2>\
  <p>By default a Veterancy Award ignores an ability's prerequisites, so a character can receive an ability they \
  could never purchase. When <b>Filter Veterancy Awards</b> is enabled, characters will only receive abilities they \
  meet the prerequisites for. This makes it more likely the award will be useful for the character's profession.</p>\
  <h2>How Abilities Are Picked</h2>\
  <blockquote>- There is a <b>1-in-40</b> chance the award is a Flaw. Some Flaws can be career ending. If no Flaws \
  are available, the award will always be a positive ability.\
  <br>- Every ability in the chosen group has an equal chance of being picked.\
  <br>- A character will never receive an ability they already have, or one that conflicts with an ability they \
  already have.\
  <br>- Abilities that are normally only given during character creation are never awarded.\
  <br>- Abilities that need a specialization, such as Gunnery Specialist or Weapon Specialist, have their \
  specialization picked at random.\
  <br>- Clan characters cannot receive Melee Specialist or Melee Master if they are from a Homeworld Clan, or if the \
  campaign date is before the end of the Late Republic era.</blockquote>\
  <p>Only abilities enabled in your campaign can be awarded. Veterancy Awards were balanced around Flaws and the \
  <i>A Time of War</i> SPAs being available. If you have disabled either, you may want to leave them off.</p>\
  <h2>Enabling Veterancy Awards Mid-Campaign</h2>\
  <p>If you enable <b>Award Veterancy Awards</b> in a campaign that previously had it disabled, you will be asked \
  whether to update your personnel to account for missed awards. If you confirm, every eligible character who has \
  not left the unit, and who is already Veteran (or better) in their primary profession, will receive a Veterancy \
  Award. Characters recruited at Veteran, or better, are still not eligible. This cannot be undone.</p>\
  <h2>Where to Find These Options</h2>\
  <p>Both Veterancy Award options are found in Campaign Options, under Human Resources, Biography, General, in the \
  'Coming of Age & Veterancy' section. <b>Use Special Pilot Abilities (SPAs)</b> is found under Human Resources, \
  Personnel, General.</p>\
  <p>Characters can also receive a free ability when they turn 16. See \
  <a href='GLOSSARY:COMING_OF_AGE_AWARDS'>Coming of Age Awards</a>.</p>
VOCATIONAL_XP.title=Vocational XP
VOCATIONAL_XP.definition=Vocational XP is enabled by default in the New and Veteran Player presets.\
  <p>Vocational XP represents experience and improvement gained by a character doing their job. Whether that's fighting\
  \ in scenarios, repairing 'Meks, or keeping the warehouse in order. It reflects not just the duties characters perform\
  \ <i>on-screen</i> (that is to say, the things you tell them to do), but also the duties performed <i>off-screen</i>.\
  \ Things like patroling around a facility, filling out necessary paperwork, drilling, P.T., and the infinite array of\
  \ other duties that are not explicitly reflected in MekHQ.</p>\
  <p><b>But Wouldn't A Character Progress Faster by Fighting in a Scenario?</b></p>\
  <p>Any xp a character would have gained from being dispatched to a scenario (or doing a repair, or what have you) is\
  \ already factored into their monthly Vocational XP.\
  <p>However, there is another factor to consider, and the main reason why scenarios do not award XP by default anymore:\
  \ explicitly awarding XP for kills and scenarios merely acts as a 'progress more' feature.\
  <p>Essentially, if a character gains XP from doing well, they will progress faster. You will then use that character\
  \ more often, resulting in them getting more opportunities to gain XP. Which results in them progressing faster and\
  \ being deployed more often. Which results in them progressing even faster, and so on...</p>\
  <p>This creates a situation where favored characters start to 'snowball.' It also punishes you for using characters\
  \ other than your A-team. Because every time you drop with someone other than your A-team, suddenly that's xp not being\
  \ gained elsewhere.</p>\
  <p>Vocational XP attempts to mitigate this problem by flattening XP gain. That not only removes the above issue but\
  \ also allows us to better estimate how long it will take a character to hit certain experience thresholds. This makes\
  \ it much easier for us to gauge whether XP gain needs to be adjusted as we add new things to spend XP on.</p>
### W
WARS_OF_REAVING.title=Wars of Reaving
WARS_OF_REAVING.definition=The Wars of Reaving were a purge that ran through the Homeworld Clans from 3071 to \
  3075, driven by the conviction that the Clans who had invaded the Inner Sphere were tainted.\
  <p>Whole Clans were Absorbed or destroyed and their <a href='GLOSSARY:BLOODHOUSE'>Bloodhouses</a> redistributed, \
  so a great many legacies changed hands. MekHQ withholds a House's post-Reaving fate until the campaign year \
  reaches the point it happened.</p>\
  <p>The upheaval continued afterwards. In 3084 the Council of Six Clans fought Trials that turned several \
  formerly exclusive <a href='GLOSSARY:BLOODNAME'>Bloodnames</a> into shared ones, to bring fresh stock into \
  their eugenics programs.</p>
WEALTH.title=Wealth
WEALTH.definition=Wealth is a type of <a href='GLOSSARY:TRAITS'>Trait</a> that measures a character's personal fortune. It ranges from -1 \
  (destitute) to 10 (fabulously rich).\
  <h2>Monthly Reinvestment</h2>\
  <p>If monthly reinvestment is enabled in Campaign Options, on the first of each month the campaign commander may \
  reinvest part of their personal fortune into the campaign. The commander attempts one major purchase (2d6, 6+), a\
  \ number of moderate purchases equal to their Wealth (2d6, 8+ each), and three times their Wealth in minor purchases\
  \ (2d6, 10+ each). The value of each successful purchase depends on the commander's Wealth, and the total is \
  credited to the campaign.</p>\
  <h2>Extreme Expenditure</h2>\
  <p>Any active character with Wealth above -1 can be asked to make an Extreme Expenditure from their right-click \
  menu. This costs them 1 level of Wealth, and credits the campaign with their Wealth level's major purchase value \
  multiplied by their Willpower. A character that makes an Extreme Expenditure cannot also make a monthly \
  reinvestment that month. Characters who are not founders may suffer a loyalty change as a result.</p>\
  <h2>Gambling</h2>\
  <p>Characters with the Gambling compulsion roll a d6 each week. On a 6 they gain 1 \
  level of Wealth, on a 4 or 5 nothing happens, and on a 1 to 3 they lose 1 level of Wealth.</p>\
  <h2>Force Reputation (CamOps Reputation)</h2>\
  <p>If the campaign commander has Wealth 7 or higher, the Commander Rating portion of \
  <a href='GLOSSARY:FORCE_REPUTATION'>Force Reputation</a> gains 1 point.</p>\
  <p>Wealth can be raised or lowered by spending XP from the character's right-click menu.</p>
WINTER_HOLIDAY.title=Winter Holiday
WINTER_HOLIDAY.definition=Winter Holiday is a canonical Inner Sphere holiday celebrated December 17th to 27th.\
 <p>It was created to be as inclusive as possible, merging aspects from multiple cultures and beliefs. That makes it\
 \ an ideal holiday for multicultural mercenary commands.</p>\
 <p>In later years, the holiday even evolved to include aspects of Clan culture.</p>\
 <p>For more information, please see <b>Shrapnel #7</b>.</p>
