deploymentWizard.guide.glossary=In the Glossary
# Primary page guide
deploymentWizard.guide.primary.button=How deployment works
deploymentWizard.guide.primary.title=Choosing the primary force
deploymentWizard.guide.primary.step.1.title=Know the four pages
deploymentWizard.guide.primary.step.1.text=Primary picks the force that leads the deployment. Reinforce adds more \
  forces, Auxiliaries adds single units on the commander's Leadership, and Utility spends their Tactics. The other \
  pages unlock once a primary force is staged.
deploymentWizard.guide.primary.step.2.title=Browse the board
deploymentWizard.guide.primary.step.2.text=The board lists every force that can deploy here. Search by name, or use \
  Role to show only forces of one combat role, such as Patrol.
deploymentWizard.guide.primary.step.3.title=Read the dossier
deploymentWizard.guide.primary.step.3.text=Click a force to see its battle value, readiness, crews, movement and \
  condition, along with the deployment hex and the conditions there. Check for damaged units and tired crews before \
  you send them.
deploymentWizard.guide.primary.step.4.title=Stage one primary force
deploymentWizard.guide.primary.step.4.text=Use Stage. Only one force can be the primary: staging another replaces it, \
  and any others go in as reinforcements. Changing the primary also clears any auxiliary and utility units you picked.
deploymentWizard.guide.primary.step.5.title=Choose off-board artillery
deploymentWizard.guide.primary.step.5.text=A force with artillery shows Deploy off-board. Ticked, its artillery units \
  start off the map edge; the rest of the force deploys as normal.
deploymentWizard.guide.primary.step.6.title=Check the staged tray
deploymentWizard.guide.primary.step.6.text=Everything you've staged gathers in the tray, grouped by page. Forces marked \
  Deployed were committed earlier and are locked; reset the scenario to change them. Select a staged force and use \
  Unstage to take it back.
deploymentWizard.guide.primary.step.7.title=Commit
deploymentWizard.guide.primary.step.7.text=Commit deploys everything staged on every page in one go. It can't be undone, \
  so you're asked to confirm. Cancel closes the wizard without deploying anything.
deploymentWizard.guide.primary.example.1.who=You
deploymentWizard.guide.primary.example.1.text=A scenario has appeared next to my Bravo Lance. I right-click it and open \
  the deployment wizard.
deploymentWizard.guide.primary.example.2.who=Dossier
deploymentWizard.guide.primary.example.2.text=Bravo Lance: Frontline, BV 5,400, four units, substantially operational. \
  Light rain over woods.
deploymentWizard.guide.primary.example.3.who=You
deploymentWizard.guide.primary.example.3.text=I stage Bravo Lance as the primary force. Its commander has Leadership, so \
  next I'll look at Auxiliaries.
deploymentWizard.guide.primary.term.1.name=Primary force
deploymentWizard.guide.primary.term.1.text=The force that leads the deployment. The enemy is sized against it, and its \
  commander's skills set the Auxiliaries and Utility budgets.
deploymentWizard.guide.primary.term.2.name=Staged
deploymentWizard.guide.primary.term.2.text=Picked for this deployment but not yet committed. Staged picks are kept as you \
  move between pages.
deploymentWizard.guide.primary.term.3.name=Deployed
deploymentWizard.guide.primary.term.3.text=Already committed to the scenario. Locked in the tray until the scenario is \
  reset.
deploymentWizard.guide.primary.term.4.name=Battle value (BV)
deploymentWizard.guide.primary.term.4.text=A measure of a unit's combat strength. A force's BV is the total of its units'.
deploymentWizard.guide.primary.term.5.name=Combat role
deploymentWizard.guide.primary.term.5.text=A combat team's standing orders, such as Frontline, Patrol or Maneuver. Roles \
  change which scenarios a team meets and how it reinforces.
deploymentWizard.guide.primary.term.6.name=Off-board
deploymentWizard.guide.primary.term.6.text=Starting beyond the map edge. Only artillery can deploy this way; it fires \
  onto the map from there.
# Reinforce page guide
deploymentWizard.guide.reinforce.button=How reinforcing works
deploymentWizard.guide.reinforce.title=Sending reinforcements
deploymentWizard.guide.reinforce.step.1.title=Pick who comes to help
deploymentWizard.guide.reinforce.step.1.text=The board lists every force that can reinforce this scenario. Stage as many \
  as you like; each one is rolled for separately.
deploymentWizard.guide.reinforce.step.2.title=Read the odds
deploymentWizard.guide.reinforce.step.2.text=The dossier shows the force's eligibility, the reinforcement roll it needs on \
  2d6, its chance of success, what it costs in Employer Support, and the turn it should arrive on.
deploymentWizard.guide.reinforce.step.3.title=Know what changes the roll
deploymentWizard.guide.reinforce.step.3.text=Some combat roles, such as Maneuver, roll twice and keep the better \
  result. A force already on this track arrives without rolling. Your command administrator and the contract also move the target number.
deploymentWizard.guide.reinforce.step.4.title=Know when they arrive
deploymentWizard.guide.reinforce.step.4.text=A force arrives later the slower its slowest unit is. The primary commander's \
  Strategy skill brings it in sooner.
deploymentWizard.guide.reinforce.step.5.title=Pay when you commit
deploymentWizard.guide.reinforce.step.5.text=On Commit you choose what to spend. Each force costs 1 Employer Support, or 2 \
  to arrive at once, and spending more improves the odds. The dialog shows the final target number before you roll.
deploymentWizard.guide.reinforce.step.6.title=Plan for a failed roll
deploymentWizard.guide.reinforce.step.6.text=A force that fails may arrive late, not arrive at all, or be intercepted on \
  the way, which can start a fight of its own.
deploymentWizard.guide.reinforce.step.7.title=Mind any batchall
deploymentWizard.guide.reinforce.step.7.text=Against Clans, if you accepted a batchall, reinforcing breaks its terms. \
  You're warned first and can back out. Official challenges can't be reinforced at all.
deploymentWizard.guide.reinforce.example.1.who=You
deploymentWizard.guide.reinforce.example.1.text=The enemy has more than I expected. I stage Charlie Lance, on Maneuver, \
  to reinforce Bravo.
deploymentWizard.guide.reinforce.example.2.who=Dossier
deploymentWizard.guide.reinforce.example.2.text=Reinforcement roll: 8+ on 2d6. Success odds: 66%. Support-point cost per \
  force: 1. Average arrival: turn 4.
deploymentWizard.guide.reinforce.example.3.who=You
deploymentWizard.guide.reinforce.example.3.text=I commit, and spend an extra point of Employer Support to bring the target \
  number down.
deploymentWizard.guide.reinforce.term.1.name=Reinforcement roll
deploymentWizard.guide.reinforce.term.1.text=A 2d6 roll the force must meet or beat to arrive as planned. A natural 2 \
  always fails.
deploymentWizard.guide.reinforce.term.2.name=Employer Support
deploymentWizard.guide.reinforce.term.2.text=The contract's pool of support points, spent to send reinforcements and to \
  improve their odds.
deploymentWizard.guide.reinforce.term.3.name=Eligibility
deploymentWizard.guide.reinforce.term.3.text=How a force can reinforce: by a regular roll, by an improved roll for some \
  combat roles, or automatically when it's already on this track.
deploymentWizard.guide.reinforce.term.4.name=Arrival turn
deploymentWizard.guide.reinforce.term.4.text=The turn a reinforcement is expected to reach the map. Instant reinforcements \
  start with the battle.
deploymentWizard.guide.reinforce.term.5.name=Intercepted
deploymentWizard.guide.reinforce.term.5.text=Caught by the enemy on the way. The force doesn't reach the scenario, and may \
  have to fight where it was caught.
deploymentWizard.guide.reinforce.term.6.name=Batchall
deploymentWizard.guide.reinforce.term.6.text=A Clan challenge setting the forces each side brings. Reinforcing breaks it.
# Auxiliaries page guide
deploymentWizard.guide.auxiliaries.button=How auxiliaries work
deploymentWizard.guide.auxiliaries.title=Adding auxiliary units
deploymentWizard.guide.auxiliaries.step.1.title=Know where the budget comes from
deploymentWizard.guide.auxiliaries.step.1.text=When the primary force is on a Frontline assignment, its commander's \
  Leadership can draw in extra units: 500 BV for each level of Leadership, up to level 5. Official challenges have no \
  budget.
deploymentWizard.guide.auxiliaries.step.2.title=Pick single units
deploymentWizard.guide.auxiliaries.step.2.text=The board lists individual units, not whole forces, that fit the budget. \
  Units in a staged force aren't offered again, since they already deploy with it.
deploymentWizard.guide.auxiliaries.step.3.title=Watch the budget
deploymentWizard.guide.auxiliaries.step.3.text=Leadership BV remaining shows what's left. A unit that doesn't fit can't be \
  staged, and Commit stays locked if the plan is over budget.
deploymentWizard.guide.auxiliaries.step.4.title=Stage and commit
deploymentWizard.guide.auxiliaries.step.4.text=Use Stage for each unit you want. They join the scenario alongside the \
  primary force when you commit. Changing the primary force clears them.
deploymentWizard.guide.auxiliaries.example.1.who=You
deploymentWizard.guide.auxiliaries.example.1.text=Bravo Lance's commander has Leadership 2, so I have 1,000 BV to spend.
deploymentWizard.guide.auxiliaries.example.2.who=Budget
deploymentWizard.guide.auxiliaries.example.2.text=Leadership BV remaining: 1000.
deploymentWizard.guide.auxiliaries.example.3.who=You
deploymentWizard.guide.auxiliaries.example.3.text=I stage a 640 BV hover tank from my reserve. 360 BV is left, too little \
  for anything else I have.
deploymentWizard.guide.auxiliaries.term.1.name=Auxiliary unit
deploymentWizard.guide.auxiliaries.term.1.text=A single unit drawn into the scenario on the primary commander's Leadership, \
  rather than as part of a deployed force.
deploymentWizard.guide.auxiliaries.term.2.name=Leadership budget
deploymentWizard.guide.auxiliaries.term.2.text=500 BV per level of the primary commander's Leadership, up to level 5. Only \
  a unit's own BV counts, not its crew's skill.
deploymentWizard.guide.auxiliaries.term.3.name=Frontline
deploymentWizard.guide.auxiliaries.term.3.text=The combat role that holds the line. Only a Frontline primary force can \
  bring auxiliary or utility units.
# Utility page guide
deploymentWizard.guide.utility.button=How utility works
deploymentWizard.guide.utility.title=Adding utility units and minefields
deploymentWizard.guide.utility.step.1.title=Know where the points come from
deploymentWizard.guide.utility.step.1.text=When the primary force is on a Frontline assignment, its commander's Tactics \
  gives two points for each level. Official challenges have none.
deploymentWizard.guide.utility.step.2.title=Spend points on units
deploymentWizard.guide.utility.step.2.text=Each utility unit you stage costs one point. Units in a staged force aren't \
  offered again, since they already deploy with it.
deploymentWizard.guide.utility.step.3.title=Or keep them as minefields
deploymentWizard.guide.utility.step.3.text=Every point you don't spend becomes a minefield you can place at the start of \
  the scenario. Tactics points remaining shows what's left.
deploymentWizard.guide.utility.step.4.title=Stage and commit
deploymentWizard.guide.utility.step.4.text=Use Stage for each unit you want, then Commit. Changing the primary force \
  clears them.
deploymentWizard.guide.utility.example.1.who=You
deploymentWizard.guide.utility.example.1.text=Bravo Lance's commander has Tactics 2, so I have 4 points.
deploymentWizard.guide.utility.example.2.who=You
deploymentWizard.guide.utility.example.2.text=I stage one APC to carry infantry forward. The other 3 points become \
  minefields across the approach.
deploymentWizard.guide.utility.example.3.who=Budget
deploymentWizard.guide.utility.example.3.text=Tactics points remaining: 3.
deploymentWizard.guide.utility.term.1.name=Utility unit
deploymentWizard.guide.utility.term.1.text=A single unit added on the primary commander's Tactics, at one point each.
deploymentWizard.guide.utility.term.2.name=Tactics points
deploymentWizard.guide.utility.term.2.text=Two per level of the primary commander's Tactics, spent on utility units or \
  kept as minefields.
deploymentWizard.guide.utility.term.3.name=Minefield
deploymentWizard.guide.utility.term.3.text=A field of mines you place at the start of the scenario, one per unspent \
  Tactics point.
