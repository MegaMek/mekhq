### Employer Support Negotiation
supportPoints.maximum={0}: your administrators were unable to generate additional <b>Employer Support</b> \
  as you have reached (or exceeded) the {1}<b>maximum of {2}</b>{3}.
supportPoints.initial={0}: using their <i>Administration</i> skill, your administrators have generated \
  {1}<b>{2}</b>{3} starting <b>Employer Support</b>. This contract has a soft-cap of <b>{4}</b>.
supportPoints.noAdministrators={0}: your administrators were unable to generate <b>Employer Support</b> as you have \
  {1}<b>no active administrators</b>{2}. This contract has a soft-cap of <b>{3}</b>.
supportPoints.biweekly={0}: using their <i>Administration</i> skill, your administrators have generated \
  {1}<b>{2}</b>{3} bi-weekly <b>Employer Support</b>. This contract has a soft-cap of <b>{4}</b>.
batchallBreach.ic=%s, if we deploy reinforcements, we will be in breach of the previously agreed Batchall. Our enemy \
  will not forget this.
batchallBreach.ooc=If you deploy your reinforcements, you will be treated as if you declined the Batchall for the rest\
  \ of the contract. If you have Faction Standings enabled, this betrayal will be logged.</p>\
  <p>You may use the GM reinforcement options to deploy without a penalty.</p>
batchallBreach.button.continue=(Continue) Follow my orders.
batchallBreach.button.cancel=(Cancel) On second thoughts...
officialChallenge.notice=The terms of the combat challenge prohibit the deployment of reinforcements.
### StratCon (Area of Operations) Tab
stratConTab.contractSelector.label=Contract:
stratConTab.gmTools.title=GM Tools
stratConTab.scoutSector.text=Scout Sector
stratConTab.scoutSector.tooltip=Reveals every hex in the currently selected sector, as if fully scouted.
stratConTab.resetSectorFog.text=Reset Sector Fog
stratConTab.resetSectorFog.tooltip=Un-reveals every hex in the currently selected sector (open water stays visible), so scouting can be re-tested.
stratConTab.regenerateSector.text=Regenerate Sector
