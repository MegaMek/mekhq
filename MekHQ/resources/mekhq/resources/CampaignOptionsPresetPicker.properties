CampaignOptionsPresetPicker.eyebrow.startup=New Campaign
CampaignOptionsPresetPicker.eyebrow.load=Campaign Options
CampaignOptionsPresetPicker.heading=Choose a Preset
CampaignOptionsPresetPicker.subtitle.startup=Presets are ready-made rule sets. You can change any option later in Campaign Options.
CampaignOptionsPresetPicker.subtitle.load=Loading a preset replaces the options you're editing. Nothing is saved until you press OK.
# Details
CampaignOptionsPresetPicker.detail.systemsOn=Switched on
CampaignOptionsPresetPicker.detail.systemsOff=Switched off
CampaignOptionsPresetPicker.detail.systemsNote=These are the major systems. Every other option is in Campaign Options.
CampaignOptionsPresetPicker.detail.loadFailed=This preset couldn't be loaded. It may be missing or from an older version.
# Footer
CampaignOptionsPresetPicker.summary.none=Pick a preset to continue.
CampaignOptionsPresetPicker.summary.startup=Starts with <b>{0}</b>. Next, you set the essentials, such as the start date and faction. Customize shows every option instead.
CampaignOptionsPresetPicker.summary.load=Loads <b>{0}</b> into the options you''re editing. Nothing is saved until you press OK.
CampaignOptionsPresetPicker.button.cancel=Cancel
CampaignOptionsPresetPicker.button.customize=Customize
CampaignOptionsPresetPicker.button.customize.toolTipText=Opens every campaign option, with this preset loaded, before the campaign starts.
CampaignOptionsPresetPicker.button.choose=Choose a Preset
CampaignOptionsPresetPicker.button.start=Start with {0}
CampaignOptionsPresetPicker.button.load=Load {0}
CampaignOptionsPresetPicker.loadFailed.title=Unable to Load Preset
