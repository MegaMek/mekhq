# Guide
CampaignOptionsPresetPicker.guide.open=How presets work
CampaignOptionsPresetPicker.guide.alwaysOpen=Show every time I start a campaign
CampaignOptionsPresetPicker.guide.eyebrow=New Campaign
CampaignOptionsPresetPicker.guide.title=Choosing a preset
CampaignOptionsPresetPicker.guide.step.1.title=Pick a preset
CampaignOptionsPresetPicker.guide.step.1.text=Each preset is a full set of campaign rules. Read the descriptions on the right; the tags show who each one suits.
CampaignOptionsPresetPicker.guide.step.2.title=Start or customize
CampaignOptionsPresetPicker.guide.step.2.text=Start asks only for the essentials, such as the start date and faction. Customize shows every option first.
CampaignOptionsPresetPicker.guide.step.3.title=Adjust as you play
CampaignOptionsPresetPicker.guide.step.3.text=Every option stays available in Campaign Options, so nothing you pick here is permanent.
CampaignOptionsPresetPicker.guide.presetsIntro=Presets are tuned and balanced by the MekHQ team with each release. Starting from one is the quickest way into a campaign that plays well.
CampaignOptionsPresetPicker.guide.preset.1.who=Running a tabletop game
CampaignOptionsPresetPicker.guide.preset.1.text=Campaign Operations follows the rulebook; you roll for anything MekHQ doesn't cover.
CampaignOptionsPresetPicker.guide.preset.2.who=Building your own rules
CampaignOptionsPresetPicker.guide.preset.2.text=Tabula Rasa turns everything off, so you can switch on only what you want.
CampaignOptionsPresetPicker.guide.question.1.name=Which preset should I pick?
CampaignOptionsPresetPicker.guide.question.1.text=If you're new to MekHQ, New Players Start Here. Otherwise, Veteran Experience is the full game.
CampaignOptionsPresetPicker.guide.question.2.name=Can I change options later?
CampaignOptionsPresetPicker.guide.question.2.text=Yes. Campaign Options can change any option, or load a different preset, at any time.
CampaignOptionsPresetPicker.guide.question.3.name=Can I save my own preset?
CampaignOptionsPresetPicker.guide.question.3.text=Yes. Save one from Campaign Options, and it appears here under Your presets.
