# Bloodname tab - the Clan counterpart to Genealogy, shown only for Clan personnel. Descent among the
# Clans runs through a Bloodname House rather than a family.
pnlBloodname.title=Bloodhouse
# The first section holds what the warrior personally carries; the second describes the House behind
# it, and is titled with the House's own name.
pnlBloodnameHeritage.title=Heritage
pnlBloodnameDetails.title=House {0}
# The headline of the tab. A warrior who holds the name is addressed by it; one who does not is told
# which name is theirs to win, since the name a trueborn may compete for is the House that bred them.
lblBloodnameHeritage.tooltip=A Bloodname is the surname of one of the 800 genetic legacies the Clans were founded on, and the highest honour a Clan warrior can hold. A trueborn is bred from one House and may compete for that House's name alone, in a Trial of Bloodright; most never win one and carry only a given name.
lblBloodnameHeritage.bloodnamed={0} of House {1}
lblBloodnameHeritage.eligible=Eligible for a House {0} Bloodname
lblBloodnameHeritage.unrecorded=No Bloodhouse on record for this warrior
lblBloodnameHeritage.freeborn=Freeborn - not bred from a Bloodhouse
lblBloodnameFounder.text=Founder:
lblBloodnameFounder.tooltip=The warrior whose genetic legacy the House was founded on. Each of the 800 original Bloodnames was named for one of Nicholas Kerensky's Clan warriors, and every trueborn of the House descends from them.
lblBloodnameFounder.value={0} {1}
lblBloodnameOriginClan.text=Origin Clan:
lblBloodnameOriginClan.tooltip=The Clan the House was founded in. A legacy can move between Clans through absorption, sharing, or a Trial of Possession, so this is not always the Clan that holds it today.
# The phenotype the House breeds for, which is not necessarily the warrior's own.
lblBloodnameHousePhenotype.text=House Phenotype:
lblBloodnameHousePhenotype.tooltip=The phenotype this House breeds for. It is not necessarily the warrior's own - a House known for MechWarriors still produces the occasional Elemental.
lblBloodnameStanding.text=Standing:
lblBloodnameStanding.tooltip=Whether the Bloodname is still awarded, and on what terms. A name may be exclusive to one Clan, limited in how many may hold it, restricted after its Clan was abjured, or no longer granted at all.
bloodnameStanding.active=Actively granted
bloodnameStanding.inactive=No longer granted
bloodnameStanding.abjured=Held only by its own Clan following abjuration
bloodnameStanding.exclusive=Exclusive to its origin Clan
bloodnameStanding.limited=Limited
lblBloodnameHistory.text=House History:
lblBloodnameHistory.tooltip=What the House has done and been known for. Not yet written for most Houses.
# Placeholder until the house histories are collected. Filling these in should be a data change.
lblBloodnameHistory.placeholder=No history has been recorded for this House yet.
lblPhenotype.text=Phenotype:
lblPhenotype.tooltip=Whether this warrior was bred for a role, and which. Trueborns are grown in iron wombs and tailored to a specific machine - MechWarrior, Elemental, Aerospace, ProtoMek. Freeborns are born naturally and carry no phenotype.
# Shown when a warrior carries a Bloodname that another Clan holds exclusively. Capturing a warrior
# does not transfer their legacy, so the name stays with the Clan that bred it.
lblBloodnameIsorla.text=Isorla:
lblBloodnameIsorla.tooltip=This warrior carries a Bloodname belonging to a Clan other than the one they serve, which means they themselves were taken - as isorla, the spoils of a Trial, or as a bondsman later raised back to warrior. They keep the right to compete for their own name.
lblBloodnameIsorla.value=Taken from {0}
lblBloodnameExclusivity.text=Exclusivity:
lblBloodnameExclusivity.tooltip=Taking a warrior does not take their legacy. The Clan that bred the name keeps the sole right to breed from it, no matter whose ranks its holders end up in. Acquiring the legacy itself requires winning a Trial of Possession for it.
lblBloodnameExclusivity.value=The legacy remains with {0}. Adopting a warrior grants no right to \
  breed from it; that takes a Trial of Possession.
# Whether this warrior's DNA is drawn on to produce sibkos, and in which role. Neither role follows
# from the warrior's own sex.
lblGeneticLegacyRole.text=Breeding Program:
lblGeneticLegacyRole.tooltip=Whether this warrior's DNA is being used to produce sibkos, and in which role. A genefather's DNA goes into the sperm and a genemother's into the egg; neither follows from the warrior's own sex. Only Bloodnamed warriors are eligible, and most are never drawn on.
# Captions beneath the Clan emblems. The origin emblem is shown only when the Bloodname came from a
# different Clan than the one the warrior serves.
lblServingClan.text=Serving
# The House's own one-line description, taken from the source material.
lblBloodnameSummary.text=Legacy:
lblBloodnameSummary.tooltip=What this House is known for, taken from the source material.
# Warriors recorded as having held this Bloodname. Capped, with the remainder counted.
lblBloodnameHolders.text=Notable Holders:
lblBloodnameHolders.tooltip=Warriors recorded as having carried this Bloodname. Long lists are capped and the remainder counted.
lblBloodnameHolders.more=... and {0} more
# What became of the legacy. Each is withheld until the campaign year reaches the date it happened,
# so a campaign does not read about events still in its future.
lblBloodnamePostReaving.text=After the Reaving:
lblBloodnamePostReaving.tooltip=Which Clans hold the legacy following the Wars of Reaving, the purge that ran through the Homeworld Clans from 3071 to 3075 and redistributed many Bloodnames.
lblBloodnameAbsorbed.text=Absorbed By:
lblBloodnameAbsorbed.tooltip=The Clan that took this legacy when the Clan holding it was Absorbed. An absorbing Clan inherits the Bloodnames of the Clan it takes in.
lblBloodnameAcquired.text=Acquired By:
lblBloodnameAcquired.tooltip=A Clan that won the right to this legacy, normally through a Trial of Possession fought for the genetic material itself.
lblBloodnameShared.text=Shared With:
lblBloodnameShared.tooltip=Clans permitted to breed from this legacy alongside its owner, either by agreement or by Trial. Sharing may be limited to use as a genefather, which leaves the Bloodname itself exclusive.
lblBloodnameTransfer.value={0} ({1})
