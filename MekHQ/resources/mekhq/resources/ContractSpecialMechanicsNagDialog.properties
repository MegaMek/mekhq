# These briefings are the only tutorial the player gets for the "Contracts Use Special Mechanics" rules. Keep them in
# step with StratConContractMechanics, StratConEscalation, StratConReconnaissance, the point of interest behaviors, and
# the point of interest definitions (mm-data/data/stratconpointsofinterest).
# Buttons
ContractSpecialMechanicsNagDialog.button.acknowledge=Understood.
ContractSpecialMechanicsNagDialog.button.suppress=Understood. I don''t need this briefing for {0} contracts in future.
# Shared
ContractSpecialMechanicsNagDialog.escalation=<p><b>Escalation</b></p>\
  <p>This contract tracks Escalation: how hard the enemy is pushing back. It starts at 0, can reach 100 per point of \
  the contract''s scale, and never falls. It rises when you:\
  <br>- Deploy a formation to an empty hex (one with no scenario, facility, or point of interest) and no scenario \
  results: +1.\
  <br>- Win a scenario: +1d6.\
  <br>- Fight at a hostile facility: +2d6 (stacks with winning a scenario).</p>\
  <p>At each <a href=''GLOSSARY:MORALE''>morale</a> check, a die with as many sides as the maximum Escalation is \
  rolled. If the roll is equal or lower than the current Escalation, the enemy''s morale rises by one level, on top \
  of whatever the check itself did. You can follow Escalation on the StratCon tab.</p>
ContractSpecialMechanicsNagDialog.footer=<p>This briefing appears when you accept a contract of this type while \
  the <i>Contracts Use Special Mechanics</i> campaign option is enabled. If you suppress it, only this contract \
  type''s briefing is hidden; you can re-enable it in MekHQ Client Options, under Contract Briefings.</p>
# Espionage
ContractSpecialMechanicsNagDialog.ESPIONAGE=<p><b>Data Caches</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Data Caches \
  appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>Strategic Objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Data Cache, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the cache is recovered. Its objective is met, and you earn the contract''s combat bonus.\
  <br>- <b>Scenario:</b> you must fight a Recon Evasion scenario over the cache. An overall victory recovers it, as \
  above. Anything else (defeat, draw, or fleet in being) loses the cache, failing its objective.</p>\
  <p>A cache not recovered before it expires is lost, failing its objective.</p>
# Guerrilla Warfare
ContractSpecialMechanicsNagDialog.GUERRILLA_WARFARE=<p><b>Vulnerable Infrastructure</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Vulnerable \
  Infrastructure appears on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>. It is hidden until scouted, and never \
  expires.</p>\
  <p>When any formation deploys onto Vulnerable Infrastructure, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the infrastructure is destroyed. Its objective is met, and you earn the contract''s combat \
  bonus.\
  <br>- <b>Scenario:</b> it was a trap, and the formation is ambushed in a \
  <a href=''GLOSSARY:CRISIS_SCENARIO''>Crisis</a> scenario. The trap is spent whatever the result: the \
  infrastructure is removed, and its objective is withdrawn - neither met nor failed.</p>
# Mole Hunting
ContractSpecialMechanicsNagDialog.MOLE_HUNTING=<p><b>Potential Leads</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Potential Leads \
  appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Potential Lead, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the lead is a dud. It is removed, and its objective is withdrawn - neither met nor failed.\
  <br>- <b>Scenario:</b> the lead has panned out, and you must fight a Mole Hunt scenario. An overall victory meets \
  its objective and earns the contract''s combat bonus. Anything else - a defeat, a draw, or leaving the scenario \
  unplayed - fails its objective.</p>\
  <p>A lead not followed up before it expires goes cold, failing its objective.</p>
# Assassination
ContractSpecialMechanicsNagDialog.ASSASSINATION=<p><b>Assassination Targets</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Assassination \
  Targets appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>One per point of the contract''s scale is the real target (or every one, if there are fewer). The rest are \
  body doubles. They all look alike, so you cannot tell which is which.</p>\
  <p>When any formation deploys onto an Assassination Target, there is no roll: you must always fight an Assassination scenario - even \
  if the enemy is routed.\
  <br>- <b>Real target:</b> an overall victory meets its objective and earns the contract''s combat bonus. Anything \
  else - a defeat, a draw, or leaving the scenario unplayed - lets the target escape, failing its objective.\
  <br>- <b>Body double:</b> revealed only once the scenario ends. Its objective is withdrawn whatever the result - \
  neither met nor failed. An overall victory still earns the combat bonus; anything else earns nothing.</p>\
  <p>An Assassination Target of either kind not struck before it expires fails its objective.</p>
# Observation Raid
ContractSpecialMechanicsNagDialog.OBSERVATION_RAID=<p><b>Lookout Points</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Lookout Points \
  appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Lookout Point, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the observation is made. Its objective is met, and you earn the contract''s combat bonus.\
  <br>- <b>Scenario:</b> the formation is ambushed in a <a href=''GLOSSARY:CRISIS_SCENARIO''>Crisis</a> scenario. \
  The Lookout Point is compromised whatever the result: it is removed, and its objective is withdrawn - neither met \
  nor failed.</p>\
  <p>A Lookout Point not used before it expires fails its objective.</p>
# Relief Duty
ContractSpecialMechanicsNagDialog.RELIEF_DUTY=<p><b>Beleaguered Forces</b></p>\
  <p>This contract keeps its <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Alongside them, \
  Beleaguered Forces appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts only 1 to 3 days after it \
  appears.</p>\
  <p>When any formation deploys onto Beleaguered Forces, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the forces are relieved, and their objective is met.\
  <br>- <b>Scenario:</b> you must fight a Relief Column scenario to reach them. An overall victory relieves them. \
  Anything else - a defeat, a draw, or leaving the scenario unplayed - leaves them to be overrun, failing their \
  objective.</p>\
  <p>Beleaguered Forces not relieved before they expire are overrun, failing their objective.</p>\
  <p>Relieving them earns no combat bonus; your Essential scenarios still earn it.</p>
# Cadre Duty
ContractSpecialMechanicsNagDialog.CADRE_DUTY=<p><b>Training Maneuvers</b></p>\
  <p>This contract keeps its <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Alongside them, \
  Training Maneuvers appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto Training Maneuvers, they are completed at once. No scenario is rolled for at \
  all. Their objective is met, and, if chassis familiarity is in use, the deploying combat team gains familiarity \
  with its units.</p>\
  <p>Training Maneuvers not held before they expire fail their objective.</p>\
  <p>Completing them earns no combat bonus; your Essential scenarios still earn it.</p>
# Diversionary Raid
ContractSpecialMechanicsNagDialog.DIVERSIONARY_RAID=<p><b>High Profile Targets</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, its \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a> is to raise Escalation (see below) to 50 per \
  point of the contract''s scale before the contract ends.</p>\
  <p>High Profile Targets appear on the map over the course of the contract. They are not strategic objectives \
  themselves. Each lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a High Profile Target, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the target is struck. Escalation rises by 3d6, and you earn the contract''s combat bonus.\
  <br>- <b>Scenario:</b> the enemy was waiting, and the formation is ambushed in a Decoy Engagement scenario, a \
  <a href=''GLOSSARY:CRISIS_SCENARIO''>Crisis</a>. The target is spent whatever the result, and is removed.</p>\
  <p>A High Profile Target not struck before it expires is simply gone.</p>
# Extraction Raid
ContractSpecialMechanicsNagDialog.EXTRACTION_RAID=<p><b>VIPs</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, VIPs appear on \
  the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a VIP, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the VIP is extracted. Their objective is met, and you earn the contract''s combat bonus.\
  <br>- <b>Scenario:</b> you must fight a Breakout scenario to get them out. An overall victory extracts them, as \
  above. Anything else - a defeat, a draw, or leaving the scenario unplayed - loses them, failing their \
  objective.</p>\
  <p>A VIP not extracted before they expire is lost, failing their objective.</p>
# Planetary Assault
ContractSpecialMechanicsNagDialog.PLANETARY_ASSAULT=<p><b>Strategic Positions</b></p>\
  <p>This contract keeps its <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Alongside them, \
  Strategic Positions appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Strategic Position, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the position is captured, and its objective is met.\
  <br>- <b>Scenario:</b> you must fight a Pivotal Engagement scenario for it. An overall victory captures it. \
  Anything else - a defeat, a draw, or leaving the scenario unplayed - loses it, failing its objective.</p>\
  <p>A Strategic Position not taken before it expires is lost, failing its objective.</p>\
  <p>Capturing one earns no combat bonus; your Essential scenarios still earn it.</p>
# Retainer
ContractSpecialMechanicsNagDialog.RETAINER=<p><b>Scheduled Parades</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Scheduled \
  Parades appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Scheduled Parade, StratCon rolls for a scenario, as it does for any deployment \
  - but here the roll is made even if the enemy is routed, as civil unrest does not answer to the enemy''s morale:\
  <br>- <b>No scenario:</b> the parade is held. Its objective is met, and you earn the contract''s combat bonus.\
  <br>- <b>Scenario:</b> a riot breaks out, and the formation must deal with it in a Crowd Control scenario. The \
  parade is called off whatever the result: it is removed, and its objective is withdrawn - neither met nor \
  failed.</p>\
  <p>A Scheduled Parade not held before it expires fails its objective.</p>\
  <p>On this contract, the outcome of a riot does not affect the enemy''s \
  <a href=''GLOSSARY:MORALE''>morale</a>.</p>
# Riot Duty
ContractSpecialMechanicsNagDialog.RIOT_DUTY=<p><b>Civil Disobedience</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Civil \
  Disobedience appears on the map over the course of the contract. Each outbreak is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto Civil Disobedience, StratCon rolls for a scenario, as it does for any deployment \
  - but here the roll is made even if the enemy is routed, as civil unrest does not answer to the enemy''s morale:\
  <br>- <b>No scenario:</b> the disobedience is defused. Its objective is met, and you earn the contract''s combat \
  bonus.\
  <br>- <b>Scenario:</b> it has become a riot, and you must fight a Crowd Control scenario. An overall victory puts it \
  down, as above. Anything else - a defeat, a draw, or leaving the scenario unplayed - fails its objective.</p>\
  <p>Civil Disobedience not dealt with before it expires fails its objective.</p>\
  <p>On this contract, winning or losing a riot moves the enemy''s <a href=''GLOSSARY:MORALE''>morale</a> \
  directly.</p>
# Sabotage
ContractSpecialMechanicsNagDialog.SABOTAGE=<p><b>Sabotage Targets</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Sabotage Targets \
  appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>. It is hidden until scouted, and lasts 1 to 6 \
  days after it appears.</p>\
  <p>When any formation deploys onto a Sabotage Target, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the target is sabotaged quietly. Its objective is met, you earn the contract''s combat \
  bonus, and Escalation rises by 3d6.\
  <br>- <b>Scenario:</b> the saboteurs are caught in the act, and must fight a Covert Strike scenario. An overall \
  victory still sabotages the target: its objective is met, and you earn the combat bonus. Anything else - a defeat, \
  a draw, or leaving the scenario unplayed - fails its objective. Being caught raises Escalation by 2d6 whatever the \
  result, on top of the usual +1d6 for winning.</p>\
  <p>A Sabotage Target not sabotaged before it expires fails its objective.</p>
# Terrorism
ContractSpecialMechanicsNagDialog.TERRORISM=<p><b>Civilian Infrastructure</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Civilian \
  Infrastructure appears on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>. It is hidden until scouted, and never \
  expires.</p>\
  <p>When any formation deploys onto Civilian Infrastructure, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the infrastructure is destroyed. Its objective is met, you earn the contract''s combat \
  bonus, and Escalation rises by 3d6.\
  <br>- <b>Scenario:</b> its defenders ambush the formation in a <a href=''GLOSSARY:CRISIS_SCENARIO''>Crisis</a> \
  scenario. An overall victory still destroys the infrastructure: its objective is met, you earn the combat bonus, \
  and Escalation rises by 2d6, on top of the usual +1d6 for winning. Anything else - a defeat, a draw, or leaving the \
  scenario unplayed - fails its objective.</p>
# Security Duty
ContractSpecialMechanicsNagDialog.SECURITY_DUTY=<p><b>Security Reviews</b></p>\
  <p>This contract keeps its <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Alongside them, \
  Security Reviews appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Security Review, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the review is passed, and its objective is met.\
  <br>- <b>Scenario:</b> you must fight an Engagement scenario against the enemy forces probing the site. An overall \
  victory passes the review. Anything else - a defeat, a draw, or leaving the scenario unplayed - fails its \
  objective.</p>\
  <p>A Security Review not carried out before it expires fails its objective.</p>\
  <p>Passing one earns no combat bonus; your Essential scenarios still earn it.</p>
# Pirate Raid
ContractSpecialMechanicsNagDialog.PIRATE_RAID=<p><b>Plunder Targets</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Plunder Targets \
  appear on the map over the course of the contract. Each is a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a>, and lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Plunder Target, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the target is plundered. Its objective is met, you earn the contract''s combat bonus (only \
  a covert raid, secretly bankrolled by a hidden sponsor, has one), the loot arrives as a small Resupply, and \
  Escalation rises by 3d6.\
  <br>- <b>Scenario:</b> the formation is ambushed in a <a href=''GLOSSARY:CRISIS_SCENARIO''>Crisis</a> scenario. The \
  target is spent whatever the result: there is no loot, the target is removed, and its objective is withdrawn - \
  neither met nor failed.</p>\
  <p>A Plunder Target not raided before it expires fails its objective.</p>
# Objective Raid
ContractSpecialMechanicsNagDialog.OBJECTIVE_RAID=<p><b>Target Intelligence</b></p>\
  <p>This contract has no <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Target \
  Intelligence appears on the map over the course of the contract. It is not a \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a> itself. It is hidden until scouted, and never \
  expires.</p>\
  <p>One piece of Target Intelligence per point of the contract''s scale (or every piece, if there are fewer) leads to \
  an enemy facility. When any formation deploys onto it, there is no roll: a hostile facility is revealed elsewhere in \
  the same sector, and destroying it becomes a strategic objective. If the sector has no room for another facility, \
  nothing comes of it.</p>\
  <p>When any formation deploys onto any other Target Intelligence, StratCon rolls for a scenario, as it does for any \
  deployment:\
  <br>- <b>No scenario:</b> the intelligence proves worthless, and is removed.\
  <br>- <b>Scenario:</b> the enemy was waiting, and the formation is ambushed in a \
  <a href=''GLOSSARY:CRISIS_SCENARIO''>Crisis</a> scenario. The intelligence is spent whatever the result, and is \
  removed.</p>\
  <p>Target Intelligence itself earns no combat bonus.</p>
# Garrison Duty
ContractSpecialMechanicsNagDialog.GARRISON_DUTY=<p><b>Escalation (Unrest)</b></p>\
  <p>This contract keeps its <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. It also tracks \
  Escalation, which here is the unrest your garrison must calm. It starts at its maximum of 100 per point of the \
  contract''s scale, and only ever falls. It falls when you:\
  <br>- Deploy a formation to an empty hex (one with no scenario, facility, or point of interest) and no scenario \
  results: -1.\
  <br>- Win any scenario: -1d6.\
  <br>- Make a Show of Force (see below): -3d6.</p>\
  <p>At each <a href=''GLOSSARY:MORALE''>morale</a> check, a die with as many sides as the maximum Escalation is \
  rolled. If the roll is no higher than the current Escalation, the enemy''s morale rises by one level, on top of \
  whatever the check itself did. You can follow Escalation on the StratCon tab.</p>\
  <p><b>Shows of Force</b></p>\
  <p>Shows of Force appear on the map over the course of the contract. They are not \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objectives</a>. Each lasts 1 to 6 days after it appears.</p>\
  <p>When any formation deploys onto a Show of Force, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the show of force goes off without a hitch, and Escalation falls by 3d6.\
  <br>- <b>Scenario:</b> the enemy uses the spectacle as cover, and the formation is ambushed in a \
  <a href=''GLOSSARY:CRISIS_SCENARIO''>Crisis</a> scenario. The Show of Force is spent whatever the result, calms \
  nothing, and is removed.</p>\
  <p>Shows of Force earn no combat bonus; your Essential scenarios still earn it.</p>
# Pirate Hunting
ContractSpecialMechanicsNagDialog.PIRATE_HUNTING=<p><b>Pirate Captains</b></p>\
  <p>This contract has no scheduled <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Instead, Pirate \
  Captains appear on the map over the course of the contract. They are not \
  <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objectives</a> themselves. Each lasts 1 to 6 days after it \
  appears.</p>\
  <p>When any formation deploys onto a Pirate Captain, StratCon rolls for a scenario, as it does for any deployment:\
  <br>- <b>No scenario:</b> the captain has already slipped away. The Pirate Captain is removed, with nothing gained or \
  lost.\
  <br>- <b>Scenario:</b> the captain stands and fights in a Decapitation Strike scenario. This scenario is an \
  Essential scenario, and a strategic objective. An overall victory meets its objective and earns the contract''s \
  combat bonus. Anything else - a defeat, a draw, or leaving the scenario unplayed - fails its objective.</p>\
  <p>A Pirate Captain not run down before it expires has moved on, with nothing lost.</p>
# Recon Raid
ContractSpecialMechanicsNagDialog.RECON_RAID=<p><b>Reconnaissance</b></p>\
  <p>This contract keeps its <a href=''GLOSSARY:ESSENTIAL_SCENARIOS''>Essential scenarios</a>. Alongside them, each \
  sector has a <a href=''GLOSSARY:STRATEGIC_OBJECTIVES''>strategic objective</a> to scout at least half of its land \
  hexes (every hex that is not ocean) before the contract ends.</p>\
  <p>Any land hex you can see counts, however it was revealed: by deploying or scouting, by a facility that reveals \
  the sector, or by a GM. Once a sector''s objective is met, it stays met. You can follow each sector''s progress on \
  the StratCon tab.</p>
