# EmployerLostPlanetNagDialog
# {0} = commander address, {1} = employer, {2} = planet, {3} = new owner
EmployerLostPlanetNagDialog.ic={0}, I''ll be blunt. {1} has lost {2}. By tomorrow {3} will hold the\
  \ planet, and every allied formation still able to move is falling back to the evacuation points.\
  <br><br>You have a place on the lift if you want it. But nobody will be left to fight {3} on the\
  \ ground, so if you would rather stay and lead the resistance, we will back you however we can.\
  \ Choose now. The last ships leave at dawn.
# {0} = contract name, {1} = planet
EmployerLostPlanetNagDialog.ooc=Your employer loses control of <b>{1}</b> tomorrow. This is a strategic\
  \ collapse elsewhere, not a failure of your unit.\
  <br><br>Whichever you choose, any scenarios still active on <b>{0}</b> are resolved as Decisive Defeats.\
  <br><br><b>Join the Evacuation:</b> the contract ends the next day, as with a rout. It is recorded as a partial\
  \ success: not a breach, but no remaining pay is paid.\
  <br><br><b>Lead the Resistance:</b> the contract becomes a new Guerrilla Warfare contract against the\
  \ planet''s new owner, starting tomorrow. Its terms, length and pay are rolled again, command rights become\
  \ Liaison (unless you already have Independent command), and the employer can no longer transport you.\
  \ You keep the StratCon map, but every allied facility falls to the enemy, and enemy morale starts at\
  \ Advancing. The contract gains the Career Maker characteristic, doubling the reputation you gain if it\
  \ succeeds.\
  <br><br>Cancel to stop advancing the day and decide later.
EmployerLostPlanetNagDialog.unknownOwner=the enemy
EmployerLostPlanetNagDialog.button.cancel=Cancel Advance Day
EmployerLostPlanetNagDialog.button.cancel.tooltip=Stop advancing the day and decide later.
EmployerLostPlanetNagDialog.button.evacuate=Join the Evacuation
EmployerLostPlanetNagDialog.button.evacuate.tooltip=The contract ends tomorrow as a partial success, with no\
  \ remaining pay.
EmployerLostPlanetNagDialog.button.resist=Lead the Resistance
EmployerLostPlanetNagDialog.button.resist.tooltip=The contract becomes a new Guerrilla Warfare contract against\
  \ the planet''s new owner.

# EmployerLostPlanet
# {0} = contract, {1} = number of scenarios
scenariosLost.report=With the planet lost, {1,choice,1#the scenario|1<all {1} scenarios} still active on {0}\
  \ {1,choice,1#was|1<were} resolved as {1,choice,1#a Decisive Defeat|1<Decisive Defeats}.
# {0} = contract, {1} = planet
evacuation.report=Your unit has joined the evacuation of {1}. {0} ends tomorrow.
# {0} = contract, {1} = planet, {2} = enemy
resistance.report=Your unit has stayed behind on {1} to lead the resistance against {2}. {0} is now a Guerrilla\
  \ Warfare contract.
# {0} = contract, {1} = planet
cancelled.report={0} has been cancelled: your employer lost control of {1} before your unit arrived.
# {0} = contract name, {1} = planet, {2} = employer
cancelled.notice={2} has lost control of {1} before your unit could arrive, so <b>{0}</b> has been\
  \ cancelled.<br><br>This was not your unit''s failure. The contract is recorded as a partial success, and no\
  \ remaining pay is paid. Complete it from the Briefing Room.
