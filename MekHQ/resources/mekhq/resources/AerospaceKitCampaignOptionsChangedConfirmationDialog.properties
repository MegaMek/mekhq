AerospaceKitCampaignOptionsChangedConfirmationDialog.description=<h1 style="text-align:center">Aerospace Pilot Kits</h1>\
  You have just enabled <b>Require Aerospace Pilot Kit to Deploy Fighters</b> in a campaign that previously had it \
  disabled.\
  <p>From now on, an aerospace fighter may not deploy to a scenario unless every crew member wears the Aerospace \
  Fighter Pilot Kit, which carries their neurohelmet. Conventional fighters are not affected.</p>\
  <p>Would you like to equip all of your aerospace pilots with the kit now, so your fighters are not immediately \
  grounded? The kits are granted free of charge.</p>
AerospaceKitCampaignOptionsChangedConfirmationDialog.cancel=Decline
AerospaceKitCampaignOptionsChangedConfirmationDialog.confirm=Accept
